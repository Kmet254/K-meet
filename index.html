<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kmeet - Find Your Connection</title>

    <base target="_self">

    <!-- Kmeet Logo -->
    <link
        rel="icon"
        type="image/jpeg"
        href="assets/kmeet-logo.jfif.jfif"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<section class="header">

    <!-- =========================================
         TOP NAVIGATION
    ========================================== -->

    <nav class="main-nav">

        <div class="brand">

            <a
                href="index.html"
                class="brand-link"
                aria-label="Kmeet Home"
            >

                <span class="brand-heart">
                    <i class="fa-solid fa-heart"></i>
                </span>

                <span>
                    Kmeet your heart's true echo.
                </span>

            </a>

        </div>


        <!-- INTERESTED BUTTON -->

        <a
            href="#signup"
            class="interested-btn"
        >

            <i class="fa-solid fa-heart"></i>

            <span>
                Interested?
            </span>

        </a>


        <!-- RIGHT NAVIGATION -->

        <div class="nav-links">

            <ul>

                <li>
                    <a href="discover.html">
                        DISCOVER
                    </a>
                </li>

                <li id="navProfileLink">
                    <a href="login.html">
                        LOG IN
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- =========================================
         HERO
    ========================================== -->

    <div
        class="hero-content"
        id="heroCard"
    >

        <!-- =====================================
             GUEST STATE
        ====================================== -->

        <div id="guestState">

            <h1>
                KMEET YOUR HEARTS TRUE<br>
                ECHO
            </h1>


            <p>
                Find a connection built for intentional,<br>
                romantic courtship
            </p>


            <p>
                A sanctuary for intentional courtship
            </p>


            <!-- SIGNUP FORM -->

            <form
                id="signupForm"
                class="auth-form"
            >

                <div class="input-group">

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                        autocomplete="email"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Account
                </button>

            </form>


            <!-- LOGIN -->

            <div class="login-option">

                <span>
                    Already have an account?
                </span>

                <a
                    href="login.html"
                    class="btn-link"
                >
                    Log In
                </a>

            </div>

        </div>


        <!-- =====================================
             LOGGED-IN USER STATE
        ====================================== -->

        <div
            id="userState"
            style="display:none;"
        >

            <div class="home-profile-preview">

                <!-- USER PHOTO -->

                <img
                    id="homeUserAvatar"
                    src=""
                    alt="Profile Photo"
                    class="home-avatar"
                >


                <!-- USER NAME -->

                <h2 id="homeUserName">
                    Welcome Back
                </h2>


                <!-- USER EMAIL -->

                <p
                    id="homeUserEmail"
                    class="home-email"
                ></p>


                <!-- INTERESTS -->

                <div
                    class="home-interests-tags"
                    id="homeInterests"
                ></div>


                <!-- PROFILE ACTIONS -->

                <div class="home-profile-actions">

                    <a
                        href="discover.html"
                        class="btn btn-primary"
                    >
                        <i class="fa-solid fa-compass"></i>
                        Discover People
                    </a>


                    <a
                        href="profile.html"
                        class="btn btn-primary"
                    >
                        View Full Profile
                    </a>


                    <button
                        id="homeLogoutBtn"
                        class="btn-link-logout"
                        type="button"
                    >
                        Log Out
                    </button>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================================
     MAIN JAVASCRIPT
========================================== -->

<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        /* =====================================
           DOM ELEMENTS
        ====================================== */

        const guestState =
            document.getElementById(
                'guestState'
            );

        const userState =
            document.getElementById(
                'userState'
            );

        const navProfileLink =
            document.getElementById(
                'navProfileLink'
            );


        /* =====================================
           LOCAL STORAGE
        ====================================== */

        const savedEmail =
            localStorage.getItem(
                'userEmail'
            );

        const savedAvatar =
            localStorage.getItem(
                'userAvatar'
            );


        let savedInterests = [];


        try {

            savedInterests =
                JSON.parse(
                    localStorage.getItem(
                        'userInterests'
                    )
                ) || [];

        } catch (error) {

            savedInterests = [];

        }


        /* =====================================
           NO LOGGED-IN USER
           
           Remove stale profile information
           left behind by a previous account.
        ====================================== */

        if (!savedEmail) {

            localStorage.removeItem(
                'userAvatar'
            );

            localStorage.removeItem(
                'userInterests'
            );

            guestState.style.display =
                'block';

            userState.style.display =
                'none';

        }


        /* =====================================
           LOGGED-IN USER
        ====================================== */

        if (savedEmail) {

            guestState.style.display =
                'none';

            userState.style.display =
                'block';


            navProfileLink.innerHTML =
                '<a href="profile.html">MY PROFILE</a>';


            /* =================================
               EMAIL
            ================================= */

            document
                .getElementById(
                    'homeUserEmail'
                )
                .textContent =
                savedEmail;


            /* =================================
               USERNAME
            ================================= */

            const username =
                savedEmail.split('@')[0];


            document
                .getElementById(
                    'homeUserName'
                )
                .textContent =
                username
                    .charAt(0)
                    .toUpperCase() +
                username.slice(1);


            /* =================================
               USER AVATAR
            ================================= */

            const avatarElement =
                document.getElementById(
                    'homeUserAvatar'
                );


            if (savedAvatar) {

                avatarElement.src =
                    savedAvatar;

            } else {

                /*
                 * No saved picture.
                 * Do not use another user's
                 * old picture.
                 */

                avatarElement.removeAttribute(
                    'src'
                );

                avatarElement.alt =
                    'No profile photo';

            }


            /* =================================
               USER INTERESTS
            ================================= */

            const interestsContainer =
                document.getElementById(
                    'homeInterests'
                );


            interestsContainer.innerHTML =
                '';


            if (
                savedInterests.length > 0
            ) {

                interestsContainer.innerHTML =
                    savedInterests
                        .slice(0, 4)
                        .map(
                            function (item) {

                                return `
                                    <span class="home-tag">
                                        ${item}
                                    </span>
                                `;

                            }
                        )
                        .join('');

            }

        }


        /* =====================================
           INTERESTED BUTTON
        ====================================== */

        const interestedButton =
            document.querySelector(
                '.interested-btn'
            );


        if (interestedButton) {

            interestedButton.addEventListener(
                'click',
                function () {

                    const emailInput =
                        document.querySelector(
                            '#signupForm input[type="email"]'
                        );


                    if (emailInput) {

                        setTimeout(
                            function () {

                                emailInput.focus();

                            },
                            150
                        );

                    }

                }
            );

        }


        /* =====================================
           SIGNUP FORM
        ====================================== */

        const signupForm =
            document.getElementById(
                'signupForm'
            );


        if (signupForm) {

            signupForm.addEventListener(
                'submit',
                function (e) {

                    e.preventDefault();


                    const emailInput =
                        this.querySelector(
                            'input[type="email"]'
                        );


                    if (
                        !emailInput ||
                        !emailInput.value.trim()
                    ) {

                        return;

                    }


                    const email =
                        emailInput.value.trim();


                    /*
                     * Save the email temporarily.
                     */

                    localStorage.setItem(
                        'userEmail',
                        email
                    );


                    /*
                     * IMPORTANT:
                     *
                     * Do NOT carry an old user's
                     * avatar or interests into
                     * the new account.
                     */

                    localStorage.removeItem(
                        'userAvatar'
                    );

                    localStorage.removeItem(
                        'userInterests'
                    );


                    /* =================================
                       FADE PAGE
                    ================================= */

                    document.body.classList.add(
                        'fade-out'
                    );


                    /* =================================
                       GO TO SIGNUP
                    ================================= */

                    setTimeout(
                        function () {

                            window.location.href =
                                'signup.html';

                        },
                        400
                    );

                }
            );

        }


        /* =====================================
           LOGOUT
        ====================================== */

        const homeLogoutBtn =
            document.getElementById(
                'homeLogoutBtn'
            );


        if (homeLogoutBtn) {

            homeLogoutBtn.addEventListener(
                'click',
                function () {

                    /*
                     * Remove ONLY Kmeet's local
                     * account/profile information.
                     *
                     * This prevents the next account
                     * from inheriting the old photo.
                     */

                    localStorage.removeItem(
                        'userEmail'
                    );

                    localStorage.removeItem(
                        'userAvatar'
                    );

                    localStorage.removeItem(
                        'userInterests'
                    );


                    /*
                     * Clear temporary signup data.
                     */

                    sessionStorage.removeItem(
                        'pendingEmail'
                    );

                    sessionStorage.removeItem(
                        'pendingInterests'
                    );


                    /*
                     * Return to the guest homepage.
                     */

                    window.location.href =
                        'index.html';

                }
            );

        }

    }

);

</script>


<!-- =========================================
     KMEET NOTIFICATIONS
========================================== -->

<script type="module">

import {
    enableKmeetNotifications
} from "./firebase-config.js";


window.addEventListener(
    "load",
    async () => {

        try {

            const token =
                await enableKmeetNotifications();


            if (token) {

                console.log(
                    "❤️ Kmeet notifications are enabled."
                );

            }

        } catch (error) {

            console.log(
                "Kmeet notifications:",
                error
            );

        }

    }
);

</script>


</body>
</html>
