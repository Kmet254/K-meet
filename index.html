```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kmeet — Meaningful Connections</title>

    <meta name="description"
          content="Kmeet — meet people, start conversations and build meaningful connections.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
            background: #160b0d;
        }

        /* =====================================
           WELCOME SCREEN
        ===================================== */

        .welcome {
            position: relative;

            width: 100%;
            height: 100vh;
            min-height: 620px;

            display: flex;
            align-items: center;
            justify-content: center;

            background-image: url("assets/kmeet-background.jpg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            overflow: hidden;
        }

        /* Cinematic overlay */

        .welcome::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(24, 8, 12, 0.78) 0%,
                    rgba(36, 12, 18, 0.48) 48%,
                    rgba(15, 7, 9, 0.28) 100%
                );

            z-index: 1;
        }

        .welcome::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(8, 3, 5, 0.72),
                    transparent 45%
                );

            z-index: 1;
        }


        /* =====================================
           TOP LOGO / HOME BUTTON
        ===================================== */

        .top-logo {
            position: absolute;

            top: 28px;
            left: 35px;

            z-index: 10;

            display: flex;
            align-items: center;

            text-decoration: none;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        .top-logo:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .top-logo img {
            width: 105px;
            height: 105px;

            object-fit: cover;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);
        }


        /* =====================================
           MAIN CARD
        ===================================== */

        .content {
            position: relative;

            z-index: 5;

            width: min(92%, 560px);

            padding: 45px 42px 38px;

            text-align: center;

            border-radius: 30px;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(13px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.42);

            opacity: 0;

            transform: translateY(30px);

            animation:
                contentIn 1s ease forwards;
        }


        /* =====================================
           LOGO INSIDE CARD
        ===================================== */

        .hero-logo {
            width: 135px;
            height: 135px;

            object-fit: cover;

            border-radius: 22px;

            margin-bottom: 22px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.3);

            opacity: 0;

            transform: scale(0.88);

            animation:
                logoIn 1s ease 0.25s forwards;
        }


        /* =====================================
           HEADLINE
        ===================================== */

        h1 {
            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(2rem, 5vw, 3.1rem);

            font-weight: 500;

            line-height: 1.15;

            margin-bottom: 16px;

            text-shadow:
                0 4px 18px rgba(0, 0, 0, 0.45);
        }

        h1 span {
            color: #f2c1c7;
        }


        /* =====================================
           DESCRIPTION
        ===================================== */

        .description {
            max-width: 430px;

            margin: 0 auto 28px;

            color:
                rgba(255, 255, 255, 0.92);

            font-size: 1rem;

            line-height: 1.7;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.45);
        }


        /* =====================================
           BUTTONS
        ===================================== */

        .buttons {
            width: 100%;
            max-width: 370px;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            gap: 13px;
        }

        .btn {
            width: 100%;

            min-height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 999px;

            text-decoration: none;

            font-size: 1rem;
            font-weight: 600;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        /* Create Account */

        .btn-primary {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #8d304b,
                    #b75569
                );

            box-shadow:
                0 12px 30px rgba(94, 20, 42, 0.42);
        }

        .btn-primary:hover {
            transform: translateY(-3px);

            box-shadow:
                0 17px 36px rgba(94, 20, 42, 0.55);
        }


        /* Login */

        .btn-secondary {
            color: white;

            background:
                rgba(255, 255, 255, 0.13);

            border:
                1px solid rgba(255, 255, 255, 0.45);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);

            background:
                rgba(255, 255, 255, 0.23);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.25);
        }


        /* =====================================
           EXPLORE LINK
        ===================================== */

        .explore {
            display: inline-block;

            margin-top: 22px;

            color:
                rgba(255, 255, 255, 0.88);

            font-size: 0.9rem;

            text-decoration: none;

            padding-bottom: 4px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.45);

            transition:
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .explore:hover {
            color: white;

            border-color: white;
        }


        /* =====================================
           DECORATIVE HEARTS
        ===================================== */

        .heart {
            position: absolute;

            z-index: 3;

            color:
                rgba(255, 255, 255, 0.38);

            font-size: 22px;

            animation:
                float 4s ease-in-out infinite;
        }

        .heart.one {
            top: 18%;
            left: 12%;
        }

        .heart.two {
            top: 27%;
            right: 12%;

            animation-delay: 1s;
        }

        .heart.three {
            bottom: 18%;
            left: 17%;

            animation-delay: 2s;
        }

        .heart.four {
            bottom: 25%;
            right: 17%;

            animation-delay: 0.5s;
        }


        /* =====================================
           FOOTER
        ===================================== */

        .footer {
            position: absolute;

            z-index: 5;

            bottom: 13px;

            left: 0;
            right: 0;

            text-align: center;

            color:
                rgba(255, 255, 255, 0.65);

            font-size: 0.72rem;
        }


        /* =====================================
           ANIMATIONS
        ===================================== */

        @keyframes contentIn {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes logoIn {

            from {
                opacity: 0;
                transform: scale(0.88);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.25;
            }

            50% {
                transform: translateY(-12px);
                opacity: 0.55;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .welcome {
                min-height: 600px;

                background-position: 58% center;
            }

            .welcome::before {
                background:
                    linear-gradient(
                        180deg,
                        rgba(20, 8, 11, 0.48),
                        rgba(20, 8, 11, 0.74)
                    );
            }

            .top-logo {
                top: 17px;
                left: 18px;
            }

            .top-logo img {
                width: 72px;
                height: 72px;

                border-radius: 15px;
            }

            .content {
                width:
                    calc(100% - 28px);

                padding:
                    30px 22px 27px;

                border-radius: 25px;
            }

            .hero-logo {
                width: 105px;
                height: 105px;

                border-radius: 18px;

                margin-bottom: 17px;
            }

            h1 {
                font-size: 2rem;

                margin-bottom: 11px;
            }

            .description {
                font-size: 0.93rem;

                line-height: 1.6;

                margin-bottom: 21px;
            }

            .btn {
                min-height: 51px;
            }

            .heart {
                display: none;
            }

            .footer {
                font-size: 0.65rem;
            }
        }


        /* Small-height phones */

        @media (max-height: 700px) {

            .content {
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .hero-logo {
                width: 88px;
                height: 88px;

                margin-bottom: 11px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .description {
                margin-bottom: 14px;
            }

            .btn {
                min-height: 46px;
            }

            .explore {
                margin-top: 13px;
            }
        }

    </style>
</head>


<body>

    <main class="welcome">


        <!-- =================================
             KMEET LOGO = HOME BUTTON
        ================================== -->

        <a
            href="index.html"
            class="top-logo"
            aria-label="Go to Kmeet home"
        >
            <img
                src="assets/kmeet-logo.jpg"
                alt="Kmeet Home"
            >
        </a>


        <!-- Decorative hearts -->

        <div class="heart one">♡</div>
        <div class="heart two">♡</div>
        <div class="heart three">♡</div>
        <div class="heart four">♡</div>


        <!-- Main welcome content -->

        <section class="content">

            <img
                src="assets/kmeet-logo.jfif.jfif"
                alt="Kmeet"
                class="hero-logo"
            >


            <h1>
                Where <span>meaningful</span><br>

            <p class="description">

            </p>


            <div class="buttons">

                <!-- Keep your existing registration flow -->

                <a
                    href="interests.html"

                >
                    Create Account
                </a>

                <a
                    href="login.html"

                >

                </a>

            </div>


            <a
                href="discover.html"
                class="explore"
            >

            </a>

        </section>


        <footer class="footer">

        </footer>

    </main>

</body>
</html>
```
