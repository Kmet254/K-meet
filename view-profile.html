
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kmeet - Member Profile</title>
<link rel="icon" type="image/jpeg" href="./kmeet-logo.jfif.jfif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--pink:#ff4f91;--deep:#120914;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(255,79,145,.16),transparent 30%),radial-gradient(circle at 85% 20%,rgba(160,52,120,.14),transparent 32%),linear-gradient(135deg,#0b0710,#190b18 48%,#0c0710);color:#fff;font-family:Poppins,sans-serif}
a{text-decoration:none;color:inherit}
.navbar{min-height:76px;padding:0 6%;display:flex;align-items:center;gap:24px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(12,6,14,.88);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
.logo-link{display:flex;align-items:center;margin-right:auto}
.logo-link img{width:47px;height:47px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.2)}
.nav-link{font-size:13px;color:#eadce6}
.nav-link:hover{color:#ff8ab6}
.page{width:min(1050px,calc(100% - 30px));margin:34px auto 55px}
.back-link{display:inline-flex;gap:9px;align-items:center;color:#f3b4d0;font-size:13px;margin-bottom:20px}
.profile-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:25px;padding:20px;background:rgba(34,15,31,.8);border:1px solid var(--line);border-radius:25px;box-shadow:0 20px 60px rgba(0,0,0,.28);backdrop-filter:blur(14px)}
.hero-photo{position:relative;min-height:440px;height:100%;border-radius:19px;overflow:hidden;background:#21131f}
.hero-photo img{width:100%;height:100%;min-height:440px;object-fit:cover;display:block;cursor:zoom-in}
.photo-label{position:absolute;bottom:0;left:0;right:0;padding:40px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.photo-label h1{font:700 32px 'Playfair Display',serif;margin:0 0 6px}
.photo-label p{font-size:12px;margin:0;color:#f0dce7}
.details{padding:12px 8px;min-width:0}
.eyebrow{color:#ff8ab6;text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:600}
.details h2{font:700 29px 'Playfair Display',serif;margin:9px 0 14px}
.bio{font-size:13px;line-height:1.9;color:#d4c3d0;white-space:pre-wrap;overflow-wrap:anywhere}
.section-title{font-size:13px;font-weight:600;margin:23px 0 11px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:11px;color:#f4dce8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:7px 11px;border-radius:25px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}
.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 17px;border-radius:12px;font:600 12px Poppins,sans-serif;border:1px solid rgba(255,255,255,.14);cursor:pointer}
.chat{background:linear-gradient(135deg,#ff4f91,#d93679);color:#fff;border:0}
.discover{background:rgba(255,255,255,.06);color:#fff}
.gallery-section{margin-top:25px;padding:22px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:22px}
.gallery-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.gallery-heading h2{font:700 23px 'Playfair Display',serif;margin:0}
.gallery-heading span{font-size:11px;color:#cbb9c7}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.gallery-item{padding:0;border:1px solid rgba(255,255,255,.12);border-radius:15px;overflow:hidden;background:#241321;cursor:pointer;min-width:0}
.gallery-item img{width:100%;height:210px;object-fit:cover;display:block;transition:transform .25s}
.gallery-item:hover img{transform:scale(1.04)}
.state{padding:55px 18px;text-align:center;color:#d1bdcd;font-size:13px}
.state i{display:block;font-size:30px;color:#ff78aa;margin-bottom:15px}
.notice{font-size:11px;color:#bfaebc;line-height:1.7;margin-top:17px}
.lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox img{max-width:95vw;max-height:88vh;object-fit:contain;border-radius:12px}
.lightbox button{position:absolute;top:20px;right:24px;background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.2);border-radius:50%;width:43px;height:43px;font-size:25px;cursor:pointer}
@media(max-width:700px){.navbar{padding:0 17px;gap:14px}.profile-shell{grid-template-columns:1fr;padding:12px;gap:12px}.hero-photo,.hero-photo img{min-height:0;height:420px}.details{padding:12px 7px}.details h2{font-size:25px}.gallery-section{padding:15px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.gallery-item img{height:190px}.gallery-heading h2{font-size:21px}}
@media(max-width:400px){.hero-photo,.hero-photo img{height:350px}.gallery-item img{height:155px}.photo-label h1{font-size:27px}}
</style>
</head>
<body>
<nav class="navbar">
  <a class="logo-link" href="index.html" aria-label="Kmeet Home"><img src="./kmeet-logo.jfif.jfif" alt="Kmeet"></a>
  <a class="nav-link" href="discover.html">Discover</a>
  <a class="nav-link" href="profile.html">My Profile</a>
  <a class="nav-link" href="inbox.html">Inbox</a>
</nav>

<main class="page">
  <a class="back-link" href="discover.html"><i class="fa-solid fa-arrow-left"></i> Back to Discover</a>
  <div id="profileRoot" class="state"><i class="fa-solid fa-heart"></i>Loading profile…</div>
</main>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lightboxClose" type="button" aria-label="Close photo">×</button>
  <img id="lightboxImage" src="" alt="Expanded profile photo">
</div>

<script type="module">
import {auth,db,collection,doc,getDoc,onAuthStateChanged} from "./firebase-config.js";

const root=document.getElementById("profileRoot");
const params=new URLSearchParams(location.search);
const userId=params.get("userId")||params.get("user")||"";

const demos=[

["Joseph",36,"Kisumu","Mature, respectful and looking for a lasting connection.",["Business","Fishing","Travel"]],
["Cynthia",27,"Kiambu","Fun-loving and happiest when surrounded by good people.",["Fashion","Food","Music"]],
["Mark",33,"Nairobi","Ambitious, humorous and always open to meeting someone new.",["Business","Football","Travel"]],
["Mercy",29,"Mombasa","Ocean lover with a bright personality and a big heart.",["Beach","Dance","Books"]],
["Peter",30,"Nairobi","Friendly, curious and ready for a genuine conversation.",["Technology","Fitness","Movies"]],
["Joy",26,"Nakuru","I enjoy simple moments, laughter and discovering new places.",["Travel","Food","Music"]],
["George",34,"Mombasa","Easygoing, social and always happiest near the sea.",["Beach","Sports","Food"]],
["Ruth",28,"Nairobi","Caring, ambitious and looking for a partner in adventure.",["Books","Travel","Fitness"]],
["Martin",31,"Eldoret","Honest, humorous and interested in a meaningful connection.",["Sports","Music","Business"]],
["Angela",30,"Nairobi","Confident, kind and looking for someone with a good heart.",["Fashion","Travel","Coffee"]],

["William",32,"Nakuru","Respectful, focused and hoping to meet someone genuine.",["Fitness","Travel","Business"]]

const demoMainPhotos=[
"https://randomuser.me/api/portraits/women/44.jpg","https://randomuser.me/api/portraits/men/32.jpg","https://randomuser.me/api/portraits/women/65.jpg","https://randomuser.me/api/portraits/men/46.jpg","https://randomuser.me/api/portraits/women/32.jpg","https://randomuser.me/api/portraits/men/52.jpg","https://randomuser.me/api/portraits/women/68.jpg","https://randomuser.me/api/portraits/men/75.jpg","https://randomuser.me/api/portraits/women/50.jpg","https://randomuser.me/api/portraits/men/22.jpg","https://randomuser.me/api/portraits/women/21.jpg","https://randomuser.me/api/portraits/men/41.jpg","https://randomuser.me/api/portraits/women/12.jpg","https://randomuser.me/api/portraits/men/61.jpg","https://randomuser.me/api/portraits/women/49.jpg","https://randomuser.me/api/portraits/men/19.jpg","https://randomuser.me/api/portraits/women/36.jpg","https://randomuser.me/api/portraits/men/29.jpg","https://randomuser.me/api/portraits/women/57.jpg","https://randomuser.me/api/portraits/men/37.jpg","https://randomuser.me/api/portraits/women/63.jpg","https://randomuser.me/api/portraits/men/11.jpg","https://randomuser.me/api/portraits/women/75.jpg","https://randomuser.me/api/portraits/men/64.jpg","https://randomuser.me/api/portraits/women/23.jpg","https://randomuser.me/api/portraits/men/70.jpg","https://randomuser.me/api/portraits/women/41.jpg","https://randomuser.me/api/portraits/men/35.jpg","https://randomuser.me/api/portraits/women/45.jpg","https://randomuser.me/api/portraits/men/55.jpg","https://randomuser.me/api/portraits/women/58.jpg","https://randomuser.me/api/portraits/men/43.jpg","https://randomuser.me/api/portraits/women/38.jpg","https://randomuser.me/api/portraits/men/48.jpg","https://randomuser.me/api/portraits/women/55.jpg","https://randomuser.me/api/portraits/women/76.jpg"
];

const womenGallery=[
"https://randomuser.me/api/portraits/women/44.jpg","https://randomuser.me/api/portraits/women/65.jpg","https://randomuser.me/api/portraits/women/68.jpg","https://randomuser.me/api/portraits/women/50.jpg","https://randomuser.me/api/portraits/women/21.jpg","https://randomuser.me/api/portraits/women/49.jpg","https://randomuser.me/api/portraits/women/36.jpg","https://randomuser.me/api/portraits/women/57.jpg","https://randomuser.me/api/portraits/women/63.jpg","https://randomuser.me/api/portraits/women/23.jpg","https://randomuser.me/api/portraits/women/45.jpg","https://randomuser.me/api/portraits/women/58.jpg"
];
const menGallery=[
"https://randomuser.me/api/portraits/men/32.jpg","https://randomuser.me/api/portraits/men/46.jpg","https://randomuser.me/api/portraits/men/52.jpg","https://randomuser.me/api/portraits/men/75.jpg","https://randomuser.me/api/portraits/men/22.jpg","https://randomuser.me/api/portraits/men/41.jpg","https://randomuser.me/api/portraits/men/61.jpg","https://randomuser.me/api/portraits/men/19.jpg","https://randomuser.me/api/portraits/men/29.jpg","https://randomuser.me/api/portraits/men/37.jpg","https://randomuser.me/api/portraits/men/64.jpg","https://randomuser.me/api/portraits/men/70.jpg"
];

function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));}
function avatar(name){const initials=String(name||"K").trim().split(/\s+/).map(s=>s[0]).slice(0,2).join("").toUpperCase();return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#291426"/><text x="50%" y="54%" text-anchor="middle" font-family="Arial" font-size="150" fill="#ff78aa">${initials}</text></svg>`);}
function nameOf(d){return d.displayName||d.name||d.username||d.fullName||"Kmeet Member";}
function photoOf(d){return d.photoURL||d.photoUrl||d.avatar||d.profilePhoto||d.profileImage||d.image||"";}
function photoList(d){const raw=d.photoGallery||d.gallery||d.photos||[];if(Array.isArray(raw))return raw.map(x=>typeof x==="string"?x:(x&& (x.url||x.src||x.photoURL))||"").filter(Boolean);return [];}

function openLightbox(src,alt){document.getElementById("lightboxImage").src=src;document.getElementById("lightboxImage").alt=alt||"Profile photo";document.getElementById("lightbox").classList.add("open");}
document.getElementById("lightboxClose").addEventListener("click",()=>document.getElementById("lightbox").classList.remove("open"));
document.getElementById("lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox")e.currentTarget.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lightbox").classList.remove("open")});

function renderProfile(p){
 const main=p.photo||avatar(p.name);
 const gallery=(p.gallery||[]).filter(url=>url&&url!==main);
 const tags=(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
 const galleryHtml=gallery.length?gallery.map((url,i)=>`<button class="gallery-item" type="button" data-photo="${esc(url)}" aria-label="Enlarge photo ${i+1}"><img src="${esc(url)}" alt="${esc(p.name)} photo ${i+1}" loading="lazy"></button>`).join(""):`<div class="state" style="grid-column:1/-1;padding:24px"><i class="fa-regular fa-images"></i>This member has not added extra photos yet.</div>`;
 root.className="";
 root.innerHTML=`
 <section class="profile-shell">
  <div class="hero-photo"><img id="mainPhoto" src="${esc(main)}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='${avatar(p.name)}'"><div class="photo-label"><h1>${esc(p.name)}${p.age?`, ${esc(p.age)}`:""}</h1><p>📍 ${esc(p.location||"Kenya")}</p></div></div>
  <div class="details"><div class="eyebrow">Get to know ${esc(p.name)}</div><h2>About ${esc(p.name)}</h2><div class="bio">${esc(p.bio||"Looking to meet someone genuine and build a meaningful connection. 💕")}</div>
   <div class="section-title">Interests</div><div class="tags">${tags||'<span class="tag">Getting to know people</span>'}</div>
   <div class="actions"><a class="action chat" href="chat.html?userId=${encodeURIComponent(p.id)}"><i class="fa-regular fa-comment-dots"></i> Chat with ${esc(p.name)}</a><a class="action discover" href="discover.html"><i class="fa-solid fa-arrow-left"></i> Discover</a></div>
   <p class="notice">For your safety, keep personal contact details private until you know and trust the person.</p>
  </div>
 </section>
 <section class="gallery-section"><div class="gallery-heading"><h2><i class="fa-regular fa-images"></i> Photo Gallery</h2><span>${gallery.length} additional photo${gallery.length===1?"":"s"}</span></div><div class="gallery">${galleryHtml}</div></section>`;
 document.querySelectorAll("[data-photo]").forEach(btn=>btn.addEventListener("click",()=>openLightbox(btn.dataset.photo,`${p.name} gallery photo`)));
 document.getElementById("mainPhoto").addEventListener("click",()=>openLightbox(main,`${p.name} profile photo`));
 document.querySelectorAll(".gallery-item img").forEach(img=>img.addEventListener("error",()=>{img.closest(".gallery-item")?.remove()}));
}

async function loadProfile(user){
 if(!userId){root.innerHTML='<i class="fa-solid fa-circle-exclamation"></i>No profile was selected. Please return to Discover and choose a profile.';return;}
 if(userId.startsWith("demo-")){
  const index=Number(userId.slice(5))-1;
  const d=demos[index];
  if(!d){root.innerHTML='<i class="fa-solid fa-circle-exclamation"></i>That sample profile could not be found.';return;}
  const main=demoMainPhotos[index]||avatar(d[0]);
  const isWoman=main.includes("/women/");
  const pool=isWoman?womenGallery:menGallery;
  const gallery=[];
  for(const photo of pool){if(photo!==main&&gallery.length<3)gallery.push(photo);}
  renderProfile({id:userId,name:d[0],age:d[1],location:d[2],bio:d[3],tags:d[4],photo:main,gallery});
  return;
 }
 try{
  const snap=await getDoc(doc(db,"users",userId));
  if(!snap.exists()){root.innerHTML='<i class="fa-solid fa-circle-exclamation"></i>This profile is unavailable.';return;}
  const d=snap.data()||{};
  const name=nameOf(d);
  const main=photoOf(d)||avatar(name);
  const gallery=photoList(d);
  renderProfile({id:userId,name,age:d.age||d.years||"",location:d.location||d.city||d.town||"Kenya",bio:d.bio||d.about||d.description||"Looking to meet someone genuine. 💕",tags:Array.isArray(d.interests)?d.interests:Array.isArray(d.tags)?d.tags:typeof d.interests==="string"?d.interests.split(",").map(x=>x.trim()).filter(Boolean):[],photo:main,gallery});
  if(user&&user.uid===userId){
    const chatLink=document.querySelector(".actions .chat");
    if(chatLink){chatLink.href="profile.html";chatLink.innerHTML='<i class="fa-solid fa-user-pen"></i> Manage my profile';}
  }
 }catch(error){
  console.error("Profile could not be loaded:",error);
  root.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i>We could not load this profile. Please try again.';
 }
}
onAuthStateChanged(auth,user=>{loadProfile(user||null)});
</script>
</body>
</html>
