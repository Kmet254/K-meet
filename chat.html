<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet - Chat</title>

<link rel="icon" type="image/jpeg" href="kmeet-logo.jfif.jfif">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:"Poppins",sans-serif;
    color:#fff;
}

body{
    background:
        linear-gradient(
            rgba(20,10,25,.58),
            rgba(13,7,18,.84)
        ),
        url("chat.jpg") center/cover fixed no-repeat;
}

/* NAV */

.nav{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    background:rgba(18,10,22,.72);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.10);
}

.logo{
    color:#fff;
    text-decoration:none;
    font-family:"Playfair Display",serif;
    font-size:30px;
    font-weight:700;
}

.logo span{
    color:#ff79ad;
}

.navlinks{
    display:flex;
    gap:25px;
}

.navlinks a{
    color:rgba(255,255,255,.86);
    text-decoration:none;
    font-size:14px;
}

.navlinks a:hover{
    color:#ff82b5;
}

/* PAGE */

.page{
    width:100%;
    height:calc(100vh - 72px);
    padding:25px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-shell{
    width:min(1100px,100%);
    height:min(760px,calc(100vh - 122px));
    min-height:540px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:rgba(20,12,25,.70);

    border:1px solid rgba(255,255,255,.14);
    border-radius:28px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    position:relative;
}

/* HEADER */

.chat-header{
    min-height:82px;
    padding:14px 20px;

    display:flex;
    align-items:center;
    gap:14px;

    border-bottom:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.045);
}

.back{
    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    text-decoration:none;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);

    font-size:20px;
}

.person-photo{
    width:50px;
    height:50px;

    border-radius:50%;
    object-fit:cover;

    background:linear-gradient(135deg,#f06b9d,#6e426f);

    border:2px solid rgba(255,255,255,.25);
}

.person-info{
    min-width:0;
    flex:1;
}

.person-name{
    margin:0;

    font-size:17px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.person-status{
    margin-top:2px;

    font-size:12px;

    color:rgba(255,255,255,.58);
}

.online-dot{
    display:inline-block;

    width:7px;
    height:7px;

    margin-right:5px;

    border-radius:50%;

    background:#6ee7a5;

    box-shadow:0 0 10px rgba(110,231,165,.65);
}

/* CHAT */

.chat-area{
    flex:1;
    min-height:0;

    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:24px;

    display:flex;
    flex-direction:column;
    gap:10px;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.15);
    border-radius:10px;
}

.empty{
    margin:auto;

    max-width:430px;

    text-align:center;

    color:rgba(255,255,255,.58);

    font-size:14px;
    line-height:1.7;
}

.message{
    max-width:min(72%,560px);

    padding:11px 15px;

    border-radius:18px;

    font-size:14px;
    line-height:1.5;

    word-wrap:break-word;
    overflow-wrap:anywhere;

    animation:messageIn .18s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.mine{
    align-self:flex-end;

    background:
        linear-gradient(
            135deg,
            rgba(226,82,137,.92),
            rgba(170,59,119,.88)
        );

    border-bottom-right-radius:5px;
}

.message.theirs{
    align-self:flex-start;

    background:rgba(255,255,255,.095);

    border:1px solid rgba(255,255,255,.09);

    border-bottom-left-radius:5px;
}

/* COMPOSER */

.composer{
    padding:15px 18px;

    display:flex;
    gap:10px;

    border-top:1px solid rgba(255,255,255,.10);

    background:rgba(10,6,14,.35);
}

.input-wrap{
    flex:1;
}

.message-input{
    width:100%;
    min-height:48px;
    max-height:120px;

    resize:none;

    border:1px solid rgba(255,255,255,.12);
    border-radius:16px;

    outline:none;

    padding:14px 15px;

    color:#fff;

    background:rgba(255,255,255,.07);

    font-family:"Poppins",sans-serif;
    font-size:14px;
}

.message-input::placeholder{
    color:rgba(255,255,255,.40);
}

.message-input:focus{
    border-color:rgba(255,117,168,.55);

    box-shadow:
        0 0 0 3px rgba(255,117,168,.08);
}

.send-btn{
    width:52px;
    height:48px;

    flex-shrink:0;

    border:none;
    border-radius:16px;

    cursor:pointer;

    color:#fff;

    font-size:19px;

    background:
        linear-gradient(
            135deg,
            #ed659d,
            #b94c86
        );

    transition:.2s;
}

.send-btn:hover{
    transform:translateY(-1px);
}

.send-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.rule-note{
    padding:0 20px 12px;

    text-align:center;

    font-size:11px;

    color:rgba(255,255,255,.40);
}

/* GATE */

.gate{
    position:absolute;
    inset:82px 0 0;

    z-index:5;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(10,6,15,.48);

    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
}

.gate-card{
    width:min(470px,100%);

    padding:30px;

    text-align:center;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,255,255,.14);

    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.gate-icon{
    width:64px;
    height:64px;

    margin:0 auto 14px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

    background:rgba(255,105,160,.13);

    border:1px solid rgba(255,130,175,.18);
}

.gate-card h2{
    margin:0 0 9px;

    font-family:"Playfair Display",serif;

    font-size:27px;
}

.gate-card p{
    margin:0;

    color:rgba(255,255,255,.62);

    font-size:13px;
    line-height:1.65;
}

.package-row{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:20px;
}

.package{
    padding:14px 10px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.11);

    background:rgba(255,255,255,.055);

    color:#fff;

    cursor:pointer;

    font-family:"Poppins",sans-serif;

    transition:.2s;
}

.package:hover{
    background:rgba(255,255,255,.10);
    transform:translateY(-1px);
}

.package strong{
    display:block;
    font-size:16px;
}

.package span{
    display:block;
    margin-top:3px;

    font-size:11px;

    color:rgba(255,255,255,.52);
}

.pay-btn{
    display:block;

    margin-top:18px;

    padding:13px 18px;

    border-radius:14px;

    color:#fff;
    text-decoration:none;

    font-size:14px;
    font-weight:600;

    background:
        linear-gradient(
            135deg,
            #e8649c,
            #b84780
        );
}

.secondary-btn{
    display:block;

    margin-top:10px;

    padding:11px 18px;

    border-radius:14px;

    color:rgba(255,255,255,.78);

    text-decoration:none;

    font-size:13px;

    background:rgba(255,255,255,.055);

    border:1px solid rgba(255,255,255,.09);
}

/* ERROR */

.error-box{
    margin:10px 20px;

    padding:12px 14px;

    border-radius:13px;

    display:none;

    color:#ffdce9;

    background:rgba(220,60,112,.12);

    border:1px solid rgba(255,100,150,.18);

    font-size:12px;

    line-height:1.5;
}

/* MOBILE */

@media(max-width:700px){

    .nav{
        padding:0 18px;
    }

    .navlinks{
        gap:12px;
    }

    .navlinks a{
        font-size:12px;
    }

    .page{
        padding:0;
        align-items:stretch;
    }

    .chat-shell{
        width:100%;
        height:calc(100vh - 72px);

        min-height:0;

        border-radius:0;

        border-left:0;
        border-right:0;
    }

    .messages{
        padding:17px;
    }

    .message{
        max-width:82%;
    }

    .composer{
        padding:11px;
    }

    .package-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<nav class="nav">

    <a class="logo" href="index.html">
        K<span>meet</span>
    </a>

    <div class="navlinks">
        <a href="discover.html">Discover</a>
        <a href="profile.html">Profile</a>
    </div>

</nav>


<div class="page">

<main class="chat-shell">

    <!-- HEADER -->

    <header class="chat-header">

        <a
            class="back"
            href="discover.html"
            aria-label="Back"
        >
            ←
        </a>

        <img
            id="personPhoto"
            class="person-photo"
            src="kmeet-logo.jfif.jfif"
            alt="Kmeet member"
        >

        <div class="person-info">

            <h1
                id="personName"
                class="person-name"
            >
                Kmeet member
            </h1>

            <div class="person-status">

                <span class="online-dot"></span>

                <span id="statusText">
                    Ready to chat
                </span>

            </div>

        </div>

    </header>


    <!-- CHAT -->

    <section
        id="chatArea"
        class="chat-area"
    >

        <div
            id="messages"
            class="messages"
        >

            <div class="empty">
                Say hello and start the connection. ❤️
            </div>

        </div>


        <div
            id="errorBox"
            class="error-box"
        ></div>


        <div class="rule-note">
            Start with <strong>hi</strong> or <strong>hey</strong>.
            Contact information cannot be shared for free.
        </div>


        <form
            id="composer"

        >

            <div class="input-wrap">

                <textarea
                    id="messageInput"
                    class="message-input"

                    placeholder="Write a message..."
                    autocomplete="off"
                ></textarea>

            </div>

            <button
                id="sendBtn"

    <!-- PAYMENT GATE -->

    <section
        id="gate"

        <div class="gate-card">

                    class="package"

                    <strong>3 chats</strong>

                <button
                    class="package"
                    type="button"
                    data-package="8"
                    data-amount="100"

                    <strong>8 chats</strong>
                    <span>KSh 100</span>
                </button>

            </div>


            <div
                id="receiverPayment"
                style="display:none;"
            >

                <a
                    id="receiverPayBtn"
                    class="pay-btn"
                    href="#"
                >
                    Continue for KSh 11
                </a>

            </div>


            <a
                class="secondary-btn"
                href="discover.html"
            >
                Back to Discover
            </a>

        </div>

    </section>

</main>

</div>


<script type="module">

/*
===========================================================
KMEET CHAT

IMPORTANT:
We only import auth/db from firebase-config.js.

We DO NOT import signInAnonymously from it.
===========================================================
*/

import {
    auth,
    db
} from "./firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    addDoc,
    setDoc,
    updateDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const personName =
    document.getElementById("personName");

const personPhoto =
    document.getElementById("personPhoto");

const statusText =
    document.getElementById("statusText");

const messages =
    document.getElementById("messages");

const composer =
    document.getElementById("composer");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const errorBox =
    document.getElementById("errorBox");

const gate =
    document.getElementById("gate");

const gateTitle =
    document.getElementById("gateTitle");

const gateText =
    document.getElementById("gateText");

const gateIcon =
    document.getElementById("gateIcon");

const packageRow =
    document.getElementById("packageRow");

const receiverPayment =
    document.getElementById("receiverPayment");

const receiverPayBtn =
    document.getElementById("receiverPayBtn");


/* =========================================================
   TARGET
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const targetId =
    params.get("userId") ||
    params.get("user");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let conversationId = null;

let conversation = null;

let unsubscribeMessages = null;


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(text){

    errorBox.textContent = text;

    errorBox.style.display = "block";

}


/* =========================================================
   HIDE ERROR
========================================================= */

function hideError(){

    errorBox.style.display = "none";

}


/* =========================================================
   PROFILE
========================================================= */

async function loadTargetProfile(){

    if(!targetId){
        return;
    }

    try{

        const snapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    targetId
                )
            );


        if(!snapshot.exists()){

            personName.textContent =
                "Kmeet member";

            statusText.textContent =
                "Profile unavailable";

            return;
        }


        const profile =
            snapshot.data();


        personName.textContent =
            profile.name ||
            profile.displayName ||
            "Kmeet member";


        personPhoto.src =
            profile.photoURL ||
            profile.avatar ||
            profile.photo ||
            "kmeet-logo.jfif.jfif";


        personPhoto.onerror = () => {

            personPhoto.src =
                "kmeet-logo.jfif.jfif";

        };


        statusText.textContent =
            "Ready to chat";

    }catch(error){

        console.error(
            "Profile error:",
            error
        );

    }

}


/* =========================================================
   CONVERSATION ID
========================================================= */

function makeConversationId(){

    return [
        currentUser.uid,
        targetId
    ]
    .sort()
    .join("_");

}


/* =========================================================
   LOAD CONVERSATION
========================================================= */

async function loadConversation(){

    if(!currentUser || !targetId){
        return;
    }


    conversationId =
        makeConversationId();


    const ref =
        doc(
            db,
            "conversations",
            conversationId
        );


    try{

        const snapshot =
            await getDoc(ref);


        if(snapshot.exists()){

            conversation =
                snapshot.data();

        }else{

            conversation = null;

        }


        listenForMessages();

    }catch(error){

        console.error(
            "Conversation error:",
            error
        );


        /*
           IMPORTANT:
           Chat stays visible.
        */

        showError(
            "Messages could not be loaded. Please refresh if necessary."
        );

    }

}


/* =========================================================
   REAL-TIME MESSAGES
========================================================= */

function listenForMessages(){

    if(!conversationId){
        return;
    }


    if(unsubscribeMessages){
        unsubscribeMessages();
    }


    const messagesRef =
        collection(
            db,
            "conversations",
            conversationId,
            "messages"
        );


    const messagesQuery =
        query(
            messagesRef,
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(

            messagesQuery,

            snapshot => {

                messages.innerHTML = "";


                if(snapshot.empty){

                    messages.innerHTML = `
                        <div class="empty">
                            Say hello and start the connection. ❤️
                        </div>
                    `;

                    return;
                }


                snapshot.forEach(item => {

                    const data =
                        item.data();


                    const bubble =
                        document.createElement(
                            "div"
                        );


                    bubble.className =
                        "message " +
                        (
                            data.senderId === currentUser.uid
                                ? "mine"
                                : "theirs"
                        );


                    bubble.textContent =
                        data.text || "";


                    messages.appendChild(
                        bubble
                    );

                });


                messages.scrollTop =
                    messages.scrollHeight;

            },

            error => {

                console.error(
                    "Firestore listener error:",
                    error
                );


                showError(
                    "Live messages are temporarily unavailable. Please refresh."
                );

            }

        );

}


/* =========================================================
   CONTACT DETECTOR
========================================================= */

function containsContactInformation(text){

    const value =
        String(text || "")
        .toLowerCase()
        .trim();


    /* EMAIL */

    const email =
        /\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i;


    /* +254 PHONE */

    const internationalPhone =
        /(?:\+254|00254)[\s.-]*7\d{2}[\s.-]*\d{3}[\s.-]*\d{3}\b/;


    /* KENYAN LOCAL PHONE */

    const localPhone =
        /\b0(?:7\d{2})[\s.-]*\d{3}[\s.-]*\d{3}\b/;


    /* LONG NUMBER */

    const longNumber =
        /(?:\d[\s.-]*){9,}/;


    /* CONTACT / SOCIAL REQUESTS */

    const contactWords =
        /\b(?:whatsapp|what\s*app|telegram|instagram|facebook|snapchat|tiktok|call\s+me|text\s+me|message\s+me|contact\s+me|send\s+your\s+number|give\s+me\s+your\s+number|my\s+number|my\s+phone|email\s+me|email\s+address)\b/i;


    return (
        email.test(value) ||
        internationalPhone.test(value) ||
        localPhone.test(value) ||
        longNumber.test(value) ||
        contactWords.test(value)
    );

}


/* =========================================================
   OPENING MESSAGE
========================================================= */

function isHiOrHey(text){

    const clean =
        String(text || "")
        .trim()
        .toLowerCase();


    return (
        clean === "hi" ||
        clean === "hey"
    );

}


/* =========================================================
   SENDER GATE
========================================================= */

function showSenderGate(){

    gate.style.display =
        "flex";


    gateIcon.textContent =
        "🔒";


    gateTitle.textContent =
        "Continue chatting";


    gateText.textContent =
        "Your free opening message has been used. Choose a chat package to continue.";


    packageRow.style.display =
        "grid";


    receiverPayment.style.display =
        "none";

}


/* =========================================================
   RECEIVER KSH 11 GATE
========================================================= */

function showReceiverGate(){

    gate.style.display =
        "flex";


    gateIcon.textContent =
        "💗";


    gateTitle.textContent =
        "Continue for KSh 11";


    gateText.textContent =
        "Your free replies have been used, or your message attempted to share contact information.";


    packageRow.style.display =
        "none";


    receiverPayment.style.display =
        "block";


    receiverPayBtn.href =
        "payment.html" +
        "?userId=" +
        encodeURIComponent(targetId) +
        "&amount=11" +
        "&type=receiver";

}


/* =========================================================
   HIDE GATE
========================================================= */

function hideGate(){

    gate.style.display =
        "none";

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(text){

    if(!currentUser){

        showError(
            "Chat is still connecting. Please try again."
        );

        return;
    }


    if(!conversationId){

        showError(
            "The conversation is not ready. Please refresh the page."
        );

        return;
    }


    const clean =
        String(text || "")
        .trim();


    if(!clean){
        return;
    }


    /*
       CONTACT CHECK FIRST.

       The message is NEVER written to Firestore.
    */

    if(
        containsContactInformation(clean)
    ){

        showReceiverGate();

        return;
    }


    /*
       LOAD LATEST CONVERSATION STATE.
    */

    let state =
        conversation;


    try{

        const snapshot =
            await getDoc(
                doc(
                    db,
                    "conversations",
                    conversationId
                )
            );


        if(snapshot.exists()){

            state =
                snapshot.data();

        }

    }catch(error){

        console.error(
            "State refresh error:",
            error
        );

    }


    /*
       BRAND NEW CONVERSATION.

       The first sender becomes initiator.
    */

    if(!state){

        if(!isHiOrHey(clean)){

            showError(
                'Your first message must be exactly "hi" or "hey".'
            );

            return;
        }


        try{

            await setDoc(
                doc(
                    db,
                    "conversations",
                    conversationId
                ),
                {

                    initiatorId:
                        currentUser.uid,

                    targetId:
                        targetId,

                    senderCredits:
                        0,

                    senderFreeUsed:
                        true,

                    receiverFreeReplies:
                        0,

                    receiverPaid:
                        false,

                    createdAt:
                        serverTimestamp()

                }
            );


            await addDoc(
                collection(
                    db,
                    "conversations",
                    conversationId,
                    "messages"
                ),
                {

                    senderId:
                        currentUser.uid,

                    targetId:
                        targetId,

                    text:
                        clean,

                    createdAt:
                        serverTimestamp()

                }
            );


            conversation = {

                initiatorId:
                    currentUser.uid,

                targetId:
                    targetId,

                senderCredits:
                    0,

                senderFreeUsed:
                    true,

                receiverFreeReplies:
                    0,

                receiverPaid:
                    false

            };


            messageInput.value = "";

            return;

        }catch(error){

            console.error(
                "First message error:",
                error
            );


            showError(
                "The message could not be sent. Please try again."
            );


            return;

        }

    }


    /*
       DETERMINE ROLE.
    */

    const isInitiator =
        state.initiatorId ===
        currentUser.uid;


    /* =====================================================
       RECEIVER
    ===================================================== */

    if(!isInitiator){

        const replies =
            Number(
                state.receiverFreeReplies || 0
            );


        /*
           Receiver gets 3 free replies.
        */

        if(
            replies >= 3 &&
            !state.receiverPaid
        ){

            showReceiverGate();

            return;

        }


        try{

            await addDoc(
                collection(
                    db,
                    "conversations",
                    conversationId,
                    "messages"
                ),
                {

                    senderId:
                        currentUser.uid,

                    targetId:
                        targetId,

                    text:
                        clean,

                    createdAt:
                        serverTimestamp()

                }
            );


            if(!state.receiverPaid){

                await updateDoc(
                    doc(
                        db,
                        "conversations",
                        conversationId
                    ),
                    {
                        receiverFreeReplies:
                            replies + 1
                    }
                );

            }


            conversation =
                {
                    ...state,
                    receiverFreeReplies:
                        state.receiverPaid
                            ? replies
                            : replies + 1
                };


            messageInput.value = "";


            return;

        }catch(error){

            console.error(
                "Receiver message error:",
                error
            );


            showError(
                "Your reply could not be sent."
            );


            return;

        }

    }


    /* =====================================================
       INITIATOR / SENDER
    ===================================================== */

    const freeOpeningUsed =
        Boolean(
            state.senderFreeUsed
        );


    const credits =
        Number(
            state.senderCredits || 0
        );


    /*
       The opening message was already used.

       Every additional sender message requires a credit.
    */

    if(freeOpeningUsed){

        if(credits <= 0){

            showSenderGate();

            return;

        }


        try{

            await addDoc(
                collection(
                    db,
                    "conversations",
                    conversationId,
                    "messages"
                ),
                {

                    senderId:
                        currentUser.uid,

                    targetId:
                        targetId,

                    text:
                        clean,

                    createdAt:
                        serverTimestamp()

                }
            );


            await updateDoc(
                doc(
                    db,
                    "conversations",
                    conversationId
                ),
                {
                    senderCredits:
                        credits - 1
                }
            );


            conversation =
                {
                    ...state,
                    senderCredits:
                        credits - 1
                };


            messageInput.value = "";


        }catch(error){

            console.error(
                "Sender message error:",
                error
            );


            showError(
                "Your message could not be sent."
            );

        }

    }

}


/* =========================================================
   FORM
========================================================= */

composer.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        sendBtn.disabled =
            true;


        try{

            await sendMessage(
                messageInput.value
            );

        }finally{

            sendBtn.disabled =
                false;

            messageInput.focus();

        }

    }
);


/* =========================================================
   TEXTAREA
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "48px";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                120
            ) + "px";

    }
);


/* =========================================================
   PACKAGE BUTTONS
========================================================= */

document
    .querySelectorAll(".package")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const packageSize =
                    button.dataset.package;


                const amount =
                    button.dataset.amount;


                window.location.href =
                    "payment.html" +
                    "?userId=" +
                    encodeURIComponent(targetId) +
                    "&package=" +
                    encodeURIComponent(packageSize) +
                    "&amount=" +
                    encodeURIComponent(amount) +
                    "&type=sender" +
                    "&from=chat";

            }
        );

    });


/* =========================================================
   STARTUP
========================================================= */

/*
   VERY IMPORTANT:

   The chat is already visible in the HTML.

   We do NOT wait for Firebase before displaying it.
*/

if(!targetId){

    personName.textContent =
        "No member selected";

    statusText.textContent =
        "Invalid chat link";

    messageInput.disabled =
        true;

    sendBtn.disabled =
        true;


    showError(
        "No Kmeet member was selected."
    );

}else{

    /*
       Load the selected person's profile in background.
    */

    loadTargetProfile();


    /*
       Wait for Firebase's existing auth state.

       We do NOT call signInAnonymously.
       We do NOT import it.
    */

    onAuthStateChanged(
        auth,
        async user => {

            if(!user){

                statusText.textContent =
                    "Please log in to chat";

                messageInput.disabled =
                    true;

                sendBtn.disabled =
                    true;

                showError(
                    "Please log in before starting a conversation."
                );

                return;

            }


            currentUser =
                user;


            messageInput.disabled =
                false;

            sendBtn.disabled =
                false;


            statusText.textContent =
                "Ready to chat";


            await loadConversation();

        }
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(unsubscribeMessages){

            unsubscribeMessages();

        }

    }
);

</script>
