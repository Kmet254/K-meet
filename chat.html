/* =========================================================

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function normalizeMessage(value){

  return String(value || "")
    .trim()
    .toLowerCase();

}


function formatTime(timestamp){

  if(!timestamp){
    return "";
  }

  try{

    let date;

    if(
      typeof timestamp.toDate === "function"
    ){
      date = timestamp.toDate();
    }
    else if(
      timestamp.seconds
    ){
      date = new Date(
        timestamp.seconds * 1000
      );
    }
    else{
      date = new Date(timestamp);
    }

    if(isNaN(date.getTime())){
      return "";
    }

    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }
  catch(error){

    return "";

  }

}


/* =========================================================
   PROFILE
========================================================= */

async function loadTargetProfile(){

  if(!targetId){
    return;
  }

  const demo =
    demoProfiles.find(
      profile => profile.id === targetId
    );

  if(demo){

    targetProfile = demo;

    targetName.textContent =
      demo.name;

    targetPhoto.src =
      demo.photo;

    targetStatus.textContent =
      `${demo.status} • ${demo.location}`;

    return;

  }


  try{

    const userSnap =
      await getDoc(
        doc(db,"users",targetId)
      );

    if(userSnap.exists()){

      const data =
        userSnap.data();

      targetProfile = {
        id:targetId,
        name:
          data.displayName ||
          data.name ||
          "Kmeet member",

        photo:
          data.photoURL ||
          data.photo ||
          "./kmeet-logo.jfif.jfif",

        location:
          data.location ||
          "Kenya",

        status:
          data.online === true ||
          data.isOnline === true
            ? "Online"
            : "Offline"
      };

    }
    else{

      targetProfile = {
        id:targetId,
        name:"Kmeet member",
        photo:"./kmeet-logo.jfif.jfif",
        location:"Kenya",
        status:"Offline"
      };

    }

  }
  catch(error){

    console.error(
      "Could not load profile:",
      error
    );

    targetProfile = {
      id:targetId,
      name:"Kmeet member",
      photo:"./kmeet-logo.jfif.jfif",
      location:"Kenya",
      status:"Offline"
    };

  }


  targetName.textContent =
    targetProfile.name;

  targetPhoto.src =
    targetProfile.photo;

  targetStatus.textContent =
    `${targetProfile.status} • ${targetProfile.location}`;

}

function showGate(type){

  gate.classList.add("show");

  composer.style.display =
    "none";

  sendBtn.disabled = true;


  if(type === "anonymous"){

    gateTitle.textContent =
      "Create an account to chat";

    gateText.textContent =
      "You can explore Kmeet as a guest, but messaging requires a paid chat or a registered Kmeet account.";

    gateButton.textContent =
      "Unlock Chat";

    gateButton.href =
      `./subscription.html?userId=${encodeURIComponent(targetId || "")}&anonymous=true`;

    infoBar.textContent =
      "Guest browsing is available. Chat requires payment.";

    return;
  }


  if(type === "sender"){

    gateTitle.textContent =
      "Your free opening message has been used";

    gateText.textContent =
      `Continue this conversation with 3 chats for KSh ${SENDER_PACK_3_PRICE}, or choose the 8-chat bonus package for KSh 100.`;

    gateButton.textContent =
      `Continue — KSh ${SENDER_PACK_3_PRICE}`;

    gateButton.href =
      `./subscription.html?userId=${encodeURIComponent(targetId || "")}&package=3`;

    infoBar.textContent =
      "Your free opening message has already been used.";

    return;
  }


  if(type === "receiver"){

    gateTitle.textContent =
      "Continue chatting";

    gateText.textContent =
      `Your 3 free replies are finished. Continue for KSh ${RECEIVER_CONTINUATION_FEE}.`;

    gateButton.textContent =
      `Continue — KSh ${RECEIVER_CONTINUATION_FEE}`;

    gateButton.href =
      `./subscription.html?userId=${encodeURIComponent(targetId || "")}&package=receiver`;

    infoBar.textContent =
      "Your free receiver replies are finished.";

  }

}


/* =========================================================
   FREE MESSAGE LOGIC
   IMPORTANT:
   OLD MESSAGES ARE NEVER USED TO CALCULATE ALLOWANCE.
========================================================= */

function senderFreeOpeningAvailable(){

  if(!conversationData){
    return true;
  }

  /*
   * The free opening belongs to the
   * conversation initiator.
   *
   * IMPORTANT:
   * We deliberately DO NOT inspect
   * currentMessages here.
   *
   * Old messages must not consume the
   * new allowance.
   */

  if(
    conversationData.initiatorId !==
    currentUser.uid
  ){

    return true;

  }

  return (
    conversationData.senderFreeOpeningUsed !== true
  );

}


function getReceiverReplyCount(){

  if(
    !currentUser ||
    !conversationData
  ){

    return 0;

  }


  if(
    conversationData.receiverId !==
    currentUser.uid
  ){

    return 0;

  }


  /*
   * Missing field means a fresh
   * allowance of zero replies used.
   *
   * OLD MESSAGES ARE NOT COUNTED.
   */

  const value =
    conversationData.receiverRepliesUsed;


  if(
    value === undefined ||
    value === null
  ){

    return 0;

  }


  const number =
    Number(value);


  if(
    !Number.isFinite(number) ||
    number < 0
  ){

    return 0;

  }


  return number;

}


/* =========================================================
   INFO BAR
========================================================= */

function updateInfoBar(){

  if(!currentUser){

    infoBar.textContent =
      "Checking chat access...";

    return;

  }


  if(anonymousSession){

    infoBar.textContent =
      "Guest browsing — payment is required to send messages.";

    return;

  }


  if(!conversationData){

    infoBar.textContent =
      "Start the conversation with a message.";

    return;

  }


  const isInitiator =
    conversationData.initiatorId ===
    currentUser.uid;

  const isReceiver =
    conversationData.receiverId ===
    currentUser.uid;


  if(isInitiator){

    if(senderFreeOpeningAvailable()){

      infoBar.textContent =
        "Your opening message is free — say hi or hey ❤️";

    }
    else{

      const credits =
        Number(
          conversationData.senderCredits ||
          0
        );

      infoBar.textContent =
        credits > 0
          ? `${credits} chat credit${credits === 1 ? "" : "s"} remaining.`
          : "Your free opening message has been used.";

    }

    return;

  }


  if(isReceiver){

    const used =
      getReceiverReplyCount();

    if(
      conversationData.receiverPaid === true
    ){

      infoBar.textContent =
        "You have paid access to continue chatting.";

      return;

    }

    const remaining =
      Math.max(
        0,
        FREE_RECEIVER_REPLIES - used
      );

    if(remaining > 0){

      infoBar.textContent =
        `${remaining} free repl${remaining === 1 ? "y" : "ies"} remaining.`;

    }
    else{

      infoBar.textContent =
        "Your 3 free replies have been used.";

    }

  }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages){

  messagesEl.innerHTML = "";


  if(!messages.length){

    messagesEl.innerHTML = `
      <div class="empty">
        <div>
          <i class="fa-regular fa-heart"
             style="font-size:30px;margin-bottom:10px;color:#ed5798;"></i>
          <br>
          Start the conversation ❤️
        </div>
      </div>
    `;

    return;

  }


  messages.forEach(message => {

    const mine =
      message.senderId ===
      currentUser?.uid;


    const row =
      document.createElement("div");

    row.className =
      `message-row ${mine ? "mine" : "theirs"}`;


    const bubble =
      document.createElement("div");

    bubble.className =
      "message";


    const text =
      document.createElement("div");

    text.innerHTML =
      escapeHtml(message.text);


    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      formatTime(message.createdAt);


    bubble.appendChild(text);
    bubble.appendChild(time);

    row.appendChild(bubble);

    messagesEl.appendChild(row);

  });


  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* =========================================================
   CONVERSATION IDS
========================================================= */

function sortedConversationId(a,b){

  return [a,b]
    .sort()
    .join("_");

}


function possibleConversationIds(){

  if(
    !currentUser ||
    !targetId
  ){

    return [];

  }


  const sorted =
    sortedConversationId(
      currentUser.uid,
      targetId
    );


  return [

    `kmeet_v2_${sorted}`,

    sorted,

    `conversation_${sorted}`

  ];

}


/* =========================================================
   VALIDATE EXISTING CONVERSATION
========================================================= */

function isValidConversationData(data){

  if(!data){
    return false;
  }


  const initiator =
    data.initiatorId;

  const receiver =
    data.receiverId;


  if(
    typeof initiator !== "string" ||
    typeof receiver !== "string"
  ){

    return false;

  }


  if(
    initiator === receiver
  ){

    return false;

  }


  return (
    (
      initiator === currentUser.uid &&
      receiver === targetId
    )
    ||
    (
      initiator === targetId &&
      receiver === currentUser.uid
    )
  );

}


/* =========================================================
   FIND CONVERSATION
   IMPORTANT:
   OLD AND NEW IDS ARE BOTH CHECKED.
========================================================= */

async function findValidConversation(){

  if(
    !currentUser ||
    !targetId
  ){

    return null;

  }


  const ids =
    possibleConversationIds();


  for(
    const id of ids
  ){

    try{

      const snap =
        await getDoc(
          doc(
            db,
            "conversations",
            id
          )
        );


      if(
        snap.exists()
      ){

        const data =
          snap.data();


        if(
          isValidConversationData(data)
        ){

          return {
            id,
            data
          };

        }

      }

    }
    catch(error){

      console.warn(
        "Conversation lookup failed for",
        id,
        error
      );

    }

  }


  /*
   * If no known ID matched, check the
   * participant fields in likely legacy
   * documents.
   *
   * We cannot query arbitrary documents
   * here without an index, so the ID
   * formats above remain the primary path.
   */

  return null;

}


/* =========================================================
   LISTENER
========================================================= */

function startFirestoreListener(){

  if(
    !conversationId ||
    !currentUser
  ){

    return;

  }


  /*
   * IMPORTANT:
   * Never restart this listener every time
   * the user presses Send.
   */

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }


  messagesLoaded = false;

  currentMessages = [];


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const q =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      q,

      snapshot => {

        currentMessages =
          snapshot.docs.map(
            d => ({
              id:d.id,
              ...d.data()
            })
          );


        messagesLoaded = true;

        renderMessages(
          currentMessages
        );

        updateInfoBar();

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );

        messagesLoaded = true;

        infoBar.textContent =
          "Unable to load messages right now.";

      }
    );

}


/* =========================================================
   WAIT FOR LISTENER
========================================================= */

function waitForMessagesLoaded(){

  if(messagesLoaded){
    return Promise.resolve();
  }


  return new Promise(resolve => {

    const started =
      Date.now();


    const timer =
      setInterval(() => {

        if(
          messagesLoaded ||
          Date.now() - started > 5000
        ){

          clearInterval(timer);

          resolve();

        }

      },100);

  });

}


/* =========================================================
   PREPARE REAL CONVERSATION
========================================================= */

async function prepareRealConversation(){

  if(
    !currentUser ||
    !targetId
  ){

    return;

  }


  const existing =
    await findValidConversation();


  if(existing){

    conversationId =
      existing.id;

    conversationData =
      existing.data;


    /*
     * Start listener ONCE.
     */

    startFirestoreListener();

    updateInfoBar();

    return;

  }


  /*
   * No conversation exists yet.
   *
   * We do not create an empty conversation
   * until the user actually sends the first
   * message.
   */

  conversationId = null;

  conversationData = null;

  currentMessages = [];

  messagesLoaded = true;

  renderMessages([]);

  updateInfoBar();

}


/* =========================================================
   CREATE NEW CONVERSATION
========================================================= */

async function createNewConversation(text){

  const id =
    `kmeet_v2_${sortedConversationId(
      currentUser.uid,
      targetId
    )}`;


  conversationId = id;


  const newConversation = {

    initiatorId:
      currentUser.uid,

    receiverId:
      targetId,

    senderFreeOpeningUsed:
      true,

    receiverRepliesUsed:
      0,

    senderCreditsUsed:
      0,

    receiverPaid:
      false,

    createdAt:
      serverTimestamp(),

    updatedAt:
      serverTimestamp()

  };


  await setDoc(
    doc(
      db,
      "conversations",
      id
    ),
    newConversation,
    {merge:true}
  );


  await addDoc(
    collection(
      db,
      "conversations",
      id,
      "messages"
    ),
    {
      senderId:
        currentUser.uid,

      receiverId:
        targetId,

      text:

        text,

      createdAt:
        serverTimestamp()
    }
  );


  /*
   * Keep local state clean.
   * Do not store Firestore timestamp
   * sentinels as entitlement values.
   */

  conversationData = {

    initiatorId:
      currentUser.uid,

    receiverId:
      targetId,

    senderFreeOpeningUsed:
      true,

    receiverRepliesUsed:
      0,

    senderCreditsUsed:
      0,

    receiverPaid:
      false

  };


  /*
   * Listener is started only once after
   * the conversation has been created.
   */

  startFirestoreListener();

  updateInfoBar();

}


/* =========================================================
   CONTACT INFORMATION DETECTION
========================================================= */

function containsContactInformation(text){

  const value =
    String(text || "")
      .toLowerCase()
      .trim();


  /*
   * Phone numbers
   */

  const phonePattern =
    /(?:\+?254|0)\s*\d(?:[\s-]*\d){8,11}/i;


  /*
   * Email
   */

  const emailPattern =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;


  /*
   * Social/contact phrases
   */

  const contactWords =
    /\b(whatsapp|telegram|instagram|facebook|snapchat|call me|text me|my number|phone me|contact me)\b/i;


  return (
    phonePattern.test(value) ||
    emailPattern.test(value) ||
    contactWords.test(value)
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(
    sending ||
    !currentUser
  ){

    return;

  }


  const raw =
    messageInput.value.trim();


  if(!raw){
    return;
  }


  /*
   * Anonymous users must not use
   * the free opening message.
   */

  if(anonymousSession){

    showGate("anonymous");

    return;

  }


  sending = true;

  sendBtn.disabled = true;


  try{

    /*
     * If there is no conversation yet,
     * this user will become the initiator.
     */

    if(!conversationData){

      const normalized =
        normalizeMessage(raw);


      /*
       * The first free opening must be
       * exactly "hi" or "hey".
       */

      if(
        !FREE_OPENING_MESSAGES.includes(
          normalized
        )
      ){

        showGate("sender");

        return;

      }


      await createNewConversation(
        raw
      );


      messageInput.value = "";

      return;

    }


    /*
     * IMPORTANT:
     * Do NOT restart the listener here.
     *
     * The old version did that and could
     * make messages disappear temporarily.
     */

    if(
      conversationData &&
      !messagesLoaded
    ){

      await waitForMessagesLoaded();

    }


    const isInitiator =
      conversationData.initiatorId ===
      currentUser.uid;


    const isReceiver =
      conversationData.receiverId ===
      currentUser.uid;


    /* -------------------------------------
       INITIATOR
    ------------------------------------- */

    if(isInitiator){

      const freeAvailable =
        senderFreeOpeningAvailable();


      if(freeAvailable){

        /*
         * Only hi or hey are allowed as
         * the one free opening.
         */

        const normalized =
          normalizeMessage(raw);


        if(
          !FREE_OPENING_MESSAGES.includes(
            normalized
          )
        ){

          alert(
            'Your free opening message must be "hi" or "hey".'
          );

          return;

        }


        await addDoc(
          collection(
            db,
            "conversations",
            conversationId,
            "messages"
          ),
          {
            senderId:
              currentUser.uid,

            receiverId:
              targetId,

            text:
              raw,

            createdAt:
              serverTimestamp()
          }
        );


        const patch = {

          senderFreeOpeningUsed:
            true,

          updatedAt:
            serverTimestamp()

        };


        await setDoc(
          doc(
            db,
            "conversations",
            conversationId
          ),
          patch,
          {merge:true}
        );


        /*
         * Update only local entitlement
         * fields. Do not replace them with
         * Firestore timestamp sentinels.
         */

        conversationData = {

          ...conversationData,

          senderFreeOpeningUsed:
            true

        };


        messageInput.value = "";

        updateInfoBar();

        return;

      }


      /*
       * Free opening has already been used.
       * Check paid credits.
       */

      const credits =
        Number(
          conversationData.senderCredits ||
          0
        );


      if(
        credits <= 0
      ){

        showGate("sender");

        return;

      }


      await addDoc(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        {
          senderId:
            currentUser.uid,

          receiverId:
            targetId,

          text:
            raw,

          createdAt:
            serverTimestamp()
        }
      );


      const used =
        Number(
          conversationData.senderCreditsUsed ||
          0
        );


      await setDoc(
        doc(
          db,
          "conversations",
          conversationId
        ),
        {
          senderCreditsUsed:
            used + 1,

          updatedAt:
            serverTimestamp()
        },
        {merge:true}
      );


      conversationData = {

        ...conversationData,

        senderCreditsUsed:
          used + 1,

        senderCredits:
          Math.max(
            0,
            credits - 1
          )

      };


      messageInput.value = "";

      updateInfoBar();

      return;

    }


    /* -------------------------------------
       RECEIVER
    ------------------------------------- */

    if(isReceiver){

      /*
       * Contact information is checked
       * before the free allowance.
       */

      if(
        containsContactInformation(raw) &&
        conversationData.receiverPaid !== true
      ){

        showGate("receiver");

        alert(
          "For your safety, contact information cannot be shared before the KSh 11 continuation payment."
        );

        return;

      }


      if(
        conversationData.receiverPaid === true
      ){

        await addDoc(
          collection(
            db,
            "conversations",
            conversationId,
            "messages"
          ),
          {
            senderId:
              currentUser.uid,

            receiverId:
              targetId,

            text:
              raw,

            createdAt:
              serverTimestamp()
          }
        );


        messageInput.value = "";

        return;

      }


      const usedReplies =
        getReceiverReplyCount();


      if(
        usedReplies >=
        FREE_RECEIVER_REPLIES
      ){

        showGate("receiver");

        return;

      }


      /*
       * Free receiver reply.
       */

      await addDoc(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        {
          senderId:
            currentUser.uid,

          receiverId:
            targetId,

          text:
            raw,

          createdAt:
            serverTimestamp()
        }
      );


      const newReplyCount =
        usedReplies + 1;


      await setDoc(
        doc(
          db,
          "conversations",
          conversationId
        ),
        {
          receiverRepliesUsed:
            newReplyCount,

          updatedAt:
            serverTimestamp()
        },
        {merge:true}
      );


      conversationData = {

        ...conversationData,

        receiverRepliesUsed:
          newReplyCount

      };


      messageInput.value = "";

      updateInfoBar();

      return;

    }


    /*
     * Something is wrong with the
     * participant roles.
     */

    alert(
      "Kmeet could not verify your role in this conversation."
    );

  }
  catch(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );


    alert(
      "The message could not be sent. Please try again."
    );

  }
  finally{

    sending = false;

    /*
     * Only disable if a gate is currently
     * being displayed.
     */

    if(
      !gate.classList.contains("show")
    ){

      sendBtn.disabled = false;

    }

  }

}


/* =========================================================
   INPUT
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    try{

      if(!user){

        /*
         * Anonymous browsing session.
         */

        try{

          const credential =
            await signInAnonymously(auth);

          currentUser =
            credential.user;

          anonymousSession =
            true;

        }
        catch(error){

          console.error(
            "Anonymous auth failed:",
            error
          );

          targetName.textContent =
            "Kmeet";

          targetStatus.textContent =
            "Unable to open chat";

          infoBar.textContent =
            "Please log in to continue.";

          composer.style.display =
            "none";

          return;

        }

      }
      else{

        currentUser =
          user;

        anonymousSession =
          user.isAnonymous === true;

      }


      /*
       * Never allow a user to chat with
       * themselves.
       */

      if(
        !targetId ||
        targetId === currentUser.uid
      ){

        targetName.textContent =
          "Invalid conversation";

        targetStatus.textContent =
          "";

        composer.style.display =
          "none";

        infoBar.textContent =
          "This conversation is not available.";

        return;

      }


      await loadTargetProfile();


      /*
       * Guests can browse profiles but
       * cannot receive the free opening
       * allowance.
       */

      if(anonymousSession){

        showGate("anonymous");

        messagesEl.innerHTML = `
          <div class="empty">
            <div>
              <i class="fa-solid fa-lock"
                 style="font-size:30px;margin-bottom:10px;color:#ed5798;"></i>
              <br>
              Log in or unlock chat to start messaging ❤️
            </div>
          </div>
        `;

        return;

      }


      await prepareRealConversation();


      composer.style.display =
        "flex";

      sendBtn.disabled =
        false;

  }
    catch(error){

      console.error(
        "CHAT OPEN ERROR:",
        error
      );


      targetName.textContent =
        "Kmeet could not open this conversation";

      targetStatus.textContent =
        "";

      infoBar.innerHTML =
        `<span class="error">
          ${escapeHtml(
            error?.message ||
            "Please try again."
          )}
        </span>`;

      composer.style.display =
        "none";

    }

  }
);


/* =========================================================
   GET TARGET FROM URL
========================================================= */

function getTargetFromUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
   * Support both:
   *
   * chat.html?userId=...
   *
   * and older:
   *
   * chat.html?user=...
   */

  return (
    params.get("userId") ||
    params.get("user") ||
    params.get("id") ||
    ""
  ).trim();

}


/* =========================================================
   START
========================================================= */

targetId =
  getTargetFromUrl();


if(!targetId){

  targetName.textContent =
    "Conversation unavailable";

  targetStatus.textContent =
    "";

  infoBar.textContent =
    "No member was selected for this conversation.";

  composer.style.display =
    "none";

  messagesEl.innerHTML = `
    <div class="empty">
      <div>
        <i class="fa-regular fa-circle-xmark"
           style="font-size:30px;margin-bottom:10px;color:#ed5798;"></i>
        <br>
        Please return to Discover and select a member.
      </div>
    </div>
  `;

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

      unsubscribeMessages = null;

    }

  }
);

</script>
