html,

body {

  background-repeat: no-repeat;

  overflow-x: hidden;
}

body::before {

  content: "";

  position: fixed;

  inset: 0;

  background:
    radial-gradient(
      circle at 18% 18%,
      rgba(255,190,210,.10),
      transparent 34%
    ),

      circle at 82% 78%,
      rgba(255,90,150,.10),
      transparent 36%
    );

  pointer-events: none;

  z-index: 0;
}

.page {

  min-height: 100vh;

  position: relative;

  z-index: 1;

  display: flex;
  flex-direction: column;
}

/* NAV */

.topbar {

  width: 100%;

  padding: 18px 22px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    rgba(15,8,15,.38);

  border-bottom:
    1px solid rgba(255,255,255,.14);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.brand {

  font-size: 24px;

  font-weight: 700;

  letter-spacing: .5px;
}

.brand span {
  color: #ff9ab9;
}

.back-btn {

  color: #fff;

  text-decoration: none;

  padding: 9px 15px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid rgba(255,255,255,.18);
}

/* CHAT */

.chat-shell {

  width:
    min(
      900px,
      calc(100% - 28px)
    );

  height:
    calc(100vh - 105px);

  min-height: 560px;

  margin: 18px auto;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background:
    rgba(25,12,23,.46);

  border:
    1px solid rgba(255,255,255,.20);

  border-radius: 26px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.42);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

/* HEADER */

.chat-header {

  padding: 16px 20px;

  display: flex;
  align-items: center;

  gap: 13px;

  background:
    rgba(10,5,10,.28);

  border-bottom:
    1px solid rgba(255,255,255,.13);
}

.avatar,
.avatar-fallback {

  width: 48px;
  height: 48px;

  border-radius: 50%;

  flex: 0 0 auto;
}

.avatar {

  object-fit: cover;

  background:
    rgba(255,255,255,.14);

  border:
    2px solid rgba(255,255,255,.3);
}

.avatar-fallback {

  display: grid;

  place-items: center;

  background:
    linear-gradient(
      135deg,
      #ff9ab9,
      #b85d82
    );

  font-weight: 700;

  font-size: 19px;

  border:
    2px solid rgba(255,255,255,.3);
}

.person-name {

  font-size: 18px;

  font-weight: 700;
}

.status {

  margin-top: 3px;

  font-size: 13px;

  color:
    rgba(255,255,255,.72);
}

/* MESSAGES */

.messages {

  flex: 1;

  overflow-y: auto;

  padding: 22px;

  display: flex;
  flex-direction: column;

  gap: 10px;

  scroll-behavior: smooth;
}

.message {

  max-width:
    min(72%,600px);

  padding:
    11px 14px;

  border-radius: 18px;

  line-height: 1.45;

  word-wrap: break-word;

  white-space: pre-wrap;

  box-shadow:
    0 5px 18px rgba(0,0,0,.12);
}

.message.mine {

  align-self: flex-end;

  background:

      rgba(225,94,137,.94),

}

.message.theirs {

  background:
    rgba(255,255,255,.15);

  border:
    1px solid rgba(255,255,255,.13);

  border-bottom-left-radius: 5px;
}

.empty {

  margin: auto;

  text-align: center;

  color:
    rgba(255,255,255,.72);

  max-width: 360px;

  line-height: 1.6;
}

/* COMPOSER */

.composer {

  padding: 14px;

  display: flex;

  gap: 10px;

  background:
    rgba(8,4,8,.35);

  border-top:
    1px solid rgba(255,255,255,.13);

.composer textarea {

  padding:

  border:

  border: 0;

  border-radius: 17px;

  color: #fff;

  font-weight: 700;

      #a9426d

    0 8px 22px rgba(150,47,88,.30);

  cursor: not-allowed;
}

  place-items: center;

  padding: 35px;

  text-align: center;
}

.gate-card {

/* =========================================================
   CONVERSATION ID
========================================================= */

function getConversationId() {

  if (
    !currentUser ||
    !targetId
  ) {

    return null;

  }

  const ids = [

    currentUser.uid,

    targetId

  ].sort();

  return (
    ids[0] +
    "_" +
    ids[1]
  );

}


/* =========================================================
   CONTACT DETECTION
========================================================= */

function containsContactInformation(
  text
) {

  const value =
    text.toLowerCase();

  const phonePattern =
    /(?:\+?254|0)?7\d{8}\b/;

  const emailPattern =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;

  const whatsappPattern =
    /\b(?:whatsapp|wa\.me)\b/i;

  const telegramPattern =
    /\btelegram\b/i;

  const instagramPattern =
    /\b(?:instagram|ig)\b/i;

  const facebookPattern =
    /\bfacebook\b/i;

  const contactWordsPattern =
    /\b(?:call me|text me|message me|my number|phone number|contact me|reach me)\b/i;

  return (
    phonePattern.test(value) ||
    emailPattern.test(value) ||
    whatsappPattern.test(value) ||
    telegramPattern.test(value) ||
    instagramPattern.test(value) ||
    facebookPattern.test(value) ||
    contactWordsPattern.test(value)
  );

}

  }


  const creditKey =
    "kmeet_sender_credits_" +
    currentUser.uid +
    "_" +
    targetId;


  const current =
    parseInt(
      localStorage.getItem(
        creditKey
      ) || "0",
      10
    );


  localStorage.setItem(
    creditKey,
    String(
      current +
      amount
    )
  );


  /*
    This is currently a local
    payment simulation.

    Daraja/M-Pesa will replace
    this step later.
  */

  returnToChat();

  infoBar.textContent =
    `You have ${current + amount} chat credits available.`;

}


/* =========================================================
   DEMO PAYMENT — RECEIVER
========================================================= */

function activateReceiverPayment() {

  if (
    !currentUser
  ) {

    showError(
      "Kmeet is still preparing your account. Please try again."
    );

    return;

  }


  const paidKey =
    "kmeet_receiver_paid_" +
    currentUser.uid +
    "_" +
    targetId;


  localStorage.setItem(
    paidKey,
    "true"
  );


  /*
    Daraja/M-Pesa will replace
    this local payment simulation.
  */

  returnToChat();

  infoBar.textContent =
    "Your receiver continuation access is active. ❤️";

}


/* =========================================================
   LOAD TARGET PROFILE
========================================================= */

async function loadTargetProfile() {

  if (
    !targetId
  ) {

    throw new Error(
      "No Kmeet profile was selected."
    );

  }


  /*
    DEMO PROFILE

    Discover contains local demonstration
    profiles. They do not exist in Firebase,
    so we must not call getDoc() for them.
  */

  if (
    targetId.startsWith(
      "demo-"
    )
  ) {

    const demo =
      demoProfiles[targetId];


    if (!demo) {

      throw new Error(
        "The selected Kmeet demo profile could not be found."
      );

    }


    targetProfile =
      {
        id:
          targetId,

        name:
          demo.name,

        photo:
          demo.photo

      };


    personName.textContent =
      demo.name;


    avatar.alt =
      demo.name;


    avatar.src =
      demo.photo;


    avatar.style.display =
      "block";


    avatarFallback.style.display =
      "none";


    return;

  }


  /*
    REAL FIREBASE PROFILE
  */

  const snap =
    await getDoc(
      doc(
        db,
        "users",
        targetId
      )
    );


  if (
    !snap.exists()
  ) {

    throw new Error(
      "The selected Kmeet profile could not be found."
    );

  }


  const data =
    snap.data();


  targetProfile =
    {
      id:
        targetId,

      name:
        data.displayName ||
        data.name ||
        "Kmeet Member",

      photo:
        data.photoURL ||
        data.photoUrl ||
        data.avatar ||
        data.profilePhoto ||
        data.profileImage ||
        data.image ||
        ""

    };


  personName.textContent =
    targetProfile.name;


  avatar.alt =
    targetProfile.name;


  if (
    targetProfile.photo
  ) {

    avatar.src =
      targetProfile.photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";

  } else {

    avatar.style.display =
      "none";

    avatarFallback.style.display =
      "grid";

    avatarFallback.textContent =
      targetProfile.name
        .charAt(0)
        .toUpperCase();

  }

}
