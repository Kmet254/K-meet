<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Kmeet - Chat</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/jpeg" href="kmeet-logo.jfif.jfif">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(135deg, rgba(35, 0, 15, 0.95), rgba(0, 0, 0, 0.97)),
        url("kmeet-background.jpg.jpg") center/cover fixed;
      color: white;
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav .logo {
      color: white;
      text-decoration: none;
      font-size: 28px;
      font-weight: 700;
    }

    .navlinks {
      display: flex;
      gap: 25px;
    }

    .navlinks a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .navlinks a:hover {
      color: #f19ab7;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 45px 20px;
      box-sizing: border-box;
    }

    .card {
      background: rgba(20, 0, 12, 0.84);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }

    .chatbox {
      padding: 30px;
    }

    #chatTitle {
      margin-top: 0;
      margin-bottom: 15px;
    }

    #chatNotice {
      background: rgba(255,255,255,0.08) !important;
      color: #f4dce5 !important;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .messages {
      height: 430px;
      overflow-y: auto;
      padding: 18px;
      margin: 20px 0;
      border-radius: 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bubble {
      max-width: 70%;
      padding: 11px 15px;
      margin: 8px 0;
      border-radius: 16px;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .bubble.me {
      margin-left: auto;
      background: #9d315d;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bubble.them {
      margin-right: auto;
      background: #3a2530;
      color: #f5e9ee;
      border-bottom-left-radius: 5px;
    }

    .chat-form {
      display: flex;
      gap: 10px;
    }

    .chat-form input {
      flex: 1;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      font-size: 15px;
    }

    .chat-form input:focus {
      border-color: #d96b91;
      box-shadow: 0 0 0 3px rgba(217,107,145,0.15);
    }

    .chat-form input::placeholder {
      color: #bbaeb4;
    }

    .chat-form .btn {
      padding: 0 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #9d315d, #d96b91);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .chat-form .btn:hover {
      opacity: 0.9;
    }

    .message {
      padding: 13px;
      border-radius: 10px;
    }

    .message.error {
      background: rgba(190,40,70,0.18);
      border: 1px solid rgba(220,80,110,0.4);
      color: #ffb7c7;
    }

    .message a {
      color: #f19ab7;
      font-weight: 700;
      text-decoration: none;
    }

    .message a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .nav {
        padding: 0 20px;
      }

      .nav .logo {
        font-size: 23px;
      }

      .navlinks {
        gap: 12px;
      }

      .chatbox {
        padding: 20px 15px;
      }

      .messages {
        height: 380px;
      }

      .chat-form {
        flex-direction: column;
      }

      .chat-form .btn {
        height: 48px;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <a class="logo" href="index.html">Kmeet</a>

    <div class="navlinks">
      <a href="discover.html">Discover</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>

  <main class="container">

    <section class="card chatbox">

      <div id="status" class="message">
        Checking chat access...
      </div>

      <div id="chatUI" style="display:none">

        <h2 id="chatTitle">Chat</h2>

        <div
          id="chatNotice"
          style="
            margin:12px 0;
            padding:12px;
            border-radius:10px;
            background:#f7edf1;
            color:#5a2036;
            font-size:14px;
            line-height:1.5;
          ">
        </div>

        <div id="messages" class="messages"></div>

        <form id="chatForm" class="chat-form">

          <input
            id="messageInput"
            maxlength="1000"
            autocomplete="off"
            placeholder="Write a message..."
            required
          >

          <button class="btn" type="submit">
            Send
          </button>

        </form>

      </div>

    </section>

  </main>

<script type="module">

import {
  auth,
  db,
  onAuthStateChanged,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "./firebase-config.js";


/* =====================================================
   KMEET CHAT SETTINGS
===================================================== */

const FREE_OPENING_MESSAGES = [
  "hi",
  "hey"
];

const FREE_RECEIVER_REPLIES = 3;

const RECEIVER_CONTINUATION_FEE = 11;

const SENDER_PACK_3_PRICE = 49;
const SENDER_PACK_8_PRICE = 100;


/* =====================================================
   PAGE VARIABLES
===================================================== */

const targetId =
  new URLSearchParams(location.search).get("userId");

let currentUser = null;

let conversationId = null;
let messagesRef = null;

let conversationData = null;


/* =====================================================
   START CHAT
===================================================== */

if (!targetId) {

  showStatus(
    "No chat profile was selected.",
    true
  );

} else {

  onAuthStateChanged(auth, async user => {

    try {

      /*
       * Kmeet chat requires a registered
       * logged-in Firebase account.
       */

      if (!user) {

        showStatus(
          `Please log in to use Kmeet chat.
          <br><br>
          <a href="login.html">Log In</a>`,
          true
        );

        return;
      }

      currentUser = user;


      if (currentUser.uid === targetId) {

        showStatus(
          "You cannot chat with your own profile.",
          true
        );

        return;
      }


      await openChat();

    } catch (err) {

      console.error(err);

      showStatus(
        "Could not start chat: " + err.message,
        true
      );

    }

  });

}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat() {

  const targetSnap =
    await getDoc(
      doc(db, "users", targetId)
    );


  const target =
    targetSnap.exists()
      ? targetSnap.data()
      : { name: "Kmeet Member" };


  document.getElementById("chatTitle").textContent =
    `Chat with ${target.name || "Kmeet Member"}`;


  conversationId =
    [currentUser.uid, targetId]
      .sort()
      .join("_");


  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );


  const conversationSnap =
    await getDoc(conversationRef);


  /*
   * The first person who opens the conversation
   * becomes the initiator.
   */

  if (!conversationSnap.exists()) {

    conversationData = {

      initiatorId: currentUser.uid,

      receiverId: targetId,

      senderCredits: 0,

      receiverFreeReplies: 0,

      receiverPaid: false,

      createdAt: serverTimestamp()

    };


    await setDoc(
      conversationRef,
      conversationData
    );

  } else {

    conversationData =
      conversationSnap.data();

  }


  messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  document.getElementById("status").style.display =
    "none";

  document.getElementById("chatUI").style.display =
    "block";


  updateChatNotice();

  listenForMessages();

}


/* =====================================================
   LISTEN FOR MESSAGES
===================================================== */

function listenForMessages() {

  const q =
    query(
      messagesRef,
      orderBy("createdAt", "asc")
    );


  onSnapshot(
    q,

    snapshot => {

      const box =
        document.getElementById("messages");


      box.innerHTML = "";


      let receiverReplies = 0;


      snapshot.forEach(s => {

        const m = s.data();


        const mine =
          m.senderId === currentUser.uid;


        if (
          m.senderId === conversationData.receiverId
        ) {

          receiverReplies++;

        }


        const div =
          document.createElement("div");


        div.className =
          `bubble ${mine ? "me" : "them"}`;


        div.textContent =
          m.text || "";


        box.appendChild(div);

      });


      conversationData.receiverFreeReplies =
        receiverReplies;


      updateChatNotice();


      box.scrollTop =
        box.scrollHeight;

    },

    err => {

      console.error(err);

      showStatus(
        "Could not load messages: " +
        err.message,
        true
      );

    }
  );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

document
  .getElementById("chatForm")
  .addEventListener("submit", async e => {

    e.preventDefault();


    const input =
      document.getElementById("messageInput");


    const text =
      input.value.trim();


    if (!text) return;


    try {

      await sendMessage(text);

    } catch (err) {

      console.error(err);

      alert(
        "Message could not be sent: " +
        err.message
      );

    }

  });


/* =====================================================
   MESSAGE RULES
===================================================== */

async function sendMessage(text) {

  const isInitiator =
    currentUser.uid ===
    conversationData.initiatorId;


  const isReceiver =
    currentUser.uid ===
    conversationData.receiverId;


  /* ===================================================
     RECEIVER RULES
  =================================================== */

  if (isReceiver) {

    const contactAttempt =
      containsContactInformation(text);


    if (
      contactAttempt &&
      conversationData.receiverPaid !== true
    ) {

      alert(
        "This message was declined because it appears to contain contact information.\n\n" +
        "Pay KSh " +
        RECEIVER_CONTINUATION_FEE +
        " to continue."
      );

      return;

    }


    const replyCount =
      Number(
        conversationData.receiverFreeReplies || 0
      );


    if (
      replyCount >= FREE_RECEIVER_REPLIES &&
      conversationData.receiverPaid !== true
    ) {

      alert(
        "Your 3 free replies have been used.\n\n" +
        "Pay KSh " +
        RECEIVER_CONTINUATION_FEE +
        " to continue the conversation."
      );

      return;

    }

  }


  /* ===================================================
     SENDER RULES
  =================================================== */

  if (isInitiator) {

    const firstMessage =
      await isFirstMessage();


    if (firstMessage) {

      if (
        !FREE_OPENING_MESSAGES.includes(
          text.toLowerCase()
        )
      ) {

        alert(
          "Your first message is free only when it is \"Hi\" or \"Hey\".\n\n" +
          "After the free opening message, you need chat credits."
        );

        return;

      }

    } else {

      const credits =
        Number(
          conversationData.senderCredits || 0
        );


      if (credits <= 0) {

        alert(
          "You have no chat credits remaining.\n\n" +
          "Get 3 chats for KSh " +
          SENDER_PACK_3_PRICE +
          " or 8 chats for KSh " +
          SENDER_PACK_8_PRICE +
          "."
        );

        return;

      }

    }

  }


  /* ===================================================
     SAVE MESSAGE
  =================================================== */

  await addDoc(
    messagesRef,
    {

      senderId:
        currentUser.uid,

      targetId:
        targetId,

      text:
        text,

      createdAt:
        serverTimestamp()

    }
  );


  input.value = "";

  updateChatNotice();

}


/* =====================================================
   CHECK FIRST MESSAGE
===================================================== */

async function isFirstMessage() {

  return await new Promise(resolve => {

    const unsubscribe =
      onSnapshot(

        query(
          messagesRef,
          orderBy("createdAt", "asc")
        ),

        snapshot => {

          unsubscribe();

          resolve(
            snapshot.empty
          );

        },

        error => {

          console.error(error);

          unsubscribe();

          resolve(true);

        }

      );

  });

}


/* =====================================================
   CONTACT INFORMATION DETECTION
===================================================== */

function containsContactInformation(text) {

  const value =
    text
      .toLowerCase()
      .trim();


  const phonePattern =
    /(?:\+?254|0)?[\s.-]?(?:7\d{2}|1\d{2})[\s.-]?\d{3}[\s.-]?\d{3}/;


  const emailPattern =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;


  const contactWords =
    /\b(?:whatsapp|telegram|instagram|facebook|snapchat|tiktok|signal|imo|skype)\b/i;


  const contactPhrases =
    /\b(?:call me|text me|message me|contact me|reach me|my number|my phone|phone me|email me|dm me)\b/i;


  const linkPattern =
    /(?:https?:\/\/|www\.|t\.me\/|wa\.me\/|instagram\.com\/|facebook\.com\/)/i;


  return (
    phonePattern.test(value) ||
    emailPattern.test(value) ||
    contactWords.test(value) ||
    contactPhrases.test(value) ||
    linkPattern.test(value)
  );

}


/* =====================================================
   CHAT NOTICE
===================================================== */

function updateChatNotice() {

  const notice =
    document.getElementById("chatNotice");


  if (!notice || !conversationData) return;


  const isInitiator =
    currentUser.uid ===
    conversationData.initiatorId;


  const isReceiver =
    currentUser.uid ===
    conversationData.receiverId;


  if (isInitiator) {

    const credits =
      Number(
        conversationData.senderCredits || 0
      );


    notice.innerHTML =
      `Your first <strong>Hi</strong> or <strong>Hey</strong> is free.
       After that, you need chat credits.
       Current credits: <strong>${credits}</strong>.`;

  }


  else if (isReceiver) {

    const replies =
      Number(
        conversationData.receiverFreeReplies || 0
      );


    const remaining =
      Math.max(
        0,
        FREE_RECEIVER_REPLIES - replies
      );


    if (
      conversationData.receiverPaid === true
    ) {

      notice.innerHTML =
        `Receiver continuation is unlocked.`;

    } else {

      notice.innerHTML =
        `You have <strong>${remaining}</strong>
         free response${remaining === 1 ? "" : "s"} remaining.
         Contact information requires the
         <strong>KSh ${RECEIVER_CONTINUATION_FEE}</strong>
         continuation payment.`;

    }

  }

}


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(html, error) {

  const el =
    document.getElementById("status");


  el.className =
    error
      ? "message error"
      : "message";


  el.innerHTML =
    html;

}

</script>

</body>
</html>
