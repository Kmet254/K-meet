<script>
/* KMEET DEMO CHAT: works even if Firebase module fails to load. */
(function(){
  const params=new URLSearchParams(window.location.search);
  const targetId=params.get("userId")||params.get("user");
  const isDemo=/^demo-\d+$/.test(targetId||"");

  if(!isDemo)return;

  function key(){
    return "kmeet_demo_chat_"+targetId;
  }

  function sendDemo(){

    const input=
      document.getElementById("messageInput");

    const box=
      document.getElementById("messages");

    const info=
      document.getElementById("infoBar");

    if(!input || !box)return;

    const text=
      input.value.trim();

    if(!text)return;

    const saved=
      JSON.parse(
        localStorage.getItem(key()) || "[]"
      );

    saved.push({
      text:text,
      createdAt:new Date().toISOString()
    });

    localStorage.setItem(
      key(),
      JSON.stringify(saved)
    );

    const empty=
      box.querySelector(".empty");

    if(empty)empty.remove();

    const bubble=
      document.createElement("div");

    bubble.className="message mine";
    bubble.textContent=text;

    box.appendChild(bubble);

    box.scrollTop=
      box.scrollHeight;

    input.value="";
    input.focus();

    if(info){
      info.textContent=
        "Your message has been sent ❤️";
    }
  }

  document.addEventListener(
    "DOMContentLoaded",
    function(){

      const button=
        document.getElementById("sendBtn");

      const input=
        document.getElementById("messageInput");

      if(!button || !input)return;

      button.addEventListener(
        "click",
        function(event){

          event.preventDefault();
          event.stopImmediatePropagation();

          sendDemo();
        },
        true
      );

      input.addEventListener(
        "keydown",
        function(event){

          if(
            event.key==="Enter" &&
            !event.shiftKey
          ){

            event.preventDefault();
            event.stopImmediatePropagation();

            sendDemo();
          }

        },
        true
      );

    },
    {once:true}
  );

})();
</script>
