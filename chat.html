<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet — Chat</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;

  background:
    linear-gradient(
      rgba(10,5,10,.45),
      rgba(10,5,10,.70)
    ),
    url("chat.jpg");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;

  background:
    radial-gradient(
      circle at 18% 18%,
      rgba(255,190,210,.10),
      transparent 34%
    ),
    radial-gradient(
      circle at 82% 78%,
      rgba(255,90,150,.10),
      transparent 36%
    );
}

.page{
  min-height:100vh;
  position:relative;
  z-index:1;

  display:flex;
  flex-direction:column;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  width:100%;

  padding:14px 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(15,8,15,.38);

  border-bottom:
    1px solid
    rgba(255,255,255,.14);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.brand-link{
  display:flex;
  align-items:center;
  gap:9px;

  color:#fff;
  text-decoration:none;
}

.brand-logo{
  width:38px;
  height:38px;

  border-radius:50%;

  object-fit:cover;

  border:
    1px solid
    rgba(255,255,255,.24);

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.25);
}

.brand{
  font-size:24px;
  font-weight:700;
  letter-spacing:.5px;
}

.brand span{
  color:#ff9ab9;
}

.back-btn{
  color:#fff;
  text-decoration:none;

  padding:9px 15px;

  border-radius:999px;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid
    rgba(255,255,255,.18);

  transition:.2s ease;
}

.back-btn:hover{
  background:
    rgba(255,255,255,.20);
}


/* =====================================================
   CHAT CONTAINER
===================================================== */

.chat-shell{
  width:min(
    900px,
    calc(100% - 28px)
  );

  height:calc(100vh - 105px);

  min-height:560px;

  margin:18px auto;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:
    rgba(25,12,23,.46);

  border:
    1px solid
    rgba(255,255,255,.20);

  border-radius:26px;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.42);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header{
  padding:16px 20px;

  display:flex;
  align-items:center;

  gap:13px;

  background:
    rgba(10,5,10,.28);

  border-bottom:
    1px solid
    rgba(255,255,255,.13);
}

.avatar,
.avatar-fallback{
  width:48px;
  height:48px;

  border-radius:50%;

  flex:0 0 auto;
}

.avatar{
  object-fit:cover;

  background:
    rgba(255,255,255,.14);

  border:
    2px solid
    rgba(255,255,255,.30);
}

.avatar-fallback{
  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #ff9ab9,
      #b85d82
    );

  font-weight:700;
  font-size:19px;

  border:
    2px solid
    rgba(255,255,255,.30);
}

.person-name{
  font-size:18px;
  font-weight:700;
}

.status{
  margin-top:3px;

  font-size:13px;

  color:
    rgba(255,255,255,.72);
}


/* =====================================================
   INFO BAR
===================================================== */

.info-bar{
  padding:8px 14px;

  text-align:center;

  color:
    rgba(255,255,255,.70);

  font-size:11px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
  flex:1;

  overflow-y:auto;

  padding:22px;

  display:flex;
  flex-direction:column;

  gap:10px;

  scroll-behavior:smooth;
}

.message{
  max-width:
    min(72%,600px);

  padding:11px 14px;

  border-radius:18px;

  line-height:1.45;

  word-wrap:break-word;

  white-space:pre-wrap;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.12);
}

.message.mine{
  align-self:flex-end;

  background:
    linear-gradient(
      135deg,
      rgba(225,94,137,.94),
      rgba(164,64,105,.94)
    );

  border-bottom-right-radius:5px;
}

.message.theirs{
  align-self:flex-start;

  background:
    rgba(255,255,255,.15);

  border:
    1px solid
    rgba(255,255,255,.13);

  border-bottom-left-radius:5px;
}


/* =====================================================
   SENT STATUS
===================================================== */

.message-status{
  margin-top:5px;

  font-size:10px;

  text-align:right;

  color:
    rgba(255,255,255,.72);

  letter-spacing:.1px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  margin:auto;

  text-align:center;

  color:
    rgba(255,255,255,.72);

  max-width:360px;

  line-height:1.6;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer{
  padding:14px;

  display:flex;

  gap:10px;

  background:
    rgba(8,4,8,.35);

  border-top:
    1px solid
    rgba(255,255,255,.13);
}

.composer textarea{
  flex:1;

  resize:none;

  min-height:48px;
  max-height:130px;

  padding:13px 15px;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius:17px;

  outline:none;

  color:#fff;

  background:
    rgba(255,255,255,.10);

  font:inherit;
}

.composer textarea:focus{
  border-color:
    rgba(255,154,185,.60);

  background:
    rgba(255,255,255,.13);
}

.composer textarea::placeholder{
  color:
    rgba(255,255,255,.62);
}

.send-btn{
  padding:0 21px;

  min-width:78px;

  cursor:pointer;

  border:0;

  border-radius:17px;

  color:#fff;

  font-weight:700;

  background:
    linear-gradient(
      135deg,
      #e66a94,
      #a9426d
    );

  box-shadow:
    0 8px 22px
    rgba(150,47,88,.30);

  transition:.2s ease;
}

.send-btn:hover{
  transform:translateY(-1px);

  box-shadow:
    0 10px 25px
    rgba(150,47,88,.40);
}

.send-btn:disabled{
  opacity:.55;

  cursor:not-allowed;

  transform:none;
}


/* =====================================================
   PAYMENT GATE
===================================================== */

.gate{
  flex:1;

  display:grid;

  place-items:center;

  padding:35px;

  text-align:center;
}

.gate-card{
  width:min(
    560px,
    100%
  );

  padding:36px 30px;

  border-radius:24px;

  background:
    rgba(15,7,14,.58);

  border:
    1px solid
    rgba(255,255,255,.17);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.30);

}

.gate-icon{
  font-size:42px;

  margin-bottom:10px;
}

.gate-card h2{
  margin:0 0 10px;

  font-size:27px;
}

.gate-card p{
  margin:0 auto 22px;

  max-width:450px;

  color:

  line-height:1.6;
}

.gate-buttons{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:10px;
}

.pay-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-width:145px;

  padding:13px 20px;

  border-radius:999px;

  text-decoration:none;

  color:#fff;

  font-weight:700;

  background:
    linear-gradient(

      #e66a94,
      #a9426d
    );

  border:0;

  cursor:pointer;

  box-shadow:
    0 8px 22px

}

.secondary-btn{
  background:
    rgba(255,255,255,.10);

  border:
    1px solid
    rgba(255,255,255,.18);
}


/* =====================================================
   ERROR
===================================================== */

.error{
  color:#ffd0d8;

  background:
    rgba(150,30,55,.30);

  border:
    1px solid
    rgba(255,150,170,.22);

  padding:12px 14px;

  border-radius:12px;

  margin:14px;

  display:none;

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

  .topbar{
    padding:12px 15px;
  }

  .brand{
    font-size:21px;
  }

  .brand-logo{

    height:34px;
  }

  .chat-shell{
    width:

    margin:6px auto;

    border-radius:20px;
  }

  .messages{

  }

  .message{

  }

  .composer{
    padding:10px;
  }

  .send-btn{
    min-width:64px;

    padding:0 14px;
  }

     TOP BAR
===================================================== -->

<header class="topbar">

        </div>

    </div>


    <!-- INFO -->

    <!-- MESSAGES -->

       PAYMENT GATE
  ================================================== -->

    id="gate"
    class="gate"

      <p id="gateText">
        Continue chatting with Kmeet credits.
      </p>


      <div
        id="gateButtons"
        class="gate-buttons"
      ></div>

    </div>

  </section>

</main>

</div>

/* =====================================================
   ERROR
===================================================== */

function showError(message){

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

}


function clearError(){

  errorBox.textContent =
    "";

  errorBox.style.display =

/* =====================================================
   SENDER CREDIT STORAGE
===================================================== */

function senderCreditKey(){

  return (
    "kmeet_sender_credits_" +
    currentUser.uid +
    "_" +
    targetId
  );

}


function receiverPaidKey(){

  return (
    "kmeet_receiver_paid_" +
    currentUser.uid +
    "_" +
    targetId
  );

}


function getSenderCredits(){

  return (
    parseInt(
      localStorage.getItem(
        senderCreditKey()
      ) || "0",
      10
    ) || 0
  );

}


function setSenderCredits(value){

  localStorage.setItem(

    senderCreditKey(),

    String(
      Math.max(
        0,
        value
      )
    )

  );

}


function receiverHasPaid(){

  return (
    localStorage.getItem(
      receiverPaidKey()
    ) === "true"
  );

}



/* =====================================================
   CONVERSATION ID
===================================================== */

function getConversationId(){

  return [

    currentUser.uid,

    targetId

  ].sort().join("_");

}



/* =====================================================
   DEMO MESSAGE STORAGE
===================================================== */

function demoMessageKey(){

  /*
    IMPORTANT:

    Do NOT include currentUser.uid.

    Anonymous Firebase users can receive
    a different UID after a new session.

    The demo conversation therefore uses
    the profile ID only.
  */

  return (
    "kmeet_demo_chat_" +
    targetId
  );

}


function getDemoMessages(){

  try{

    const saved =
      JSON.parse(

        localStorage.getItem(
          demoMessageKey()
        ) || "[]"

      );


    return Array.isArray(saved)
      ? saved
      : [];

  }

  catch(error){

    console.warn(
      "Could not read saved demo messages:",
      error
    );

    return [];

  }

}


function saveDemoMessages(items){

  try{

    localStorage.setItem(

      demoMessageKey(),

      JSON.stringify(items)

    );

  }

  catch(error){

    console.warn(
      "Could not save demo messages:",
      error
    );

  }

}



/* =====================================================
   DEMO MESSAGE RENDERING
===================================================== */

function renderDemoMessages(
  items = demoMessages
){

  messages.innerHTML = "";


  if(!items.length){

    messages.innerHTML = `

      <div class="empty">

        Start the conversation
        and let the connection grow. ❤️

      </div>

    `;

    return;

  }


  items.forEach(
    data => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "message mine";


      const text =
        document.createElement(
          "div"
        );

      text.textContent =
        data.text || "";


      const status =
        document.createElement(
          "div"
        );

      status.className =
        "message-status";

      status.textContent =
        "Sent ✓";


      wrapper.appendChild(
        text
      );

      wrapper.appendChild(
        status
      );


      messages.appendChild(
        wrapper
      );

    }
  );


  messages.scrollTop =
    messages.scrollHeight;

}



/* =====================================================
   CONTACT INFORMATION DETECTION
===================================================== */

function containsContactInformation(
  text
){

  const value =
    String(text)
      .toLowerCase()
      .trim();


  if(
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i
      .test(value)
  ){

    return true;

  }


  if(
    /(?:\+?254[\s-]?(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3,4})|(?:0(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3})/i
      .test(value)
  ){

    return true;

  }


  if(
    /\b(whatsapp|whats\s*app|call me|text me|message me|contact me|my number|phone number|email me|dm me|instagram|telegram|facebook)\b/i
      .test(value)
  ){

    return true;

  }


  if(
    /(?:^|\s)@[a-z0-9_.]{3,}/i
      .test(value)
  ){

    return true;

  }


  return false;

}



/* =====================================================
   LOAD TARGET PROFILE
===================================================== */

async function loadTargetProfile(){

  if(!targetId){

    throw new Error(
      "No Kmeet profile was selected."
    );

  }


  targetIsDemo =
    Object.prototype.hasOwnProperty.call(
      demoProfiles,
      targetId
    );


  /* ===================================================
     DEMO PROFILE
  =================================================== */

  if(targetIsDemo){

    const demo =
      demoProfiles[targetId];


    personName.textContent =
      demo.name;


    personStatus.textContent =
      "Kmeet connection";


    avatarFallback.textContent =
      demo.name
        .charAt(0)
        .toUpperCase();


    avatar.src =
      demo.photo;


    avatar.style.display =
      "block";


    avatarFallback.style.display =
      "none";


    /*
      IMPORTANT:
      Load previously sent demo messages.
    */

    demoMessages =
      getDemoMessages();


    renderDemoMessages(
      demoMessages
    );


    return;

  }



  /* ===================================================
     REAL FIREBASE PROFILE
  =================================================== */

  const snap =
    await getDoc(
      doc(
        db,
        "users",
        targetId
      )
    );


  if(!snap.exists()){

    throw new Error(
      "The selected Kmeet profile could not be found."
    );

  }


  const data =
    snap.data() || {};


  const name =
    data.name ||
    data.username ||
    data.displayName ||
    "Kmeet Member";


  personName.textContent =
    name;


  avatarFallback.textContent =
    name
      .charAt(0)
      .toUpperCase();


  const photo =
    data.photoURL ||
    data.photoUrl ||
    data.avatar ||
    data.profilePhoto ||
    data.profileImage ||
    data.image ||
    "";


  if(photo){

    avatar.src =
      photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";

  }

}

/* =====================================================
   REAL CONVERSATION MESSAGES
===================================================== */

async function getExistingMessages(){

  if(!conversationId){

    conversationId =
      getConversationId();

  }


  const snap =
    await getDocs(

      query(

        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),

        orderBy(
          "createdAt",
          "asc"
        )

      )

    );


  return snap.docs.map(
    item =>
      item.data()
  );

}



/* =====================================================
   RENDER REAL MESSAGES
===================================================== */

function renderMessages(items){

  messages.innerHTML =
    "";


  if(!items.length){

    messages.innerHTML = `

      <div class="empty">

        Start the conversation
        and let the connection grow. ❤️

      </div>

    `;

    return;

  }


  items.forEach(
    data => {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "message " +
        (
          data.senderId ===
          currentUser.uid
            ? "mine"
            : "theirs"
        );


      const text =
        document.createElement(
          "div"
        );

      text.textContent =
        data.text || "";


      wrapper.appendChild(
        text
      );


      messages.appendChild(
        wrapper
      );

    }
  );


  messages.scrollTop =
    messages.scrollHeight;

}



/* =====================================================
   FIREBASE REAL CHAT LISTENER
===================================================== */

function startMessages(){

  if(
    !currentUser ||
    currentUser.isAnonymous ||
    targetIsDemo
  ){

    return;

  }


  conversationId =
    getConversationId();


  const ref =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const q =
    query(
      ref,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      q,

      snapshot => {

        const items =
          snapshot.docs.map(
            item =>
              item.data()
          );


        renderMessages(
          items
        );


        if(!items.length){

          infoBar.textContent =
            "Your opening message is free — say hi or hey ❤️";

          return;

        }


        const firstSenderId =
          items[0].senderId;


        const myReplies =
          items.filter(
            item =>
              item.senderId ===
              currentUser.uid
          ).length;


        if(
          firstSenderId ===
          currentUser.uid
        ){

          infoBar.textContent =
            "Your opening message is free. Further messages use chat credits.";

        }

        else{

          infoBar.textContent =
            `You have ${
              Math.max(
                0,
                FREE_RECEIVER_REPLIES -
                myReplies
              )
            } free replies remaining.`;

        }

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );


        showError(
          "The chat interface is open, but messages could not be loaded. Please check your Firebase Firestore rules."
        );

      }

    );

}



/* =====================================================
   FIREBASE AUTHENTICATION
===================================================== */

async function initialiseAuth(){

  if(authStarted){

    return;

  }


  authStarted =
    true;


  onAuthStateChanged(

    auth,

    async user => {

      try{

        if(!user){

          await signInAnonymously(
            auth
          );

          return;

        }


        currentUser =
          user;


        conversationId =
          getConversationId();


        clearError();


        /* =============================================
           ANONYMOUS USER
        ============================================= */

        if(user.isAnonymous){

          const credits =
            getSenderCredits();


          /*
            Anonymous users can explore
            and open demo chat.

            But they must have paid
            chat credits before sending.
          */

          infoBar.textContent =
            credits > 0

              ? `Anonymous chat: ${credits} paid chat credit${
                  credits === 1
                    ? ""
                    : "s"
                } available.`

              : "Anonymous chat: payment is required before your first message.";


          showChat();


          /*
            Important:
            Do NOT erase demoMessages here.

            loadTargetProfile() already
            loaded them from localStorage.
          */

          /*
            DEMO CHAT FIX

            The demo conversation is stored in localStorage and was
            already loaded by loadTargetProfile(). Do not re-render it
            from the Firebase auth callback, because authentication can
            fire after the message is displayed.
          */

          if(targetIsDemo){
            demoMessages = getDemoMessages();
          }

          return;

        }



        /* =============================================
           REGISTERED USER
        ============================================= */

        infoBar.textContent =
          "Your opening message is free — say hi or hey ❤️";


        showChat();


        if(!targetIsDemo){

          startMessages();

        }


        /*
          For demo profiles, reload the
          locally saved conversation without
          replacing it with an empty array.
        */

        /*
          DEMO CHAT FIX

          Do not re-render the demo message area from the Firebase
          auth callback. The demo chat is localStorage-based and was
          already loaded by loadTargetProfile().
        */

        if(targetIsDemo){
          demoMessages = getDemoMessages();
        }

      }

      catch(error){

        console.error(
          "Kmeet authentication error:",
          error
        );


        if(
          error.code ===
          "auth/operation-not-allowed"
        ){

          showError(
            "Anonymous Authentication is not enabled in Firebase. Enable Authentication → Sign-in method → Anonymous."
          );

        }

        else{

          showError(
            "Kmeet could not start the chat session (" +
            (
              error.code ||
              "authentication error"
            ) +
            "). Please check your Firebase Authentication settings."
          );

        }

      }

    }

  );

}



/* =====================================================
   SEND MESSAGE
===================================================== */

composer.addEventListener(

  "submit",

  async event => {

    event.preventDefault();


    clearError();


    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    if(!currentUser){

      showError(
        "Kmeet is still preparing your chat session. Please try again in a moment."
      );

      return;

    }



    /* ================================================
       DEMO PROFILE
    ================================================ */

    if(targetIsDemo){

      /*
        Anonymous visitors still need
        paid chat credits.
      */

      if(
        currentUser.isAnonymous &&
        getSenderCredits() <= 0
      ){

        showGate(
          "anonymous"
        );

        return;

      }


      /*
        If an anonymous user has paid
        credits, consume one credit.
      */

      let anonymousCreditUsed =
        false;

      let creditsBefore =
        0;


      if(
        currentUser.isAnonymous
      ){

        creditsBefore =
          getSenderCredits();


        if(
          creditsBefore <= 0
        ){

          showGate(
            "anonymous"
          );

          return;

        }


        setSenderCredits(
          creditsBefore - 1
        );


        anonymousCreditUsed =
          true;

      }


      /*
        CREATE THE MESSAGE FIRST.

        It appears immediately in the
        chat window as the user's own
        message.
      */

      /*
        Always start from the latest saved demo conversation.
        This prevents an older in-memory array from overwriting a
        message that was already stored in localStorage.
      */

      demoMessages =
        getDemoMessages();


      const newMessage = {

        text:text,

        createdAt:
          new Date().toISOString()

      };


      demoMessages.push(
        newMessage
      );


      /*
        Save BEFORE clearing the
        composer.

        This prevents the message
        from disappearing.
      */

      saveDemoMessages(
        demoMessages
      );


      /*
        Read the saved list back before rendering.
        This guarantees that what appears on screen is exactly what
        was persisted.
      */

      demoMessages =
        getDemoMessages();


      renderDemoMessages(
        demoMessages
      );


      /*
        Clear the composer.
      */

      messageInput.value =
        "";

      messageInput.focus();


      /*
        Natural confirmation.
        No fake reply.
      */

      if(
        currentUser.isAnonymous
      ){

        const remaining =
          getSenderCredits();


        infoBar.textContent =
          `Your message has been sent ❤️ ${
            remaining > 0
              ? `• ${remaining} chat credit${
                  remaining === 1
                    ? ""
                    : "s"
                } remaining`
              : ""
          }`;

      }

      else{

        infoBar.textContent =
          "Your message has been sent ❤️";

      }


      return;

    }



    /* ================================================
       REAL MEMBER CHAT
    ================================================ */

    if(
      currentUser.isAnonymous &&
      getSenderCredits() <= 0
    ){

      showGate(
        "anonymous"
      );

      return;

    }


    if(!conversationId){

      conversationId =
        getConversationId();

    }


    let existingMessages = [];


    try{

      existingMessages =
        await getExistingMessages();

    }

    catch(error){

      console.error(
        "Conversation read failed:",
        error
      );


      showError(
        "Kmeet could not check this conversation. Please check your Firestore rules and try again."
      );

      return;

    }



    /* ================================================
       FIRST OPENING MESSAGE
    ================================================ */

    if(
      !currentUser.isAnonymous &&
      existingMessages.length === 0
    ){

      const opening =
        text.toLowerCase();


      if(
        !FREE_OPENING_MESSAGES.includes(
          opening
        )
      ){

        showGate(
          "sender"
        );

        return;

      }

    }



    /* ================================================
       WHO STARTED THE CONVERSATION?
    ================================================ */

    const originalSenderId =
      existingMessages.length

        ? existingMessages[0].senderId

        : currentUser.uid;


    const isSender =
      originalSenderId ===
      currentUser.uid;



    /* ================================================
       CONTACT INFORMATION
    ================================================ */

    if(
      containsContactInformation(
        text
      )
    ){

      if(!isSender){

        showGate(
          "receiver"
        );

        return;

      }


      showGate(
        "sender"
      );

      return;

    }



    /* ================================================
       SENDER CREDITS
    ================================================ */

    let creditConsumed =
      false;

    let creditsBefore =
      0;


    if(
      isSender &&
      (
        existingMessages.length > 0 ||
        currentUser.isAnonymous
      )
    ){

      creditsBefore =
        getSenderCredits();


      if(
        creditsBefore <= 0
      ){

        showGate(
          "sender"
        );

        return;

      }


      setSenderCredits(
        creditsBefore - 1
      );


      creditConsumed =
        true;

    }



    /* ================================================
       RECEIVER FREE REPLIES
    ================================================ */

    if(!isSender){

      const receiverReplies =
        existingMessages.filter(
          item =>
            item.senderId ===
            currentUser.uid
        ).length;


      if(
        receiverReplies >=
          FREE_RECEIVER_REPLIES &&
        !receiverHasPaid()
      ){

        showGate(
          "receiver"
        );

        return;

      }

    }



    /* ================================================
       SEND
    ================================================ */

    sendBtn.disabled =
      true;


    try{

      await setDoc(

        doc(
          db,
          "conversations",
          conversationId
        ),

        {

          initiatorId:
            originalSenderId,

          receiverId:
            targetId,

          updatedAt:
            serverTimestamp(),

          createdAt:
            serverTimestamp()

        },

        {
          merge:true
        }

      );


      await addDoc(

        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),

        {

          senderId:
            currentUser.uid,

          receiverId:
            targetId,

          text:text,

          createdAt:
            serverTimestamp()

        }

      );


      messageInput.value =
        "";

      messageInput.focus();


      if(
        currentUser.isAnonymous
      ){

        const remaining =
          getSenderCredits();


        infoBar.textContent =
          `Anonymous chat: ${remaining} paid chat credit${
            remaining === 1
              ? ""
              : "s"
          } remaining.`;

      }

    }

    catch(error){

      console.error(
        "Message send failed:",
        error
      );


      /*
        Restore the credit if
        Firebase sending failed.
      */

      if(creditConsumed){

        setSenderCredits(
          creditsBefore
        );

      }


      showError(
        "Your message could not be sent. Please check your Firestore rules."
      );

    }

    finally{

      sendBtn.disabled =
        false;

    }

  }

);



/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(

  "keydown",

  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      composer.requestSubmit();

    }

  }

);



/* =====================================================
   START CHAT
===================================================== */

async function start(){

  if(!targetId){

    showError(
      "No profile was selected for this chat."
    );

    sendBtn.disabled =
      true;

    return;

  }


  try{

    /*
      Load the selected profile first.
    */

    await loadTargetProfile();


    /*
      Then start Firebase authentication.
    */

    initialiseAuth();

  }

  catch(error){

    console.error(
      error
    );


    showError(
      error.message ||
      "Unable to load the selected profile."
    );

  }

}



/* =====================================================
   START
===================================================== */

start();



/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(

  "beforeunload",

  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }

);

</script>
