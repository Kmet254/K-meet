/* =========================================================
   CONVERSATION ID
========================================================= */

function getConversationId(){

  if(!currentUser || !targetId){
    return null;
  }

  const ids = [
    currentUser.uid,
    targetId
  ].sort();

  return ids[0] + "_" + ids[1];

}


/* =========================================================
   PROFILE
========================================================= */

async function loadTarget(){

  if(!targetId){

    showTargetProfile({
      displayName:"Kmeet Member"
    });

    return;

  }


  if(demoProfiles[targetId]){

    targetIsDemo = true;

    showTargetProfile(
      demoProfiles[targetId]
    );

    return;

  }


  targetIsDemo = false;


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          targetId
        )
      );


    if(snap.exists()){

      showTargetProfile(
        snap.data()
      );

    }else{

      showTargetProfile({
        displayName:"Kmeet Member"
      });

    }

  }catch(error){

    console.error(
      "TARGET PROFILE ERROR:",
      error
    );

    showTargetProfile({
      displayName:"Kmeet Member"
    });

  }

}


function showTargetProfile(profile){

  const name =
    profile?.displayName ||
    profile?.name ||
    "Kmeet Member";


  personName.textContent =
    name;


  personStatus.textContent =
    profile?.online === true
      ? "Online now"
      : "Your Kmeet conversation";


  const photo =
    profile?.photoURL ||
    profile?.photo ||
    profile?.profilePhoto ||
    profile?.image ||
    "";


  if(photo){

    avatar.src = photo;

    avatar.style.display = "block";

    avatarFallback.style.display =
      "none";

    avatar.onerror = () => {

      avatar.style.display = "none";

      avatarFallback.style.display =
        "flex";

      avatarFallback.textContent =
        name.charAt(0).toUpperCase();

    };

  }else{

    avatar.style.display = "none";

    avatarFallback.style.display =
      "flex";

    avatarFallback.textContent =
      name.charAt(0).toUpperCase();

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(items){

  if(!items || items.length === 0){

    messagesEl.innerHTML = `

      <div class="empty-state">

        Your conversation will appear here.<br>
        Start with a friendly message.

      </div>

    `;

    return;

  }


  messagesEl.innerHTML = "";


  items.forEach(item => {

    const row =
      document.createElement("div");


    const mine =
      item.senderId ===
      currentUser?.uid;


    row.className =
      "message-row " +
      (mine ? "mine" : "theirs");


    const bubble =
      document.createElement("div");


    bubble.className =
      "message " +
      (mine ? "mine" : "theirs");


    const text =
      document.createElement("div");


    text.textContent =
      item.text || "";


    bubble.appendChild(text);


    let time = "";


    if(item.createdAt){

      try{

        if(
          typeof item.createdAt.toDate ===
          "function"
        ){

          time =
            item.createdAt
              .toDate()
              .toLocaleTimeString(
                [],
                {
                  hour:"2-digit",
                  minute:"2-digit"
                }
              );

        }

      }catch(e){}

    }


    if(!time && item.clientCreatedAt){

      time =
        new Date(
          item.clientCreatedAt
        ).toLocaleTimeString(
          [],
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );

    }


    if(time){

      const timeEl =
        document.createElement("div");

      timeEl.className =
        "message-time";

      timeEl.textContent =
        time;

      bubble.appendChild(
        timeEl
      );

    }


    row.appendChild(
      bubble
    );

    messagesEl.appendChild(
      row
    );

  });


  requestAnimationFrame(() => {

    messagesEl.scrollTop =
      messagesEl.scrollHeight;

  });

}


/* =========================================================
   FIRESTORE LISTENER
========================================================= */

function startMessages(){

  if(targetIsDemo){

    renderMessages([]);

    return;

  }


  conversationId =
    getConversationId();


  if(!conversationId){

    renderMessages([]);

    return;

  }


  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        const serverMessages =
          snapshot.docs.map(
            item => ({
              id:item.id,
              ...item.data()
            })
          );


        /*
          NEVER replace an already visible optimistic
          message with an empty snapshot.
        */

        if(
          serverMessages.length === 0 &&
          localMessages.length > 0
        ){

          renderMessages(
            localMessages
          );

          return;

        }


        if(serverMessages.length > 0){

          localMessages =
            serverMessages;

          renderMessages(
            serverMessages
          );

        }

      },

      error => {

        console.error(
          "MESSAGE LISTENER ERROR:",
          error
        );

        /*
          Keep whatever is already visible.
        */

      }

    );

}


/* =========================================================
   ENSURE CONVERSATION
========================================================= */

async function ensureConversation(){

  conversationId =
    conversationId ||
    getConversationId();


  if(!conversationId){

    throw new Error(
      "No conversation ID."
    );

  }


  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );


  const existing =
    await getDoc(
      conversationRef
    );


  if(existing.exists()){

    const data =
      existing.data();


    console.log(
      "EXISTING CONVERSATION:",
      data
    );


    return data;

  }


  const conversationData = {

    initiatorId:
      currentUser.uid,

    receiverId:
      targetId,

    createdAt:
      serverTimestamp(),

    updatedAt:
      serverTimestamp()

  };


  console.log(
    "CREATING CONVERSATION:",
    conversationData
  );


  await setDoc(
    conversationRef,
    conversationData
  );


  return conversationData;

}


/* =========================================================
   SEND REAL MESSAGE
========================================================= */

async function sendRealMessage(text){

  console.log(
    "STARTING MESSAGE SEND"
  );


  /*
    1. Make sure parent conversation exists.
  */

  const conversation =
    await ensureConversation();


  console.log(
    "CONVERSATION READY:",
    conversation
  );


  /*
    2. Determine receiver.
  */

  const receiverId =
    conversation.initiatorId ===
      currentUser.uid

      ? conversation.receiverId

      : conversation.initiatorId;


  console.log(
    "CURRENT USER:",
    currentUser.uid
  );


  console.log(
    "RECEIVER:",
    receiverId
  );


  if(
    !receiverId ||
    receiverId === currentUser.uid
  ){

    throw new Error(
      "Receiver ID is invalid."
    );

  }


  /*
    3. Display immediately.
  */

  const optimisticMessage = {

    senderId:
      currentUser.uid,

    receiverId:
      receiverId,

    text:
      text,

    clientCreatedAt:
      Date.now()

  };


  localMessages.push(
    optimisticMessage
  );


  renderMessages(
    localMessages
  );


  /*
    4. Save ONLY the message.
  */

  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  console.log(
    "WRITING MESSAGE TO:",
    "conversations/" +
    conversationId +
    "/messages"
  );


  try{

    const messageRef =
      await addDoc(
        messagesRef,
        {

          senderId:
            currentUser.uid,

          receiverId:
            receiverId,

          text:
            text,

          createdAt:
            serverTimestamp(),

          clientCreatedAt:
            Date.now()

        }
      );


    console.log(
      "MESSAGE SUCCESSFULLY SAVED:",
      messageRef.id
    );


    /*
      IMPORTANT:

      Do NOT remove the optimistic message here.
      The Firestore listener will replace it with the
      confirmed Firestore message.
    */

    return true;

  }catch(error){

    console.error(
      "FIRESTORE MESSAGE WRITE FAILED:",
      error
    );


    /*
      Keep the message visible so we can see exactly
      what happened instead of making it disappear.
    */

    throw error;

  }

}


/* =========================================================
   SEND BUTTON
========================================================= */

async function sendMessage(){

  if(sendingMessage){
    return;
  }


  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(!currentUser){

    alert(
      "Kmeet is still loading. Please try again."
    );

    return;

  }


  /*
    Demo profiles are handled locally.
  */

  if(targetIsDemo){

    const message = {

      senderId:
        currentUser.uid,

      receiverId:
        targetId,

      text:
        text,

      clientCreatedAt:
        Date.now()

    };


    localMessages.push(
      message
    );


    renderMessages(
      localMessages
    );


    messageInput.value =
      "";


    return;

  }


  /*
    Anonymous users cannot use the free opening.
  */

  if(currentUser.isAnonymous){

    gate.classList.add(
      "show"
    );


    gateTitle.textContent =
      "Chat requires payment";


    gateText.textContent =
      "Guest visitors can explore Kmeet, but messaging requires a paid chat package.";


    gateButtons.innerHTML = `

      <a
        class="gate-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49&anonymous=true">

        3 Chats · KSh 49

      </a>

      <a
        class="gate-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100&anonymous=true">

        8 Chats · KSh 100

      </a>

    `;


    return;

  }


  /*
    Free first message must be hi or hey.
  */

  conversationId =
    getConversationId();


  let existingConversation =
    null;


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "conversations",
          conversationId
        )
      );


    if(snap.exists()){

      existingConversation =
        snap.data();

    }

  }catch(error){

    console.error(
      "CONVERSATION READ ERROR:",
      error
    );

  }


  if(!existingConversation){

    const normalized =
      text.toLowerCase().trim();


    if(
      normalized !== "hi" &&
      normalized !== "hey"
    ){

      alert(
        'Your first free message must be "hi" or "hey".'
      );

      return;

    }

  }


  sendingMessage =
    true;

  sendBtn.disabled =
    true;


  try{

    await sendRealMessage(
      text
    );


    /*
      Only clear the text after addDoc succeeds.
    */

    messageInput.value =
      "";

    messageInput.style.height =
      "auto";


    console.log(
      "SEND COMPLETE"
    );


  }catch(error){

    /*
      IMPORTANT:
      Do not erase the displayed message.

      Instead show the actual Firebase error.
    */

    console.error(
      "COMPLETE SEND ERROR:",
      error
    );


    const code =
      error?.code ||
      "unknown";


    const message =
      error?.message ||
      String(error);


    alert(
      "Kmeet message error:\n\n" +
      code +
      "\n\n" +
      message
    );


  }finally{

    sendingMessage =
      false;

    sendBtn.disabled =
      false;

    messageInput.focus();

  }

}


/* =========================================================
   ENTER
========================================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   SEND
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(

  auth,

  async user => {

    if(authStarted){
      return;
    }


    if(user){

      currentUser =
        user;

      authStarted =
        true;

    }else{

      try{

        const result =
          await signInAnonymously(
            auth
          );


        currentUser =
          result.user;


        authStarted =
          true;

      }catch(error){

        console.error(
          "AUTH ERROR:",
          error
        );

        alert(
          "Kmeet authentication failed."
        );

        return;

      }

    }


    await loadTarget();


    startMessages();

  },

  error => {

    console.error(
      "AUTH STATE ERROR:",
      error
    );

  }

);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }
);

</script>
