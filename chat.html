html,body{

<!-- ==========================================================
     DEMO SEND SYSTEM
     ==========================================================

     THIS SCRIPT IS NOT A MODULE.

     Therefore it can run even if Firebase has a problem.

     For demo profiles:
       - Send works
       - Enter works
       - messages appear immediately
       - messages are saved locally
       - no fake replies
       - no Firebase write
       - no payment required

========================================================== -->

<script>

(function(){

  function isDemoProfile(){

    const params =
      new URLSearchParams(
        window.location.search
      );

    const targetId =
      params.get("userId") ||
      params.get("user");

    return {
      targetId:targetId,
      demo:/^demo-\d+$/.test(
        targetId || ""
      )
    };
  }


  function sendDemoMessage(){

    const input =
      document.getElementById(
        "messageInput"
      );

    const messages =
      document.getElementById(
        "messages"
      );

    const infoBar =
      document.getElementById(
        "infoBar"
      );


    if(!input || !messages){
      return false;
    }


    const text =
      input.value.trim();


    if(!text){
      return true;
    }


    const result =
      isDemoProfile();


    if(!result.demo){
      return false;
    }


    const empty =
      messages.querySelector(
        ".empty"
      );


    if(empty){
      empty.remove();
    }


    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "message mine";


    bubble.textContent =
      text;


    messages.appendChild(
      bubble
    );


    messages.scrollTop =
      messages.scrollHeight;


    /*
     * Save locally.
     */

    const storageKey =
      "kmeet_demo_chat_" +
      result.targetId;


    let saved = [];


    try{

      saved =
        JSON.parse(
          localStorage.getItem(
            storageKey
          ) || "[]"
        );

      if(!Array.isArray(saved)){
        saved = [];
      }

    }catch(error){

      saved = [];
    }


    saved.push({

      text:text,

      createdAt:
        new Date().toISOString()

    });


    try{

      localStorage.setItem(
        storageKey,
        JSON.stringify(saved)
      );

    }catch(error){}


    /*
     * Clear input.
     */

    input.value = "";

    input.focus();


    if(infoBar){

      infoBar.textContent =
        "Your message has been sent ❤️";
    }


    return true;
  }


  /*
   * Global function used by the button.
   */

  window.kmeetDemoSend =
    sendDemoMessage;


  /*
   * Install the click listener immediately.
   */

  document.addEventListener(
    "DOMContentLoaded",
    function(){

      const sendBtn =
        document.getElementById(
          "sendBtn"
        );

      const input =
        document.getElementById(
          "messageInput"
        );


      if(sendBtn){

        sendBtn.addEventListener(
          "click",
          function(event){

            event.preventDefault();

            event.stopPropagation();


            /*
             * If this is a demo profile,
             * send immediately.
             */

            if(
              sendDemoMessage()
            ){
              return;
            }


            /*
             * Real Firebase chat is handled
             * by the module below.
             */

            if(
              typeof window.kmeetRealSend ===
              "function"
            ){

              window.kmeetRealSend();

            }

          },
          false
        );

      }


      if(input){

        input.addEventListener(
          "keydown",
          function(event){

            if(
              event.key === "Enter" &&
              !event.shiftKey
            ){

              event.preventDefault();

              event.stopPropagation();


              if(
                sendDemoMessage()
              ){
                return;
              }


              if(
                typeof window.kmeetRealSend ===
                "function"
              ){

                window.kmeetRealSend();
              }

            }

          },
          false
        );

      }

    },
    false
  );

})();

</script>

function getConversationId(){

    return "";
  }

  return [
    currentUser.uid,
    targetId
  ].sort().join("_");
}


function getSenderCredits(){

  const value =
    Number(
      localStorage.getItem(
        "kmeet_sender_credits"
      ) || "0"
    );

  return Number.isFinite(value)
    ? value
    : 0;
}


function setSenderCredits(value){

  localStorage.setItem(
    "kmeet_sender_credits",
    String(
      Math.max(0,value)
    )
  );
}


function receiverHasPaid(){

    ) === "true"
  );
}


function containsContactInformation(text){

  const value =
    String(text || "")
      .toLowerCase();


  const phone =
    /(?:\+?254|0)\s?\d{2,3}[\s.-]?\d{3}[\s.-]?\d{3,4}/;


  const email =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;


  const social =
    /\b(whatsapp|telegram|instagram|facebook|snapchat|tiktok)\b/i;


  const contactWords =
    /\b(call me|text me|message me|my number|phone number|email me)\b/i;


  return (
    phone.test(value) ||
    email.test(value) ||
    social.test(value) ||
    contactWords.test(value)
  );
}


/* ==========================================================
   LOAD PROFILE
========================================================== */

async function loadTargetProfile(){

  targetIsDemo =
    Boolean(
      targetId &&
      demoProfiles[targetId]
    );


  if(targetIsDemo){

    const demo =
      demoProfiles[targetId];


    personName.textContent =
      demo.name;


    personStatus.textContent =
      "Kmeet connection";


    avatar.src =
      demo.photo;


    avatar.style.display =
      "block";


    avatarFallback.style.display =
      "none";


    loadDemoMessages();


    infoBar.textContent =
      "Demo chat — you can test your message here ❤️";


    return;
  }


  if(!targetId){

    throw new Error(
      "No profile was selected."
    );
  }


  const snap =
    await getDoc(
      doc(
        db,
        "users",
        targetId
      )
    );


  if(!snap.exists()){

    throw new Error(
      "The selected Kmeet profile could not be found."
    );
  }


  const data =
    snap.data() || {};


  const name =
    data.name ||
    data.displayName ||
    data.username ||
    "Kmeet Member";


  personName.textContent =
    name;


  personStatus.textContent =
    "Kmeet member";


  avatarFallback.textContent =
    name.charAt(0).toUpperCase();


  const photo =
    data.photoURL ||
    data.avatar ||
    data.profilePhoto ||
    data.photo ||
    "";


  if(photo){

    avatar.src =
      photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";
  }
}


/* ==========================================================
   DEMO STORAGE
========================================================== */

function demoStorageKey(){

  return (
    "kmeet_demo_chat_" +
    targetId
  );
}


function loadDemoMessages(){

  let saved = [];


  try{

    saved =
      JSON.parse(
        localStorage.getItem(
          demoStorageKey()
        ) || "[]"
      );

    if(!Array.isArray(saved)){
      saved = [];
    }

  }catch(error){

    saved = [];
  }


  messages.innerHTML =
    "";


  if(!saved.length){

    messages.innerHTML =
      '<div class="empty">' +
      'Start the conversation and let the connection grow. ❤️' +
      '</div>';

    return;
  }


  saved.forEach(item=>{

    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "message mine";


    bubble.textContent =
      item.text || "";


    messages.appendChild(
      bubble
    );

  });


  messages.scrollTop =
    messages.scrollHeight;
}

/* ==========================================================
   REAL FIRESTORE MESSAGES
========================================================== */

async function getExistingMessages(){

  const snap =
    await getDocs(
      query(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        orderBy(
          "createdAt",
          "asc"
        )
      )
    );


  return snap.docs.map(
    docSnap =>
      docSnap.data()
  );
}


function renderMessages(items){

  messages.innerHTML =
    "";


  if(!items.length){

    messages.innerHTML =
      '<div class="empty">' +
      'Start the conversation and let the connection grow. ❤️' +
      '</div>';

    return;
  }


  items.forEach(item=>{

    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      item.senderId === currentUser.uid
        ? "message mine"
        : "message theirs";


    bubble.textContent =
      item.text || "";


    messages.appendChild(
      bubble
    );

  });


  messages.scrollTop =
    messages.scrollHeight;
}


function startRealListener(){

  if(
    !currentUser ||
    currentUser.isAnonymous ||
    targetIsDemo
  ){
    return;
  }


  conversationId =
    getConversationId();


  const q =
    query(
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      q,
      snapshot=>{

        const items =
          snapshot.docs.map(
            item =>
              item.data()
          );


        renderMessages(
          items
        );

      },
      error=>{

        console.error(
          "Chat listener error:",
          error
        );


        showError(
          "Messages could not be loaded. Please check your Firebase Firestore rules."
        );
      }
    );
}


/* ==========================================================
   REAL MEMBER SEND
========================================================== */

async function realSendMessage(){

  clearError();


  if(!currentUser){

    showError(
      "Kmeet is still loading your chat session."
    );

    return;
  }


  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(targetIsDemo){

    return;
  }


  if(!conversationId){

    conversationId =
      getConversationId();
  }


  /*
   * Anonymous users need paid credits
   * for REAL members.
   */

  if(
    currentUser.isAnonymous &&
    getSenderCredits() <= 0
  ){

    showGate(
      "anonymous"
    );

    return;
  }


  let existingMessages = [];


  try{

    existingMessages =
      await getExistingMessages();

  }catch(error){

    console.error(
      error
    );

    showError(
      "Kmeet could not check this conversation."
    );

    return;
  }


  const originalSenderId =
    existingMessages.length
      ? existingMessages[0].senderId
      : currentUser.uid;


  const isSender =
    originalSenderId ===
    currentUser.uid;


  /*
   * Opening message.
   */

  if(
    !currentUser.isAnonymous &&
    existingMessages.length === 0
  ){

    if(
      !FREE_OPENING_MESSAGES.includes(
        text.toLowerCase()
      )
    ){

      showGate(
        "sender"
      );

      return;
    }
  }


  /*
   * Contact information.
   */

  if(
    containsContactInformation(text)
  ){

    if(!isSender){

      showGate(
        "receiver"
      );

    }else{

      showGate(
        "sender"
      );
    }

    return;
  }


  let creditsBefore =
    getSenderCredits();


  let creditConsumed =
    false;


  if(
    isSender &&
    (
      existingMessages.length > 0 ||
      currentUser.isAnonymous
    )
  ){

    if(
      creditsBefore <= 0
    ){

      showGate(
        "sender"
      );

      return;
    }


    setSenderCredits(
      creditsBefore - 1
    );


    creditConsumed =
      true;
  }


  if(!isSender){

    const myReplies =
      existingMessages.filter(
        item =>
          item.senderId ===
          currentUser.uid
      ).length;


    if(
      myReplies >=
      FREE_RECEIVER_REPLIES &&
      !receiverHasPaid()
    ){

      showGate(
        "receiver"
      );

      return;
    }
  }


  sendBtn.disabled =
    true;


  try{

    await setDoc(
      doc(
        db,
        "conversations",
        conversationId
      ),
      {

        initiatorId:
          originalSenderId,

        receiverId:
          targetId,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    await addDoc(
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),
      {

        senderId:
          currentUser.uid,

        receiverId:
          targetId,

        text:
          text,

        createdAt:
          serverTimestamp()

      }
    );


    messageInput.value =
      "";

    messageInput.focus();


  }catch(error){

    console.error(
      "Send failed:",
      error
    );


    if(creditConsumed){

      setSenderCredits(
        creditsBefore
      );
    }


    showError(
      "Your message could not be sent. Please check your Firebase Firestore rules."
    );


  }finally{

    sendBtn.disabled =
      false;
  }
}


/*
 * Give the independent button access to the
 * real Firebase sender.
 */

window.kmeetRealSend =
  function(){

    void realSendMessage();

  };


/* ==========================================================
   AUTH
========================================================== */

onAuthStateChanged(
  auth,
  async user=>{

    try{

      if(!user){

        await signInAnonymously(
          auth
        );

        return;
      }


      currentUser =
        user;


      conversationId =
        getConversationId();


      /*
       * Demo profile:
       * always remain usable.
       */

      if(targetIsDemo){

        infoBar.textContent =
          "Demo chat — your message can be tested here ❤️";

        return;
      }


      /*
       * Real member profile.
       */

      if(user.isAnonymous){

        const credits =
          getSenderCredits();


        infoBar.textContent =
          credits > 0
            ? `Anonymous chat: ${credits} paid chat credit${credits===1?"":"s"} available.`
            : "Payment is required before chatting with a real Kmeet member.";

      }else{

        infoBar.textContent =
          "Your opening message is free — say hi or hey ❤️";
      }


      startRealListener();


    }catch(error){

      console.error(
        "Firebase authentication error:",
        error
      );


      showError(
        "Kmeet could not start the Firebase chat session. Demo chats remain available."
      );

    }

  }
);
