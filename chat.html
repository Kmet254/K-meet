*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

}

body::before{

  pointer-events:none;

.page{

  display:flex;
  flex-direction:column;
}

.topbar{

  padding:14px 22px;

  align-items:center;
  justify-content:space-between;
  background:rgba(15,8,15,.38);

.brand-logo{

}

.brand{

}

.brand span{

}

.back-btn{

  border-radius:999px;
  background:rgba(255,255,255,.12);

}

.chat-shell{
  width:min(900px,calc(100% - 28px));

  min-height:560px;
  margin:18px auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:rgba(25,12,23,.46);

}

.chat-header{

  display:flex;
  align-items:center;
  gap:13px;
  background:rgba(10,5,10,.28);

}

.avatar,

  height:48px;

  background:rgba(255,255,255,.14);

}

.avatar-fallback{

.status{

.messages{

  flex-direction:column;
  gap:10px;
  scroll-behavior:smooth;
}

}

.send-btn{

function showError(text){

  errorBox.textContent = text;

function clearError(){

  errorBox.textContent = "";

  errorBox.style.display = "none";
}


function getConversationId(){

  if(!currentUser || !targetId){
    return "";
  }

  const ids = [
    currentUser.uid,
    targetId
  ].sort();

  return ids.join("_");
}


function demoMessageKey(){

  const userPart =
    currentUser?.uid || "visitor";

  return (
    "kmeet_demo_chat_" +
    userPart +
    "_" +
    targetId
  );
}


function getDemoMessages(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          demoMessageKey()
        ) || "[]"
      );

    return Array.isArray(saved)
      ? saved
      : [];

  }catch(error){

    console.warn(
      "Could not read saved demo messages:",
      error
    );

    return [];
  }
}


function saveDemoMessages(items){

  try{

    localStorage.setItem(
      demoMessageKey(),
      JSON.stringify(items)
    );

  }catch(error){

    console.warn(
      "Could not save demo messages:",
      error
    );
  }
}


function getSenderCredits(){

  const key =
    "kmeet_sender_credits";

  const value =
    Number(
      localStorage.getItem(key) || "0"
    );

  return Number.isFinite(value)
    ? value
    : 0;
}


function setSenderCredits(value){

  localStorage.setItem(
    "kmeet_sender_credits",
    String(Math.max(0,value))
  );
}


function receiverHasPaid(){

}


/* ============================================================
   CONTACT INFORMATION PROTECTION
   ============================================================ */

function containsContactInformation(text){

  const value =
    String(text || "").toLowerCase();

  const phonePattern =
    /(?:\+?254|0)\s?\d{2,3}[\s.-]?\d{3}[\s.-]?\d{3,4}/;

  const emailPattern =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;

  const socialPattern =
    /\b(whatsapp|telegram|instagram|facebook|snapchat|tiktok)\b/i;

  const contactWords =
    /\b(call me|text me|message me|my number|phone number|email me)\b/i;

  return (
    phonePattern.test(value) ||
    emailPattern.test(value) ||
    socialPattern.test(value) ||
    contactWords.test(value)
  );
}


/* ============================================================
   DEMO MESSAGE RENDERING
   ============================================================ */

function showDemoEmptyState(){

  messages.innerHTML =
    '<div class="empty">' +
    'Start the conversation and let the connection grow. ❤️' +
    '</div>';
}


function renderDemoMessages(
  items = demoMessages
){

  messages.innerHTML = "";

  if(!items.length){

    showDemoEmptyState();

    return;
  }

  const fragment =
    document.createDocumentFragment();

  items.forEach(data=>{

    const div =
      document.createElement("div");

    div.className =
      "message mine";

    div.textContent =
      data.text || "";

    fragment.appendChild(div);
  });

  messages.appendChild(fragment);

  messages.scrollTop =
    messages.scrollHeight;
}


function appendDemoMessage(data){

  const empty =
    messages.querySelector(".empty");

  if(empty){
    empty.remove();
  }

  const div =
    document.createElement("div");

  div.className =
    "message mine";

  div.textContent =
    data.text || "";

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}


/* ============================================================
   LOAD TARGET PROFILE
   ============================================================ */

async function loadTargetProfile(){

  targetIsDemo =
    Boolean(
      targetId &&
      demoProfiles[targetId]
    );

  if(targetIsDemo){

    const demo =
      demoProfiles[targetId];

    personName.textContent =
      demo.name;

    personStatus.textContent =
      "Kmeet connection";

    avatarFallback.textContent =
      demo.name.charAt(0).toUpperCase();

    avatar.src =
      demo.photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";

    demoMessages = [];

    renderDemoMessages(
      demoMessages
    );

    return;
  }


  const snap =
    await getDoc(
      doc(db,"users",targetId)
    );

  if(!snap.exists()){

    throw new Error(
      "The selected Kmeet profile could not be found."
    );
  }


  const data =
    snap.data() || {};


  const name =
    data.name ||
    data.username ||
    data.displayName ||
    "Kmeet Member";


  personName.textContent =
    name;


  avatarFallback.textContent =
    name.charAt(0).toUpperCase();


  const photo =
    data.photoURL ||
    data.photoUrl ||
    data.avatar ||
    data.profilePhoto ||
    data.profileImage ||
    data.image ||
    "";


  if(photo){

    avatar.src =
      photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";
  }
}

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49"
      >
        3 Chats — KSh 49
      </a>

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100"
      >
        8 Chats — KSh 100
      </a>

      <a
        class="pay-btn secondary-btn"
        href="discover.html"
      >
        Back to Discover
      </a>

    `;

    return;
  }


  if(type === "receiver"){

    gateIcon.textContent =
      "💗";

    gateTitle.textContent =
      "Continue the conversation";

    gateText.textContent =
      "You have used your free replies or attempted to share contact information. Pay KSh 11 to continue.";

    gateButtons.innerHTML = `

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=receiver&amount=11"
      >
        Continue — KSh 11
      </a>

      <a
        class="pay-btn secondary-btn"
        href="discover.html"
      >
        Back to Discover
      </a>

    `;
  }
}


/* ============================================================
   FIRESTORE MESSAGE READING
   ============================================================ */

async function getExistingMessages(){

  if(!conversationId){

    conversationId =
      getConversationId();
  }


  const snap =
    await getDocs(
      query(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        orderBy(
          "createdAt",
          "asc"
        )
      )
    );


  return snap.docs.map(
    item => item.data()
  );
}


/* ============================================================
   REAL MESSAGE RENDERING
   ============================================================ */

function renderMessages(items){

  messages.innerHTML =
    "";


  if(!items.length){

    messages.innerHTML =
      '<div class="empty">' +
      'Start the conversation and let the connection grow. ❤️' +
      '</div>';

    return;
  }


  items.forEach(data=>{

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (
        data.senderId === currentUser.uid
          ? "mine"
          : "theirs"
      );

    div.textContent =
      data.text || "";

    messages.appendChild(div);
  });


  messages.scrollTop =
    messages.scrollHeight;
}


/* ============================================================
   REAL MEMBER FIRESTORE LISTENER
   ============================================================ */

function startMessages(){

  if(
    !currentUser ||
    currentUser.isAnonymous ||
    targetIsDemo
  ){
    return;
  }


  conversationId =
    getConversationId();


  const ref =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const q =
    query(
      ref,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      q,
      snapshot=>{

        const items =
          snapshot.docs.map(
            item => item.data()
          );


        renderMessages(items);


        if(!items.length){

          infoBar.textContent =
            "Your opening message is free — say hi or hey ❤️";

          return;
        }


        const firstSenderId =
          items[0].senderId;


        const myReplies =
          items.filter(
            item =>
              item.senderId ===
              currentUser.uid
          ).length;


        if(
          firstSenderId ===
          currentUser.uid
        ){

          infoBar.textContent =
            "Your opening message is free. Further messages use chat credits.";

        }else{

          infoBar.textContent =
            `You have ${Math.max(
              0,
              FREE_RECEIVER_REPLIES - myReplies
            )} free replies remaining.`;
        }

      },

      error=>{

        console.error(
          "Message listener error:",
          error
        );

        showError(
          "The chat interface is open, but messages could not be loaded. Please check your Firebase Firestore rules."
        );
      }
    );
}


/* ============================================================
   FIREBASE AUTHENTICATION
   ============================================================ */

async function initialiseAuth(){

  if(authStarted){
    return;
  }

  authStarted =
    true;


  onAuthStateChanged(
    auth,
    async user=>{

      try{

        if(!user){

          await signInAnonymously(
            auth
          );

          return;
        }


        currentUser =
          user;


        conversationId =
          getConversationId();


        clearError();


        /*
         * Load locally saved demo messages.
         */
        if(targetIsDemo){

          demoMessages =
            getDemoMessages();

          renderDemoMessages(
            demoMessages
          );
        }


        /*
         * Anonymous users can see the demo chat.
         * Payment is only required for real member chats.
         */
        if(user.isAnonymous){

          const credits =
            getSenderCredits();


          if(targetIsDemo){

            infoBar.textContent =
              "Demo chat — your message can be tested here ❤️";

          }else{

            infoBar.textContent =
              credits > 0
                ? `Anonymous chat: ${credits} paid chat credit${credits===1?"":"s"} available.`
                : "Anonymous chat: payment is required before your first message.";
          }


          showChat();

          return;
        }


        infoBar.textContent =
          "Your opening message is free — say hi or hey ❤️";


        showChat();


        if(!targetIsDemo){

          startMessages();
        }

      }catch(error){

        console.error(
          "Kmeet authentication error:",
          error
        );


        if(
          error.code ===
          "auth/operation-not-allowed"
        ){

          showError(
            "Anonymous Authentication is not enabled in Firebase. Enable Authentication → Sign-in method → Anonymous."
          );

        }else{

          showError(
            "Kmeet could not start the chat session (" +
            (
              error.code ||
              "authentication error"
            ) +
            "). Please check your Firebase Authentication settings."
          );
        }
      }
    }
  );
}


/* ============================================================
   SEND MESSAGE
   ============================================================ */

async function sendMessage(){

  clearError();


  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(!currentUser){

    showError(
      "Kmeet is still preparing your chat session. Please try again in a moment."
    );

    return;
  }


  /*
   * ==========================================================
   * DEMO PROFILE CHAT
   * ==========================================================
   *
   * IMPORTANT:
   *
   * This MUST happen BEFORE the anonymous payment gate.
   *
   * Anonymous visitors can therefore:
   *
   * 1. Open Discover
   * 2. Open a demo profile
   * 3. Type a message
   * 4. Press Send
   * 5. See the message immediately
   *
   * The message is saved only in this browser.
   *
   * It is NOT sent to Firebase.
   *
   * There is NO fake reply.
   *
   * It does NOT consume paid credits.
   */

  if(targetIsDemo){

    const newMessage = {

      text:text,

      createdAt:
        new Date().toISOString()
    };


    demoMessages.push(
      newMessage
    );


    /*
     * Add the new message directly.
     */
    appendDemoMessage(
      newMessage
    );


    /*
     * Save it locally.
     */
    saveDemoMessages(
      demoMessages
    );


    /*
     * Confirm the local demo send.
     */
    infoBar.textContent =
      "Your message has been sent ❤️";


    /*
     * Clear the input.
     */
    messageInput.value =
      "";

    messageInput.focus();


    return;
  }


  /*
   * ==========================================================
   * REAL MEMBER CHAT
   * ==========================================================
   *
   * Payment protection starts here.
   */

  if(!conversationId){

    conversationId =
      getConversationId();
  }


  /*
   * Anonymous users must have paid credits for REAL members.
   */

  if(
    currentUser.isAnonymous &&
    getSenderCredits() <= 0
  ){

    showGate(
      "anonymous"
    );

    return;
  }


  let existingMessages = [];


  try{

    existingMessages =
      await getExistingMessages();

  }catch(error){

    console.error(
      "Conversation read failed:",
      error
    );

    showError(
      "Kmeet could not check this conversation. Please check your Firestore rules and try again."
    );

    return;
  }


  /*
   * First opening message.
   */

  if(
    !currentUser.isAnonymous &&
    existingMessages.length === 0
  ){

    const opening =
      text.toLowerCase();


    if(
      !FREE_OPENING_MESSAGES.includes(
        opening
      )
    ){

      showGate(
        "sender"
      );

      return;
    }
  }


  /*
   * Identify original sender.
   */

  const originalSenderId =
    existingMessages.length
      ? existingMessages[0].senderId
      : currentUser.uid;


  const isSender =
    originalSenderId ===
    currentUser.uid;


  /*
   * Contact information protection.
   */

  if(
    containsContactInformation(text)
  ){

    if(!isSender){

      showGate(
        "receiver"
      );

      return;
    }


    showGate(
      "sender"
    );

    return;
  }


  let creditConsumed =
    false;

  let creditsBefore =
    0;


  /*
   * Sender credit rules.
   */

  if(
    isSender &&
    (
      existingMessages.length > 0 ||
      currentUser.isAnonymous
    )
  ){

    creditsBefore =
      getSenderCredits();


    if(
      creditsBefore <= 0
    ){

      showGate(
        "sender"
      );

      return;
    }


    setSenderCredits(
      creditsBefore - 1
    );


    creditConsumed =
      true;
  }


  /*
   * Receiver free reply rules.
   */

  if(!isSender){

    const receiverReplies =
      existingMessages.filter(
        item =>
          item.senderId ===
          currentUser.uid
      ).length;


    if(
      receiverReplies >=
      FREE_RECEIVER_REPLIES &&
      !receiverHasPaid()
    ){

      showGate(
        "receiver"
      );

      return;
    }
  }


  /*
   * Prevent duplicate sends.
   */

  sendBtn.disabled =
    true;


  try{

    /*
     * Create/update conversation.
     */

    await setDoc(
      doc(
        db,
        "conversations",
        conversationId
      ),
      {

        initiatorId:
          originalSenderId,

        receiverId:
          targetId,

        updatedAt:
          serverTimestamp(),

        createdAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    /*
     * Write actual Firebase message.
     */

    await addDoc(
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),
      {

        senderId:
          currentUser.uid,

        receiverId:
          targetId,

        text:
          text,

        createdAt:
          serverTimestamp()
      }
    );


    /*
     * Clear input after successful send.
     */

    messageInput.value =
      "";

    messageInput.focus();


    /*
     * Anonymous remaining credits.
     */

    if(
      currentUser.isAnonymous
    ){

      const remaining =
        getSenderCredits();


      infoBar.textContent =
        `Anonymous chat: ${remaining} paid chat credit${remaining===1?"":"s"} remaining.`;
    }


  }catch(error){

    console.error(
      "Message send failed:",
      error
    );


    /*
     * Restore credit if Firebase failed.
     */

    if(creditConsumed){

      setSenderCredits(
        creditsBefore
      );
    }


    showError(
      "Your message could not be sent. Please check your Firestore rules."
    );


  }finally{

    sendBtn.disabled =
      false;
  }
}


/* ============================================================
   SEND BUTTON
   ============================================================ */

sendBtn.addEventListener(
  "click",
  event=>{

    event.preventDefault();

    event.stopPropagation();

    void sendMessage();
  }
);


/* ============================================================
   ENTER KEY
   ============================================================
   Enter = Send
   Shift + Enter = New line
   ============================================================ */

messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      event.stopPropagation();

      void sendMessage();
    }
  }
);


/* ============================================================
   START CHAT
   ============================================================ */

async function start(){

  if(!targetId){

    showError(
      "No profile was selected for this chat."
    );

    sendBtn.disabled =
      true;

    return;
  }


  try{

    await loadTargetProfile();

    initialiseAuth();

  }catch(error){

    console.error(
      error
    );

    showError(
      error.message ||
      "Unable to load the selected profile."
    );
  }
}


start();


/* ============================================================
   CLEANUP
   ============================================================ */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(unsubscribeMessages){

      unsubscribeMessages();
    }
  }
);

</script>
