<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet - Chat</title>

<link rel="icon"
      type="image/jpeg"
      href="./kmeet-logo.jfif.jfif">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:"Poppins",sans-serif;
  color:#fff;
}

body{
  min-height:100vh;
  background:
    linear-gradient(rgba(18,5,16,.76),rgba(18,5,16,.88)),
    url("./chat.jpg") center/cover fixed no-repeat;
}

a{
  text-decoration:none;
  color:inherit;
}

.topbar{
  height:70px;
  width:100%;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(18,7,17,.82);
  border-bottom:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(14px);
}

.brand-link{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:39px;
  height:39px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,105,180,.55);
}

.brand{
  font-family:"Playfair Display",serif;
  font-size:25px;
  font-weight:700;
  letter-spacing:.3px;
}

.brand span{
  color:#ff79bd;
}

.back-btn{
  padding:9px 15px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:13px;
  transition:.2s;
}

.back-btn:hover{
  background:rgba(255,105,180,.18);
  border-color:rgba(255,105,180,.4);
}

.chat-shell{
  width:min(900px,calc(100% - 24px));
  height:calc(100vh - 105px);
  min-height:560px;
  margin:18px auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.13);
  border-radius:22px;
  background:rgba(28,10,26,.72);
  box-shadow:0 25px 70px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
  min-height:82px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  border-bottom:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.035);
}

.avatar,
.avatar-fallback{
  width:52px;
  height:52px;
  flex:0 0 52px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,105,180,.55);
}

.avatar-fallback{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#8f285d,#e75599);
  font-size:20px;
  font-weight:700;
}

.person-name{
  font-family:"Playfair Display",serif;
  font-size:20px;
  font-weight:700;
}

.status{
  margin-top:3px;
  font-size:11px;
  color:#d6c5d0;
}

.header-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.call-btn{
  width:39px;
  height:39px;
  border:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:#fff;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
  transition:.2s;
  font-size:17px;
}

.call-btn:hover:not(:disabled){
  transform:translateY(-1px);
  background:rgba(255,105,180,.22);
  border-color:rgba(255,105,180,.5);
}

.call-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* =========================
   INFO BAR
========================= */

.info-bar{
  padding:10px 17px;
  font-size:11px;
  color:#d9c8d3;
  background:rgba(255,255,255,.025);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.info-bar strong{
  color:#ff83c2;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:6px;
}

.messages::-webkit-scrollbar-thumb{
  background:rgba(255,105,180,.28);
  border-radius:10px;
}

.empty-state{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#cdbbc6;
  font-size:13px;
  padding:30px;
}

.message-row{
  width:100%;
  display:flex;
  margin:8px 0;
}

.message-row.mine{
  justify-content:flex-end;
}

.message{
  max-width:min(75%,520px);
  padding:10px 13px;
  border-radius:17px;
  font-size:13px;
  line-height:1.45;
  word-break:break-word;
  white-space:pre-wrap;
}

.message.theirs{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.message.mine{
  background:linear-gradient(135deg,#9d2e67,#d34c91);
  border-bottom-right-radius:5px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.message-time{
  margin-top:4px;
  font-size:9px;
  opacity:.62;
  text-align:right;
}

/* =========================
   COMPOSER
========================= */

.composer{
  padding:12px;
  display:flex;
  gap:8px;
  border-top:1px solid rgba(255,255,255,.09);
  background:rgba(18,7,17,.62);
}

.composer input{
  flex:1;
  min-width:0;
  height:44px;
  padding:0 15px;
  border-radius:23px;
  border:1px solid rgba(255,255,255,.13);
  outline:none;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-family:"Poppins",sans-serif;
  font-size:13px;
}

.composer input::placeholder{
  color:#ad9ca7;
}

.composer input:focus{
  border-color:rgba(255,105,180,.45);
}

.send-btn{
  height:44px;
  padding:0 19px;
  border:none;
  border-radius:23px;
  cursor:pointer;
  color:#fff;
  font-weight:600;
  background:linear-gradient(135deg,#a52f6d,#dc5798);
  font-family:"Poppins",sans-serif;
}

.send-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* =========================
   GATE
========================= */

.gate{
  display:none;
  padding:16px;
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(35,10,28,.85);
}

.gate.show{
  display:block;
}

.gate-title{
  font-family:"Playfair Display",serif;
  font-size:18px;
  margin-bottom:5px;
}

.gate-text{
  color:#cbbbc5;
  font-size:11px;
  line-height:1.55;
  margin-bottom:11px;
}

.gate-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.gate-btn{
  border:none;
  border-radius:20px;
  padding:9px 14px;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#a32e6c,#d95296);
  font-family:"Poppins",sans-serif;
  font-size:11px;
  font-weight:600;
}

.gate-btn.secondary{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
}

/* =========================
   CALL MENU
========================= */

.call-menu{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(7,3,8,.72);
  backdrop-filter:blur(10px);
}

.call-menu.show{
  display:flex;
}

.call-menu-card{
  width:min(420px,100%);
  padding:24px;
  border-radius:22px;
  background:rgba(36,11,31,.96);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.call-menu-card h2{
  margin:0 0 5px;
  font-family:"Playfair Display",serif;
}

.call-menu-card p{
  margin:0 0 18px;
  color:#cbbac6;
  font-size:12px;
}

.call-options{
  display:grid;
  gap:10px;
}

.call-option{
  width:100%;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

.call-option:hover{
  background:rgba(255,105,180,.14);
  border-color:rgba(255,105,180,.35);
}

.call-option-icon{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,105,180,.15);
  font-size:18px;
}

.call-option-info{
  flex:1;
}

.call-option-title{
  font-weight:600;
  font-size:13px;
}

.call-option-price{
  margin-top:2px;
  color:#ff87c3;
  font-size:11px;
}

.close-call-menu{
  width:100%;
  margin-top:13px;
  padding:10px;
  border:none;
  border-radius:20px;
  background:rgba(255,255,255,.07);
  color:#fff;
  cursor:pointer;
}

/* =========================
   CALL SCREEN
========================= */

.call-overlay{
  position:fixed;
  inset:0;
  z-index:2000;
  display:none;
  flex-direction:column;
  background:#090509;
}

.call-overlay.show{
  display:flex;
}

.call-stage{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(117,30,77,.28),transparent 55%),
    #090509;
}

.remote-video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  background:#090509;
}

.local-video{
  position:absolute;
  right:18px;
  top:18px;
  width:180px;
  height:130px;
  object-fit:cover;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.2);
  display:none;
  background:#170b14;
  z-index:5;
}

.call-avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid rgba(255,105,180,.65);
  display:none;
}

.call-avatar-fallback{
  width:105px;
  height:105px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#8d285d,#dc4f96);
  font-size:40px;
  font-weight:700;
}

.call-info{
  position:absolute;
  left:0;
  right:0;
  bottom:105px;
  z-index:6;
  text-align:center;
  pointer-events:none;
}

.call-person{
  margin-top:13px;
  font-family:"Playfair Display",serif;
  font-size:25px;
}

.call-status{
  margin-top:4px;
  color:#d0c0ca;
  font-size:12px;
}

.call-controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:10;
  min-height:88px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:15px;
  background:linear-gradient(transparent,rgba(0,0,0,.78));
}

.control-btn{
  width:49px;
  height:49px;
  border:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.12);
  cursor:pointer;
  font-size:18px;
}

.control-btn.active{
  background:rgba(255,255,255,.22);
}

.control-btn.end{
  width:57px;
  height:57px;
  background:#c8325f;
}

.incoming-call{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(5,2,6,.8);
  backdrop-filter:blur(15px);
}

.incoming-call.show{
  display:flex;
}

.incoming-card{
  width:min(370px,100%);
  text-align:center;
  padding:28px 22px;
  border-radius:24px;
  background:rgba(35,10,30,.97);
  border:1px solid rgba(255,255,255,.13);
}

.incoming-card h2{
  margin:14px 0 4px;
  font-family:"Playfair Display",serif;
}

.incoming-type{
  color:#cdbac6;
  font-size:12px;
}

.incoming-actions{
  display:flex;
  justify-content:center;
  gap:13px;
  margin-top:23px;
}

.accept-btn,
.decline-btn{
  width:54px;
  height:54px;
  border:none;
  border-radius:50%;
  color:#fff;
  cursor:pointer;
  font-size:19px;
}

.accept-btn{
  background:#2fa96d;
}

.decline-btn{
  background:#c8325f;
}

@media(max-width:600px){

  .topbar{
    padding:0 14px;
  }

  .chat-shell{
    width:calc(100% - 12px);
    margin:6px auto;
    height:calc(100vh - 82px);
    min-height:500px;
    border-radius:18px;
  }

  .chat-header{
    min-height:72px;
    padding:11px;
  }

  .avatar,
  .avatar-fallback{
    width:45px;
    height:45px;
    flex-basis:45px;
  }

  .person-name{
    font-size:18px;
  }

  .header-actions{
    gap:4px;
  }

  .call-btn{
    width:35px;
    height:35px;
    font-size:15px;
  }

  .message{
    max-width:84%;
  }

  .local-video{
    width:120px;
    height:90px;
    right:10px;
    top:10px;
  }

  .call-info{
    bottom:105px;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <a class="brand-link" href="index.html">
    <img class="brand-logo"
         src="./kmeet-logo.jfif.jfif"
         alt="Kmeet">

    <div class="brand">
      K<span>meet</span>
    </div>
  </a>

  <a class="back-btn" href="discover.html">
    ← Back
  </a>

</header>


<main class="chat-shell">

  <div class="chat-header">

    <div id="avatarFallback" class="avatar-fallback">
      K
    </div>

    <img id="avatar"
         class="avatar"
         alt=""
         style="display:none">

    <div>
      <div id="personName" class="person-name">
        Kmeet Member
      </div>

      <div id="personStatus" class="status">
        Your Kmeet conversation
      </div>
    </div>

    <div class="header-actions">

      <button id="voiceCallBtn"
              class="call-btn"
              title="Voice call"
              disabled>
        📞
      </button>

      <button id="videoCallBtn"
              class="call-btn"
              title="Video call"
              disabled>
        🎥
      </button>

    </div>

  </div>


  <div class="info-bar" id="infoBar">
    Start your Kmeet conversation.
  </div>


  <section id="messages"
           class="messages">

    <div class="empty-state">
      Loading conversation...
    </div>

  </section>


  <div id="gate"
       class="gate">

    <div id="gateTitle"
         class="gate-title">
      Chat access
    </div>

    <div id="gateText"
         class="gate-text">
      Choose an option below to continue.
    </div>

    <div id="gateActions"
         class="gate-actions">
    </div>

  </div>


  <form id="composer"
        class="composer">

    <input id="messageInput"
           type="text"
           maxlength="2000"
           autocomplete="off"
           placeholder="Type a message...">

    <button id="sendBtn"
            class="send-btn"
            type="submit">
      Send
    </button>

  </form>

</main>


<!-- =========================
     CALL PAYMENT MENU
========================= -->

<div id="callMenu"
     class="call-menu">

  <div class="call-menu-card">

    <h2>Call this member</h2>

    <p>
      Choose the type of call you want to unlock.
    </p>

    <div class="call-options">

      <button id="chooseVoice"
              class="call-option">

        <div class="call-option-icon">
          📞
        </div>

        <div class="call-option-info">
          <div class="call-option-title">
            Voice Call
          </div>

          <div class="call-option-price">
            KSh 20
          </div>
        </div>

      </button>


      <button id="chooseVideo"
              class="call-option">

        <div class="call-option-icon">
          🎥
        </div>

        <div class="call-option-info">
          <div class="call-option-title">
            Video Call
          </div>

          <div class="call-option-price">
            KSh 30
          </div>
        </div>

      </button>


      <button id="chooseBundle"
              class="call-option">

        <div class="call-option-icon">
          💕
        </div>

        <div class="call-option-info">
          <div class="call-option-title">
            Voice + Video Bundle
          </div>

          <div class="call-option-price">
            KSh 40
          </div>
        </div>

      </button>

    </div>

    <button id="closeCallMenu"
            class="close-call-menu">
      Cancel
    </button>

  </div>

</div>


<!-- =========================
     REAL WEBRTC CALL SCREEN
========================= -->

<div id="callOverlay"
     class="call-overlay">

  <div class="call-stage">

    <video id="remoteVideo"
           class="remote-video"
           autoplay
           playsinline>
    </video>

    <video id="localVideo"
           class="local-video"
           autoplay
           muted
           playsinline>
    </video>


    <div id="callAvatarFallback"
         class="call-avatar-fallback">
      K
    </div>

    <img id="callAvatar"
         class="call-avatar"
         alt="">


    <div class="call-info">

      <div id="callPerson"
           class="call-person">
        Kmeet Member
      </div>

      <div id="callStatus"
           class="call-status">
        Connecting...
      </div>

    </div>


    <div class="call-controls">

      <button id="muteBtn"
              class="control-btn"
              title="Mute">
        🎙️
      </button>

      <button id="cameraBtn"
              class="control-btn"
              title="Camera"
              style="display:none">
        📷
      </button>

      <button id="endCallBtn"
              class="control-btn end"
              title="End call">
        ☎
      </button>

    </div>


    <!-- INCOMING CALL -->

    <div id="incomingCall"
         class="incoming-call">

      <div class="incoming-card">

        <div id="incomingAvatarFallback"
             class="call-avatar-fallback"
             style="margin:auto">
          K
        </div>

        <img id="incomingAvatar"
             class="call-avatar"
             alt=""
             style="margin:auto">

        <h2 id="incomingName">
          Kmeet Member
        </h2>

        <div id="incomingType"
             class="incoming-type">
          Incoming call
        </div>

        <div class="incoming-actions">

          <button id="declineIncoming"
                  class="decline-btn"
                  title="Decline">
            ✕
          </button>

          <button id="acceptIncoming"
                  class="accept-btn"
                  title="Accept">
            ✓
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<script type="module">

import {
  auth,
  db,
  database,
  onAuthStateChanged,
  signInAnonymously,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  databaseRef,
  databaseSet,
  databaseOnValue,
  databaseRemove
} from "./firebase-config.js";


/* =========================================================
   BASIC STATE
========================================================= */

let currentUser = null;

let conversationId = null;

let unsubscribeMessages = null;

let unsubscribeIncomingCall = null;

let unsubscribeIncomingCandidates = null;

let currentCallId = null;

let pendingCallId = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let currentCallType = null;

let isCallActive = false;

let isMuted = false;

let cameraEnabled = true;

let targetProfile = null;

let targetIsDemo = false;

let authStarted = false;


/* =========================================================
   CALL PRICES
========================================================= */

const VOICE_PRICE = 20;

const VIDEO_PRICE = 30;

const BUNDLE_PRICE = 40;


/* =========================================================
   DOM
========================================================= */

const messagesEl =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const composer =
  document.getElementById("composer");

const personName =
  document.getElementById("personName");

const personStatus =
  document.getElementById("personStatus");

const avatar =
  document.getElementById("avatar");

const avatarFallback =
  document.getElementById("avatarFallback");

const infoBar =
  document.getElementById("infoBar");

const gate =
  document.getElementById("gate");

const gateTitle =
  document.getElementById("gateTitle");

const gateText =
  document.getElementById("gateText");

const gateActions =
  document.getElementById("gateActions");

const voiceCallBtn =
  document.getElementById("voiceCallBtn");

const videoCallBtn =
  document.getElementById("videoCallBtn");

const callMenu =
  document.getElementById("callMenu");

const chooseVoice =
  document.getElementById("chooseVoice");

const chooseVideo =
  document.getElementById("chooseVideo");

const chooseBundle =
  document.getElementById("chooseBundle");

const closeCallMenu =
  document.getElementById("closeCallMenu");

const callOverlay =
  document.getElementById("callOverlay");

const remoteVideo =
  document.getElementById("remoteVideo");

const localVideo =

/* =========================================================

========================================================= */

function isDemoId(id){

  return String(id || "")
    .startsWith("demo-");

}


function getConversationId(){

  if(!currentUser || !targetId){

    return null;

  }

  return [
    currentUser.uid,
    targetId
  ].sort().join("_");

}


function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatTime(timestamp){

  try{

    if(!timestamp) return "";

    let date;

    if(typeof timestamp.toDate === "function"){

      date=timestamp.toDate();

    }else{

      date=new Date(timestamp);

    }

    if(Number.isNaN(date.getTime())) return "";

    return date.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });

  }catch{

    return "";

  }

}


function showGate(type){

  gate.classList.add("show");

  gateActions.innerHTML="";

  if(type==="anonymous"){

    gateTitle.textContent="Chat requires a Kmeet account";

      </button>

      <button class="gate-btn secondary"
              onclick="window.location.href='signup.html'">

    return;

function renderMessages(items){

  if(!items.length){

    messagesEl.innerHTML=`

      <div class="empty-state">
        Start your conversation with this Kmeet member.
      </div>

    `;

    return;

  }

  messagesEl.innerHTML="";

  items.forEach(item=>{

    const mine =
      item.senderId===currentUser.uid;

    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (mine ? "mine" : "theirs");

    const bubble =
      document.createElement("div");

    bubble.className =
      "message " +
      (mine ? "mine" : "theirs");

    bubble.innerHTML=
      escapeHtml(item.text) +
      `<div class="message-time">${formatTime(item.createdAt)}</div>`;

    row.appendChild(bubble);

    messagesEl.appendChild(row);

  });

  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}

async function getExistingMessages(){

  if(!conversationId){

    conversationId =
      getConversationId();

  }

  if(!conversationId){

    return [];

  }

  try{

    const parentSnap =
      await getDoc(
        doc(
          db,
          "conversations",
          conversationId
        )
      );

    if(!parentSnap.exists()){

      return [];

    }

    const snap =
      await getDocs(
        query(
          collection(
            db,
            "conversations",
            conversationId,
            "messages"
          ),
          orderBy(
            "createdAt",
            "asc"
          )
        )
      );

    return snap.docs.map(
      item=>item.data()
    );

  }catch(error){

    console.error(
      "Message loading error:",
      error
    );

    return [];

  }

}


function startMessages(){

  if(targetIsDemo){

    loadDemoChat();

    return;

  }

  conversationId =
    getConversationId();

  if(!conversationId){

    renderMessages([]);

    return;

  }

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages=null;

  }


  const ref =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );

  const q =
    query(
      ref,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(
      q,
      snapshot=>{

        const items =
          snapshot.docs.map(
            item=>item.data()
          );

        renderMessages(items);

        if(items.length){

          hideGate();

        }

      },
      error=>{

        console.error(
          "Message listener error:",
          error
        );

      }
    );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

const CONTACT_PATTERN =
  /(\+?\d[\d\s\-]{6,}|@[\w.-]+|www\.|https?:\/\/|instagram|facebook|telegram|whatsapp|gmail|\.com\b)/i;


const FREE_OPENING_MESSAGES =
  ["hi","hey"];

const FREE_RECEIVER_REPLIES =
  3;


function freeOpeningKey(){

  return "kmeet_free_opening_used_" +
    currentUser.uid +
    "_" +
    targetId;

}


function senderCreditsKey(){

  return "kmeet_sender_credits_" +
    currentUser.uid +
    "_" +
    targetId;

}


function receiverPaidKey(){

  return "kmeet_receiver_paid_" +
    currentUser.uid +
    "_" +
    targetId;

}


function receiverReplyKey(){

  return "kmeet_receiver_replies_" +
    currentUser.uid +
    "_" +
    targetId;

}


function hasFreeOpeningUsed(){

  return localStorage.getItem(
    freeOpeningKey()
  )==="1";

}


function getSenderCredits(){

  return Number(
    localStorage.getItem(
      senderCreditsKey()
    ) || "0"
  );

}


function getReceiverReplies(){

  return Number(
    localStorage.getItem(
      receiverReplyKey()
    ) || "0"
  );

}


function isReceiverPaid(){

  return localStorage.getItem(
    receiverPaidKey()
  )==="1";

}


async function sendMessage(text){

  text=text.trim();

  if(!text){

    return;

  }


  if(!currentUser){

    return;

  }


  if(currentUser.isAnonymous){

    showGate("anonymous");

    return;

  }


  if(targetIsDemo){

    const items =
      getDemoMessages();

    items.push({

      senderId:currentUser.uid,

      receiverId:targetId,

      text,

      createdAt:
        new Date().toISOString()

    });

    saveDemoMessages(items);

    renderMessages(items);

    messageInput.value="";

    return;

  }


  const normalized =
    text.toLowerCase();


  if(CONTACT_PATTERN.test(text)){

    if(
      !hasFreeOpeningUsed() &&
      !FREE_OPENING_MESSAGES.includes(normalized)
    ){

      infoBar.textContent =
        "For your first free message, use only hi or hey.";

      return;

    }

    if(
      currentUser.uid !== targetId &&
      !isReceiverPaid()
    ){

      const replies =
        getReceiverReplies();

      if(replies>=FREE_RECEIVER_REPLIES){

        showGate("receiver");

        return;

      }

      infoBar.textContent =
        "Contact information cannot be shared before payment.";

      return;

    }

  }


  const existing =
    await getExistingMessages();


  const originalSenderId =
    existing.length
      ? existing[0].senderId
      : currentUser.uid;


  const amOriginalSender =
    originalSenderId===currentUser.uid;


  if(!existing.length){

    if(
      !hasFreeOpeningUsed() &&
      !FREE_OPENING_MESSAGES.includes(normalized)
    ){

      infoBar.textContent =
        "Your first free message must be exactly hi or hey.";

      return;

    }

    if(
      hasFreeOpeningUsed() &&
      getSenderCredits()<=0
    ){

      showGate("sender");

      return;

    }

  }else{

    if(amOriginalSender){

      if(getSenderCredits()<=0){

        showGate("sender");

        return;

      }

    }else{

      const replies =
        getReceiverReplies();

      if(
        replies>=FREE_RECEIVER_REPLIES &&
        !isReceiverPaid()
      ){

        showGate("receiver");

        return;

      }

    }

  }


  try{

    if(!conversationId){

      conversationId =
        getConversationId();

    }


    /*
      IMPORTANT:
      The receiver is always the other person.
      This prevents the current user from being
      accidentally saved as their own receiver.
    */

    const actualReceiverId =
      originalSenderId===currentUser.uid
        ? targetId
        : currentUser.uid;


    await setDoc(
      doc(
        db,
        "conversations",
        conversationId
      ),
      {
        initiatorId:originalSenderId,
        receiverId:
          actualReceiverId,
        updatedAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );


    await addDoc(
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),
      {
        senderId:currentUser.uid,
        receiverId:actualReceiverId,
        text,
        createdAt:
          serverTimestamp()
      }
    );


    if(!hasFreeOpeningUsed()){

      localStorage.setItem(
        freeOpeningKey(),
        "1"
      );

    }else if(amOriginalSender){

      const credits =
        getSenderCredits();

      localStorage.setItem(
        senderCreditsKey(),
        String(
          Math.max(0,credits-1)
        )
      );

    }else{

      const replies =
        getReceiverReplies();

      localStorage.setItem(
        receiverReplyKey(),
        String(replies+1)
      );

    }


    messageInput.value="";

    hideGate();

  }catch(error){

    console.error(
      "Send error:",
      error
    );

    infoBar.textContent =
      "Message could not be sent. Please try again.";

  }

}

async function getCallEntitlement(){

  if(
    !currentUser ||
    currentUser.isAnonymous ||
    !targetId ||
    targetIsDemo
  ){

    return null;

  }


  const entitlementId =
    [
      currentUser.uid,
      targetId
    ].sort().join("_");


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "callEntitlements",
          entitlementId
        )
      );


    if(!snap.exists()){

      return null;

    }


    const data =
      snap.data();


    if(data.status!=="paid"){

      return null;

    }


    return data;

  }catch(error){

    console.error(
      "Call entitlement error:",
      error
    );

    return null;

  }

}


function entitlementAllows(
  entitlement,
  requestedType
){

  if(!entitlement){

    return false;

  }


  if(entitlement.callType==="bundle"){

    return true;

  }


  return entitlement.callType===requestedType;

}


async function startCallAfterEntitlement(
  callType,
  amount
){

  if(
    !currentUser ||
    currentUser.isAnonymous
  ){

    showGate("anonymous");

    return;

  }


  if(targetIsDemo){

    infoBar.textContent =
      "Calls are available between registered Kmeet members only.";

    return;

  }


  callStatus.textContent =
    "Checking call access...";


  const entitlement =
    await getCallEntitlement();


  if(
    entitlementAllows(
      entitlement,
      callType
    )
  ){

    await startOutgoingCall(
      callType
    );

    return;

  }


  goToCallPayment(
    callType,
    amount,
    callType==="voice"
      ? "Voice Call"
      : callType==="video"
        ? "Video Call"
        : "Voice + Video Bundle"
  );

}


/* =========================================================
   WEBRTC
========================================================= */

const rtcConfiguration = {

  iceServers:[

    {
      urls:[
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302"
      ]
    }

  ]

};


function callPath(){

  return databaseRef(
    database,
    "kmeetCalls/" +
    [
      currentUser.uid,
      targetId
    ].sort().join("_")
  );

}


function currentCallPath(){

  return databaseRef(
    database,
    "kmeetCalls/" +
    [
      currentUser.uid,
      targetId
    ].sort().join("_") +
    "/calls/" +
    currentCallId
  );

}


async function createPeerConnection(
  callType,
  caller
){

  peerConnection =
    new RTCPeerConnection(
      rtcConfiguration
    );


  remoteStream =
    new MediaStream();

  remoteVideo.srcObject =
    remoteStream;


  peerConnection.ontrack =
    event=>{

      event.streams[0]
        .getTracks()
        .forEach(track=>{

          remoteStream.addTrack(track);

        });

      remoteVideo.style.display =
        callType==="video"
          ? "block"
          : "none";

    };


  peerConnection.onicecandidate =
    async event=>{

      if(!event.candidate){

        return;

      }


      if(!currentCallId){

        return;

      }


      const candidatesRef =
        databaseRef(
          database,
          "kmeetCalls/" +
          [
            currentUser.uid,
            targetId
          ].sort().join("_") +
          "/calls/" +
          currentCallId +
          "/candidates/" +
          (
            caller
              ? "caller"
              : "receiver"
          )
        );


      await databaseSet(
        databaseRef(
          candidatesRef,
          event.candidate.sdpMid +
          "_" +
          event.candidate.sdpMLineIndex +
          "_" +
          Date.now()
        ),
        event.candidate.toJSON()
      );

    };


  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }

}


async function getLocalMedia(
  callType
){

  const video =
    callType==="video" ||
    callType==="bundle";


  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio:true,

        video

      });


    localVideo.srcObject =
      localStream;


    localVideo.style.display =
      video
        ? "block"
        : "none";

    cameraBtn.style.display =
      video
        ? "flex"
        : "none";


    cameraEnabled =
      video;


    isMuted=false;

    muteBtn.textContent="🎙️";

    cameraBtn.textContent="📷";


    return true;

  }catch(error){

    console.error(
      "Media permission error:",
      error
    );


    callStatus.textContent =
      "Camera or microphone permission was not granted.";

    return false;

  }

}


/* =========================================================
   OUTGOING CALL
========================================================= */

async function startOutgoingCall(
  callType
){

  if(
    !currentUser ||
    currentUser.isAnonymous
  ){

    return;

  }


  if(targetIsDemo){

    return;

  }


  const mediaType =
    callType==="voice"
      ? "voice"
      : "video";


  const mediaReady =
    await getLocalMedia(
      mediaType
    );


  if(!mediaReady){

    return;

  }


  currentCallId =
    crypto.randomUUID();


  pendingCallId=null;

  currentCallType =
    mediaType;

  isCallActive=true;


  showCallOverlay(
    mediaType
  );


  await createPeerConnection(
    mediaType,
    true
  );


  const base =
    callPath();


  const callRef =
    databaseRef(
      base,
      "calls/" +
      currentCallId
    );


  const offer =
    await peerConnection.createOffer();


  await peerConnection.setLocalDescription(
    offer
  );


  await databaseSet(
    callRef,
    {
      callerId:currentUser.uid,
      receiverId:targetId,
      callType:mediaType,
      status:"ringing",
      offer:{
        type:offer.type,
        sdp:offer.sdp
      },
      createdAt:
        Date.now()
    }
  );


  callStatus.textContent =
    "Calling " +
    (
      targetProfile?.displayName ||
      targetProfile?.name ||
      "Kmeet member"
    ) +
    "...";


  listenForCallAnswer();

  listenForRemoteCandidates(false);

  listenForCallStatus();

}


/* =========================================================
   ANSWER LISTENER
========================================================= */

function listenForCallAnswer(){

  if(!currentCallId){

    return;

  }


  const ref =
    databaseRef(
      database,
      "kmeetCalls/" +
      [
        currentUser.uid,
        targetId
      ].sort().join("_") +
      "/calls/" +
      currentCallId +
      "/answer"
    );


  databaseOnValue(
    ref,
    async snapshot=>{

      const answer =
        snapshot.val();


      if(
        !answer ||
        !peerConnection ||
        peerConnection.currentRemoteDescription
      ){

        return;

      }


      try{

        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(answer)
        );

        callStatus.textContent =
          "Connected";

      }catch(error){

        console.error(
          "Answer error:",
          error
        );

      }

    }
  );

}


/* =========================================================
   INCOMING CALL LISTENER
========================================================= */

function listenForIncomingCalls(){

  if(
    !currentUser ||
    currentUser.isAnonymous ||
    targetIsDemo
  ){

    return;

  }


  if(unsubscribeIncomingCall){

    unsubscribeIncomingCall();

    unsubscribeIncomingCall=null;

  }


  const callsRef =
    databaseRef(
      database,
      "kmeetCalls/" +
      [
        currentUser.uid,
        targetId
      ].sort().join("_") +
      "/calls"
    );


  unsubscribeIncomingCall =
    databaseOnValue(
      callsRef,
      snapshot=>{

        const calls =
          snapshot.val();


        if(!calls){

          return;

        }


        const entries =
          Object.entries(calls);


        for(
          const [id,call]
          of entries
        ){

          if(
            call &&
            call.receiverId===currentUser.uid &&
            call.callerId===targetId &&
            call.status==="ringing"
          ){

            if(
              currentCallId===id ||
              pendingCallId===id
            ){

              continue;

            }


            pendingCallId=id;

            showIncomingCall(
              call
            );

            break;

          }

        }

      }
    );

}


/* =========================================================
   INCOMING CALL UI
========================================================= */

function showIncomingCall(call){

  const name =
    targetProfile?.displayName ||
    targetProfile?.name ||
    "Kmeet Member";


  incomingName.textContent =
    name;


  incomingType.textContent =
    call.callType==="video"
      ? "Incoming video call"
      : "Incoming voice call";


  if(
    targetProfile?.photoURL ||
    targetProfile?.photo
  ){

    incomingAvatar.src =
      targetProfile.photoURL ||
      targetProfile.photo;

    incomingAvatar.style.display =
      "block";

    incomingAvatarFallback.style.display =
      "none";

  }else{

    incomingAvatar.style.display =
      "none";

    incomingAvatarFallback.style.display =
      "flex";

    incomingAvatarFallback.textContent =
      name.charAt(0).toUpperCase();

  }


  callOverlay.classList.add("show");

  incomingCall.classList.add("show");

  callPerson.textContent=name;

  callStatus.textContent =
    "Incoming call...";

}


acceptIncoming.addEventListener(
  "click",
  async ()=>{

    if(!pendingCallId){

      return;

    }


    const callId =
      pendingCallId;


    pendingCallId=null;

    incomingCall.classList.remove(
      "show"
    );


    currentCallId=callId;


    const callRef =
      databaseRef(
        database,
        "kmeetCalls/" +
        [
          currentUser.uid,
          targetId
        ].sort().join("_") +
        "/calls/" +
        callId
      );


    const snap =
      await new Promise(resolve=>{

        databaseOnValue(
          callRef,
          value=>{
            resolve(value);
          },
          {
            onlyOnce:true
          }
        );

      });


    const call =
      snap.val();


    if(!call){

      endCall();

      return;

    }


    currentCallType =
      call.callType;


    const mediaReady =
      await getLocalMedia(
        currentCallType
      );


    if(!mediaReady){

      await databaseSet(
        databaseRef(
          callRef,
          "status"
        ),
        "declined"
      );

      endCall();

      return;

    }


    await createPeerConnection(
      currentCallType,
      false
    );


    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        call.offer
      )
    );


    const answer =
      await peerConnection.createAnswer();


    await peerConnection.setLocalDescription(
      answer
    );


    await databaseSet(
      databaseRef(
        callRef,
        "answer"
      ),
      {
        type:answer.type,
        sdp:answer.sdp
      }
    );


    await databaseSet(
      databaseRef(
        callRef,
        "status"
      ),
      "connected"
    );


    isCallActive=true;

    callStatus.textContent=
      "Connected";


    listenForRemoteCandidates(true);

    listenForCallStatus();

  }
);


declineIncoming.addEventListener(
  "click",
  async ()=>{

    if(!pendingCallId){

      incomingCall.classList.remove(
        "show"
      );

      return;

    }


    const id =
      pendingCallId;

    pendingCallId=null;


    await databaseSet(
      databaseRef(
        database,
        "kmeetCalls/" +
        [
          currentUser.uid,
          targetId
        ].sort().join("_") +
        "/calls/" +
        id +
        "/status"
      ),
      "declined"
    );


    incomingCall.classList.remove(
      "show"
    );


    closeCallOverlay();

  }
);


/* =========================================================
   REMOTE ICE CANDIDATES
========================================================= */

function listenForRemoteCandidates(
  receiver
){

  if(
    !currentCallId
  ){

    return;

  }


  if(unsubscribeIncomingCandidates){

    unsubscribeIncomingCandidates();

    unsubscribeIncomingCandidates=null;

  }


  const otherSide =
    receiver
      ? "caller"
      : "receiver";


  const ref =
    databaseRef(
      database,
      "kmeetCalls/" +
      [
        currentUser.uid,
        targetId
      ].sort().join("_") +
      "/calls/" +
      currentCallId +
      "/candidates/" +
      otherSide
    );


  unsubscribeIncomingCandidates =
    databaseOnValue(
      ref,
      async snapshot=>{

        const candidates =
          snapshot.val();


        if(!candidates){

          return;

        }


        for(
          const candidate
          of Object.values(candidates)
        ){

          try{

            await peerConnection.addIceCandidate(
              new RTCIceCandidate(
                candidate
              )
            );

          }catch(error){

            console.warn(
              "ICE candidate error:",
              error
            );

          }

        }

      }
    );

}


/* =========================================================
   CALL STATUS
========================================================= */

function listenForCallStatus(){

  if(!currentCallId){

    return;

  }


  const ref =
    databaseRef(
      database,
      "kmeetCalls/" +
      [
        currentUser.uid,
        targetId
      ].sort().join("_") +
      "/calls/" +
      currentCallId +
      "/status"
    );


  databaseOnValue(
    ref,
    snapshot=>{

      const status =
        snapshot.val();


      if(
        status==="connected"
      ){

        callStatus.textContent =
          "Connected";

      }


      if(
        status==="declined"
      ){

        callStatus.textContent =
          "Call declined";

        setTimeout(
          closeCallOverlay,
          1200
        );

      }


      if(
        status==="ended"
      ){

        callStatus.textContent =
          "Call ended";

        setTimeout(
          closeCallOverlay,
          700
        );

      }

    }
  );

}


/* =========================================================
   CALL UI
========================================================= */

function showCallOverlay(type){

  callOverlay.classList.add(
    "show"
  );

  incomingCall.classList.remove(
    "show"
  );


  const name =
    targetProfile?.displayName ||
    targetProfile?.name ||
    "Kmeet Member";


  callPerson.textContent=name;


  if(
    targetProfile?.photoURL ||
    targetProfile?.photo
  ){

    callAvatar.src =
      targetProfile.photoURL ||
      targetProfile.photo;

    callAvatar.style.display =
      "block";

    callAvatarFallback.style.display =
      "none";

  }else{

    callAvatar.style.display =
      "none";

    callAvatarFallback.style.display =
      "flex";

    callAvatarFallback.textContent =
      name.charAt(0).toUpperCase();

  }


  remoteVideo.style.display =
    type==="video"
      ? "block"
      : "none";


  cameraBtn.style.display =
    type==="video"
      ? "flex"
      : "none";

}


function closeCallOverlay(){

  callOverlay.classList.remove(
    "show"
  );

  incomingCall.classList.remove(
    "show"
  );


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

  }


  if(peerConnection){

    peerConnection.close();

  }


  localStream=null;

  remoteStream=null;

  peerConnection=null;

  currentCallId=null;

  pendingCallId=null;

  currentCallType=null;

  isCallActive=false;

  remoteVideo.srcObject=null;

  localVideo.srcObject=null;

  remoteVideo.style.display="none";

  localVideo.style.display="none";

  cameraBtn.style.display="none";

}


async function endCall(){

  if(currentCallId){

    try{

      await databaseSet(
        databaseRef(
          database,
          "kmeetCalls/" +
          [
            currentUser.uid,
            targetId
          ].sort().join("_") +
          "/calls/" +
          currentCallId +
          "/status"
        ),
        "ended"
      );

    }catch(error){

      console.warn(
        "Could not update call status:",
        error
      );

    }

  }


  closeCallOverlay();

}


endCallBtn.addEventListener(
  "click",
  endCall
);


/* =========================================================
   MUTE
========================================================= */

muteBtn.addEventListener(
  "click",
  ()=>{

    if(!localStream){

      return;

    }


    const tracks =
      localStream.getAudioTracks();


    if(!tracks.length){

      return;

    }


    isMuted=!isMuted;


    tracks.forEach(
      track=>{
        track.enabled=!isMuted;
      }
    );


    muteBtn.textContent =
      isMuted
        ? "🔇"
        : "🎙️";


    muteBtn.classList.toggle(
      "active",
      isMuted
    );

  }
);


/* =========================================================
   CAMERA
========================================================= */

cameraBtn.addEventListener(
  "click",
  ()=>{

    if(!localStream){

      return;

    }


    const tracks =
      localStream.getVideoTracks();


    if(!tracks.length){

      return;

    }


    cameraEnabled =
      !cameraEnabled;


    tracks.forEach(
      track=>{
        track.enabled=
          cameraEnabled;
      }
    );


    cameraBtn.textContent =
      cameraEnabled
        ? "📷"
        : "🚫";


    cameraBtn.classList.toggle(
      "active",
      !cameraEnabled
    );

  }
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
  auth,
  async user=>{

    currentUser=user;

    if(!user){

      if(authStarted){

        return;

      }

      authStarted=true;

      try{

        await signInAnonymously(auth);

      }catch(error){

        console.error(
          "Anonymous auth error:",
          error
        );

      }

      return;

    }


    authStarted=true;


    await loadTargetProfile();


    enableCallButtons();


    if(targetIsDemo){

      loadDemoChat();

    }else{

      startMessages();

    }


    /*
      Incoming calls are only monitored for
      registered members.
    */

    listenForIncomingCalls();


    if(user.isAnonymous){

      infoBar.textContent =
        "You are browsing Kmeet as a guest. Create an account to chat and call.";

    }

  }
);


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

    if(unsubscribeIncomingCall){

      unsubscribeIncomingCall();

    }

    if(unsubscribeIncomingCandidates){

      unsubscribeIncomingCandidates();

    }

  }
);


/* =========================================================
   SAFETY
========================================================= */

window.addEventListener(
  "pagehide",
  ()=>{

    if(
      currentCallId &&
      currentUser
    ){

      databaseSet(
        databaseRef(
          database,
          "kmeetCalls/" +
          [
            currentUser.uid,
            targetId
          ].sort().join("_") +
          "/calls/" +
          currentCallId +
          "/status"
        ),
        "ended"
      ).catch(
        ()=>{}
      );

    }

  }
);
