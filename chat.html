<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:"Poppins",sans-serif;
  color:#fff;

body{
  min-height:100vh;

/* =========================
   TOP BAR
========================= */

.topbar{
  height:70px;
  padding:0 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(10,5,15,.72);
  border-bottom:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.brand-link{
  display:flex;
  align-items:center;
  gap:10px;
  color:#fff;
  text-decoration:none;
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.65);
  box-shadow:0 0 15px rgba(255,80,160,.35);

.brand{

  font-weight:700;
  letter-spacing:.3px;
}

}

.back-btn{
  color:#fff;
  text-decoration:none;
  padding:9px 17px;
  border-radius:20px;

  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.16);

  transition:.2s ease;
}

.back-btn:hover{
  background:rgba(255,91,161,.20);
  transform:translateY(-1px);
}

/* =========================
   CHAT SHELL
========================= */

.chat-shell{
  width:min(900px,calc(100% - 28px));
  height:calc(100vh - 105px);
  min-height:560px;

  margin:18px auto;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:rgba(15,8,18,.76);
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.45),

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
  display:flex;
  align-items:center;
  gap:13px;

  padding:17px 20px;

  background:rgba(255,255,255,.055);
  border-bottom:1px solid rgba(255,255,255,.09);

.avatar,

.status{

/* =========================
   INFO BAR
========================= */

.info-bar{
  padding:10px 18px;

  font-size:12px;
  line-height:1.5;

  color:rgba(255,255,255,.70);

  border-bottom:1px solid rgba(255,255,255,.07);

  text-align:center;
}

.info-bar strong{

}

/* =========================
   MESSAGES
========================= */

.messages{

  overflow-y:auto;

  padding:22px 18px;

  display:flex;
  flex-direction:column;
  gap:11px;

  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:6px;
}

.messages::-webkit-scrollbar-track{
  background:transparent;
}

.messages::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);
  border-radius:10px;
}

.empty-state{
  margin:auto;

  max-width:390px;

  text-align:center;

  color:rgba(255,255,255,.52);
  font-size:14px;
  line-height:1.7;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message{
  max-width:min(72%,520px);

  padding:10px 14px;

  border-radius:18px;

  font-size:14px;
  line-height:1.5;

  word-wrap:break-word;
  overflow-wrap:anywhere;

  box-shadow:0 5px 18px rgba(0,0,0,.13);
}

.message.mine{
  color:#fff;

  background:

      rgba(238,62,139,.95),

}

.message.theirs{
  color:#fff;

  background:rgba(255,255,255,.105);

  border:1px solid rgba(255,255,255,.09);

  border-bottom-left-radius:5px;
}

.message-time{
  margin-top:4px;

  font-size:9px;

  opacity:.55;

  text-align:right;
}

/* =========================
   COMPOSER
========================= */

.composer{
  padding:13px 14px;

  display:flex;
  align-items:flex-end;
  gap:9px;

  background:rgba(5,2,8,.54);
  border-top:1px solid rgba(255,255,255,.08);
}

.message-input{
  flex:1;

  min-height:46px;
  max-height:130px;

  resize:none;

  border:none;
  outline:none;

  border-radius:23px;

  padding:13px 17px;

  color:#fff;

  font-family:"Poppins",sans-serif;
  font-size:14px;

  background:rgba(255,255,255,.09);

  border:1px solid rgba(255,255,255,.10);
}

.message-input::placeholder{
  color:rgba(255,255,255,.43);
}

.message-input:focus{
  border-color:rgba(255,100,170,.45);
  background:rgba(255,255,255,.105);
}

.send-btn{
  min-width:50px;
  height:46px;

  border:none;
  border-radius:23px;

  padding:0 17px;

  color:#fff;

  font-family:"Poppins",sans-serif;
  font-weight:600;

  cursor:pointer;

  background:
    linear-gradient(
      135deg,
      #ff4e9a,
      #c22b79
    );

  box-shadow:
    0 8px 22px rgba(220,42,119,.25);

  transition:.2s ease;
}

.send-btn:hover{
  transform:translateY(-1px);
  box-shadow:
    0 10px 25px rgba(220,42,119,.36);
}

.send-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

/* =========================
   GATE
========================= */

.gate{
  display:none;

  padding:22px 18px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      rgba(255,54,145,.10),

.gate.show{

.gate-title{

.gate-text{

.gate-buttons{

  justify-content:center;

}

.gate-btn{

  justify-content:center;

  padding:10px 15px;

  border-radius:22px;

  color:#fff;
  text-decoration:none;

  font-size:13px;
  font-weight:600;

  background:

      #ff4f9c,

/* =========================

========================= */

@media(max-width:600px){

  .topbar{
    height:62px;

  }

  }

  .messages{

  }

  }

/* =========================
   LOADING
========================= */

.loading{
  margin:auto;
  color:rgba(255,255,255,.55);
  font-size:13px;
}

<script type="module">

import {

  onAuthStateChanged,
  signInAnonymously,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "./firebase-config.js";


/* =========================================================
   BASIC ELEMENTS
========================================================= */

const messagesEl =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =

const personName =

const personStatus =

const avatar =

const avatarFallback =

const gate =

const gateTitle =

const gateText =

/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(window.location.search);

const targetId =
  params.get("userId") ||
  params.get("user");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let conversationId = null;

let unsubscribeMessages = null;

let authStarted = false;

let targetIsDemo = false;

let targetProfile = null;


/*
  This is important.

  Messages written locally are kept here until Firestore
  confirms them. This prevents the message from disappearing
  when Firestore briefly returns an empty snapshot.
*/
let localMessages = [];

let hasReceivedFirstSnapshot = false;

let sendingMessage = false;

/* =========================================================
   DEMO CHAT STORAGE
========================================================= */

function demoStorageKey(){

  if(!currentUser || !targetId){
    return null;
  }

  return (
    "kmeet_demo_chat_" +
    currentUser.uid +
    "_" +
    targetId
  );

}


function getDemoMessages(){

  const key = demoStorageKey();

  if(!key){
    return [];
  }

  try{

    return JSON.parse(
      localStorage.getItem(key) || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveDemoMessages(items){

  const key = demoStorageKey();

  if(!key){
    return;
  }

  localStorage.setItem(
    key,
    JSON.stringify(items)
  );

}


/* =========================================================
   CONVERSATION ID
========================================================= */

function getConversationId(){

  if(!currentUser || !targetId){
    return null;
  }

  const ids = [
    currentUser.uid,
    targetId
  ].sort();

  return ids[0] + "_" + ids[1];

}


/* =========================================================
   CONTACT INFO PROTECTION
========================================================= */

function containsContactInformation(text){

  const value =
    text
      .toLowerCase()
      .trim();

  const patterns = [

    /\b\d{9,13}\b/,

    /\b07\d{8}\b/,

    /\b01\d{8}\b/,

    /\b\d{3}[\s-]\d{3}[\s-]\d{3,4}\b/,

    /whatsapp/,

    /telegram/,

    /instagram/,

    /facebook/,

    /tiktok/,

    /snapchat/,

    /email me/,

    /call me/,

    /text me/,

    /contact me/,

    /my number/,

    /my phone/,

    /my email/,

    /@gmail\.com/,

    /@yahoo\.com/,

    /@outlook\.com/

  ];

  return patterns.some(
    pattern => pattern.test(value)
  );

}


/* =========================================================
   LOCAL STORAGE PAYMENT STATE
========================================================= */

function freeOpeningKey(){

  return (
    "kmeet_free_opening_used_" +
    currentUser.uid +

}


function senderCreditsKey(){

function receiverPaidKey(){

}


function hasUsedFreeOpening(){

  return (
    localStorage.getItem(
      freeOpeningKey()
    ) === "true"
  );

}


function hasReceiverPaid(){

  return (
    localStorage.getItem(
      receiverPaidKey()
    ) === "true"

}


function getSenderCredits(){

  return parseInt(
    localStorage.getItem(
      senderCreditsKey()
    ) || "0",
    10
  );

}


function setSenderCredits(value){

  localStorage.setItem(
    senderCreditsKey(),
    String(Math.max(0,value))
  );

}


/* =========================================================
   PROFILE DISPLAY
========================================================= */

function showTargetProfile(profile){

  targetProfile = profile || {};

  const name =
    profile?.displayName ||
    profile?.name ||
    "Kmeet Member";

  personName.textContent = name;

  personStatus.textContent =
    profile?.online === true
      ? "Online now"
      : "Your Kmeet conversation";

  const photo =
    profile?.photoURL ||
    profile?.photo ||
    profile?.profilePhoto ||
    profile?.image ||
    "";

  if(photo){

    avatar.src = photo;

    avatar.style.display = "block";

    avatarFallback.style.display = "none";

    avatar.onerror = () => {

      avatar.style.display = "none";

      avatarFallback.style.display = "flex";

    };

  }else{

    avatar.style.display = "none";

    avatarFallback.style.display = "flex";

    avatarFallback.textContent =
      name
        .charAt(0)
        .toUpperCase();

  }

}


/* =========================================================
   LOAD TARGET
========================================================= */

async function loadTarget(){

  if(!targetId){

    showTargetProfile({
      displayName:"Kmeet Member"
    });

    return;

  }


  if(demoProfiles[targetId]){

    targetIsDemo = true;

    showTargetProfile(
      demoProfiles[targetId]
    );

    return;

  }


  targetIsDemo = false;


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          targetId
        )
      );

    if(snap.exists()){

      showTargetProfile(
        snap.data()
      );

    }else{

      showTargetProfile({
        displayName:"Kmeet Member"
      });

    }

  }catch(error){

    console.error(
      "Could not load target profile:",
      error
    );

    showTargetProfile({
      displayName:"Kmeet Member"
    });

  }

}


/* =========================================================
   FORMAT MESSAGE TIME
========================================================= */

function formatMessageTime(timestamp){

  if(!timestamp){
    return "";
  }

  try{

    let date;

    if(
      typeof timestamp.toDate === "function"
    ){

      date = timestamp.toDate();

    }else if(timestamp instanceof Date){

      date = timestamp;

    }else if(
      typeof timestamp === "number"
    ){

      date = new Date(timestamp);

    }else{

      return "";

    }

    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "";

  }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(items){

  if(!Array.isArray(items)){
    items = [];
  }


  if(items.length === 0){

    messagesEl.innerHTML = `
      <div class="empty-state">
        Your conversation will appear here.<br>
        Start with a friendly message.
      </div>
    `;

    return;

  }


  messagesEl.innerHTML = "";


  items.forEach(item => {

    if(!item){
      return;
    }

    const senderId =
      item.senderId || "";

    const mine =
      senderId === currentUser?.uid;


    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (mine ? "mine" : "theirs");


    const bubble =
      document.createElement("div");

    bubble.className =
      "message " +
      (mine ? "mine" : "theirs");


    const text =
      document.createElement("div");

    text.textContent =
      item.text || "";


    const time =
      document.createElement("div");

    time.className =
      "message-time";

    time.textContent =
      formatMessageTime(
        item.createdAt ||
        item.clientCreatedAt
      );


    bubble.appendChild(text);

    if(time.textContent){
      bubble.appendChild(time);
    }

    row.appendChild(bubble);

    messagesEl.appendChild(row);

  });


  requestAnimationFrame(() => {

    messagesEl.scrollTop =
      messagesEl.scrollHeight;

  });

}


/* =========================================================
   START REAL FIRESTORE MESSAGES
========================================================= */

function startMessages(){

  if(targetIsDemo){

    loadDemoChat();

    return;

  }


  conversationId =
    getConversationId();


  if(!conversationId){

    renderMessages([]);

    return;

  }


  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }


  hasReceivedFirstSnapshot = false;


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        const serverMessages =
          snapshot.docs.map(
            item => ({
              id:item.id,
              ...item.data()
            })
          );


        /*
          IMPORTANT FIX:

          Firestore can briefly give us an empty snapshot
          while the conversation is being created.

          Never wipe a message that we have already displayed
          locally just because an empty snapshot arrived.
        */

        if(
          serverMessages.length === 0 &&
          localMessages.length > 0
        ){

          if(!hasReceivedFirstSnapshot){

            renderMessages(
              localMessages
            );

          }

          hasReceivedFirstSnapshot = true;

          return;

        }


        if(serverMessages.length > 0){

          localMessages =
            serverMessages;

          renderMessages(
            serverMessages
          );

        }else{

          if(
            !hasReceivedFirstSnapshot &&
            localMessages.length === 0
          ){

            renderMessages([]);

          }

        }


        hasReceivedFirstSnapshot = true;

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );

        /*
          Do NOT clear the existing message screen
          when the listener encounters an error.
        */

        if(
          localMessages.length === 0
        ){

          messagesEl.innerHTML = `
            <div class="empty-state">
              Your conversation is ready.<br>
              Send a message to begin.
            </div>
          `;

        }

      }

    );

}

 /* =========================================================
    ENSURE CONVERSATION EXISTS
 ========================================================= */

async function ensureConversation(){

  if(!conversationId){

    conversationId =
      getConversationId();

  }


  if(!conversationId){

    throw new Error(
      "Conversation ID could not be created."
    );

  }


  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );


  const existing =
    await getDoc(
      conversationRef
    );


  if(existing.exists()){

    return existing.data();

  }


  /*
    The current user becomes the initiator
    when this is a brand-new conversation.
  */

  const conversationData = {

    initiatorId:
      currentUser.uid,

    receiverId:
      targetId,

    createdAt:
      serverTimestamp(),

    updatedAt:
      serverTimestamp()

  };


  await setDoc(
    conversationRef,
    conversationData
  );


  return conversationData;

}

/* =========================================================
   DEMO SEND
========================================================= */

async function sendDemoMessage(text){

  const message = {

    senderId:
      currentUser.uid,

    receiverId:
      targetId,

    text:text,

    clientCreatedAt:
      Date.now()

  };

    ...getDemoMessages(),

  ];


  saveDemoMessages(
    localMessages
  );


  renderMessages(
    localMessages
  );


  messageInput.value = "";

}


/* =========================================================
   REAL MESSAGE SEND
========================================================= */

async function sendRealMessage(text){

  /*
    STEP 1:
    Create the parent conversation FIRST.

    This is the most important part of the fix because
    Firestore rules require the conversation to exist
    before a message can be created.
  */

  const conversation =
    await ensureConversation();


  /*
    Determine who is actually receiving the message.
  */

  let receiverId;


  if(
    conversation &&
    typeof conversation.receiverId === "string" &&
    typeof conversation.initiatorId === "string"
  ){

    receiverId =
      conversation.initiatorId === currentUser.uid
        ? conversation.receiverId
        : conversation.initiatorId;

  }else{

    receiverId =
      targetId;

  }


  if(
    !receiverId ||
    receiverId === currentUser.uid
  ){

    throw new Error(
      "Invalid receiver for this conversation."
    );

  }


  /*
    Create a local message immediately.

    This makes the message stay visible even if the
    Firestore snapshot arrives a moment later.
  */

  const optimisticMessage = {

    senderId:
      currentUser.uid,

    receiverId:
      receiverId,

    text:
      text,

    clientCreatedAt:
      Date.now()

  };


  localMessages = [
    ...localMessages,
    optimisticMessage
  ];


  renderMessages(
    localMessages
  );


  /*
    STEP 2:
    Actually save the message in Firestore.
  */

  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  await addDoc(
    messagesRef,
    {

      senderId:
        currentUser.uid,

      receiverId:
        receiverId,

      text:
        text,

      createdAt:
        serverTimestamp(),

      clientCreatedAt:
        Date.now()

    }
  );


  /*
    STEP 3:
    Update the conversation.

    We intentionally do this AFTER the message has been
    successfully written.
  */

  await setDoc(

    doc(
      db,
      "conversations",
      conversationId
    ),

    {

      updatedAt:
        serverTimestamp(),

      lastMessage:
        text,

      lastSenderId:
        currentUser.uid

    },

    {
      merge:true
    }

  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sendingMessage){
    return;
  }


  if(!currentUser){

    alert(
      "Please wait for Kmeet to finish loading."
    );

    return;

  }


  const text =
    messageInput.value
      .trim();


  if(!text){

    return;

  }


  /*
    Demo profiles use local demo chat.
  */

  if(targetIsDemo){

    sendingMessage = true;

    sendBtn.disabled = true;

    try{

      await sendDemoMessage(
        text
      );

    }finally{

      sendingMessage = false;

      sendBtn.disabled = false;

    }

    return;

  }


  /*
    Anonymous users cannot use the free opening.
  */

  if(currentUser.isAnonymous){

    showGate("anonymous");

    return;

  }


  /*
    Protect users from sending contact information
    before payment.
  */

  if(
    containsContactInformation(text)
  ){

    alert(
      "For your safety, contact details cannot be shared before the chat is unlocked."
    );

    return;

  }


  /*
    Determine whether the conversation already exists.

    We read ONLY the parent conversation here.

    We do NOT read the messages collection before sending.
    This avoids the permission/race problem that caused
    messages to disappear.
  */

  conversationId =
    getConversationId();


  let existingConversation = null;


  try{

    const conversationSnap =
      await getDoc(
        doc(
          db,
          "conversations",
          conversationId
        )
      );


    if(conversationSnap.exists()){

      existingConversation =
        conversationSnap.data();

    }

  }catch(error){

    console.error(
      "Conversation check failed:",
      error
    );

  }


  /*
    Brand-new conversation.

    Registered users get one free opening message,
    but it must be exactly "hi" or "hey".
  */

  if(!existingConversation){

    const normalized =
      text.toLowerCase().trim();


    if(
      normalized !== "hi" &&
      normalized !== "hey"
    ){

      showGate("sender");

      alert(
        'Your first free message must be "hi" or "hey".'
      );

      return;

    }


    if(
      hasUsedFreeOpening()
    ){

      showGate("sender");

      return;

    }

  }


  /*
    Existing conversation.

    Determine whether current user is the receiver.
  */

  if(existingConversation){

    const isReceiver =
      existingConversation.receiverId ===
        currentUser.uid;


    if(isReceiver){

      /*
        Receiver free-reply tracking.
      */

      const receiverReplyKey =
        "kmeet_receiver_replies_" +
        currentUser.uid +
        "_" +
        targetId;


      let receiverReplies =
        parseInt(
          localStorage.getItem(
            receiverReplyKey
          ) || "0",
          10
        );


      if(
        !hasReceiverPaid() &&
        receiverReplies >= 3
      ){

        showGate("receiver");

        return;

      }

    }

  }


  sendingMessage = true;

  sendBtn.disabled = true;


  try{

    await sendRealMessage(
      text
    );


    /*
      Only clear the input AFTER Firestore has accepted
      the message.
    */

    messageInput.value = "";

    messageInput.style.height = "auto";


    /*
      If this was the free first opening, mark it used
      only after successful Firestore write.
    */

    if(!existingConversation){

      localStorage.setItem(
        freeOpeningKey(),
        "true"
      );

    }


    /*
      If current user is the receiver, count the free reply
      only after the message successfully reaches Firestore.
    */

    if(existingConversation){

      const isReceiver =
        existingConversation.receiverId ===
          currentUser.uid;


      if(isReceiver){

        const receiverReplyKey =
          "kmeet_receiver_replies_" +
          currentUser.uid +
          "_" +
          targetId;


        let receiverReplies =
          parseInt(
            localStorage.getItem(
              receiverReplyKey
            ) || "0",
            10
          );


        if(
          !hasReceiverPaid()
        ){

          receiverReplies++;

          localStorage.setItem(
            receiverReplyKey,
            String(receiverReplies)
          );

        }

      }

    }


  }catch(error){

    console.error(
      "MESSAGE SEND ERROR:",
      error
    );


    /*
      Remove only the optimistic message that failed.

      Do not wipe the whole conversation.
    */

    localMessages =
      localMessages.filter(
        item =>
          !(
            item.senderId === currentUser.uid &&
            item.text === text &&
            item.clientCreatedAt
          )
      );


    renderMessages(
      localMessages
    );


    alert(
      "The message could not be sent. Please try again."
    );

  }finally{

    sendingMessage = false;

    sendBtn.disabled = false;

    messageInput.focus();

  }

}


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   AUTO RESIZE TEXTAREA
========================================================= */

messageInput.addEventListener(
  "input",
  () => {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        130
      ) + "px";

  }
);


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   AUTHENTICATION
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(authStarted){
      return;
    }

    /*
      Only mark auth as started once we actually receive
      the first auth state.
    */

    if(user){

      authStarted = true;

      currentUser = user;

    }else{

      /*
        Visitors are allowed to browse Discover.

        For chat we use anonymous authentication only so
        Firestore can safely identify the temporary visitor.
      */

      try{

        const result =
          await signInAnonymously(auth);

        currentUser =
          result.user;

        authStarted = true;

      }catch(error){

        console.error(
          "Anonymous authentication failed:",
          error
        );

        messagesEl.innerHTML = `
          <div class="empty-state">
            Kmeet could not start the chat session.<br>
            Please refresh the page and try again.
          </div>
        `;

        return;

      }

    }


    /*
      Do not allow an anonymous user to use the free
      opening message.
    */

    if(currentUser.isAnonymous){

      personStatus.textContent =
        "Guest chat — payment required";

    }


    await loadTarget();


    if(targetIsDemo){

      hideGate();

      startMessages();

      return;

    }


    /*
      Start the Firestore listener.

      It is safe now because sendRealMessage creates the
      conversation parent before writing the first message.
    */

    startMessages();

  },
  error => {

    console.error(
      "Authentication state error:",
      error
    );

  }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }
);

</script>
