<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kmeet - Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <nav class="nav">
    <a class="logo" href="index.html">Kmeet</a>

    <div class="navlinks">
      <a href="discover.html">Discover</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>

  <main class="container">

    <section class="card chatbox">

      <div id="status" class="message">
        Checking chat access...
      </div>

      <div id="chatUI" style="display:none">

        <h2 id="chatTitle">Chat</h2>

        <div id="messages" class="messages"></div>

        <form id="chatForm" class="chat-form">

          <input
            id="messageInput"
            maxlength="1000"
            autocomplete="off"
            placeholder="Write a message..."
            required
          >

          <button class="btn" type="submit">
            Send
          </button>

        </form>

      </div>

    </section>

  </main>


  <script type="module">

    import {
      auth,
      db,
      signInAnonymously,
      doc,
      getDoc,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "./firebase-config.js";


    const targetId =
      new URLSearchParams(location.search).get("userId");

    let currentUser = null;
    let unsubscribeMessages = null;

    const statusEl =
      document.getElementById("status");


    /* --------------------------------
       CHECK TARGET PROFILE
    -------------------------------- */

    if (!targetId) {

      showStatus(
        "No chat profile was selected.",
        true
      );

    } else {

      startChatAccessCheck();

    }


    /* --------------------------------
       START CHAT ACCESS CHECK
    -------------------------------- */

    async function startChatAccessCheck() {

      showStatus("Checking chat access...");

      try {

        /*
          First check whether the user is
          already signed in.
        */

        currentUser = auth.currentUser;


        /*
          Firebase may still be restoring
          the existing login session.
        */

        if (!currentUser) {

          showStatus(
            "Checking your account..."
          );

          currentUser =
            await waitForAuthUser(4000);

        }


        /*
          If there is still no account,
          create a Firebase anonymous account
          for the guest.
        */

        if (!currentUser) {

          showStatus(
            "Starting secure guest chat..."
          );

          const credential =
            await withTimeout(
              signInAnonymously(auth),
              10000,
              "Guest chat could not start. Please refresh the page."
            );

          currentUser =
            credential.user;

        }


        /*
          Make sure Firebase actually gave us
          a user.
        */

        if (!currentUser) {

          throw new Error(
            "Firebase could not create a chat session."
          );

        }


        /*
          Prevent chatting with yourself.
        */

        if (currentUser.uid === targetId) {

          showStatus(
            "You cannot chat with your own profile.",
            true
          );

          return;

        }


        /* --------------------------------
           TEMPORARY PAYMENT CHECK
        -------------------------------- */

        /*
          This is ONLY the temporary demo
          payment system.

          It will later be replaced with
          secure M-Pesa Daraja verification.
        */

        const paid =
          localStorage.getItem(
            "kmeet_demo_paid"
          ) === "true";


        if (!paid) {

          showStatus(`
            
            <h3>Chat access</h3>

            <p>
              Chat is available after payment.
            </p>

            <a
              class="btn"
              href="payment.html?userId=${encodeURIComponent(targetId)}"
            >
              Continue to Payment
            </a>

          `);

          return;

        }


        /*
          Payment is marked as completed,
          so open the chat.
        */

        await openChat();


      } catch (error) {

        console.error(
          "Chat access error:",
          error
        );

        showStatus(
          `Could not start chat: ${
            error.message ||
            "Unknown error"
          }`,
          true
        );

      }

    }


    /* --------------------------------
       WAIT FOR FIREBASE AUTH
    -------------------------------- */

    function waitForAuthUser(timeoutMs) {

      return new Promise(resolve => {

        if (auth.currentUser) {

          resolve(auth.currentUser);

          return;

        }


        let finished = false;


        const unsubscribe =
          auth.onAuthStateChanged(user => {

            if (finished) return;


            if (user) {

              finished = true;

              unsubscribe();

              resolve(user);

            }

          });


        setTimeout(() => {

          if (finished) return;

          finished = true;

          unsubscribe();

          resolve(null);

        }, timeoutMs);

      });

    }


    /* --------------------------------
       TIMEOUT HELPER
    -------------------------------- */

    function withTimeout(
      promise,
      milliseconds,
      errorMessage
    ) {

      return Promise.race([

        promise,

        new Promise(
          (_, reject) => {

            setTimeout(() => {

              reject(
                new Error(errorMessage)
              );

            }, milliseconds);

          }
        )

      ]);

    }


    /* --------------------------------
       OPEN CHAT
    -------------------------------- */

    async function openChat() {

      /*
        Load the person being contacted.
      */

      const targetSnapshot =
        await getDoc(
          doc(db, "users", targetId)
        );


      const target =
        targetSnapshot.exists()
          ? targetSnapshot.data()
          : {
              name: "Kmeet Member"
            };


      document.getElementById(
        "chatTitle"
      ).textContent =
        `Chat with ${
          target.name ||
          "Kmeet Member"
        }`;


      /*
        Hide the access message.
      */

      statusEl.style.display =
        "none";


      /*
        Show the actual chat.
      */

      document.getElementById(
        "chatUI"
      ).style.display =
        "block";


      /*
        Create one unique conversation ID
        for these two users.
      */

      const conversationId =
        [
          currentUser.uid,
          targetId
        ]
        .sort()
        .join("_");


      const messagesRef =
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      /* --------------------------------
         LISTEN FOR MESSAGES
      -------------------------------- */

      unsubscribeMessages =
        onSnapshot(
          messagesQuery,
          snapshot => {

            const box =
              document.getElementById(
                "messages"
              );


            box.innerHTML = "";


            snapshot.forEach(
              messageSnapshot => {

                const message =
                  messageSnapshot.data();


                const mine =
                  message.senderId ===
                  currentUser.uid;


                const bubble =
                  document.createElement(
                    "div"
                  );


                bubble.className =
                  `bubble ${
                    mine
                      ? "me"
                      : "them"
                  }`;


                bubble.textContent =
                  message.text || "";


                box.appendChild(
                  bubble
                );

              }
            );


            box.scrollTop =
              box.scrollHeight;

          },


          error => {

            console.error(
              "Message listener error:",
              error
            );


            showStatus(
              `Could not load messages: ${
                error.message
              }`,
              true
            );

          }

        );


      /* --------------------------------
         SEND MESSAGE
      -------------------------------- */

      document
        .getElementById("chatForm")
        .addEventListener(
          "submit",
          async event => {

            event.preventDefault();


            const input =
              document.getElementById(
                "messageInput"
              );


            const text =
              input.value.trim();


            if (!text) return;


            try {

              await addDoc(
                messagesRef,
                {

                  senderId:
                    currentUser.uid,

                  targetId:
                    targetId,

                  text:
                    text,

                  createdAt:
                    serverTimestamp()

                }
              );


              input.value = "";


            } catch (error) {

              console.error(
                error
              );


              alert(
                "Message could not be sent: " +
                error.message
              );

            }

          }
        );

    }


    /* --------------------------------
       STATUS MESSAGE
    -------------------------------- */

    function showStatus(
      message,
      error = false
    ) {

      statusEl.className =
        error
          ? "message error"
          : "message";


      statusEl.innerHTML =
        message;


      statusEl.style.display =
        "block";

    }

  </script>

</body>
</html>
