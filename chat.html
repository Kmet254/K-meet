<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet — Chat</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #fff;

  background:
    linear-gradient(
      rgba(10,5,10,.45),
      rgba(10,5,10,.70)
    ),
    url("chat.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;

  overflow-x: hidden;
}

body::before {

  content: "";

  position: fixed;

  inset: 0;

  background:
    radial-gradient(
      circle at 18% 18%,
      rgba(255,190,210,.10),
      transparent 34%
    ),
    radial-gradient(
      circle at 82% 78%,
      rgba(255,90,150,.10),
      transparent 36%
    );

  pointer-events: none;

  z-index: 0;
}

.page {

  min-height: 100vh;

  position: relative;

  z-index: 1;

  display: flex;
  flex-direction: column;
}

/* NAV */

.topbar {

  width: 100%;

  padding: 18px 22px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    rgba(15,8,15,.38);

  border-bottom:
    1px solid rgba(255,255,255,.14);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.brand {

  font-size: 24px;

  font-weight: 700;

  letter-spacing: .5px;
}

.brand span {
  color: #ff9ab9;
}

.back-btn {

  color: #fff;

  text-decoration: none;

  padding: 9px 15px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid rgba(255,255,255,.18);
}

/* CHAT */

.chat-shell {

  width:
    min(
      900px,
      calc(100% - 28px)
    );

  height:
    calc(100vh - 105px);

  min-height: 560px;

  margin: 18px auto;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background:
    rgba(25,12,23,.46);

  border:
    1px solid rgba(255,255,255,.20);

  border-radius: 26px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.42);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

/* HEADER */

.chat-header {

  padding: 16px 20px;

  display: flex;
  align-items: center;

  gap: 13px;

  background:
    rgba(10,5,10,.28);

  border-bottom:
    1px solid rgba(255,255,255,.13);
}

.avatar,
.avatar-fallback {

  width: 48px;
  height: 48px;

  border-radius: 50%;

  flex: 0 0 auto;
}

.avatar {

  object-fit: cover;

  background:
    rgba(255,255,255,.14);

  border:
    2px solid rgba(255,255,255,.3);
}

.avatar-fallback {

  display: grid;

  place-items: center;

  background:
    linear-gradient(
      135deg,
      #ff9ab9,
      #b85d82
    );

  font-weight: 700;

  font-size: 19px;

  border:
    2px solid rgba(255,255,255,.3);
}

.person-name {

  font-size: 18px;

  font-weight: 700;
}

.status {

  margin-top: 3px;

  font-size: 13px;

  color:
    rgba(255,255,255,.72);
}

/* MESSAGES */

.messages {

  flex: 1;

  overflow-y: auto;

  padding: 22px;

  display: flex;
  flex-direction: column;

  gap: 10px;

  scroll-behavior: smooth;
}

.message {

  max-width:
    min(72%,600px);

  padding:
    11px 14px;

  border-radius: 18px;

  line-height: 1.45;

  word-wrap: break-word;

  white-space: pre-wrap;

  box-shadow:
    0 5px 18px rgba(0,0,0,.12);
}

.message.mine {

  align-self: flex-end;

  background:
    linear-gradient(
      135deg,
      rgba(225,94,137,.94),
      rgba(164,64,105,.94)
    );

  border-bottom-right-radius: 5px;
}

.message.theirs {

  align-self: flex-start;

  background:
    rgba(255,255,255,.15);

  border:
    1px solid rgba(255,255,255,.13);

  border-bottom-left-radius: 5px;
}

.empty {

  margin: auto;

  text-align: center;

  color:
    rgba(255,255,255,.72);

  max-width: 360px;

  line-height: 1.6;
}

/* COMPOSER */

.composer {

  padding: 14px;

  display: flex;

  gap: 10px;

  background:
    rgba(8,4,8,.35);

  border-top:
    1px solid rgba(255,255,255,.13);
}

.composer textarea {

  flex: 1;

  resize: none;

  min-height: 48px;
  max-height: 130px;

  padding:
    13px 15px;

  border:
    1px solid rgba(255,255,255,.18);

  border-radius: 17px;

  outline: none;

  color: #fff;

  background:
    rgba(255,255,255,.10);

  font: inherit;
}

.composer textarea::placeholder {

  color:
    rgba(255,255,255,.62);
}

.send-btn {

  padding: 0 21px;

  min-width: 78px;

  cursor: pointer;

  border: 0;

  border-radius: 17px;

  color: #fff;

  font-weight: 700;

  background:
    linear-gradient(
      135deg,
      #e66a94,
      #a9426d
    );

  box-shadow:
    0 8px 22px rgba(150,47,88,.30);
}

.send-btn:disabled {

  opacity: .55;

  cursor: not-allowed;
}

/* PAYMENT GATE */

.gate {

  flex: 1;

  display: grid;

  place-items: center;

  padding: 35px;

  text-align: center;
}

.gate-card {

  width:
    min(560px,100%);

  padding:
    36px 30px;

  border-radius: 24px;

  background:
    rgba(15,7,14,.58);

  border:
    1px solid rgba(255,255,255,.17);

  box-shadow:
    0 20px 60px rgba(0,0,0,.3);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
}

.gate-icon {

  font-size: 42px;

  margin-bottom: 10px;
}

.gate-card h2 {

  margin:
    0 0 10px;

  font-size: 27px;
}

.gate-card p {

  margin:
    0 auto 22px;

  max-width: 450px;

  color:
    rgba(255,255,255,.78);

  line-height: 1.6;
}

.gate-buttons {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 10px;
}

.pay-btn {

  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-width: 145px;

  padding:
    13px 20px;

  border-radius: 999px;

  text-decoration: none;

  color: #fff;

  font-weight: 700;

  background:
    linear-gradient(
      135deg,
      #e66a94,
      #a9426d
    );

  border: 0;

  cursor: pointer;

  box-shadow:
    0 8px 22px rgba(150,47,88,.30);
}

.secondary-btn {

  background:
    rgba(255,255,255,.10);

  border:
    1px solid rgba(255,255,255,.18);
}

/* ERROR */

.error {

  color:
    #ffd0d8;

  background:
    rgba(150,30,55,.30);

  border:
    1px solid rgba(255,150,170,.22);

  padding:
    12px 14px;

  border-radius: 12px;

  margin: 14px;

  display: none;
}

/* INFO */

.info-bar {

  padding:
    8px 14px;

  text-align: center;

  color:
    rgba(255,255,255,.70);

  font-size: 11px;
}

/* MOBILE */

@media(max-width:650px) {

  .topbar {
    padding: 14px 15px;
  }

  .brand {
    font-size: 21px;
  }

  .chat-shell {

    width:
      calc(100% - 12px);

    height:
      calc(100vh - 83px);

    min-height: 0;

    margin:
      6px auto;

    border-radius: 20px;
  }

  .messages {
    padding: 15px;
  }

  .message {
    max-width: 84%;
  }

  .composer {
    padding: 10px;
  }

  .send-btn {
    min-width: 64px;
    padding: 0 14px;
  }

}

</style>

</head>

<body>

<div class="page">

<header class="topbar">

  <div class="brand">
    K<span>meet</span>
  </div>

  <a
    class="back-btn"
    href="discover.html"
  >
    ← Back
  </a>

</header>

<main class="chat-shell">

  <div
    id="errorBox"
    class="error"
  ></div>

  <!-- CHAT -->

  <section
    id="chatArea"
    style="
      display:flex;
      height:100%;
      flex-direction:column;
    "
  >

    <div class="chat-header">

      <div
        id="avatarFallback"
        class="avatar-fallback"
      >
        K
      </div>

      <img
        id="avatar"
        class="avatar"
        alt=""
        style="display:none"
      >

      <div>

        <div
          id="personName"
          class="person-name"
        >
          Kmeet Member
        </div>

        <div class="status">
          Your Kmeet conversation
        </div>

      </div>

    </div>

    <div
      id="infoBar"
      class="info-bar"
    >
      Say hello and let the connection grow ❤️
    </div>

    <div
      id="messages"
      class="messages"
    >

      <div
        id="emptyState"
        class="empty"
      >
        Start the conversation and let the connection grow. ❤️
      </div>

    </div>

    <form
      id="composer"
      class="composer"
    >

      <textarea
        id="messageInput"
        placeholder="Write a message…"
        maxlength="2000"
        required
      ></textarea>

      <button
        id="sendBtn"
        class="send-btn"
        type="submit"
      >
        Send
      </button>

    </form>

  </section>

  <!-- PAYMENT GATE -->

  <section
    id="gate"
    class="gate"
    style="display:none"
  >

    <div class="gate-card">

      <div
        id="gateIcon"
        class="gate-icon"
      >
        💗
      </div>

      <h2 id="gateTitle">
        Unlock your conversation
      </h2>

      <p id="gateText">
        Continue chatting with Kmeet credits.
      </p>

      <div
        id="gateButtons"
        class="gate-buttons"
      ></div>

    </div>

  </section>

</main>

</div>


<script type="module">

import {
  auth,
  db
} from "./firebase-config.js";


/*
  IMPORTANT:

  signInAnonymously is imported directly
  from Firebase here because your current
  firebase-config.js does NOT export it.
*/

import {
  onAuthStateChanged,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  doc,
  getDoc,
  collection,
  addDoc,
  setDoc,
  getDocs,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* =========================================================
   URL
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const targetId =
  params.get("userId") ||
  params.get("user");


/* =========================================================
   DOM
========================================================= */

const chatArea =
  document.getElementById("chatArea");

const gate =
  document.getElementById("gate");

const gateTitle =
  document.getElementById("gateTitle");

const gateText =
  document.getElementById("gateText");

const gateButtons =
  document.getElementById("gateButtons");

const gateIcon =
  document.getElementById("gateIcon");

const errorBox =
  document.getElementById("errorBox");

const personName =
  document.getElementById("personName");

const avatar =
  document.getElementById("avatar");

const avatarFallback =
  document.getElementById("avatarFallback");

const messages =
  document.getElementById("messages");

const composer =
  document.getElementById("composer");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const infoBar =
  document.getElementById("infoBar");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let conversationId = null;

let unsubscribeMessages = null;

let authStarted = false;

let messagesLoaded = false;


/* =========================================================
   CONSTANTS
========================================================= */

const FREE_OPENING_MESSAGES = [
  "hi",
  "hey"
];

const FREE_RECEIVER_REPLIES = 3;

const RECEIVER_FEE = 11;

const SENDER_PACK_3_PRICE = 49;

const SENDER_PACK_8_PRICE = 100;


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value).replace(
    /[&<>"']/g,

    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c])

  );
}


/* =========================================================
   TARGET PROFILE
========================================================= */

async function loadTargetProfile() {

  if (!targetId) {

    throw new Error(
      "No Kmeet profile was selected."
    );

  }

  const snap =
    await getDoc(
      doc(
        db,
        "users",
        targetId
      )
    );

  if (!snap.exists()) {

    throw new Error(
      "The selected Kmeet profile could not be found."
    );

  }

  const data =
    snap.data();

  const name =
    data.name ||
    data.username ||
    "Kmeet Member";

  personName.textContent =
    name;

  avatarFallback.textContent =
    name
      .charAt(0)
      .toUpperCase();

  const photo =
    data.photoURL ||
    data.avatar ||
    "";

  if (photo) {

    avatar.src =
      photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";

  }

}


/* =========================================================
   CONVERSATION ID
========================================================= */

function getConversationId() {

  return [
    currentUser.uid,
    targetId
  ]
  .sort()
  .join("_");

}


/* =========================================================
   CONTACT DETECTION
========================================================= */

function containsContactInformation(text) {

  const value =
    String(text)
      .toLowerCase()
      .trim();


  /* EMAIL */

  const emailPattern =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;

  if (
    emailPattern.test(value)
  ) {
    return true;
  }


  /* KENYAN PHONE NUMBERS */

  const phonePattern =
    /(?:\+?254[\s-]?(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3,4})|(?:0(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3})/i;

  if (
    phonePattern.test(value)
  ) {
    return true;
  }


  /* CONTACT LANGUAGE */

  const contactWords =
    /\b(whatsapp|whats\s*app|call me|text me|message me|contact me|my number|phone number|email me|dm me|instagram|telegram|facebook)\b/i;

  if (
    contactWords.test(value)
  ) {
    return true;
  }


  /* SOCIAL HANDLES */

  const socialHandle =
    /(?:^|\s)@[a-z0-9_.]{3,}/i;

  if (
    socialHandle.test(value)
  ) {
    return true;
  }


  return false;
}


/* =========================================================
   OPEN PAYMENT GATE
========================================================= */

function showGate(
  type
) {

  gate.style.display =
    "grid";

  chatArea.style.display =
    "none";


  gateButtons.innerHTML =
    "";


  if (
    type === "sender"
  ) {

    gateIcon.textContent =
      "💎";

    gateTitle.textContent =
      "Continue chatting";

    gateText.textContent =
      "Your free opening message has been used. Choose a Kmeet chat package to continue.";

    gateButtons.innerHTML = `

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49"
      >
        3 Chats — KSh 49
      </a>

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100"
      >
        8 Chats — KSh 100
      </a>

      <a
        class="pay-btn secondary-btn"
        href="discover.html"
      >
        Back to Discover
      </a>

    `;

    return;
  }


  if (
    type === "receiver"
  ) {

    gateIcon.textContent =
      "💗";

    gateTitle.textContent =
      "Continue the conversation";

    gateText.textContent =
      "You have used your free replies or attempted to share contact information. Pay KSh 11 to continue.";

    gateButtons.innerHTML = `

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=receiver&amount=11"
      >
        Continue — KSh 11
      </a>

      <a
        class="pay-btn secondary-btn"
        href="discover.html"
      >
        Back to Discover
      </a>

    `;

  }

}


/* =========================================================
   SHOW CHAT
========================================================= */

function showChat() {

  gate.style.display =
    "none";

  chatArea.style.display =
    "flex";

}


/* =========================================================
   LOAD EXISTING MESSAGES
========================================================= */

function startMessages() {

  if (!currentUser) {
    return;
  }

  conversationId =
    getConversationId();


  const ref =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const q =
    query(
      ref,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      q,

      snapshot => {

        messagesLoaded =
          true;

        messages.innerHTML =
          "";


        if (
          snapshot.empty
        ) {

          messages.innerHTML = `
            <div class="empty">
              Start the conversation and let the connection grow. ❤️
            </div>
          `;

          return;

        }


        let firstSenderId =
          null;

        let receiverReplies =
          0;

        snapshot.forEach(
          item => {

            const data =
              item.data();


            if (
              !firstSenderId
            ) {

              firstSenderId =
                data.senderId;

            }


            if (
              data.senderId !==
              firstSenderId
            ) {

              receiverReplies++;

            }


            const div =
              document.createElement(
                "div"
              );


            div.className =
              "message " +
              (
                data.senderId ===
                currentUser.uid
                  ? "mine"
                  : "theirs"
              );


            div.textContent =
              data.text || "";


            messages.appendChild(
              div
            );

          }
        );


        messages.scrollTop =
          messages.scrollHeight;


        /*
          The first sender is the person
          who opened the conversation.
        */

        if (
          firstSenderId ===
          currentUser.uid
        ) {

          infoBar.textContent =
            "Your opening message is free. Further messages use chat credits.";

        } else {

          infoBar.textContent =
            `You have ${Math.max(
              0,
              FREE_RECEIVER_REPLIES -
              receiverReplies
            )} free replies remaining.`;

        }

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );

        /*
          Do NOT hide the chat if Firestore
          temporarily fails.
        */

        showError(
          "The chat interface is open, but messages could not be loaded. Please check your Firebase Firestore rules."
        );

      }

    );

}


/* =========================================================
   AUTHENTICATION
========================================================= */

async function initialiseAuth() {

  if (
    authStarted
  ) {
    return;
  }

  authStarted =
    true;


  onAuthStateChanged(
    auth,

    async user => {

      try {

        /*
          Existing logged-in user
        */

        if (user) {

          currentUser =
            user;

          startMessages();

          return;

        }


        /*
          No current user:
          create anonymous session.
        */

        await signInAnonymously(
          auth
        );

      }

      catch (error) {

        console.error(
          "Kmeet authentication error:",
          error
        );


        if (
          error.code ===
          "auth/operation-not-allowed"
        ) {

          showError(
            "Anonymous Authentication is not enabled in Firebase. Enable Authentication → Sign-in method → Anonymous."
          );

        } else {

          showError(
            "Kmeet could not start the chat session. Please refresh the page."
          );

        }

      }

    }

  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

composer.addEventListener(
  "submit",

  async event => {

    event.preventDefault();


    const text =
      messageInput.value.trim();


    if (!text) {
      return;
    }


    if (!currentUser) {

      showError(
        "Kmeet is still preparing your chat session. Please try again in a moment."
      );

      return;

    }


    if (!conversationId) {

      conversationId =
        getConversationId();

    }


    /*
      Get existing messages.
      This makes the rules work even after
      refreshing the page.
    */

    let existingMessages = [];


    try {

      const snap =
        await getDocs(
          query(
            collection(
              db,
              "conversations",
              conversationId,
              "messages"
            ),
            orderBy(
              "createdAt",
              "asc"
            )
          )
        );


      snap.forEach(
        item => {

          existingMessages.push(
            item.data()
          );

        }
      );

    }

    catch (error) {

      console.error(error);

      showError(
        "Kmeet could not check this conversation. Please try again."
      );

      return;

    }


    const firstMessage =
      existingMessages[0];


    /*
      =========================================
      FIRST MESSAGE
      =========================================
    */

    if (
      existingMessages.length === 0
    ) {

      const opening =
        text.toLowerCase();


      if (
        !FREE_OPENING_MESSAGES.includes(
          opening
        )
      ) {

        showError(
          "Your first message must be “hi” or “hey”."
        );

        return;

      }

    }


    /*
      =========================================
      DETERMINE ROLE
      =========================================
    */

    const senderId =
      firstMessage
        ? firstMessage.senderId
        : currentUser.uid;


    const isSender =
      senderId ===
      currentUser.uid;


    /*
      =========================================
      CONTACT SHARING
      =========================================
    */

    if (
      containsContactInformation(
        text
      )
    ) {

      if (
        !isSender
      ) {

        /*
          Receiver attempted to share
          contact information.

          Block it immediately.
        */

        showGate(
          "receiver"
        );

        return;

      }


      /*
        Sender contact sharing requires
        sender credits as well.
      */

      showGate(
        "sender"
      );

      return;

    }


    /*
      =========================================
      SENDER RULE
      =========================================
    */

    if (
      isSender &&
      existingMessages.length > 0
    ) {

      /*
        Demo credit storage is kept per
        Firebase user + conversation.
      */

      const creditKey =
        "kmeet_sender_credits_" +
        currentUser.uid +
        "_" +
        targetId;


      let credits =
        parseInt(
          localStorage.getItem(
            creditKey
          ) || "0",
          10
        );


      if (
        credits <= 0
      ) {

        showGate(
          "sender"
        );

        return;

      }

      /*
        Consume one sender chat credit.
      */

      credits--;

      localStorage.setItem(
        creditKey,
        String(credits)
      );

    }


    /*
      =========================================
      RECEIVER RULE
      =========================================
    */

    if (
      !isSender
    ) {

      const receiverReplies =
        existingMessages.filter(
          item =>
            item.senderId ===
            currentUser.uid
        ).length;


      if (
        receiverReplies >=
        FREE_RECEIVER_REPLIES
      ) {

        const paidKey =
          "kmeet_receiver_paid_" +
          currentUser.uid +
          "_" +
          targetId;


        const paid =
          localStorage.getItem(
            paidKey
          ) === "true";


        if (!paid) {

          showGate(
            "receiver"
          );

          return;

        }

      }

    }


    /*
      =========================================
      SAVE MESSAGE
      =========================================
    */

    sendBtn.disabled =
      true;


    try {

      await setDoc(

        doc(
          db,
          "conversations",
          conversationId
        ),

        {
          initiatorId:
            senderId,

          targetId:
            targetId,

          updatedAt:
            serverTimestamp(),

          createdAt:
            serverTimestamp()

        },

        {
          merge: true
        }

      );


      await addDoc(

        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),

        {
          senderId:
            currentUser.uid,

          targetId:
            targetId,

          text:
            text,

          createdAt:
            serverTimestamp()

        }

      );


      messageInput.value =
        "";

      messageInput.focus();


    }

    catch (error) {

      console.error(
        "Message send failed:",
        error
      );

      showError(
        "Your message could not be sent. Please check your Firestore rules."
      );

    }

    finally {

      sendBtn.disabled =
        false;

    }

  }
);


/* ENTER TO SEND */

messageInput.addEventListener(
  "keydown",

  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      composer.requestSubmit();

    }

  }
);


/* =========================================================
   START
========================================================= */

async function start() {

  /*
    The chat interface is already visible.
    Firebase loads in the background.
  */

  if (!targetId) {

    showError(
      "No profile was selected for this chat."
    );

    sendBtn.disabled =
      true;

    return;

  }


  try {

    await loadTargetProfile();

  }

  catch (error) {

    console.error(error);

    showError(
      error.message ||
      "Unable to load the selected profile."
    );

  }


  /*
    Firebase authentication happens after
    the interface is already visible.
  */

  initialiseAuth();

}


start();


window.addEventListener(
  "beforeunload",

  () => {

    if (
      unsubscribeMessages
    ) {

      unsubscribeMessages();

    }

  }
);

</script>
