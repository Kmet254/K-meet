<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kmeet - Chat</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .chat-page {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    .chat-card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .chat-header h2 {
      margin: 0;
    }

    .messages {
      height: 450px;
      overflow-y: auto;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 16px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .bubble.me {
      margin-left: auto;
      background: #e91e63;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bubble.them {
      margin-right: auto;
      background: white;
      color: #222;
      border: 1px solid #ddd;
      border-bottom-left-radius: 4px;
    }

    .chat-form {
      display: flex;
      gap: 10px;
    }

    .chat-form input {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .status {
      text-align: center;
      padding: 30px 15px;
      color: #555;
    }

    .status.error {
      color: #b00020;
    }

    .payment-box {
      text-align: center;
    }

    .payment-box h2 {
      margin-bottom: 10px;
    }

    .payment-box p {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <nav class="nav">
    <a class="logo" href="index.html">Kmeet</a>

    <div class="navlinks">
      <a href="discover.html">Discover</a>
      <a href="profile.html">Profile</a>
    </div>
  </nav>


  <main class="chat-page">

    <section class="chat-card">

      <!-- ACCESS / LOADING STATUS -->
      <div id="status" class="status">
        Checking chat access...
      </div>


      <!-- PAYMENT MESSAGE -->
      <div id="paymentBox"
           class="payment-box"
           style="display:none;">

        <h2>Chat access</h2>

        <p>
          Chat is available after completing the
          Kmeet continuation payment.
        </p>

        <a id="paymentButton"
           class="btn"
           href="#">
          Continue to Payment
        </a>

      </div>


      <!-- CHAT -->
      <div id="chatUI" style="display:none;">

        <div class="chat-header">

          <h2 id="chatTitle">
            Chat
          </h2>

          <a href="discover.html">
            Back
          </a>

        </div>


        <div id="messages"
             class="messages">
        </div>


        <form id="chatForm"
              class="chat-form">

          <input
            id="messageInput"
            type="text"
            maxlength="1000"
            autocomplete="off"
            placeholder="Write a message..."
            required
          >

          <button
            class="btn"
            type="submit">
            Send
          </button>

        </form>

      </div>

    </section>

  </main>


  <script type="module">

    /*
     * Firebase imports are loaded directly here.
     * This avoids depending on missing exports in
     * firebase-config.js.
     */

    import {
      auth,
      db,
      signInAnonymously
    } from "./firebase-config.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /*
     * Accept BOTH:
     *
     * chat.html?user=ABC
     *
     * and
     *
     * chat.html?userId=ABC
     */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const targetId =
      params.get("userId") ||
      params.get("user");


    let currentUser = null;
    let conversationId = null;
    let messagesUnsubscribe = null;


    const status =
      document.getElementById("status");

    const paymentBox =
      document.getElementById("paymentBox");

    const paymentButton =
      document.getElementById("paymentButton");

    const chatUI =
      document.getElementById("chatUI");

    const chatTitle =
      document.getElementById("chatTitle");

    const messages =
      document.getElementById("messages");

    const chatForm =
      document.getElementById("chatForm");

    const messageInput =
      document.getElementById("messageInput");


    /*
     * No target profile.
     */

    if (!targetId) {

      showError(
        "No profile was selected for this chat."
      );

    } else {

      checkChatAccess();

    }


    /*
     * CHECK CHAT ACCESS
     */

    async function checkChatAccess() {

      try {

        showStatus(
          "Checking chat access..."
        );


        /*
         * Wait briefly for Firebase to restore
         * an existing signed-in user.
         */

        currentUser =
          await waitForExistingUser(4000);


        /*
         * If nobody is signed in,
         * create an anonymous guest account.
         */

        if (!currentUser) {

          showStatus(
            "Starting guest chat..."
          );

          const result =
            await withTimeout(
              signInAnonymously(auth),
              10000
            );

          currentUser =
            result.user;

        }


        if (!currentUser) {

          throw new Error(
            "Could not create a chat session."
          );

        }


        /*
         * Prevent chatting with yourself.
         */

        if (
          currentUser.uid === targetId
        ) {

          showError(
            "You cannot chat with your own profile."
          );

          return;

        }


        /*
         * TEMPORARY DEMO PAYMENT CHECK.
         *
         * This is NOT production payment
         * verification.
         */

        const paid =
          localStorage.getItem(
            "kmeet_demo_paid"
          ) === "true";


        if (!paid) {

          showPayment();

          return;

        }


        /*
         * Payment flag exists,
         * so open the chat.
         */

        await openChat();


      } catch (error) {

        console.error(
          "Chat access error:",
          error
        );

        showError(
          "Could not start chat: " +
          (
            error.message ||
            "Unknown error"
          )
        );

      }

    }


    /*
     * WAIT FOR AN EXISTING USER
     */

    function waitForExistingUser(
      timeout
    ) {

      return new Promise(resolve => {

        if (auth.currentUser) {

          resolve(
            auth.currentUser
          );

          return;

        }


        let done = false;


        const unsubscribe =
          onAuthStateChanged(
            auth,
            user => {

              if (done) return;


              if (user) {

                done = true;

                unsubscribe();

                resolve(user);

              }

            }
          );


        setTimeout(() => {

          if (done) return;

          done = true;

          unsubscribe();

          resolve(null);

        }, timeout);

      });

    }


    /*
     * TIMEOUT
     */

    function withTimeout(
      promise,
      timeout = 10000
    ) {

      return Promise.race([

        promise,

        new Promise(
          (_, reject) => {

            setTimeout(
              () => {

                reject(
                  new Error(
                    "Firebase took too long to respond."
                  )
                );

              },
              timeout
            );

          }
        )

      ]);

    }


    /*
     * SHOW STATUS
     */

    function showStatus(
      message
    ) {

      status.style.display =
        "block";

      status.className =
        "status";

      status.innerHTML =
        message;

    }


    /*
     * SHOW ERROR
     */

    function showError(
      message
    ) {

      status.style.display =
        "block";

      status.className =
        "status error";

      status.innerHTML =
        "<strong>Error:</strong><br>" +
        message;

    }


    /*
     * SHOW PAYMENT
     */

    function showPayment() {

      status.style.display =
        "none";

      paymentBox.style.display =
        "block";

      paymentButton.href =
        "payment.html?userId=" +
        encodeURIComponent(
          targetId
        );

    }


    /*
     * OPEN CHAT
     */

    async function openChat() {

      /*
       * Get target user's profile.
       */

      const targetRef =
        doc(
          db,
          "users",
          targetId
        );


      const targetSnapshot =
        await getDoc(
          targetRef
        );


      let targetName =
        "Kmeet Member";


      if (
        targetSnapshot.exists()
      ) {

        const target =
          targetSnapshot.data();


        targetName =
          target.name ||
          target.displayName ||
          "Kmeet Member";

      }


      chatTitle.textContent =
        "Chat with " +
        targetName;


      /*
       * Create consistent conversation ID.
       */

      conversationId =
        [
          currentUser.uid,
          targetId
        ]
        .sort()
        .join("_");


      /*
       * Hide loading/payment.
       */

      status.style.display =
        "none";

      paymentBox.style.display =
        "none";


      /*
       * Show chat.
       */

      chatUI.style.display =
        "block";


      /*
       * Messages collection.
       */

      const messagesRef =
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      /*
       * Listen for messages.
       */

      messagesUnsubscribe =
        onSnapshot(
          messagesQuery,
          snapshot => {

            messages.innerHTML =
              "";


            snapshot.forEach(
              messageDoc => {

                const data =
                  messageDoc.data();


                const bubble =
                  document.createElement(
                    "div"
                  );


                const mine =
                  data.senderId ===
                  currentUser.uid;


                bubble.className =
                  mine
                    ? "bubble me"
                    : "bubble them";


                bubble.textContent =
                  data.text || "";


                messages.appendChild(
                  bubble
                );

              }
            );


            messages.scrollTop =
              messages.scrollHeight;

          },
          error => {

            console.error(
              "Message listener error:",
              error
            );


            showError(
              "Could not load messages: " +
              error.message
            );

          }
        );


      /*
       * SEND MESSAGE
       */

      chatForm.addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          const text =
            messageInput.value.trim();


          if (!text) return;


          try {

            await addDoc(
              messagesRef,
              {

                senderId:
                  currentUser.uid,

                targetId:
                  targetId,

                text:
                  text,

                createdAt:
                  serverTimestamp()

              }
            );


            messageInput.value =
              "";


            messageInput.focus();


          } catch (error) {

            console.error(
              "Send message error:",
              error
            );


            alert(
              "Message could not be sent: " +
              error.message
            );

          }

        }
      );

    }


    /*
     * CLEAN UP FIRESTORE LISTENER
     */

    window.addEventListener(
      "beforeunload",
      () => {

        if (
          messagesUnsubscribe
        ) {

          messagesUnsubscribe();

        }

      }
    );

  </script>

</body>
</html>
