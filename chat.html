*{

html,

/* =========================

========================= */

========================= */

/* =========================================================
   DEMO CHAT STORAGE
========================================================= */

function demoStorageKey(){

  if(!currentUser || !targetId){
    return null;
  }

  return (
    "kmeet_demo_chat_" +
    currentUser.uid +
    "_" +
    targetId
  );

}


function getDemoMessages(){

  const key =
    demoStorageKey();

  if(!key){
    return [];
  }

  try{

    return JSON.parse(
      localStorage.getItem(key) || "[]"
    );

  }catch(error){

    console.error(
      "Demo chat storage error:",
      error
    );

    return [];

  }

}


function saveDemoMessages(items){

  const key =
    demoStorageKey();

  if(!key){
    return;
  }

  try{

    localStorage.setItem(
      key,
      JSON.stringify(items)
    );

  }catch(error){

    console.error(
      "Could not save demo messages:",
      error
    );

  }

}


/* =========================================================
   CONVERSATION ID
========================================================= */

/*
   IMPORTANT FIX

   The old conversation ID was:

   uid1_uid2

   One of the old records was corrupted and contained:

   initiatorId = currentUser.uid
   receiverId  = currentUser.uid

   We are therefore moving Kmeet chat conversations to
   a NEW versioned ID.

   This means the broken old conversation is ignored.

   Both participants still generate exactly the same ID
   because both UIDs are sorted first.
*/

function getConversationId(){

  if(!currentUser || !targetId){
    return null;
  }


  if(currentUser.uid === targetId){

    console.error(
      "Kmeet prevented a self-conversation."
    );

    return null;

  }


  const ids = [
    currentUser.uid,
    targetId
  ].sort();


  return (
    "kmeet_v2_" +
    ids[0] +
    "_" +
    ids[1]
  );

}


/* =========================================================
   CONTACT INFORMATION PROTECTION
========================================================= */

function containsContactInformation(text){

  const value =
    text
      .toLowerCase()
      .trim();


  const patterns = [

    /\b\d{9,13}\b/,

    /\b07\d{8}\b/,

    /\b01\d{8}\b/,

    /\b\d{3}[\s-]\d{3}[\s-]\d{3,4}\b/,

    /whatsapp/,

    /telegram/,

    /instagram/,

    /facebook/,

    /tiktok/,

    /snapchat/,

    /email me/,

    /call me/,

    /text me/,

    /contact me/,

    /my number/,

    /my phone/,

    /my email/,

    /@gmail\.com/,

    /@yahoo\.com/,

    /@outlook\.com/

  ];


  return patterns.some(
    pattern =>
      pattern.test(value)
  );

}

/* =========================================================

========================================================= */

function showTargetProfile(profile){

  const name =

  personName.textContent =

  personStatus.textContent =

    profile?.photo ||
    profile?.profilePhoto ||
    profile?.image ||

    avatar.src =
      photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =

    avatar.onerror =
      () => {

          "none";

          name
            .charAt(0)
            .toUpperCase();

      "none";

    avatarFallback.style.display =
      "flex";

    avatarFallback.textContent =
      name
        .charAt(0)
        .toUpperCase();

}


/* =========================================================
   LOAD TARGET
========================================================= */

async function loadTarget(){

  if(!targetId){

    showTargetProfile({
      displayName:"Kmeet Member"
    });

    return;

  }


  if(
    demoProfiles[targetId]
  ){

    targetIsDemo =
      true;

    showTargetProfile(
      demoProfiles[targetId]
    );

    return;

  }


  targetIsDemo =
    false;


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          targetId
        )
      );


    if(snap.exists()){

      showTargetProfile(
        snap.data()
      );

    }else{

      showTargetProfile({
        displayName:"Kmeet Member"
      });

    }

  }catch(error){

    console.error(
      "Could not load target profile:",
      error
    );


    showTargetProfile({
      displayName:"Kmeet Member"
    });

  }

}


/* =========================================================
   FORMAT MESSAGE TIME
========================================================= */

function formatMessageTime(timestamp){

  if(!timestamp){
    return "";
  }


  try{

    let date;


    if(
      typeof timestamp.toDate ===
      "function"
    ){

      date =
        timestamp.toDate();

    }else if(
      timestamp instanceof Date
    ){

      date =
        timestamp;

    }else if(
      typeof timestamp ===
      "number"
    ){

      date =
        new Date(timestamp);

    }else{

      return "";

    }


    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "";

  }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(items){

  if(!Array.isArray(items)){

    items =
      [];

  }


  if(items.length === 0){

    messagesEl.innerHTML = `

      <div class="empty-state">

        Your conversation will appear here.<br>
        Start with a friendly message.

      </div>

    `;

    return;

  }


  messagesEl.innerHTML =
    "";


  items.forEach(item => {

    if(!item){
      return;
    }


    const senderId =
      item.senderId || "";


    const mine =
      senderId ===
      currentUser?.uid;


    const row =
      document.createElement(
        "div"
      );


    row.className =
      "message-row " +
      (
        mine
          ? "mine"
          : "theirs"
      );


    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "message " +
      (
        mine
          ? "mine"
          : "theirs"
      );


    const text =
      document.createElement(
        "div"
      );


    text.textContent =
      item.text || "";


    const time =
      document.createElement(
        "div"
      );


    time.className =
      "message-time";


    time.textContent =
      formatMessageTime(
        item.createdAt ||
        item.clientCreatedAt
      );


    bubble.appendChild(
      text
    );


    if(time.textContent){

      bubble.appendChild(
        time
      );

    }


    row.appendChild(
      bubble
    );


    messagesEl.appendChild(
      row
    );

  });


  requestAnimationFrame(
    () => {

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    }
  );

}


/* =========================================================
   VALIDATE CONVERSATION
========================================================= */

function isValidConversation(data){

  if(!data){
    return false;
  }


  const initiator =
    data.initiatorId;


  const receiver =
    data.receiverId;


  /*
    A conversation must contain two different users.
  */

  if(
    typeof initiator !== "string" ||
    typeof receiver !== "string"
  ){

    return false;

  }


  if(
    initiator === receiver
  ){

    return false;

  }


  /*
    Current user and target must be the two
    participants.
  */

  const validParticipants =
    (
      initiator === currentUser.uid &&
      receiver === targetId
    ) ||
    (
      initiator === targetId &&
      receiver === currentUser.uid
    );


  return validParticipants;

}


/* =========================================================
   CHECK EXISTING VALID CONVERSATION
========================================================= */

async function getExistingValidConversation(){

  conversationId =
    getConversationId();


  if(!conversationId){

    return null;

  }


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "conversations",
          conversationId
        )
      );


    if(!snap.exists()){

      console.log(
        "No Kmeet v2 conversation exists yet."
      );

      return null;

    }


    const data =
      snap.data();


    console.log(
      "Kmeet v2 conversation found:",
      data
    );


    if(
      !isValidConversation(data)
    ){

      console.warn(
        "Invalid Kmeet v2 conversation found. It will not be used.",
        data
      );

      return null;

    }


    return data;

  }catch(error){

    console.error(
      "Conversation check failed:",
      error
    );

    return null;

  }

}


/* =========================================================
   START REAL FIRESTORE MESSAGES
========================================================= */

async function startMessages(){

  /*
    Demo chats never use Firestore.
  */

  if(targetIsDemo){

    loadDemoChat();

    return;

  }


  /*
    Do not start a Firestore listener until the parent
    conversation has been checked.

    This removes the permission error that happened when
    the listener tried to watch a conversation that did
    not exist or was corrupted.
  */

  const existingConversation =
    await getExistingValidConversation();


  if(!existingConversation){

    localMessages =
      [];

    renderMessages([]);

    console.log(
      "No valid conversation yet. Listener will start after the first successful message."
    );

    return;

  }


  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  hasReceivedFirstSnapshot =
    false;


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  console.log(
    "Starting Firestore message listener:",
    conversationId
  );


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        const serverMessages =
          snapshot.docs.map(
            item => ({
              id:item.id,
              ...item.data()
            })
          );


        console.log(
          "Messages received:",
          serverMessages.length
        );


        /*
          Never wipe an optimistic message with
          an empty Firestore snapshot.
        */

        if(
          serverMessages.length === 0 &&
          localMessages.length > 0
        ){

          renderMessages(
            localMessages
          );

          hasReceivedFirstSnapshot =
            true;

          return;

        }


        if(
          serverMessages.length > 0
        ){

          localMessages =
            serverMessages;

          renderMessages(
            serverMessages
          );

        }else{

          renderMessages([]);

        }


        hasReceivedFirstSnapshot =
          true;

      },

      error => {

        console.error(
          "MESSAGE LISTENER ERROR:",
          error
        );


        /*
          Never erase visible messages because
          the listener encountered an error.
        */

        if(
          localMessages.length === 0
        ){

          messagesEl.innerHTML = `

            <div class="empty-state">

              Your conversation is ready.<br>
              Send a message to begin.

            </div>

          `;

        }

      }

    );

}


/* =========================================================
   DEMO CHAT
========================================================= */

function loadDemoChat(){

  localMessages =
    getDemoMessages();


  renderMessages(
    localMessages
  );

}


/* =========================================================
   ENSURE CONVERSATION
========================================================= */

async function ensureConversation(){

  /*
    Always use the NEW Kmeet v2 conversation ID.

    This intentionally avoids the corrupted old
    conversation document.
  */

  conversationId =
    getConversationId();


  if(!conversationId){

    throw new Error(
      "Conversation ID could not be created."
    );

  }


  if(
    !currentUser ||
    !targetId
  ){

    throw new Error(
      "Chat participants are missing."
    );

  }


  if(
    currentUser.uid === targetId
  ){

    throw new Error(
      "You cannot start a conversation with yourself."
    );

  }


  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );


  const existing =
    await getDoc(
      conversationRef
    );


  if(existing.exists()){

    const data =
      existing.data();


    console.log(
      "EXISTING KMEET V2 CONVERSATION:",
      data
    );


    /*
      Never use a corrupted conversation.
    */

    if(
      !isValidConversation(data)
    ){

      throw new Error(
        "The Kmeet conversation is invalid. Please refresh and start the chat again."
      );

    }


    return data;

  }


  /*
    Brand-new conversation.

    The two IDs are explicitly different because
    self-conversations were already rejected above.
  */

  const conversationData = {

    initiatorId:
      currentUser.uid,

    receiverId:
      targetId,

    createdAt:
      serverTimestamp(),

    updatedAt:
      serverTimestamp()

  };


  console.log(
    "CREATING NEW KMEET V2 CONVERSATION:",
    conversationId,
    conversationData
  );


  await setDoc(
    conversationRef,
    conversationData
  );


  return conversationData;

}

/* =========================================================
   DEMO SEND
========================================================= */

async function sendDemoMessage(text){

  const message = {

    senderId:
      currentUser.uid,

    receiverId:
      targetId,

    text:
      text,

    clientCreatedAt:
      Date.now()

  };


  localMessages = [

    ...getDemoMessages(),

    message

  ];


  saveDemoMessages(
    localMessages
  );


  renderMessages(
    localMessages
  );


  messageInput.value =
    "";


  messageInput.style.height =
    "auto";

}


/* =========================================================
   REAL MESSAGE SEND
========================================================= */

async function sendRealMessage(text){

  console.log(
    "STARTING REAL MESSAGE SEND"
  );


  /*
    Make sure the NEW v2 conversation exists.
  */

  const conversation =
    await ensureConversation();


  console.log(
    "VALID CONVERSATION:",
    conversation
  );


  /*
    Determine the other participant.

    This can never be the current user because
    ensureConversation() validates both participants.
  */

  let receiverId;


  if(
    conversation.initiatorId ===
    currentUser.uid
  ){

    receiverId =
      conversation.receiverId;

  }else{

    receiverId =
      conversation.initiatorId;

  }


  if(
    !receiverId ||
    receiverId === currentUser.uid ||
    receiverId !== targetId
  ){

    throw new Error(
      "Invalid receiver for this conversation."
    );

  }


  /*
    Optimistic message.

    It is displayed immediately and is NOT removed
    unless the actual Firestore write fails.
  */

  const optimisticMessage = {

    senderId:
      currentUser.uid,

    receiverId:
      receiverId,

    text:
      text,

    clientCreatedAt:
      Date.now(),

    optimistic:
      true

  };


  localMessages = [

    ...localMessages,

    optimisticMessage

  ];


  renderMessages(
    localMessages
  );


  /*
    Save the actual message.
  */

  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  console.log(
    "WRITING MESSAGE TO:",
    "conversations/" +
    conversationId +
    "/messages"
  );


  const messageRef =
    await addDoc(
      messagesRef,
      {

        senderId:
          currentUser.uid,

        receiverId:
          receiverId,

        text:
          text,

        createdAt:
          serverTimestamp(),

        clientCreatedAt:
          Date.now()

      }
    );


  console.log(
    "MESSAGE SUCCESSFULLY SAVED:",
    messageRef.id
  );


  /*
    Update the parent only after the message succeeds.

    The rules already allow the participant to update
    the conversation.
  */

  try{

    await setDoc(

      doc(
        db,
        "conversations",
        conversationId
      ),

      {

        updatedAt:
          serverTimestamp(),

        lastMessage:
          text,

        lastSenderId:
          currentUser.uid

      },

      {
        merge:true
      }

    );

  }catch(updateError){

    /*
      Do not treat a successful message as a failed
      message merely because the optional conversation
      metadata update failed.
    */

    console.warn(
      "Conversation metadata update failed:",
      updateError
    );

  }


  /*
    Now start the listener.

    The parent and message both exist, so the listener
    will no longer be started against a missing parent.
  */

  await startMessages();


  return true;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sendingMessage){

    return;

  }


  if(!currentUser){

    alert(
      "Please wait for Kmeet to finish loading."
    );

    return;

  }


  const text =
    messageInput.value
      .trim();


  if(!text){

    return;

  }


  /*
    Demo profiles use local chat.
  */

  if(targetIsDemo){

    sendingMessage =
      true;

    sendBtn.disabled =
      true;


    try{

      await sendDemoMessage(
        text
      );

    }finally{

      sendingMessage =
        false;

      sendBtn.disabled =
        false;

    }


    return;

  }


  /*
    Anonymous users cannot use the free opening.
  */

  if(
    currentUser.isAnonymous
  ){

    showGate(
      "anonymous"
    );

    return;

  }


  /*
    Protect users from sharing contact information
    before payment.
  */

  if(
    containsContactInformation(
      text
    )
  ){

    alert(
      "For your safety, contact details cannot be shared before the chat is unlocked."
    );

    return;

  }


  /*
    Determine whether the NEW v2 conversation already
    exists.

    We intentionally do NOT inspect the corrupted old
    conversation ID.
  */

  conversationId =
    getConversationId();


  if(!conversationId){

    alert(
      "This chat could not be opened because the two users are invalid."
    );

    return;

  }


  let existingConversation =
    null;


  try{

    const conversationSnap =
      await getDoc(
        doc(
          db,
          "conversations",
          conversationId
        )
      );


    if(
      conversationSnap.exists()
    ){

      const data =
        conversationSnap.data();


      /*
        If the v2 record itself is invalid,
        do not use it.
      */

      if(
        isValidConversation(
          data
        )
      ){

        existingConversation =
          data;

      }else{

        console.warn(
          "Invalid v2 conversation ignored:",
          data
        );

      }

    }

  }catch(error){

    console.error(
      "Conversation check failed:",
      error
    );

  }


  /*
    BRAND NEW CONVERSATION

    Registered users get one free opening message,
    and it must be exactly "hi" or "hey".
  */

  if(!existingConversation){

    const normalized =
      text
        .toLowerCase()
        .trim();


    if(
      normalized !== "hi" &&
      normalized !== "hey"
    ){

      showGate(
        "sender"
      );


      alert(
        'Your first free message must be "hi" or "hey".'
      );


      return;

    }


    if(
      hasUsedFreeOpening()
    ){

      showGate(
        "sender"
      );


      return;

    }

  }


  /*
    EXISTING CONVERSATION

    Determine whether current user is the receiver.
  */

  if(existingConversation){

    const isReceiver =
      existingConversation.receiverId ===
      currentUser.uid;


    if(isReceiver){

      const receiverReplyKey =
        "kmeet_receiver_replies_" +
        currentUser.uid +
        "_" +
        targetId;


      let receiverReplies =
        parseInt(
          localStorage.getItem(
            receiverReplyKey
          ) || "0",
          10
        );


      if(
        !hasReceiverPaid() &&
        receiverReplies >= 3
      ){

        showGate(
          "receiver"
        );


        return;

      }

    }

  }


  sendingMessage =
    true;

  sendBtn.disabled =
    true;


  try{

    await sendRealMessage(
      text
    );


    /*
      Only clear the input after the message has
      successfully reached Firestore.
    */

    messageInput.value =
      "";

    messageInput.style.height =
      "auto";


    /*
      First free opening is marked used only after
      successful Firestore delivery.
    */

    if(
      !existingConversation
    ){

      localStorage.setItem(
        freeOpeningKey(),
        "true"
      );

    }


    /*
      Receiver free reply count.
    */

    if(
      existingConversation
    ){

      const isReceiver =
        existingConversation.receiverId ===
        currentUser.uid;


      if(isReceiver){

        const receiverReplyKey =
          "kmeet_receiver_replies_" +
          currentUser.uid +
          "_" +
          targetId;


        let receiverReplies =
          parseInt(
            localStorage.getItem(
              receiverReplyKey
            ) || "0",
            10
          );


        if(
          !hasReceiverPaid()
        ){

          receiverReplies++;


          localStorage.setItem(
            receiverReplyKey,
            String(
              receiverReplies
            )
          );

        }

      }

    }


    console.log(
      "SEND COMPLETE"
    );


  }catch(error){

    console.error(
      "MESSAGE SEND ERROR:",
      error
    );


    /*
      Remove only the optimistic copy belonging to
      this failed message.

      We identify it using its exact text and the
      optimistic flag, rather than deleting every
      message with the same text.
    */

    localMessages =
      localMessages.filter(
        item =>
          !(
            item.optimistic === true &&
            item.senderId ===
              currentUser.uid &&
            item.text ===
              text
          )
      );


    renderMessages(
      localMessages
    );


    const errorCode =
      error?.code ||
      "unknown";


    const errorMessage =
      error?.message ||
      String(error);


    alert(
      "The message could not be sent.\n\n" +
      errorCode +
      "\n\n" +
      errorMessage
    );


  }finally{

    sendingMessage =
      false;

    sendBtn.disabled =
      false;

    messageInput.focus();

  }

}

   ENTER TO SEND
========================================================= */

messageInput.addEventListener(

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

    }

  }
);

========================================================= */

    messageInput.style.height =

    messageInput.style.height =

        messageInput.scrollHeight,
        130
      ) +

  }
);

   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   AUTHENTICATION
========================================================= */

onAuthStateChanged(

  auth,

  async user => {

    if(authStarted){

      return;

    }


    if(user){

      currentUser =
        user;

      authStarted =
        true;

    }else{

      /*
        Visitors can browse Kmeet.

        Anonymous authentication is used only so Firebase
        can identify the temporary visitor.
      */

      try{

        const result =
          await signInAnonymously(
            auth
          );


        currentUser =
          result.user;


        authStarted =
          true;

      }catch(error){

        console.error(
          "Anonymous authentication failed:",
          error
        );


        messagesEl.innerHTML = `

          <div class="empty-state">

            Kmeet could not start the chat session.<br>
            Please refresh the page and try again.

          </div>

        `;


        return;

      }

    }


    /*
      Anonymous users must pay before messaging.
    */

    if(
      currentUser.isAnonymous
    ){

      personStatus.textContent =
        "Guest chat — payment required";

    }


    await loadTarget();


    if(targetIsDemo){

      hideGate();

      startMessages();

      return;

    }


    /*
      IMPORTANT:

      startMessages() first checks whether the NEW v2
      conversation exists.

      It does NOT listen to the old corrupted conversation.
    */

    await startMessages();

  },

  error => {

    console.error(
      "Authentication state error:",
      error
    );

  }

);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }
);

</script>
