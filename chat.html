function containsContactInformation(
  text
) {

  const value =

  const phonePattern =
    /(?:\+?254|0)?7\d{8}\b/;

  const emailPattern =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;

    /\b(?:whatsapp|wa\.me)\b/i;

    phonePattern.test(value) ||
    emailPattern.test(value) ||
    whatsappPattern.test(value) ||
    telegramPattern.test(value) ||
    instagramPattern.test(value) ||
    facebookPattern.test(value) ||
    contactWordsPattern.test(value)
  );

}


/* =========================================================
   LOAD TARGET PROFILE
========================================================= */

async function loadTargetProfile() {

  if (
    !targetId
  ) {

    throw new Error(
      "No Kmeet profile was selected."
    );

  }


  /*
    DEMO PROFILE

    Discover contains local demonstration
    profiles. They do not exist in Firebase,
    so we must not call getDoc() for them.
  */

  if (
    targetId.startsWith(
      "demo-"
    )
  ) {

    const demo =
      demoProfiles[targetId];


    if (!demo) {

      throw new Error(
        "The selected Kmeet demo profile could not be found."
      );

    }


    targetProfile =
      {
        id:
          targetId,

        name:
          demo.name,

        photo:
          demo.photo

      };


    personName.textContent =
      demo.name;


    avatar.alt =
      demo.name;


    avatar.src =
      demo.photo;


    avatar.style.display =
      "block";


    avatarFallback.style.display =
      "none";


    return;

  }


  /*
    REAL FIREBASE PROFILE
  */

  const snap =
    await getDoc(
      doc(
        db,
        "users",
        targetId
      )
    );


  if (
    !snap.exists()
  ) {

    throw new Error(
      "The selected Kmeet profile could not be found."
    );

  }


  const data =
    snap.data();


  targetProfile =
    {
      id:
        targetId,

      name:
        data.displayName ||
        data.name ||
        "Kmeet Member",

      photo:
        data.photoURL ||
        data.photoUrl ||
        data.avatar ||
        data.profilePhoto ||
        data.profileImage ||
        data.image ||
        ""

    };


  personName.textContent =
    targetProfile.name;


  avatar.alt =
    targetProfile.name;


  if (
    targetProfile.photo
  ) {

    avatar.src =
      targetProfile.photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";

  } else {

    avatar.style.display =
      "none";

    avatarFallback.style.display =
      "grid";

    avatarFallback.textContent =
      targetProfile.name
        .charAt(0)
        .toUpperCase();

  }

}

/* =========================================================
   CONTACT INFORMATION DETECTION
========================================================= */

function containsContactInformation(
  text
) {

  const value =
    String(text)
      .toLowerCase()
      .trim();


  /* EMAIL */

  const emailPattern =
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;

  if (
    emailPattern.test(value)
  ) {

    return true;

  }


  /* KENYAN PHONE NUMBERS */

  const phonePattern =
    /(?:\+?254[\s-]?(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3,4})|(?:0(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3})/i;

  if (
    phonePattern.test(value)
  ) {

    return true;

  }


  /* CONTACT WORDS */

  const contactWords =
    /\b(whatsapp|whats\s*app|call me|text me|message me|contact me|my number|phone number|email me|dm me|instagram|telegram|facebook)\b/i;

  if (
    contactWords.test(value)
  ) {

    return true;

  }


  /* SOCIAL HANDLES */

  const socialHandle =
    /(?:^|\s)@[a-z0-9_.]{3,}/i;

  if (
    socialHandle.test(value)
  ) {

    return true;

  }


  return false;

}

  type

  gate.style.display =
    "grid";

  chatArea.style.display =
    "none";


  gateButtons.innerHTML =
    "";


  /* =======================================================
     ANONYMOUS USER
  ======================================================= */

  if (
    type === "anonymous"
  ) {

    gateIcon.textContent =
      "🔒";

    gateTitle.textContent =
      "Start chatting";

    gateText.textContent =
      "Anonymous members can browse Kmeet freely, but payment is required before sending the first message.";

    gateButtons.innerHTML = `

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49&anonymous=true"
      >
        3 Chats — KSh 49
      </a>

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100&anonymous=true"
      >
        8 Chats — KSh 100
      </a>

      <a
        class="pay-btn secondary-btn"
        href="discover.html"
      >
        Back to Discover
      </a>

    `;

    return;

  }


  /* =======================================================
     SENDER
  ======================================================= */

  if (
    type === "sender"
  ) {

    gateIcon.textContent =
      "💎";

    gateTitle.textContent =
      "Continue chatting";

    gateText.textContent =
      "Your free opening message has been used. Choose a Kmeet chat package to continue.";

    gateButtons.innerHTML = `

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49"
      >
        3 Chats — KSh 49
      </a>

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100"
      >
        8 Chats — KSh 100
      </a>

      <a
        class="pay-btn secondary-btn"
        href="discover.html"
      >
        Back to Discover
      </a>

    `;

    return;

  }


  /* =======================================================
     RECEIVER
  ======================================================= */

  if (
    type === "receiver"
  ) {

    gateIcon.textContent =
      "💗";

    gateTitle.textContent =
      "Continue the conversation";

    gateText.textContent =
      "Your free replies have been used, or the message attempted to share contact information. Pay KSh 11 to continue.";

    gateButtons.innerHTML = `

      <a
        class="pay-btn"
        href="payment.html?userId=${encodeURIComponent(targetId)}&role=receiver&amount=11"
      >
        Continue — KSh 11
      </a>

      <a
        class="pay-btn secondary-btn"
        href="discover.html"
      >
        Back to Discover
      </a>

    `;

  }

}


/* =========================================================
   SHOW CHAT
========================================================= */

function showChat() {

  gate.style.display =
    "none";

  chatArea.style.display =
    "flex";

}


/* =========================================================
   START MESSAGE LISTENER
========================================================= */

function startMessages() {

  if (
    !currentUser
  ) {

    return;

  }


  conversationId =
    getConversationId();


  if (
    !conversationId
  ) {

    return;

  }


  if (
    currentUser.isAnonymous
  ) {

    infoBar.textContent =
      "Anonymous chat: payment is required before your first message.";

  } else {

    infoBar.textContent =
      "Your opening message is free — say hi or hey ❤️";

  }


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        messages.innerHTML =
          "";


        if (
          snapshot.empty
        ) {

          messages.innerHTML = `

            <div
              class="empty"
            >
              Start the conversation and let the connection grow. ❤️
            </div>

          `;

          return;

        }


        let firstSenderId =
          null;

        let receiverReplies =
          0;


        snapshot.forEach(
          item => {

            const data =
              item.data();


            if (
              !firstSenderId
            ) {

              firstSenderId =
                data.senderId;

            }


            if (
              data.senderId !==
              firstSenderId
            ) {

              receiverReplies++;

            }


            const message =
              document.createElement(
                "div"
              );


            message.className =
              "message " +
              (
                data.senderId ===
                currentUser.uid
                  ? "mine"
                  : "theirs"
              );


            message.textContent =
              data.text || "";


            messages.appendChild(
              message
            );

          }
        );


        messages.scrollTop =
          messages.scrollHeight;


        if (
          firstSenderId ===
          currentUser.uid
        ) {

          infoBar.textContent =
            "Your opening message is free. Further messages use chat credits.";

        } else {

          const remaining =
            Math.max(
              0,
              FREE_RECEIVER_REPLIES -
              receiverReplies
            );


          infoBar.textContent =
            `${remaining} free replies remaining.`;

        }

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );


        showError(
          "The chat interface is open, but messages could not be loaded. Please check your Firebase Firestore rules."
        );

      }

    );

}


/* =========================================================
   AUTHENTICATION
========================================================= */

async function initialiseAuth() {

  if (
    authStarted
  ) {

    return;

  }


  authStarted =
    true;


  onAuthStateChanged(

    auth,

    async user => {

      try {

        /* =================================================
           EXISTING USER
        ================================================= */

        if (
          user
        ) {

          currentUser =
            user;


          if (
            user.isAnonymous
          ) {

            infoBar.textContent =
              "Anonymous chat: payment is required before your first message.";

          } else {

            infoBar.textContent =
              "Your opening message is free — say hi or hey ❤️";

          }


          startMessages();

          return;

        }


        /* =================================================
           NO USER
        ================================================= */

        await signInAnonymously(
          auth
        );

      }

      catch (
        error
      ) {

        console.error(
          "Kmeet authentication error:",
          error
        );


        if (
          error.code ===
          "auth/operation-not-allowed"
        ) {

          showError(
            "Anonymous Authentication is not enabled in Firebase. Enable Authentication → Sign-in method → Anonymous."
          );

        } else {

          showError(
            "Kmeet could not start the chat session (" +
            (
              error.code ||
              "authentication error"
            ) +
            "). Please check that Anonymous Authentication is enabled in Firebase."
          );

        }

      }

    }

  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

composer.addEventListener(

  "submit",

  async event => {

    event.preventDefault();


    const text =
      messageInput.value.trim();


    if (
      !text
    ) {

      return;

    }


    if (
      !currentUser
    ) {

      showError(
        "Kmeet is still preparing your chat session. Please try again in a moment."
      );

      return;

    }


    /* =====================================================
       ANONYMOUS USERS
    ===================================================== */

    if (
      currentUser.isAnonymous
    ) {

      showGate(
        "anonymous"
      );

      return;

    }


    if (
      !conversationId
    ) {

      conversationId =
        getConversationId();

    }


    /* =====================================================
       LOAD EXISTING MESSAGES
    ===================================================== */

    let existingMessages =
      [];


    try {

      const snapshot =
        await getDocs(

          query(

            collection(
              db,
              "conversations",
              conversationId,
              "messages"
            ),

            orderBy(
              "createdAt",
              "asc"
            )

          )

        );


      snapshot.forEach(
        item => {

          existingMessages.push(
            item.data()
          );

        }
      );

    }

    catch (
      error
    ) {

      console.error(
        error
      );


      showError(
        "Kmeet could not check this conversation. Please try again."
      );

      return;

    }


    /* =====================================================
       FIRST MESSAGE
    ===================================================== */

    if (
      existingMessages.length ===
      0
    ) {

      const opening =
        text.toLowerCase();


      if (
        !FREE_OPENING_MESSAGES.includes(
          opening
        )
      ) {

        showError(
          "Your first message must be “hi” or “hey”."
        );

        return;

      }

    }


    /* =====================================================
       FIND ORIGINAL SENDER
    ===================================================== */

    const firstMessage =
      existingMessages[0];


    const senderId =
      firstMessage
        ? firstMessage.senderId
        : currentUser.uid;


    const isSender =
      senderId ===
      currentUser.uid;


    /* =====================================================
       CONTACT INFORMATION
    ===================================================== */

    if (
      containsContactInformation(
        text
      )
    ) {

      if (
        !isSender
      ) {

        /*
          Receiver attempted to reveal
          contact information.

          Message is NOT sent.
        */

        showGate(
          "receiver"
        );

        return;

      }


      /*
        Sender contact-sharing attempt
        requires paid access.
      */

      showGate(
        "sender"
      );

      return;

    }


    /* =====================================================
       SENDER AFTER FREE OPENING
    ===================================================== */

    if (
      isSender &&
      existingMessages.length > 0
    ) {

      const creditKey =
        "kmeet_sender_credits_" +
        currentUser.uid +
        "_" +
        targetId;


      const credits =
        parseInt(
          localStorage.getItem(
            creditKey
          ) || "0",
          10
        );


      if (
        credits <= 0
      ) {

        showGate(
          "sender"
        );

        return;

      }


      localStorage.setItem(
        creditKey,
        String(
          credits - 1
        )
      );

    }


    /* =====================================================
       RECEIVER AFTER THREE FREE REPLIES
    ===================================================== */

    if (
      !isSender
    ) {

      let receiverReplies =
        0;


      existingMessages.forEach(
        item => {

          if (
            item.senderId !==
            senderId
          ) {

            receiverReplies++;

          }

        }
      );


      const receiverPaidKey =
        "kmeet_receiver_paid_" +
        currentUser.uid +
        "_" +
        targetId;


      const receiverPaid =
        localStorage.getItem(
          receiverPaidKey
        ) ===
        "true";


      if (
        receiverReplies >=
        FREE_RECEIVER_REPLIES &&
        !receiverPaid
      ) {

        showGate(
          "receiver"
        );

        return;

      }

    }


    /* =====================================================
       DISABLE BUTTON
    ===================================================== */

    sendBtn.disabled =
      true;


    try {

      const conversationRef =
        doc(
          db,
          "conversations",
          conversationId
        );


      /*
        Ensure conversation exists.
      */

      await setDoc(

        conversationRef,

        {

          initiatorId:
            senderId,

          receiverId:
            senderId ===
            currentUser.uid
              ? targetId
              : currentUser.uid,

          updatedAt:
            serverTimestamp(),

          createdAt:
            serverTimestamp()

        },

        {
          merge:
            true
        }

      );


      /* ===================================================
         ADD MESSAGE
      =================================================== */

      await addDoc(

        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),

        {

          senderId:
            currentUser.uid,

          receiverId:
            targetId,

          text:
            text,

          createdAt:
            serverTimestamp()

        }

      );


      messageInput.value =
        "";


      messageInput.focus();


      hideError();

    }

    catch (
      error
    ) {

      console.error(
        "Message send error:",
        error
      );


      showError(
        "Kmeet could not make this conversation. Please check your Firebase Firestore rules and try again."
      );

    }

    finally {

      sendBtn.disabled =
        false;

    }

  }

);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(

  "keydown",

  event => {

    if (
      event.key ===
      "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      composer.requestSubmit();

    }

  }

);


/* =========================================================
   START
========================================================= */

async function start() {

  try {

    hideError();


    if (
      !targetId
    ) {

      throw new Error(
        "No Kmeet profile was selected."
      );

    }


    await loadTargetProfile();


    /*
      Display the chat interface while
      authentication is being initialized.
    */

    showChat();


    await initialiseAuth();

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    showError(
      error.message ||
      "Unable to load the selected profile."
    );

  }

}


/* =========================================================
   START KMEET CHAT
========================================================= */

start();


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(

  "beforeunload",

  () => {

    if (
      unsubscribeMessages
    ) {

      unsubscribeMessages();

    }

  }

);

</script>
