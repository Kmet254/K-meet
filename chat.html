*{

html,

/* =========================
   TOP BAR
========================= */

.topbar{
  height:70px;

  display:flex;

.brand-logo{

========================= */

.chat-shell{

.empty-state{

/* =========================

========================= */

.composer{

  align-items:flex-end;
  gap:9px;

  background:rgba(5,2,8,.54);

}

.message-input{

/* =========================
   GATE
========================= */

.gate{

========================= */

  font-size:13px;

<script type="module">

import {

/* =========================================================

========================================================= */

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const personName = document.getElementById("personName");
const personStatus = document.getElementById("personStatus");

const avatarFallback = document.getElementById("avatarFallback");

const gateTitle = document.getElementById("gateTitle");

const gateButtons = document.getElementById("gateButtons");


/* =========================================================

========================================================= */

if(!messagesEl) missingElements.push("messages");
if(!messageInput) missingElements.push("messageInput");
if(!sendBtn) missingElements.push("sendBtn");
if(!personName) missingElements.push("personName");
if(!personStatus) missingElements.push("personStatus");
if(!avatar) missingElements.push("avatar");
if(!avatarFallback) missingElements.push("avatarFallback");
if(!gate) missingElements.push("gate");
if(!gateTitle) missingElements.push("gateTitle");
if(!gateText) missingElements.push("gateText");
if(!gateButtons) missingElements.push("gateButtons");

if(missingElements.length){

  console.error(
    "Kmeet missing HTML elements:",
    missingElements

}


/* =========================================================
   URL
========================================================= */

const targetId =

/* =========================================================
   DEMO STORAGE
========================================================= */

function demoStorageKey(){

  if(!currentUser || !targetId){
    return null;
  }

  return (
    "kmeet_demo_chat_" +
    currentUser.uid +
    "_" +
    targetId
  );

}


function getDemoMessages(){

  const key = demoStorageKey();

  if(!key){
    return [];
  }

  try{

    return JSON.parse(
      localStorage.getItem(key) || "[]"
    );

  }catch(error){

    console.error(
      "Demo storage read error:",
      error
    );

    return [];

  }

}


function saveDemoMessages(items){

  const key = demoStorageKey();

  if(!key){
    return;
  }

  localStorage.setItem(
    key,
    JSON.stringify(items)
  );

}


/* =========================================================
   CONVERSATION ID
========================================================= */

function getConversationId(){

  if(!currentUser || !targetId){
    return null;
  }

  const ids = [
    currentUser.uid,
    targetId
  ].sort();

  return ids[0] + "_" + ids[1];

}


/* =========================================================
   CONTACT PROTECTION
========================================================= */

function containsContactInformation(text){

  const value =
    text
      .toLowerCase()
      .trim();

  const patterns = [

    /\b\d{9,13}\b/,
    /\b07\d{8}\b/,
    /\b01\d{8}\b/,
    /\b\d{3}[\s-]\d{3}[\s-]\d{3,4}\b/,

    /whatsapp/,
    /telegram/,
    /instagram/,
    /facebook/,
    /tiktok/,
    /snapchat/,

    /email me/,
    /call me/,
    /text me/,
    /contact me/,
    /my number/,
    /my phone/,
    /my email/,

    /@gmail\.com/,
    /@yahoo\.com/,
    /@outlook\.com/

  ];

  return patterns.some(
    pattern => pattern.test(value)
  );

}

/* =========================================================
   PROFILE DISPLAY
========================================================= */

function showTargetProfile(profile){

  targetProfile =
    profile || {};

  const name =
    profile?.displayName ||
    profile?.name ||
    "Kmeet Member";

  personName.textContent =
    name;

  personStatus.textContent =
    profile?.online === true
      ? "Online now"
      : "Your Kmeet conversation";

  const photo =
    profile?.photoURL ||
    profile?.photo ||
    profile?.profilePhoto ||
    profile?.image ||
    "";

  if(photo){

    avatar.src =
      photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";

    avatar.onerror =
      () => {

        avatar.style.display =
          "none";

        avatarFallback.style.display =
          "flex";

        avatarFallback.textContent =
          name.charAt(0).toUpperCase();

      };

  }else{

    avatar.style.display =
      "none";

    avatarFallback.style.display =
      "flex";

    avatarFallback.textContent =
      name.charAt(0).toUpperCase();

  }

}


/* =========================================================
   LOAD TARGET
========================================================= */

async function loadTarget(){

  if(!targetId){

    showTargetProfile({
      displayName:"Kmeet Member"
    });

    return;

  }


  if(demoProfiles[targetId]){

    targetIsDemo =
      true;

    showTargetProfile(
      demoProfiles[targetId]
    );

    return;

  }


  targetIsDemo =
    false;


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          targetId
        )
      );

    if(snap.exists()){

      showTargetProfile(
        snap.data()
      );

    }else{

      showTargetProfile({
        displayName:"Kmeet Member"
      });

    }

  }catch(error){

    console.error(
      "Could not load target profile:",
      error
    );

    showTargetProfile({
      displayName:"Kmeet Member"
    });

  }

}


/* =========================================================
   TIME
========================================================= */

function formatMessageTime(timestamp){

  if(!timestamp){
    return "";
  }

  try{

    let date;

    if(
      typeof timestamp.toDate ===
      "function"
    ){

      date =
        timestamp.toDate();

    }else if(
      timestamp instanceof Date
    ){

      date =
        timestamp;

    }else if(
      typeof timestamp === "number"
    ){

      date =
        new Date(timestamp);

    }else{

      return "";

    }

    return date.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "";

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderMessages(items){

  if(!messagesEl){
    return;
  }

  if(!Array.isArray(items)){
    items = [];
  }


  if(items.length === 0){

    messagesEl.innerHTML = `

      <div class="empty-state">

        Your conversation will appear here.<br>
        Start with a friendly message.

      </div>

    `;

    return;

  }


  messagesEl.innerHTML =
    "";


  items.forEach(item => {

    if(!item){
      return;
    }

    const mine =
      item.senderId ===
      currentUser?.uid;


    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (mine ? "mine" : "theirs");


    const bubble =
      document.createElement("div");

    bubble.className =
      "message " +
      (mine ? "mine" : "theirs");


    const text =
      document.createElement("div");

    text.textContent =
      item.text || "";


    const time =
      formatMessageTime(
        item.createdAt ||
        item.clientCreatedAt
      );


    bubble.appendChild(
      text
    );


    if(time){

      const timeEl =
        document.createElement("div");

      timeEl.className =
        "message-time";

      timeEl.textContent =
        time;

      bubble.appendChild(
        timeEl
      );

    }


    row.appendChild(
      bubble
    );

    messagesEl.appendChild(
      row
    );

  });


  requestAnimationFrame(
    () => {

      messagesEl.scrollTop =
        messagesEl.scrollHeight;

    }
  );

}


/* =========================================================
   START FIRESTORE LISTENER
========================================================= */

function startMessages(){

  if(targetIsDemo){

    loadDemoChat();

    return;

  }


  conversationId =
    getConversationId();


  if(!conversationId){

    renderMessages([]);

    return;

  }


  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages =
      null;

  }


  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  console.log(
    "Starting Firestore message listener:",
    conversationId
  );


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      snapshot => {

        const serverMessages =
          snapshot.docs.map(
            item => ({
              id:item.id,
              ...item.data()
            })
          );


        console.log(
          "Firestore messages received:",
          serverMessages.length
        );


        if(serverMessages.length > 0){

          localMessages =
            serverMessages;

          renderMessages(
            serverMessages
          );

          return;

        }


        /*
          Do not erase an optimistic message if
          Firestore temporarily reports zero messages.
        */

        if(localMessages.length > 0){

          renderMessages(
            localMessages
          );

          return;

        }


        renderMessages([]);

      },

      error => {

        console.error(
          "MESSAGE LISTENER ERROR:",
          error
        );

        /*
          Do not erase visible messages.
        */

      }

    );

}

/* =========================================================
   ENSURE CONVERSATION
========================================================= */

async function ensureConversation(){

  conversationId =
    conversationId ||
    getConversationId();


  if(!conversationId){

    throw new Error(
      "Conversation ID could not be created."
    );

  }


  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );


  const existing =
    await getDoc(
      conversationRef
    );


  if(existing.exists()){

    const data =
      existing.data();

    console.log(
      "EXISTING CONVERSATION:",
      data
    );

    /*
      Make sure this conversation actually belongs
      to the current two users.

      This protects against an old malformed conversation.
    */

    const validParticipants =
      (
        data.initiatorId === currentUser.uid &&
        data.receiverId === targetId
      ) ||
      (
        data.initiatorId === targetId &&
        data.receiverId === currentUser.uid
      );


    if(!validParticipants){

      throw new Error(
        "This conversation belongs to different users. Please start a new chat."
      );

    }


    return data;

  }


  const conversationData = {

    initiatorId:
      currentUser.uid,

    receiverId:
      targetId,

    createdAt:
      serverTimestamp(),

    updatedAt:
      serverTimestamp()

  };


  console.log(
    "CREATING CONVERSATION:",
    conversationData
  );


  await setDoc(
    conversationRef,
    conversationData
  );


  console.log(
    "CONVERSATION CREATED:",
    conversationId
  );


  return conversationData;

}

/* =========================================================
   REAL MESSAGE SEND
========================================================= */

async function sendRealMessage(text){

  console.log(
    "STARTING REAL MESSAGE SEND"
  );


  /*
    First make absolutely sure the parent conversation
    exists and belongs to the correct users.
  */

  const conversation =
    await ensureConversation();


  let receiverId;


  if(
    conversation &&
    typeof conversation.initiatorId === "string" &&
    typeof conversation.receiverId === "string"
  ){

    receiverId =
      conversation.initiatorId === currentUser.uid
        ? conversation.receiverId
        : conversation.initiatorId;

  }else{

    receiverId =
      targetId;

  }


  console.log(
    "CURRENT USER:",
    currentUser.uid
  );

  console.log(
    "TARGET:",
    targetId
  );

  console.log(
    "RECEIVER:",
    receiverId
  );


  if(
    !receiverId ||
    receiverId === currentUser.uid
  ){

    throw new Error(
      "Invalid receiver for this conversation."
    );

  }


  /*
    Show message immediately.
  */

  const optimisticMessage = {

    senderId:
      currentUser.uid,

    receiverId:
      receiverId,

    text:
      text,

    clientCreatedAt:
      Date.now(),

    optimistic:
      true

  };


  localMessages = [

    ...localMessages,

    optimisticMessage

  ];


  renderMessages(
    localMessages
  );


  /*
    Save ONLY the message.

    IMPORTANT:
    We deliberately do NOT update the conversation
    document after addDoc.

    That extra operation was capable of making a
    successful message appear to have failed.
  */

  const messagesRef =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  console.log(
    "WRITING MESSAGE TO:",
    "conversations/" +
    conversationId +
    "/messages"
  );


  try{

    const messageRef =
      await addDoc(
        messagesRef,
        {

          senderId:
            currentUser.uid,

          receiverId:
            receiverId,

          text:
            text,

          createdAt:
            serverTimestamp(),

          clientCreatedAt:
            Date.now()

        }
      );


    console.log(
      "MESSAGE SUCCESSFULLY SAVED:",
      messageRef.id
    );


    /*
      The parent conversation exists, so now start/
      restart the listener.

      This prevents the listener from querying a
      conversation that does not exist yet.
    */

    startMessages();


    return true;

  }catch(error){

    console.error(
      "FIRESTORE MESSAGE WRITE FAILED:",
      error
    );


    throw error;

  }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sendingMessage){
    return;
  }


  if(!currentUser){

    alert(
      "Please wait for Kmeet to finish loading."
    );

    return;

  }


  if(!messageInput){

    console.error(
      "Kmeet: messageInput is missing."
    );

    return;

  }


  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  /*
    Demo profiles.
  */

  if(targetIsDemo){

    sendingMessage =
      true;

    if(sendBtn){
      sendBtn.disabled =
        true;
    }

    try{

      await sendDemoMessage(
        text
      );

    }finally{

      sendingMessage =
        false;

      if(sendBtn){
        sendBtn.disabled =
          false;
      }

    }

    return;

  }


  /*
    Anonymous users cannot use the free opening.
  */

  if(currentUser.isAnonymous){

    showGate(
      "anonymous"
    );

    return;

  }


  /*
    Contact protection.
  */

  if(
    containsContactInformation(
      text
    )
  ){

    alert(
      "For your safety, contact details cannot be shared before the chat is unlocked."
    );

    return;

  }


  conversationId =
    getConversationId();


  if(!conversationId){

    alert(
      "Kmeet could not create this conversation."
    );

    return;

  }


  /*
    Check whether conversation already exists.
  */

  let existingConversation =
    null;


  try{

    const conversationSnap =
      await getDoc(
        doc(
          db,
          "conversations",
          conversationId
        )
      );


    if(
      conversationSnap.exists()
    ){

      existingConversation =
        conversationSnap.data();

    }

  }catch(error){

    console.error(
      "CONVERSATION CHECK ERROR:",
      error
    );

  }


  /*
    Brand-new conversation.
  */

  if(!existingConversation){

    const normalized =
      text
        .toLowerCase()
        .trim();


    if(
      normalized !== "hi" &&
      normalized !== "hey"
    ){

      showGate(
        "sender"
      );

      alert(
        'Your first free message must be "hi" or "hey".'
      );

      return;

    }


    if(
      hasUsedFreeOpening()
    ){

      showGate(
        "sender"
      );

      return;

    }

  }


  /*
    Existing conversation.
  */

  if(existingConversation){

    const isReceiver =
      existingConversation.receiverId ===
      currentUser.uid;


    if(isReceiver){

      const receiverReplyKey =
        "kmeet_receiver_replies_" +
        currentUser.uid +
        "_" +
        targetId;


      let receiverReplies =
        parseInt(
          localStorage.getItem(
            receiverReplyKey
          ) || "0",
          10
        );


      if(
        !hasReceiverPaid() &&
        receiverReplies >= 3
      ){

        showGate(
          "receiver"
        );

        return;

      }

    }

  }


  sendingMessage =
    true;


  if(sendBtn){

    sendBtn.disabled =
      true;

  }


  try{

    await sendRealMessage(
      text
    );


    /*
      Clear the input ONLY after addDoc succeeds.
    */

    messageInput.value =
      "";

    messageInput.style.height =
      "auto";


    /*
      Free opening is consumed only after
      successful Firestore write.
    */

    if(!existingConversation){

      localStorage.setItem(
        freeOpeningKey(),
        "true"
      );

    }


    /*
      Receiver free replies.
    */

    if(existingConversation){

      const isReceiver =
        existingConversation.receiverId ===
        currentUser.uid;


      if(isReceiver){

        const receiverReplyKey =
          "kmeet_receiver_replies_" +
          currentUser.uid +
          "_" +
          targetId;


        let receiverReplies =
          parseInt(
            localStorage.getItem(
              receiverReplyKey
            ) || "0",
            10
          );


        if(
          !hasReceiverPaid()
        ){

          receiverReplies++;

          localStorage.setItem(
            receiverReplyKey,
            String(receiverReplies)
          );

        }

      }

    }


    console.log(
      "KMEET MESSAGE SEND COMPLETE"
    );


  }catch(error){

    console.error(
      "COMPLETE SEND ERROR:",
      error
    );


    /*
      IMPORTANT:

      Do NOT remove the optimistic message here.

      If Firestore rejected the write, the exact error
      remains visible in the console instead of silently
      destroying the message.
    */

    const code =
      error?.code ||
      "unknown";


    const message =
      error?.message ||
      String(error);


    alert(
      "Kmeet message error:\n\n" +
      code +
      "\n\n" +
      message
    );


  }finally{

    sendingMessage =
      false;


    if(sendBtn){

      sendBtn.disabled =
        false;

    }


    if(messageInput){

      messageInput.focus();

    }

  }

}


/* =========================================================
   ENTER TO SEND
========================================================= */

if(messageInput){

  messageInput.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );

}


/* =========================================================
   AUTO RESIZE
========================================================= */

if(messageInput){

  messageInput.addEventListener(
    "input",
    () => {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          130
        ) + "px";

    }
  );

}


/* =========================================================
   SEND BUTTON
========================================================= */

if(sendBtn){

  sendBtn.addEventListener(
    "click",
    sendMessage
  );

}


/* =========================================================
   AUTHENTICATION
========================================================= */

onAuthStateChanged(

  auth,

  async user => {

    if(authStarted){

      return;

    }


    if(user){

      currentUser =
        user;

      authStarted =
        true;

    }else{

      try{

        const result =
          await signInAnonymously(
            auth
          );


        currentUser =
          result.user;

        authStarted =
          true;

      }catch(error){

        console.error(
          "ANONYMOUS AUTH ERROR:",
          error
        );

        if(messagesEl){

          messagesEl.innerHTML = `

            <div class="empty-state">

              Kmeet could not start the chat session.<br>
              Please refresh the page and try again.

            </div>

          `;

        }

        return;

      }

    }


    if(currentUser.isAnonymous){

      personStatus.textContent =
        "Guest chat — payment required";

    }


    await loadTarget();


    if(targetIsDemo){

      hideGate();

      startMessages();

      return;

    }


    /*
      IMPORTANT:

      We do NOT force a Firestore messages listener
      before a conversation exists.

      This avoids permission errors on brand-new chats.
    */

    conversationId =
      getConversationId();


    if(!conversationId){

      renderMessages([]);

      return;

    }


    try{

      const conversationSnap =
        await getDoc(
          doc(
            db,
            "conversations",
            conversationId
          )
        );


      if(
        conversationSnap.exists()
      ){

        startMessages();

      }else{

        renderMessages([]);

      }

    }catch(error){

      console.error(
        "INITIAL CONVERSATION CHECK ERROR:",
        error
      );

      renderMessages([]);

    }

  },

  error => {

    console.error(
      "AUTHENTICATION STATE ERROR:",
      error
    );

  }

);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }
);

</script>
