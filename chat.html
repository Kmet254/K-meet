<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet - Chat</title>

<link rel="icon"
      type="image/jpeg"
      href="https://kmet254.github.io/K-meet/kmeet-logo.jfif.jfif">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Poppins", sans-serif;
    color: #fff;
    background: #09070b;
    overflow-x: hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(12, 5, 13, 0.78),
            rgba(12, 5, 13, 0.88)
        ),
        url("kmeet-background.jpg.jpg");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at top left,
            rgba(255, 54, 132, 0.16),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(150, 30, 100, 0.14),
            transparent 35%
        );

    z-index: -1;
}

/* =========================================================
   HEADER
========================================================= */

.chat-header {
    width: 100%;
    min-height: 80px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 14px 28px;

    background: rgba(15, 7, 17, 0.88);
    border-bottom: 1px solid rgba(255, 105, 170, 0.18);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo-link {
    display: flex;
    align-items: center;
    gap: 10px;

    text-decoration: none;
    color: #fff;

    font-family: "Playfair Display", serif;
    font-size: 1.5rem;
}

.logo-link img {
    width: 44px;
    height: 44px;

    border-radius: 50%;
    object-fit: cover;

    border: 2px solid rgba(255, 105, 170, 0.7);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 9px 15px;

    border-radius: 22px;

    color: #fff;
    text-decoration: none;

    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);

    transition: 0.25s ease;
}

.back-btn:hover {
    background: rgba(255, 80, 150, 0.2);
    border-color: rgba(255, 105, 170, 0.45);
}

/* =========================================================
   MAIN CHAT
========================================================= */

.chat-page {
    width: 100%;
    min-height: calc(100vh - 80px);

    display: flex;
    justify-content: center;

    padding: 28px 16px 40px;
}

.chat-shell {
    width: 100%;
    max-width: 900px;

    min-height: 650px;

    display: flex;
    flex-direction: column;

    background: rgba(17, 8, 19, 0.86);

    border: 1px solid rgba(255, 100, 165, 0.17);
    border-radius: 24px;

    box-shadow:
        0 20px 70px rgba(0,0,0,0.45),
        inset 0 1px rgba(255,255,255,0.04);

    overflow: hidden;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

/* =========================================================
   PROFILE BAR
========================================================= */

.chat-profile {
    display: flex;
    align-items: center;
    gap: 15px;

    padding: 18px 22px;

    border-bottom: 1px solid rgba(255,255,255,0.08);

    background: rgba(255,255,255,0.025);
}

.chat-avatar {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid rgba(255, 91, 155, 0.65);

    background: #21121f;
}

.chat-profile-info {
    min-width: 0;
    flex: 1;
}

.chat-profile-name {
    font-family: "Playfair Display", serif;
    font-size: 1.35rem;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-status {
    margin-top: 3px;

    font-size: 0.82rem;
    color: #bfb1bc;

    display: flex;
    align-items: center;
    gap: 7px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #777;
}

.status-dot.online {
    background: #42e58c;
    box-shadow: 0 0 10px rgba(66,229,140,0.7);
}

/* =========================================================
   INFO BAR
========================================================= */

.chat-info {
    padding: 11px 20px;

    font-size: 0.78rem;

    color: #cdbfca;

    background: rgba(255, 70, 140, 0.055);

    border-bottom: 1px solid rgba(255,255,255,0.06);

    text-align: center;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages {
    flex: 1;

    min-height: 390px;
    max-height: 560px;

    overflow-y: auto;

    padding: 22px;

    display: flex;
    flex-direction: column;
    gap: 12px;

    scrollbar-width: thin;
    scrollbar-color: rgba(255, 80, 145, 0.45) transparent;
}

.messages::-webkit-scrollbar {
    width: 7px;
}

.messages::-webkit-scrollbar-track {
    background: transparent;
}

.messages::-webkit-scrollbar-thumb {
    background: rgba(255, 80, 145, 0.4);
    border-radius: 20px;
}

/* =========================================================
   MESSAGE BUBBLES
========================================================= */

.message-row {
    display: flex;
    width: 100%;
}

.message-row.mine {
    justify-content: flex-end;
}

.message-row.theirs {
    justify-content: flex-start;
}

.message {
    max-width: min(75%, 560px);

    padding: 11px 15px;

    border-radius: 18px;

    font-size: 0.92rem;
    line-height: 1.5;

    word-wrap: break-word;
    white-space: pre-wrap;
}

.message.mine {
    background: linear-gradient(
        135deg,
        #df3e88,
        #a91f68
    );

    border-bottom-right-radius: 5px;

    box-shadow:
        0 8px 20px rgba(190, 30, 100, 0.2);
}

.message.theirs {
    background: rgba(255,255,255,0.085);

    border: 1px solid rgba(255,255,255,0.08);

    border-bottom-left-radius: 5px;
}

.message-time {
    display: block;

    margin-top: 4px;

    font-size: 0.66rem;

    opacity: 0.65;

    text-align: right;
}

.empty-chat {
    flex: 1;

    min-height: 350px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    color: #b9aab6;

    padding: 30px;
}

.empty-chat i {
    font-size: 2.4rem;

    color: #e65a9c;

    margin-bottom: 15px;
}

.empty-chat h3 {
    color: #fff;

    margin-bottom: 7px;

    font-family: "Playfair Display", serif;
}

/* =========================================================
   COMPOSER
========================================================= */

.composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;

    padding: 15px;

    border-top: 1px solid rgba(255,255,255,0.08);

    background: rgba(10,5,12,0.72);
}

.message-input {
    flex: 1;

    min-height: 48px;
    max-height: 130px;

    resize: none;

    padding: 13px 15px;

    border-radius: 16px;

    border: 1px solid rgba(255,255,255,0.12);

    outline: none;

    background: rgba(255,255,255,0.055);

    color: #fff;

    font-family: "Poppins", sans-serif;
    font-size: 0.92rem;

    transition: 0.2s ease;
}

.message-input::placeholder {
    color: #978a95;
}

.message-input:focus {
    border-color: rgba(255, 83, 150, 0.55);

    background: rgba(255,255,255,0.075);
}

.send-btn {
    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border: none;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;

    background: linear-gradient(
        135deg,
        #e9438e,
        #a91f68
    );

    cursor: pointer;

    font-size: 1rem;

    transition: 0.25s ease;

    box-shadow:
        0 8px 22px rgba(190, 35, 105, 0.28);
}

.send-btn:hover:not(:disabled) {
    transform: translateY(-2px);
}

.send-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

/* =========================================================
   GATE
========================================================= */

.chat-gate {
    position: fixed;

    inset: 0;

    z-index: 5000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(5,2,7,0.82);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.chat-gate.show {
    display: flex;
}

.gate-card {
    width: 100%;
    max-width: 430px;

    padding: 30px 25px;

    border-radius: 24px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(45,15,35,0.96),
            rgba(18,8,20,0.98)
        );

    border: 1px solid rgba(255, 85, 150, 0.25);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.55);
}

.gate-icon {
    width: 66px;
    height: 66px;

    margin: 0 auto 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #ff6da9;

    background: rgba(255, 75, 145, 0.1);

    border: 1px solid rgba(255, 90, 155, 0.2);

    font-size: 1.5rem;
}

.gate-card h2 {
    font-family: "Playfair Display", serif;

    font-size: 1.65rem;

    margin-bottom: 10px;
}

.gate-card p {
    color: #c6b7c2;

    font-size: 0.9rem;

    line-height: 1.6;

    margin-bottom: 22px;
}

.gate-actions {
    display: flex;
    flex-direction: column;

    gap: 10px;
}

.gate-primary,
.gate-secondary {
    width: 100%;

    min-height: 45px;

    border-radius: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    font-family: "Poppins", sans-serif;
    font-weight: 600;

    cursor: pointer;
}

.gate-primary {
    color: #fff;

    border: none;

    background:
        linear-gradient(
            135deg,
            #e94590,
            #a81f68
        );
}

.gate-secondary {
    color: #e8dce5;

    border: 1px solid rgba(255,255,255,0.12);

    background: rgba(255,255,255,0.05);
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    position: fixed;

    inset: 0;

    z-index: 6000;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #09070b;
}

.loading-inner {
    text-align: center;
}

.loading-inner img {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid rgba(255, 85, 150, 0.5);

    margin-bottom: 15px;
}

.spinner {
    width: 27px;
    height: 27px;

    margin: 0 auto 12px;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: #e94590;

    animation: spin 0.8s linear infinite;
}

.loading-text {
    color: #b8aab4;

    font-size: 0.82rem;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .chat-header {
        padding: 12px 15px;
    }

    .logo-link {
        font-size: 1.25rem;
    }

    .logo-link img {
        width: 38px;
        height: 38px;
    }

    .back-btn {
        padding: 8px 11px;
        font-size: 0.8rem;
    }

    .chat-page {
        padding: 10px 8px 20px;
    }

    .chat-shell {
        min-height: calc(100vh - 100px);
        border-radius: 18px;
    }

    .chat-profile {
        padding: 14px;
    }

    .chat-avatar {
        width: 50px;
        height: 50px;
    }

    .messages {
        padding: 15px;
    }

    .message {
        max-width: 84%;
    }

    .composer {
        padding: 10px;
    }

    .gate-card {
        padding: 25px 20px;
    }
}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="chat-header">

    <a href="index.html" class="logo-link">
        <img
            src="kmeet-logo.jfif.jfif"
            alt="Kmeet"
        >
        <span>Kmeet</span>
    </a>

    <div class="header-actions">

        <a href="discover.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Discover
        </a>

    </div>

</header>


<!-- =========================================================
     CHAT PAGE
========================================================= -->

<main class="chat-page">

    <section class="chat-shell">

        <!-- PROFILE -->

        <div class="chat-profile">

            <img
                id="targetAvatar"
                class="chat-avatar"
                src="kmeet-logo.jfif.jfif"
                alt="Profile"
            >

            <div class="chat-profile-info">

                <div
                    id="targetName"
                    class="chat-profile-name"
                >
                    Loading...
                </div>

                <div class="chat-status">

                    <span
                        id="statusDot"
                        class="status-dot"
                    ></span>

                    <span id="targetStatus">
                        Checking status...
                    </span>

                </div>

            </div>

        </div>


        <!-- CHAT INFO -->

        <div
            id="chatInfo"
            class="chat-info"
        >
            Checking chat access...
        </div>


        <!-- MESSAGES -->

        <div
            id="messages"
            class="messages"
        >

            <div class="empty-chat">

                <i class="fa-regular fa-comments"></i>

                <h3>Start a conversation</h3>

                <p>
                    Say hello and see where the conversation goes.
                </p>

            </div>

        </div>


        <!-- COMPOSER -->

        <div
            id="composer"
            class="composer"
            style="display:none;"
        >

            <textarea
                id="messageInput"
                class="message-input"
                rows="1"
                maxlength="1000"
                placeholder="Type your message..."
            ></textarea>

            <button
                id="sendBtn"
                class="send-btn"
                type="button"
                disabled
                aria-label="Send message"
            >
                <i class="fa-solid fa-paper-plane"></i>
            </button>

        </div>

    </section>

</main>


<!-- =========================================================
     ACCESS GATE
========================================================= -->

<div
    id="chatGate"
    class="chat-gate"
>

    <div class="gate-card">

        <div class="gate-icon">
            <i id="gateIcon" class="fa-solid fa-lock"></i>
        </div>

        <h2 id="gateTitle">
            Chat access
        </h2>

        <p id="gateText">
            Checking your chat access...
        </p>

        <div class="gate-actions">

            <a
                id="gatePrimary"
                class="gate-primary"
                href="login.html"
            >
                Continue
            </a>

            <button
                id="gateClose"
                class="gate-secondary"
                type="button"
            >
                Back
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     LOADING
========================================================= -->

<div
    id="loading"
    class="loading"
>

    <div class="loading-inner">

        <img
            src="kmeet-logo.jfif.jfif"
            alt="Kmeet"
        >

        <div class="spinner"></div>

        <div class="loading-text">
            Opening Kmeet chat...
        </div>

    </div>

</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">

import {
    auth,
    db,
    rtdb
} from "./firebase-config.js";

import {
    onAuthStateChanged,
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    setDoc,
    updateDoc,
    addDoc,
    onSnapshot,
    orderBy,
    limit,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    ref,
    onValue,
    onDisconnect,
    set as rtdbSet,
    serverTimestamp as rtdbServerTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================================================
   SETTINGS
========================================================= */

const FREE_OPENING_MESSAGES = [
    "hi",
    "hey"
];

const FREE_RECEIVER_REPLIES = 3;

const RECEIVER_CONTINUATION_FEE = 11;

const SENDER_PACK_3_PRICE = 49;

const SENDER_PACK_8_PRICE = 100;


/* =========================================================
   DOM
========================================================= */

const loading = document.getElementById("loading");

const targetAvatar = document.getElementById("targetAvatar");
const targetName = document.getElementById("targetName");
const targetStatus = document.getElementById("targetStatus");
const statusDot = document.getElementById("statusDot");

const chatInfo = document.getElementById("chatInfo");

const messages = document.getElementById("messages");

const composer = document.getElementById("composer");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const chatGate = document.getElementById("chatGate");
const gateIcon = document.getElementById("gateIcon");
const gateTitle = document.getElementById("gateTitle");
const gateText = document.getElementById("gateText");
const gatePrimary = document.getElementById("gatePrimary");
const gateClose = document.getElementById("gateClose");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let targetId = null;
let targetProfile = null;

let conversationId = null;
let conversationData = null;

let currentMessages = [];

let unsubscribeMessages = null;
let unsubscribePresence = null;

let anonymousSession = false;

let sending = false;


/*
 * IMPORTANT:
 *
 * This flag belongs to the USER ACCOUNT.
 *
 * It is deliberately NOT tied only to a conversation.
 *
 * A new registered member therefore receives:
 *
 *     ONE FREE opening message
 *
 * and that opening message must be:
 *
 *     hi
 *     or
 *     hey
 *
 * After it is used, the sender must use a paid chat package.
 */
let accountFreeOpeningUsed = false;


/* =========================================================
   TARGET ID
========================================================= */

const urlParams = new URLSearchParams(window.location.search);

targetId =
    urlParams.get("userId") ||
    urlParams.get("user") ||
    "";


/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatTime(timestamp) {

    try {

        if (!timestamp) {
            return "";
        }

        const date =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

    } catch {
        return "";
    }
}


function normalizeMessage(text) {

    return String(text || "")
        .trim()
        .toLowerCase();

}


function validFreeOpening(text) {

    return FREE_OPENING_MESSAGES.includes(
        normalizeMessage(text)
    );

}


/* =========================================================
   GATE
========================================================= */

function gateShow(type) {

    chatGate.classList.add("show");

    composer.style.display = "none";
    sendBtn.disabled = true;

    if (type === "anonymous") {

        gateIcon.className =
            "fa-solid fa-user-plus";

        gateTitle.textContent =
            "Create an account to chat";

        gateText.textContent =
            "You can browse Kmeet profiles as a guest, but messaging requires a registered Kmeet account. Create an account or log in to start chatting.";

        gatePrimary.textContent =
            "Create Account";

        gatePrimary.href =
            "signup.html";

    }

    else if (type === "sender") {

        gateIcon.className =
            "fa-solid fa-comments";

        gateTitle.textContent =
            "Your free opening message has been used";

        gateText.textContent =
            `Continue chatting with a paid package. Get 3 chats for KSh ${SENDER_PACK_3_PRICE}, or use the bonus 8-chat package for KSh ${SENDER_PACK_8_PRICE}.`;

        gatePrimary.textContent =
            "Unlock Chat";

        gatePrimary.href =
            `subscription.html?userId=${encodeURIComponent(targetId)}&package=3`;

    }

    else if (type === "receiver") {

        gateIcon.className =
            "fa-solid fa-lock";

        gateTitle.textContent =
            "Continue the conversation";

        gateText.textContent =
            `Your ${FREE_RECEIVER_REPLIES} free replies have been used. Continue chatting for KSh ${RECEIVER_CONTINUATION_FEE}.`;

        gatePrimary.textContent =
            "Continue Chat";

        gatePrimary.href =
            `subscription.html?userId=${encodeURIComponent(targetId)}&package=receiver`;

    }

    else {

        gateIcon.className =
            "fa-solid fa-lock";

        gateTitle.textContent =
            "Chat access";

        gateText.textContent =
            "Chat access is currently unavailable.";

        gatePrimary.textContent =
            "Back to Discover";

        gatePrimary.href =
            "discover.html";

    }
}


function gateHide() {

    chatGate.classList.remove("show");

}


/* =========================================================
   GATE CLOSE
========================================================= */

gateClose.addEventListener("click", () => {

    gateHide();

    if (
        currentUser &&
        !anonymousSession
    ) {

        composer.style.display = "flex";
        sendBtn.disabled = false;

    }

});


/* =========================================================
   TARGET PROFILE
========================================================= */

async function loadTargetProfile() {

    if (!targetId) {

        targetName.textContent =
            "Unknown member";

        targetStatus.textContent =
            "Profile not found";

        return;

    }


    /*
     * DEMO PROFILE
     */

    if (targetId.startsWith("demo-")) {

        const demoNumber =
            targetId.replace("demo-", "");

        targetName.textContent =
            "Kmeet Member";

        targetStatus.textContent =
            "Kmeet member";

        statusDot.classList.remove("online");

        targetAvatar.src =
            "kmeet-logo.jfif.jfif";

        targetProfile = {
            uid: targetId,
            displayName: "Kmeet Member",
            photoURL: "kmeet-logo.jfif.jfif"
        };

        return;
    }


    /*
     * REAL FIREBASE MEMBER
     */

    try {

        const userRef =
            doc(db, "users", targetId);

        const snap =
            await getDoc(userRef);

        if (snap.exists()) {

            const data = snap.data();

            targetProfile = {
                uid: targetId,
                ...data
            };

            targetName.textContent =
                data.displayName ||
                data.name ||
                "Kmeet Member";

            const photo =
                data.photoURL ||
                data.photoUrl ||
                data.profilePhoto ||
                data.photo ||
                "kmeet-logo.jfif.jfif";

            targetAvatar.src = photo;

            targetAvatar.onerror = () => {

                targetAvatar.src =
                    "kmeet-logo.jfif.jfif";

            };

        }

        else {

            targetName.textContent =
                "Kmeet Member";

            targetAvatar.src =
                "kmeet-logo.jfif.jfif";

        }

    } catch (error) {

        console.error(
            "Could not load target profile:",
            error
        );

        targetName.textContent =
            "Kmeet Member";

        targetAvatar.src =
            "kmeet-logo.jfif.jfif";

    }

}


/* =========================================================
   ACCOUNT CHAT FREE ALLOWANCE
========================================================= */

/*
 * Read the account-level free opening status.
 *
 * We look for:
 *
 *     chatFreeOpeningUsed
 *
 * If it does not exist, the member is treated as NEW and
 * therefore receives the free opening message.
 */

async function loadAccountChatAllowance() {

    accountFreeOpeningUsed = false;


    if (!currentUser) {
        return;
    }


    if (currentUser.isAnonymous) {

        accountFreeOpeningUsed = true;

        return;

    }


    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );

        const snap =
            await getDoc(userRef);

        if (!snap.exists()) {

            /*
             * No profile document yet.
             *
             * Treat as a brand-new registered member.
             */

            accountFreeOpeningUsed = false;

            return;

        }


        const data =
            snap.data() || {};


        accountFreeOpeningUsed =
            data.chatFreeOpeningUsed === true;

    }

    catch (error) {

        console.warn(
            "Could not read account chat allowance:",
            error
        );


        /*
         * IMPORTANT:
         *
         * If the field cannot be read, we do NOT immediately
         * send a new member to payment.
         *
         * The existing conversation will still protect
         * previously-used openings.
         */

        accountFreeOpeningUsed = false;

    }

}


/* =========================================================
   MARK ACCOUNT FREE OPENING USED
========================================================= */

async function markAccountFreeOpeningUsed() {

    if (
        !currentUser ||
        currentUser.isAnonymous
    ) {

        return;

    }


    try {

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        await setDoc(
            userRef,
            {
                chatFreeOpeningUsed: true,
                chatFreeOpeningUsedAt: serverTimestamp()
            },
            {
                merge: true
            }
        );


        accountFreeOpeningUsed = true;

    }

    catch (error) {

        console.error(
            "Could not save free chat allowance:",
            error
        );


        /*
         * Do not stop the successfully-created message.
         *
         * Existing conversation state also records the opening.
         */

    }

}


/* =========================================================
   CONVERSATION IDS
========================================================= */

function conversationIds() {

    const sortedIds =
        [
            currentUser.uid,
            targetId
        ]
        .sort()
        .join("_");


    return [
        `kmeet_v2_${sortedIds}`,
        sortedIds,
        `conversation_${sortedIds}`
    ];

}


/* =========================================================
   VALIDATE CONVERSATION
========================================================= */

function validConversation(data) {

    if (!data) {
        return false;
    }


    const firstPair =
        data.initiatorId === currentUser.uid &&
        data.receiverId === targetId;


    const secondPair =
        data.initiatorId === targetId &&
        data.receiverId === currentUser.uid;


    return firstPair || secondPair;

}


/* =========================================================
   FIND EXISTING CONVERSATION
========================================================= */

async function findConversation() {

    if (
        !currentUser ||
        !targetId
    ) {

        return null;

    }


    /*
     * FIRST:
     * Check known conversation document IDs.
     */

    for (
        const id of conversationIds()
    ) {

        try {

            const ref =
                doc(
                    db,
                    "conversations",
                    id
                );

            const snap =
                await getDoc(ref);

            if (
                snap.exists() &&
                validConversation(snap.data())
            ) {

                return {
                    id: snap.id,
                    data: snap.data()
                };

            }

        }

        catch (error) {

            console.warn(
                "Conversation lookup failed:",
                id,
                error
            );

        }

    }


    /*
     * SECOND:
     * Search by initiator/receiver.
     */

    try {

        const q1 =
            query(
                collection(db, "conversations"),
                where(
                    "initiatorId",
                    "==",
                    currentUser.uid
                ),
                where(
                    "receiverId",
                    "==",
                    targetId
                ),
                limit(1)
            );


        const snap1 =
            await getDocs(q1);


        if (!snap1.empty) {

            const found =
                snap1.docs[0];

            return {
                id: found.id,
                data: found.data()
            };

        }

    }

    catch (error) {

        console.warn(
            "Initiator conversation search failed:",
            error
        );

    }


    try {

        const q2 =
            query(
                collection(db, "conversations"),
                where(
                    "initiatorId",
                    "==",
                    targetId
                ),
                where(
                    "receiverId",
                    "==",
                    currentUser.uid
                ),
                limit(1)
            );


        const snap2 =
            await getDocs(q2);


        if (!snap2.empty) {

            const found =
                snap2.docs[0];

            return {
                id: found.id,
                data: found.data()
            };

        }

    }

    catch (error) {

        console.warn(
            "Receiver conversation search failed:",
            error
        );

    }


    return null;

}


/* =========================================================
   PREPARE CHAT
========================================================= */

async function prepare() {

    await loadAccountChatAllowance();


    const existing =
        await findConversation();


    if (existing) {

        conversationId =
            existing.id;

        conversationData =
            existing.data;

        listen();

    }

    else {

        conversationId = null;

        conversationData = null;

        currentMessages = [];

        render();

    }


    updateInfo();

}


/* =========================================================
   LISTEN TO MESSAGES
========================================================= */

function listen() {

    if (!conversationId) {
        return;
    }


    if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages = null;

    }


    const messagesRef =
        collection(
            db,
            "conversations",
            conversationId,
            "messages"
        );


    const q =
        query(
            messagesRef,
            orderBy("createdAt", "asc")
        );


    unsubscribeMessages =
        onSnapshot(
            q,
            snapshot => {

                currentMessages =
                    snapshot.docs.map(
                        item => ({
                            id: item.id,
                            ...item.data()
                        })
                    );


                render();

            },

            error => {

                console.error(
                    "Message listener error:",
                    error
                );

                chatInfo.textContent =
                    "Unable to load messages right now.";

            }
        );

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function render() {

    if (!currentMessages.length) {

        messages.innerHTML = `

            <div class="empty-chat">

                <i class="fa-regular fa-comments"></i>

                <h3>Start a conversation</h3>

                <p>
                    Say hello and see where the conversation goes.
                </p>

            </div>

        `;

        return;

    }


    messages.innerHTML =
        currentMessages
            .map(message => {

                const mine =
                    message.senderId === currentUser?.uid;


                return `

                    <div class="message-row ${mine ? "mine" : "theirs"}">

                        <div class="message ${mine ? "mine" : "theirs"}">

                            ${escapeHtml(message.text)}

                            <span class="message-time">
                                ${formatTime(message.createdAt)}
                            </span>

                        </div>

                    </div>

                `;

            })
            .join("");


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================================
   INFO BAR
========================================================= */

function updateInfo() {

    if (anonymousSession) {

        chatInfo.textContent =
            "Create an account to send messages.";

        return;

    }


    if (!conversationData) {

        if (!accountFreeOpeningUsed) {

            chatInfo.textContent =
                'Your first opening message is free. Start with "hi" or "hey".';

        }

        else {

            chatInfo.textContent =
                "Your free opening message has been used. Paid chat is available.";

        }

        return;

    }


    const isInitiator =
        conversationData.initiatorId ===
        currentUser.uid;


    if (isInitiator) {

        if (!accountFreeOpeningUsed) {

            chatInfo.textContent =
                'Your free opening message is available. Send "hi" or "hey".';

        }

        else {

            const credits =
                Number(
                    conversationData.senderCredits || 0
                );


            if (credits > 0) {

                chatInfo.textContent =
                    `You have ${credits} paid chat credit${credits === 1 ? "" : "s"}.`;

            }

            else {

                chatInfo.textContent =
                    `Your free opening has been used. Get 3 chats for KSh ${SENDER_PACK_3_PRICE}.`;

            }

        }

        return;

    }


    /*
     * Current user is the receiver.
     */

    if (
        conversationData.receiverPaid === true
    ) {

        chatInfo.textContent =
            "Paid continuation is active.";

        return;

    }


    const replies =
        Number(
            conversationData.receiverRepliesUsed || 0
        );


    if (
        replies < FREE_RECEIVER_REPLIES
    ) {

        const remaining =
            FREE_RECEIVER_REPLIES - replies;

        chatInfo.textContent =
            `${remaining} free repl${remaining === 1 ? "y" : "ies"} remaining.`;

    }

    else {

        chatInfo.textContent =
            `Your free replies are finished. Continue for KSh ${RECEIVER_CONTINUATION_FEE}.`;

    }

}


/* =========================================================
   CREATE CONVERSATION
========================================================= */

async function createConversation(text) {

    const newConversationRef =
        doc(
            db,
            "conversations",
            `kmeet_v2_${[
                currentUser.uid,
                targetId
            ].sort().join("_")}`
        );


    const data = {

        initiatorId:
            currentUser.uid,

        receiverId:
            targetId,

        senderFreeOpeningUsed:
            true,

        receiverRepliesUsed:
            0,

        receiverPaid:
            false,

        senderCredits:
            0,

        senderCreditsUsed:
            0,

        createdAt:
            serverTimestamp(),

        updatedAt:
            serverTimestamp()

    };


    await setDoc(
        newConversationRef,
        data
    );


    const messageRef =
        collection(
            db,
            "conversations",
            newConversationRef.id,
            "messages"
        );


    await addDoc(
        messageRef,
        {
            senderId:
                currentUser.uid,

            receiverId:
                targetId,

            text:
                text.trim(),

            createdAt:
                serverTimestamp()
        }
    );


    conversationId =
        newConversationRef.id;

    conversationData =
        data;


    /*
     * IMPORTANT:
     *
     * Only mark the account free opening as used
     * after the message has successfully been written.
     */

    await markAccountFreeOpeningUsed();


    listen();

    updateInfo();

}


/* =========================================================
   SENDER FREE OPENING
========================================================= */

function senderFree() {

    /*
     * The free opening belongs to the account.
     *
     * This is the key correction.
     */

    return (
        currentUser &&
        !currentUser.isAnonymous &&
        !accountFreeOpeningUsed
    );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function send() {

    if (sending) {
        return;
    }


    if (!currentUser) {

        return;

    }


    const text =
        messageInput.value.trim();


    if (!text) {
        return;
    }


    /*
     * ANONYMOUS USERS
     *
     * Guests may browse Discover,
     * but they cannot send chat messages.
     */

    if (anonymousSession) {

        gateShow("anonymous");

        return;

    }


    sending = true;

    sendBtn.disabled = true;


    try {

        /*
         * =====================================================
         * NEW CONVERSATION
         * =====================================================
         */

        if (!conversationData) {

            /*
             * NEW REGISTERED MEMBER:
             *
             * Their first free opening must be hi or hey.
             */

            if (senderFree()) {

                if (!validFreeOpening(text)) {

                    alert(
                        'Your free opening message must be "hi" or "hey".'
                    );

                    return;

                }


                await createConversation(text);

                messageInput.value = "";

                return;

            }


            /*
             * Free opening already used.
             */

            gateShow("sender");

            return;

        }


        /*
         * =====================================================
         * EXISTING CONVERSATION
         * =====================================================
         */

        const isInitiator =
            conversationData.initiatorId ===
            currentUser.uid;


        /*
         * =====================================================
         * SENDER
         * =====================================================
         */

        if (isInitiator) {

            /*
             * If the account still has its free opening,
             * allow it even if an old conversation document
             * exists.
             */

            if (senderFree()) {

                if (!validFreeOpening(text)) {

                    alert(
                        'Your free opening message must be "hi" or "hey".'
                    );

                    return;

                }


                const messageRef =
                    collection(
                        db,
                        "conversations",
                        conversationId,
                        "messages"
                    );


                await addDoc(
                    messageRef,
                    {
                        senderId:
                            currentUser.uid,

                        receiverId:
                            targetId,

                        text:
                            text,

                        createdAt:
                            serverTimestamp()
                    }
                );


                await updateDoc(
                    doc(
                        db,
                        "conversations",
                        conversationId
                    ),
                    {
                        senderFreeOpeningUsed:
                            true,

                        updatedAt:
                            serverTimestamp()
                    }
                );


                await markAccountFreeOpeningUsed();


                messageInput.value = "";

                return;

            }


            /*
             * Free opening has been used.
             *
             * Check paid sender credits.
             */

            const credits =
                Number(
                    conversationData.senderCredits || 0
                );


            const creditsUsed =
                Number(
                    conversationData.senderCreditsUsed || 0
                );


            const remainingCredits =
                Math.max(
                    0,
                    credits - creditsUsed
                );


            if (remainingCredits <= 0) {

                gateShow("sender");

                return;

            }


            const messageRef =
                collection(
                    db,
                    "conversations",
                    conversationId,
                    "messages"
                );


            await addDoc(
                messageRef,
                {
                    senderId:
                        currentUser.uid,

                    receiverId:
                        targetId,

                    text:
                        text,

                    createdAt:
                        serverTimestamp()
                }
            );


            await updateDoc(
                doc(
                    db,
                    "conversations",
                    conversationId
                ),
                {
                    senderCreditsUsed:
                        creditsUsed + 1,

                    updatedAt:
                        serverTimestamp()
                }
            );


            conversationData.senderCreditsUsed =
                creditsUsed + 1;


            messageInput.value = "";

            updateInfo();

            return;

        }


        /*
         * =====================================================
         * RECEIVER
         * =====================================================
         */

        const receiverPaid =
            conversationData.receiverPaid === true;


        const repliesUsed =
            Number(
                conversationData.receiverRepliesUsed || 0
            );


        /*
         * Paid receiver:
         * continue normally.
         */

        if (receiverPaid) {

            const messageRef =
                collection(
                    db,
                    "conversations",
                    conversationId,
                    "messages"
                );


            await addDoc(
                messageRef,
                {
                    senderId:
                        currentUser.uid,

                    receiverId:
                        targetId,

                    text:
                        text,

                    createdAt:
                        serverTimestamp()
                }
            );


            messageInput.value = "";

            return;

        }


        /*
         * Receiver still has free replies.
         */

        if (
            repliesUsed <
            FREE_RECEIVER_REPLIES
        ) {

            const messageRef =
                collection(
                    db,
                    "conversations",
                    conversationId,
                    "messages"
                );


            await addDoc(
                messageRef,
                {
                    senderId:
                        currentUser.uid,

                    receiverId:
                        targetId,

                    text:
                        text,

                    createdAt:
                        serverTimestamp()
                }
            );


            await updateDoc(
                doc(
                    db,
                    "conversations",
                    conversationId
                ),
                {
                    receiverRepliesUsed:
                        repliesUsed + 1,

                    updatedAt:
                        serverTimestamp()
                }
            );


            conversationData.receiverRepliesUsed =
                repliesUsed + 1;


            messageInput.value = "";

            updateInfo();

            return;

        }


        /*
         * Receiver's three free replies are finished.
         */

        gateShow("receiver");

    }

    catch (error) {

        console.error(
            "Send message error:",
            error
        );


        alert(
            "The message could not be sent. Please try again."
        );

    }

    finally {

        sending = false;

        /*
         * Do not leave the button disabled for a normal
         * registered chat session.
         */

        if (
            currentUser &&
            !anonymousSession &&
            !chatGate.classList.contains("show")
        ) {

            sendBtn.disabled = false;

        }

    }

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
    "click",
    send
);


/* =========================================================
   ENTER TO SEND
========================================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            send();

        }

    }
);


/* =========================================================
   AUTO RESIZE TEXTAREA
========================================================= */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                130
            ) + "px";

    }
);


/* =========================================================
   PRESENCE
========================================================= */

function presence() {

    if (
        !currentUser ||
        currentUser.isAnonymous
    ) {

        return;

    }


    if (unsubscribePresence) {

        unsubscribePresence();

        unsubscribePresence = null;

    }


    try {

        const presenceRef =
            ref(
                rtdb,
                `presence/${currentUser.uid}`
            );


        const connectedRef =
            ref(
                rtdb,
                ".info/connected"
            );


        unsubscribePresence =
            onValue(
                connectedRef,
                async snapshot => {

                    if (
                        snapshot.val() !== true
                    ) {

                        return;

                    }


                    try {

                        await onDisconnect(
                            presenceRef
                        ).set({
                            online: false,
                            lastSeen:
                                rtdbServerTimestamp()
                        });


                        await rtdbSet(
                            presenceRef,
                            {
                                online: true,
                                lastSeen:
                                    rtdbServerTimestamp()
                            }
                        );

                    }

                    catch (error) {

                        console.warn(
                            "Presence error:",
                            error
                        );

                    }

                }
            );

    }

    catch (error) {

        console.warn(
            "Presence setup failed:",
            error
        );

    }

}


/* =========================================================
   TARGET PRESENCE
========================================================= */

function targetPresence() {

    if (
        !targetId ||
        targetId.startsWith("demo-")
    ) {

        targetStatus.textContent =
            "Kmeet member";

        statusDot.classList.remove("online");

        return;

    }


    try {

        const targetPresenceRef =
            ref(
                rtdb,
                `presence/${targetId}`
            );


        onValue(
            targetPresenceRef,
            snapshot => {

                const data =
                    snapshot.val();


                if (
                    data &&
                    data.online === true
                ) {

                    targetStatus.textContent =
                        "Online";

                    statusDot.classList.add(
                        "online"
                    );

                }

                else {

                    targetStatus.textContent =
                        "Offline";

                    statusDot.classList.remove(
                        "online"
                    );

                }

            }
        );

    }

    catch (error) {

        console.warn(
            "Target presence error:",
            error
        );

        targetStatus.textContent =
            "Offline";

    }

}


/* =========================================================
   AUTHENTICATION
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        try {

            /*
             * =================================================
             * NO AUTH SESSION
             * =================================================
             *
             * We keep anonymous browsing available.
             *
             * Anonymous users can view the chat profile,
             * but cannot send messages.
             */

            if (!user) {

                const anonymous =
                    await signInAnonymously(
                        auth
                    );


                currentUser =
                    anonymous.user;

                anonymousSession =
                    true;

            }

            else {

                currentUser =
                    user;

                anonymousSession =
                    user.isAnonymous;

            }


            await loadTargetProfile();

            targetPresence();


            /*
             * =================================================
             * ANONYMOUS
             * =================================================
             */

            if (anonymousSession) {

                composer.style.display =
                    "none";

                sendBtn.disabled =
                    true;

                chatInfo.textContent =
                    "Create an account to send messages.";

                loading.style.display =
                    "none";

                /*
                 * Give the visitor a moment to see
                 * the profile before displaying the gate.
                 */

                setTimeout(
                    () => {
                        gateShow("anonymous");
                    },
                    250
                );

                return;

            }


            /*
             * =================================================
             * REGISTERED USER
             * =================================================
             */

            await prepare();


            composer.style.display =
                "flex";

            sendBtn.disabled =
                false;

            presence();


            loading.style.display =
                "none";


        }

        catch (error) {

            console.error(
                "Chat initialization error:",
                error
            );


            loading.style.display =
                "none";


            chatInfo.textContent =
                "Unable to initialize chat. Please refresh and try again.";

        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (unsubscribeMessages) {
            unsubscribeMessages();
        }

        if (unsubscribePresence) {
            unsubscribePresence();
        }

    }
);

</script>
