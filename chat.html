<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kmeet — Chat</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;
  background:linear-gradient(rgba(10,5,10,.45),rgba(10,5,10,.70)),url("chat.jpg");
  background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 18% 18%,rgba(255,190,210,.10),transparent 34%),
             radial-gradient(circle at 82% 78%,rgba(255,90,150,.10),transparent 36%);
}
.page{min-height:100vh;position:relative;z-index:1;display:flex;flex-direction:column}
.topbar{
  width:100%;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,8,15,.38);border-bottom:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.brand-link{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none}
.brand-logo{
  width:38px;height:38px;border-radius:50%;object-fit:cover;
  border:1px solid rgba(255,255,255,.24);box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.brand{font-size:24px;font-weight:700;letter-spacing:.5px}
.brand span{color:#ff9ab9}
.back-btn{color:#fff;text-decoration:none;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.chat-shell{
  width:min(900px,calc(100% - 28px));height:calc(100vh - 105px);min-height:560px;
  margin:18px auto;display:flex;flex-direction:column;overflow:hidden;
  background:rgba(25,12,23,.46);border:1px solid rgba(255,255,255,.20);border-radius:26px;
  box-shadow:0 25px 70px rgba(0,0,0,.42);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
}
.chat-header{
  padding:16px 20px;display:flex;align-items:center;gap:13px;background:rgba(10,5,10,.28);
  border-bottom:1px solid rgba(255,255,255,.13);
}
.avatar,.avatar-fallback{width:48px;height:48px;border-radius:50%;flex:0 0 auto}
.avatar{object-fit:cover;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3)}
.avatar-fallback{
  display:grid;place-items:center;background:linear-gradient(135deg,#ff9ab9,#b85d82);
  font-weight:700;font-size:19px;border:2px solid rgba(255,255,255,.3)
}
.person-name{font-size:18px;font-weight:700}
.status{margin-top:3px;font-size:13px;color:rgba(255,255,255,.72)}
.messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.message{max-width:min(72%,600px);padding:11px 14px;border-radius:18px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.message.mine{align-self:flex-end;background:linear-gradient(135deg,rgba(225,94,137,.94),rgba(164,64,105,.94));border-bottom-right-radius:5px}
.message.theirs{align-self:flex-start;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.13);border-bottom-left-radius:5px}
.empty{margin:auto;text-align:center;color:rgba(255,255,255,.72);max-width:360px;line-height:1.6}
.composer{padding:14px;display:flex;gap:10px;background:rgba(8,4,8,.35);border-top:1px solid rgba(255,255,255,.13)}
.composer textarea{flex:1;resize:none;min-height:48px;max-height:130px;padding:13px 15px;border:1px solid rgba(255,255,255,.18);border-radius:17px;outline:none;color:#fff;background:rgba(255,255,255,.10);font:inherit}
.composer textarea::placeholder{color:rgba(255,255,255,.62)}
.send-btn{padding:0 21px;min-width:78px;cursor:pointer;border:0;border-radius:17px;color:#fff;font-weight:700;background:linear-gradient(135deg,#e66a94,#a9426d);box-shadow:0 8px 22px rgba(150,47,88,.30)}
.send-btn:disabled{opacity:.55;cursor:not-allowed}
.gate{flex:1;display:grid;place-items:center;padding:35px;text-align:center}
.gate-card{width:min(560px,100%);padding:36px 30px;border-radius:24px;background:rgba(15,7,14,.58);border:1px solid rgba(255,255,255,.17);box-shadow:0 20px 60px rgba(0,0,0,.3);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.gate-icon{font-size:42px;margin-bottom:10px}
.gate-card h2{margin:0 0 10px;font-size:27px}
.gate-card p{margin:0 auto 22px;max-width:450px;color:rgba(255,255,255,.78);line-height:1.6}
.gate-buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.pay-btn{display:inline-flex;align-items:center;justify-content:center;min-width:145px;padding:13px 20px;border-radius:999px;text-decoration:none;color:#fff;font-weight:700;background:linear-gradient(135deg,#e66a94,#a9426d);border:0;cursor:pointer;box-shadow:0 8px 22px rgba(150,47,88,.30)}
.secondary-btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
.error{color:#ffd0d8;background:rgba(150,30,55,.30);border:1px solid rgba(255,150,170,.22);padding:12px 14px;border-radius:12px;margin:14px;display:none}
.info-bar{padding:8px 14px;text-align:center;color:rgba(255,255,255,.70);font-size:11px}
@media(max-width:650px){
  .topbar{padding:12px 15px}.brand{font-size:21px}.brand-logo{width:34px;height:34px}
  .chat-shell{width:calc(100% - 12px);height:calc(100vh - 78px);min-height:0;margin:6px auto;border-radius:20px}
  .messages{padding:15px}.message{max-width:84%}.composer{padding:10px}.send-btn{min-width:64px;padding:0 14px}
}
</style>
</head>

<body>
<div class="page">

<header class="topbar">
  <a class="brand-link" href="index.html" aria-label="Kmeet home">
    <img class="brand-logo" src="./kmeet-logo.jfif.jfif" alt="Kmeet">
    <div class="brand">K<span>meet</span></div>
  </a>
  <a class="back-btn" href="discover.html">← Back</a>
</header>

<main class="chat-shell">
  <div id="errorBox" class="error"></div>

  <section id="chatArea" style="display:flex;height:100%;flex-direction:column">
    <div class="chat-header">
      <div id="avatarFallback" class="avatar-fallback">K</div>
      <img id="avatar" class="avatar" alt="" style="display:none">
      <div>
        <div id="personName" class="person-name">Kmeet Member</div>
        <div id="personStatus" class="status">Your Kmeet conversation</div>
      </div>
    </div>

    <div id="infoBar" class="info-bar">Say hello and let the connection grow ❤️</div>

    <div id="messages" class="messages">
      <div id="emptyState" class="empty">Start the conversation and let the connection grow. ❤️</div>
    </div>

    <form id="composer" class="composer">
      <textarea id="messageInput" placeholder="Write a message…" maxlength="2000" required></textarea>
      <button id="sendBtn" class="send-btn" type="submit">Send</button>
    </form>
  </section>

  <section id="gate" class="gate" style="display:none">
    <div class="gate-card">
      <div id="gateIcon" class="gate-icon">💗</div>
      <h2 id="gateTitle">Unlock your conversation</h2>
      <p id="gateText">Continue chatting with Kmeet credits.</p>
      <div id="gateButtons" class="gate-buttons"></div>
    </div>
  </section>
</main>
</div>

<script type="module">
import {
  auth, db, onAuthStateChanged, signInAnonymously,
  doc, getDoc, collection, addDoc, setDoc, getDocs,
  query, orderBy, onSnapshot, serverTimestamp
} from "./firebase-config.js";

const params = new URLSearchParams(window.location.search);
const targetId = params.get("userId") || params.get("user");

const chatArea = document.getElementById("chatArea");
const gate = document.getElementById("gate");
const gateTitle = document.getElementById("gateTitle");
const gateText = document.getElementById("gateText");
const gateButtons = document.getElementById("gateButtons");
const gateIcon = document.getElementById("gateIcon");
const errorBox = document.getElementById("errorBox");
const personName = document.getElementById("personName");
const personStatus = document.getElementById("personStatus");
const avatar = document.getElementById("avatar");
const avatarFallback = document.getElementById("avatarFallback");
const messages = document.getElementById("messages");
const composer = document.getElementById("composer");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const infoBar = document.getElementById("infoBar");

let currentUser = null;
let conversationId = null;
let unsubscribeMessages = null;
let authStarted = false;
let targetIsDemo = false;

/* Keeps the demo conversation visible immediately after Send.
   Local storage is only used to remember the messages on this browser. */
let demoMessages = [];

const FREE_OPENING_MESSAGES = ["hi","hey"];
const FREE_RECEIVER_REPLIES = 3;
const RECEIVER_FEE = 11;
const SENDER_PACK_3_PRICE = 49;
const SENDER_PACK_8_PRICE = 100;

function showError(message){errorBox.textContent=message;errorBox.style.display="block"}
function clearError(){errorBox.textContent="";errorBox.style.display="none"}

function senderCreditKey(){
  return "kmeet_sender_credits_"+currentUser.uid+"_"+targetId;
}
function receiverPaidKey(){
  return "kmeet_receiver_paid_"+currentUser.uid+"_"+targetId;
}
function getSenderCredits(){
  return parseInt(localStorage.getItem(senderCreditKey())||"0",10)||0;
}
function setSenderCredits(value){
  localStorage.setItem(senderCreditKey(),String(Math.max(0,value)));
}
function receiverHasPaid(){
  return localStorage.getItem(receiverPaidKey())==="true";
}
function getConversationId(){
  return [currentUser.uid,targetId].sort().join("_");
}

function demoMessageKey(){
  const userPart = currentUser?.uid || "visitor";
  return "kmeet_demo_chat_"+userPart+"_"+targetId;
}
function getDemoMessages(){
  try{
    const saved = JSON.parse(localStorage.getItem(demoMessageKey()) || "[]");
    return Array.isArray(saved) ? saved : [];
  }catch(error){
    console.warn("Could not read saved demo messages:", error);
    return [];
  }
}

function saveDemoMessages(items){
  try{
    localStorage.setItem(
      demoMessageKey(),
      JSON.stringify(items)
    );
  }catch(error){
    console.warn("Could not save demo messages:", error);
  }
}

function showDemoEmptyState(){
  if(!messages.querySelector(".message") && !messages.querySelector(".empty")){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="Start the conversation and let the connection grow. ❤️";
    messages.appendChild(empty);
  }
}

function renderDemoMessages(items = demoMessages){
  messages.innerHTML="";

  if(!items.length){
    showDemoEmptyState();
    return;
  }

  const fragment=document.createDocumentFragment();
  items.forEach(data=>{
    const div=document.createElement("div");
    div.className="message mine";
    div.textContent=data.text || "";
    fragment.appendChild(div);
  });
  messages.appendChild(fragment);
  messages.scrollTop=messages.scrollHeight;
}

function appendDemoMessage(data){
  const empty=messages.querySelector(".empty");
  if(empty)empty.remove();

  const div=document.createElement("div");
  div.className="message mine";
  div.textContent=data.text || "";
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function containsContactInformation(text){
  const value=String(text).toLowerCase().trim();
  if(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i.test(value))return true;
  if(/(?:\+?254[\s-]?(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3,4})|(?:0(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3})/i.test(value))return true;
  if(/\b(whatsapp|whats\s*app|call me|text me|message me|contact me|my number|phone number|email me|dm me|instagram|telegram|facebook)\b/i.test(value))return true;
  if(/(?:^|\s)@[a-z0-9_.]{3,}/i.test(value))return true;
  return false;
}

async function loadTargetProfile(){
  if(!targetId)throw new Error("No Kmeet profile was selected.");

  targetIsDemo=Object.prototype.hasOwnProperty.call(demoProfiles,targetId);

  if(targetIsDemo){
    const demo=demoProfiles[targetId];
    personName.textContent=demo.name;
    personStatus.textContent="Kmeet connection";
    avatarFallback.textContent=demo.name.charAt(0).toUpperCase();
    avatar.src=demo.photo;
    avatar.style.display="block";
    avatarFallback.style.display="none";
    demoMessages = [];
    renderDemoMessages(demoMessages);
    return;
  }

  const snap=await getDoc(doc(db,"users",targetId));
  if(!snap.exists())throw new Error("The selected Kmeet profile could not be found.");

  const data=snap.data()||{};
  const name=data.name||data.username||data.displayName||"Kmeet Member";
  personName.textContent=name;
  avatarFallback.textContent=name.charAt(0).toUpperCase();

  const photo=data.photoURL||data.photoUrl||data.avatar||data.profilePhoto||data.profileImage||data.image||"";
  if(photo){
    avatar.src=photo;
    avatar.style.display="block";
    avatarFallback.style.display="none";
  }
}

function showChat(){
  gate.style.display="none";
  chatArea.style.display="flex";
}

function showGate(type){
  gate.style.display="grid";
  chatArea.style.display="none";
  gateButtons.innerHTML="";

  if(type==="anonymous"){
    gateIcon.textContent="🔒";
    gateTitle.textContent="Start chatting";
    gateText.textContent="Choose a Kmeet chat package to start this conversation.";
    gateButtons.innerHTML=`
      <a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49&anonymous=true">3 Chats — KSh 49</a>
      <a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100&anonymous=true">8 Chats — KSh 100</a>
      <a class="pay-btn secondary-btn" href="discover.html">Back to Discover</a>`;
    return;
  }

  if(type==="sender"){
    gateIcon.textContent="💎";
    gateTitle.textContent="Continue chatting";
    gateText.textContent="Your free opening message has been used, or this message requires a paid chat. Choose a Kmeet chat package to continue.";
    gateButtons.innerHTML=`
      <a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49">3 Chats — KSh 49</a>
      <a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100">8 Chats — KSh 100</a>
      <a class="pay-btn secondary-btn" href="discover.html">Back to Discover</a>`;
    return;
  }

  if(type==="receiver"){
    gateIcon.textContent="💗";
    gateTitle.textContent="Continue the conversation";
    gateText.textContent="You have used your free replies or attempted to share contact information. Pay KSh 11 to continue.";
    gateButtons.innerHTML=`
      <a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=receiver&amount=11">Continue — KSh 11</a>
      <a class="pay-btn secondary-btn" href="discover.html">Back to Discover</a>`;
  }
}

async function getExistingMessages(){
  if(!conversationId)conversationId=getConversationId();
  const snap=await getDocs(query(collection(db,"conversations",conversationId,"messages"),orderBy("createdAt","asc")));
  return snap.docs.map(item=>item.data());
}

function renderMessages(items){
  messages.innerHTML="";
  if(!items.length){
    messages.innerHTML='<div class="empty">Start the conversation and let the connection grow. ❤️</div>';
    return;
  }
  items.forEach(data=>{
    const div=document.createElement("div");
    div.className="message "+(data.senderId===currentUser.uid?"mine":"theirs");
    div.textContent=data.text||"";
    messages.appendChild(div);
  });
  messages.scrollTop=messages.scrollHeight;
}

function startMessages(){
  if(!currentUser||currentUser.isAnonymous||targetIsDemo)return;

  conversationId=getConversationId();
  const ref=collection(db,"conversations",conversationId,"messages");
  const q=query(ref,orderBy("createdAt","asc"));

  unsubscribeMessages=onSnapshot(q,snapshot=>{
    const items=snapshot.docs.map(item=>item.data());
    renderMessages(items);

    if(!items.length){
      infoBar.textContent="Your opening message is free — say hi or hey ❤️";
      return;
    }

    const firstSenderId=items[0].senderId;
    const myReplies=items.filter(item=>item.senderId===currentUser.uid).length;

    if(firstSenderId===currentUser.uid){
      infoBar.textContent="Your opening message is free. Further messages use chat credits.";
    }else{
      infoBar.textContent=`You have ${Math.max(0,FREE_RECEIVER_REPLIES-myReplies)} free replies remaining.`;
    }
  },error=>{
    console.error("Message listener error:",error);
    showError("The chat interface is open, but messages could not be loaded. Please check your Firebase Firestore rules.");
  });
}

async function initialiseAuth(){
  if(authStarted)return;
  authStarted=true;

  onAuthStateChanged(auth,async user=>{
    try{
      if(!user){
        await signInAnonymously(auth);
        return;
      }

      currentUser=user;
      conversationId=getConversationId();
      clearError();

      if(targetIsDemo){
        demoMessages = getDemoMessages();
        renderDemoMessages(demoMessages);
      }

      if(user.isAnonymous){
        const credits=getSenderCredits();
        infoBar.textContent=credits>0
          ? `Anonymous chat: ${credits} paid chat credit${credits===1?"":"s"} available.`
          : "Anonymous chat: payment is required before your first message.";
        showChat();
        return;
      }

      infoBar.textContent="Your opening message is free — say hi or hey ❤️";
      showChat();

      if(!targetIsDemo)startMessages();
    }catch(error){
      console.error("Kmeet authentication error:",error);
      if(error.code==="auth/operation-not-allowed"){
        showError("Anonymous Authentication is not enabled in Firebase. Enable Authentication → Sign-in method → Anonymous.");
      }else{
        showError("Kmeet could not start the chat session ("+(error.code||"authentication error") + "). Please check your Firebase Authentication settings.");
      }
    }
  });
}

composer.addEventListener("submit",async event=>{
  event.preventDefault();
  clearError();

  const text=messageInput.value.trim();
  if(!text)return;

  if(!currentUser){
    showError("Kmeet is still preparing your chat session. Please try again in a moment.");
    return;
  }

  /* Anonymous visitors must still have paid chat credit before sending. */
  if(currentUser.isAnonymous&&getSenderCredits()<=0){
    showGate("anonymous");
    return;
  }

  /* DEMO CHAT:
     This is a local preview conversation. The message is added directly to
     the visible chat and saved in this browser. It is never written to
     Firestore and no fake reply is generated. */
  if(targetIsDemo){
    const newMessage = {
      text,
      createdAt: new Date().toISOString()
    };

    demoMessages.push(newMessage);

    /* Append only the new bubble. Do not rebuild the messages container.
       This prevents the just-sent message from disappearing. */
    appendDemoMessage(newMessage);
    saveDemoMessages(demoMessages);

    if(currentUser.isAnonymous){
      const before=getSenderCredits();
      setSenderCredits(before-1);
      const remaining=getSenderCredits();
      infoBar.textContent=`Anonymous chat: ${remaining} paid chat credit${remaining===1?"":"s"} remaining. ❤️`;
    }else{
      infoBar.textContent="Your message is shown in this conversation ❤️";
    }

    messageInput.value="";
    messageInput.focus();
    return;
  }
    showGate("anonymous");
    return;
  }

  if(!conversationId)conversationId=getConversationId();

  let existingMessages=[];
  try{
    existingMessages=await getExistingMessages();
  }catch(error){
    console.error("Conversation read failed:",error);
    showError("Kmeet could not check this conversation. Please check your Firestore rules and try again.");
    return;
  }

  if(!currentUser.isAnonymous&&existingMessages.length===0){
    const opening=text.toLowerCase();
    if(!FREE_OPENING_MESSAGES.includes(opening)){
      showGate("sender");
      return;
    }
  }

  const originalSenderId=existingMessages.length?existingMessages[0].senderId:currentUser.uid;
  const isSender=originalSenderId===currentUser.uid;

  if(containsContactInformation(text)){
    if(!isSender){
      showGate("receiver");
      return;
    }
    showGate("sender");
    return;
  }

  let creditConsumed=false;
  let creditsBefore=0;

  if(isSender&&(existingMessages.length>0||currentUser.isAnonymous)){
    creditsBefore=getSenderCredits();

    if(creditsBefore<=0){
      showGate("sender");
      return;
    }

    setSenderCredits(creditsBefore-1);
    creditConsumed=true;
  }

  if(!isSender){
    const receiverReplies=existingMessages.filter(item=>item.senderId===currentUser.uid).length;
    if(receiverReplies>=FREE_RECEIVER_REPLIES&&!receiverHasPaid()){
      showGate("receiver");
      return;
    }
  }

  sendBtn.disabled=true;

  try{
    await setDoc(doc(db,"conversations",conversationId),{
      initiatorId:originalSenderId,
      receiverId:targetId,
      updatedAt:serverTimestamp(),
      createdAt:serverTimestamp()
    },{merge:true});

    await addDoc(collection(db,"conversations",conversationId,"messages"),{
      senderId:currentUser.uid,
      receiverId:targetId,
      text,
      createdAt:serverTimestamp()
    });

    messageInput.value="";
    messageInput.focus();

    if(currentUser.isAnonymous){
      const remaining=getSenderCredits();
      infoBar.textContent=`Anonymous chat: ${remaining} paid chat credit${remaining===1?"":"s"} remaining.`;
    }
  }catch(error){
    console.error("Message send failed:",error);
    if(creditConsumed)setSenderCredits(creditsBefore);
    showError("Your message could not be sent. Please check your Firestore rules.");
  }finally{
    sendBtn.disabled=false;
  }
});

messageInput.addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    composer.requestSubmit();
  }
});

async function start(){
  if(!targetId){
    showError("No profile was selected for this chat.");
    sendBtn.disabled=true;
    return;
  }

  try{
    await loadTargetProfile();
    initialiseAuth();
  }catch(error){
    console.error(error);
    showError(error.message||"Unable to load the selected profile.");
  }
}

start();

window.addEventListener("beforeunload",()=>{
  if(unsubscribeMessages)unsubscribeMessages();
});
</script>
</body>
</html>
