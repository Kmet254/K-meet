<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet - Chat</title>

<link rel="icon"
      type="image/jpeg"
      href="./kmeet-logo.jfif.jfif">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    font-family:"Poppins",sans-serif;
    color:#fff;
    background:
        linear-gradient(
            135deg,
            rgba(10,3,13,.88),
            rgba(47,7,35,.76),
            rgba(10,3,13,.92)
        ),
        url("./chat.jpg") center/cover fixed no-repeat;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,70,160,.13),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(190,40,130,.12),
            transparent 38%
        );
    z-index:-1;
}

/* TOP BAR */

.topbar{
    width:100%;
    height:74px;
    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(12,4,13,.76);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    position:sticky;
    top:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    color:#fff;
    text-decoration:none;
}

.brand img{
    width:43px;
    height:43px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid rgba(255,120,190,.65);
    box-shadow:0 0 18px rgba(255,55,155,.22);
}

.brand span{
    font-family:"Playfair Display",serif;
    font-size:25px;
    font-weight:700;
    letter-spacing:.2px;
}

.back-btn{
    color:#fff;
    text-decoration:none;

    display:flex;
    align-items:center;
    gap:8px;

    padding:10px 16px;
    border-radius:25px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);

    transition:.25s ease;
}

.back-btn:hover{
    background:rgba(255,73,166,.17);
    border-color:rgba(255,120,190,.35);
    transform:translateY(-1px);
}

/* CHAT SHELL */

.chat-shell{
    width:min(900px,94%);
    margin:28px auto 35px;

    background:rgba(17,7,18,.74);
    border:1px solid rgba(255,255,255,.09);
    border-radius:25px;

    overflow:hidden;

    box-shadow:
        0 25px 80px rgba(0,0,0,.4),
        0 0 45px rgba(255,50,150,.06);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

/* HEADER */

.chat-header{
    min-height:82px;
    padding:15px 20px;

    display:flex;
    align-items:center;
    gap:14px;

    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.025);
}

.chat-avatar{
    width:56px;
    height:56px;
    flex:0 0 56px;

    border-radius:50%;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,78,167,.3),
            rgba(114,24,85,.35)
        );

    border:2px solid rgba(255,120,190,.5);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 0 18px rgba(255,55,155,.15);
}

.chat-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-avatar i{
    font-size:23px;
    color:rgba(255,255,255,.78);
}

.chat-person{
    min-width:0;
    flex:1;
}

.chat-person h2{
    font-family:"Playfair Display",serif;
    font-size:23px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.person-status{
    margin-top:3px;

    display:flex;
    align-items:center;
    gap:7px;

    color:rgba(255,255,255,.66);
    font-size:12px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
    box-shadow:0 0 7px rgba(255,255,255,.1);
}

.status-dot.online{
    background:#54e89a;
    box-shadow:0 0 9px rgba(84,232,154,.6);
}

/* INFO BAR */

.info-bar{
    padding:11px 18px;

    color:rgba(255,255,255,.68);
    font-size:12px;
    line-height:1.55;

    background:rgba(255,55,155,.055);
    border-bottom:1px solid rgba(255,255,255,.06);

    text-align:center;
}

.info-bar i{
    color:#ff7fbd;
    margin-right:5px;
}

/* MESSAGES */

#messages{
    height:480px;
    overflow-y:auto;

    padding:22px 18px;

    display:flex;
    flex-direction:column;
    gap:10px;

    scroll-behavior:smooth;
}

#messages::-webkit-scrollbar{
    width:6px;
}

#messages::-webkit-scrollbar-track{
    background:transparent;
}

#messages::-webkit-scrollbar-thumb{
    background:rgba(255,110,180,.25);
    border-radius:10px;
}

.empty-state{
    margin:auto;
    text-align:center;
    color:rgba(255,255,255,.48);
    max-width:330px;
}

.empty-state i{
    font-size:32px;
    margin-bottom:12px;
    color:rgba(255,100,177,.55);
}

.empty-state p{
    font-size:13px;
    line-height:1.6;
}

.message-row{
    width:100%;
    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.theirs{
    justify-content:flex-start;
}

.message-bubble{
    max-width:min(72%,520px);
    padding:11px 14px;

    border-radius:18px;

    font-size:14px;
    line-height:1.5;

    word-break:break-word;
    overflow-wrap:anywhere;
}

.message-row.mine .message-bubble{
    background:
        linear-gradient(
            135deg,
            rgba(235,61,145,.9),
            rgba(163,32,103,.9)
        );

    border-bottom-right-radius:5px;

    box-shadow:0 7px 20px rgba(210,25,115,.15);
}

.message-row.theirs .message-bubble{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);

    border-bottom-left-radius:5px;
}

.message-time{
    display:block;
    margin-top:4px;

    font-size:9px;
    color:rgba(255,255,255,.5);
    text-align:right;
}

/* GATE */

#gate{
    display:none;

    margin:0 18px 16px;
    padding:17px;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            rgba(255,60,158,.11),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,100,180,.18);

    text-align:center;
}

#gate.show{
    display:block;
}

#gate h3{
    font-family:"Playfair Display",serif;
    font-size:19px;
    margin-bottom:6px;
}

#gate p{
    font-size:12px;
    line-height:1.55;
    color:rgba(255,255,255,.67);
    max-width:580px;
    margin:0 auto 13px;
}

.gate-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
}

.gate-btn{
    border:0;
    cursor:pointer;

    padding:10px 15px;
    border-radius:22px;

    color:#fff;
    font-family:"Poppins",sans-serif;
    font-weight:600;
    font-size:12px;

    background:
        linear-gradient(
            135deg,
            #ed4c9c,
            #a72872
        );

    box-shadow:0 7px 20px rgba(213,34,125,.18);

    transition:.2s ease;
}

.gate-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.gate-btn.secondary{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:none;
}

/* COMPOSER */

.composer{
    padding:15px;

    display:flex;
    align-items:center;
    gap:9px;

    border-top:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.13);
}

#messageInput{
    flex:1;
    min-width:0;

    height:47px;

    padding:0 16px;

    color:#fff;
    font-family:"Poppins",sans-serif;
    font-size:13px;

    outline:none;

    border-radius:25px;

    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.1);

    transition:.2s ease;
}

#messageInput::placeholder{
    color:rgba(255,255,255,.38);
}

#messageInput:focus{
    border-color:rgba(255,105,178,.42);
    background:rgba(255,255,255,.08);
}

#sendBtn{
    width:47px;
    height:47px;
    flex:0 0 47px;

    border:0;
    border-radius:50%;

    cursor:pointer;

    color:#fff;
    background:
        linear-gradient(
            135deg,
            #ed4c9c,
            #a72872
        );

    box-shadow:0 7px 20px rgba(213,34,125,.22);

    transition:.2s ease;
}

#sendBtn:hover{
    transform:translateY(-1px) scale(1.02);
}

#sendBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:24px;

    transform:translate(-50%,20px);

    min-width:min(390px,88vw);

    padding:12px 17px;

    border-radius:13px;

    background:rgba(20,8,20,.94);
    border:1px solid rgba(255,100,175,.2);

    color:#fff;
    font-size:12px;
    text-align:center;

    box-shadow:0 15px 45px rgba(0,0,0,.35);

    opacity:0;
    pointer-events:none;

    transition:.25s ease;

    z-index:100;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

#toast.success{
    border-color:rgba(84,232,154,.3);
}

#toast.error{
    border-color:rgba(255,85,105,.35);
}

/* LOADING */

.loading-state{
    margin:auto;
    text-align:center;
    color:rgba(255,255,255,.5);
    font-size:13px;
}

.loading-state i{
    margin-right:6px;
}

/* MOBILE */

@media(max-width:600px){

    .topbar{
        height:68px;
        padding:0 14px;
    }

    .brand img{
        width:39px;
        height:39px;
    }

    .brand span{
        font-size:22px;
    }

    .back-btn{
        padding:8px 12px;
        font-size:11px;
    }

    .chat-shell{
        width:100%;
        margin:0;
        min-height:calc(100vh - 68px);

        border-radius:0;
        border-left:0;
        border-right:0;
    }

    .chat-header{
        padding:13px 14px;
    }

    .chat-avatar{
        width:50px;
        height:50px;
        flex-basis:50px;
    }

    .chat-person h2{
        font-size:20px;
    }

    #messages{
        height:calc(100vh - 290px);
        min-height:360px;
        padding:18px 12px;
    }

    .message-bubble{
        max-width:82%;
    }

    .composer{
        padding:11px;
    }

    .info-bar{
        font-size:11px;
        padding:10px 12px;
    }
}

@media(max-width:400px){

    .brand span{
        display:none;
    }

    .back-btn span{
        display:none;
    }

    .back-btn{
        width:38px;
        height:38px;
        padding:0;
        justify-content:center;
    }

    #messages{
        min-height:330px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <a href="./index.html" class="brand">
        <img src="./kmeet-logo.jfif.jfif"
             alt="Kmeet"
             onerror="this.style.display='none'">
        <span>Kmeet</span>
    </a>

    <a href="./discover.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Discover</span>
    </a>

</header>


<main class="chat-shell">

    <section class="chat-header">

        <div class="chat-avatar" id="chatAvatar">
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="chat-person">

            <h2 id="personName">Loading...</h2>

            <div class="person-status">

                <span class="status-dot" id="statusDot"></span>

                <span id="personStatus">
                    Checking status...
                </span>

            </div>

        </div>

    </section>


    <div class="info-bar">

        <i class="fa-solid fa-shield-heart"></i>

        Keep your personal contact details private until you are comfortable
        and have unlocked the conversation.

    </div>


    <section id="messages">

        <div class="loading-state" id="loadingMessages">
            <i class="fa-solid fa-spinner fa-spin"></i>
            Loading conversation...
        </div>

    </section>


    <section id="gate">

        <h3 id="gateTitle">
            Unlock this chat
        </h3>

        <p id="gateText">
            Choose an option below to continue chatting.
        </p>

        <div class="gate-buttons" id="gateButtons"></div>

    </section>


    <div class="composer">

        <input
            id="messageInput"
            type="text"
            maxlength="2000"
            autocomplete="off"
            placeholder="Write a message..."
        >

        <button id="sendBtn" type="button" aria-label="Send message">
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </div>

</main>


<div id="toast"></div>


<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    auth,
    onAuthStateChanged,
    signInAnonymously,
    db,
    doc,
    getDoc,
    setDoc,
    collection,
    addDoc,
    query,
    onSnapshot,
    serverTimestamp,
    database,
    databaseRef,
    databaseOnValue
} from "./firebase-config.js";


/* =========================================================
   CONSTANTS
========================================================= */

const FREE_OPENING_MESSAGES = ["hi", "hey"];

const FREE_RECEIVER_REPLIES = 3;

const RECEIVER_CONTINUATION_FEE = 11;

const SENDER_PACK_3_PRICE = 49;

const SENDER_PACK_8_PRICE = 100;


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl =
    document.getElementById("messages");

const loadingMessages =
    document.getElementById("loadingMessages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const gate =
    document.getElementById("gate");

const gateTitle =
    document.getElementById("gateTitle");

const gateText =
    document.getElementById("gateText");

const gateButtons =
    document.getElementById("gateButtons");

const personName =
    document.getElementById("personName");

const personStatus =
    document.getElementById("personStatus");

const statusDot =
    document.getElementById("statusDot");

const chatAvatar =
    document.getElementById("chatAvatar");

const toast =
    document.getElementById("toast");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let targetUserId = null;

let targetProfile = null;

let conversationId = null;

let unsubscribeMessages = null;

let unsubscribePresence = null;

let messagesLoaded = false;

let sending = false;

let currentConversationData = null;

let toastTimer = null;


/* =========================================================
   TOAST
========================================================= */

function showToast(message, type = "normal"){

    clearTimeout(toastTimer);

    toast.textContent = message;

    toast.className = "";

    toast.classList.add("show");

    if(type === "success"){
        toast.classList.add("success");
    }

    if(type === "error"){
        toast.classList.add("error");
    }

    toastTimer = setTimeout(() => {

        toast.classList.remove("show");

    }, 3200);
}


/* =========================================================
   GATE
========================================================= */

function showGate(title, text, buttons = []){

    gateTitle.textContent = title;

    gateText.textContent = text;

    gateButtons.innerHTML = "";

    buttons.forEach(button => {

        const btn =
            document.createElement("button");

        btn.type = "button";

        btn.className =
            "gate-btn" +
            (button.secondary
                ? " secondary"
                : "");

        btn.textContent = button.label;

        btn.addEventListener(
            "click",
            button.action
        );

        gateButtons.appendChild(btn);

    });

    gate.classList.add("show");
}


function hideGate(){

    gate.classList.remove("show");

}


/* =========================================================
   PAYMENT NAVIGATION
========================================================= */

function openSubscription(amount, reason){

    const params =
        new URLSearchParams();

    params.set(
        "userId",
        targetUserId || ""
    );

    params.set(
        "amount",
        String(amount)
    );

    params.set(
        "reason",
        reason || "chat"
    );

    window.location.href =
        `./subscription.html?${params.toString()}`;
}


/* =========================================================
   QUERY PARAMETER
========================================================= */

function getTargetUserId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("userId") ||
        params.get("user") ||
        ""
    ).trim();

}


/* =========================================================
   DEMO DATA
========================================================= */

const demoProfiles = {

    "demo-01":{
        name:"Amara",
        photo:"https://randomuser.me/api/portraits/women/44.jpg",
        online:true
    },

    "demo-02":{
        name:"Aisha",
        photo:"https://randomuser.me/api/portraits/women/65.jpg",
        online:false
    },

    "demo-03":{
        name:"Nia",
        photo:"https://randomuser.me/api/portraits/women/68.jpg",
        online:true
    },

    "demo-04":{
        name:"Zuri",
        photo:"https://randomuser.me/api/portraits/women/79.jpg",
        online:false
    },

    "demo-05":{
        name:"Imani",
        photo:"https://randomuser.me/api/portraits/women/49.jpg",
        online:true
    },

    "demo-06":{
        name:"Wanjiku",
        photo:"https://randomuser.me/api/portraits/women/32.jpg",
        online:false
    },

    "demo-07":{
        name:"Neema",
        photo:"https://randomuser.me/api/portraits/women/43.jpg",
        online:true
    },

    "demo-08":{
        name:"Makena",
        photo:"https://randomuser.me/api/portraits/women/24.jpg",
        online:false
    },

    "demo-09":{
        name:"Akinyi",
        photo:"https://randomuser.me/api/portraits/women/12.jpg",
        online:true
    },

    "demo-10":{
        name:"Winnie",
        photo:"https://randomuser.me/api/portraits/women/71.jpg",
        online:false
    }

};


/* =========================================================
   DEMO CHAT
========================================================= */

function isDemoUser(){

    return String(targetUserId || "")
        .startsWith("demo-");

}


/* =========================================================
   LOAD TARGET PROFILE
========================================================= */

async function loadTargetProfile(){

    if(!targetUserId){

        personName.textContent =
            "No profile selected";

        personStatus.textContent =
            "Return to Discover and choose someone.";

        hideGate();

        return false;
    }


    if(isDemoUser()){

        const demo =
            demoProfiles[targetUserId];

        if(demo){

            targetProfile = demo;

            personName.textContent =
                demo.name;

            setAvatar(demo.photo);

            setStatus(
                demo.online,
                demo.online
                    ? "Online"
                    : "Offline"
            );

        }else{

            targetProfile = {
                name:"Kmeet Member"
            };

            personName.textContent =
                "Kmeet Member";

            setStatus(
                false,
                "Offline"
            );

        }

        return true;
    }


    try{

        const userRef =
            doc(
                db,
                "users",
                targetUserId
            );

        const snap =
            await getDoc(userRef);

        if(snap.exists()){

            targetProfile =
                snap.data();

            const name =
                targetProfile.displayName ||
                targetProfile.name ||
                "Kmeet Member";

            personName.textContent =
                name;

            setAvatar(
                targetProfile.photoURL ||
                targetProfile.photo ||
                targetProfile.profilePhoto ||
                ""
            );

            setStatus(
                false,
                "Offline"
            );

            startPresenceListener();

            return true;
        }


        personName.textContent =
            "Kmeet Member";

        setStatus(
            false,
            "Profile unavailable"
        );

        return true;

    }catch(error){

        console.error(
            "TARGET PROFILE ERROR:",
            error
        );

        personName.textContent =
            "Kmeet Member";

        setStatus(
            false,
            "Offline"
        );

        return true;
    }
}


/* =========================================================
   AVATAR
========================================================= */

function setAvatar(url){

    chatAvatar.innerHTML = "";

    if(!url){

        const icon =
            document.createElement("i");

        icon.className =
            "fa-solid fa-user";

        chatAvatar.appendChild(icon);

        return;
    }


    const img =
        document.createElement("img");

    img.src = url;

    img.alt =
        targetProfile?.displayName ||
        targetProfile?.name ||
        "Profile";

    img.onerror = () => {

        img.remove();

        const icon =
            document.createElement("i");

        icon.className =
            "fa-solid fa-user";

        chatAvatar.appendChild(icon);
    };

    chatAvatar.appendChild(img);
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(online, text){

    statusDot.classList.toggle(
        "online",
        Boolean(online)
    );

    personStatus.textContent =
        text ||
        (online ? "Online" : "Offline");
}


/* =========================================================
   REALTIME PRESENCE
========================================================= */

function startPresenceListener(){

    if(
        !targetUserId ||
        isDemoUser()
    ){
        return;
    }

    try{

        const presenceRef =
            databaseRef(
                database,
                `status/${targetUserId}`
            );

        unsubscribePresence =
            databaseOnValue(
                presenceRef,
                snapshot => {

                    const data =
                        snapshot.val();

                    if(
                        data &&
                        data.state === "online"
                    ){

                        setStatus(
                            true,
                            "Online"
                        );

                    }else{

                        setStatus(
                            false,
                            "Offline"
                        );
                    }
                },
                error => {

                    console.warn(
                        "PRESENCE ERROR:",
                        error
                    );

                    setStatus(
                        false,
                        "Offline"
                    );
                }
            );

    }catch(error){

        console.warn(
            "Presence listener failed:",
            error
        );
    }
}


/* =========================================================
   CONVERSATION IDS
========================================================= */

/*
    OLD KMEET ID:
    uidA_uidB

    NEW SAFE ID:
    kmeet_v2_uidA_uidB

    Sorting guarantees both accounts produce
    exactly the same ID.
*/

function getSortedPair(){

    if(
        !currentUser ||
        !targetUserId
    ){
        return null;
    }

    return [
        String(currentUser.uid),
        String(targetUserId)
    ].sort();

}


function getOldConversationId(){

    const pair =
        getSortedPair();

    if(!pair){
        return null;
    }

    return pair.join("_");
}


function getNewConversationId(){

    const pair =
        getSortedPair();

    if(!pair){
        return null;
    }

    return "kmeet_v2_" +
        pair.join("_");
}


/* =========================================================
   VALID CONVERSATION CHECK
========================================================= */

function isValidConversation(data){

    if(!data){
        return false;
    }

    const initiator =
        data.initiatorId;

    const receiver =
        data.receiverId;


    if(
        typeof initiator !== "string" ||
        typeof receiver !== "string"
    ){
        return false;
    }


    if(
        !initiator ||
        !receiver
    ){
        return false;
    }


    /*
       A conversation cannot have the
       same person as both participants.
    */

    if(
        initiator === receiver
    ){
        return false;
    }


    /*
       It must contain BOTH people.
    */

    const isOurPair =
        (
            initiator === currentUser.uid &&
            receiver === targetUserId
        ) ||
        (
            initiator === targetUserId &&
            receiver === currentUser.uid
        );

    return isOurPair;
}


/* =========================================================
   FIND EXISTING CONVERSATION
========================================================= */

async function findExistingConversation(){

    if(
        !currentUser ||
        !targetUserId ||
        isDemoUser()
    ){

    }


    const oldId =
        getOldConversationId();

    const newId =
        getNewConversationId();


    console.log(
        "SEARCHING OLD CHAT ID:",
        oldId
    );

    console.log(
        "SEARCHING NEW CHAT ID:",
        newId
    );


    /*
       1. Check the old conversation first.
    */

    if(oldId){

        try{

            const oldRef =
                doc(
                    db,
                    "conversations",
                    oldId
                );

            const oldSnap =
                await getDoc(oldRef);

            if(oldSnap.exists()){

                const data =
                    oldSnap.data();

                console.log(
                    "OLD CONVERSATION FOUND:",
                    data
                );


                if(
                    isValidConversation(data)
                ){

                    console.log(
                        "USING VALID OLD CHAT:",
                        oldId
                    );

                    return {
                        id:oldId,
                        data:data
                    };
                }


                console.warn(
                    "OLD CONVERSATION IS INVALID AND WILL BE IGNORED:",
                    data
                );
            }

        }catch(error){

            console.warn(
                "OLD CONVERSATION LOOKUP ERROR:",
                error
            );
        }
    }


    /*
       2. Check the new v2 conversation.
    */

    if(newId){

        try{

            const newRef =
                doc(
                    db,
                    "conversations",
                    newId
                );

            const newSnap =
                await getDoc(newRef);

            if(newSnap.exists()){

                const data =
                    newSnap.data();

                console.log(
                    "V2 CONVERSATION FOUND:",
                    data
                );


                if(
                    isValidConversation(data)
                ){

                    console.log(
                        "USING VALID V2 CHAT:",
                        newId
                    );

                    return {
                        id:newId,
                        data:data
                    };
                }


                console.warn(
                    "V2 CONVERSATION IS INVALID:",
                    data
                );
            }

        }catch(error){

            console.warn(
                "V2 CONVERSATION LOOKUP ERROR:",
                error
            );
        }
    }


    return null;
}


/* =========================================================
   CREATE CONVERSATION
========================================================= */

async function ensureConversation(){

    if(
        !currentUser ||
        !targetUserId
    ){
        throw new Error(
            "Chat participants are missing."
        );
    }


    if(isDemoUser()){

        return null;
    }


    /*
       ALWAYS search first.

       This prevents Account A from creating
       a second conversation when Account B
       already has one.
    */

    const existing =
        await findExistingConversation();


    if(existing){

        conversationId =
            existing.id;

        currentConversationData =
            existing.data;

        console.log(
            "USING EXISTING CHAT:",
            conversationId
        );

        return conversationId;
    }


    /*
       No valid conversation exists.

       Both accounts will use this exact same
       deterministic ID.
    */

    const newId =
        getNewConversationId();

    if(!newId){

        throw new Error(
            "Unable to create a conversation ID."
        );
    }


    const conversationRef =
        doc(
            db,
            "conversations",
            newId
        );


    /*
       Check once more immediately before create.
       This prevents duplicate creation when
       two clients act almost simultaneously.
    */

    const currentSnap =
        await getDoc(conversationRef);


    if(currentSnap.exists()){

        const existingData =
            currentSnap.data();

        if(
            isValidConversation(existingData)
        ){

            conversationId =
                newId;

            currentConversationData =
                existingData;

            return newId;
        }


        throw new Error(
            "A corrupted conversation already uses the required chat ID."
        );
    }


    const conversationData = {

        initiatorId:
            currentUser.uid,

        receiverId:
            targetUserId,

        createdAt:
            serverTimestamp(),

        updatedAt:
            serverTimestamp(),

        senderCredits:0,

        receiverFreeReplies:
            FREE_RECEIVER_REPLIES,

        receiverPaid:false

    };


    await setDoc(
        conversationRef,
        conversationData
    );


    conversationId =
        newId;

    currentConversationData =
        conversationData;


    console.log(
        "NEW CHAT CREATED:",
        conversationId
    );


    return newId;
}


/* =========================================================
   PREPARE REAL CHAT
========================================================= */

async function prepareRealChat(){

    if(
        !currentUser ||
        !targetUserId ||
        isDemoUser()
    ){
        return;
    }


    const existing =
        await findExistingConversation();


    if(existing){

        conversationId =
            existing.id;

        currentConversationData =
            existing.data;

        console.log(
            "PREPARED EXISTING CHAT:",
            conversationId
        );

        startFirestoreListener();

        return;
    }


    /*
       Important:
       Do NOT create the conversation simply
       because the user opened the chat.

       It will be created when the first actual
       message is sent.
    */

    conversationId =
        getNewConversationId();

    currentConversationData =
        null;


    console.log(
        "NO EXISTING CHAT. FUTURE CHAT ID:",
        conversationId
    );
}


/* =========================================================
   DATE HELPERS
========================================================= */

function getMillis(value){

    if(!value){
        return 0;
    }


    if(
        typeof value.toMillis === "function"
    ){
        return value.toMillis();
    }


    if(
        value instanceof Date
    ){
        return value.getTime();
    }


    if(
        typeof value === "number"
    ){
        return value;
    }


    if(
        typeof value === "string"
    ){

        const time =
            new Date(value).getTime();

        return Number.isNaN(time)
            ? 0
            : time;
    }


    return 0;
}


function formatTime(value){

    const millis =
        getMillis(value);

    if(!millis){
        return "";
    }

    try{

        return new Date(millis)
            .toLocaleTimeString(
                [],
                {
                    hour:"numeric",
                    minute:"2-digit"
                }
            );

    }catch(error){

        return "";
    }
}


/* =========================================================
   MESSAGE LISTENER
========================================================= */

function startFirestoreListener(){

    if(
        !currentUser ||
        !targetUserId ||
        !conversationId
    ){
        return;
    }


    if(
        unsubscribeMessages
    ){
        unsubscribeMessages();
        unsubscribeMessages = null;
    }


    console.log(
        "STARTING REAL MESSAGE LISTENER:",
        conversationId
    );


    const conversationRef =
        doc(
            db,
            "conversations",
            conversationId
        );


    /*
       We deliberately do NOT use:
           orderBy("createdAt")

       This makes the listener more tolerant
       of older messages and pending server
       timestamps.

       Messages are sorted in JavaScript instead.
    */

    const messagesRef =
        collection(
            conversationRef,
            "messages"
        );


    const messagesQuery =
        query(messagesRef);


    unsubscribeMessages =
        onSnapshot(
            messagesQuery,

            snapshot => {

                console.log(
                    "MESSAGES RECEIVED:",
                    snapshot.size
                );


                const messages =
                    snapshot.docs.map(
                        messageDoc => ({

                            id:
                                messageDoc.id,

                            ...messageDoc.data()

                        })
                    );


                /*
                   Sort by server createdAt where
                   available, otherwise use
                   clientCreatedAt.
                */

                messages.sort(
                    (a,b) => {

                        const aTime =
                            getMillis(
                                a.createdAt
                            ) ||
                            Number(
                                a.clientCreatedAt || 0
                            );

                        const bTime =
                            getMillis(
                                b.createdAt
                            ) ||
                            Number(
                                b.clientCreatedAt || 0
                            );

                        return aTime - bTime;
                    }
                );


                renderMessages(
                    messages
                );


                messagesLoaded = true;

            },

            error => {

                console.error(
                    "MESSAGE LISTENER ERROR:",
                    error
                );


                messagesLoaded = false;


                showMessageError(
                    "Unable to load this conversation."
                );
            }
        );
}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages){

    messagesEl.innerHTML = "";


    if(!messages.length){

        const empty =
            document.createElement("div");

        empty.className =
            "empty-state";

        empty.innerHTML = `
            <i class="fa-regular fa-comments"></i>
            <p>
                No messages yet.<br>
                Start the conversation when you're ready.
            </p>
        `;

        messagesEl.appendChild(
            empty
        );

        return;
    }


    messages.forEach(message => {

        const senderId =
            String(
                message.senderId || ""
            );

        const mine =
            currentUser &&
            senderId === currentUser.uid;


        const row =
            document.createElement("div");

        row.className =
            "message-row " +
            (mine
                ? "mine"
                : "theirs");


        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";


        /*
           textContent is intentional.
           It prevents HTML injection.
        */

        const text =
            document.createElement("div");

        text.textContent =
            message.text || "";


        const time =
            document.createElement("span");

        time.className =
            "message-time";

        time.textContent =
            formatTime(
                message.createdAt
            ) ||
            formatTime(
                message.clientCreatedAt
            );


        bubble.appendChild(text);

        if(time.textContent){
            bubble.appendChild(time);
        }


        row.appendChild(bubble);

        messagesEl.appendChild(row);

    });


    requestAnimationFrame(() => {

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    });
}

function showMessageError(text){

/* =========================================================
   CONTACT INFORMATION DETECTION
========================================================= */

function containsContactInfo(text){

    const value =
        String(text || "")
            .toLowerCase()
            .trim();


    /*
       Phone numbers
    */

    const phonePattern =
        /(?:\+?254|0)\s*\d[\d\s-]{7,}/;

    if(
        phonePattern.test(value)
    ){
        return true;
    }


    /*
       Email addresses
    */

    const emailPattern =
        /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i;

    if(
        emailPattern.test(value)
    ){
        return true;
    }


    /*
       Common social/contact handles.
    */

    const socialPattern =
        /(?:whatsapp|telegram|instagram|facebook|snapchat|tiktok)\s*[:@]?\s*[a-z0-9_.-]+/i;

    if(
        socialPattern.test(value)
    ){
        return true;
    }


    return false;
}


/* =========================================================
   GET CONVERSATION PARTICIPANT DATA
========================================================= */

function getConversationRole(){

    if(
        !currentUser ||
        !currentConversationData
    ){
        return null;
    }


    const initiator =
        currentConversationData.initiatorId;

    const receiver =
        currentConversationData.receiverId;


    if(
        currentUser.uid === initiator
    ){
        return "sender";
    }


    if(
        currentUser.uid === receiver
    ){
        return "receiver";
    }


    return null;
}

/* =========================================================
   CHECK SEND PERMISSION
========================================================= */

async function checkSendPermission(text){

    const clean =
        String(text || "")
            .trim();


    if(!clean){

        return {
            allowed:false
        };
    }


    /*
       DEMO PROFILE

       Demo chats are intentionally local-only.
    */

    if(isDemoUser()){

        return {
            allowed:true,
            demo:true
        };
    }


    /*
       Anonymous users cannot use the free
       opening-message loophole.
    */

    if(
        !currentUser ||
        currentUser.isAnonymous
    ){

        return {
            allowed:false,
            reason:"anonymous"
        };
    }


    /*
       Contact information is not allowed
       before unlocking.
    */

    if(
        containsContactInfo(clean)
    ){

        return {
            allowed:false,
            reason:"contact"
        };
    }


    /*
       If no conversation exists yet, this
       is the first opening message.
    */

    if(!currentConversationData){

        const normalized =
            clean
                .toLowerCase()
                .replace(/\s+/g," ")
                .trim();


        if(
            FREE_OPENING_MESSAGES.includes(
                normalized
            )
        ){

            return {
                allowed:true,
                freeOpening:true
            };
        }


        return {
            allowed:false,
            reason:"sender"
        };
    }


    const role =
        getConversationRole();


    /*
       If this user is the receiver,
       allow only the first three replies
       before the KSh 11 gate.
    */

    if(role === "receiver"){

        const used =
            Number(
                currentConversationData.receiverRepliesUsed || 0
            );

        const paid =
            Boolean(
                currentConversationData.receiverPaid
            );


        if(!paid){

            if(
                used >= FREE_RECEIVER_REPLIES
            ){

                return {
                    allowed:false,
                    reason:"receiver"
                };
            }

            return {
                allowed:true,
                receiverFree:true
            };
        }


        return {
            allowed:true
        };
    }


    /*
       Sender after conversation exists.

       If senderCredits > 0, use one.
       Otherwise require payment.

       The first free opening message is
       handled above before the conversation
       exists.
    */

    if(role === "sender"){

        const credits =
            Number(
                currentConversationData.senderCredits || 0
            );


        if(credits > 0){

            return {
                allowed:true,
                senderCredit:true
            };
        }


        /*
           If the sender has already used the
           free opening message and has no
           paid credits, payment is required.
        */

        return {
            allowed:false,
            reason:"sender"
        };
    }


    /*
       Fallback
    */

    return {
        allowed:false,
        reason:"sender"
    };
}

    }catch(error){

/* =========================================================
   SEND REAL MESSAGE
========================================================= */

async function sendRealMessage(text){

    if(
        !currentUser ||
        !targetUserId
    ){

        throw new Error(
            "You must be logged in to send a message."
        );
    }


    /*
       Find or create the SAME conversation
       for both users.
    */

    if(!conversationId){

        await ensureConversation();

    }else{

        /*
           Verify the selected conversation is
           still valid before writing.
        */

        const conversationRef =
            doc(
                db,
                "conversations",
                conversationId
            );

        const snap =
            await getDoc(
                conversationRef
            );


        if(
            !snap.exists() ||
            !isValidConversation(
                snap.data()
            )
        ){

            conversationId = null;

            currentConversationData = null;

            await ensureConversation();

        }else{

            currentConversationData =
                snap.data();
        }
    }


    if(!conversationId){

        throw new Error(
            "Conversation could not be prepared."
        );
    }


    console.log(
        "SENDING MESSAGE TO CHAT:",
        conversationId
    );


    const messagesRef =
        collection(
            db,
            "conversations",
            conversationId,
            "messages"
        );


    /*
       clientCreatedAt provides an immediate
       local ordering value while
       serverTimestamp is being resolved.
    */

    const clientCreatedAt =
        Date.now();


    /*
       THIS is the actual Firestore send.

       Only this operation determines whether
       the message was successfully sent.
    */

    const messageDoc =
        await addDoc(
            messagesRef,
            {

                senderId:
                    currentUser.uid,

                receiverId:
                    targetUserId,

                text:text,

                createdAt:
                    serverTimestamp(),

                clientCreatedAt:
                    clientCreatedAt

            }
        );


    console.log(
        "MESSAGE WRITTEN SUCCESSFULLY:",
        messageDoc.id
    );


    /*
       Update conversation metadata separately.

       If this optional metadata update fails,
       the actual message has STILL been sent.
    */

    try{

        const conversationRef =
            doc(
                db,
                "conversations",
                conversationId
            );


        const role =
            getConversationRole();


        const updateData = {

            updatedAt:
                serverTimestamp()

        };


        if(role === "receiver"){

            const oldUsed =
                Number(
                    currentConversationData?.receiverRepliesUsed || 0
                );


            /*
               Only increment free replies if
               the receiver was actually using
               their free allowance.
            */

            if(
                !currentConversationData?.receiverPaid &&
                oldUsed < FREE_RECEIVER_REPLIES
            ){

                updateData.receiverRepliesUsed =
                    oldUsed + 1;
            }
        }


        if(role === "sender"){

            const oldCredits =
                Number(
                    currentConversationData?.senderCredits || 0
                );


            if(oldCredits > 0){

                updateData.senderCredits =
                    Math.max(
                        0,
                        oldCredits - 1
                    );
            }
        }


        await setDoc(
            conversationRef,
            updateData,
            {
                merge:true
            }
        );


        currentConversationData = {

            ...(currentConversationData || {}),

            ...updateData

        };


    }catch(metadataError){

        console.warn(
            "MESSAGE SENT BUT CONVERSATION METADATA UPDATE FAILED:",
            metadataError
        );

        /*
           DO NOT throw here.

           The message already exists in Firestore.
        */
    }


    /*
       Clear the input ONLY after the actual
       message write succeeded.
    */

    messageInput.value = "";

    /*
       This function now EXISTS and cannot
       produce the old ReferenceError.
    */

    hideGate();

    showToast(
        "Message sent.",
        "success"
    );
}


/* =========================================================
   SEND BUTTON
========================================================= */

async function handleSend(){

    if(sending){
        return;
    }


    const text =
        messageInput.value
            .trim();


    if(!text){

        messageInput.focus();

        return;
    }


    sending = true;

    sendBtn.disabled = true;


    try{

        /*
           Check the gate BEFORE modifying
           Firestore.
        */

        const permission =
            await checkSendPermission(
                text
            );


        if(!permission.allowed){

            showPaymentGate(
                permission.reason
            );

            return;
        }


        /*
           Demo chat
        */

        if(permission.demo){

            await sendDemoMessage(
                text
            );

            return;
        }


        /*
           Real Firebase chat
        */

        await sendRealMessage(
            text
        );


    }catch(error){

        console.error(
            "COMPLETE SEND ERROR:",
            error
        );


        /*
           IMPORTANT:

           This catch now only handles errors
           from the actual sending process.

           hideGate() and input clearing are
           outside the Firestore failure point.
        */

        showToast(
            "Message could not be sent. Please try again.",
            "error"
        );

    }finally{

        sending = false;

        sendBtn.disabled = false;
    }
}


/* =========================================================
   INPUT EVENTS
========================================================= */

sendBtn.addEventListener(
    "click",
    handleSend
);


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            handleSend();
        }
    }
);


/* =========================================================
   INITIALISE CHAT
========================================================= */

async function initialiseChat(){

    targetUserId =
        getTargetUserId();


    if(!targetUserId){

        personName.textContent =
            "Choose a Kmeet member";

        personStatus.textContent =
            "Return to Discover to start a chat.";

        setStatus(
            false,
            "No profile selected"
        );

        loadingMessages.style.display =
            "none";

        messagesEl.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-user-group"></i>
                <p>
                    Open a profile from Discover
                    to start a conversation.
                </p>
            </div>
        `;

        return;
    }


    /*
       Load target profile first.
    */

    await loadTargetProfile();


    /*
       Demo chats use localStorage.
    */

    if(isDemoUser()){

        loadingMessages.style.display =
            "none";

        renderDemoMessages();

        return;
    }


    /*
       Real users need authentication.
    */

    if(
        !currentUser
    ){

        loadingMessages.style.display =
            "none";

        messagesEl.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-lock"></i>
                <p>
                    Log in to view and send
                    messages in this conversation.
                </p>
            </div>
        `;

        showPaymentGate(
            "anonymous"
        );

        return;
    }


    /*
       Anonymous visitors may browse but
       cannot use the free chat.
    */

    if(
        currentUser.isAnonymous
    ){

        loadingMessages.style.display =
            "none";

        messagesEl.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-lock"></i>
                <p>
                    Chat is available to registered
                    Kmeet members.
                </p>
            </div>
        `;

        showPaymentGate(
            "anonymous"
        );

        return;
    }


    /*
       Prepare the existing conversation.

       If none exists, no empty conversation
       document is created yet.
    */

    await prepareRealChat();


    /*
       If prepareRealChat() did not find an
       existing conversation, show normal
       empty state.
    */

    if(
        !conversationId ||
        !currentConversationData
    ){

        loadingMessages.style.display =
            "none";

        messagesEl.innerHTML = `
            <div class="empty-state">
                <i class="fa-regular fa-comments"></i>
                <p>
                    No messages yet.<br>
                    Start the conversation with a simple
                    <strong>hi</strong> or <strong>hey</strong>.
                </p>
            </div>
        `;

    }else{

        loadingMessages.style.display =
            "none";
    }
}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        currentUser =
            user;


        console.log(
            "CURRENT USER:",
            user
                ? {
                    uid:user.uid,
                    anonymous:user.isAnonymous
                }
                : null
        );


        /*
           If auth changes after page startup,
           initialise once the user is known.
        */

        if(
            user &&
            !targetUserId
        ){

            targetUserId =
                getTargetUserId();
        }


        try{

            await initialiseChat();

        }catch(error){

            console.error(
                "CHAT INITIALISATION ERROR:",
                error
            );

            loadingMessages.style.display =
                "none";

            showMessageError(
                "The chat could not be loaded. Please refresh and try again."
            );
        }
    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(
            unsubscribeMessages
        ){
            unsubscribeMessages();
        }

        if(
            unsubscribePresence
        ){
            unsubscribePresence();
        }
    }
);

</script>
