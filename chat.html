<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/jpeg" href="./kmeet-logo.jfif.jfif">
<link rel="shortcut icon" type="image/jpeg" href="./kmeet-logo.jfif.jfif">

<title>Kmeet — Chat</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;

  background:
    linear-gradient(
      rgba(10,5,10,.45),
      rgba(10,5,10,.70)
    ),
    url("chat.jpg");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;

  background:
    radial-gradient(
      circle at 18% 18%,
      rgba(255,190,210,.10),
      transparent 34%
    ),
    radial-gradient(
      circle at 82% 78%,
      rgba(255,90,150,.10),
      transparent 36%
    );
}

.page{
  min-height:100vh;
  position:relative;
  z-index:1;

  display:flex;
  flex-direction:column;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  width:100%;

  padding:14px 22px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(15,8,15,.38);

  border-bottom:
    1px solid
    rgba(255,255,255,.14);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.brand-link{
  display:flex;
  align-items:center;
  gap:9px;

  color:#fff;
  text-decoration:none;
}

.brand-logo{
  width:38px;
  height:38px;

  border-radius:50%;

  object-fit:cover;

  border:
    1px solid
    rgba(255,255,255,.24);

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.25);
}

.brand{
  font-size:24px;
  font-weight:700;
  letter-spacing:.5px;
}

.brand span{
  color:#ff9ab9;
}

.back-btn{
  color:#fff;
  text-decoration:none;

  padding:9px 15px;

  border-radius:999px;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid
    rgba(255,255,255,.18);

  transition:.2s ease;
}

.back-btn:hover{
  background:
    rgba(255,255,255,.20);
}


/* =====================================================
   CHAT CONTAINER
===================================================== */

.chat-shell{
  width:min(
    900px,
    calc(100% - 28px)
  );

  height:calc(100vh - 105px);

  min-height:560px;

  margin:18px auto;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:
    rgba(25,12,23,.46);

  border:
    1px solid
    rgba(255,255,255,.20);

  border-radius:26px;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.42);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header{
  padding:16px 20px;

  display:flex;
  align-items:center;

  gap:13px;

  background:
    rgba(10,5,10,.28);

  border-bottom:
    1px solid
    rgba(255,255,255,.13);
}

.avatar,
.avatar-fallback{
  width:48px;
  height:48px;

  border-radius:50%;

  flex:0 0 auto;
}

.avatar{
  object-fit:cover;

  background:
    rgba(255,255,255,.14);

  border:
    2px solid
    rgba(255,255,255,.30);
}

.avatar-fallback{
  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #ff9ab9,
      #b85d82
    );

  font-weight:700;
  font-size:19px;

  border:
    2px solid
    rgba(255,255,255,.30);
}

.person-name{
  font-size:18px;
  font-weight:700;
}

.status{
  margin-top:3px;

  font-size:13px;

  color:
    rgba(255,255,255,.72);
}


/* =====================================================
   INFO BAR
===================================================== */

.info-bar{
  padding:8px 14px;

  text-align:center;

  color:
    rgba(255,255,255,.70);

  font-size:11px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
  flex:1;

  overflow-y:auto;

  padding:22px;

  display:flex;
  flex-direction:column;

  gap:10px;

  scroll-behavior:smooth;
}

.message{
  max-width:
    min(72%,600px);

  padding:11px 14px;

  border-radius:18px;

  line-height:1.45;

  word-wrap:break-word;

  white-space:pre-wrap;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.12);
}

.message.mine{
  align-self:flex-end;

  background:
    linear-gradient(
      135deg,
      rgba(225,94,137,.94),
      rgba(164,64,105,.94)
    );

  border-bottom-right-radius:5px;
}

.message.theirs{
  align-self:flex-start;

  background:
    rgba(255,255,255,.15);

  border:
    1px solid
    rgba(255,255,255,.13);

  border-bottom-left-radius:5px;
}


/* =====================================================
   SENT STATUS
===================================================== */

.message-status{
  margin-top:5px;

  font-size:10px;

  text-align:right;

  color:
    rgba(255,255,255,.72);

  letter-spacing:.1px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  margin:auto;

  text-align:center;

  color:
    rgba(255,255,255,.72);

  max-width:360px;

  line-height:1.6;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer{
  padding:14px;

  display:flex;

  gap:10px;

  background:
    rgba(8,4,8,.35);

  border-top:
    1px solid
    rgba(255,255,255,.13);
}

.composer textarea{
  flex:1;

  resize:none;

  min-height:48px;
  max-height:130px;

  padding:13px 15px;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius:17px;

  outline:none;

  color:#fff;

  background:
    rgba(255,255,255,.10);

  font:inherit;
}

.composer textarea:focus{
  border-color:
    rgba(255,154,185,.60);

  background:
    rgba(255,255,255,.13);
}

.composer textarea::placeholder{
  color:
    rgba(255,255,255,.62);
}

.send-btn{
  padding:0 21px;

  min-width:78px;

  cursor:pointer;

  border:0;

  border-radius:17px;

  color:#fff;

  font-weight:700;

  background:
    linear-gradient(
      135deg,
      #e66a94,
      #a9426d
    );

  box-shadow:
    0 8px 22px
    rgba(150,47,88,.30);

  transition:.2s ease;
}

.send-btn:hover{
  transform:translateY(-1px);

  box-shadow:
    0 10px 25px
    rgba(150,47,88,.40);
}

.send-btn:disabled{
  opacity:.55;

  cursor:not-allowed;

  transform:none;
}


/* =====================================================
   PAYMENT GATE
===================================================== */

.gate{
  flex:1;

  display:grid;

  place-items:center;

  padding:35px;

  text-align:center;
}

.gate-card{
  width:min(
    560px,
    100%
  );

  padding:36px 30px;

  border-radius:24px;

  background:
    rgba(15,7,14,.58);

  border:
    1px solid
    rgba(255,255,255,.17);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.30);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.gate-icon{
  font-size:42px;

  margin-bottom:10px;
}

.gate-card h2{
  margin:0 0 10px;

  font-size:27px;
}

.gate-card p{
  margin:0 auto 22px;

  max-width:450px;

  color:
    rgba(255,255,255,.78);

  line-height:1.6;
}

.gate-buttons{
  display:flex;

  justify-content:center;

  flex-wrap:wrap;

  gap:10px;
}

.pay-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-width:145px;

  padding:13px 20px;

  border-radius:999px;

  text-decoration:none;

  color:#fff;

  font-weight:700;

  background:
    linear-gradient(
      135deg,
      #e66a94,
      #a9426d
    );

  border:0;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(150,47,88,.30);
}

.secondary-btn{
  background:
    rgba(255,255,255,.10);

  border:
    1px solid
    rgba(255,255,255,.18);
}


/* =====================================================
   ERROR
===================================================== */

.error{
  color:#ffd0d8;

  background:
    rgba(150,30,55,.30);

  border:
    1px solid
    rgba(255,150,170,.22);

  padding:12px 14px;

  border-radius:12px;

  margin:14px;

  display:none;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

  .topbar{
    padding:12px 15px;
  }

  .brand{
    font-size:21px;
  }

  .brand-logo{
    width:34px;
    height:34px;
  }

  .chat-shell{
    width:
      calc(100% - 12px);

    height:
      calc(100vh - 78px);

    min-height:0;

    margin:6px auto;

    border-radius:20px;
  }

  .messages{
    padding:15px;
  }

  .message{
    max-width:84%;
  }

  .composer{
    padding:10px;
  }

  .send-btn{
    min-width:64px;

    padding:0 14px;
  }

}
</style>
</head>


<body>

<div class="page">


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

  <a
    class="brand-link"
    href="index.html"

<!-- =====================================================

===================================================== -->

<main class="chat-shell">

  <div
    id="errorBox"
    class="error"
  ></div>


  <section
    id="chatArea"
    style="
      display:flex;
      height:100%;
      flex-direction:column;
    "
  >


    <!-- CHAT HEADER -->

    <div class="chat-header">

      <div
        id="avatarFallback"
        class="avatar-fallback"
      >
        K
      </div>


      <img
        id="avatar"
        class="avatar"

      >


      <div>

          Kmeet Member
        </div>


        <div
          id="personStatus"
          class="status"

        </div>

    </div>


    <!-- INFO -->

      class="info-bar"
    >
      Say hello and let the connection grow ❤️
    </div>


    <!-- MESSAGES -->

    <div
      id="messages"
      class="messages"
    >

      <div
        id="emptyState"
        class="empty"

    </div>

      id="composer"
      class="composer"
    >

      <button

  ================================================== -->

    id="gate"
    class="gate"
    style="display:none"
  >

    <div class="gate-card">

      <div
        id="gateIcon"
        class="gate-icon"
      >
        💗
      </div>


      <h2 id="gateTitle">
        Unlock your conversation
      </h2>


      <p id="gateText">
        Continue chatting with Kmeet credits.
      </p>


      <div
        id="gateButtons"
        class="gate-buttons"
      ></div>

    </div>

  </section>

</main>

</div>

function showError(message){ errorBox.textContent=message; errorBox.style.display="block"; }
function clearError(){ errorBox.textContent=""; errorBox.style.display="none"; }

function senderCreditKey(){ return `kmeet_sender_credits_${currentUser.uid}_${targetId}`; }
function receiverPaidKey(){ return `kmeet_receiver_paid_${currentUser.uid}_${targetId}`; }
function getSenderCredits(){ return parseInt(localStorage.getItem(senderCreditKey())||"0",10)||0; }
function setSenderCredits(value){ localStorage.setItem(senderCreditKey(),String(Math.max(0,value))); }
function receiverHasPaid(){ return localStorage.getItem(receiverPaidKey()) === "true"; }

function getConversationId(){
  return `kmeet_v2_${[currentUser.uid,targetId].sort().join("_")}`;
}

function getLegacyConversationId(){ return [currentUser.uid,targetId].sort().join("_"); }

function demoMessageKey(){ return `kmeet_demo_chat_${targetId}`; }
function getDemoMessages(){
  try { const x=JSON.parse(localStorage.getItem(demoMessageKey())||"[]"); return Array.isArray(x)?x:[]; }
  catch(e){ return []; }
}
function saveDemoMessages(items){ try{ localStorage.setItem(demoMessageKey(),JSON.stringify(items)); }catch(e){} }

function renderDemoMessages(items=demoMessages){
  messages.innerHTML="";
  if(!items.length){ messages.innerHTML='<div class="empty">Start the conversation and let the connection grow. ❤️</div>'; return; }
  items.forEach(data=>{
    const wrapper=document.createElement("div"); wrapper.className="message mine";
    const text=document.createElement("div"); text.textContent=data.text||""; wrapper.appendChild(text);
    const status=document.createElement("div"); status.className="message-status"; status.textContent="Sent ✓"; wrapper.appendChild(status);
    messages.appendChild(wrapper);
  });
  messages.scrollTop=messages.scrollHeight;
}

function containsContactInformation(text){
  const value=String(text).toLowerCase().trim();
  if(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i.test(value)) return true;
  if(/(?:\+?254[\s-]?(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3,4})|(?:0(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3})/i.test(value)) return true;
  if(/\b(whatsapp|whats\s*app|call me|text me|message me|contact me|my number|phone number|email me|dm me|instagram|telegram|facebook)\b/i.test(value)) return true;
  if(/(?:^|\s)@[a-z0-9_.]{3,}/i.test(value)) return true;
  return false;
}

async function loadTargetProfile(){
  if(!targetId) throw new Error("No Kmeet profile was selected.");
  targetIsDemo=Object.prototype.hasOwnProperty.call(demoProfiles,targetId);
  if(targetIsDemo){
    const demo=demoProfiles[targetId];
    personName.textContent=demo.name;
    personStatus.textContent="Kmeet connection";
    avatarFallback.textContent=demo.name.charAt(0).toUpperCase();
    avatar.src=demo.photo;
    avatar.style.display="block"; avatarFallback.style.display="none";
    demoMessages=getDemoMessages(); renderDemoMessages(demoMessages); return;
  }
  const snap=await getDoc(doc(db,"users",targetId));
  if(!snap.exists()) throw new Error("The selected Kmeet profile could not be found.");
  const data=snap.data()||{};
  const name=data.name||data.username||data.displayName||"Kmeet Member";
  personName.textContent=name; personStatus.textContent=data.online===true?"Online now":"Kmeet member";
  avatarFallback.textContent=name.charAt(0).toUpperCase();
  const photo=data.photoURL||data.photoUrl||data.avatar||data.profilePhoto||data.profileImage||data.image||"";
  if(photo){ avatar.src=photo; avatar.style.display="block"; avatarFallback.style.display="none"; }
}

function showChat(){ gate.style.display="none"; chatArea.style.display="flex"; }

function showGate(type){
  gate.style.display="grid"; chatArea.style.display="none"; gateButtons.innerHTML="";
  if(type==="anonymous"){
    gateIcon.textContent="🔒"; gateTitle.textContent="Start chatting";
    gateText.textContent="Choose a Kmeet chat package to start this conversation.";
    gateButtons.innerHTML=`<a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49&anonymous=true">3 Chats — KSh 49</a><a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100&anonymous=true">8 Chats — KSh 100</a><a class="pay-btn secondary-btn" href="discover.html">Back to Discover</a>`;
    return;
  }
  if(type==="sender"){
    gateIcon.textContent="💎"; gateTitle.textContent="Continue chatting";
    gateText.textContent="Your free opening message has been used, or this message requires a paid chat. Choose a Kmeet chat package to continue.";
    gateButtons.innerHTML=`<a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=3&amount=49">3 Chats — KSh 49</a><a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=sender&package=8&amount=100">8 Chats — KSh 100</a><a class="pay-btn secondary-btn" href="discover.html">Back to Discover</a>`;
    return;
  }
  gateIcon.textContent="💗"; gateTitle.textContent="Continue the conversation";
  gateText.textContent=`You have used your free replies or attempted to share contact information. Pay KSh ${RECEIVER_FEE} to continue.`;
  gateButtons.innerHTML=`<a class="pay-btn" href="payment.html?userId=${encodeURIComponent(targetId)}&role=receiver&amount=${RECEIVER_FEE}">Continue — KSh ${RECEIVER_FEE}</a><a class="pay-btn secondary-btn" href="discover.html">Back to Discover</a>`;
}

function renderMessages(items){
  messages.innerHTML="";
  if(!items.length){ messages.innerHTML='<div class="empty">Start the conversation and let the connection grow. ❤️</div>'; return; }
  items.forEach(data=>{
    const wrapper=document.createElement("div"); wrapper.className="message "+(data.senderId===currentUser.uid?"mine":"theirs");
    const text=document.createElement("div"); text.textContent=data.text||""; wrapper.appendChild(text); messages.appendChild(wrapper);
  });
  messages.scrollTop=messages.scrollHeight;
}

function updateInfoBar(){
  if(!currentUser) return;
  if(currentUser.isAnonymous){
    const c=getSenderCredits(); infoBar.textContent=c>0?`Anonymous chat: ${c} paid chat credit${c===1?"":"s"} available.`:"Anonymous chat: payment is required before your first message."; return;
  }
  if(!conversationData){ infoBar.textContent="Your opening message is free — say hi or hey ❤️"; return; }
  const isInitiator=conversationData.initiatorId===currentUser.uid;
  if(isInitiator){ infoBar.textContent=conversationData.senderFreeOpeningUsed?"Your free opening has been used. Further messages use chat credits.":"Your opening message is free — say hi or hey ❤️"; }
  else{
    const used=Number(conversationData.receiverRepliesUsed||currentMessages.filter(m=>m.senderId===currentUser.uid).length||0);
    infoBar.textContent=receiverHasPaid()?"Receiver continuation payment is active.":`You have ${Math.max(0,FREE_RECEIVER_REPLIES-used)} free replies remaining.`;
  }
}

async function findValidConversation(){
  conversationData=null;
  conversationId=getConversationId();
  let snap=await getDoc(doc(db,"conversations",conversationId));
  if(snap.exists()){
    const d=snap.data()||{};
    if(d.initiatorId && d.receiverId && d.initiatorId!==d.receiverId && (d.initiatorId===currentUser.uid||d.receiverId===currentUser.uid) && (d.initiatorId===targetId||d.receiverId===targetId)){
      conversationData=d; return true;
    }
  }
  const legacy=getLegacyConversationId();
  if(legacy!==conversationId){
    snap=await getDoc(doc(db,"conversations",legacy));
    if(snap.exists()){
      const d=snap.data()||{};
      if(d.initiatorId && d.receiverId && d.initiatorId!==d.receiverId && (d.initiatorId===currentUser.uid||d.receiverId===currentUser.uid) && (d.initiatorId===targetId||d.receiverId===targetId)){
        conversationId=legacy; conversationData=d; return true;
      }
    }
  }
  conversationId=getConversationId();
  conversationData=null;
  return false;
}

function startFirestoreListener(){
  if(!currentUser || currentUser.isAnonymous || targetIsDemo || !conversationId || !conversationData) return;
  if(unsubscribeMessages) unsubscribeMessages();
  currentMessages=[]; messagesLoaded=false;
  const ref=collection(db,"conversations",conversationId,"messages");
  const q=query(ref,orderBy("createdAt","asc"));
  unsubscribeMessages=onSnapshot(q,snapshot=>{
    currentMessages=snapshot.docs.map(d=>({id:d.id,...d.data()}));
    messagesLoaded=true; renderMessages(currentMessages); updateInfoBar();
  },error=>{
    console.error("Message listener error:",error);
    messagesLoaded=false;
    showError("Messages could not be loaded. Please check that the new firestore.rules file has been published.");
  });
}

async function prepareRealConversation(){
  if(currentUser.isAnonymous || targetIsDemo) return;
  try{
    await findValidConversation();
    showChat();
    renderMessages(currentMessages);
    updateInfoBar();
    if(conversationData) startFirestoreListener();
  }catch(error){
    console.error("Conversation preparation failed:",error);
    showError("Kmeet could not open this conversation. Please try again.");
  }
}

function waitForMessagesLoaded(timeout=2500){
  if(messagesLoaded) return Promise.resolve();
  return new Promise(resolve=>{
    const start=Date.now();
    const timer=setInterval(()=>{
      if(messagesLoaded || Date.now()-start>=timeout){ clearInterval(timer); resolve(); }
    },50);
  });
}

function senderAlreadySent(){ return currentMessages.some(m=>m.senderId===currentUser.uid); }
function receiverReplyCount(){ return currentMessages.filter(m=>m.senderId===currentUser.uid).length; }

async function initialiseAuth(){
  if(authStarted) return;
  authStarted=true;
  onAuthStateChanged(auth,async user=>{
    try{
      if(!user){ await signInAnonymously(auth); return; }
      currentUser=user; clearError();
      if(user.isAnonymous){ showChat(); updateInfoBar(); return; }
      await prepareRealConversation();
    }catch(error){
      console.error("Kmeet authentication error:",error);
      if(error.code==="auth/operation-not-allowed") showError("Anonymous Authentication is not enabled in Firebase. Enable Authentication → Sign-in method → Anonymous.");
      else showError(`Kmeet could not start the chat session (${error.code||"authentication error"}).`);
    }
  });
}

composer.addEventListener("submit",async event=>{
  event.preventDefault(); clearError();
  const text=messageInput.value.trim();
  if(!text) return;
  if(!currentUser){ showError("Kmeet is still preparing your chat session. Please try again in a moment."); return; }

  if(targetIsDemo){
    if(currentUser.isAnonymous && getSenderCredits()<=0){ showGate("anonymous"); return; }
    let before=0;
    if(currentUser.isAnonymous){ before=getSenderCredits(); setSenderCredits(before-1); }
    demoMessages=getDemoMessages(); demoMessages.push({text,createdAt:new Date().toISOString()}); saveDemoMessages(demoMessages); demoMessages=getDemoMessages(); renderDemoMessages(demoMessages); messageInput.value=""; updateInfoBar(); return;
  }

  if(currentUser.isAnonymous){ showGate("anonymous"); return; }

  sendBtn.disabled=true;
  let creditConsumed=false;
  let creditsBefore=0;

  try{
    if(!conversationData){
      await findValidConversation();
      if(conversationData) startFirestoreListener();
    }

    if(conversationData) await waitForMessagesLoaded();

    const hasConversation=!!conversationData;
    let isInitiator=hasConversation && conversationData.initiatorId===currentUser.uid;
    let isReceiver=hasConversation && conversationData.receiverId===currentUser.uid;

    if(!hasConversation){
      const opening=text.toLowerCase();
      if(!FREE_OPENING_MESSAGES.includes(opening)){ showGate("sender"); return; }
      if(containsContactInformation(text)){ showGate("sender"); return; }

      conversationId=getConversationId();
      const newConversation={
        initiatorId:currentUser.uid,
        receiverId:targetId,
        senderFreeOpeningUsed:true,
        receiverRepliesUsed:0,
        senderCreditsUsed:0,
        receiverPaid:false,
        createdAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      };
      await setDoc(doc(db,"conversations",conversationId),newConversation);
      conversationData={...newConversation};
      await addDoc(collection(db,"conversations",conversationId,"messages"),{
        senderId:currentUser.uid,receiverId:targetId,text,
        freeOpening:true,receiverFreeReply:false,createdAt:serverTimestamp()
      });
      messageInput.value="";
      startFirestoreListener();
      infoBar.textContent="Your free opening message has been sent ❤️";
      return;
    }

    if(conversationData.initiatorId===conversationData.receiverId){
      conversationData=null; conversationId=getConversationId(); currentMessages=[]; messagesLoaded=false;
      if(containsContactInformation(text) || text.toLowerCase()!==text.toLowerCase()){}
      const opening=text.toLowerCase();
      if(opening!=="hi" && opening!=="hey"){ showGate("sender"); return; }
    }

    isInitiator=conversationData.initiatorId===currentUser.uid;
    isReceiver=conversationData.receiverId===currentUser.uid;

    if(!isInitiator && !isReceiver){ showError("You are not a participant in this conversation."); return; }

    if(containsContactInformation(text)){
      showGate(isReceiver?"receiver":"sender"); return;
    }

    if(isInitiator){
      const freeStillAvailable=conversationData.senderFreeOpeningUsed!==true && !senderAlreadySent();
      if(freeStillAvailable){
        if(text.toLowerCase()!=="hi" && text.toLowerCase()!=="hey"){ showGate("sender"); return; }
      }else{
        creditsBefore=getSenderCredits();
        if(creditsBefore<=0){ showGate("sender"); return; }
        setSenderCredits(creditsBefore-1); creditConsumed=true;
      }
    }

    if(isReceiver){
      const used=Number(conversationData.receiverRepliesUsed||receiverReplyCount());
      if(used>=FREE_RECEIVER_REPLIES && !receiverHasPaid()){ showGate("receiver"); return; }
    }

    const messageData={
      senderId:currentUser.uid,
      receiverId:targetId,
      text,
      freeOpening:false,
      receiverFreeReply:isReceiver && Number(conversationData.receiverRepliesUsed||receiverReplyCount())<FREE_RECEIVER_REPLIES,
      createdAt:serverTimestamp()
    };

    await addDoc(collection(db,"conversations",conversationId,"messages"),messageData);

    const patch={updatedAt:serverTimestamp()};
    if(isInitiator){
      if(conversationData.senderFreeOpeningUsed!==true && !senderAlreadySent()) patch.senderFreeOpeningUsed=true;
      if(creditConsumed) patch.senderCreditsUsed=Number(conversationData.senderCreditsUsed||0)+1;
    }
    if(isReceiver){
      const used=Number(conversationData.receiverRepliesUsed||receiverReplyCount());
      if(used<FREE_RECEIVER_REPLIES && !receiverHasPaid()) patch.receiverRepliesUsed=used+1;
    }
    await setDoc(doc(db,"conversations",conversationId),patch,{merge:true});
    conversationData={...conversationData,...patch};
    messageInput.value="";
    updateInfoBar();

  }catch(error){
    console.error("Message send failed:",error);
    if(creditConsumed) setSenderCredits(creditsBefore);
    showError(`Your message could not be sent (${error.code||"firestore error"}). Please confirm the new firestore.rules file is deployed.`);
  }finally{ sendBtn.disabled=false; }
});

messageInput.addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){ event.preventDefault(); composer.requestSubmit(); }
});

async function start(){
  if(!targetId){ showError("No profile was selected for this chat."); sendBtn.disabled=true; return; }
  try{ await loadTargetProfile(); showChat(); initialiseAuth(); }
  catch(error){ console.error(error); showError(error.message||"Unable to load the selected profile."); }
}

start();
window.addEventListener("beforeunload",()=>{ if(unsubscribeMessages) unsubscribeMessages(); });

</script>
