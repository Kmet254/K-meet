*{

}

html,
body{

}

  min-height:100vh;

  background-position:center;

  pointer-events:none;
  z-index:0;

  background:
    radial-gradient(
      circle at 18% 18%,
      rgba(255,190,210,.10),
      transparent 34%
    ),
    radial-gradient(
      circle at 82% 78%,
      rgba(255,90,150,.10),
      transparent 36%
    );
}

.page{
  min-height:100vh;
  position:relative;
  z-index:1;

  display:flex;
  flex-direction:column;
}


/* =====================================================
   TOP BAR
===================================================== */

  width:100%;

  padding:14px 22px;

  align-items:center;
  justify-content:space-between;

  background:rgba(15,8,15,.38);

  -webkit-backdrop-filter:blur(12px);
}

.brand-link{
  display:flex;
  align-items:center;
  gap:9px;

  color:#fff;
  text-decoration:none;
}

.brand-logo{
  width:38px;
  height:38px;

  border-radius:50%;

  object-fit:cover;

  border:

    rgba(255,255,255,.24);

  box-shadow:

.brand{

  font-weight:700;
  letter-spacing:.5px;
}

.brand span{

}

.back-btn{

  border-radius:999px;

  background:

  border:
    1px solid
    rgba(255,255,255,.18);

  transition:.2s ease;
}

.back-btn:hover{
  background:

}


/* =====================================================
   CHAT CONTAINER
===================================================== */

.chat-shell{

}

===================================================== */

  background:

===================================================== */

function senderCreditKey(){

function receiverPaidKey(){

  return (
    "kmeet_receiver_paid_" +

  );

function getSenderCredits(){

  return (
    parseInt(

      ) || "0",
      10
    ) || 0
  );

}


function setSenderCredits(value){

  localStorage.setItem(
    senderCreditKey(),
    String(
      Math.max(

        value

    )
  );

/* =====================================================
   DEMO STORAGE
===================================================== */

function demoMessageKey(){

  return (
    "kmeet_demo_chat_" +
    targetId
  );

}


function getDemoMessages(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          demoMessageKey()
        ) || "[]"
      );

    return Array.isArray(saved)
      ? saved
      : [];

  }catch(error){

    return [];

  }

}


function saveDemoMessages(items){

  try{

    localStorage.setItem(
      demoMessageKey(),
      JSON.stringify(items)
    );

  }catch(error){

    console.warn(
      "Demo messages could not be saved:",
      error
    );

  }

}


/* =====================================================
   DEMO RENDER
===================================================== */

function renderDemoMessages(
  items = demoMessages
){

  messages.innerHTML = "";

  if(!items.length){

    messages.innerHTML = `

      <div class="empty">
        Start the conversation
        and let the connection grow. ❤️
      </div>

    `;

    return;

  }


  items.forEach(data => {

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "message mine";


    const text =
      document.createElement(
        "div"
      );

    text.textContent =
      data.text || "";


    const status =
      document.createElement(
        "div"
      );

    status.className =
      "message-status";

    status.textContent =
      "Sent ✓";


    wrapper.appendChild(
      text
    );

    wrapper.appendChild(
      status
    );


    messages.appendChild(
      wrapper
    );

  });


  messages.scrollTop =
    messages.scrollHeight;

}


/* =====================================================
   CONTACT DETECTION
===================================================== */

function containsContactInformation(text){

  const value =
    String(text)
      .toLowerCase()
      .trim();


  if(
    /[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i
      .test(value)
  ){

    return true;

  }


  if(
    /(?:\+?254[\s-]?(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3,4})|(?:0(?:7\d|1\d)[\s-]?\d{3}[\s-]?\d{3})/i
      .test(value)
  ){

    return true;

  }


  if(
    /\b(whatsapp|whats\s*app|call me|text me|message me|contact me|my number|phone number|email me|dm me|instagram|telegram|facebook)\b/i
      .test(value)
  ){

    return true;

  }


  if(
    /(?:^|\s)@[a-z0-9_.]{3,}/i
      .test(value)
  ){

    return true;

  }


  return false;

}


/* =====================================================
   LOAD TARGET PROFILE
===================================================== */

async function loadTargetProfile(){

  if(!targetId){

    throw new Error(
      "No Kmeet profile was selected."
    );

  }


  targetIsDemo =
    Object.prototype.hasOwnProperty.call(
      demoProfiles,
      targetId
    );


  if(targetIsDemo){

    const demo =
      demoProfiles[targetId];


    personName.textContent =
      demo.name;


    personStatus.textContent =
      "Kmeet connection";


    avatarFallback.textContent =
      demo.name
        .charAt(0)
        .toUpperCase();


    avatar.src =
      demo.photo;


    avatar.style.display =
      "block";


    avatarFallback.style.display =
      "none";


    demoMessages =
      getDemoMessages();


    renderDemoMessages(
      demoMessages
    );


    return;

  }


  const snap =
    await getDoc(
      doc(
        db,
        "users",
        targetId
      )
    );


  if(!snap.exists()){

    throw new Error(
      "The selected Kmeet profile could not be found."
    );

  }


  const data =
    snap.data() || {};


  const name =
    data.name ||
    data.username ||
    data.displayName ||
    "Kmeet Member";


  personName.textContent =
    name;


  avatarFallback.textContent =
    name
      .charAt(0)
      .toUpperCase();


  const photo =
    data.photoURL ||
    data.photoUrl ||
    data.avatar ||
    data.profilePhoto ||
    data.profileImage ||
    data.image ||
    "";


  if(photo){

    avatar.src =
      photo;

    avatar.style.display =
      "block";

    avatarFallback.style.display =
      "none";

  }

}

/* =====================================================
   GET CONVERSATION DATA
===================================================== */

async function getConversationData(){

  if(!conversationId){

    conversationId =
      getConversationId();

  }


  const conversationSnap =
    await getDoc(
      doc(
        db,
        "conversations",
        conversationId
      )
    );


  let parentData = null;


  if(conversationSnap.exists()){

    parentData =
      conversationSnap.data();

    conversationInitiatorId =
      parentData.initiatorId || null;

  }


  let existingMessages = [];


  try{

    const messageSnap =
      await getDocs(

        query(

          collection(
            db,
            "conversations",
            conversationId,
            "messages"
          ),

          orderBy(
            "createdAt",
            "asc"
          )

        )

      );


    existingMessages =
      messageSnap.docs.map(
        item => item.data()
      );

  }catch(error){

    /*
      A brand-new conversation has no parent/messages yet.
      We allow the sender to create it.
    */

    if(
      !parentData &&
      existingMessages.length === 0
    ){

      existingMessages = [];

    }else{

      throw error;

    }

  }


  /*
    If the parent does not have initiatorId,
    use the first actual message.

    This is only a fallback for older conversations.
  */

  if(
    !conversationInitiatorId &&
    existingMessages.length > 0
  ){

    conversationInitiatorId =
      existingMessages[0].senderId;

  }


  return {

    parentData,

    existingMessages

  };

}


/* =====================================================
   RECEIVER COUNT
===================================================== */

function countReceiverReplies(
  existingMessages
){

  if(!currentUser){

    return 0;

  }


  return existingMessages.filter(
    message =>
      message.senderId ===
      currentUser.uid
  ).length;

}


/* =====================================================
   UPDATE RECEIVER COUNTER
===================================================== */

function updateReceiverCounter(
  existingMessages
){

  if(!currentUser){

    return;

  }


  /*
    Only the person who did NOT start
    the conversation is the receiver.
  */

  const initiatorId =
    conversationInitiatorId;


  if(!initiatorId){

    return;

  }


  const isReceiver =
    currentUser.uid !==
    initiatorId;


  if(!isReceiver){

    return;

  }


  const used =
    countReceiverReplies(
      existingMessages
    );


  const remaining =
    Math.max(
      0,
      FREE_RECEIVER_REPLIES -
      used
    );


  if(
    receiverHasPaid()
  ){

    infoBar.textContent =
      "You have paid to continue this conversation ❤️";

    return;

  }


  if(remaining > 0){

    infoBar.textContent =
      `You have ${remaining} free repl${
        remaining === 1
          ? "y"
          : "ies"
      } remaining.`;

  }else{

    infoBar.textContent =
      "Your 3 free replies have been used. Pay KSh 11 to continue.";

  }

}


/* =====================================================
   EXISTING MESSAGES
===================================================== */

async function getExistingMessages(){

  const data =
    await getConversationData();


  return data.existingMessages;

}


/* =====================================================
   RENDER REAL MESSAGES
===================================================== */

function renderMessages(items){

  messages.innerHTML =
    "";


  if(!items.length){

    messages.innerHTML = `

      <div class="empty">
        Start the conversation
        and let the connection grow. ❤️
      </div>

    `;

    return;

  }


  items.forEach(data => {

    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.className =
      "message " +
      (
        data.senderId ===
        currentUser.uid
          ? "mine"
          : "theirs"
      );


    const text =
      document.createElement(
        "div"
      );


    text.textContent =
      data.text || "";


    wrapper.appendChild(
      text
    );


    messages.appendChild(
      wrapper
    );

  });


  messages.scrollTop =
    messages.scrollHeight;

}


/* =====================================================
   REAL-TIME MESSAGE LISTENER
===================================================== */

function startMessages(){

  if(
    !currentUser ||
    currentUser.isAnonymous ||
    targetIsDemo
  ){

    return;

  }


  conversationId =
    getConversationId();


  const ref =
    collection(
      db,
      "conversations",
      conversationId,
      "messages"
    );


  const q =
    query(
      ref,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      q,

      snapshot => {

        const items =
          snapshot.docs.map(
            item =>
              item.data()
          );


        /*
          Keep the conversation role based
          on the actual first message.
        */

        if(
          !conversationInitiatorId &&
          items.length
        ){

          conversationInitiatorId =
            items[0].senderId;

        }


        renderMessages(
          items
        );


        if(!items.length){

          infoBar.textContent =
            "Your opening message is free — say hi or hey ❤️";

          return;

        }


        updateReceiverCounter(
          items
        );


        /*
          If current user is the original
          sender, show sender information.
        */

        if(
          conversationInitiatorId ===
          currentUser.uid
        ){

          infoBar.textContent =
            "Your opening message is free. Further messages use chat credits.";

        }

      },

      error => {

        console.error(
          "Message listener error:",
          error
        );


        showError(
          "The chat interface is open, but messages could not be loaded. Please check your Firebase Firestore rules."
        );

      }

    );

}


/* =====================================================
   AUTHENTICATION
===================================================== */

async function initialiseAuth(){

  if(authStarted){

    return;

  }


  authStarted =
    true;


  onAuthStateChanged(

    auth,

    async user => {

      try{

        if(!user){

          await signInAnonymously(
            auth
          );

          return;

        }


        currentUser =
          user;


        conversationId =
          getConversationId();


        clearError();


        /* =============================================
           ANONYMOUS
        ============================================= */

        if(user.isAnonymous){

          const credits =
            getSenderCredits();


          if(credits > 0){

            infoBar.textContent =
              `Anonymous chat: ${credits} paid chat credit${
                credits === 1
                  ? ""
                  : "s"
              } available.`;

            showChat();

          }else{

            showGate(
              "anonymous"
            );

          }


          if(targetIsDemo){

            demoMessages =
              getDemoMessages();

          }


          return;

        }


        /* =============================================
           REGISTERED USER
        ============================================= */

        showChat();


        if(targetIsDemo){

          demoMessages =
            getDemoMessages();

          return;

        }


        /*
          Load the conversation parent now.

          This establishes exactly who the
          original sender is.
        */

        try{

          const data =
            await getConversationData();


          if(
            data.parentData &&
            data.parentData.initiatorId
          ){

            conversationInitiatorId =
              data.parentData.initiatorId;

          }


          if(
            data.existingMessages.length
          ){

            if(
              !conversationInitiatorId
            ){

              conversationInitiatorId =
                data.existingMessages[0].senderId;

            }


            renderMessages(
              data.existingMessages
            );


            updateReceiverCounter(
              data.existingMessages
            );

          }

        }catch(error){

          /*
            New conversation:
            there is nothing to load yet.
          */

          console.log(
            "No existing conversation yet."
          );

          infoBar.textContent =
            "Your opening message is free — say hi or hey ❤️";

        }


        startMessages();

      }

      catch(error){

        console.error(
          "Kmeet authentication error:",
          error
        );


        if(
          error.code ===
          "auth/operation-not-allowed"
        ){

          showError(
            "Anonymous Authentication is not enabled in Firebase. Enable Authentication → Sign-in method → Anonymous."
          );

        }else{

          showError(
            "Kmeet could not start the chat session (" +
            (
              error.code ||
              "authentication error"
            ) +
            "). Please check your Firebase Authentication settings."
          );

        }

      }

    }

  );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

composer.addEventListener(

  "submit",

  async event => {

    event.preventDefault();


    clearError();


    const text =
      messageInput.value.trim();


    if(!text){

      return;

    }


    if(!currentUser){

      showError(
        "Kmeet is still preparing your chat session. Please try again in a moment."
      );

      return;

    }


    /* ================================================
       DEMO PROFILE
    ================================================ */

    if(targetIsDemo){

      if(
        currentUser.isAnonymous &&
        getSenderCredits() <= 0
      ){

        showGate(
          "anonymous"
        );

        return;

      }


      let creditsBefore =
        0;

      let anonymousCreditUsed =
        false;


      if(
        currentUser.isAnonymous
      ){

        creditsBefore =
          getSenderCredits();


        if(
          creditsBefore <= 0
        ){

          showGate(
            "anonymous"
          );

          return;

        }


        setSenderCredits(
          creditsBefore - 1
        );


        anonymousCreditUsed =
          true;

      }


      demoMessages =
        getDemoMessages();


      demoMessages.push({

        text:text,

        createdAt:
          new Date().toISOString()

      });


      saveDemoMessages(
        demoMessages
      );


      demoMessages =
        getDemoMessages();


      renderDemoMessages(
        demoMessages
      );


      messageInput.value =
        "";

      messageInput.focus();


      if(
        currentUser.isAnonymous
      ){

        const remaining =
          getSenderCredits();


        infoBar.textContent =
          `Your message has been sent ❤️ ${
            remaining > 0
              ? `• ${remaining} chat credit${
                  remaining === 1
                    ? ""
                    : "s"
                } remaining`
              : ""
          }`;

      }else{

        infoBar.textContent =
          "Your message has been sent ❤️";

      }


      return;

    }


    /* ================================================
       REAL MEMBER CHAT
    ================================================ */

    if(
      currentUser.isAnonymous
    ){

      if(
        getSenderCredits() <= 0
      ){

        showGate(
          "anonymous"
        );

        return;

      }

    }


    if(!conversationId){

      conversationId =
        getConversationId();

    }


    let conversationData;


    try{

      conversationData =
        await getConversationData();

    }catch(error){

      console.error(
        "Conversation read failed:",
        error
      );


      showError(
        "Kmeet could not check this conversation. Please check your Firestore rules and try again."
      );

      return;

    }


    const existingMessages =
      conversationData.existingMessages;


    /*
      Establish the original sender.
    */

    if(
      conversationData.parentData &&
      conversationData.parentData.initiatorId
    ){

      conversationInitiatorId =
        conversationData.parentData.initiatorId;

    }


    if(
      !conversationInitiatorId &&
      existingMessages.length
    ){

      conversationInitiatorId =
        existingMessages[0].senderId;

    }


    /* ================================================
       BRAND NEW CONVERSATION
    ================================================ */

    if(
      existingMessages.length === 0 &&
      !conversationInitiatorId
    ){

      /*
        Whoever sends the first message
        becomes the initiator.
      */

      conversationInitiatorId =
        currentUser.uid;

    }


    const isOriginalSender =
      conversationInitiatorId ===
      currentUser.uid;


    const isReceiver =
      !isOriginalSender;


    /* ================================================
       FIRST OPENING MESSAGE
    ================================================ */

    if(
      isOriginalSender &&
      existingMessages.length === 0 &&
      !currentUser.isAnonymous
    ){

      const opening =
        text.toLowerCase();


      if(
        !FREE_OPENING_MESSAGES.includes(
          opening
        )
      ){

        showGate(
          "sender"
        );

        return;

      }

    }


    /* ================================================
       CONTACT INFORMATION
    ================================================ */

    if(
      containsContactInformation(
        text
      )
    ){

      /*
        Receiver contact information:
        BLOCK and require KSh 11.
      */

      if(isReceiver){

        showGate(
          "receiver"
        );

        return;

      }


      /*
        Sender contact information:
        preserve sender payment gate.
      */

      showGate(
        "sender"
      );

      return;

    }


    /* ================================================
       RECEIVER FREE REPLIES
       THIS CHECK MUST HAPPEN BEFORE
       ANY SENDER CREDIT CHECK.
    ================================================ */

    if(isReceiver){

      const receiverReplies =
        countReceiverReplies(
          existingMessages
        );


      const remaining =
        Math.max(
          0,
          FREE_RECEIVER_REPLIES -
          receiverReplies
        );


      /*
        If the receiver has already
        sent 3 replies and has NOT paid,
        stop here.
      */

      if(
        remaining <= 0 &&
        !receiverHasPaid()
      ){

        showGate(
          "receiver"
        );

        return;

      }

    }


    /* ================================================
       SENDER CREDIT
    ================================================ */

    let creditConsumed =
      false;

    let creditsBefore =
      0;


    /*
      Only the ORIGINAL SENDER consumes
      sender chat credits.

      The receiver NEVER enters this
      block.
    */

    if(
      isOriginalSender &&
      existingMessages.length > 0
    ){

      creditsBefore =
        getSenderCredits();


      if(
        creditsBefore <= 0
      ){

        showGate(
          "sender"
        );

        return;

      }


      setSenderCredits(
        creditsBefore - 1
      );


      creditConsumed =
        true;

    }


    /* ================================================
       DISABLE SEND
    ================================================ */

    sendBtn.disabled =
      true;


    try{

      await setDoc(

        doc(
          db,
          "conversations",
          conversationId
        ),

        {

          initiatorId:
            conversationInitiatorId,

          receiverId:
            conversationInitiatorId === currentUser.uid
              ? targetId
              : currentUser.uid,

          updatedAt:
            serverTimestamp(),

          createdAt:
            conversationData.parentData?.createdAt ||
            serverTimestamp()

        },

        {
          merge:true
        }

      );


      await addDoc(

        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),

        {

          senderId:
            currentUser.uid,

          receiverId:
            isOriginalSender
              ? targetId
              : conversationInitiatorId,

          text:text,

          createdAt:
            serverTimestamp()

        }

      );


      messageInput.value =
        "";

      messageInput.focus();


      /*
        Immediately calculate the new
        receiver count.

        This means:
        3 -> 2
        2 -> 1
        1 -> 0
      */

      if(isReceiver){

        const newReplyCount =
          countReceiverReplies(
            existingMessages
          ) + 1;


        const newRemaining =
          Math.max(
            0,
            FREE_RECEIVER_REPLIES -
            newReplyCount
          );


        if(
          receiverHasPaid()
        ){

          infoBar.textContent =
            "You have paid to continue this conversation ❤️";

        }else if(
          newRemaining > 0
        ){

          infoBar.textContent =
            `You have ${newRemaining} free repl${
              newRemaining === 1
                ? "y"
                : "ies"
            } remaining.`;

        }else{

          infoBar.textContent =
            "You have used your 3 free replies. Pay KSh 11 to continue.";

        }

      }else{

        const remaining =
          getSenderCredits();


        if(
          currentUser.isAnonymous
        ){

          infoBar.textContent =
            `Anonymous chat: ${remaining} paid chat credit${
              remaining === 1
                ? ""
                : "s"
            } remaining.`;

        }else{

          infoBar.textContent =
            "Message sent ❤️";

        }

      }

    }

    catch(error){

      console.error(
        "Message send failed:",
        error
      );


      /*
        Restore sender credit if
        Firebase failed.
      */

      if(creditConsumed){

        setSenderCredits(
          creditsBefore
        );

      }


      showError(
        "Your message could not be sent. Please check your Firestore rules."
      );

    }

    finally{

      sendBtn.disabled =
        false;

    }

  }

);


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(

  "keydown",

  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      composer.requestSubmit();

    }

  }

);


/* =====================================================
   START
===================================================== */

async function start(){

  if(!targetId){

    showError(
      "No profile was selected for this chat."
    );

    sendBtn.disabled =
      true;

    return;

  }


  try{

    await loadTargetProfile();

    initialiseAuth();

  }catch(error){

    console.error(
      error
    );


    showError(
      error.message ||
      "Unable to load the selected profile."
    );

  }

}


start();


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(

  "beforeunload",

  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

  }

);

</script>
