    .discover-nav {
      width: 100%;
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 11, 14, 0.78);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .discover-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;

      font-size: 1.7rem;
      font-weight: 700;
    }

    .discover-brand i {

    }

    .discover-links {

      align-items: center;
      gap: 24px;
    }

    .discover-links a {

      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: 0.25s ease;
    }

    .discover-links a:hover,
    .discover-links a.active {
      color: #ff6da8;
    }

    .discover-container {
      width: min(1400px, 92%);

    }

    .discover-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .discover-heading h1 {

    .discover-heading p {

      font-size: 0.84rem;

    }

    .activity-bar {
      width: 100%;

      justify-content: space-between;

      font-size: 0.85rem;
    }

    .activity-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4ade80;

    }

    .discover-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .profile-card {
      overflow: hidden;
      position: relative;
      border-radius: 20px;
      background: rgba(24, 20, 25, 0.82);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 16px 35px rgba(0,0,0,0.24);

      transition: transform 0.25s ease, box-shadow 0.25s ease;

    .profile-card:hover {

    .profile-photo-wrap {

    }

    .profile-photo {

      height: 100%;

    }

/* ============================================================
   REAL FIREBASE PROFILE
   ============================================================ */

function getRealProfile(id, data) {

  const name =
    data.displayName ||
    data.name ||
    data.username ||
    "";

  if (!String(name).trim()) {
    return null;
  }


  const photo =
    data.photoURL ||
    data.photoUrl ||
    data.avatar ||
    data.profilePhoto ||
    data.profileImage ||
    data.image ||
    "";


  const age =
    data.age ||
    data.userAge ||
    "";


  const location =
    data.location ||
    data.city ||
    data.town ||
    "Kenya";


  const description =
    data.bio ||
    data.description ||
    data.about ||
    "Looking to meet someone special on Kmeet.";


  let interests =
    data.interests ||
    [];


  if (!Array.isArray(interests)) {
    interests = [String(interests)];
  }


  const online =
    data.online === true ||
    data.isOnline === true;


  return {

    id,

    name: String(name).trim(),

    age,

    location,

    image: photo,

    description,

    interests: interests
      .filter(Boolean)
      .slice(0, 5),

    online

  };

}


/* ============================================================
   SAFE IMAGE FALLBACK
   ============================================================ */

function applyImageFallback(img, fallback) {

  let attemptedFallback = false;


  img.addEventListener(
    "error",
    () => {

      if (!attemptedFallback && fallback) {

        attemptedFallback = true;

        img.src = fallback;

      }

    }
  );

}


/* ============================================================
   RENDER PROFILE CARD
   ============================================================ */

function renderProfileCard(profile, index) {

  const card =
    document.createElement("article");

  card.className =
    "profile-card";


  const photo =
    profile.image ||
    backupImages[index % backupImages.length];


  const fallback =
    backupImages[index % backupImages.length];


  const safePhoto =
    photo || fallback;


  const interests =
    Array.isArray(profile.interests)
      ? profile.interests
      : [];


  const interestHTML =
    interests
      .slice(0, 4)
      .map(
        interest =>
          `<span class="interest-tag">
            ${escapeHTML(interest)}
          </span>`
      )
      .join("");


  const ageHTML =
    profile.age
      ? `<span class="profile-age">
          ${escapeHTML(profile.age)}
        </span>`
      : "";


  const onlineClass =
    profile.online
      ? ""
      : "offline";


  const onlineText =
    profile.online
      ? "Online"
      : "Offline";


  card.innerHTML = `

    <div class="profile-photo-wrap">

      <img
        class="profile-photo"
        src="${escapeAttribute(safePhoto)}"
        alt="${escapeAttribute(profile.name)}"
        loading="lazy"
      >

      <div class="online-badge ${onlineClass}">

        <span class="status-dot"></span>

        ${onlineText}

      </div>

    </div>


    <div class="profile-content">

      <div class="profile-name-row">

        <h2 class="profile-name">
          ${escapeHTML(profile.name)}
        </h2>

        ${ageHTML}

      </div>


      <p class="profile-location">

        <i class="fa-solid fa-location-dot"></i>

        ${escapeHTML(profile.location)}

      </p>


      <p class="profile-description">

        ${escapeHTML(profile.description)}

      </p>


      ${
        interestHTML
          ? `
            <div class="profile-interests">
              ${interestHTML}
            </div>
          `
          : ""
      }


      <div class="profile-actions">

        <a
          class="chat-btn"
          href="chat.html?userId=${encodeURIComponent(profile.id)}"
        >
          <i class="fa-solid fa-comment"></i>
          Chat
        </a>


        <button
          class="like-btn"
          type="button"
          title="Like ${escapeAttribute(profile.name)}"
          data-profile-id="${escapeAttribute(profile.id)}"
        >
          <i class="fa-regular fa-heart"></i>
        </button>

      </div>

    </div>

  `;


  const image =
    card.querySelector(".profile-photo");


  if (image) {

    applyImageFallback(
      image,
      fallback
    );

  }


  const likeButton =
    card.querySelector(".like-btn");


  if (likeButton) {

    likeButton.addEventListener(
      "click",
      () => {

        likeButton.classList.toggle("liked");


        const icon =
          likeButton.querySelector("i");


        if (icon) {

          icon.className =
            likeButton.classList.contains("liked")
              ? "fa-solid fa-heart"
              : "fa-regular fa-heart";

        }

      }
    );

  }


  return card;

}


/* ============================================================
   RENDER ALL PROFILES
   ============================================================ */

function renderProfiles(realProfiles = []) {

  grid.innerHTML = "";


  const combinedProfiles = [
    ...permanentProfiles,
    ...realProfiles
  ];


  if (!combinedProfiles.length) {

    grid.innerHTML = `

      <div class="empty-state">

        <i class="fa-solid fa-heart"></i>

        No profiles available yet.

      </div>

    `;

    return;

  }


  combinedProfiles.forEach(
    (profile, index) => {

      grid.appendChild(
        renderProfileCard(
          profile,
          index
        )
      );

    }
  );

}


/* ============================================================
   FIRESTORE PROFILES
   ============================================================ */

function listenToUsers() {

  onSnapshot(

    collection(db, "users"),

    snapshot => {

      const realProfiles = [];

      const seenIds = new Set();


      snapshot.forEach(
        userDoc => {

          const id =
            userDoc.id;


          /*
           * Never show the currently logged-in
           * user's own profile.
           */

          if (
            currentUser &&
            id === currentUser.uid
          ) {
            return;
          }


          /*
           * Prevent duplicate Firestore IDs.
           */

          if (seenIds.has(id)) {
            return;
          }


          const profile =
            getRealProfile(
              id,
              userDoc.data() || {}
            );


          /*
           * Ignore malformed/empty profiles.
           */

          if (!profile) {
            return;
          }


          seenIds.add(id);

          realProfiles.push(profile);

        }
      );


      /*
       * Final count:
       *
       * 36 permanent profiles
       * +
       * real Firestore profiles
       * -
       * current user's profile
       *
       * (current user is already excluded above)
       */

      const finalCount =
        BASE_MEMBER_COUNT +
        realProfiles.length;


      memberCount.textContent =
        `${finalCount} people to discover`;


      renderProfiles(
        realProfiles
      );

    },


    error => {

      console.error(
        "Kmeet Firestore error:",
        error
      );


      /*
       * Even if Firestore fails,
       * keep the 36 permanent profiles visible.
       */

      memberCount.textContent =
        `${BASE_MEMBER_COUNT} people to discover`;


      renderProfiles([]);

    }

  );

}


/* ============================================================
   AUTH
   ============================================================ */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user || null;


    listenToUsers();

  }
);


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}
