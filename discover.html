  /* =======================================================
     ESCAPE HTML
     ======================================================= */

  function escapeHtml(value) {

    return String(value ?? "").replace(
      /[&<>"']/g,
      function(character) {

        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return entities[character];

      }
    );

  }


  /* =======================================================
     CREATE PROFILE CARD
     ======================================================= */

  function createCard(person) {

    const statusText =
      person.online
        ? "Online"
        : "Offline";

    const statusClass =
      person.online
        ? "online"
        : "offline";

    const interests =
      Array.isArray(person.interests)
        ? person.interests
        : [];

    const tags =
      interests
        .slice(0, 4)
        .map(function(item) {

          return `
            <span class="tag">
              ${escapeHtml(item)}
            </span>
          `;

        })
        .join("");


    const isDemo =
      String(person.id).startsWith("demo-");


    let actions = "";


    if (isDemo) {

      actions = `
        <a
          class="profile-button chat-button demo-button"
          href="login.html"
        >
          💬 Chat
        </a>

        <a
          class="profile-button view-button demo-button"
          href="login.html"
        >
          👤 View Profile
        </a>
      `;

    } else {

      actions = `
        <a
          class="profile-button chat-button"
          href="chat.html?userId=${encodeURIComponent(person.id)}"
        >
          💬 Chat
        </a>

        <a
          class="profile-button view-button"
          href="profile.html?id=${encodeURIComponent(person.id)}"
        >
          👤 View Profile
        </a>
      `;

    }


    return `

      <article
        class="profile-card"
        data-profile-id="${escapeHtml(person.id)}"
      >

        <div class="photo-wrap">

          <img
            src="${escapeHtml(person.photo)}"
            alt="${escapeHtml(person.name)}"
            loading="lazy"
          >

          <div class="status-badge">

            <span
              class="status-dot ${statusClass}"
            ></span>

            ${statusText}

          </div>

        </div>


        <div class="profile-inside">

          <div class="profile-name-row">

            <h3>
              ${escapeHtml(person.name)}, ${escapeHtml(person.age)}
            </h3>

          </div>


          <p class="profile-location">
            📍 ${escapeHtml(person.location)}
          </p>


          <p class="profile-description">
            ${escapeHtml(person.description)}
          </p>


          <div class="tags">
            ${tags}
          </div>


          <div class="profile-actions">
            ${actions}
          </div>

        </div>

      </article>

    `;

  }


  /* =======================================================

  /* =======================================================

  async function loadFirebaseMembers() {

    try {

      console.log(
        "KMEET: Loading Firebase members..."
      );


      const firebase =
        await import("./firebase-config.js");


      const auth =
        firebase.auth;

      const db =
        firebase.db;

      const onAuthStateChanged =
        firebase.onAuthStateChanged;

      const collection =
        firebase.collection;

      const onSnapshot =
        firebase.onSnapshot;


      /* -----------------------------------------------------
         UPDATE PROFILE LINK
         ----------------------------------------------------- */

      if (
        auth &&
        onAuthStateChanged &&
        profileLink
      ) {

        onAuthStateChanged(
          auth,
          function(user) {

            if (
              user &&
              !user.isAnonymous
            ) {

              profileLink.href =
                "profile.html";

            } else {

              profileLink.href =
                "login.html";

            }

          }
        );

      }


      /* -----------------------------------------------------
         CHECK FIREBASE FUNCTIONS
         ----------------------------------------------------- */

      if (
        !db ||
        !collection ||
        !onSnapshot
      ) {

        console.warn(
          "KMEET: Firebase functions unavailable. Keeping demo profiles."
        );

        return;

      }


      /* -----------------------------------------------------
         LISTEN FOR REAL MEMBERS
         ----------------------------------------------------- */

      onSnapshot(

        collection(
          db,
          "users"
        ),

        function(snapshot) {

          const realProfiles = [];


          snapshot.forEach(
            function(docSnap) {

              const data =
                docSnap.data() || {};


              const name =
                data.name ||
                data.username;


              if (!name) {
                return;
              }


              const photo =
                data.photoURL ||
                data.avatar ||
                data.photo ||
                data.profilePhoto;


              if (!photo) {
                return;
              }


              const interests =
                Array.isArray(data.interests)
                  ? data.interests
                  : [];


              realProfiles.push({

                id:
                  docSnap.id,

                name:
                  name,

                age:
                  data.age || "",

                location:
                  data.location ||
                  "Kenya",

                online:
                  data.online === true ||
                  data.status === "online",

                photo:
                  photo,

                description:
                  data.description ||
                  data.bio ||
                  "Kmeet member. Say hello and start a conversation.",

                interests:
                  interests

              });

            }
          );


          /* -------------------------------------------------
             REMOVE DUPLICATES
             ------------------------------------------------- */

          const used =
            new Set();


          const cleanReal =
            realProfiles.filter(
              function(person) {

                if (
                  used.has(person.id)
                ) {

                  return false;

                }

                used.add(person.id);

                return true;

              }
            );


          /* -------------------------------------------------
             REAL MEMBERS FIRST
             DEMO MEMBERS FILL THE REST
             ------------------------------------------------- */

          const remaining =
            Math.max(
              36 - cleanReal.length,
              0
            );


          const demos =
            demoProfiles.slice(
              0,
              remaining
            );


          const allProfiles =
            [
              ...cleanReal,
              ...demos
            ];


          grid.innerHTML =
            allProfiles
              .map(createCard)
              .join("");


          if (memberCount) {

            memberCount.textContent =
              `${allProfiles.length} people to discover`;

          }


          console.log(
            "KMEET: Real profiles:",
            cleanReal.length
          );

          console.log(
            "KMEET: Profiles displayed:",
            allProfiles.length
          );

        },


        function(error) {

          console.warn(
            "KMEET: Firebase profile loading failed.",
            error
          );

          /*

            IMPORTANT:

            Do NOT erase the demo profiles.

          */

          showDemoProfiles();

        }

      );


    } catch (error) {

      console.warn(
        "KMEET: Firebase could not be loaded.",
        error
      );

      /*

        Discover must still work without Firebase.

      */

      showDemoProfiles();

    }

  }


  /* =======================================================
     START FIREBASE AFTER DEMO PAGE IS ALREADY VISIBLE
     ======================================================= */

  loadFirebaseMembers();


}
