<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kmeet - Discover</title>

  <link rel="icon" type="image/jpeg" href="kmeet-logo.jfif.jfif">
  <link rel="stylesheet" href="styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    .discover-page {
      min-height: 100vh;
      background:
        linear-gradient(
          rgba(13, 11, 14, 0.72),
          rgba(13, 11, 14, 0.82)
        ),
        url("img/bg34.jpg") center center / cover fixed no-repeat;
      color: #fff;
      font-family: "Poppins", sans-serif;
    }

    .discover-nav {
      width: 100%;
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 11, 14, 0.78);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .discover-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-family: "Playfair Display", serif;
      font-size: 1.7rem;
      font-weight: 700;
    }

    .discover-brand i {
      color: #ff5f9e;
      font-size: 1.35rem;
    }

    .discover-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .discover-links a {
      color: rgba(255,255,255,0.88);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: 0.25s ease;
    }

    .discover-links a:hover,
    .discover-links a.active {
      color: #ff6da8;
    }

    .discover-container {
      width: min(1400px, 92%);
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    .discover-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .discover-heading h1 {
      margin: 0 0 8px;
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
    }

    .discover-heading p {
      margin: 0;
      color: rgba(255,255,255,0.72);
      font-size: 0.96rem;
    }

    .member-count {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 95, 158, 0.12);
      border: 1px solid rgba(255, 95, 158, 0.25);
      color: #ff83b4;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .activity-bar {
      width: 100%;
      margin: 0 auto 30px;
      padding: 13px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-radius: 16px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.09);
      backdrop-filter: blur(12px);
    }

    .activity-status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
    }

    .activity-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 12px rgba(74,222,128,0.7);
    }

    .likes-link {
      color: #ff76ad;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .likes-link:hover {
      color: #ff9bc4;
    }

    .discover-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .profile-card {
      overflow: hidden;
      position: relative;
      border-radius: 20px;
      background: rgba(24, 20, 25, 0.82);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 16px 35px rgba(0,0,0,0.24);
      backdrop-filter: blur(10px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 22px 42px rgba(0,0,0,0.32);
    }

    .profile-photo-wrap {
      height: 285px;
      position: relative;
      overflow: hidden;
      background: #201b21;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .online-badge {
      position: absolute;
      top: 13px;
      right: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(10,10,10,0.62);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .online-badge .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }

    .online-badge.offline .status-dot {
      background: #9ca3af;
      box-shadow: none;
    }

    .profile-content {
      padding: 17px 17px 18px;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .profile-name {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 1.22rem;
      font-weight: 600;
      color: #fff;
    }

    .profile-age {
      color: rgba(255,255,255,0.6);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .profile-location {
      margin: 6px 0 0;
      color: rgba(255,255,255,0.62);
      font-size: 0.78rem;
    }

    .profile-location i {
      color: #ff6da8;
      margin-right: 5px;
    }

    .profile-description {
      margin: 11px 0 0;
      min-height: 40px;
      color: rgba(255,255,255,0.72);
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .profile-interests {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .interest-tag {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,95,158,0.09);
      border: 1px solid rgba(255,95,158,0.18);
      color: #ff91bb;
      font-size: 0.67rem;
    }

    .profile-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 15px;
    }

    .chat-btn {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #e94f91, #ff6da8);
      font-family: "Poppins", sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: 0.25s ease;
    }

    .chat-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .like-btn {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.78);
      cursor: pointer;
      transition: 0.25s ease;
    }

    .like-btn:hover,
    .like-btn.liked {
      color: #ff6da8;
      border-color: rgba(255,109,168,0.35);
      background: rgba(255,109,168,0.1);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: rgba(255,255,255,0.65);
    }

    .empty-state i {
      display: block;
      margin-bottom: 15px;
      color: #ff6da8;
      font-size: 2.2rem;
    }

    @media (max-width: 1100px) {
      .discover-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 780px) {
      .discover-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .discover-nav {
        padding: 15px 4%;
      }

      .discover-links {
        gap: 14px;
      }

      .discover-links a {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 520px) {
      .discover-container {
        width: 94%;
        padding-top: 30px;
      }

      .discover-grid {
        grid-template-columns: 1fr;
      }

      .profile-photo-wrap {
        height: 330px;
      }

      .discover-brand {
        font-size: 1.45rem;
      }
    }
  </style>
</head>

<body>

<div class="discover-page">

  <header class="discover-nav">

    <a href="index.html" class="discover-brand">
      <i class="fa-solid fa-heart"></i>
      <span>Kmeet</span>
    </a>

    <nav class="discover-links">
      <a href="discover.html" class="active">Discover</a>
      <a href="profile.html">Profile</a>
      <a href="index.html">Home</a>
    </nav>

  </header>


  <main class="discover-container">

    <section class="discover-heading">

      <h1>Discover</h1>

      <p>
        Meet interesting people and find your connection.
      </p>

      <span class="member-count" id="memberCount">
        36 people to discover
      </span>

    </section>


    <div class="activity-bar">

      <div class="activity-status">
        <span class="activity-dot"></span>
        <span>People are joining Kmeet</span>
      </div>

      <a href="likes.html" class="likes-link">
        <i class="fa-solid fa-heart"></i>
        My Likes
      </a>

    </div>


    <section id="grid" class="discover-grid">

      <div class="empty-state">

        <i class="fa-solid fa-heart"></i>

        Loading people...

      </div>

    </section>

  </main>

</div>


<script type="module">

import {
  auth,
  db,
  app,
  onAuthStateChanged,
  collection,
  onSnapshot
} from "./firebase-config.js";

const memberCount = document.getElementById("memberCount");
const grid = document.getElementById("grid");

const BASE_MEMBER_COUNT = 36;

let currentUser = null;


/* ============================================================
   TEMPORARY KMEET FIREBASE DIAGNOSTIC
   ============================================================ */

const diagnostic = document.createElement("div");

diagnostic.style.cssText = `
  width:100%;
  max-width:900px;
  margin:20px auto 30px;
  padding:18px;
  box-sizing:border-box;
  border-radius:16px;
  background:rgba(10,10,10,.82);
  border:1px solid rgba(255,109,168,.35);
  color:#fff;
  font-family:Poppins,sans-serif;
  font-size:13px;
  line-height:1.7;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
`;

diagnostic.innerHTML = `
  <strong style="color:#ff83b4;font-size:16px;">
    Kmeet Firebase Diagnostic
  </strong>
  <div id="diagnosticContent" style="margin-top:10px;">
    Checking Firebase...
  </div>
`;


/*
 * Put diagnostic underneath the member count.
 */

const heading = document.querySelector(".discover-heading");

if (heading) {
  heading.appendChild(diagnostic);
}


const diagnosticContent =
  document.getElementById("diagnosticContent");


function showDiagnostic(html) {

  if (diagnosticContent) {
    diagnosticContent.innerHTML = html;
  }

}


/* ============================================================
   FIREBASE PROJECT
   ============================================================ */

let projectId = "Unknown";

try {

  projectId =
    app?.options?.projectId ||
    "Unknown";

} catch (error) {

  console.error(
    "Could not read Firebase project:",
    error
  );

}


/* ============================================================
   AUTH STATE
   ============================================================ */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user || null;


    console.log(
      "KMEET DIAGNOSTIC - CURRENT USER:",
      currentUser
    );


    listenToUsers();

  }
);


/* ============================================================
   FIRESTORE USERS
   ============================================================ */

function listenToUsers() {

  onSnapshot(

    collection(db, "users"),

    snapshot => {

      const documents = [];

      const validProfiles = [];


      snapshot.forEach(userDoc => {

        const data =
          userDoc.data() || {};


        const name =
          data.displayName ||
          data.name ||
          data.username ||
          "";


        const valid =
          String(name).trim().length > 0;


        documents.push({

          id: userDoc.id,

          name:
            String(name || "(no name)").trim(),

          valid,

          photo:
            data.photoURL ||
            data.photoUrl ||
            data.avatar ||
            data.profilePhoto ||
            data.profileImage ||
            data.image ||
            "(no photo)",

          online:
            data.online === true ||
            data.isOnline === true

        });


        if (valid) {

          validProfiles.push({

            id: userDoc.id,

            name:
              String(name).trim(),

            online:
              data.online === true ||
              data.isOnline === true

          });

        }

      });


      console.log(
        "KMEET DIAGNOSTIC - FIRESTORE SNAPSHOT SIZE:",
        snapshot.size
      );


      console.log(
        "KMEET DIAGNOSTIC - ALL FIRESTORE USERS:",
        documents
      );


      console.table(documents);


      /*
       * Exclude logged-in user.
       */

      const discoverable =
        validProfiles.filter(
          profile =>
            !currentUser ||
            String(profile.id) !==
            String(currentUser.uid)
        );


      console.log(
        "KMEET DIAGNOSTIC - VALID PROFILES:",
        validProfiles
      );


      console.log(
        "KMEET DIAGNOSTIC - DISCOVERABLE PROFILES:",
        discoverable
      );


      console.log(
        "KMEET DIAGNOSTIC - CURRENT UID:",
        currentUser?.uid || "GUEST"
      );


      /*
       * Expected final count.
       */

      const expectedCount =
        BASE_MEMBER_COUNT +
        discoverable.length;


      memberCount.textContent =
        `${expectedCount} people to discover`;


      /*
       * Diagnostic panel.
       */

      let userRows = "";


      documents.forEach(
        (user, index) => {

          userRows += `

            <div style="
              padding:7px 0;
              border-bottom:1px solid rgba(255,255,255,.08);
            ">

              <strong>${index + 1}.</strong>

              ${escapeHTML(user.name)}

              <span style="
                color:${user.valid ? "#4ade80" : "#f87171"};
                margin-left:8px;
              ">
                ${user.valid ? "VALID" : "INVALID"}
              </span>

              <span style="
                color:${user.online ? "#4ade80" : "#9ca3af"};
                margin-left:8px;
              ">
                ${user.online ? "ONLINE" : "OFFLINE"}
              </span>

              <br>

              <small style="
                color:rgba(255,255,255,.45);
                word-break:break-all;
              ">
                UID: ${escapeHTML(user.id)}
              </small>

            </div>

          `;

        }
      );


      showDiagnostic(`

        <div>
          <strong>Firebase project:</strong>
          ${escapeHTML(projectId)}
        </div>

        <div>
          <strong>Current login:</strong>
          ${currentUser ? "LOGGED IN" : "GUEST"}
        </div>

        <div style="word-break:break-all;">
          <strong>Current UID:</strong>
          ${escapeHTML(currentUser?.uid || "None")}
        </div>

        <div>
          <strong>Firestore users documents:</strong>
          ${snapshot.size}
        </div>

        <div>
          <strong>Valid profiles:</strong>
          ${validProfiles.length}
        </div>

        <div>
          <strong>Discoverable profiles:</strong>
          ${discoverable.length}
        </div>

        <div>
          <strong>Permanent profiles:</strong>
          ${BASE_MEMBER_COUNT}
        </div>

        <div style="
          margin-top:8px;
          padding:9px;
          border-radius:9px;
          background:rgba(255,109,168,.10);
          color:#ff9bc4;
        ">
          <strong>Expected Discover count:</strong>
          ${expectedCount}
        </div>

        <div style="
          margin-top:14px;
          color:rgba(255,255,255,.75);
        ">
          <strong>Firestore documents:</strong>
        </div>

        ${userRows}

      `);


      /*
       * We deliberately DO NOT render the normal cards
       * during this diagnostic.
       */

      grid.innerHTML = `

        <div class="empty-state">

          <i class="fa-solid fa-screwdriver-wrench"></i>

          <strong>Diagnostic mode active</strong>

          <p style="margin-top:8px;">
            The normal Discover cards are temporarily hidden.
            We are checking the Firebase connection first.
          </p>

        </div>

      `;

    },


    error => {

      console.error(
        "KMEET DIAGNOSTIC - FIRESTORE ERROR:",
        error
      );


      showDiagnostic(`

        <div style="color:#f87171;">

          <strong>Firestore error:</strong>

          <pre style="
            white-space:pre-wrap;
            margin-top:8px;
          ">${escapeHTML(
            error?.message ||
            String(error)
          )}</pre>

        </div>

      `);

    }

  );

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
