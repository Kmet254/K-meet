    body::before {
      content: "";

    }

      gap: 8px;

      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #49df9a;
      box-shadow: 0 0 10px rgba(73, 223, 154, 0.8);
    }

    /* GRID */

    .profiles-container {
      width: min(1450px, 92%);
      margin: 20px auto 70px;
    }

    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 24px;
    }

    /* PROFILE CARD */

    .profile-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      min-height: 435px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        transform 0.28s ease,
        box-shadow 0.28s ease,
        border-color 0.28s ease;
    }

    .profile-card:hover {
      transform: translateY(-7px);
      border-color: rgba(255, 91, 157, 0.34);
      box-shadow:
        0 25px 55px rgba(0, 0, 0, 0.4),
        0 0 28px rgba(255, 62, 142, 0.07);
    }

    .photo-wrap {
      position: relative;
      height: 285px;
      overflow: hidden;
      background: #181219;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .profile-card:hover .profile-photo {
      transform: scale(1.045);
    }

    .photo-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48%;
      background: linear-gradient(
        to top,
        rgba(8, 5, 10, 0.88),
        transparent
      );
      pointer-events: none;
    }

    .online-badge {
      position: absolute;
      top: 13px;
      left: 13px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      background: rgba(8, 8, 10, 0.68);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);

    /*
      READ A REAL FIREBASE PROFILE
    */

    function getRealProfile(snapshot) {

      const data = snapshot.data() || {};

      return {

        id: snapshot.id,

        name:
          data.name ||
          data.displayName ||
          data.username ||
          "Kmeet Member",

        age:
          data.age ||
          "",

        location:
          data.location ||
          data.city ||
          "Kenya",

        photo:
          data.photoURL ||
          data.photoUrl ||
          data.profilePhoto ||
          data.profileImage ||
          data.avatar ||
          data.photo ||
          "https://randomuser.me/api/portraits/lego/1.jpg",

        bio:
          data.bio ||
          data.description ||
          data.about ||
          "Looking for a genuine connection.",

        interests:
          Array.isArray(data.interests)
            ? data.interests
            : [],

        online:
          data.online === true ||
          data.status === "online"

      };

    }


    /*
      CREATE PROFILE CARD
    */

    function createCard(person, isReal) {

      const card = document.createElement("article");

      card.className = "profile-card";

      const storageKey = `kmeet-liked-${person.id}`;

      const liked =
        localStorage.getItem(storageKey) === "true";


      /*
        IMPORTANT:

        Real Firebase users get their own UID in the URL.

        Demo users do NOT pretend to have a Firebase UID.
      */

      const profileUrl =
        isReal
          ? `profile.html?id=${encodeURIComponent(person.id)}`
          : "login.html";

      const chatUrl =
        isReal
          ? `chat.html?userId=${encodeURIComponent(person.id)}`
          : "login.html";


      card.innerHTML = `

        <div class="photo-wrap">

          <img
            class="profile-photo"
            src="${escapeHtml(person.photo)}"
            alt="${escapeHtml(person.name)}"
            loading="lazy"
            onerror="this.onerror=null;this.src='https://randomuser.me/api/portraits/lego/1.jpg';"
          >

          <div class="online-badge ${person.online ? "" : "offline"}">

            <span class="dot"></span>

            <span>
              ${person.online ? "Online" : "Offline"}
            </span>

          </div>


          <button
            type="button"
            class="like-button ${liked ? "liked" : ""}"
            aria-label="Like ${escapeHtml(person.name)}"
            title="Like"
          >
            ${liked ? "♥" : "♡"}
          </button>

        </div>


        <div class="card-content">

          <div class="profile-name">
            ${escapeHtml(person.name)}
            ${person.age ? `, ${escapeHtml(person.age)}` : ""}
          </div>

          <div class="profile-location">
            ♥ ${escapeHtml(person.location)}
          </div>

          <div class="profile-bio">
            ${escapeHtml(person.bio)}
          </div>


          <div class="card-buttons">

            <a
              class="button view-button"
              href="${profileUrl}"
            >
              View Profile
            </a>

            <a
              class="button chat-button"
              href="${chatUrl}"
            >
              ♥ Chat
            </a>

          </div>

        </div>
      `;


      /*
        LIKE BUTTON
      */

      const likeButton =
        card.querySelector(".like-button");


      likeButton.addEventListener("click", async (event) => {

        event.preventDefault();
        event.stopPropagation();

        const nowLiked =
          localStorage.getItem(storageKey) !== "true";

        if (nowLiked) {

          localStorage.setItem(storageKey, "true");

          likeButton.classList.add("liked");

          likeButton.textContent = "♥";

        } else {

          localStorage.removeItem(storageKey);

          likeButton.classList.remove("liked");

          likeButton.textContent = "♡";

        }


        /*
          Save real member likes in Firebase
          when the visitor is logged in.
        */

        if (
          isReal &&
          currentUser &&
          !currentUser.isAnonymous
        ) {

          try {

            await setDoc(
              doc(
                db,
                "users",
                person.id,
                "likesReceived",
                currentUser.uid
              ),
              {
                fromUserId: currentUser.uid,
                liked: nowLiked,
                updatedAt: serverTimestamp()
              },
              {
                merge: true
              }
            );

          } catch (error) {

            console.warn(
              "Could not save like:",
              error
            );

          }

        }

      });


      return card;

    }


    /*
      ESCAPE HTML
    */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      RENDER EVERYTHING
    */

    function renderProfiles(realProfiles) {

      profilesGrid.innerHTML = "";


      /*
        Remove duplicate Firebase profiles.
      */

      const seenIds = new Set();

      const uniqueReal = [];


      for (const person of realProfiles) {

        if (!person.id) {
          continue;
        }

        if (seenIds.has(person.id)) {
          continue;
        }

        seenIds.add(person.id);

        uniqueReal.push(person);

      }


      /*
        We want at least 36 cards.

        Real profiles come first.

        Demo profiles fill the remaining spaces.
      */

      const requiredDemoCount =
        Math.max(
          36 - uniqueReal.length,
          0
        );


      const demo =
        demoProfiles.slice(
          0,
          requiredDemoCount
        );


      const allProfiles = [
        ...uniqueReal,
        ...demo
      ];


      /*
        Render real profiles first.
      */

      uniqueReal.forEach(person => {

        profilesGrid.appendChild(
          createCard(person, true)
        );

      });


      /*
        Render demo profiles.
      */

      demo.forEach(person => {

        profilesGrid.appendChild(
          createCard(person, false)
        );

      });


      memberCount.textContent =
        `${allProfiles.length} people to discover`;


      loading.style.display = "none";

    }


    /*
      AUTHENTICATION
    */

    onAuthStateChanged(
      auth,
      (user) => {

        currentUser = user || null;


        if (
          currentUser &&
          !currentUser.isAnonymous
        ) {

          authNav.textContent = "Profile";

          authNav.href = "profile.html";

        } else {

          authNav.textContent = "Log In";

          authNav.href = "login.html";

        }

      }
    );


    /*
      FIREBASE USERS

      Discover remains public.

      We listen to the users collection even when
      nobody is logged in.
    */

    onSnapshot(
      collection(db, "users"),

      (snapshot) => {

        const realProfiles = [];


        snapshot.forEach((userDoc) => {

          /*
            NEVER show the logged-in person's
            own profile in Discover.
          */

          if (
            currentUser &&
            !currentUser.isAnonymous &&
            userDoc.id === currentUser.uid
          ) {

            return;

          }


          realProfiles.push(
            getRealProfile(userDoc)
          );

        });


        renderProfiles(realProfiles);

      },

      (error) => {

        console.error(
          "Could not load Firebase profiles:",
          error
        );

        /*
          Even if Firebase has a temporary issue,
          keep Discover usable with demo profiles.
        */

        renderProfiles([]);

      }
    );

  </script>

</body>
