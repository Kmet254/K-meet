   ESCAPE HTML
   ============================================================
  */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /*
   ============================================================
   GET PHOTO
   ============================================================
  */

  function getPhoto(profile, index = 0) {

    const possiblePhotos = [
      profile.photoURL,
      profile.photoUrl,
      profile.avatar,
      profile.profilePhoto,
      profile.profileImage,
      profile.image
    ];

    const foundPhoto = possiblePhotos.find(photo =>
      typeof photo === "string" &&
      photo.trim().length > 0
    );

    if (foundPhoto) {
      return foundPhoto;
    }

    return backupPhotos[index % backupPhotos.length];
  }

   VALID FIREBASE PROFILE
   ============================================================

   We only accept a document that has an actual name.

   This prevents empty Firestore documents from becoming
   "members".
   ============================================================
  */

  function getRealProfile(id, data, index) {

    if (!id || !data) {
      return null;
    }

    /*
     * Never treat permanent demo profiles as Firebase members.
     */

    if (String(id).startsWith("demo-")) {
      return null;
    }


    const name =
      data.displayName ||
      data.name ||
      data.username ||
      "";


    if (!String(name).trim()) {
      return null;
    }


    const interests =
      Array.isArray(data.interests)
        ? data.interests
            .filter(Boolean)
            .slice(0, 5)
        : [];


    return {

      id: String(id),

      name: String(name).trim(),

      age:
        data.age ||
        data.years ||
        "",

      location:
        data.location ||
        data.city ||
        "Kenya",

      description:
        data.description ||
        data.bio ||
        "Looking forward to meeting new people on Kmeet.",

      interests,

      photoURL: getPhoto(data, index),

      online:
        data.online === true ||
        data.isOnline === true

    };
  }


  /*
   ============================================================
   LIKES
   ============================================================
  */

  function getLocalLikes() {

    try {

      return JSON.parse(
        localStorage.getItem("kmeetLikes") || "[]"
      );

    } catch {

      return [];

    }
  }


  function saveLocalLikes(likes) {

    localStorage.setItem(
      "kmeetLikes",
      JSON.stringify(likes)
    );

  }


  async function toggleLike(profile) {

    const button =
      document.querySelector(
        `[data-like-id="${profile.id}"]`
      );

    if (!button) return;

    const icon =
      button.querySelector("i");


    if (
      currentUser &&
      !String(profile.id).startsWith("demo-")
    ) {

      const likeRef = doc(
        db,
        "users",
        currentUser.uid,
        "likes",
        profile.id
      );


      const liked =
        button.classList.contains("liked");


      if (liked) {

        button.classList.remove("liked");

        if (icon) {
          icon.className =
            "fa-regular fa-heart";
        }

      } else {

        button.classList.add("liked");

        if (icon) {
          icon.className =
            "fa-solid fa-heart";
        }


        try {

          await setDoc(
            likeRef,
            {
              profileId: profile.id,
              profileName: profile.name,
              createdAt: serverTimestamp()
            },
            {
              merge: true
            }
          );

        } catch (error) {

          console.error(
            "Could not save like:",
            error
          );

        }

      }

      return;
    }


    const likes =
      getLocalLikes();


    const index =
      likes.indexOf(profile.id);


    if (index >= 0) {

      likes.splice(index, 1);

      button.classList.remove("liked");

      if (icon) {
        icon.className =
          "fa-regular fa-heart";
      }

    } else {

      likes.push(profile.id);

      button.classList.add("liked");

      if (icon) {
        icon.className =
          "fa-solid fa-heart";
      }

    }


    saveLocalLikes(likes);

  }


  /*
   ============================================================
   CREATE PROFILE CARD
   ============================================================
  */

  function createProfileCard(profile, index) {

    const card =
      document.createElement("article");

    card.className =
      "profile-card";


    const photo =
      getPhoto(profile, index);


    const ageHTML =
      profile.age
        ? `
          <span class="profile-age">
            ${escapeHTML(profile.age)} years
          </span>
        `
        : "";


    const locationHTML =
      profile.location
        ? `
          <p class="profile-location">
            <i class="fa-solid fa-location-dot"></i>
            ${escapeHTML(profile.location)}
          </p>
        `
        : "";


    const interestsHTML =
      Array.isArray(profile.interests) &&
      profile.interests.length
        ? `
          <div class="profile-interests">

            ${profile.interests.map(interest => `
              <span class="interest-tag">
                ${escapeHTML(interest)}
              </span>
            `).join("")}

          </div>
        `
        : "";


    const onlineHTML =
      profile.online
        ? `
          <div class="online-badge">
            <span class="status-dot"></span>
            Online
          </div>
        `
        : `
          <div class="online-badge offline">
            <span class="status-dot"></span>
            Offline
          </div>
        `;


    const chatURL =
      `chat.html?userId=${encodeURIComponent(profile.id)}`;


    card.innerHTML = `

      <div class="profile-photo-wrap">

        <img
          class="profile-photo"
          src="${escapeHTML(photo)}"
          alt="${escapeHTML(profile.name)}"
          loading="lazy"
        >

        ${onlineHTML}

      </div>


      <div class="profile-content">

        <div class="profile-name-row">

          <h2 class="profile-name">
            ${escapeHTML(profile.name)}
          </h2>

          ${ageHTML}

        </div>


        ${locationHTML}


        <p class="profile-description">
          ${escapeHTML(profile.description)}
        </p>


        ${interestsHTML}


        <div class="profile-actions">

          <a
            class="chat-btn"
            href="${chatURL}"
          >
            <i class="fa-regular fa-comment"></i>
            Chat
          </a>


          <button
            class="like-btn"
            type="button"
            data-like-id="${escapeHTML(profile.id)}"
            aria-label="Like ${escapeHTML(profile.name)}"
          >
            <i class="fa-regular fa-heart"></i>
          </button>

        </div>

      </div>
    `;


    /*
     * PHOTO FALLBACK
     */

    const image =
      card.querySelector(".profile-photo");


    if (image) {

      image.addEventListener(
        "error",
        () => {

          const fallback =
            backupPhotos[index % backupPhotos.length];


          if (
            image.dataset.fallbackUsed !== "true"
          ) {

            image.dataset.fallbackUsed = "true";

            image.src = fallback;

          } else {

            image.src =
              "data:image/svg+xml;charset=UTF-8," +
              encodeURIComponent(`
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="600"
                  height="600"
                  viewBox="0 0 600 600"
                >

                  <rect
                    width="600"
                    height="600"
                    fill="#201b21"
                  />

                  <text
                    x="50%"
                    y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    fill="#ff6da8"
                    font-size="180"
                    font-family="Arial"
                  >
                    K
                  </text>

                </svg>
              `);

          }

        }
      );

    }


    /*
     * LIKE BUTTON
     */

    const likeButton =
      card.querySelector(".like-btn");


    if (likeButton) {

      likeButton.addEventListener(
        "click",
        () => toggleLike(profile)
      );


      const likes =
        getLocalLikes();


      if (likes.includes(profile.id)) {

        likeButton.classList.add("liked");

        const icon =
          likeButton.querySelector("i");

        if (icon) {
          icon.className =
            "fa-solid fa-heart";
        }

      }

    }


    return card;

  }


  /*
   ============================================================
   RENDER PROFILES
   ============================================================

   THIS IS THE IMPORTANT FIX.

   We use a Map keyed by the Firestore document ID.

   Therefore:

   - duplicate snapshot processing cannot inflate count
   - same user cannot appear twice
   - current logged-in user can be removed
   - 36 permanent profiles stay untouched
   ============================================================
  */

  function renderProfiles(firebaseProfiles = []) {

    /*
     * Deduplicate by Firebase document ID.
     */

    const uniqueMap =
      new Map();


    firebaseProfiles.forEach(profile => {

      if (!profile || !profile.id) {
        return;
      }


      /*
       * Never allow demo profiles into
       * the real-member count.
       */

      if (
        String(profile.id).startsWith("demo-")
      ) {
        return;
      }


      uniqueMap.set(
        String(profile.id),
        profile
      );

    });


    /*
     * Convert Map to array.
     */

    let uniqueRealProfiles =
      Array.from(uniqueMap.values());


    /*
     * IMPORTANT:
     *
     * A logged-in user's own profile is NOT another
     * person to discover.
     */

    if (currentUser) {

      uniqueRealProfiles =
        uniqueRealProfiles.filter(
          profile =>
            String(profile.id) !==
            String(currentUser.uid)
        );

    }


    /*
     * Keep the local list synchronized.
     */

    realProfiles =
      uniqueRealProfiles;


    /*
     * ALWAYS keep all 36 permanent profiles.
     */

    const allProfiles = [
      ...permanentProfiles,
      ...uniqueRealProfiles
    ];


    /*
     * ========================================================
     * EXACT MEMBER COUNT
     * ========================================================
     *
     * 36 permanent profiles
     *
     * PLUS
     *
     * valid real Firebase members
     *
     * MINUS
     *
     * current logged-in user
     * ========================================================
     */

    const totalMembers =
      BASE_MEMBER_COUNT +
      uniqueRealProfiles.length;


    memberCount.textContent =
      `${totalMembers} people to discover`;


    /*
     * Clear current cards.
     */

    grid.innerHTML = "";


    /*
     * Render all cards.
     */

    allProfiles.forEach(
      (profile, index) => {

        grid.appendChild(
          createProfileCard(
            profile,
            index
          )
        );

      }
    );

  }


  /*
   ============================================================
   FIRESTORE USERS LISTENER
   ============================================================
  */

  function startUsersListener() {

    if (unsubscribeUsers) {

      unsubscribeUsers();

      unsubscribeUsers = null;

    }


    unsubscribeUsers =
      onSnapshot(

        collection(db, "users"),

        snapshot => {

          const profiles = [];


          snapshot.forEach(
            userDoc => {

              const data =
                userDoc.data() || {};


              const profile =
                getRealProfile(
                  userDoc.id,
                  data,
                  profiles.length
                );


              /*
               * Only valid profiles are accepted.
               */

              if (profile) {

                profiles.push(profile);

              }

            }
          );


          /*
           * Store fresh snapshot.
           */

          realProfiles =
            profiles;


          /*
           * Render using exact unique count.
           */

          renderProfiles(
            realProfiles
          );

        },


        error => {

          console.error(
            "Could not load Firebase members:",
            error
          );


          /*
           * Firebase failed.
           *
           * Do not destroy the 36 permanent profiles.
           */

          realProfiles = [];

          renderProfiles([]);

        }

      );

  }


  /*
   ============================================================
   AUTH STATE
   ============================================================
  */

  onAuthStateChanged(
    auth,
    user => {

      currentUser =
        user || null;


      /*
       * Re-render immediately when login/logout changes.
       *
       * This is important because your own profile should
       * disappear from Discover when logged in.
       */

      renderProfiles(
        realProfiles
      );


      /*
       * Start/refresh Firebase listener.
       */

      startUsersListener();

    }
  );


  /*
   ============================================================
   INITIAL DISPLAY
   ============================================================
  */

  renderProfiles([]);

</script>
