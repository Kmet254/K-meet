.nav-links a:hover,

.nav-links a.active{

}

.nav-links a.active::after{

}

.page{

.profile-card{

.photo-wrap{

.profile-card:hover .photo-wrap img{

/* =====================================================
   LIKES
   ===================================================== */

const LIKE_KEY =
    "kmeet_member_likes_v1";


const ANON_LIKE_KEY =
    "kmeet_anonymous_likes_v1";


let currentUser =
    null;


function getLikeKey(){

    if(
        currentUser &&
        !currentUser.isAnonymous
    ){

        return LIKE_KEY +
            "_" +
            currentUser.uid;

    }

    return ANON_LIKE_KEY;

}


function getLikes(){

    try{

        return JSON.parse(
            localStorage.getItem(
                getLikeKey()
            ) || "[]"
        );

    }catch{

        return [];

    }

}


function saveLikes(
    likes
){

    localStorage.setItem(
        getLikeKey(),
        JSON.stringify(likes)
    );

}


function isLiked(
    id
){

    return getLikes()
        .includes(id);

}


async function likeProfile(
    id
){

    const likes =
        getLikes();


    if(
        likes.includes(id)
    ){

        saveLikes(
            likes.filter(
                item => item !== id
            )
        );

    }else{

        likes.push(id);

        saveLikes(
            likes
        );


        /*
        Registered members also create a
        recipient-side likes record.
        */

        if(
            currentUser &&
            !currentUser.isAnonymous &&
            !id.startsWith("demo-")
        ){

            try{

                await setDoc(
                    doc(
                        db,
                        "users",
                        id,
                        "likesReceived",
                        currentUser.uid
                    ),
                    {
                        fromUid:
                            currentUser.uid,

                        createdAt:
                            serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );

            }catch(error){

                console.warn(
                    "Kmeet like could not be saved to Firebase:",
                    error
                );

            }

        }

    }


    refreshLikeButtons();

}


function refreshLikeButtons(){

    document
        .querySelectorAll(
            ".like-button"
        )
        .forEach(
            button => {

                const id =
                    button.dataset.profileId;


                if(
                    isLiked(id)
                ){

                    button.classList.add(
                        "liked"
                    );

                    button.innerHTML =
                        "♥ Liked";

                }else{

                    button.classList.remove(
                        "liked"
                    );

                    button.innerHTML =
                        "♡ Like";

                }

            }
        );

}


/* =====================================================
   RENDER PROFILE
   ===================================================== */

function renderProfile(
    person,
    index
){

    const statusText =
        person.online
            ? "Online"
            : "Offline";


    const statusClass =
        person.online
            ? "online"
            : "offline";


    const tags =
        person.interests
            .slice(0,4)
            .map(
                interest => `
                    <span class="tag">
                        ${escapeHtml(interest)}
                    </span>
                `
            )
            .join("");


    let viewLink =
        "login.html";


    let chatLink =
        "login.html";


    if(
        !person.demo
    ){

        viewLink =
            "profile.html?id=" +
            encodeURIComponent(
                person.id
            );


        chatLink =
            "chat.html?userId=" +
            encodeURIComponent(
                person.id
            );

    }


    const photo =
        person.photo ||
        backupPhotos[
            index % backupPhotos.length
        ];


    return `

        <article class="profile-card">

            <div class="photo-wrap">

                <img
                    src="${escapeHtml(photo)}"
                    alt="${escapeHtml(person.name)}"
                    loading="lazy"
                    onerror="
                        this.onerror=null;
                        this.src='${backupPhotos[index % backupPhotos.length]}';
                    "
                >

                <div class="status-badge">

                    <span
                        class="status-dot ${statusClass}"
                    ></span>

                    ${statusText}

                </div>

            </div>


            <div class="profile-inside">

                <div class="profile-name-row">

                    <h3>
                        ${escapeHtml(person.name)}
                        ${escapeHtml(person.age)}
                    </h3>

                </div>


                <p class="profile-location">
                    📍 ${escapeHtml(person.location)}
                </p>


                <p class="profile-description">
                    ${escapeHtml(person.description)}
                </p>


                <div class="tags">
                    ${tags}
                </div>


                <div class="profile-actions">

                    <a
                        class="profile-button view-button"
                        href="${viewLink}"
                    >
                        View Profile
                    </a>


                    <a
                        class="profile-button chat-button"
                        href="${chatLink}"
                    >
                        ♥ Chat
                    </a>


                    <button
                        type="button"
                        class="profile-button like-button"
                        data-profile-id="${escapeHtml(person.id)}"
                    >
                        ♡ Like
                    </button>

                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   RENDER ALL
   ===================================================== */

function renderProfiles(
    realProfiles
){

    const usedIds =
        new Set();


    const cleanReal =
        realProfiles.filter(
            person => {

                if(
                    usedIds.has(
                        person.id
                    )
                ){

                    return false;

                }


                usedIds.add(
                    person.id
                );


                return true;

            }
        );


    /*
    Never show the logged-in person's own
    profile in Discover.
    */

    const filteredReal =
        cleanReal.filter(
            person => {

                if(
                    currentUser &&
                    !currentUser.isAnonymous &&
                    person.id === currentUser.uid
                ){

                    return false;

                }

                return true;

            }
        );


    const needed =
        Math.max(
            36 - filteredReal.length,
            0
        );


    const demo =
        demoProfiles.slice(
            0,
            needed
        );


    const allProfiles =
        [
            ...filteredReal,
            ...demo
        ];


    grid.innerHTML =
        allProfiles
            .map(
                (person,index) =>
                    renderProfile(
                        person,
                        index
                    )
            )
            .join("");


    memberCount.textContent =
        `${allProfiles.length} people to discover`;


    refreshLikeButtons();

}


/* =====================================================
   REAL FIREBASE PROFILE
   ===================================================== */

function getRealProfile(
    snap,
    index
){

    const data =
        snap.data() || {};


    const name =
        data.name ||
        data.username ||
        data.displayName ||
        "Kmeet Member";


    const age =
        data.age
            ? `, ${data.age}`
            : "";


    const photo =
        data.photoURL ||
        data.photoUrl ||
        data.avatar ||
        data.profilePhoto ||
        data.profileImage ||
        data.photo ||
        backupPhotos[
            index % backupPhotos.length
        ];


    const description =
        data.bio ||
        data.description ||
        data.about ||
        "New Kmeet member. Looking forward to meeting interesting people and making genuine connections.";


    const interests =
        Array.isArray(
            data.interests
        )
            ? data.interests
            : [];


    return {

        id:snap.id,

        name,

        age,

        location:
            data.location ||
            data.city ||
            "Kenya",

        online:
            data.online === true ||
            data.isOnline === true,

        photo,

        description,

        interests,

        demo:false

    };

}


/* =====================================================
   INITIAL DEMO PROFILES
   ===================================================== */

renderProfiles([]);


/* =====================================================
   AUTH STATE
   ===================================================== */

onAuthStateChanged(
    auth,
    user => {

        currentUser =
            user;


        if(
            user &&
            !user.isAnonymous
        ){

            profileLink.href =
                "profile.html";

        }else{

            profileLink.href =
                "login.html";

        }


        refreshLikeButtons();

    }
);


/* =====================================================
   LIKE BUTTON EVENT
   ===================================================== */

grid.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                ".like-button"
            );


        if(!button){

            return;

        }


        likeProfile(
            button.dataset.profileId
        );

    }
);


/* =====================================================
   FIREBASE LIVE MEMBERS
   ===================================================== */

try{

    onSnapshot(

        collection(
            db,
            "users"
        ),

        snapshot => {

            const realProfiles =
                [];


            snapshot.forEach(
                snap => {

                    const data =
                        snap.data() || {};


                    if(
                        data.name ||
                        data.username ||
                        data.displayName ||
                        data.photoURL ||
                        data.photoUrl ||
                        data.avatar ||
                        data.profilePhoto ||
                        data.profileImage
                    ){

                        realProfiles.push(
                            getRealProfile(
                                snap,
                                realProfiles.length
                            )
                        );

                    }

                }
            );


            message.innerHTML =
                "";


            renderProfiles(
                realProfiles
            );

        },

        error => {

            console.error(
                "Kmeet Discover Firebase error:",
                error
            );


            /*
            Keep the 36 demo profiles visible
            if Firebase is unavailable.
            */

            renderProfiles([]);


            message.innerHTML =
                "";

        }

    );

}catch(error){

    console.error(
        "Kmeet Discover startup error:",
        error
    );


    renderProfiles([]);

}

</script>
