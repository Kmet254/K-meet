<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kmeet — Discover People</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      font-family: "Poppins", sans-serif;

      color: white;

      background:
        linear-gradient(
          rgba(9,5,15,.83),
          rgba(31,8,30,.80)
        ),
        url("kmeet-background.jpg.jpg")
        center/cover fixed no-repeat;

      overflow-x: hidden;
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .nav {

      height: 76px;

      padding: 0 5%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom:
        1px solid rgba(255,255,255,.08);

      background:
        rgba(10,5,15,.42);

      backdrop-filter: blur(18px);

      -webkit-backdrop-filter: blur(18px);

      position: sticky;

      top: 0;

      z-index: 20;
    }


    .logo {

      display: flex;

      align-items: center;

      gap: 9px;

      color: white;

      text-decoration: none;

      font-family:
        "Playfair Display",
        serif;

      font-size: 26px;

      font-weight: 600;
    }


    .logo-heart {

      width: 34px;
      height: 34px;

      display: grid;

      place-items: center;

      border-radius: 50%;

      color: #ff70ad;

      background:
        rgba(255,79,154,.12);

      border:
        1px solid rgba(255,255,255,.12);
    }


    .navlinks {

      display: flex;

      align-items: center;

      gap: 24px;
    }


    .navlinks a {

      color:
        rgba(255,255,255,.72);

      text-decoration: none;

      font-size: 13px;

      font-weight: 600;

      transition: .2s ease;
    }


    .navlinks a:hover {

      color: white;
    }


    .profile-link {

      padding: 8px 15px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.07);

      border:
        1px solid rgba(255,255,255,.10);
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .container {

      width:
        min(1180px, calc(100% - 30px));

      margin: auto;

      padding: 48px 0 70px;
    }


    .heading {

      text-align: center;

      margin-bottom: 35px;
    }


    .heading-icon {

      width: 48px;
      height: 48px;

      display: grid;

      place-items: center;

      margin: 0 auto 13px;

      border-radius: 16px;

      color: #ff72ae;

      background:
        rgba(255,79,154,.10);

      border:
        1px solid rgba(255,255,255,.10);
    }


    .heading h1 {

      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(34px, 5vw, 48px);

      margin-bottom: 8px;
    }


    .heading p {

      color:
        rgba(255,255,255,.58);

      font-size: 14px;
    }


    .presence-summary {

      width: fit-content;

      margin:
        0 auto 28px;

      padding: 8px 15px;

      border-radius: 999px;

      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.09);

      color:
        rgba(255,255,255,.62);

      font-size: 11px;
    }


    .presence-summary span {

      color: #5ce99a;

      font-weight: 700;
    }


    /* =====================================================
       GRID
       ===================================================== */

    .grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 18px;
    }


    /* =====================================================
       CARD
       ===================================================== */

    .card {

      overflow: hidden;

      border-radius: 24px;

      background:
        rgba(19,9,24,.70);

      border:
        1px solid rgba(255,255,255,.10);

      box-shadow:
        0 20px 55px rgba(0,0,0,.27);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
    }


    .card:hover {

      transform:
        translateY(-5px);

      border-color:
        rgba(255,111,171,.24);

      box-shadow:
        0 25px 65px rgba(0,0,0,.38);
    }


    .photo-wrap {

      height: 285px;

      position: relative;

      overflow: hidden;

      background:
        #241326;
    }


    .photo {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform .35s ease;
    }


    .card:hover .photo {

      transform:
        scale(1.035);
    }


    .status-badge {

      position: absolute;

      left: 12px;

      bottom: 12px;

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 7px 11px;

      border-radius: 999px;

      background:
        rgba(7,5,11,.76);

      border:
        1px solid rgba(255,255,255,.12);

      backdrop-filter: blur(10px);

      font-size: 10px;

      font-weight: 600;
    }


    .status-dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      flex-shrink: 0;
    }


    .online {

      background:
        #4de995;

      box-shadow:
        0 0 9px
        rgba(77,233,149,.55);
    }


    .recent {

      background:
        #f4ae52;
    }


    .offline {

      background:
        #9b94a2;
    }


    .card-body {

      padding: 17px;
    }


    .name-row {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

      margin-bottom: 5px;
    }


    .name {

      font-size: 18px;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .age {

      color:
        rgba(255,255,255,.64);

      font-weight: 400;
    }


    .location {

      color:
        rgba(255,255,255,.52);

      font-size: 11px;

      margin-bottom: 12px;
    }


    .location i {

      color:
        #ff70ad;

      margin-right: 4px;
    }


    .tags {

      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      min-height: 25px;

      margin-bottom: 15px;
    }


    .tag {

      padding: 5px 8px;

      border-radius: 999px;

      background:
        rgba(255,79,154,.08);

      border:
        1px solid
        rgba(255,79,154,.13);

      color:
        rgba(255,255,255,.67);

      font-size: 9px;
    }


    .actions {

      display: grid;

      grid-template-columns: 1fr;

      gap: 8px;
    }


    .view-btn {

      min-height: 40px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      border-radius: 12px;

      color: white;

      text-decoration: none;

      background:
        linear-gradient(
          100deg,
          #ff478f,
          #d959b6
        );

      font-size: 11px;

      font-weight: 700;

      box-shadow:
        0 9px 20px
        rgba(255,71,143,.14);

      transition: .2s ease;
    }


    .view-btn:hover {

      transform:
        translateY(-1px);
    }


    .empty {

      grid-column:
        1 / -1;

      text-align: center;

      padding: 60px 20px;

      border-radius: 25px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.09);

      color:
        rgba(255,255,255,.60);
    }


    .error {

      text-align: center;

      padding: 20px;

      color:
        #ffc4d1;

      border-radius: 15px;

      background:
        rgba(130,25,55,.25);

      border:
        1px solid rgba(255,120,150,.15);

      margin-bottom: 20px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 950px) {

      .grid {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }


    @media (max-width: 700px) {

      .nav {

        height: 68px;

        padding: 0 17px;
      }

      .logo {

        font-size: 23px;
      }

      .navlinks {

        gap: 12px;
      }

      .navlinks a {

        font-size: 11px;
      }

      .grid {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 11px;
      }

      .photo-wrap {

        height: 230px;
      }

      .card-body {

        padding: 12px;
      }

      .name {

        font-size: 15px;
      }

    }


    @media (max-width: 430px) {

      .container {

        width:
          calc(100% - 20px);

        padding-top: 32px;
      }

      .heading {

        margin-bottom: 25px;
      }

      .heading h1 {

        font-size: 33px;
      }

      .grid {

        gap: 9px;
      }

      .photo-wrap {

        height: 205px;
      }

      .tag {

        font-size: 8px;

        padding:
          4px 6px;
      }

      .view-btn {

        min-height: 36px;

        font-size: 10px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <nav class="nav">

    <a href="index.html" class="logo">

      <span class="logo-heart">
        <i class="fa-solid fa-heart"></i>
      </span>

      Kmeet

    </a>


    <div class="navlinks">

      <a href="discover.html">
        Discover
      </a>

      <a
        id="profileLink"
        class="profile-link"
        href="login.html"
      >
        Log In
      </a>

      <a href="index.html">
        Home
      </a>

    </div>

  </nav>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="container">

    <section class="heading">

      <div class="heading-icon">
        <i class="fa-solid fa-heart"></i>
      </div>

      <h1>
        Discover People
      </h1>

      <p>
        Meet interesting people joining Kmeet.
      </p>

    </section>


    <div id="presenceSummary"
         class="presence-summary">

      Checking who's online...

    </div>


    <div id="message"></div>


    <section
      id="grid"
      class="grid"
    ></section>

  </main>


  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script type="module">

    import {

      auth,
      db,

      onAuthStateChanged,

      collection,
      onSnapshot,

      database,
      databaseRef,
      databaseSet,
      databaseOnValue,
      onDisconnect

    } from "./firebase-config.js";


    const grid =
      document.getElementById("grid");


    const message =
      document.getElementById("message");


    const profileLink =
      document.getElementById("profileLink");


    const presenceSummary =
      document.getElementById(
        "presenceSummary"
      );


    const presenceMap =
      new Map();


    let currentUser = null;


    /* =====================================================
       HELPERS
       ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getPhoto(profile) {

      return (
        profile.photoURL ||
        profile.profilePhoto ||
        profile.avatar ||
        profile.photo ||
        "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=700&q=80"
      );

    }


    function getPresence(uid) {

      const status =
        presenceMap.get(uid);


      if (!status) {

        return {
          state: "offline",
          label: "Offline"
        };

      }


      if (status.state === "online") {

        return {
          state: "online",
          label: "Online now"
        };

      }


      const changed =
        Number(status.lastChanged || 0);


      const age =
        Date.now() - changed;


      if (
        changed &&
        age >= 0 &&
        age <= 15 * 60 * 1000
      ) {

        return {
          state: "recent",
          label: "Active recently"
        };

      }


      return {
        state: "offline",
        label: "Offline"
      };

    }


    function updateSummary() {

      let online = 0;

      presenceMap.forEach(status => {

        if (
          status &&
          status.state === "online"
        ) {

          online++;

        }

      });


      presenceSummary.innerHTML =
        `<span>${online}</span> people online now`;

    }


    /* =====================================================
       RENDER
       ===================================================== */

    let latestProfiles = [];


    function renderProfiles() {

      if (!latestProfiles.length) {

        grid.innerHTML = `
          <div class="empty">
            <i class="fa-solid fa-heart"></i>
            <br><br>
            No Kmeet profiles yet.
          </div>
        `;

        return;

      }


      grid.innerHTML = "";


      latestProfiles.forEach(item => {

        const p =
          item.profile;


        const uid =
          item.uid;


        const name =
          p.name ||
          p.username ||
          "Kmeet Member";


        const age =
          p.age
            ? `, ${escapeHtml(p.age)}`
            : "";


        const location =
          p.location ||
          "Kenya";


        const interests =
          Array.isArray(p.interests)
            ? p.interests.slice(0, 4)
            : [];


        const photo =
          getPhoto(p);


        const presence =
          getPresence(uid);


        const tags =
          interests.length

            ? interests
                .map(
                  interest =>
                    `<span class="tag">
                      ${escapeHtml(interest)}
                    </span>`
                )
                .join("")

            : `<span class="tag">
                 New member
               </span>`;


        const article =
          document.createElement("article");


        article.className =
          "card";


        article.innerHTML = `

          <div class="photo-wrap">

            <img
              class="photo"
              src="${escapeHtml(photo)}"
              alt="${escapeHtml(name)}"
              loading="lazy"
            >

            <div class="status-badge">

              <span
                class="status-dot ${presence.state}">
              </span>

              ${presence.label}

            </div>

          </div>


          <div class="card-body">

            <div class="name-row">

              <div class="name">

                ${escapeHtml(name)}
                <span class="age">
                  ${age}
                </span>

              </div>

            </div>


            <div class="location">

              <i class="fa-solid fa-location-dot"></i>

              ${escapeHtml(location)}

            </div>


            <div class="tags">

              ${tags}

            </div>


            <div class="actions">

              <a
                class="view-btn"
                href="profile.html?id=${encodeURIComponent(uid)}"
              >

                <i class="fa-solid fa-user"></i>

                View Profile

              </a>

            </div>

          </div>

        `;


        const image =
          article.querySelector(".photo");


        image.addEventListener(
          "error",
          function () {

            this.src =
              "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=700&q=80";

          }
        );


        grid.appendChild(article);

      });


      updateSummary();

    }


    /* =====================================================
       AUTH
       ===================================================== */

    onAuthStateChanged(
      auth,
      user => {

        currentUser =
          user || null;


        if (
          user &&
          !user.isAnonymous
        ) {

          profileLink.textContent =
            "My Profile";

          profileLink.href =
            "profile.html";


          startPresence(user.uid);

        } else {

          profileLink.textContent =
            "Log In";

          profileLink.href =
            "login.html";

        }

      }
    );


    /* =====================================================
       REALTIME PRESENCE
       ===================================================== */

    function startPresence(uid) {

      const connectedRef =
        databaseRef(
          database,
          ".info/connected"
        );


      const statusRef =
        databaseRef(
          database,
          "status/" + uid
        );


      databaseOnValue(
        connectedRef,
        async snapshot => {

          if (snapshot.val() !== true) {

            return;

          }


          try {

            await onDisconnect(
              statusRef
            ).set({

              state: "offline",

              lastChanged:
                Date.now()

            });


            await databaseSet(
              statusRef,
              {

                state: "online",

                lastChanged:
                  Date.now()

              }
            );

          } catch (error) {

            console.error(
              "Presence error:",
              error
            );

          }

        }
      );

    }


    /* =====================================================
       LISTEN TO PRESENCE
       ===================================================== */

    databaseOnValue(

      databaseRef(
        database,
        "status"
      ),

      snapshot => {

        presenceMap.clear();


        const data =
          snapshot.val() || {};


        Object.keys(data)
          .forEach(uid => {

            presenceMap.set(
              uid,
              data[uid]
            );

          });


        renderProfiles();

      },

      error => {

        console.error(
          "Presence listener error:",
          error
        );

        presenceSummary.textContent =
          "Online status unavailable";

        renderProfiles();

      }

    );


    /* =====================================================
       LOAD FIRESTORE PROFILES
       ===================================================== */

    onSnapshot(

      collection(
        db,
        "users"
      ),

      snapshot => {

        latestProfiles = [];


        snapshot.forEach(
          snap => {

            latestProfiles.push({

              uid:
                snap.id,

              profile:
                snap.data()

            });

          }
        );


        renderProfiles();

      },

      error => {

        console.error(
          "Discover error:",
          error
        );


        message.innerHTML = `

          <div class="error">

            We couldn't load the Kmeet
            profiles right now.

          </div>

        `;

      }

    );

  </script>

</body>
</html>
