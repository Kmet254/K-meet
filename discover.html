    /* =====================================================
       KMEET DISCOVER
       ===================================================== */

    body.discover-page {

      margin: 0 !important;

      min-height: 100vh;

      background:

        radial-gradient(
          circle at 15% 15%,
          rgba(118,42,73,0.25),
          transparent 32%
        ),

        radial-gradient(
          circle at 85% 20%,
          rgba(76,35,58,0.20),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #120c10 0%,
          #24151b 50%,
          #0d0a0c 100%
        ) !important;

      color: #fff !important;

      font-family:
        "Poppins",
        Arial,
        sans-serif;
    }


    .discover-page *,
    .discover-page *::before,
    .discover-page *::after {

      box-sizing: border-box;

    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .discover-page .discover-nav {

      width: 100%;

      min-height: 78px;

      padding: 0 50px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      background:
        linear-gradient(
          180deg,
          rgba(20,12,16,0.94),
          rgba(35,19,25,0.86)
        );

      border-bottom:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 30px rgba(0,0,0,0.28);

      position: relative;

      z-index: 20;
    }


    /* =====================================================
       LOGO
       ===================================================== */

    .discover-page .discover-brand {

      display: flex;

      align-items: center;

      gap: 10px;

      color: #fff !important;

      text-decoration: none !important;
    }


    .discover-page .discover-logo {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 30px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    .discover-page .discover-heart {

      font-size: 18px;

      color: #e66a94;

      text-shadow:
        0 0 15px rgba(230,106,148,0.45);
    }


    /* =====================================================
       NAV LINKS
       ===================================================== */

    .discover-page .discover-navlinks {

      display: flex;

      align-items: center;

      gap: 30px;
    }


    .discover-page .discover-navlinks a {

      color:
        rgba(255,255,255,0.88) !important;

      text-decoration: none !important;

      font-size: 14px;

      font-weight: 500;

      letter-spacing: 0.7px;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }


    .discover-page .discover-navlinks a:hover {

      color: #f19ab7 !important;

      transform:
        translateY(-1px);
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .discover-page .discover-container {

      width:
        min(1280px, calc(100% - 40px));

      margin:
        0 auto;

      padding:
        52px 0 80px;
    }


    /* =====================================================
       HEADING
       ===================================================== */

    .discover-page .discover-heading {

      text-align: center;

      margin-bottom:
        42px;
    }


    .discover-page .discover-heading h1 {

      margin:
        0 0 12px;

      color: #fff;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size:
        clamp(36px, 5vw, 55px);

      font-weight: 600;

      line-height: 1.1;
    }


    .discover-page .discover-heading p {

      margin: 0;

      color:
        rgba(255,255,255,0.66);

      font-size: 15px;
    }


    /* =====================================================
       MEMBER COUNT
       ===================================================== */

    .discover-page .member-count {

      margin-top: 14px;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        7px 15px;

      border-radius:
        999px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.10);

      color:
        rgba(255,255,255,0.62);

      font-size: 12px;
    }


    .discover-page .member-count-dot {

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: #62d391;

      box-shadow:
        0 0 10px rgba(98,211,145,0.7);
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    .discover-page #msg {

      margin-bottom: 25px;
    }


    /* =====================================================
       PROFILE GRID
       ===================================================== */

    .discover-page .discover-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(265px,1fr)
        );

      gap: 26px;

      width: 100%;
    }


    /* =====================================================
       PROFILE CARD
       ===================================================== */

    .discover-page .profile-card {

      overflow: hidden;

      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(65,43,52,0.76),
          rgba(25,17,21,0.92)
        ) !important;

      border:
        1px solid rgba(255,255,255,0.13) !important;

      border-radius:
        22px !important;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.06) !important;

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .discover-page .profile-card:hover {

      transform:
        translateY(-6px);

      box-shadow:
        0 25px 55px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.08) !important;
    }


    /* =====================================================
       PHOTO
       ===================================================== */

    .discover-page .photo-wrap {

      position: relative;

      width: 100%;

      height: 310px;

      overflow: hidden;

      background:
        #1b1116;
    }


    .discover-page .profile-card
    .photo-wrap img {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: cover;

      border: 0;

      transition:
        transform 0.35s ease;
    }


    .discover-page .profile-card:hover
    .photo-wrap img {

      transform:
        scale(1.035);
    }


    /* =====================================================
       ONLINE / OFFLINE
       ===================================================== */

    .discover-page .status-badge {

      position: absolute;

      left: 14px;

      bottom: 14px;

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding:
        7px 11px;

      border-radius:
        999px;

      background:
        rgba(12,8,11,0.76);

      border:
        1px solid rgba(255,255,255,0.15);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      color:
        rgba(255,255,255,0.90);

      font-size: 11px;

      font-weight: 500;
    }


    .discover-page .status-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      flex: 0 0 auto;
    }


    .discover-page .status-dot.online {

      background:
        #61d18b;

      box-shadow:
        0 0 9px rgba(97,209,139,0.8);
    }


    .discover-page .status-dot.offline {

      background:
        #8c8c8c;
    }

       CARD CONTENT
       ===================================================== */

    }


    .discover-page .profile-name-row {

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 6px;

        Georgia,

      font-size: 22px;

      font-weight: 600;

      line-height: 1.2;

       ===================================================== */

       ===================================================== */

      grid-template-columns:

      gap: 9px;

      margin-top:
        20px;

    }

      align-items: center;

      justify-content: center;

      min-height: 44px;

      padding:

      color: #fff !important;

      text-decoration:

      border-radius:
        11px;

      font-size: 12px;

      font-weight: 600;

      letter-spacing:

      transition:

    }


    .discover-page .profile-button:hover {

    }

       VIEW PROFILE
       ===================================================== */

      background:
        rgba(255,255,255,0.07);

      border:

      background:
        rgba(255,255,255,0.11);

      box-shadow:
        0 8px 18px rgba(0,0,0,0.20);
    }

       CHAT BUTTON
       ===================================================== */

      background:
        linear-gradient(
          135deg,
          #e66a94,
          #a9426d
        );

      border:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 20px rgba(150,47,88,0.28);
    }


    .discover-page .chat-button:hover {

      box-shadow:
        0 12px 25px rgba(150,47,88,0.40);
    }


    /* =====================================================
       DEMO BUTTON
       ===================================================== */

    .discover-page .demo-button {

      cursor: pointer;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width:700px) {

      .discover-page .discover-nav {

        padding:
          0 18px;
      }


      .discover-page .discover-logo {

        font-size:
          25px;
      }


      .discover-page .discover-navlinks {

        gap:
          14px;
      }


      .discover-page
      .discover-navlinks a {

        font-size:
          11px;
      }


      .discover-page
      .discover-container {

        width:
          min(
            calc(100% - 26px),
            600px
          );

        padding-top:
          35px;
      }


      .discover-page .photo-wrap {

        height:
          300px;
      }


      .discover-page
      .profile-actions {

        grid-template-columns:
          1fr 1fr;
      }

    }


    @media (max-width:430px) {

      .discover-page
      .discover-navlinks a:nth-child(3) {

        display:
          none;
      }


      .discover-page
      .discover-grid {

        grid-template-columns:
          1fr;
      }


      .discover-page
      .photo-wrap {

        height:
          330px;
      }

    }

          online:true,
          photo:"https://randomuser.me/api/portraits/women/38.jpg",
          description:"Fashion and travel lover who enjoys food and new experiences.",
          interests:["Travel","Fashion","Food"]
        },

        {
          name:"Patrick",
          age:29,
          location:"Kisumu, Kenya",
          online:true,
          photo:"https://randomuser.me/api/portraits/men/48.jpg",
          description:"Easygoing and adventurous, Patrick enjoys music, cars and travel.",
          interests:["Music","Cars","Travel"]
        },

        {
          name:"Stella",
          age:27,
          location:"Nairobi, Kenya",
          online:false,
          photo:"https://randomuser.me/api/portraits/women/55.jpg",
          description:"Calm and thoughtful, Stella enjoys yoga, nature and books.",
          interests:["Yoga","Nature","Books"]
        },

        {
          name:"William",
          age:32,
          location:"Nakuru, Kenya",
          online:true,
          photo:"https://randomuser.me/api/portraits/men/76.jpg",
          description:"Business-minded and energetic, William enjoys football and travel.",
          interests:["Business","Football","Travel"]
        }

      ];


      /* ===================================================
         ESCAPE HTML
         =================================================== */

      function safe(value) {

        return String(value)

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#039;"
          );

      }


      /* ===================================================
         CREATE PROFILE CARD
         =================================================== */

      function createCard(person) {

        const statusClass =
          person.online
            ? "online"
            : "offline";

        const statusText =
          person.online
            ? "Online"
            : "Offline";


        const tags =
          person.interests

            .map(
              function (interest) {

                return `
                  <span class="tag">
                    ${safe(interest)}
                  </span>
                `;

              }
            )

            .join("");


        return `

          <article
            class="profile-card"
          >


            <div class="photo-wrap">


              <img

                src="${safe(person.photo)}"

                alt="${safe(person.name)}"

                loading="lazy"

              >


              <div class="status-badge">

                <span
                  class="status-dot ${statusClass}"
                ></span>

                ${statusText}

              </div>


            </div>



            <div class="profile-inside">


              <div class="profile-name-row">

                <h3>

                  ${safe(person.name)},
                  ${safe(person.age)}

                </h3>

              </div>



              <p
                class="profile-location"
              >

                📍
                ${safe(person.location)}

              </p>



              <p
                class="profile-description"
              >

                ${safe(person.description)}

              </p>



              <div class="tags">

                ${tags}

              </div>



              <div
                class="profile-actions"
              >


                <a
                  class="profile-button chat-button"
                  href="login.html"
                >

                  👋 Say Hi

                </a>



                <a
                  class="profile-button view-button"
                  href="login.html"
                >

                  👋 Hello

                </a>



                <a
                  class="profile-button view-button full-width"
                  href="login.html"
                >

                  👤 View Profile

                </a>


              </div>


            </div>


          </article>

        `;

      }


      /* ===================================================
         DISPLAY ALL PROFILES
         =================================================== */

      grid.innerHTML =
        profiles
          .map(createCard)
          .join("");


      if (memberCount) {

        memberCount.textContent =
          profiles.length +
          " people to discover";

      }


      if (profileLink) {

        profileLink.href =
          "login.html";

      }


      console.log(
        "Kmeet Discover loaded:",
        profiles.length,
        "profiles"
      );


      /* ===================================================
         OPTIONAL FIREBASE
         =================================================== */

      setTimeout(
        function () {

          import("./firebase-config.js")

            .then(
              function (firebase) {

                if (
                  firebase.auth &&
                  firebase.onAuthStateChanged
                ) {

                  firebase.onAuthStateChanged(
                    firebase.auth,
                    function (user) {

                      if (
                        user &&
                        !user.isAnonymous &&
                        profileLink
                      ) {

                        profileLink.href =
                          "profile.html";

                      }

                    }
                  );

                }

              }
            )

            .catch(
              function (error) {

                console.warn(
                  "Firebase connection skipped:",
                  error
                );

              }
            );

        },
        500
      );

    }


    /* =====================================================
       START PAGE
       ===================================================== */

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        startDiscover
      );

    } else {

      startDiscover();

    }

  })();

  </script>


</body>
