    /* =====================================================
       KMEET DISCOVER
       ===================================================== */

    body.discover-page {
      margin: 0 !important;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(118, 42, 73, 0.25),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(76, 35, 58, 0.20),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #120c10 0%,
          #24151b 50%,
          #0d0a0c 100%
        ) !important;

      color: #fff !important;

      font-family:
        "Poppins",
        Arial,
        sans-serif;
    }

    .discover-page *,
    .discover-page *::before,
    .discover-page *::after {
      box-sizing: border-box;
    }

    /* =====================================================
       NAVIGATION
       ===================================================== */

    .discover-page .discover-nav {
      width: 100%;
      min-height: 78px;
      padding: 0 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background:
        linear-gradient(
          180deg,
          rgba(20, 12, 16, 0.94),
          rgba(35, 19, 25, 0.86)
        );

      border-bottom:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 30px rgba(0,0,0,0.28);

      position: relative;
      z-index: 20;
    }

    .discover-page .discover-brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #fff !important;
      text-decoration: none !important;
    }

    .discover-page .discover-logo {
      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .discover-page .discover-heart {
      font-size: 18px;
      color: #e66a94;

      text-shadow:
        0 0 15px rgba(230,106,148,0.45);
    }

    .discover-page .discover-navlinks {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .discover-page .discover-navlinks a {
      color:
        rgba(255,255,255,0.88) !important;

      text-decoration: none !important;

      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.7px;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .discover-page .discover-navlinks a:hover {
      color: #f19ab7 !important;
      transform: translateY(-1px);
    }

    /* =====================================================
       MAIN
       ===================================================== */

    .discover-page .discover-container {
      width:
        min(1280px, calc(100% - 40px));

      margin: 0 auto;
      padding: 52px 0 80px;
    }

    .discover-page .discover-heading {
      text-align: center;
      margin-bottom: 42px;
    }

    .discover-page .discover-heading h1 {
      margin: 0 0 12px;

      color: #fff;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size:
        clamp(36px, 5vw, 55px);

      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .discover-page .discover-heading p {
      margin: 0;
      color:
        rgba(255,255,255,0.66);
      font-size: 15px;
    }

    .discover-page .member-count {
      margin-top: 14px;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 15px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.10);

      color:
        rgba(255,255,255,0.62);

      font-size: 12px;
    }

    .discover-page .member-count-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #62d391;

      box-shadow:
        0 0 10px rgba(98,211,145,0.7);
    }

    /* =====================================================
       MESSAGE
       ===================================================== */

    .discover-page #msg {
      margin-bottom: 25px;
    }

    .discover-page .message {
      padding: 15px 20px;
      border-radius: 12px;

      background:
        rgba(255,255,255,0.07);

      border:
        1px solid rgba(255,255,255,0.11);
    }

    .discover-page .message.error {
      color: #ffb4b4;

      border-color:
        rgba(255,100,100,0.30);
    }

    /* =====================================================
       PROFILE GRID
       ===================================================== */

    .discover-page .discover-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(265px, 1fr)
        );

      gap: 26px;
      width: 100%;
    }

    /* =====================================================
       PROFILE CARD
       ===================================================== */

    .discover-page .profile-card {
      overflow: hidden;
      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(65,43,52,0.76),
          rgba(25,17,21,0.92)
        ) !important;

      border:
        1px solid rgba(255,255,255,0.13) !important;

      border-radius: 22px !important;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.06) !important;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .discover-page .profile-card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 25px 55px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.08) !important;
    }

    /* =====================================================
       PHOTO
       ===================================================== */

    .discover-page .photo-wrap {
      position: relative;
      width: 100%;
      height: 310px;
      overflow: hidden;
      background: #1b1116;
    }

    .discover-page .profile-card > .photo-wrap img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
      border: 0;

      transition:
        transform 0.35s ease;
    }

    .discover-page .profile-card:hover
    .photo-wrap img {
      transform: scale(1.035);
    }

    /* =====================================================
       ONLINE / OFFLINE
       ===================================================== */

    .discover-page .status-badge {
      position: absolute;

      left: 14px;
      bottom: 14px;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border-radius: 999px;

      background:
        rgba(12,8,11,0.76);

      border:
        1px solid rgba(255,255,255,0.15);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color:
        rgba(255,255,255,0.90);

      font-size: 11px;
      font-weight: 500;
    }

    .discover-page .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      flex: 0 0 auto;
    }

    .discover-page .status-dot.online {
      background: #61d18b;

      box-shadow:
        0 0 9px rgba(97,209,139,0.8);
    }

    .discover-page .status-dot.offline {
      background: #8c8c8c;
    }

    /* =====================================================
       CARD CONTENT
       ===================================================== */

    .discover-page .profile-inside {
      padding: 21px;
    }

    .discover-page .profile-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
      margin-bottom: 6px;
    }

    .discover-page .profile-inside h3 {
      margin: 0;

      color: #fff;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 22px;
      font-weight: 600;
      line-height: 1.2;
    }

    .discover-page .profile-location {
      margin: 0 0 13px;

      color:
        rgba(255,255,255,0.58);

      font-size: 13px;
    }

    .discover-page .profile-description {
      margin: 0 0 15px;

      color:
        rgba(255,255,255,0.76);

      font-size: 13px;
      line-height: 1.65;

      min-height: 65px;
    }

    /* =====================================================
       INTEREST TAGS
       ===================================================== */

    .discover-page .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .discover-page .tag {
      display: inline-block;

      padding: 6px 10px;

      color:
        rgba(255,255,255,0.82);

      background:
        rgba(230,106,148,0.08);

      border:
        1px solid rgba(230,106,148,0.18);

      border-radius: 30px;

      font-size: 11px;
    }

    /* =====================================================
       BUTTONS
       ===================================================== */

    .discover-page .profile-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;
      margin-top: 20px;
    }

    .discover-page .profile-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 44px;

      padding: 9px 12px;

      color: #fff !important;

      text-decoration: none !important;

      border-radius: 11px;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .discover-page .profile-button:hover {
      transform: translateY(-2px);
    }

    .discover-page .view-button {
      background:
        rgba(255,255,255,0.07);

      border:
        1px solid rgba(255,255,255,0.14);
    }

    .discover-page .view-button:hover {
      background:
        rgba(255,255,255,0.11);

      box-shadow:
        0 8px 18px rgba(0,0,0,0.20);
    }

    .discover-page .chat-button {
      background:
        linear-gradient(
          135deg,
          #e66a94,
          #a9426d
        );

      border:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 20px rgba(150,47,88,0.28);
    }

    .discover-page .chat-button:hover {
      box-shadow:
        0 12px 25px rgba(150,47,88,0.40);
    }

    .discover-page .full-width {
      grid-column: 1 / -1;
    }

    .discover-page .demo-button {
      opacity: 0.92;
    }

    /* =====================================================
       EMPTY
       ===================================================== */

    .discover-page .empty-card {
      grid-column: 1 / -1;

      padding: 50px 25px;
      text-align: center;

      color:
        rgba(255,255,255,0.72);

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 20px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .discover-page .discover-nav {
        padding: 0 18px;
      }

      .discover-page .discover-logo {
        font-size: 25px;
      }

      .discover-page .discover-navlinks {
        gap: 14px;
      }

      .discover-page .discover-navlinks a {
        font-size: 11px;
      }

      .discover-page .discover-container {
        width:
          min(
            calc(100% - 26px),
            600px
          );

        padding-top: 35px;
      }

      .discover-page .photo-wrap {
        height: 300px;
      }

    }

    @media (max-width: 430px) {

      .discover-page .discover-navlinks a:nth-child(3) {
        display: none;
      }

      .discover-page .discover-grid {
        grid-template-columns: 1fr;
      }

      .discover-page .photo-wrap {
        height: 330px;
      }

    }

    /* =====================================================
       ELEMENTS
       ===================================================== */

    const grid =
      document.getElementById("grid");

    const msg =
      document.getElementById("msg");

    const memberCount =
      document.getElementById("memberCount");


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /[&<>"']/g,

          c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[c])
        );

    }


    /* =====================================================
       REAL FIREBASE USERS
       ===================================================== */

    function getRealProfile(snap) {

      const p =
        snap.data() || {};

      const name =
        p.name ||
        p.username ||
        "Kmeet Member";

      const age =
        p.age
          ? `, ${p.age}`
          : "";

      const photo =
        p.photoURL ||
        p.avatar ||
        "https://randomuser.me/api/portraits/lego/1.jpg";

      const interests =
        Array.isArray(p.interests)
          ? p.interests.slice(0, 4)
          : [];

      const online =
        p.online === true ||
        String(p.status || "").toLowerCase()
          === "online";

      return {

        id: snap.id,

        name,

        age,

        location:
          p.location ||
          "Kenya",

        description:
          p.description ||
          p.bio ||
          "A Kmeet member looking forward to meeting someone genuine and sharing meaningful conversations.",

        photo,

        interests,

        online,

        demo: false

      };

    }


    /* =====================================================
       RENDER ONE PROFILE
       ===================================================== */

    function renderProfile(person) {

      const statusText =
        person.online
          ? "Online"
          : "Offline";

      const statusClass =
        person.online
          ? "online"
          : "offline";

      const description =
        person.description ||
        "A Kmeet member looking forward to meeting someone genuine and sharing meaningful conversations.";


      const tags =
        person.interests &&
        person.interests.length

          ? person.interests
              .slice(0, 4)
              .map(
                interest => `
                  <span class="tag">
                    ${escapeHtml(interest)}
                  </span>
                `
              )
              .join("")

          : `
              <span class="tag">
                Getting to know Kmeet
              </span>
            `;


      let actions = "";


      /* REAL FIREBASE MEMBER */

      if (!person.demo) {

        actions = `

          <a
            class="profile-button chat-button"
            href="chat.html?userId=${encodeURIComponent(person.id)}"
          >
            👋 Say Hi
          </a>

          <a
            class="profile-button view-button"
            href="chat.html?userId=${encodeURIComponent(person.id)}"
          >
            👋 Hello
          </a>

          <a
            class="profile-button view-button full-width"
            href="profile.html?id=${encodeURIComponent(person.id)}"
          >
            👤 View Profile
          </a>

        `;

      }


      /* DEMO MEMBER */

      else {

        actions = `

          <a
            class="profile-button chat-button demo-button"
            href="login.html"
          >
            👋 Say Hi
          </a>

          <a
            class="profile-button view-button demo-button"
            href="login.html"
          >
            👋 Hello
          </a>

          <a
            class="profile-button view-button full-width demo-button"
            href="login.html"
          >
            👤 View Profile
          </a>

        `;

      }


      return `

        <article
          class="profile-card"
          data-profile-id="${escapeHtml(person.id)}"
        >

          <div class="photo-wrap">

            <img
              src="${escapeHtml(person.photo)}"
              alt="${escapeHtml(person.name)}"
              loading="lazy"
              onerror="
                this.onerror=null;
                this.src='https://randomuser.me/api/portraits/lego/1.jpg';
              "
            >

            <div class="status-badge">

              <span
                class="status-dot ${statusClass}"
              ></span>

              ${statusText}

            </div>

          </div>


          <div class="profile-inside">

            <div class="profile-name-row">

              <h3>
                ${escapeHtml(person.name)}
                ${escapeHtml(person.age)}
              </h3>

            </div>


            <p class="profile-location">
              📍 ${escapeHtml(person.location)}
            </p>


            <p class="profile-description">
              ${escapeHtml(description)}
            </p>


            <div class="tags">
              ${tags}
            </div>


            <div class="profile-actions">
              ${actions}
            </div>

          </div>

        </article>

      `;

    }


    /* =====================================================
       DRAW PROFILES
       ===================================================== */

    function renderProfiles(realProfiles) {

      const usedIds =
        new Set();

      const cleanReal =
        realProfiles.filter(
          person => {

            if (
              usedIds.has(person.id)
            ) {
              return false;
            }

            usedIds.add(person.id);

            return true;

          }
        );


      /*
       * Always keep at least 36 visible profiles.
       */

      const needed =
        Math.max(
          36 - cleanReal.length,
          0
        );


      const demo =
        demoProfiles.slice(0, needed);


      const allProfiles =
        [
          ...cleanReal,
          ...demo
        ];


      grid.innerHTML =
        allProfiles
          .map(renderProfile)
          .join("");


      memberCount.textContent =
        `${allProfiles.length} people to discover`;

    }


    /* =====================================================
       FIREBASE LISTENER
       ===================================================== */

    onSnapshot(

      collection(
        db,
        "users"
      ),

      snapshot => {

        const realProfiles = [];


        snapshot.forEach(
          snap => {

            const data =
              snap.data() || {};


            /*
             * Only display profiles that have
             * at least some usable information.
             */

            if (
              data.name ||
              data.username ||
              data.photoURL ||
              data.avatar
            ) {

              realProfiles.push(
                getRealProfile(snap)
              );

            }

          }
        );


        renderProfiles(
          realProfiles
        );

      },


      error => {

        console.error(
          "Kmeet Discover error:",
          error
        );


        /*
         * Discover still works visually
         * if Firebase temporarily fails.
         */

        renderProfiles([]);


        msg.innerHTML = `

          <div class="message error">

            We couldn't load the latest member updates,
            so you're seeing the Discover preview.

          </div>

        `;

      }

    );

  </script>
