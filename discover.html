<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Kmeet - Discover</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/jpeg" href="kmeet-logo.jfif.jfif">

  <style>
    /* ================================
       KMEET DISCOVER PAGE
       ================================ */

    body.discover-page {
      margin: 0 !important;
      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #120c10 0%,
          #24151b 50%,
          #0d0a0c 100%
        ) !important;

      color: #fff !important;
      font-family: "Poppins", Arial, sans-serif;
    }

    .discover-page *,
    .discover-page *::before,
    .discover-page *::after {
      box-sizing: border-box;
    }

    /* ================================
       NAVIGATION
       ================================ */

    .discover-page .discover-nav {
      width: 100%;
      min-height: 78px;
      padding: 0 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background:
        linear-gradient(
          180deg,
          rgba(20, 12, 16, 0.92),
          rgba(35, 19, 25, 0.82)
        );

      border-bottom: 1px solid rgba(255,255,255,0.12);

      box-shadow: 0 8px 30px rgba(0,0,0,0.25);

      position: relative;
      z-index: 10;
    }

    .discover-page .discover-logo {
      color: #fff !important;
      text-decoration: none !important;

      font-family: "Playfair Display", Georgia, serif;
      font-size: 30px;
      font-weight: 700;

      letter-spacing: 1px;

      transition: opacity 0.2s ease;
    }

    .discover-page .discover-logo:hover {
      opacity: 0.8;
    }

    .discover-page .discover-navlinks {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .discover-page .discover-navlinks a {
      color: rgba(255,255,255,0.88) !important;
      text-decoration: none !important;

      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .discover-page .discover-navlinks a:hover {
      color: #f09a63 !important;
      transform: translateY(-1px);
    }

    /* ================================
       MAIN
       ================================ */

    .discover-page .discover-container {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 55px 0 70px;
    }

    .discover-page .discover-heading {
      text-align: center;
      margin-bottom: 45px;
    }

    .discover-page .discover-heading h1 {
      margin: 0 0 12px;

      color: #fff;
      font-family: "Playfair Display", Georgia, serif;

      font-size: clamp(36px, 5vw, 56px);
      font-weight: 600;
      line-height: 1.1;
    }

    .discover-page .discover-heading p {
      margin: 0;

      color: rgba(255,255,255,0.68);
      font-size: 16px;
    }

    /* ================================
       MESSAGE
       ================================ */

    .discover-page #msg {
      margin-bottom: 25px;
    }

    .discover-page .message {
      padding: 15px 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .discover-page .message.error {
      color: #ffb4b4;
      border-color: rgba(255,100,100,0.3);
    }

    /* ================================
       PROFILE GRID
       ================================ */

    .discover-page .discover-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(270px, 1fr));

      gap: 28px;

      width: 100%;
    }

    /* ================================
       PROFILE CARD
       ================================ */

    .discover-page .profile-card {
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(65,43,42,0.72),
          rgba(25,17,21,0.88)
        ) !important;

      border: 1px solid rgba(255,255,255,0.14) !important;
      border-radius: 22px !important;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.06) !important;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .discover-page .profile-card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 25px 55px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.08) !important;
    }

    /* ================================
       PHOTO AREA
       ================================ */

    .discover-page .profile-photo-wrap {
      position: relative;
      width: 100%;
      height: 320px;
      overflow: hidden;
      background: #21161b;
    }

    .discover-page .profile-photo {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      border: 0;

      transition: transform 0.35s ease;
    }

    .discover-page .profile-card:hover .profile-photo {
      transform: scale(1.03);
    }

    /* ================================
       ONLINE STATUS
       ================================ */

    .discover-page .online-status {
      position: absolute;
      left: 16px;
      bottom: 16px;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      background: rgba(15,10,12,0.78);

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 30px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      font-size: 12px;
      font-weight: 600;

      color: rgba(255,255,255,0.90);
    }

    .discover-page .status-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #777;

      box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }

    .discover-page .status-dot.online {
      background: #35d07f;
      box-shadow:
        0 0 0 3px rgba(53,208,127,0.12),
        0 0 10px rgba(53,208,127,0.45);
    }

    .discover-page .status-dot.offline {
      background: #777;
    }

    /* ================================
       CARD CONTENT
       ================================ */

    .discover-page .profile-inside {
      padding: 22px;
    }

    .discover-page .profile-inside h3 {
      margin: 0 0 6px;

      color: #fff;

      font-family: "Playfair Display", Georgia, serif;

      font-size: 23px;
      font-weight: 600;
    }

    .discover-page .profile-location {
      margin: 0 0 16px;

      color: rgba(255,255,255,0.60);
      font-size: 14px;
    }

    /* ================================
       INTEREST TAGS
       ================================ */

    .discover-page .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .discover-page .tag {
      display: inline-block;

      padding: 6px 11px;

      color: rgba(255,255,255,0.85);

      background: rgba(240,154,99,0.10);

      border: 1px solid rgba(240,154,99,0.22);

      border-radius: 30px;

      font-size: 12px;
    }

    /* ================================
       BUTTONS
       ================================ */

    .discover-page .profile-actions {
      display: flex;
      gap: 9px;

      margin-top: 20px;
    }

    .discover-page .profile-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 46px;

      color: #fff !important;
      text-decoration: none !important;

      background:
        linear-gradient(
          135deg,
          #e98750,
          #d96d3c
        );

      border-radius: 12px;

      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.4px;

      box-shadow: 0 8px 20px rgba(0,0,0,0.20);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .discover-page .profile-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.30);
    }

    .discover-page .chat-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 46px;

      color: #fff !important;
      text-decoration: none !important;

      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.16);

      border-radius: 12px;

      font-size: 14px;
      font-weight: 600;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .discover-page .chat-button:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-2px);
    }

    /* ================================
       EMPTY STATE
       ================================ */

    .discover-page .empty-card {
      grid-column: 1 / -1;

      padding: 50px 25px;

      text-align: center;

      color: rgba(255,255,255,0.72);

      background: rgba(255,255,255,0.05);

      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
    }

    /* ================================
       MOBILE
       ================================ */

    @media (max-width: 700px) {

      .discover-page .discover-nav {
        padding: 0 20px;
      }

      .discover-page .discover-logo {
        font-size: 25px;
      }

      .discover-page .discover-navlinks {
        gap: 15px;
      }

      .discover-page .discover-navlinks a {
        font-size: 12px;
      }

      .discover-page .discover-container {
        width: min(100% - 28px, 600px);
        padding-top: 35px;
      }

      .discover-page .discover-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .discover-page .profile-photo-wrap {
        height: 230px;
      }

      .discover-page .profile-inside {
        padding: 15px;
      }

      .discover-page .profile-inside h3 {
        font-size: 18px;
      }

      .discover-page .profile-location {
        font-size: 12px;
      }

      .discover-page .profile-actions {
        flex-direction: column;
      }

      .discover-page .profile-button,
      .discover-page .chat-button {
        min-height: 42px;
        font-size: 12px;
      }

      .discover-page .online-status {
        left: 10px;
        bottom: 10px;
        padding: 6px 9px;
        font-size: 10px;
      }

      .discover-page .status-dot {
        width: 8px;
        height: 8px;
      }
    }

    @media (max-width: 430px) {

      .discover-page .discover-navlinks {
        gap: 10px;
      }

      .discover-page .discover-navlinks a {
        font-size: 10px;
      }

      .discover-page .discover-grid {
        gap: 10px;
      }

      .discover-page .profile-photo-wrap {
        height: 210px;
      }
    }
  </style>
</head>

<body class="discover-page">

  <!-- ================================
       NAVIGATION
       ================================ -->

  <nav class="discover-nav">

    <a class="discover-logo" href="index.html">
      Kmeet
    </a>

    <div class="discover-navlinks">
      <a href="discover.html">Discover</a>
      <a id="profileLink" href="login.html">Profile</a>
      <a href="index.html">Home</a>
    </div>

  </nav>


  <!-- ================================
       MAIN CONTENT
       ================================ -->

  <main class="discover-container">

    <div class="discover-heading">

      <h1>Discover People</h1>

      <p>
        Meet interesting people joining Kmeet ❤️
      </p>

    </div>

    <div id="msg"></div>

    <div id="grid" class="discover-grid"></div>

  </main>


  <!-- ================================
       FIREBASE
       ================================ -->

  <script type="module">

    import {
      auth,
      db,
      onAuthStateChanged,
      collection,
      onSnapshot
    } from "./firebase-config.js";


    /* ================================
       PROFILE LINK
       ================================ */

    onAuthStateChanged(auth, user => {

      if (user && !user.isAnonymous) {

        document.getElementById("profileLink").href =
          "profile.html";

        document.getElementById("profileLink").textContent =
          "Profile";

      }

    });


    /* ================================
       FALLBACK AVATARS
       ================================ */

    const fallbackAvatars = [

      "https://i.pravatar.cc/700?img=12",
      "https://i.pravatar.cc/700?img=13",
      "https://i.pravatar.cc/700?img=14",
      "https://i.pravatar.cc/700?img=15",
      "https://i.pravatar.cc/700?img=16",
      "https://i.pravatar.cc/700?img=17",
      "https://i.pravatar.cc/700?img=18",
      "https://i.pravatar.cc/700?img=19",
      "https://i.pravatar.cc/700?img=20",
      "https://i.pravatar.cc/700?img=21",
      "https://i.pravatar.cc/700?img=22",
      "https://i.pravatar.cc/700?img=23"

    ];


    /* ================================
       PROFILE GRID
       ================================ */

    const grid = document.getElementById("grid");

    onSnapshot(

      collection(db, "users"),

      snapshot => {

        grid.innerHTML = "";

        if (snapshot.empty) {

          grid.innerHTML = `
            <div class="empty-card">
              No profiles yet. Create the first account.
            </div>
          `;

          return;
        }


        let avatarIndex = 0;


        snapshot.forEach(snap => {

          const p = snap.data();


          /* NAME */

          const name =
            p.name ||
            p.username ||
            "Kmeet Member";


          /* AGE */

          const age =
            p.age
              ? `, ${p.age}`
              : "";


          /* AVATAR */

          let avatar = p.avatar;

          if (!avatar) {

            avatar =
              fallbackAvatars[
                avatarIndex % fallbackAvatars.length
              ];

            avatarIndex++;

          }


          /* INTERESTS */

          const interests =
            Array.isArray(p.interests)
              ? p.interests.slice(0, 4)
              : [];


          /* LOCATION */

          const location =
            p.location ||
            "Kenya";


          /* ================================
             ONLINE STATUS
             ================================ */

          let isOnline = false;


          if (typeof p.online === "boolean") {

            isOnline = p.online;

          } else if (p.lastSeen) {

            let lastSeenTime = null;

            try {

              if (
                typeof p.lastSeen.toMillis === "function"
              ) {

                lastSeenTime =
                  p.lastSeen.toMillis();

              } else if (
                p.lastSeen.seconds
              ) {

                lastSeenTime =
                  p.lastSeen.seconds * 1000;

              } else {

                lastSeenTime =
                  new Date(p.lastSeen).getTime();

              }

            } catch (error) {

              lastSeenTime = null;

            }


            if (lastSeenTime) {

              isOnline =
                Date.now() - lastSeenTime <
                2 * 60 * 1000;

            }

          }


          const statusText =
            isOnline
              ? "Online"
              : "Offline";


          const statusClass =
            isOnline
              ? "online"
              : "offline";


          /* ================================
             CARD
             ================================ */

          grid.insertAdjacentHTML(

            "beforeend",

            `

              <article class="profile-card">

                <div class="profile-photo-wrap">

                  <img
                    class="profile-photo"
                    src="${escapeHtml(avatar)}"
                    alt="${escapeHtml(name)}"
                    loading="lazy"
                    onerror="this.onerror=null;this.src='${escapeHtml(
                      fallbackAvatars[
                        avatarIndex % fallbackAvatars.length
                      ]
                    )}'"
                  >

                  <div class="online-status">

                    <span
                      class="status-dot ${statusClass}"
                    ></span>

                    ${statusText}

                  </div>

                </div>


                <div class="profile-inside">

                  <h3>
                    ${escapeHtml(name)}${age}
                  </h3>


                  <p class="profile-location">
                    📍 ${escapeHtml(location)}
                  </p>


                  <div class="tags">

                    ${
                      interests.length
                        ? interests.map(i => `
                            <span class="tag">
                              ${escapeHtml(i)}
                            </span>
                          `).join("")
                        : `
                            <span class="tag">
                              New Member
                            </span>
                          `
                    }

                  </div>


                  <div class="profile-actions">

                    <a
                      class="profile-button"
                      href="profile.html?id=${encodeURIComponent(
                        snap.id
                      )}"
                    >
                      View Profile
                    </a>


                    <a
                      class="chat-button"
                      href="chat.html?user=${encodeURIComponent(
                        snap.id
                      )}"
                    >
                      💬 Chat
                    </a>

                  </div>

                </div>

              </article>

            `

          );

        });

      },

      err => {

        console.error(err);

        document.getElementById("msg").innerHTML = `

          <div class="message error">

            Could not load profiles:
            ${escapeHtml(err.message)}

          </div>

        `;

      }

    );


    /* ================================
       SECURITY
       ================================ */

    function escapeHtml(value) {

      return String(value).replace(

        /[&<>"']/g,

        c => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[c])

      );

    }

  </script>

</body>
</html>
