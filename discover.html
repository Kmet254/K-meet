function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            character => {

                const map = {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    "\"":"&quot;",
                    "'":"&#039;"

                };

                return map[character];

            }
        );

}


/* =====================================================
   GET REAL FIREBASE PROFILE
===================================================== */

function getRealProfile(
    snapshot
) {

    const data =
        snapshot.data() || {};

    const name =
        data.name ||
        data.username ||
        data.displayName ||
        "Kmeet Member";

    const age =
        data.age !== undefined &&
        data.age !== null &&
        String(data.age).trim() !== ""
            ? data.age
            : "";

    const photo =
        data.photoURL ||
        data.photoUrl ||
        data.profilePhoto ||
        data.profileImage ||
        data.avatar ||
        data.photo ||
        "";

    const location =
        data.location ||
        data.city ||
        "Kenya";

    const bio =
        data.bio ||
        data.description ||
        data.about ||
        "Connecting hearts naturally.";

    const interests =
        Array.isArray(data.interests)
            ? data.interests
            : [];

    /*
     * Support several possible online fields.
     */
    const online =
        data.online === true ||
        String(
            data.status || ""
        ).toLowerCase() === "online";

    return {

        id:
            snapshot.id,

        name,

        age,

        location,

        photo,

        description:
            bio,

        interests,

        online,

        demo:
            false

    };

}


/* =====================================================
   UNIQUE PHOTOS
===================================================== */

function assignPhotos(
    profiles
) {

    const used =
        new Set();

    return profiles.map(
        (person,index) => {

            let photo =
                typeof person.photo === "string"
                    ? person.photo.trim()
                    : "";

            /*
             * Real user photo:
             * preserve it if available.
             */
            if (
                photo &&
                !used.has(photo)
            ) {

                used.add(photo);

            }

            /*
             * Demo or missing photo:
             * find an unused backup.
             */
            else {

                photo = "";

                for (
                    let i = 0;
                    i < backupPhotos.length;
                    i++
                ) {

                    const candidate =
                        backupPhotos[
                            (index + i) %
                            backupPhotos.length
                        ];

                    if (
                        !used.has(candidate)
                    ) {

                        photo =
                            candidate;

                        used.add(candidate);

                        break;

                    }

                }

            }

            return {

                ...person,

                displayPhoto:
                    photo

            };

        }
    );

}


/* =====================================================
   IMAGE FALLBACK
===================================================== */

function photoError(
    image
) {

    const index =
        Number(
            image.dataset.fallback || "0"
        );

    const next =
        backupPhotos[
            (index + 1) %
            backupPhotos.length
        ];

    image.dataset.fallback =
        String(index + 1);

    image.onerror =
        null;

    image.src =
        next;

}


/* =====================================================
   RENDER CARD
===================================================== */

function renderCard(
    person,
    index
) {

    const interests =
        person.interests &&
        person.interests.length

            ? person.interests
                .slice(0,4)
                .map(

                        </span>
                    `
                )
                .join("")

            : `

                </span>
            `;

    const age =
        person.age
            ? `, ${person.age}`
            : "";

        person.online
            ? "Online"
            : "Offline";

    const statusClass =
        person.online
            ? "online"
            : "offline";

    const photo =
        person.displayPhoto ||
        backupPhotos[
            index %
            backupPhotos.length
        ];

    /*
     * Real member buttons.
     */
    if (!person.demo) {

        return `

            <article

            >

                <div class="real-badge">

                </div>

                <div class="card-content">

                        ${escapeHtml(age)}
                    </h3>

                    </p>

                    </p>

                            class="button chat-button"
                            href="chat.html?userId=${encodeURIComponent(person.id)}"
                        >

                        >

                        </button>

        `;

    }


    /*
     * Demo member.
     */
    return `

        <article
            class="profile-card"
            data-id="${escapeHtml(person.id)}"
        >

            <div class="photo-wrap">

                <img
                    src="${escapeHtml(photo)}"
                    alt="${escapeHtml(person.name)}"

                >

                        class="status-dot ${statusClass}"
                    ></span>

                    ${statusText}

            <div class="card-content">

                    ${escapeHtml(person.name)}
                    ${escapeHtml(age)}
                </h3>

                <p class="location">

                </p>

                <p class="description">

                </p>

                <div class="tags">

                </div>


                <div class="actions">

                    <a
                        class="button view-button"

                    </a>

                    <a

}


/* =====================================================
   RENDER ALL PROFILES
===================================================== */

function renderProfiles(
    realProfiles
) {

    /*
     * Remove duplicates by Firebase UID.
     */
    const seen =
        new Set();

    const uniqueReal =
        realProfiles.filter(
            person => {

                if (
                    seen.has(
                        person.id
                    )
                ) {

                    return false;

                }

                seen.add(
                    person.id
                );

                return true;

            }
        );


    /*
     * Show real members first.
     *
     * If there are fewer than 36 real members,
     * fill the remaining spaces with demo profiles.
     */
    const requiredDemoCount =
        Math.max(
            36 -
            uniqueReal.length,
            0
        );


    const demo =
        demoProfiles.slice(
            0,
            requiredDemoCount
        );


    const allProfiles =
        [
            ...uniqueReal,
            ...demo
        ];


    /*
     * Assign unique visible photos.
     */
    const prepared =
        assignPhotos(
            allProfiles
        );


    if (!prepared.length) {

        grid.innerHTML = `

            <div class="empty">

                No members are available yet.

            </div>

        `;

        memberCount.textContent =
            "People are joining Kmeet";

        return;

    }


    grid.innerHTML =
        prepared
            .map(
                (person,index) =>
                    renderCard(
                        person,
                        index
                    )
            )
            .join("");


    /*
     * Important:
     * The count includes real members.
     */
    memberCount.textContent =
        `${prepared.length} people to discover`;


    refreshLikeButtons();

}


/* =====================================================
   LIKES
===================================================== */

const ANON_LIKES =
    "kmeet_anonymous_likes_v2";

const MEMBER_LIKES =
    "kmeet_member_likes_v2";


function getLikeKey(
    user
) {

    if (
        user &&
        !user.isAnonymous
    ) {

        return `${MEMBER_LIKES}_${user.uid}`;

    }

    return ANON_LIKES;

}


function readLikes(
    key
) {

    try {

        return JSON.parse(
            localStorage.getItem(key) ||
            "[]"
        );

    } catch {

        return [];

    }

}


function writeLikes(
    key,
    likes
) {

    localStorage.setItem(
        key,
        JSON.stringify(likes)
    );

}


function hasLiked(
    user,
    targetId
) {

    return readLikes(
        getLikeKey(user)
    )
    .some(
        item =>
            item.targetId ===
            targetId
    );

}


async function saveLike(
    targetId,
    targetName
) {

    const user =
        auth.currentUser;

    const key =
        getLikeKey(user);

    const likes =
        readLikes(key);


    if (
        likes.some(
            item =>
                item.targetId ===
                targetId
        )
    ) {

        return false;

    }


    likes.push({

        targetId,

        targetName,

        createdAt:
            Date.now()

    });


    writeLikes(
        key,
        likes
    );


    /*
     * Save a real member's like in Firestore
     * when the visitor is logged in.
     */
    if (
        user &&
        !user.isAnonymous &&
        !targetId.startsWith("demo-")
    ) {

        try {

            await setDoc(

                doc(
                    db,
                    "users",
                    targetId,
                    "likesReceived",
                    user.uid
                ),

                {

                    fromUserId:
                        user.uid,

                    targetUserId:
                        targetId,

                    createdAt:
                        serverTimestamp()

                },

                {
                    merge: true
                }

            );

        } catch(error) {

            console.warn(
                "Like saved locally. Firestore like write was unavailable.",
                error
            );

        }

    }


    return true;

}


function refreshLikeButtons() {

    const user =
        auth.currentUser;

    document
        .querySelectorAll(
            "[data-like-id]"
        )
        .forEach(
            button => {

                const liked =
                    hasLiked(
                        user,
                        button.dataset.likeId
                    );

                button.classList.toggle(
                    "liked",
                    liked
                );

                button.textContent =
                    liked
                        ? "♥ Liked"
                        : "♥ Like";

            }
        );

}


document.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                "[data-like-id]"
            );

        if (!button) {
            return;
        }


        if (
            button.classList.contains(
                "liked"
            )
        ) {

            return;

        }


        button.disabled =
            true;


        const saved =
            await saveLike(

                button.dataset.likeId,

                button.dataset.likeName ||
                "Kmeet member"

            );


        button.disabled =
            false;


        if (saved) {

            button.classList.add(
                "liked"
            );

            button.textContent =
                "♥ Liked";

            updateActivity();

        }

    }
);


/* =====================================================
   ACTIVITY
===================================================== */

function updateActivity() {

    const user =
        auth.currentUser;

    const likes =
        readLikes(
            getLikeKey(user)
        );


    if (
        user &&
        !user.isAnonymous
    ) {

        activityTitle.textContent =
            likes.length
                ? `❤️ You liked ${likes.length} ${
                    likes.length === 1
                        ? "person"
                        : "people"
                  }`
                : "❤️ Welcome to Kmeet";


        activitySubtitle.textContent =
            likes.length
                ? "Your likes are saved with your account."
                : "Discover real Kmeet members and find someone who catches your interest.";

    }

    else {

        activityTitle.textContent =
            likes.length
                ? `❤️ ${likes.length} ${
                    likes.length === 1
                        ? "profile liked"
                        : "profiles liked"
                  }`
                : "❤️ Find your first connection";


        activitySubtitle.textContent =
            likes.length
                ? "Your likes are saved in this browser."
                : "You can explore Kmeet profiles without creating an account.";

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    user => {

        /*
         * Guests can still browse Discover.
         */
        if (
            user &&
            !user.isAnonymous
        ) {

            profileLink.href =
                "profile.html";

        }

        else {

            profileLink.href =
                "login.html";

        }


        updateActivity();

        refreshLikeButtons();

    }
);


/* =====================================================
   FIREBASE REAL-TIME USERS LISTENER
===================================================== */

onSnapshot(

    collection(
        db,
        "users"
    ),

    snapshot => {

        const currentUser =
            auth.currentUser;


        const realProfiles =
            [];


        snapshot.forEach(
            userDoc => {

                /*
                 * Never show the current logged-in
                 * user in their own Discover list.
                 */
                if (
                    currentUser &&
                    !currentUser.isAnonymous &&
                    userDoc.id ===
                    currentUser.uid
                ) {

                    return;

                }


                const data =
                    userDoc.data() || {};


                /*
                 * A real member must have at least
                 * a profile name or profile photo.
                 */
                const hasProfile =
                    Boolean(
                        data.name ||
                        data.username ||
                        data.displayName ||
                        data.photoURL ||
                        data.photoUrl ||
                        data.profilePhoto ||
                        data.profileImage ||
                        data.avatar ||
                        data.photo
                    );


                if (
                    !hasProfile
                ) {

                    return;

                }


                realProfiles.push(
                    getRealProfile(
                        userDoc
                    )
                );

            }
        );


        /*
         * Real Firebase members first.
         * Demo profiles fill the remaining cards.
         */
        renderProfiles(
            realProfiles
        );

    },

    error => {

        console.error(
            "Kmeet Discover Firebase error:",
            error
        );


        /*
         * If Firebase is temporarily unavailable,
         * visitors still see the 36 demo profiles.
         */
        renderProfiles([]);

    }

);


/* =====================================================
   INITIAL FALLBACK
===================================================== */

renderProfiles([]);

updateActivity();

</script>
