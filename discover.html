<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Kmeet - Discover</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #120b14;
  color: white;
}

.nav {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 35px;
  background: rgba(20, 10, 25, .95);
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.logo {
  color: #ff4b9b;
  text-decoration: none;
  font-size: 28px;
  font-weight: bold;
}

.navlinks {
  display: flex;
  gap: 25px;
}

.navlinks a {
  color: white;
  text-decoration: none;
}

.page {
  width: min(1400px, calc(100% - 40px));
  margin: auto;
  padding: 45px 0 60px;
}

.heading {
  text-align: center;
  margin-bottom: 35px;
}

.heading h1 {
  margin: 0 0 10px;
  font-size: 38px;
}

.heading p {
  color: #aaa;
}

#testMessage {
  text-align: center;
  color: #ff4b9b;
  margin-bottom: 25px;
  font-weight: bold;
}

.grid {

  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 24px;

}

.card {

  background: rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.10);

  border-radius: 22px;

  overflow: hidden;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.35);

}

.photo {

  width: 100%;

  height: 310px;

  object-fit: cover;

  display: block;

}

.info {

  padding: 20px;

}

.name {

  font-size: 21px;

  font-weight: bold;

  margin-bottom: 6px;

}

.location {

  color: #aaa;

  margin-bottom: 12px;

}

.description {

  color: #d0cbd2;

  line-height: 1.5;

  min-height: 48px;

}

.status {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  font-size: 13px;

  margin-top: 10px;

}

.dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: #777;

}

.online .dot {

  background: #36e58b;

}

.buttons {

  display: flex;

  gap: 10px;

  margin-top: 18px;

}

.button {

  flex: 1;

  padding: 11px;

  border-radius: 12px;

  text-align: center;

  text-decoration: none;

  color: white;

  background: #ff3d91;

  font-weight: bold;

}

@media (max-width: 1000px) {

  .grid {
    grid-template-columns: repeat(3, 1fr);
  }

}

@media (max-width: 700px) {

  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 480px) {

  .nav {
    padding: 0 18px;
  }

  .navlinks {
    gap: 12px;
  }

  .page {
    width: calc(100% - 24px);
  }

  .grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<nav class="nav">

  <a
    href="index.html"
    class="logo"
  >
    Kmeet
  </a>

  <div class="navlinks">

    <a href="discover.html">
      Discover
    </a>

    <a href="login.html">
      Log In
    </a>

  </div>

</nav>


<main class="page">

  <div class="heading">

    <h1>
      Discover People
    </h1>

    <p>
      Explore profiles and discover someone who shares your interests.
    </p>

  </div>


  <div id="testMessage">
    Kmeet Discover is loading...
  </div>


  <div
    id="grid"
    class="grid"
  ></div>


</main>


<script>

const profiles = [

const grid =
  document.getElementById("grid");

const message =
  document.getElementById("testMessage");


profiles.forEach(function(person) {

  const card =
    document.createElement("article");

  card.className = "card";


  card.innerHTML = `

    <img
      class="photo"
      src="${person.photo}"
      alt="${person.name}"
    >

    <div class="info">

      <div class="name">
        ${person.name}, ${person.age}
      </div>

      <div class="location">
        📍 ${person.location}
      </div>

      <div class="description">
        ${person.description}
      </div>

      <div
        class="status ${person.online ? "online" : ""}"
      >

        <span class="dot"></span>

        ${person.online ? "Online" : "Offline"}

      </div>

      <div class="buttons">

        <a
          class="button"
          href="login.html"
        >
          💬 Chat
        </a>

        <a
          class="button"
          href="login.html"
        >
          View
        </a>

      </div>

    </div>

  `;


  grid.appendChild(card);

});


message.textContent =
  profiles.length +
  " people to discover";


console.log(
  "KMEET TEST: Discover loaded successfully."
);

</script>


</body>

</html>
