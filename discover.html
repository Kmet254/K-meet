<!doctype html>

  <style>
    * { box-sizing: border-box; }

    body.discover-page {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(190, 43, 90, .22), transparent 28%),

    }

    .discover-nav {
      width: 100%;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 5%;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(13, 5, 9, .72);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .discover-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
      font-family: "Playfair Display", serif;
      font-size: 25px;
      font-weight: 700;
    }

    .discover-logo-image {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.08);
    }

    .discover-kmeet-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .discover-navlinks {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .discover-navlinks a {
      color: rgba(255,255,255,.78);
      text-decoration: none;
      font-size: 14px;
      transition: .2s ease;
    }

    .discover-navlinks a:hover {
      color: #fff;
    }

    .discover-container {
      width: min(1220px, 92%);
      margin: 0 auto;
      padding: 54px 0 70px;
    }

    .discover-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .discover-heading h1 {
      margin: 0 0 10px;
      font-family: "Playfair Display", serif;
      font-size: clamp(36px, 5vw, 58px);
      line-height: 1.05;
    }

    .discover-heading p {
      margin: 0 auto 18px;
      max-width: 650px;
      color: rgba(255,255,255,.68);
      font-size: 15px;
    }

    .member-count {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      border-radius: 999px;
      color: rgba(255,255,255,.88);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      font-size: 13px;
    }

    .member-count-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e96b9a;
      box-shadow: 0 0 12px rgba(233,107,154,.75);
    }

    .activity-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 20px;
      margin-bottom: 28px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      background: rgba(255,255,255,.045);
      backdrop-filter: blur(14px);
    }

    .activity-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .activity-copy strong {
      font-size: 14px;
    }

    .activity-copy span {
      color: rgba(255,255,255,.58);
      font-size: 12px;
    }

    .likes-link {
      flex: 0 0 auto;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
      padding: 10px 15px;
      border-radius: 999px;
      background: rgba(190,43,90,.35);
      border: 1px solid rgba(255,130,175,.18);
    }

    .discover-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .profile-card {
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.055);
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
      transition: transform .22s ease, border-color .22s ease;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,130,175,.25);
    }

    .profile-photo-wrap {
      position: relative;
      height: 285px;
      background: #1a0a11;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .status-badge {
      position: absolute;
      left: 12px;
      top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(10,10,12,.68);
      backdrop-filter: blur(8px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .status-online .status-dot {
      background: #62d991;
      box-shadow: 0 0 10px rgba(98,217,145,.7);
    }

    .status-offline .status-dot {
      background: #888;
    }

    .profile-content {
      padding: 17px;
    }

    .profile-name {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 22px;
    }

    .profile-location {
      margin-top: 4px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
    }

    .profile-description {
      min-height: 48px;
      margin: 12px 0;
      color: rgba(255,255,255,.68);
      font-size: 12px;
      line-height: 1.55;
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 15px;
    }

    .profile-tag {
      padding: 5px 8px;
      border-radius: 999px;
      color: rgba(255,255,255,.72);
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.07);
      font-size: 10px;
    }

    .profile-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .profile-actions a,
    .profile-actions button {
      min-width: 0;
      border: 0;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      padding: 10px 8px;
      border-radius: 11px;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    .profile-actions .chat-button {
      background: rgba(190,43,90,.52);
      border-color: rgba(255,130,175,.18);
    }

    .profile-actions .like-button.liked {
      background: rgba(233,107,154,.25);
      border-color: rgba(255,130,175,.3);
    }

    .empty-card {
      grid-column: 1 / -1;
      padding: 60px 20px;
      text-align: center;
      color: rgba(255,255,255,.65);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
    }

    @media (max-width: 1000px) {
      .discover-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .discover-nav {
        padding: 12px 4%;
      }

      .discover-navlinks {
        gap: 12px;
      }

      .discover-navlinks a {
        font-size: 12px;
      }

      .discover-container {
        width: 94%;
        padding-top: 38px;
      }

      .activity-bar {
        align-items: flex-start;
        flex-direction: column;
      }

        grid-template-columns: repeat(2, minmax(0, 1fr));

      .discover-brand {

      }

      .discover-logo-image {

        height: 32px;
      }

        gap: 8px;
      }

      .discover-grid {
        grid-template-columns: 1fr;
      }

      .profile-photo-wrap {
        height: 330px;
      }
    }

</head>

  id: `demo-${String(index + 1).padStart(2,"0")}`,
  name: p[0],

  location: p[2],
  online: p[3],

  description: p[5],
  interests: p[6],
  demo: true
}));

function getRealProfile(snap,index) {

  const p =
    snap.data() || {};

  const name =
    p.name ||
    p.username ||
    p.displayName ||
    "Kmeet Member";

  const age =
    p.age
      ? `, ${p.age}`
      : "";

  const photo =
    p.photoURL ||
    p.photoUrl ||
    p.avatar ||
    p.profilePhoto ||
    p.profileImage ||
    p.image ||
    getBackupPhoto(index);

  const interests =
    Array.isArray(p.interests)
      ? p.interests.slice(0,4)
      : [];

  const description =
    p.description ||
    p.bio ||
    p.about ||
    p.intro ||
    "New to Kmeet and ready to make a genuine connection.";

  const online =
    p.online === true ||
    String(p.status || "").toLowerCase() === "online";

  return {
    id: snap.id,
    name: `${name}${age}`,
    location: p.location || p.city || "Kenya",
    photo,
    description,
    interests,
    online,
    demo: false
  };
}

function finalImageFallback() {
  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
        <rect width="100%" height="100%" fill="#24101a"/>
        <text x="50%" y="50%"
          dominant-baseline="middle"
          text-anchor="middle"
          fill="#f2a0bd"
          font-family="Arial"
          font-size="70">
          K
        </text>
      </svg>
    `);
}

function imageFallback(img) {

  const current =
    Number(img.dataset.fallbackIndex || 0);

  if (current < backupPhotos.length) {

    img.dataset.fallbackIndex =
      String(current + 1);

    img.src =
      getBackupPhoto(current);

    return;
  }

  img.onerror = null;
  img.src =
    finalImageFallback();
}

function renderProfile(person,index) {

  const statusClass =
    person.online
      ? "status-online"
      : "status-offline";

  const statusText =
    person.online
      ? "Online"
      : "Offline";

  const tags =
    (person.interests || [])
      .map(
        interest =>
          `<span class="profile-tag">${escapeHtml(interest)}</span>`
      )
      .join("");

  const profileHref =
    person.demo
      ? "login.html"
      : `profile.html?id=${encodeURIComponent(person.id)}`;

  const chatHref =
    person.demo
      ? `chat.html?userId=${encodeURIComponent(person.id)}`
      : `chat.html?userId=${encodeURIComponent(person.id)}`;

  return `
    <article class="profile-card">

      <div class="profile-photo-wrap">

        <img
          class="profile-photo"
          src="${escapeHtml(person.photo)}"
          alt="${escapeHtml(person.name)}"
          loading="lazy"
          onerror="imageFallback(this)"
        >

        <div class="status-badge ${statusClass}">
          <span class="status-dot"></span>
          ${statusText}
        </div>

      </div>

      <div class="profile-content">

        <h2 class="profile-name">
          ${escapeHtml(person.name)}
        </h2>

        <div class="profile-location">
          ${escapeHtml(person.location)}
        </div>

        <div class="profile-description">
          ${escapeHtml(person.description)}
        </div>

        <div class="profile-tags">
          ${tags}
        </div>

        <div class="profile-actions">

          <a href="${profileHref}">
            View Profile
          </a>

          <button
            type="button"
            class="like-button"
            data-like-id="${escapeHtml(person.id)}"
            data-like-name="${escapeHtml(person.name)}"
            data-like-demo="${person.demo ? "true" : "false"}"
          >
            ♥ Like
          </button>

          <a
            class="chat-button"
            href="${chatHref}"
          >
            💬 Chat
          </a>

        </div>

      </div>

    </article>
  `;
}

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderProfiles(realProfiles) {

  const usedIds =
    new Set();

  const cleanReal =
    realProfiles.filter(person => {

      if (usedIds.has(person.id)) {
        return false;
      }

      usedIds.add(person.id);
      return true;

    });

  const needed =
    Math.max(
      BASE_MEMBER_COUNT - cleanReal.length,
      0
    );

  const demo =
    demoProfiles.slice(0,needed);

  const allProfiles =
    [...cleanReal,...demo];

  if (!allProfiles.length) {

    grid.innerHTML = `
      <div class="empty-card">
        No profiles are available yet.
      </div>
    `;

    memberCount.textContent =
      `${BASE_MEMBER_COUNT} people to discover`;

    return;
  }

  grid.innerHTML =
    allProfiles
      .map(
        (person,index) =>
          renderProfile(
            person,
            index
          )
      )
      .join("");

  /*
    IMPORTANT:
    Do not update memberCount here.

    The displayed member count is based on:
    36 baseline members + real Firebase members.

    Updating it here using allProfiles.length would cause
    the number to jump back to 36 when demo profiles fill
    the grid.
  */
}

const ANON_LIKES_KEY =

const MEMBER_LIKES_KEY =
  "kmeet_member_likes_v1";

function readLikes(key) {

  try {

    return JSON.parse(
      localStorage.getItem(key) || "[]"
    );

  } catch {

    return [];

  }
}

function writeLikes(key,value) {

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}

function likeStorageKey(user) {

  if (
    user &&
    !user.isAnonymous
  ) {
    return MEMBER_LIKES_KEY;
  }

  return ANON_LIKES_KEY;
}

function hasLiked(user,targetId) {

  const key =
    likeStorageKey(user);

  return readLikes(key)
    .some(
      item =>
        item.id === targetId
    );
}

async function saveLike(
  targetId,
  targetName,
  targetIsDemo
) {

  const user =
    auth.currentUser;

  const key =
    likeStorageKey(user);

  const likes =
    readLikes(key);

  if (
    likes.some(
      item =>
        item.id === targetId
    )
  ) {
    return;
  }

  const like = {
    id: targetId,
    name: targetName,
    demo: targetIsDemo,
    createdAt: new Date().toISOString()
  };

  writeLikes(
    key,
    [...likes,like]
  );

  if (
    user &&
    !user.isAnonymous &&
    !targetIsDemo
  ) {

    try {

      await setDoc(
        doc(
          db,
          "users",
          user.uid,
          "likes",
          targetId
        ),
        {
          targetId,
          targetName,
          createdAt: serverTimestamp()
        }
      );

    } catch(error) {

      console.error(
        "Could not save like to Firebase:",
        error
      );

    }

  }

  refreshLikeButtons();

  updateActivity(
    auth.currentUser
  );
}

function refreshLikeButtons() {

  const user =
    auth.currentUser;

  document
    .querySelectorAll(
      ".like-button"
    )
    .forEach(button => {

      const id =
        button.dataset.likeId;

      if (
        hasLiked(
          user,
          id
        )
      ) {

        button.classList.add(
          "liked"
        );

        button.textContent =
          "♥ Liked";

      } else {

        button.classList.remove(
          "liked"
        );

        button.textContent =
          "♥ Like";

      }

    });

}

function updateActivity(user) {

  const title =
    document.getElementById(
      "activityTitle"
    );

  const subtitle =
    document.getElementById(
      "activitySubtitle"
    );

  if (
    user &&
    !user.isAnonymous
  ) {

    title.textContent =
      "❤️ Welcome back to Kmeet";

    subtitle.textContent =
      "Like someone you are interested in. Your likes are saved to your account.";

  } else {

    title.textContent =
      "❤️ Find your first connection";

    subtitle.textContent =
      "Like a profile you are interested in. Your likes are saved for this session.";

  }

}

document.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        ".like-button"
      );

    if (!button) {
      return;
    }

    event.preventDefault();

    await saveLike(
      button.dataset.likeId,
      button.dataset.likeName,
      button.dataset.likeDemo === "true"
    );

  }
);

renderProfiles([]);
updateActivity(auth.currentUser);
refreshLikeButtons();

try {

  onSnapshot(
    collection(
      db,
      "users"
    ),

    snapshot => {

      const realProfiles = [];

      snapshot.forEach(
        snap => {

          const data =
            snap.data() || {};

          if (
            data.name ||
            data.username ||
            data.displayName ||
            data.photoURL ||
            data.photoUrl ||
            data.avatar ||
            data.profilePhoto ||
            data.profileImage
          ) {

            realProfiles.push(
              getRealProfile(
                snap,
                realProfiles.length
              )
            );

          }

        }
      );

      msg.innerHTML = "";

      renderProfiles(
        realProfiles
      );

      /*
        MEMBER COUNT RULE

        36 is the permanent baseline.
        Every real Firebase member adds 1.

        Example:
        0 real members  = 36
        1 real member   = 37
        2 real members  = 38
        18 real members = 54
      */
      memberCount.textContent =
        `${BASE_MEMBER_COUNT + realProfiles.length} people to discover`;

    },

    error => {

      console.error(
        "Kmeet Discover Firebase error:",
        error
      );

      renderProfiles([]);

      memberCount.textContent =
        `${BASE_MEMBER_COUNT} people to discover`;

      msg.innerHTML = "";

    }
  );

} catch(error) {

  console.error(
    "Kmeet Discover startup error:",
    error
  );

  renderProfiles([]);

  memberCount.textContent =
    `${BASE_MEMBER_COUNT} people to discover`;

  msg.innerHTML = "";

}

</script>

</body>
</html>
