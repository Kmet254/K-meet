<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kmeet - Discover People</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Poppins", sans-serif;
      color: #fff;

      background:
        linear-gradient(
          rgba(18, 9, 17, .72),
          rgba(10, 5, 12, .90)
        ),
        url("kmeet-background.jpg.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255, 150, 190, .12),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255, 80, 150, .10),
          transparent 35%
        );

      pointer-events: none;
      z-index: 0;
    }

    .discover-page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    /* NAVIGATION */

    .discover-nav {
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 35px;

      background: rgba(15, 8, 15, .42);
      border-bottom: 1px solid rgba(255,255,255,.12);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      position: sticky;
      top: 0;
      z-index: 20;
    }

    .discover-logo {
      color: #fff;
      text-decoration: none;

      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 600;

      letter-spacing: .3px;
    }

    .discover-logo::before {
      content: "♥";
      color: #ff8eaf;
      font-size: 17px;
      margin-right: 7px;
    }

    .discover-navlinks {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .discover-navlinks a {
      color: rgba(255,255,255,.88);
      text-decoration: none;

      font-size: 13px;
      font-weight: 500;

      transition: .2s ease;
    }

    .discover-navlinks a:hover {
      color: #ff9fbd;
    }

    /* MAIN */

    .discover-container {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 55px 0 70px;
    }

    .discover-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .discover-heading h1 {
      margin: 0 0 9px;

      font-family: "Playfair Display", serif;
      font-size: 42px;
      font-weight: 600;
    }

    .discover-heading p {
      margin: 0;

      color: rgba(255,255,255,.72);
      font-size: 14px;
    }

    /* GRID */

    .discover-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 22px;
    }

    /* PROFILE CARD */

    .profile-card {
      overflow: hidden;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.11),
          rgba(255,255,255,.045)
        );

      border: 1px solid rgba(255,255,255,.15);

      box-shadow:
        0 20px 45px rgba(0,0,0,.30);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);

      box-shadow:
        0 25px 55px rgba(0,0,0,.42);
    }

    .profile-photo-wrap {
      position: relative;
      height: 285px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
    }

    .profile-photo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition: transform .35s ease;
    }

    .profile-card:hover .profile-photo {
      transform: scale(1.035);
    }

    .online-dot {
      position: absolute;

      right: 13px;
      top: 13px;

      width: 11px;
      height: 11px;

      border-radius: 50%;

      background: #62e6a2;

      border: 2px solid rgba(20,10,18,.9);

      box-shadow:
        0 0 12px rgba(98,230,162,.7);
    }

    .profile-inside {
      padding: 17px;
    }

    .profile-name {
      margin: 0;

      font-size: 18px;
      font-weight: 600;
    }

    .profile-location {
      margin: 5px 0 11px;

      color: rgba(255,255,255,.62);
      font-size: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;

      min-height: 28px;
      margin-bottom: 15px;
    }

    .tag {
      padding: 5px 9px;

      border-radius: 999px;

      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.10);

      color: rgba(255,255,255,.78);

      font-size: 10px;
    }

    .profile-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .profile-button,
    .chat-button {
      min-height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      text-decoration: none;

      font-size: 12px;
      font-weight: 600;

      transition: .2s ease;
    }

    .profile-button {
      color: #fff;

      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.15);
    }

    .profile-button:hover {
      background: rgba(255,255,255,.16);
    }

    .chat-button {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #e66a94,
          #a9426d
        );

      box-shadow:
        0 8px 20px rgba(150,47,88,.25);
    }

    .chat-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 25px rgba(150,47,88,.35);
    }

    .empty-card {
      grid-column: 1 / -1;

      padding: 60px 25px;

      text-align: center;

      color: rgba(255,255,255,.72);

      background: rgba(255,255,255,.06);

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 22px;
    }

    .message {
      margin-bottom: 20px;
      padding: 12px 15px;

      border-radius: 13px;

      background: rgba(150,30,55,.28);

      border: 1px solid rgba(255,150,170,.18);

      color: #ffd8e0;

      text-align: center;
    }

    @media (max-width: 1000px) {
      .discover-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .discover-nav {
        padding: 0 18px;
      }

      .discover-navlinks {
        gap: 13px;
      }

      .discover-navlinks a {
        font-size: 11px;
      }

      .discover-container {
        width: min(100% - 24px, 600px);
        padding-top: 35px;
      }

      .discover-heading h1 {
        font-size: 34px;
      }

      .discover-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }

      .profile-photo-wrap {
        height: 235px;
      }

      .profile-inside {
        padding: 11px;
      }

      .profile-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 430px) {
      .discover-grid {
        grid-template-columns: 1fr;
      }

      .profile-photo-wrap {
        height: 330px;
      }
    }
  </style>
</head>

<body class="discover-page">

  <nav class="discover-nav">

    <a class="discover-logo" href="index.html">
      Kmeet
    </a>

    <div class="discover-navlinks">
      <a href="discover.html">Discover</a>
      <a id="profileLink" href="login.html">Profile</a>
      <a href="index.html">Home</a>
    </div>

  </nav>

  <main class="discover-container">

    <div class="discover-heading">
      <h1>Discover People</h1>
      <p>Meet interesting people joining Kmeet ❤️</p>
    </div>

    <div id="msg"></div>

    <div id="grid" class="discover-grid"></div>

  </main>

  <script type="module">

    import {
      auth,
      db,
      onAuthStateChanged,
      collection,
      onSnapshot
    } from "./firebase-config.js";

    /* -----------------------------
       PROFILE LINK
    ----------------------------- */

    onAuthStateChanged(auth, user => {

      if (user && !user.isAnonymous) {
        document.getElementById("profileLink").href =
          "profile.html";
      }

    });

    /* -----------------------------
       LOAD PROFILES
    ----------------------------- */

    const grid =
      document.getElementById("grid");

    onSnapshot(
      collection(db, "users"),

      snapshot => {

        grid.innerHTML = "";

        if (snapshot.empty) {

          grid.innerHTML = `
            <div class="empty-card">
              No profiles yet.
              Create the first Kmeet account ❤️
            </div>
          `;

          return;
        }

        snapshot.forEach(snap => {

          const p = snap.data();

          const name =
            p.name ||
            p.username ||
            "Kmeet Member";

          const age =
            p.age
              ? `, ${p.age}`
              : "";

          /*
            Support both names because some of
            your existing profiles use avatar and
            others use photoURL.
          */

          const avatar =
            p.photoURL ||
            p.avatar ||
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=700&q=80";

          const interests =
            Array.isArray(p.interests)
              ? p.interests.slice(0, 3)
              : [];

          const location =
            p.location ||
            "Kenya";

          grid.insertAdjacentHTML(
            "beforeend",

            `
            <article class="profile-card">

              <div class="profile-photo-wrap">

                <img
                  class="profile-photo"
                  src="${escapeHtml(avatar)}"
                  alt="${escapeHtml(name)}"
                  loading="lazy"
                >

                <span class="online-dot"></span>

              </div>

              <div class="profile-inside">

                <h3 class="profile-name">
                  ${escapeHtml(name)}${age}
                </h3>

                <p class="profile-location">
                  ${escapeHtml(location)}
                </p>

                <div class="tags">

                  ${
                    interests.map(i => `
                      <span class="tag">
                        ${escapeHtml(i)}
                      </span>
                    `).join("")
                  }

                </div>

                <div class="profile-actions">

                  <a
                    class="profile-button"
                    href="profile.html?id=${encodeURIComponent(snap.id)}"
                  >
                    View Profile
                  </a>

                  <!-- IMPORTANT:
                       CHAT OPENS DIRECTLY.
                       NO SUBSCRIPTION PAGE FIRST.
                  -->

                  <a
                    class="chat-button"
                    href="chat.html?userId=${encodeURIComponent(snap.id)}"
                  >
                    💬 Chat
                  </a>

                </div>

              </div>

            </article>
            `
          );

        });

      },

      error => {

        console.error(error);

        document.getElementById("msg").innerHTML = `
          <div class="message">
            Could not load profiles.
            Please refresh the page.
          </div>
        `;

      }
    );

    function escapeHtml(value) {

      return String(value).replace(
        /[&<>"']/g,

        c => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[c])

      );

    }

  </script>

</body>
</html>
