  <style>

    /* =====================================================
       KMEET DISCOVER
       ===================================================== */

    body.discover-page {
      margin: 0 !important;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(118, 42, 73, 0.25),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(76, 35, 58, 0.20),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #120c10 0%,
          #24151b 50%,
          #0d0a0c 100%
        ) !important;

      color: #fff !important;

      font-family:
        "Poppins",
        Arial,
        sans-serif;
    }

    .discover-page *,
    .discover-page *::before,
    .discover-page *::after {
      box-sizing: border-box;
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .discover-page .discover-nav {
      width: 100%;
      min-height: 78px;
      padding: 0 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background:
        linear-gradient(
          180deg,
          rgba(20, 12, 16, 0.94),
          rgba(35, 19, 25, 0.86)
        );

      border-bottom:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 30px rgba(0,0,0,0.28);

      position: relative;
      z-index: 20;
    }

    .discover-page .discover-brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #fff !important;
      text-decoration: none !important;
    }

    .discover-page .discover-logo {
      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .discover-page .discover-heart {
      font-size: 18px;
      color: #e66a94;

      text-shadow:
        0 0 15px rgba(230,106,148,0.45);
    }

    .discover-page .discover-navlinks {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .discover-page .discover-navlinks a {
      color:
        rgba(255,255,255,0.88) !important;

      text-decoration: none !important;

      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.7px;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .discover-page .discover-navlinks a:hover {
      color: #f19ab7 !important;
      transform: translateY(-1px);
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .discover-page .discover-container {
      width:
        min(1280px, calc(100% - 40px));

      margin: 0 auto;
      padding: 52px 0 80px;
    }

    .discover-page .discover-heading {
      text-align: center;
      margin-bottom: 42px;
    }

    .discover-page .discover-heading h1 {
      margin: 0 0 12px;

      color: #fff;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size:
        clamp(36px, 5vw, 55px);

      font-weight: 600;
      line-height: 1.1;
    }

    .discover-page .discover-heading p {
      margin: 0;

      color:
        rgba(255,255,255,0.66);

      font-size: 15px;
    }


    /* =====================================================
       MEMBER COUNT
       ===================================================== */

    .discover-page .member-count {
      margin-top: 14px;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 15px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.10);

      color:
        rgba(255,255,255,0.62);

      font-size: 12px;
    }

    .discover-page .member-count-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #62d391;

      box-shadow:
        0 0 10px rgba(98,211,145,0.7);
    }


    /* =====================================================
       ACTIVITY / LIKES BAR
       ===================================================== */

    .discover-page .activity-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      margin: 0 0 24px;
      padding: 14px 18px;

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 18px;

      background:
        rgba(255,255,255,0.055);

      box-shadow:
        0 12px 30px rgba(0,0,0,0.16);
    }

    .discover-page .activity-copy strong {
      display: block;
      font-size: 14px;
    }

    .discover-page .activity-copy span {
      display: block;
      margin-top: 3px;

      color:
        rgba(255,255,255,0.62);

      font-size: 12px;
    }

    .discover-page .likes-link {
      flex: 0 0 auto;

      padding: 10px 15px;

      border-radius: 999px;

      color: #fff !important;
      text-decoration: none !important;

      background:
        linear-gradient(
          135deg,
          #a83d68,
          #d85d8c
        );

      font-size: 12px;
      font-weight: 600;
    }


    /* =====================================================
       PROFILE GRID
       ===================================================== */

    .discover-page .discover-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(265px, 1fr)
        );

      gap: 26px;
      width: 100%;
    }


    /* =====================================================
       PROFILE CARD
       ===================================================== */

    .discover-page .profile-card {
      overflow: hidden;
      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(65,43,52,0.76),
          rgba(25,17,21,0.92)
        ) !important;

      border:
        1px solid rgba(255,255,255,0.13) !important;

      border-radius:
        22px !important;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.06) !important;

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .discover-page .profile-card:hover {
      transform:
        translateY(-6px);

      box-shadow:
        0 25px 55px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.08) !important;
    }


    /* =====================================================
       PHOTO
       ===================================================== */

    .discover-page .photo-wrap {
      position: relative;

      width: 100%;
      height: 310px;

      overflow: hidden;

      background:
        #1b1116;
    }

    .discover-page .profile-card > .photo-wrap img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      border: 0;

      transition:
        transform 0.35s ease,
        opacity 0.25s ease;
    }

    .discover-page .profile-card:hover
    .photo-wrap img {
      transform:
        scale(1.035);
    }


    /* =====================================================
       STATUS
       ===================================================== */

    .discover-page .status-badge {
      position: absolute;

      left: 14px;
      bottom: 14px;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border-radius: 999px;

      background:
        rgba(12,8,11,0.76);

      border:
        1px solid rgba(255,255,255,0.15);

      backdrop-filter:
        blur(10px);

      color:
        rgba(255,255,255,0.90);

      font-size: 11px;
      font-weight: 500;
    }

    .discover-page .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
    }

    .discover-page .status-dot.online {
      background: #61d18b;

      box-shadow:
        0 0 9px rgba(97,209,139,0.8);
    }

    .discover-page .status-dot.offline {
      background: #8c8c8c;
    }


    /* =====================================================
       CARD CONTENT
       ===================================================== */

    .discover-page .profile-inside {
      padding: 21px;
    }

    .discover-page .profile-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
      margin-bottom: 6px;
    }

    .discover-page .profile-inside h3 {
      margin: 0;

      color: #fff;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 22px;
      font-weight: 600;
      line-height: 1.2;
    }

    .discover-page .profile-location {
      margin: 0 0 8px;

      color:
        rgba(255,255,255,0.58);

      font-size: 13px;
    }

    .discover-page .profile-description {
      margin: 0 0 15px;

      color:
        rgba(255,255,255,0.72);

      font-size: 12px;
      line-height: 1.65;

      min-height: 40px;
    }


    /* =====================================================
       INTEREST TAGS
       ===================================================== */

    .discover-page .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .discover-page .tag {
      display: inline-block;

      padding: 6px 10px;

      color:
        rgba(255,255,255,0.82);

      background:
        rgba(230,106,148,0.08);

      border:
        1px solid rgba(230,106,148,0.18);

      border-radius: 30px;

      font-size: 11px;
    }


    /* =====================================================
       ACTIONS
       ===================================================== */

    .discover-page .profile-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;

      margin-top: 20px;
    }

    .discover-page .profile-button,
    .discover-page .like-button {
      min-height: 44px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 9px 12px;

      border-radius: 11px;

      font-family:
        "Poppins",
        Arial,
        sans-serif;

      font-size: 12px;
      font-weight: 600;

      text-decoration: none !important;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .discover-page .profile-button:hover,
    .discover-page .like-button:hover {
      transform:
        translateY(-2px);
    }


    /* VIEW */

    .discover-page .view-button {
      color: #fff !important;

      background:
        rgba(255,255,255,0.07);

      border:
        1px solid rgba(255,255,255,0.14);
    }

    .discover-page .view-button:hover {
      background:
        rgba(255,255,255,0.11);

      box-shadow:
        0 8px 18px rgba(0,0,0,0.20);
    }


    /* CHAT */

    .discover-page .chat-button {
      color: #fff !important;

      background:
        linear-gradient(
          135deg,
          #e66a94,
          #a9426d
        );

      border:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 20px rgba(150,47,88,0.28);
    }

    .discover-page .chat-button:hover {
      box-shadow:
        0 12px 25px rgba(150,47,88,0.40);
    }


    /* LIKE */

    .discover-page .like-button {
      width: 100%;

      color: #fff;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.14);
    }

    .discover-page .like-button:hover {
      background:
        rgba(230,106,148,0.12);
    }

    .discover-page .like-button.liked {
      color: #ff9fbe;

      background:
        rgba(216,93,140,0.20);

      border-color:
        rgba(216,93,140,0.45);

      box-shadow:
        0 8px 20px rgba(150,47,88,0.18);
    }

    .discover-page .like-button:disabled {
      cursor: default;
      opacity: 0.7;
    }


    /* =====================================================
       EMPTY
       ===================================================== */

    .discover-page .empty-card {
      grid-column: 1 / -1;

      padding: 50px 25px;

      text-align: center;

      color:
        rgba(255,255,255,0.72);

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 20px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .discover-page .discover-nav {
        padding: 0 18px;
      }

      .discover-page .discover-logo {
        font-size: 25px;
      }

      .discover-page .discover-navlinks {
        gap: 14px;
      }

      .discover-page .discover-navlinks a {
        font-size: 11px;
      }

      .discover-page .discover-container {
        width:
          min(
            calc(100% - 26px),
            600px
          );

        padding-top: 35px;
      }

      .discover-page .photo-wrap {
        height: 300px;
      }

      .discover-page .activity-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .discover-page .likes-link {
        width: 100%;
        text-align: center;
      }
    }


    @media (max-width: 430px) {

      .discover-page .discover-navlinks a:nth-child(3) {
        display: none;
      }

      .discover-page .discover-grid {
        grid-template-columns: 1fr;
      }

      .discover-page .photo-wrap {
        height: 330px;
      }
    }

  </style>
</head>

       ["Art","Fashion","Movies"]],

      ["demo-30","George",34,"Mombasa, Kenya",true,
       "Travel and photography are my favorite ways to experience life.",
       ["Travel","Ocean","Photography"]],

      ["demo-31","Ruth",28,"Nairobi, Kenya",true,
       "I love cooking, music and spending time outdoors.",
       ["Cooking","Music","Nature"]],

      ["demo-32","Martin",31,"Eldoret, Kenya",false,
       "Sports and technology keep me busy, with books for quiet evenings.",
       ["Sports","Books","Technology"]],

      ["demo-33","Angela",30,"Nairobi, Kenya",true,
       "Travel, fashion and good food are always welcome.",
       ["Travel","Fashion","Food"]],

      ["demo-34","Patrick",29,"Kisumu, Kenya",true,
       "Music, cars and travelling make a great combination for me.",
       ["Music","Cars","Travel"]],

      ["demo-35","Stella",27,"Nairobi, Kenya",false,
       "Yoga, nature and books are my favorite ways to slow down.",
       ["Yoga","Nature","Books"]],

      ["demo-36","William",32,"Nakuru, Kenya",true,
       "Business, football and travel keep life interesting.",
       ["Business","Football","Travel"]]

    ].map((p, index) => ({
      id: p[0],
      name: p[1],
      age: p[2],
      location: p[3],
      online: p[4],
      photo: backupPhotos[index],
      description: p[5],
      interests: p[6],
      demo: true
    }));


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /[&<>"']/g,

          c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[c])
        );

    }


    /* =====================================================
       REAL FIREBASE USER PROFILE
       ===================================================== */

    function getRealProfile(
      snap,
      index
    ) {

      const p =
        snap.data() || {};


      const name =
        p.name ||
        p.username ||
        p.displayName ||
        "Kmeet Member";


      let age = "";

      if (
        p.age !== undefined &&
        p.age !== null &&
        String(p.age).trim() !== ""
      ) {

        age =
          `, ${escapeHtml(p.age)}`;

      }


      const photo =
        p.photoURL ||
        p.photoUrl ||
        p.avatar ||
        p.profilePhoto ||
        p.profileImage ||
        p.image ||
        getBackupPhoto(index);


      const interests =
        Array.isArray(p.interests)
          ? p.interests.slice(0, 4)
          : [];


      const description =
        p.description ||
        p.bio ||
        p.about ||
        p.intro ||
        "Getting to know people and discovering meaningful connections on Kmeet.";


      const online =
        p.online === true ||
        String(
          p.status || ""
        ).toLowerCase() === "online";


      return {

        id: snap.id,

        name,

        age,

        location:
          p.location ||
          p.city ||
          "Kenya",

        photo,

        description,

        interests,

        online,

        demo: false

      };

    }


    /* =====================================================
       IMAGE FALLBACK
       ===================================================== */

    function finalImageFallback() {

      return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="800"
            height="1000"
            viewBox="0 0 800 1000"
          >

            <defs>

              <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1"
                y2="1"
              >

                <stop
                  offset="0%"
                  stop-color="#6b2946"
                />

                <stop
                  offset="100%"
                  stop-color="#1a0e14"
                />

              </linearGradient>

            </defs>

            <rect
              width="800"
              height="1000"
              fill="url(#bg)"
            />

            <circle
              cx="400"
              cy="360"
              r="120"
              fill="rgba(255,255,255,0.20)"
            />

            <path
              d="
                M180 850
                C210 650 590 650 620 850
                Z
              "
              fill="rgba(255,255,255,0.20)"
            />

            <text
              x="400"
              y="930"
              text-anchor="middle"
              font-family="Georgia, serif"
              font-size="58"
              fill="white"
            >
              Kmeet
            </text>

          </svg>
        `);

    }


    function imageFallback(img) {

      const current =
        Number(
          img.dataset.fallbackIndex || "0"
        );


      if (
        current <
        backupPhotos.length - 1
      ) {

        const next =
          current + 1;

        img.dataset.fallbackIndex =
          String(next);

        img.src =
          getBackupPhoto(next);

        return;

      }


      img.onerror = null;

      img.src =
        finalImageFallback();

    }


    /* =====================================================
       LIKES
       ===================================================== */

    const ANON_LIKES_KEY =
      "kmeet_anonymous_likes_v1";

    const MEMBER_LIKES_KEY =
      "kmeet_member_likes_v1";


    function readLikes(key) {

      try {

        const value =
          JSON.parse(
            localStorage.getItem(key) || "[]"
          );

        return Array.isArray(value)
          ? value
          : [];

      } catch {

        return [];

      }

    }


    function writeLikes(
      key,
      value
    ) {

      try {

        localStorage.setItem(
          key,
          JSON.stringify(value)
        );

      } catch (error) {

        console.warn(
          "Kmeet could not save local likes.",
          error
        );

      }

    }


    function likeStorageKey(user) {

      if (
        user &&
        !user.isAnonymous
      ) {

        return (
          MEMBER_LIKES_KEY +
          "_" +
          user.uid
        );

      }

      return ANON_LIKES_KEY;

    }


    function hasLiked(
      user,
      targetId
    ) {

      return readLikes(
        likeStorageKey(user)
      ).some(
        item =>
          item.targetId === targetId
      );

    }


    async function saveLike(
      targetId,
      targetName,
      targetIsDemo
    ) {

      const user =
        auth.currentUser;

      const storageKey =
        likeStorageKey(user);

      const likes =
        readLikes(storageKey);


      if (
        likes.some(
          item =>
            item.targetId === targetId
        )
      ) {

        return false;

      }


      likes.push({

        targetId,

        targetName,

        demo:
          !!targetIsDemo,

        createdAt:
          Date.now()

      });


      writeLikes(
        storageKey,
        likes
      );


      /*
       * For a registered Kmeet member,
       * also try to save the like in Firebase.
       *
       * Demo profiles do not have real Firebase
       * user documents, so their likes stay local.
       */

      if (
        user &&
        !user.isAnonymous &&
        !targetIsDemo
      ) {

        try {

          await setDoc(

            doc(
              db,
              "users",
              targetId,
              "likesReceived",
              user.uid
            ),

            {
              fromUserId:
                user.uid,

              targetUserId:
                targetId,

              createdAt:
                serverTimestamp()

            },

            {
              merge: true
            }

          );

        } catch (error) {

          console.warn(
            "Kmeet saved the like locally. Firebase did not accept the like yet.",
            error
          );

        }

      }


      return true;

    }


    function refreshLikeButtons() {

      document
        .querySelectorAll(
          "[data-like-id]"
        )
        .forEach(
          button => {

            const liked =
              hasLiked(
                currentUser,
                button.dataset.likeId
              );


            button.classList.toggle(
              "liked",
              liked
            );


            button.textContent =
              liked
                ? "♥ Liked"
                : "♥ Like";

          }
        );

    }


    function updateActivity() {

      const likes =
        readLikes(
          likeStorageKey(
            currentUser
          )
        );


      if (
        currentUser &&
        !currentUser.isAnonymous
      ) {

        if (likes.length) {

          activityTitle.textContent =
            `❤️ You liked ${likes.length} ${
              likes.length === 1
                ? "person"
                : "people"
            }`;

          activitySubtitle.textContent =
            "Your likes are saved with your Kmeet account.";

        } else {

          activityTitle.textContent =
            "❤️ Welcome to Kmeet";

          activitySubtitle.textContent =
            "Discover people and send your first like.";

        }

      } else {

        if (likes.length) {

          activityTitle.textContent =
            `❤️ ${likes.length} ${
              likes.length === 1
                ? "profile liked"
                : "profiles liked"
            }`;

          activitySubtitle.textContent =
            "Your likes are saved on this browser.";

        } else {

          activityTitle.textContent =
            "❤️ Find your first connection";

          activitySubtitle.textContent =
            "You can like profiles without creating an account.";

        }

      }

    }


    /* =====================================================
       RENDER PROFILE
       ===================================================== */

    function renderProfile(
      person,
      index
    ) {

      const statusText =
        person.online
          ? "Online"
          : "Offline";


      const statusClass =
        person.online
          ? "online"
          : "offline";


      const tags =
        person.interests &&
        person.interests.length

          ? person.interests
              .slice(0, 4)
              .map(
                interest => `
                  <span class="tag">
                    ${escapeHtml(interest)}
                  </span>
                `
              )
              .join("")

          : `
              <span class="tag">
                Getting to know Kmeet
              </span>
            `;


      const liked =
        hasLiked(
          currentUser,
          person.id
        );


      let actions = "";


      if (!person.demo) {

        actions = `

          <a
            class="profile-button view-button"
            href="profile.html?id=${encodeURIComponent(person.id)}"
          >
            View Profile
          </a>

          <button
            type="button"
            class="like-button ${liked ? "liked" : ""}"
            data-like-id="${escapeHtml(person.id)}"
            data-like-name="${escapeHtml(person.name)}"
          >
            ${liked ? "♥ Liked" : "♥ Like"}
          </button>

          <a
            class="profile-button chat-button"
            href="chat.html?userId=${encodeURIComponent(person.id)}"
          >
            ♥ Chat
          </a>

        `;

      } else {

        actions = `

          <a
            class="profile-button view-button"
            href="login.html"
          >
            View Profile
          </a>

          <button
            type="button"
            class="like-button ${liked ? "liked" : ""}"
            data-like-id="${escapeHtml(person.id)}"
            data-like-name="${escapeHtml(person.name)}"
          >
            ${liked ? "♥ Liked" : "♥ Like"}
          </button>

          <a
            class="profile-button chat-button"
            href="chat.html?userId=${encodeURIComponent(person.id)}"
          >
            ♥ Chat
          </a>

        `;

      }


      const safePhoto =
        person.photo ||
        getBackupPhoto(index);


      return `

        <article
          class="profile-card"
          data-profile-id="${escapeHtml(person.id)}"
        >

          <div class="photo-wrap">

            <img
              src="${escapeHtml(safePhoto)}"
              alt="${escapeHtml(person.name)}"
              loading="lazy"
              data-fallback-index="${index % backupPhotos.length}"
              onerror="imageFallback(this)"
            >

            <div class="status-badge">

              <span
                class="status-dot ${statusClass}"
              ></span>

              ${statusText}

            </div>

          </div>


          <div class="profile-inside">

            <div class="profile-name-row">

              <h3>
                ${escapeHtml(person.name)}
                ${person.age ? `, ${escapeHtml(person.age)}` : ""}
              </h3>

            </div>


            <p class="profile-location">
              ${escapeHtml(person.location)}
            </p>


            <p class="profile-description">
              ${escapeHtml(person.description)}
            </p>


            <div class="tags">
              ${tags}
            </div>


            <div class="profile-actions">
              ${actions}
            </div>

          </div>

        </article>

      `;

    }


    /* =====================================================
       RENDER ALL PROFILES
       ===================================================== */

    function renderProfiles(
      realProfiles
    ) {

      const usedIds =
        new Set();


      const cleanReal =
        realProfiles.filter(
          person => {

            if (
              usedIds.has(
                person.id
              )
            ) {

              return false;

            }


            usedIds.add(
              person.id
            );

            return true;

          }
        );


      /*
       * Keep at least 36 visible profiles.
       */

      const needed =
        Math.max(
          36 - cleanReal.length,
          0
        );


      const demos =
        demoProfiles.slice(
          0,
          needed
        );


      const allProfiles =
        [
          ...cleanReal,
          ...demos
        ];


      if (
        !allProfiles.length
      ) {

        grid.innerHTML = `

          <div class="empty-card">
            No profiles are available yet.
          </div>

        `;

        memberCount.textContent =
          "People are joining Kmeet";

        return;

      }


      grid.innerHTML =
        allProfiles
          .map(
            (person, index) =>
              renderProfile(
                person,
                index
              )
          )
          .join("");


      memberCount.textContent =
        `${allProfiles.length} people to discover`;


      refreshLikeButtons();

    }


    /* =====================================================
       LIKE BUTTON
       ===================================================== */

    document.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest(
            "[data-like-id]"
          );


        if (!button) {
          return;
        }


        const targetId =
          button.dataset.likeId;


        const targetName =
          button.dataset.likeName ||
          "this profile";


        const targetIsDemo =
          targetId.startsWith(
            "demo-"
          );


        if (
          hasLiked(
            currentUser,
            targetId
          )
        ) {

          return;

        }


        button.disabled = true;


        try {

          const saved =
            await saveLike(
              targetId,
              targetName,
              targetIsDemo
            );


          if (saved) {

            button.classList.add(
              "liked"
            );

            button.textContent =
              "♥ Liked";

            updateActivity();

          }

        } catch (error) {

          console.error(
            "Kmeet like error:",
            error
          );

        } finally {

          button.disabled =
            false;

        }

      }
    );


    /* =====================================================
       AUTH STATE
       ===================================================== */

    onAuthStateChanged(
      auth,
      user => {

        currentUser =
          user || null;


        const profileLink =
          document.getElementById(
            "profileLink"
          );


        if (
          user &&
          !user.isAnonymous
        ) {

          profileLink.href =
            "profile.html";

        } else {

          profileLink.href =
            "login.html";

        }


        updateActivity();

        refreshLikeButtons();

      }
    );


    /* =====================================================
       SHOW 36 PROFILES IMMEDIATELY
       ===================================================== */

    renderProfiles([]);


    /* =====================================================
       FIREBASE REAL MEMBERS
       ===================================================== */

    try {

      onSnapshot(

        collection(
          db,
          "users"
        ),

        snapshot => {

          const realProfiles = [];


          snapshot.forEach(
            snap => {

              const data =
                snap.data() || {};


              /*
               * Only display profiles that contain
               * recognizable profile information.
               */

              if (

                data.name ||
                data.username ||
                data.displayName ||
                data.photoURL ||
                data.photoUrl ||
                data.avatar ||
                data.profilePhoto ||
                data.profileImage

              ) {

                /*
                 * Never display the current user's
                 * own profile in Discover.
                 */

                if (
                  currentUser &&
                  !currentUser.isAnonymous &&
                  snap.id === currentUser.uid
                ) {

                  return;

                }


                realProfiles.push(
                  getRealProfile(
                    snap,
                    realProfiles.length
                  )
                );

              }

            }
          );


          msg.innerHTML = "";


          renderProfiles(
            realProfiles
          );

        },

        error => {

          console.error(
            "Kmeet Discover Firebase error:",
            error
          );


          /*
           * Keep Discover usable even if
           * Firebase temporarily fails.
           */

          renderProfiles([]);

          msg.innerHTML = "";

        }

      );

    } catch (error) {

      console.error(
        "Kmeet Discover startup error:",
        error
      );


      renderProfiles([]);

      msg.innerHTML = "";

    }

  </script>
