       ===================================================== */

    body.discover-page {
      margin: 0 !important;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(118, 42, 73, 0.25),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(76, 35, 58, 0.20),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #120c10 0%,
          #24151b 50%,
          #0d0a0c 100%
        ) !important;

      color: #fff !important;

      font-family:
        "Poppins",
        Arial,
        sans-serif;
    }

    .discover-page *,
    .discover-page *::before,
    .discover-page *::after {
      box-sizing: border-box;
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .discover-page .discover-nav {

      width: 100%;
      min-height: 78px;

      padding: 0 50px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background:
        linear-gradient(
          180deg,
          rgba(20, 12, 16, 0.94),
          rgba(35, 19, 25, 0.86)
        );

      border-bottom:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 8px 30px rgba(0,0,0,0.28);

      position: relative;
      z-index: 20;
    }


    /* LOGO */

    .discover-page .discover-brand {

      display: flex;
      align-items: center;
      gap: 10px;

      color: #fff !important;

      text-decoration: none !important;
    }

    .discover-page .discover-logo {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 30px;
      font-weight: 700;

      letter-spacing: 1px;
    }

    .discover-page .discover-heart {

      font-size: 18px;

      color: #e66a94;

      text-shadow:
        0 0 15px rgba(230,106,148,0.45);
    }


    /* NAV LINKS */

    .discover-page .discover-navlinks {

      display: flex;
      align-items: center;

      gap: 30px;
    }

    .discover-page .discover-navlinks a {

      color:
        rgba(255,255,255,0.88) !important;

      text-decoration: none !important;

      font-size: 14px;
      font-weight: 500;

      letter-spacing: 0.7px;

      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .discover-page .discover-navlinks a:hover {

      color: #f19ab7 !important;

      transform:
        translateY(-1px);
    }

       MAIN
       ===================================================== */

    .discover-page .discover-container {

      width:
        min(1280px, calc(100% - 40px));

      margin:
        0 auto;

      padding:
        52px 0 80px;
    }

    .discover-page .discover-heading {

      text-align: center;

      margin-bottom:
        42px;
    }

    .discover-page .discover-heading h1 {

      margin:
        0 0 12px;

      color: #fff;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size:
        clamp(36px, 5vw, 55px);

      font-weight: 600;

      line-height: 1.1;

      letter-spacing:
        -0.5px;
    }

    .discover-page .discover-heading p {

      margin: 0;

      color:
        rgba(255,255,255,0.66);

      font-size: 15px;
    }


    /* MEMBER COUNT */

    .discover-page .member-count {

      margin-top: 14px;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        7px 15px;

      border-radius:
        999px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.10);

      color:
        rgba(255,255,255,0.62);

      font-size: 12px;
    }

    .discover-page .member-count-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #62d391;

      box-shadow:
        0 0 10px rgba(98,211,145,0.7);
    }


    /* =====================================================
       MESSAGE
       ===================================================== */

    .discover-page #msg {

      margin-bottom: 25px;
    }

    .discover-page .message {

      padding:
        15px 20px;

      border-radius:
        12px;

      background:
        rgba(255,255,255,0.07);

      border:
        1px solid rgba(255,255,255,0.11);
    }

    .discover-page .message.error {

      color:
        #ffb4b4;

      border-color:
        rgba(255,100,100,0.30);
    }


    /* =====================================================
       PROFILE GRID
       ===================================================== */

    .discover-page .discover-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(265px, 1fr)
        );

      gap: 26px;

      width: 100%;
    }


    /* =====================================================
       PROFILE CARD
       ===================================================== */

    .discover-page .profile-card {

      overflow: hidden;

      position: relative;

      background:
        linear-gradient(
          145deg,
          rgba(65,43,52,0.76),
          rgba(25,17,21,0.92)
        ) !important;

      border:
        1px solid rgba(255,255,255,0.13) !important;

      border-radius:
        22px !important;

      box-shadow:
        0 18px 45px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(255,255,255,0.06) !important;

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .discover-page .profile-card:hover {

      transform:
        translateY(-6px);

      box-shadow:
        0 25px 55px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.08) !important;
    }

       PHOTO
       ===================================================== */

    .discover-page .photo-wrap {

      position: relative;

      width: 100%;

      height: 310px;

      overflow: hidden;

      background:
        #1b1116;
    }

    .discover-page .profile-card > .photo-wrap img {

      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      border: 0;

      transition:
        transform 0.35s ease;
    }

    .discover-page .profile-card:hover
    .photo-wrap img {

      transform:
        scale(1.035);
    }

       ONLINE / OFFLINE STATUS
       ===================================================== */

    .discover-page .status-badge {

      position: absolute;

      left: 14px;
      bottom: 14px;

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding:
        7px 11px;

      border-radius:
        999px;

      background:
        rgba(12,8,11,0.76);

      border:
        1px solid rgba(255,255,255,0.15);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      color:
        rgba(255,255,255,0.90);

      font-size: 11px;

      font-weight: 500;
    }

    .discover-page .status-dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      flex: 0 0 auto;

    .discover-page .status-dot.online {

      margin-top:

      letter-spacing:

      background:
        rgba(255,255,255,0.11);

      box-shadow:

      border:
        1px solid rgba(255,255,255,0.12);

      box-shadow:

    .discover-page .chat-button:hover {

      box-shadow:
        0 12px 25px rgba(150,47,88,0.40);
    }

    .discover-page .demo-button {

      opacity:
        0.65;

      cursor:
        default;
    }

       EMPTY
       ===================================================== */

    .discover-page .empty-card {

      grid-column:
        1 / -1;

      padding:
        50px 25px;

      text-align:
        center;

      color:
        rgba(255,255,255,0.72);

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius:
        20px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .discover-page .discover-nav {

        padding:

      }

      .discover-page .discover-logo {

        font-size:
          25px;
      }

      .discover-page .discover-navlinks {

        gap:
          14px;
      }

      .discover-page .discover-navlinks a {

          11px;
      }

      .discover-page .discover-container {

        width:
          min(
            calc(100% - 26px),
            600px
          );

        padding-top:
          35px;
      }

      .discover-page .photo-wrap {

        height:
          300px;
      }

      .discover-page .profile-actions {

        grid-template-columns:
          1fr 1fr;
      }

    }


    @media (max-width: 430px) {

      .discover-page .discover-navlinks a:nth-child(3) {

        display:
          none;
      }

      .discover-page .discover-grid {

        grid-template-columns:
          1fr;
      }

      .discover-page .photo-wrap {

        height:
          330px;
      }

    }

  </style>
</head>

    /* =====================================================
       ELEMENTS
       ===================================================== */

    const grid =
      document.getElementById("grid");

    const msg =
      document.getElementById("msg");

    const memberCount =
      document.getElementById("memberCount");


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /[&<>"']/g,

          c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[c])
        );

    }


    /* =====================================================
       REAL FIREBASE USERS
       ===================================================== */

    function getRealProfile(snap) {

      const p =
        snap.data() || {};

      return {

        id: snap.id,

        name:
          p.name ||
          p.username ||
          "Kmeet Member",

        age:
          p.age
            ? `, ${p.age}`
            : "",

        location:
          p.location ||
          "Kenya",

        photo:
          p.photoURL ||
          p.avatar ||
          "",

        description:
          p.description ||
          p.bio ||
          "Tell people a little about yourself and what makes you unique.",

        interests:
          Array.isArray(p.interests)
            ? p.interests.slice(0, 4)
            : [],

        online:
          p.online === true ||
          String(p.status || "")
            .toLowerCase() === "online",

        demo: false

      };

    }


    /* =====================================================
       RENDER ONE PROFILE
       ===================================================== */

    function renderProfile(person) {

      const statusText =
        person.online
          ? "Online"
          : "Offline";

      const statusClass =
        person.online
          ? "online"
          : "offline";


      const tags =
        person.interests &&
        person.interests.length

          ? person.interests
              .slice(0, 4)
              .map(
                interest => `
                  <span class="tag">
                    ${escapeHtml(interest)}
                  </span>
                `
              )
              .join("")

          : `
              <span class="tag">
                Getting to know Kmeet
              </span>
            `;


      let actions;


      if (!person.demo) {

        actions = `

          <a
            class="profile-button view-button"
            href="profile.html?id=${encodeURIComponent(person.id)}"
          >
            View Profile
          </a>

          <a
            class="profile-button chat-button"
            href="chat.html?userId=${encodeURIComponent(person.id)}"
          >
            ♥ Chat
          </a>

        `;

      } else {

        actions = `

          <a
            class="profile-button view-button"
            href="login.html"
          >
            View Profile
          </a>

          <a
            class="profile-button chat-button demo-button"
            href="login.html"
          >
            ♥ Chat
          </a>

        `;

      }


      /*
       * No LEGO placeholder.
       */

      const photoHtml =
        person.photo

          ? `
            <img
              src="${escapeHtml(person.photo)}"
              alt="${escapeHtml(person.name)}"
              loading="lazy"
              decoding="async"
              onerror="
                this.onerror=null;
                this.style.opacity='0';
              "
            >
          `

          : `
            <div
              style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                background:
                  linear-gradient(
                    135deg,
                    #3b202d,
                    #171015
                  );
                font-family:'Playfair Display',Georgia,serif;
                font-size:58px;
                color:rgba(255,255,255,.8);
              "
            >
              ${escapeHtml(
                String(person.name || "K")
                  .charAt(0)
                  .toUpperCase()
              )}
            </div>
          `;


      return `

        <article
          class="profile-card"
          data-profile-id="${escapeHtml(person.id)}"
        >

          <div class="photo-wrap">

            ${photoHtml}

            <div class="status-badge">

              <span
                class="status-dot ${statusClass}"
              ></span>

              ${statusText}

            </div>

          </div>


          <div class="profile-inside">

            <div class="profile-name-row">

              <h3>
                ${escapeHtml(person.name)}
                ${escapeHtml(person.age)}
              </h3>

            </div>


            <p class="profile-location">

              ${escapeHtml(person.location)}

            </p>


            <p class="profile-description">

              ${escapeHtml(person.description)}

            </p>


            <div class="tags">

              ${tags}

            </div>


            <div class="profile-actions">

              ${actions}

            </div>

          </div>

        </article>

      `;

    }


    /* =====================================================
       DRAW PROFILES
       ===================================================== */

    function renderProfiles(realProfiles) {

      const usedIds =
        new Set();

      const cleanReal =
        realProfiles.filter(
          person => {

            if (
              usedIds.has(
                person.id
              )
            ) {

              return false;

            }

            usedIds.add(
              person.id
            );

            return true;

          }
        );


      /*
       * Keep at least 36 people visible.
       */

      const needed =
        Math.max(
          36 - cleanReal.length,
          0
        );


      const demo =
        demoProfiles.slice(
          0,
          needed
        );


      const allProfiles = [
        ...cleanReal,
        ...demo
      ];


      grid.innerHTML =
        allProfiles
          .map(
            renderProfile
          )
          .join("");


      memberCount.textContent =
        `${allProfiles.length} people to discover`;

    }


    /* =====================================================
       FIREBASE LISTENER
       ===================================================== */

    onSnapshot(

      collection(
        db,
        "users"
      ),

      snapshot => {

        const realProfiles = [];


        snapshot.forEach(
          snap => {

            const data =
              snap.data() || {};


            if (
              data.name ||
              data.username ||
              data.photoURL ||
              data.avatar
            ) {

              realProfiles.push(
                getRealProfile(
                  snap
                )
              );

            }

          }
        );


        renderProfiles(
          realProfiles
        );

      },


      error => {

        console.error(
          "Kmeet Discover error:",
          error
        );


        /*
         * Keep Discover populated
         * even if Firebase has a problem.
         */

        renderProfiles([]);


        msg.innerHTML = `

          <div class="message error">

            We couldn't load the latest member updates,
            so you're seeing the Discover preview.

          </div>

        `;

      }

    );

  </script>
