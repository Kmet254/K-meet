       ===================================================== */

      color: #fff !important;

      font-family:
        "Poppins",
        Arial,
        sans-serif;
    }

    .discover-page *::before,
    .discover-page *::after {
      box-sizing: border-box;
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .discover-page .discover-nav {

      width: 100%;
      min-height: 78px;

      padding: 0 50px;

      display: flex;
      align-items: center;

      z-index: 20;

    /* LOGO */

    .discover-page .discover-brand {

      display: flex;
      align-items: center;
      gap: 10px;

      color: #fff !important;

      text-decoration: none !important;
    }

    .discover-page .discover-logo {

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 30px;
      font-weight: 700;

      letter-spacing: 1px;
    }

    .discover-page .discover-logo-image {
      width: 54px;
      height: 54px;
      min-width: 54px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
      background: rgba(255,255,255,0.96);

  <script type="module">

    import {
      auth,
      db,
      onAuthStateChanged,
      collection,
      onSnapshot,
      doc,
      setDoc,
      serverTimestamp,
      database,
      databaseRef,
      databaseSet,
      databaseOnValue,
      onDisconnect,
      databaseServerTimestamp
    } from "./firebase-config.js";


    /* =====================================================
       PROFILE LINK
       ===================================================== */

    onAuthStateChanged(
      auth,
      user => {

        const profileLink =
          document.getElementById("profileLink");

        if (
          user &&
          !user.isAnonymous
        ) {

          profileLink.href =
            "profile.html";

        } else {

          profileLink.href =
            "login.html";

        }

        updateActivity(user);
        refreshLikeButtons();
        startOwnPresence(user);

      }
    );


    /* =====================================================
       LIVE PRESENCE
       ===================================================== */

    const presenceUnsubscribers = new Map();
    let ownPresenceStarted = false;

    function validPresenceId(value) {
      return typeof value === "string" &&
        value.length > 0 &&
        !/[.#$\[\]]/.test(value);
    }

    function setStatusBadge(badge, online) {
      if (!badge) return;
      badge.className = `status-badge ${online ? "online" : "offline"}`;
      badge.innerHTML = `
        <span class="status-dot ${online ? "online" : "offline"}"></span>
        ${online ? "Online" : "Offline"}
      `;
    }

    function listenToPresence(profileId, badge) {
      // Legacy records such as juxleezbetshaz@gmail.com are not valid
      // Realtime Database path IDs because they contain a period.
      if (!validPresenceId(profileId)) {
        setStatusBadge(badge, false);
        return;
      }

      const presenceRef = databaseRef(
        database,
        `status/${profileId}/connections`
      );

      const unsubscribe = databaseOnValue(
        presenceRef,
        snapshot => {
          setStatusBadge(badge, snapshot.exists());
        },
        error => {
          console.warn("Kmeet presence check failed for", profileId, error);
          setStatusBadge(badge, false);
        }
      );

      presenceUnsubscribers.set(profileId, unsubscribe);
    }

    function refreshPresenceListeners() {
      presenceUnsubscribers.forEach(unsubscribe => {
        try { unsubscribe(); } catch (_) {}
      });
      presenceUnsubscribers.clear();

      document.querySelectorAll(".profile-card[data-profile-id]").forEach(card => {
        const profileId = card.dataset.profileId;
        const badge = card.querySelector(".status-badge");
        if (!profileId || profileId.startsWith("demo-")) return;
        listenToPresence(profileId, badge);
      });
    }

    function startOwnPresence(user) {
      if (ownPresenceStarted || !user || user.isAnonymous || !validPresenceId(user.uid)) return;
      ownPresenceStarted = true;

      const connectedRef = databaseRef(database, ".info/connected");
      databaseOnValue(connectedRef, async snapshot => {
        if (snapshot.val() !== true) return;

        const connectionId = databaseRef(database).key || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const connectionRef = databaseRef(
          database,
          `status/${user.uid}/connections/${connectionId}`
        );
        const lastOnlineRef = databaseRef(
          database,
          `status/${user.uid}/lastOnline`
        );

        try {
          await onDisconnect(connectionRef).remove();
          await onDisconnect(lastOnlineRef).set(databaseServerTimestamp());
          await databaseSet(connectionRef, true);
        } catch (error) {
          console.warn("Kmeet own presence could not be started:", error);
        }
      });
    }

    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /[&<>"']/g,

          c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[c])
        );

    }


    /* =====================================================
       REAL FIREBASE USER PROFILE
       ===================================================== */

    function getRealProfile(
      snap,
      index
    ) {

      const p =
        snap.data() || {};


      const name =
        p.name ||
        p.username ||
        p.displayName ||
        "Kmeet Member";


      let age = "";

      if (
        p.age !== undefined &&
        p.age !== null &&
        String(p.age).trim() !== ""
      ) {

        age = `, ${p.age}`;

      }


      /*
       * Kmeet may use different photo field names
       * depending on which version of the profile
       * page created the account.
       */

      const photo =
        p.photoURL ||
        p.photoUrl ||
        p.avatar ||
        p.profilePhoto ||
        p.profileImage ||
        p.image ||
        getBackupPhoto(index);


      const interests =
        Array.isArray(p.interests)
          ? p.interests.slice(0, 4)
          : [];


      const description =
        p.description ||
        p.bio ||
        p.about ||
        p.intro ||
        "Getting to know people and discovering meaningful connections on Kmeet.";


      const online =
        p.online === true ||
        String(
          p.status || ""
        ).toLowerCase() === "online";


      return {

        id: snap.id,

        name,

        age,

        location:
          p.location ||
          p.city ||
          "Kenya",

        photo,

        description,

        interests,

        online,

        demo: false

      };

    }

    /* =====================================================
       IMAGE ERROR HANDLER
       
       First failure:
       -> use another backup photo.

       Second failure:
       -> use the Kmeet visual fallback.

       This removes the old LEGO placeholder completely.
       ===================================================== */

    function imageFallback(img) {

      const current =
        Number(
          img.dataset.fallbackIndex || "0"
        );

      if (
        current < backupPhotos.length - 1
      ) {

        const next =
          current + 1;

        img.dataset.fallbackIndex =
          String(next);

        img.src =
          getBackupPhoto(next);

        return;

      }


      img.onerror = null;

      img.src =
        finalImageFallback();

    }

    /* =====================================================
       DRAW PROFILES
       ===================================================== */

    function renderProfiles(
      realProfiles
    ) {

      /*
       * Remove duplicate Firebase profiles.
       */

      const usedIds =
        new Set();


      const cleanReal =
        realProfiles.filter(
          person => {

            if (
              usedIds.has(
                person.id
              )
            ) {

              return false;

            }


            usedIds.add(
              person.id
            );


            return true;

          }
        );


      /*
       * Always keep at least 36
       * visible profiles.
       */

      const needed =
        Math.max(
          36 - cleanReal.length,
          0
        );


      const demo =
        demoProfiles.slice(
          0,
          needed
        );


      const allProfiles =
        [
          ...cleanReal,
          ...demo
        ];


      if (
        !allProfiles.length
      ) {

        grid.innerHTML = `

          <div class="empty-card">

            No profiles are available yet.

          </div>

        `;

        memberCount.textContent =
          "People are joining Kmeet";

        return;

      }


      grid.innerHTML =
        allProfiles
          .map(
            (person, index) =>
              renderProfile(
                person,
                index
              )
          )
          .join("");


      memberCount.textContent =
        `${allProfiles.length} people to discover`;

      refreshPresenceListeners();

    }


    /* =====================================================
       KMEET LIKES
       Anonymous visitors can like profiles locally.
       Registered members also try to save likes in
       Firestore; local state keeps the button responsive
       even when Firestore rules are not yet configured.
       ===================================================== */

    const ANON_LIKES_KEY = "kmeet_anonymous_likes_v1";
    const MEMBER_LIKES_KEY = "kmeet_member_likes_v1";

    function readLikes(key) {
      try { return JSON.parse(localStorage.getItem(key) || "[]"); }
      catch { return []; }
    }

    function writeLikes(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function likeStorageKey(user) {
      return user && !user.isAnonymous
        ? `${MEMBER_LIKES_KEY}_${user.uid}`
        : ANON_LIKES_KEY;
    }

    function hasLiked(user, targetId) {
      return readLikes(likeStorageKey(user)).some(x => x.targetId === targetId);
    }

    async function saveLike(targetId, targetName, targetIsDemo) {
      const user = auth.currentUser;
      const key = likeStorageKey(user);
      const likes = readLikes(key);

      if (likes.some(x => x.targetId === targetId)) return false;

      likes.push({
        targetId,
        targetName,
        demo: !!targetIsDemo,
        createdAt: Date.now()
      });
      writeLikes(key, likes);

      if (user && !user.isAnonymous && !targetIsDemo) {
        try {
          await setDoc(
            doc(db, "users", targetId, "likesReceived", user.uid),
            {
              fromUserId: user.uid,
              targetUserId: targetId,
              createdAt: serverTimestamp()
            },
            { merge: true }
          );
        } catch (error) {
          console.warn("Kmeet like saved locally; Firestore write was not available.", error);
        }
      }

      return true;
    }

    function refreshLikeButtons() {
      const user = auth.currentUser;
      document.querySelectorAll("[data-like-id]").forEach(button => {
        const liked = hasLiked(user, button.dataset.likeId);
        button.classList.toggle("liked", liked);
        button.textContent = liked ? "♥ Liked" : "♥ Like";
      });
    }

    function updateActivity(user) {
      const title = document.getElementById("activityTitle");
      const subtitle = document.getElementById("activitySubtitle");
      const likes = readLikes(likeStorageKey(user));

      if (user && !user.isAnonymous) {
        title.textContent = likes.length ? `❤️ You liked ${likes.length} ${likes.length === 1 ? "person" : "people"}` : "❤️ Welcome to Kmeet";
        subtitle.textContent = likes.length ? "Your likes are saved with this account." : "Your profile is live. Discover people and send your first like.";
      } else {
        title.textContent = likes.length ? `❤️ ${likes.length} ${likes.length === 1 ? "profile liked" : "profiles liked"}` : "❤️ Find your first connection";
        subtitle.textContent = likes.length ? "Your likes are saved for this browser session." : "You can like profiles without creating an account.";
      }
    }

    document.addEventListener("click", async event => {
      const button = event.target.closest("[data-like-id]");
      if (!button) return;

      const user = auth.currentUser;
      const targetId = button.dataset.likeId;
      const targetName = button.dataset.likeName || "this profile";
      const targetIsDemo = targetId.startsWith("demo-");

      if (hasLiked(user, targetId)) return;

      button.disabled = true;
      const saved = await saveLike(targetId, targetName, targetIsDemo);
      button.disabled = false;

      if (saved) {
        button.classList.add("liked");
        button.textContent = "♥ Liked";
        updateActivity(user);
      }
    });


    /* =====================================================
       SHOW DEMO PROFILES IMMEDIATELY
       
       This means Discover does not stay blank while
       Firebase is connecting.
       ===================================================== */

    renderProfiles([]);
    updateActivity(auth.currentUser);
    refreshLikeButtons();


    /* =====================================================
       FIREBASE LISTENER
       ===================================================== */

    try {

      onSnapshot(

        collection(
          db,
          "users"
        ),

        snapshot => {

          const realProfiles = [];


          snapshot.forEach(
            snap => {

              const data =
                snap.data() || {};


              /*
               * Accept users that contain either a name
               * or any supported photo/profile field.
               */

              if (

                data.name ||
                data.username ||
                data.displayName ||
                data.photoURL ||
                data.photoUrl ||
                data.avatar ||
                data.profilePhoto ||
                data.profileImage

              ) {

                realProfiles.push(
                  getRealProfile(
                    snap,
                    realProfiles.length
                  )
                );

              }

            }
          );


          /*
           * Successful Firebase load.
           * Keep the page clean.
           */

          msg.innerHTML = "";


          renderProfiles(
            realProfiles
          );

        },


        error => {

          console.error(
            "Kmeet Discover Firebase error:",
            error
          );


          /*
           * Firebase may fail because of permissions,
           * network problems or temporary configuration
           * issues.
           *
           * Do not leave Discover blank.
           */

          renderProfiles([]);


          /*
           * We intentionally do not show a large error
           * banner to visitors.
           */

          msg.innerHTML = "";

        }

      );

    } catch (error) {

      console.error(
        "Kmeet Discover startup error:",
        error
      );


      renderProfiles([]);

      msg.innerHTML = "";

    }

  </script>

</body>
</html>
