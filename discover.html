/* =========================================================
   HTML ESCAPER
   ========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/[&<>"']/g, function(char) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];

    });

}


/* =========================================================
   CREATE PROFILE CARD
   ========================================================= */

function createCard(person) {

  const status =
    person.online ? "Online" : "Offline";

  const statusClass =
    person.online ? "online" : "offline";


  const interests =
    (person.interests || [])
      .map(function(item) {

        return `
          <span class="tag">
            ${escapeHtml(item)}
          </span>
        `;

      })
      .join("");


  return `

    <article class="profile-card">

      <div class="photo-wrap">

        <img
          src="${escapeHtml(person.photo)}"
          alt="${escapeHtml(person.name)}"
          loading="lazy"
          onerror="
            this.onerror=null;
            this.src='https://randomuser.me/api/portraits/lego/1.jpg';
          "
        >

        <div class="status-badge">

          <span
            class="status-dot ${statusClass}"
          ></span>

          ${status}

        </div>

      </div>


      <div class="profile-inside">

        <div class="profile-name-row">

          <h3>
            ${escapeHtml(person.name)}, ${escapeHtml(person.age)}
          </h3>

        </div>


        <p class="profile-location">
          📍 ${escapeHtml(person.location)}
        </p>


        <p class="profile-description">
          ${escapeHtml(person.description)}
        </p>


        <div class="tags">
          ${interests}
        </div>


        <div class="profile-actions">

          <a
            class="profile-button chat-button"
            href="login.html"
          >
            👋 Say Hi
          </a>

          <a
            class="profile-button view-button"
            href="login.html"
          >
            👋 Hello
          </a>

          <a
            class="profile-button view-button full-width"
            href="login.html"
          >
            👤 View Profile
          </a>

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   INITIALIZE DISCOVER
   ========================================================= */

function initializeDiscover() {

  const grid =
    document.getElementById("grid");

  const memberCount =
    document.getElementById("memberCount");

  const profileLink =
    document.getElementById("profileLink");


  /* -----------------------------------------
     SAFETY CHECK
     ----------------------------------------- */

  if (!grid) {

    console.error(
      "Kmeet Discover: #grid does not exist."
    );

    return;

  }


  /* -----------------------------------------
     SHOW 36 PEOPLE IMMEDIATELY
     ----------------------------------------- */

  grid.innerHTML =
    demoProfiles
      .map(createCard)
      .join("");


  if (memberCount) {

    memberCount.textContent =
      "36 people to discover";

  }


  /* -----------------------------------------
     PROFILE LINK
     ----------------------------------------- */

  if (profileLink) {

    profileLink.href =
      "login.html";

  }


  /* -----------------------------------------
     LOAD FIREBASE AFTER DISPLAY
     ----------------------------------------- */

  loadFirebaseMembers(
    grid,
    memberCount,
    profileLink
  );

}


/* =========================================================
   FIREBASE
   ========================================================= */

async function loadFirebaseMembers(
  grid,
  memberCount,
  profileLink
) {

  try {

    const firebase =
      await import("./firebase-config.js");


    /*
     * We deliberately don't import
     * collection/onSnapshot from your config.
     */

    const auth =
      firebase.auth;

    const db =
      firebase.db;


    if (!auth || !db) {

      console.warn(
        "Kmeet: Firebase auth/db unavailable."
      );

      return;

    }


    const authFunctions =
      await import(
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"
      );


    const firestoreFunctions =
      await import(
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"
      );


    const {
      onAuthStateChanged
    } = authFunctions;


    const {
      collection,
      onSnapshot
    } = firestoreFunctions;


    /* -----------------------------------------
       AUTH STATE
       ----------------------------------------- */

    onAuthStateChanged(
      auth,
      function(user) {

        if (!profileLink) {
          return;
        }

        if (
          user &&
          !user.isAnonymous
        ) {

          profileLink.href =
            "profile.html";

        } else {

          profileLink.href =
            "login.html";

        }

      }
    );


    /* -----------------------------------------
       REAL MEMBERS
       ----------------------------------------- */

    onSnapshot(

      collection(
        db,
        "users"
      ),

      function(snapshot) {

        const realProfiles = [];


        snapshot.forEach(
          function(docSnap) {

            const data =
              docSnap.data() || {};


            if (
              !data.name &&
              !data.username &&
              !data.photoURL &&
              !data.avatar
            ) {

              return;

            }


            realProfiles.push({

              id: docSnap.id,

              name:
                data.name ||
                data.username ||
                "Kmeet Member",

              age:
                data.age ||
                "",

              location:
                data.location ||
                "Kenya",

              online:
                data.online === true ||
                String(
                  data.status || ""
                ).toLowerCase() === "online",

              photo:
                data.photoURL ||
                data.avatar ||
                "https://randomuser.me/api/portraits/lego/1.jpg",

              description:
                data.description ||
                data.bio ||
                "A Kmeet member looking forward to meeting someone genuine and sharing meaningful conversations.",

              interests:
                Array.isArray(data.interests)
                  ? data.interests.slice(0, 4)
                  : []

            });

          }
        );


        /*
         * If there are real users, place them first.
         * Keep enough demo profiles so Discover
         * always has at least 36 cards.
         */

        if (realProfiles.length > 0) {

          const remaining =
            demoProfiles.slice(
              0,
              Math.max(
                36 - realProfiles.length,
                0
              )
            );


          const combined =
            [
              ...realProfiles,
              ...remaining
            ];


          grid.innerHTML =
            combined
              .map(createCard)
              .join("");


          if (memberCount) {

            memberCount.textContent =
              `${combined.length} people to discover`;

          }

        }

      },

      function(error) {

        /*
         * Do NOT clear the existing cards.
         */

        console.warn(
          "Kmeet Firebase Discover:",
          error
        );

      }

    );


  } catch (error) {

    /*
     * Firebase failure must NEVER
     * make Discover blank.
     */

    console.warn(
      "Kmeet Firebase connection unavailable:",
      error
    );

  }

}


/* =========================================================
   START ONLY WHEN DOM EXISTS
   ========================================================= */

if (
  document.readyState === "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    initializeDiscover
  );

} else {

  initializeDiscover();

}

</script>
