      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255, 93, 155, .13),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(255, 150, 190, .08),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #0d0b0e 0%,
          #170e15 45%,
          #0d0b0e 100%
        );

      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;

      background:
        linear-gradient(
          rgba(255, 255, 255, .018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, .018) 1px,
          transparent 1px
        );

      background-size: 40px 40px;
      mask-image: linear-gradient(
        to bottom,
        rgba(0,0,0,.8),
        transparent 90%
      );
    }

    /* =====================================================
       NAVIGATION
       ===================================================== */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 5%;

      background: rgba(13, 11, 14, .82);
      border-bottom: 1px solid rgba(255, 255, 255, .08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #fff;
      text-decoration: none;

      font-family: "Playfair Display", serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .brand-heart {
      color: #ff5f9e;
      font-size: 24px;

      filter:
        drop-shadow(
          0 0 10px rgba(255, 95, 158, .35)
        );
    }

    .brand span {
      color: #ff73aa;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-links a {
      color: rgba(255,255,255,.76);
      text-decoration: none;

      padding: 10px 17px;
      border-radius: 24px;

      font-size: 14px;
      font-weight: 600;

      transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
    }

    .nav-links a:hover {
      color: #fff;
      background: rgba(255,255,255,.07);
      transform: translateY(-1px);
    }

    .nav-links a.active {
      color: #fff;
      background: rgba(255, 95, 158, .13);
      border: 1px solid rgba(255, 95, 158, .20);
    }

    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      width: 100%;
      max-width: 1280px;

      margin: 0 auto;
      padding: 42px 24px 70px;
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
    }

    .hero h1 {
      margin: 0;

      font-family: "Playfair Display", serif;
      font-size: clamp(35px, 5vw, 52px);
      line-height: 1.1;

      color: #fff;

      text-shadow:
        0 8px 35px rgba(0,0,0,.35);
    }

    .hero h1 span {
      color: #ff6aa4;
    }

    .hero p {
      margin: 12px auto 0;

      max-width: 650px;

      color: rgba(255,255,255,.65);
      font-size: 15px;
      line-height: 1.7;
    }

    .member-count {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 17px;
      padding: 8px 15px;

      border-radius: 30px;

      color: rgba(255,255,255,.88);
      background: rgba(255,255,255,.055);

      border: 1px solid rgba(255,255,255,.09);

      font-size: 13px;
      font-weight: 600;

      box-shadow:
        0 8px 30px rgba(0,0,0,.12);
    }

    .member-count i {
      color: #ff6aa4;
    }

    /* =====================================================
       PROFILE GRID
       ===================================================== */

    .profiles-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(265px, 1fr)
        );

      gap: 24px;
    }

    /* =====================================================
       PROFILE CARD
       ===================================================== */

    .profile-card {
      position: relative;

      overflow: hidden;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      border: 1px solid rgba(255,255,255,.09);

      box-shadow:
        0 20px 55px rgba(0,0,0,.25);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
    }

    .profile-card:hover {
      transform: translateY(-6px);

      border-color:
        rgba(255, 105, 164, .28);

      box-shadow:
        0 25px 65px rgba(0,0,0,.34),
        0 0 30px rgba(255, 72, 145, .06);
    }

    /* =====================================================
       PHOTO
       ===================================================== */

    .photo-wrap {
      position: relative;

      width: 100%;
      height: 310px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #25151f,
          #100d11
        );
    }

    .profile-photo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform .5s ease;
    }

    .profile-card:hover .profile-photo {
      transform: scale(1.035);
    }

    .photo-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.68),
          transparent 48%
        );

      pointer-events: none;
    }

    /* =====================================================
       ONLINE STATUS
       ===================================================== */

    .online-badge {
      position: absolute;

      top: 13px;
      left: 13px;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;

      border-radius: 20px;

      background: rgba(8,8,10,.72);

      border: 1px solid rgba(255,255,255,.12);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color: #ddd;

      font-size: 11px;
      font-weight: 600;

      z-index: 3;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #8a8a8a;

      box-shadow:
        0 0 7px rgba(138,138,138,.4);
    }

    .online-badge.online .status-dot {
      background: #44e17c;

      box-shadow:
        0 0 9px rgba(68,225,124,.85);
    }

    .online-badge.online .status-text {
      color: #b9ffd0;
    }

    .online-badge.offline .status-text {
      color: rgba(255,255,255,.60);
    }

    /* =====================================================
       PROFILE CONTENT
       ===================================================== */

    .profile-info {
      padding: 17px 17px 18px;
    }

    .profile-name {
      margin: 0;

      color: #fff;

      font-size: 19px;
      font-weight: 700;

      line-height: 1.3;
    }

    .profile-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 7px;

      margin-top: 7px;

      color: rgba(255,255,255,.60);

      font-size: 12px;
    }

    .profile-meta i {
      color: #ff6aa4;
    }

    .profile-bio {
      margin: 11px 0 0;

      min-height: 39px;

      color: rgba(255,255,255,.68);

      font-size: 12.5px;
      line-height: 1.6;
    }

    /* =====================================================
       ACTION BUTTONS
       ===================================================== */

    .profile-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr 40px;

      align-items: center;

      gap: 8px;

      margin-top: 15px;
    }

    .profile-btn,
    .chat-btn,
    .like-btn {
      min-height: 40px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      border-radius: 12px;

      font-family: inherit;

      font-size: 11.5px;
      font-weight: 700;

      text-decoration: none;

      cursor: pointer;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .profile-btn {
      color: rgba(255,255,255,.88);

      background:
        rgba(255,255,255,.055);

      border:
        1px solid rgba(255,255,255,.10);
    }

    .profile-btn:hover {
      background:
        rgba(255,255,255,.10);

      transform: translateY(-1px);
    }

    .chat-btn {
      color: #fff;

      background:

          #ff4f94,
          #ff709f

      border:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        0 8px 20px rgba(255, 67, 137, .18);
    }

    .chat-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 11px 25px rgba(255, 67, 137, .25);
    }

    .like-btn {
      width: 40px;
      padding: 0;

      color: #ff6fa7;

      background:
        rgba(255,95,158,.07);

      border:
        1px solid rgba(255,95,158,.16);
    }

    .like-btn:hover {
      background:
        rgba(255,95,158,.14);

      transform: translateY(-1px);
    }

    .like-btn.liked {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #ff4f94,
          #ff709f
        );

      border-color:
        rgba(255,255,255,.1);
    }

    /* =====================================================
       LOADING / EMPTY / ERROR
       ===================================================== */

    .message-box {
      grid-column: 1 / -1;

      padding: 45px 20px;

      text-align: center;

      color: rgba(255,255,255,.60);

      background:
        rgba(255,255,255,.035);

      border:
        1px solid rgba(255,255,255,.07);

      border-radius: 20px;
    }

    .message-box i {
      margin-bottom: 12px;

      color: #ff6aa4;
      font-size: 28px;
    }

    .message-box p {
      margin: 0;
      font-size: 14px;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 700px) {

      nav {
        height: 70px;
        padding: 0 18px;
      }

      .brand {
        font-size: 23px;
      }

      .nav-links {
        gap: 2px;
      }

      .nav-links a {
        padding: 8px 10px;
        font-size: 12px;
      }

      .page {
        padding:
          32px 15px 55px;
      }

      .profiles-grid {
        grid-template-columns:
          repeat(
            auto-fit,
            minmax(220px, 1fr)
          );

        gap: 17px;
      }

      .photo-wrap {
        height: 285px;
      }
    }

    @media (max-width: 430px) {

      .nav-links a {
        padding: 7px 8px;
      }

      .profiles-grid {
        grid-template-columns: 1fr;
      }

      .photo-wrap {
        height: 330px;
      }
    }

       ===================================================== */

    const presenceMap = new Map();

    const presenceUnsubscribers = new Map();

    let realProfilesCache = [];

    let currentUser = null;


    /* =====================================================
       SAFE PHOTO FALLBACK
       ===================================================== */

    function fallbackPhoto(profile) {

      const gender =
        String(profile.gender || "")
          .toLowerCase();

      if (
        gender.includes("woman") ||
        gender.includes("female") ||
        gender.includes("girl")
      ) {
        return "https://randomuser.me/api/portraits/women/1.jpg";
      }

      return "https://randomuser.me/api/portraits/men/1.jpg";
    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =====================================================
       REAL FIRESTORE PROFILE
       ===================================================== */

    function getRealProfile(id, data) {

      if (!id || !data) {
        return null;
      }

      const name =
        data.name ||
        data.displayName ||
        data.username ||
        "";

      if (!String(name).trim()) {
        return null;
      }

      const photo =
        data.photoURL ||
        data.profilePhoto ||
        data.avatar ||
        data.photo ||
        "";

      const location =
        data.location ||
        "Kenya";

      const age =
        data.age ||
        "";

      const gender =
        data.gender ||
        "";

      const bio =
        data.bio ||
        "New Kmeet member.";

      return {

        id,

        name:
          String(name).trim(),

        age,

        location,

        gender,

        bio,

        photo,

        online:
          data.online === true ||
          data.isOnline === true

      };
    }


    /* =====================================================
       INITIALIZE LIVE PRESENCE FOR CURRENT MEMBER
       ===================================================== */

    let presenceConnectionId = null;

    let presenceConnectionRef = null;

    let presenceConnectedUnsubscribe = null;


    function startOwnPresence(user) {

      if (!user) {
        return;
      }

      if (user.isAnonymous) {
        return;
      }

      if (!user.uid) {
        return;
      }


      const uid = user.uid;

      const connectedRef =
        databaseRef(
          database,
          ".info/connected"
        );


      presenceConnectedUnsubscribe =
        databaseOnValue(
          connectedRef,
          async (snapshot) => {

            const connected =
              snapshot.val() === true;

            if (!connected) {
              return;
            }


            /*
             * Every browser tab/device gets its own
             * connection ID.
             *
             * This prevents one tab from incorrectly
             * making the user offline while another
             * tab is still connected.
             */

            presenceConnectionId =
              `${Date.now()}_${Math.random()
                .toString(36)
                .slice(2)}`;


            presenceConnectionRef =
              databaseRef(
                database,
                `status/${uid}/connections/${presenceConnectionId}`
              );


            const lastOnlineRef =
              databaseRef(
                database,
                `status/${uid}/lastOnline`
              );


            try {

              /*
               * IMPORTANT:
               * Register onDisconnect BEFORE marking
               * this connection online.
               */

              const disconnectConnection =
                onDisconnect(
                  presenceConnectionRef
                );

              await disconnectConnection.remove();


              const disconnectLastOnline =
                onDisconnect(
                  lastOnlineRef
                );

              await disconnectLastOnline.set(
                databaseServerTimestamp()
              );


              /*
               * Now mark this connection online.
               */

              await databaseSet(
                presenceConnectionRef,
                true
              );

            } catch (error) {

              console.error(
                "Kmeet presence error:",
                error
              );

            }

          }
        );

    }


    /* =====================================================
       STOP OWN PRESENCE
       ===================================================== */

    function stopOwnPresence() {

      if (
        presenceConnectedUnsubscribe
      ) {

        presenceConnectedUnsubscribe();

        presenceConnectedUnsubscribe =
          null;
      }

      presenceConnectionId = null;

      presenceConnectionRef = null;
    }


    /* =====================================================
       UPDATE A CARD'S ONLINE STATUS
       ===================================================== */

    function updateStatusBadge(
      profileId,
      online
    ) {

      const card =
        document.querySelector(
          `.profile-card[data-profile-id="${CSS.escape(profileId)}"]`
        );


      if (!card) {
        return;
      }


      const badge =
        card.querySelector(
          ".online-badge"
        );


      if (!badge) {
        return;
      }


      const dot =
        badge.querySelector(
          ".status-dot"
        );


      const text =
        badge.querySelector(
          ".status-text"
        );


      badge.classList.toggle(
        "online",
        online
      );


      badge.classList.toggle(
        "offline",
        !online
      );


      if (text) {

        text.textContent =
          online
            ? "Online"
            : "Offline";

      }

      if (dot) {

        dot.setAttribute(
          "aria-label",
          online
            ? "Online"
            : "Offline"
        );

      }

    }


    /* =====================================================
       LISTEN TO ONE MEMBER'S LIVE PRESENCE
       ===================================================== */

    function listenToPresence(profileId) {

      if (!profileId) {
        return;
      }


      /*
       * Do not try to use the RTDB presence path for
       * demo profiles.
       */

      if (
        String(profileId)
          .startsWith("demo-")
      ) {
        return;
      }


      /*
       * Clean up an older listener if one exists.
       */

      if (
        presenceUnsubscribers.has(profileId)
      ) {

        try {

          presenceUnsubscribers
            .get(profileId)();

        } catch (error) {

          console.warn(
            "Could not remove old presence listener:",
            error
          );

        }

      }


      const connectionsRef =
        databaseRef(
          database,
          `status/${profileId}/connections`
        );


      const unsubscribe =
        databaseOnValue(
          connectionsRef,
          (snapshot) => {

            const value =
              snapshot.val();


            let online = false;


            if (
              value &&
              typeof value === "object"
            ) {

              online =
                Object.keys(value).length > 0;

            }


            presenceMap.set(
              profileId,
              online
            );


            updateStatusBadge(
              profileId,
              online
            );

          },
          (error) => {

            console.warn(
              `Presence read failed for ${profileId}:`,
              error
            );


            /*
             * If presence cannot be read, don't
             * falsely show the person as online.
             */

            presenceMap.set(
              profileId,
              false
            );


            updateStatusBadge(
              profileId,
              false
            );

          }
        );


      presenceUnsubscribers.set(
        profileId,
        unsubscribe
      );

    }


    /* =====================================================
       CLEAN UP OLD PRESENCE LISTENERS
       ===================================================== */

    function clearPresenceListeners() {

      presenceUnsubscribers
        .forEach(
          unsubscribe => {

            try {

              unsubscribe();

            } catch (error) {

              console.warn(
                "Presence cleanup error:",
                error
              );

            }

          }
        );


      presenceUnsubscribers.clear();

      presenceMap.clear();

    }


    /* =====================================================
       PROFILE CARD
       ===================================================== */

    function renderProfile(profile) {

      const isDemo =
        String(profile.id)
          .startsWith("demo-");


      let online;


      if (isDemo) {

        /*
         * Permanent demo members keep their
         * existing static Online/Offline state.
         */

        online =
          profile.online === true;

      } else {

        /*
         * Real members use live Realtime Database
         * presence whenever available.
         */

        online =
          presenceMap.has(profile.id)
            ? presenceMap.get(profile.id)
            : false;

      }


      const photo =
        profile.photo ||
        fallbackPhoto(profile);


      const safePhoto =
        escapeHTML(photo);


      const name =
        escapeHTML(
          profile.name
        );


      const location =
        escapeHTML(
          profile.location ||
          "Kenya"
        );


      const age =
        profile.age
          ? escapeHTML(profile.age)
          : "";


      const bio =
        escapeHTML(
          profile.bio ||
          "Connecting hearts naturally."
        );


      const profileURL =
        `profile.html?id=${encodeURIComponent(profile.id)}`;


      const chatURL =
        `chat.html?userId=${encodeURIComponent(profile.id)}`;


      return `

        <article
          class="profile-card"
          data-profile-id="${escapeHTML(profile.id)}"
        >

          <div class="photo-wrap">

            <img
              class="profile-photo"
              src="${safePhoto}"
              alt="${name}"
              loading="lazy"
              onerror="
                this.onerror=null;
                this.src='${fallbackPhoto(profile)}';
              "
            >

            <div class="photo-overlay"></div>


            <div
              class="
                online-badge
                ${online ? "online" : "offline"}
              "
            >

              <span
                class="status-dot"
              ></span>

              <span
                class="status-text"
              >
                ${online ? "Online" : "Offline"}
              </span>

            </div>

          </div>


          <div class="profile-info">

            <h2 class="profile-name">
              ${name}
              ${
                age
                  ? `, ${age}`
                  : ""
              }
            </h2>


            <div class="profile-meta">

              <span>
                <i class="fa-solid fa-location-dot"></i>
                ${location}
              </span>

            </div>


            <p class="profile-bio">
              ${bio}
            </p>


            <div class="profile-actions">

              <a
                class="profile-btn"
                href="${profileURL}"
              >
                <i class="fa-solid fa-user"></i>
                Profile
              </a>


              <a
                class="chat-btn"
                href="${chatURL}"
              >
                <i class="fa-solid fa-comment"></i>
                Chat
              </a>


              <button
                class="like-btn"
                type="button"
                aria-label="Like ${name}"
                title="Like ${name}"
                data-like-id="${escapeHTML(profile.id)}"
              >
                <i class="fa-regular fa-heart"></i>
              </button>

            </div>

          </div>

        </article>

      `;

    }


    /* =====================================================
       RENDER ALL PROFILES
       ===================================================== */

    function renderProfiles(
      realProfiles
    ) {

      realProfilesCache =
        Array.isArray(realProfiles)
          ? realProfiles
          : [];


      const allProfiles = [
        ...demoProfiles,
        ...realProfilesCache
      ];


      if (!allProfiles.length) {

        profilesGrid.innerHTML = `

          <div class="message-box">

            <i class="fa-regular fa-heart"></i>

            <p>
              There are no profiles to show right now.
            </p>

          </div>

        `;

        return;

      }


      profilesGrid.innerHTML =
        allProfiles
          .map(renderProfile)
          .join("");


      /*
       * Attach Like buttons.
       */

      profilesGrid
        .querySelectorAll(".like-btn")
        .forEach(button => {

          const profileId =
            button.dataset.likeId;


          const storageKey =
            `kmeet-liked-${profileId}`;


          if (
            localStorage.getItem(storageKey)
            === "1"
          ) {

            button.classList.add(
              "liked"
            );

            button.innerHTML =
              '<i class="fa-solid fa-heart"></i>';

          }


          button.addEventListener(
            "click",
            () => {

              const liked =
                button.classList.toggle(
                  "liked"
                );


              if (liked) {

                button.innerHTML =
                  '<i class="fa-solid fa-heart"></i>';

                localStorage.setItem(
                  storageKey,
                  "1"
                );

              } else {

                button.innerHTML =
                  '<i class="fa-regular fa-heart"></i>';

                localStorage.removeItem(
                  storageKey
                );

              }

            }
          );

        });


      /*
       * Start live presence listeners for
       * real Firebase members.
       */

      realProfilesCache
        .forEach(profile => {

          listenToPresence(
            profile.id
          );

        });

    }


    /* =====================================================
       FIRESTORE USERS
       ===================================================== */

    function startUserListener() {

      return onSnapshot(

        collection(
          db,
          "users"
        ),

        snapshot => {

          const realProfiles = [];

          const seenIds = new Set();


          snapshot.forEach(
            userDoc => {

              const id =
                userDoc.id;


              /*
               * Don't display the currently logged-in
               * member as another person.
               */

              if (
                currentUser &&
                !currentUser.isAnonymous &&
                id === currentUser.uid
              ) {

                return;

              }


              if (
                seenIds.has(id)
              ) {

                return;

              }


              const profile =
                getRealProfile(
                  id,
                  userDoc.data() || {}
                );


              if (!profile) {

                return;

              }


              seenIds.add(id);

              realProfiles.push(
                profile
              );

            }
          );


          /*
           * Clean up presence listeners for profiles
           * that no longer exist in Firestore.
           */

          const currentRealIds =
            new Set(
              realProfiles.map(
                profile => profile.id
              )
            );


          presenceUnsubscribers
            .forEach(
              (unsubscribe, id) => {

                if (
                  !currentRealIds.has(id)
                ) {

                  try {

                    unsubscribe();

                  } catch (error) {

                    console.warn(
                      "Presence cleanup error:",
                      error
                    );

                  }


                  presenceUnsubscribers
                    .delete(id);

                  presenceMap
                    .delete(id);

                }

              }
            );


          /*
           * IMPORTANT:
           *
           * The Discover count remains:
           *
           * 36 permanent members
           * +
           * real Firebase members
           *
           * The logged-in user's own profile is
           * excluded above.
           */

          const finalCount =
            BASE_MEMBER_COUNT +
            realProfiles.length;


          memberCount.innerHTML = `

            <i class="fa-solid fa-heart"></i>

            <span>
              ${finalCount} people to discover
            </span>

          `;


          renderProfiles(
            realProfiles
          );

        },

        error => {

          console.error(
            "Kmeet Discover Firestore error:",
            error
          );


          /*
           * Even if Firestore temporarily fails,
           * keep the 36 permanent profiles visible.
           */

          memberCount.innerHTML = `

            <i class="fa-solid fa-heart"></i>

            <span>
              ${BASE_MEMBER_COUNT} people to discover
            </span>

          `;


          renderProfiles([]);

        }

      );

    }


    /* =====================================================
       AUTH STATE
       ===================================================== */

    onAuthStateChanged(
      auth,
      user => {

        /*
         * Save current user so Discover can exclude
         * their own Firestore profile.
         */

        currentUser =
          user || null;


        /*
         * Restart presence only for a normal
         * email/password member.
         *
         * Guests and anonymous users remain able
         * to browse Discover without writing presence.
         */

        stopOwnPresence();


        if (
          user &&
          !user.isAnonymous
        ) {

          startOwnPresence(
            user
          );

        }

      }
    );


    /* =====================================================
       START DISCOVER
       ===================================================== */

    startUserListener();


    /* =====================================================
       PAGE CLEANUP
       ===================================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        /*
         * Firebase's server-side onDisconnect()
         * handles the actual connection removal.
         */

        stopOwnPresence();

      }
    );

  </script>

</body>
</html>
