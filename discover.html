<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Kmeet - Discover</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/jpeg" href="kmeet-logo.jfif.jfif">

  <style>

    /* =========================================
       KMEET DISCOVER
       PHOTO-FIRST MEMBER GALLERY
       ========================================= */

    body.discover-page {
      margin: 0 !important;
      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #120c10 0%,
          #24151b 50%,
          #0d0a0c 100%
        ) !important;

      color: #fff !important;
      font-family: "Poppins", Arial, sans-serif;
    }

    .discover-page *,
    .discover-page *::before,
    .discover-page *::after {
      box-sizing: border-box;
    }

    /* =========================================
       NAVIGATION
       ========================================= */

    .discover-nav {
      width: 100%;
      min-height: 74px;
      padding: 0 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(20, 8, 14, 0.94);

      border-bottom:
        1px solid rgba(255,255,255,0.10);

      position: relative;
      z-index: 10;
    }

    .discover-logo {
      color: #fff !important;
      text-decoration: none !important;

      font-family: Georgia, serif;
      font-size: 29px;
      font-weight: 700;

      letter-spacing: 1px;
    }

    .discover-navlinks {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .discover-navlinks a {
      color: rgba(255,255,255,0.85) !important;
      text-decoration: none !important;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: .8px;
    }

    .discover-navlinks a:hover {
      color: #f0a06b !important;
    }

    /* =========================================
       MAIN
       ========================================= */

    .discover-container {
      width: min(1400px, calc(100% - 36px));
      margin: auto;

      padding: 42px 0 70px;
    }

    .discover-heading {
      text-align: center;
      margin-bottom: 32px;
    }

    .discover-heading h1 {
      margin: 0 0 8px;

      font-family: Georgia, serif;
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 600;
    }

    .discover-heading p {
      margin: 0;

      color: rgba(255,255,255,0.62);
      font-size: 15px;
    }

    /* =========================================
       GRID
       ========================================= */

    .discover-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(210px, 1fr));

      gap: 18px;
      width: 100%;
    }

    /* =========================================
       PROFILE CARD
       ========================================= */

    .profile-card {
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(65,43,42,0.72),
          rgba(25,17,21,0.94)
        ) !important;

      border:
        1px solid rgba(255,255,255,0.12) !important;

      border-radius: 18px !important;

      box-shadow:
        0 14px 35px rgba(0,0,0,0.28);

      transition:
        transform .22s ease,
        box-shadow .22s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);

      box-shadow:
        0 20px 45px rgba(0,0,0,0.42);
    }

    /* =========================================
       PHOTO
       ========================================= */

    .profile-photo-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .profile-photo {
      display: block;

      width: 100%;
      height: 255px;

      object-fit: cover;

      background:
        linear-gradient(
          135deg,
          #39232b,
          #1b1015
        );

      transition:
        transform .3s ease;
    }

    .profile-card:hover .profile-photo {
      transform: scale(1.025);
    }

    /* =========================================
       ONLINE STATUS
       ========================================= */

    .online-status {
      position: absolute;

      left: 12px;
      bottom: 12px;

      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 6px 10px;

      color: #fff;

      background:
        rgba(15, 10, 13, 0.78);

      border:
        1px solid rgba(255,255,255,0.16);

      border-radius: 20px;

      font-size: 10px;
      font-weight: 600;

      backdrop-filter: blur(8px);

      z-index: 2;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      display: inline-block;

      background: #777;

      box-shadow:
        0 0 6px rgba(255,255,255,0.12);
    }

    .online-status.online .status-dot {
      background: #39e58c;

      box-shadow:
        0 0 8px rgba(57,229,140,0.75);
    }

    .online-status.offline .status-dot {
      background: #8b8b8b;
    }

    /* =========================================
       CARD DETAILS
       ========================================= */

    .profile-inside {
      padding: 15px;
    }

    .profile-name {
      margin: 0 0 4px;

      color: #fff;

      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 600;
    }

    .profile-location {
      margin: 0 0 10px;

      color: rgba(255,255,255,0.58);
      font-size: 12px;
    }

    /* =========================================
       INTERESTS
       ========================================= */

    .tags {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;
      min-height: 24px;
    }

    .tag {
      display: inline-block;

      padding: 4px 8px;

      color: rgba(255,255,255,0.82);

      background:
        rgba(240,154,99,0.08);

      border:
        1px solid rgba(240,154,99,0.18);

      border-radius: 20px;

      font-size: 10px;
    }

    /* =========================================
       BUTTONS
       ========================================= */

    .profile-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 7px;

      margin-top: 13px;
    }

    .profile-button,
    .chat-button {
      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 38px;

      border-radius: 9px;

      text-decoration: none !important;

      font-size: 11px;
      font-weight: 600;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .profile-button {
      color: white !important;

      background:
        rgba(255,255,255,0.08);

      border:
        1px solid rgba(255,255,255,0.15);
    }

    .chat-button {
      color: #35101d !important;

      background:
        linear-gradient(
          135deg,
          #f5d58a,
          #d99663
        );

      border: none;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.20);
    }

    .profile-button:hover,
    .chat-button:hover {
      transform: translateY(-2px);
    }

    .chat-button:hover {
      box-shadow:
        0 8px 20px rgba(245,213,138,0.22);
    }

    /* =========================================
       EMPTY
       ========================================= */

    .empty-card {
      grid-column: 1 / -1;

      padding: 60px 20px;

      text-align: center;

      color: rgba(255,255,255,0.70);

      background:
        rgba(255,255,255,0.05);

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 18px;
    }

    /* =========================================
       ERROR
       ========================================= */

    .message {
      margin-bottom: 20px;
      padding: 14px 18px;

      border-radius: 10px;

      background:
        rgba(255,255,255,0.06);

      border:
        1px solid rgba(255,255,255,0.10);
    }

    .message.error {
      color: #ffb5b5;
    }

    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 900px) {

      .discover-grid {
        grid-template-columns:
          repeat(auto-fill, minmax(185px, 1fr));

        gap: 14px;
      }

      .profile-photo {
        height: 225px;
      }

    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 560px) {

      .discover-nav {
        padding: 0 16px;
      }

      .discover-logo {
        font-size: 25px;
      }

      .discover-navlinks {
        gap: 12px;
      }

      .discover-navlinks a {
        font-size: 11px;
      }

      .discover-container {
        width: calc(100% - 20px);
        padding-top: 30px;
      }

      .discover-heading {
        margin-bottom: 24px;
      }

      .discover-heading h1 {
        font-size: 34px;
      }

      .discover-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .profile-card {
        border-radius: 14px !important;
      }

      .profile-photo {
        height: 220px;
      }

      .profile-inside {
        padding: 10px;
      }

      .profile-name {
        font-size: 17px;
      }

      .profile-actions {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .profile-button,
      .chat-button {
        min-height: 35px;
        font-size: 10px;
      }

      .online-status {
        left: 8px;
        bottom: 8px;

        padding: 5px 8px;

        font-size: 9px;
      }

    }

  </style>
</head>

<body class="discover-page">

  <!-- NAVIGATION -->

  <nav class="discover-nav">

    <a class="discover-logo" href="index.html">
      Kmeet
    </a>

    <div class="discover-navlinks">

      <a href="discover.html">
        Discover
      </a>

      <a id="profileLink" href="login.html">
        Profile
      </a>

      <a href="index.html">
        Home
      </a>

    </div>

  </nav>


  <!-- MAIN -->

  <main class="discover-container">

    <div class="discover-heading">

      <h1>
        Discover People
      </h1>

      <p>
        Meet interesting people joining Kmeet ❤️
      </p>

    </div>

    <div id="msg"></div>

    <div id="grid" class="discover-grid"></div>

  </main>


  <script type="module">

    import {
      auth,
      db,
      onAuthStateChanged,
      collection,
      onSnapshot
    } from "./firebase-config.js";


    /* =========================================
       PROFILE LINK
       ========================================= */

    onAuthStateChanged(auth, user => {

      if (user && !user.isAnonymous) {

        document.getElementById("profileLink").href =
          "profile.html";

      }

    });


    /* =========================================
       FALLBACK PROFILE PHOTOS
       ========================================= */

    const fallbackAvatars = [

      "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=700&q=80",

      "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=700&q=80",

      "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=700&q=80",

      "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=700&q=80",

      "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=700&q=80",

      "https://images.unsplash.com/photo-1504593811423-6dd665756598?w=700&q=80",

      "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=700&q=80",

      "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=700&q=80",

      "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=700&q=80",

      "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=700&q=80",

      "https://images.unsplash.com/photo-1528892952291-009c663ce843?w=700&q=80",

      "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=700&q=80"

    ];


    /* =========================================
       LOAD MEMBERS
       ========================================= */

    const grid =
      document.getElementById("grid");


    onSnapshot(

      collection(db, "users"),

      snapshot => {

        grid.innerHTML = "";


        if (snapshot.empty) {

          grid.innerHTML = `

            <div class="empty-card">

              No profiles yet.<br>

              Create the first Kmeet account ❤️

            </div>

          `;

          return;

        }


        snapshot.forEach((snap, index) => {

          const p = snap.data();


          /* =====================================
             NAME
             ===================================== */

          const name =
            p.name ||
            p.username ||
            "Kmeet Member";


          /* =====================================
             AGE
             ===================================== */

          const age =
            p.age
              ? `, ${p.age}`
              : "";


          /* =====================================
             AVATAR
             ===================================== */

          /*
             If the user uploaded a real avatar,
             use it.

             Otherwise select a different
             fallback image for each member.
          */

          const avatar =
            p.avatar ||
            fallbackAvatars[
              index % fallbackAvatars.length
            ];


          /* =====================================
             INTERESTS
             ===================================== */

          const interests =
            Array.isArray(p.interests)
              ? p.interests.slice(0, 3)
              : [];


          /* =====================================
             ONLINE STATUS
             ===================================== */

          let isOnline = false;


          /*
             If the user document already contains
             an explicit online field, use it.
          */

          if (typeof p.online === "boolean") {

            isOnline = p.online;

          }


          /*
             Otherwise check lastSeen.

             A member is considered online when
             their last activity was within
             the last 2 minutes.
          */

          else if (p.lastSeen) {

            let lastSeenTime = null;


            if (
              typeof p.lastSeen.toMillis ===
              "function"
            ) {

              lastSeenTime =
                p.lastSeen.toMillis();

            }

            else if (
              p.lastSeen.seconds
            ) {

              lastSeenTime =
                p.lastSeen.seconds * 1000;

            }

            else if (
              typeof p.lastSeen === "number"
            ) {

              lastSeenTime =
                p.lastSeen;

            }


            if (lastSeenTime) {

              isOnline =
                Date.now() - lastSeenTime <
                2 * 60 * 1000;

            }

          }


          const statusClass =
            isOnline
              ? "online"
              : "offline";


          const statusText =
            isOnline
              ? "Online"
              : "Offline";


          /* =====================================
             CARD
             ===================================== */

          grid.insertAdjacentHTML(

            "beforeend",

            `

              <article class="profile-card">

                <div class="profile-photo-wrap">

                  <img
                    class="profile-photo"
                    src="${escapeHtml(avatar)}"
                    alt="${escapeHtml(name)}"
                    loading="lazy"
                  >

                  <div
                    class="online-status ${statusClass}"
                  >

                    <span
                      class="status-dot"
                    ></span>

                    ${statusText}

                  </div>

                </div>


                <div class="profile-inside">


                  <h3 class="profile-name">

                    ${escapeHtml(name)}${age}

                  </h3>


                  <p class="profile-location">

                    ${escapeHtml(
                      p.location || "Kenya"
                    )}

                  </p>


                  <div class="tags">

                    ${interests.map(i => `

                      <span class="tag">

                        ${escapeHtml(i)}

                      </span>

                    `).join("")}

                  </div>


                  <div class="profile-actions">


                    <a
                      class="profile-button"
                      href="profile.html?id=${encodeURIComponent(snap.id)}"
                    >

                      View Profile

                    </a>


                    <a
                      class="chat-button"
                      href="subscription.html"
                    >

                      💬 Chat

                    </a>


                  </div>


                </div>

              </article>

            `

          );

        });

      },


      /* =========================================
         FIREBASE ERROR
         ========================================= */

      err => {

        console.error(err);


        document.getElementById("msg").innerHTML = `

          <div class="message error">

            Could not load profiles:
            ${escapeHtml(err.message)}

          </div>

        `;

      }

    );


    /* =========================================
       SECURITY
       ========================================= */

    function escapeHtml(value) {

      return String(value).replace(

        /[&<>"']/g,

        c => ({

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[c])

      );

    }

  </script>

</body>
</html>
