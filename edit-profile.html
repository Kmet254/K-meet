</style>
</head>

<body>

<header class="navbar">

    <a class="logo" href="index.html">
        <span class="logo-heart">♥</span>
        <span>Kmeet</span>
    </a>

    <nav class="nav-links">
        <a href="discover.html">Discover</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<main class="container">

<section class="card">

    <h1>Edit Your Profile</h1>

    <p class="subtitle">
        Keep your profile fresh and show people who you are.
    </p>

    <div id="message" class="message"></div>

    <form id="profileForm">

        <div class="photo-section">

            <div class="photo-preview">
                <img id="photoPreview" alt="Profile photo">
                <span id="photoInitial" class="photo-initial">K</span>
            </div>

            <label class="photo-label" for="photoInput">
                📷 Choose New Profile Photo
            </label>

            <input
                id="photoInput"
                type="file"
                accept="image/jpeg,image/png,image/webp"
            >

            <div class="photo-note">
                JPG, PNG or WebP · Maximum 5 MB
                <br>
                Your previous photos remain in your gallery.
            </div>

        </div>

        <div class="field">
            <label for="name">Name</label>
            <input id="name" type="text" maxlength="40" required>
        </div>

        <div class="row">

            <div class="field">
                <label for="age">Age</label>
                <input id="age" type="number" min="18" max="100" required>
            </div>

            <div class="field">
                <label for="gender">Gender</label>
                <select id="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

        </div>

        <div class="field">
            <label for="location">Location</label>
            <input id="location" type="text" maxlength="80">
        </div>

        <div class="field">
            <label for="bio">About You</label>
            <textarea id="bio" maxlength="500"></textarea>
        </div>

        <div class="field">

            <label>Interests</label>

            <div class="interests">

                <button type="button" class="interest" data-interest="Music">Music</button>
                <button type="button" class="interest" data-interest="Travel">Travel</button>
                <button type="button" class="interest" data-interest="Movies">Movies</button>
                <button type="button" class="interest" data-interest="Sports">Sports</button>
                <button type="button" class="interest" data-interest="Food">Food</button>
                <button type="button" class="interest" data-interest="Reading">Reading</button>
                <button type="button" class="interest" data-interest="Fitness">Fitness</button>
                <button type="button" class="interest" data-interest="Photography">Photography</button>
                <button type="button" class="interest" data-interest="Nature">Nature</button>
                <button type="button" class="interest" data-interest="Gaming">Gaming</button>
                <button type="button" class="interest" data-interest="Cooking">Cooking</button>
                <button type="button" class="interest" data-interest="Dancing">Dancing</button>

            </div>

        </div>

        <button id="saveBtn" class="save-btn" type="submit">
            Save Profile
        </button>

        <a class="cancel-btn" href="profile.html">
            Cancel
        </a>

    </form>

</section>

</main>

<script type="module">

import {
    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    setDoc
} from "./firebase-config.js";


const CLOUD_NAME = "whnrdsfq";
const UPLOAD_PRESET = "kmeet_profiles";

const form = document.getElementById("profileForm");
const nameInput = document.getElementById("name");
const ageInput = document.getElementById("age");
const genderInput = document.getElementById("gender");
const locationInput = document.getElementById("location");
const bioInput = document.getElementById("bio");

const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");
const photoInitial = document.getElementById("photoInitial");

const saveBtn = document.getElementById("saveBtn");
const message = document.getElementById("message");

const interestButtons = document.querySelectorAll(".interest");

let currentUser = null;
let currentPhotoURL = "";
let photoGallery = [];
let selectedInterests = [];


function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
}


function clearMessage() {
    message.textContent = "";
    message.className = "message";
}


function getFirstLetter(name) {
    return (name || "K").trim().charAt(0).toUpperCase() || "K";
}


function setPreview(url) {

    if (url) {

        photoPreview.src = url;
        photoPreview.style.display = "block";
        photoInitial.style.display = "none";

    } else {

        photoPreview.style.display = "none";
        photoPreview.removeAttribute("src");

        photoInitial.textContent =
            getFirstLetter(nameInput.value);

        photoInitial.style.display = "block";
    }
}


function updateInterestButtons() {

    interestButtons.forEach(button => {

        const interest = button.dataset.interest;

        button.classList.toggle(
            "selected",
            selectedInterests.includes(interest)
        );

    });
}


interestButtons.forEach(button => {

    button.addEventListener("click", () => {

        const interest = button.dataset.interest;

        if (selectedInterests.includes(interest)) {

            selectedInterests =
                selectedInterests.filter(
                    item => item !== interest
                );

        } else {

            selectedInterests.push(interest);
        }

        updateInterestButtons();

    });

});


async function loadProfile(user) {

    const snapshot =
        await getDoc(doc(db, "users", user.uid));

    if (!snapshot.exists()) {

        nameInput.value =
            user.displayName || "";

        currentPhotoURL =
            user.photoURL || "";

        if (currentPhotoURL) {
            photoGallery = [currentPhotoURL];
        }

        setPreview(currentPhotoURL);

        return;
    }

    const data = snapshot.data();

    nameInput.value =
        data.name ||
        data.username ||
        data.displayName ||
        user.displayName ||
        "";

    ageInput.value =
        data.age ?? "";

    genderInput.value =
        data.gender || "";

    locationInput.value =
        data.location || "";

    bioInput.value =
        data.bio || "";

    selectedInterests =
        Array.isArray(data.interests)
            ? [...data.interests]
            : [];

    currentPhotoURL =
        data.photoURL ||
        data.profilePhoto ||
        data.photo ||
        data.avatar ||
        data.profileImage ||
        user.photoURL ||
        "";

    /*
     * Read the permanent gallery.
     */
    photoGallery =
        Array.isArray(data.photoGallery)
            ? [...data.photoGallery]
            : [];

    /*
     * Protect an older existing photo.
     * If there is a current photo that isn't
     * already in the gallery, add it.
     */
    if (
        currentPhotoURL &&
        !photoGallery.includes(currentPhotoURL)
    ) {
        photoGallery.unshift(currentPhotoURL);
    }

    setPreview(currentPhotoURL);
    updateInterestButtons();
}


photoInput.addEventListener("change", () => {

    clearMessage();

    const file = photoInput.files[0];

    if (!file) return;

    const allowed = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!allowed.includes(file.type)) {

        showMessage(
            "Please choose a JPG, PNG or WebP image."
        );

        photoInput.value = "";
        return;
    }

    if (file.size > 5 * 1024 * 1024) {

        showMessage(
            "Your photo must be smaller than 5 MB."
        );

        photoInput.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = event => {

        photoPreview.src = event.target.result;
        photoPreview.style.display = "block";
        photoInitial.style.display = "none";

    };

    reader.readAsDataURL(file);
});


async function uploadToCloudinary(file) {

    const url =
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

    const formData = new FormData();

    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);
    formData.append("folder", "kmeet/profiles");

    const response =
        await fetch(url, {
            method: "POST",
            body: formData
        });

    const result =
        await response.json();

    if (!response.ok || !result.secure_url) {

        console.error(
            "Cloudinary error:",
            result
        );

        throw new Error(
            result.error?.message ||
            "The photo could not be uploaded."
        );
    }

    return result.secure_url;
}


form.addEventListener("submit", async event => {

    event.preventDefault();

    clearMessage();

    if (!currentUser) {

        showMessage(
            "Please log in before saving your profile."
        );

        return;
    }

    const name =
        nameInput.value.trim();

    const age =
        Number(ageInput.value);

    if (!name) {

        showMessage("Please enter your name.");
        return;
    }

    if (!age || age < 18 || age > 100) {

        showMessage(
            "Please enter a valid age between 18 and 100."
        );

        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try {

        let photoURL =
            currentPhotoURL || "";

        const selectedFile =
            photoInput.files[0];

        /*
         * Upload the new picture first.
         */
        if (selectedFile) {

            saveBtn.textContent =
                "Uploading photo...";

            const newURL =
                await uploadToCloudinary(
                    selectedFile
                );

            photoURL = newURL;

            /*
             * Add the new picture permanently
             * to the gallery.
             */
            if (!photoGallery.includes(newURL)) {

                photoGallery.push(newURL);
            }

        }

        /*
         * Make absolutely sure the current
         * picture is also preserved in gallery.
         */
        if (
            photoURL &&
            !photoGallery.includes(photoURL)
        ) {
            photoGallery.push(photoURL);
        }

        saveBtn.textContent =
            "Saving profile...";

        await setDoc(
            doc(db, "users", currentUser.uid),
            {
                uid: currentUser.uid,

                name: name,

                displayName: name,

                email:
                    currentUser.email || "",

                age: age,

                gender:
                    genderInput.value || "",

                location:
                    locationInput.value.trim() ||
                    "Kenya",

                bio:
                    bioInput.value.trim() ||
                    "New Kmeet member.",

                interests:
                    selectedInterests,

                /*
                 * Current active photo.
                 */
                photoURL: photoURL || "",

                /*
                 * Permanent photo gallery.
                 */
                photoGallery: photoGallery,

                /*
                 * Reset the 24-hour rotation timer
                 * whenever the member manually chooses
                 * a new profile photo.
                 */
                photoRotationAt:
                    new Date(),

                /*
                 * Start rotation from the current
                 * picture's position in the gallery.
                 */
                photoRotationIndex:
                    Math.max(
                        0,
                        photoGallery.indexOf(photoURL)
                    ),

                updatedAt:
                    new Date()
            },
            {
                merge: true
            }
        );

        showMessage(
            "Your profile and photo gallery have been saved.",
            "success"
        );

        saveBtn.textContent =
            "Saved ✓";

        setTimeout(() => {

            window.location.href =
                "profile.html";

        }, 1000);

    } catch (error) {

        console.error(
            "PROFILE SAVE ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Your profile could not be saved."
        );

        saveBtn.disabled = false;
        saveBtn.textContent =
            "Save Profile";
    }

});


onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }

        currentUser = user;

        try {

            await loadProfile(user);

        } catch (error) {

            console.error(
                "PROFILE LOAD ERROR:",
                error
            );

            showMessage(
                "We could not load your profile."
            );
        }

    }
);

</script>

</body>
</html>
