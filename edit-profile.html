<script type="module">

import {
    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    setDoc
} from "./firebase-config.js";


/* =========================================
   CLOUDINARY SETTINGS
========================================= */

const CLOUDINARY_CLOUD_NAME = "whnrdsfq";
const CLOUDINARY_UPLOAD_PRESET = "kmeet_profiles";


/* =========================================
   ELEMENTS
========================================= */

const form = document.getElementById("profileForm");
const nameInput = document.getElementById("name");
const ageInput = document.getElementById("age");
const genderInput = document.getElementById("gender");
const locationInput = document.getElementById("location");
const bioInput = document.getElementById("bio");

const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");
const photoInitial = document.getElementById("photoInitial");

const saveBtn = document.getElementById("saveBtn");
const message = document.getElementById("message");

const interestButtons =
    document.querySelectorAll(".interest");


let currentUser = null;
let currentPhotoURL = "";
let selectedInterests = [];


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type = "error") {

    message.textContent = text;
    message.className = "message " + type;

}


/* =========================================
   HIDE MESSAGE
========================================= */

function clearMessage() {

    message.textContent = "";
    message.className = "message";

}


/* =========================================
   SET PHOTO PREVIEW
========================================= */

function setPhotoPreview(url, name = "") {

    if (url) {

        photoPreview.src = url;
        photoPreview.style.display = "block";
        photoInitial.style.display = "none";

    } else {

        photoPreview.removeAttribute("src");
        photoPreview.style.display = "none";

        const firstLetter =
            (name || "K").trim().charAt(0).toUpperCase();

        photoInitial.textContent = firstLetter || "K";
        photoInitial.style.display = "block";

    }

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(user) {

    try {

        const userRef = doc(db, "users", user.uid);
        const snapshot = await getDoc(userRef);

        if (!snapshot.exists()) {

            nameInput.value = user.displayName || "";

            currentPhotoURL = user.photoURL || "";

            setPhotoPreview(
                currentPhotoURL,
                nameInput.value
            );

            return;
        }

        const data = snapshot.data();

        const savedName =
            data.name ||
            data.username ||
            data.displayName ||
            user.displayName ||
            "";

        nameInput.value = savedName;

        ageInput.value =
            data.age !== undefined &&
            data.age !== null
                ? data.age
                : "";

        genderInput.value =
            data.gender || "";

        locationInput.value =
            data.location || "";

        bioInput.value =
            data.bio || "";

        selectedInterests =
            Array.isArray(data.interests)
                ? [...data.interests]
                : [];

        /*
         * Read all the photo field names that older
         * versions of Kmeet may have used.
         */
        currentPhotoURL =
            data.photoURL ||
            data.photoUrl ||
            data.profilePhoto ||
            data.profileImage ||
            data.avatar ||
            data.photo ||
            user.photoURL ||
            "";

        setPhotoPreview(
            currentPhotoURL,
            savedName
        );

        updateInterestButtons();

    } catch (error) {

        console.error("Profile loading error:", error);

        showMessage(
            "We could not load your profile. Please refresh the page."
        );

    }

}


/* =========================================
   INTEREST BUTTONS
========================================= */

function updateInterestButtons() {

    interestButtons.forEach(button => {

        const interest =
            button.dataset.interest;

        if (selectedInterests.includes(interest)) {

            button.classList.add("selected");

        } else {

            button.classList.remove("selected");

        }

    });

}


interestButtons.forEach(button => {

    button.addEventListener("click", () => {

        const interest =
            button.dataset.interest;

        if (selectedInterests.includes(interest)) {

            selectedInterests =
                selectedInterests.filter(
                    item => item !== interest
                );

        } else {

            selectedInterests.push(interest);

        }

        updateInterestButtons();

    });

});


/* =========================================
   SELECT NEW PHOTO
========================================= */

photoInput.addEventListener("change", () => {

    clearMessage();

    const file = photoInput.files[0];

    if (!file) {
        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

        showMessage(
            "Please choose a JPG, PNG or WebP image."
        );

        photoInput.value = "";

        return;
    }

    if (file.size > 5 * 1024 * 1024) {

        showMessage(
            "Your profile photo must be smaller than 5 MB."
        );

        photoInput.value = "";

        return;
    }

    /*
     * Show the selected photo immediately.
     * It is only permanently saved after
     * the user presses Save Profile.
     */
    const reader = new FileReader();

    reader.onload = event => {

        photoPreview.src = event.target.result;
        photoPreview.style.display = "block";
        photoInitial.style.display = "none";

    };

    reader.readAsDataURL(file);

});


/* =========================================
   UPLOAD PHOTO TO CLOUDINARY
========================================= */

async function uploadPhotoToCloudinary(file) {

    const uploadURL =
        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD_NAME +
        "/image/upload";

    const formData = new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );

    /*
     * Put Kmeet profile photos into a
     * dedicated Cloudinary folder.
     */
    formData.append(
        "folder",
        "kmeet/profiles"
    );

    const response =
        await fetch(
            uploadURL,
            {
                method: "POST",
                body: formData
            }
        );

    let result = {};

    try {

        result = await response.json();

    } catch (error) {

        throw new Error(
            "Cloudinary returned an invalid response."
        );

    }

    if (!response.ok) {

        console.error(
            "Cloudinary upload error:",
            result
        );

        throw new Error(
            result.error?.message ||
            "Profile photo upload failed."
        );

    }

    if (!result.secure_url) {

        throw new Error(
            "Cloudinary did not return a photo URL."
        );

    }

    return result.secure_url;

}


/* =========================================
   SAVE PROFILE
========================================= */

form.addEventListener("submit", async event => {

    event.preventDefault();

    clearMessage();

    if (!currentUser) {

        showMessage(
            "Please log in before saving your profile."
        );

        return;
    }


    /* -------------------------------
       VALIDATE NAME
    -------------------------------- */

    const name =
        nameInput.value.trim();

    if (!name) {

        showMessage(
            "Please enter your name."
        );

        nameInput.focus();

        return;
    }


    /* -------------------------------
       VALIDATE AGE
    -------------------------------- */

    const age =
        Number(ageInput.value);

    if (!age || age < 18 || age > 100) {

        showMessage(
            "Please enter a valid age between 18 and 100."
        );

        ageInput.focus();

        return;
    }


    /* -------------------------------
       DISABLE BUTTON
    -------------------------------- */

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";


    try {

        let photoURL =
            currentPhotoURL || "";


        /* -------------------------------
           UPLOAD NEW PHOTO IF SELECTED
        -------------------------------- */

        const selectedFile =
            photoInput.files[0];

        if (selectedFile) {

            saveBtn.textContent =
                "Uploading photo...";

            photoURL =
                await uploadPhotoToCloudinary(
                    selectedFile
                );

            /*
             * Keep the new URL locally too.
             */
            currentPhotoURL =
                photoURL;

        }


        /* -------------------------------
           SAVE FIRESTORE PROFILE
        -------------------------------- */

        saveBtn.textContent =
            "Saving profile...";

        await setDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                uid: currentUser.uid,

                name: name,

                displayName: name,

                email:
                    currentUser.email || "",

                age: age,

                gender:
                    genderInput.value || "",

                location:
                    locationInput.value.trim() ||
                    "Kenya",

                bio:
                    bioInput.value.trim() ||
                    "New Kmeet member.",

                interests:
                    selectedInterests,

                /*
                 * This is now the Cloudinary URL.
                 */
                photoURL:
                    photoURL || "",

                updatedAt:
                    new Date()
            },
            {
                merge: true
            }
        );


        /* -------------------------------
           SUCCESS
        -------------------------------- */

        showMessage(
            "Your profile has been saved successfully.",
            "success"
        );

        saveBtn.textContent =
            "Saved ✓";


        /*
         * Give Firebase a moment to finish,
         * then return to the profile page.
         */
        setTimeout(() => {

            window.location.href =
                "profile.html";

        }, 900);


    } catch (error) {

        console.error(
            "PROFILE SAVE ERROR:",
            error
        );

        let friendlyMessage =
            "Your profile could not be saved.";

        if (
            error.message &&
            error.message.toLowerCase().includes("upload")
        ) {

            friendlyMessage =
                "The profile photo could not be uploaded. Please try another photo.";

        } else if (
            error.code === "permission-denied"
        ) {

            friendlyMessage =
                "Firebase permission was denied. Please make sure you are logged in.";

        } else if (
            error.message
        ) {

            friendlyMessage =
                error.message;

        }

        showMessage(
            friendlyMessage
        );

        saveBtn.disabled = false;
        saveBtn.textContent =
            "Save Profile";

    }

});


/* =========================================
   AUTHENTICATION
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;
        }

        currentUser =
            user;

        await loadProfile(user);

    }
);

</script>

</body>
