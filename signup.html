<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Kmeet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: "Poppins", sans-serif;
            color: #ffffff;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 50, 145, 0.16),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(132, 60, 255, 0.13),
                    transparent 35%
                ),
                #100d19;

            min-height: 100vh;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            width: 100%;
            height: 74px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid rgba(255,255,255,0.06);

            background: rgba(12, 9, 19, 0.65);
            backdrop-filter: blur(15px);
        }

        .logo {
            text-decoration: none;

            font-family: "Playfair Display", serif;
            font-size: 30px;
            font-weight: 600;

            color: #ff3d91;

            letter-spacing: -1px;
        }

        .navlinks {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navlinks a {
            color: #bcb6c1;
            text-decoration: none;

            font-size: 13px;
            font-weight: 500;

            transition: 0.2s ease;
        }

        .navlinks a:hover {
            color: #ffffff;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            min-height: calc(100vh - 74px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 45px 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 560px;

            padding: 42px;

            background: rgba(24, 20, 34, 0.88);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 26px;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.025);

            backdrop-filter: blur(20px);

            animation: appear 0.45s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .heart-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(255,61,145,0.12);

            border: 1px solid rgba(255,61,145,0.18);

            color: #ff3d91;

            font-size: 24px;

            box-shadow:
                0 10px 30px rgba(255,61,145,0.10);
        }

        .header h1 {
            font-family: "Playfair Display", serif;

            font-size: 31px;
            font-weight: 600;

            color: #fff7fb;

            margin-bottom: 8px;
        }

        .header p {
            color: #96909d;

            font-size: 13px;
            line-height: 1.6;

            font-weight: 300;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #e7e1e9;

            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;

            left: 22px;
            top: 50%;

            transform: translateY(-50%);

            color: #7553a8;

            font-size: 15px;

            pointer-events: none;
        }

        input {
            width: 100%;

            height: 60px;

            padding: 0 20px 0 64px;

            border-radius: 17px;

            border: 1px solid rgba(255,255,255,0.10);

            background: rgba(255,255,255,0.035);

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 15px;

            outline: none;

            transition: 0.2s ease;
        }

        input::placeholder {
            color: #77717d;
        }

        input:focus {
            border-color: rgba(255,61,145,0.65);

            background: rgba(255,255,255,0.055);

            box-shadow:
                0 0 0 3px rgba(255,61,145,0.08);
        }

        .password-help {
            margin-top: 7px;

            color: #77717d;

            font-size: 11px;
        }

        /* =========================
           MESSAGE
        ========================= */

        #msg {
            margin: 12px 0 18px;
        }

        .message {
            padding: 14px 16px;

            border-radius: 14px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.error {
            color: #ffadb9;

            background: rgba(255,60,100,0.09);

            border: 1px solid rgba(255,60,100,0.22);
        }

        .message.success {
            color: #9ff0c4;

            background: rgba(40,200,120,0.08);

            border: 1px solid rgba(40,200,120,0.20);
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            width: 100%;

            height: 60px;

            border: none;
            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #ff3d91,
                    #e92d82
                );

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 13px 32px rgba(255,61,145,0.20);

            transition: 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 17px 38px rgba(255,61,145,0.28);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        /* =========================
           BOTTOM
        ========================= */

        .bottom-text {
            text-align: center;

            margin-top: 25px;

            color: #85808b;

            font-size: 12px;
        }

        .bottom-text a {
            color: #ff4b98;

            text-decoration: none;

            font-weight: 600;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav {
                padding: 0 20px;
                height: 65px;
            }

            .logo {
                font-size: 27px;
            }

            .navlinks {
                gap: 14px;
            }

            .navlinks a {
                font-size: 12px;
            }

            .page {
                padding: 25px 14px;
                align-items: flex-start;
            }

            .signup-card {
                padding: 30px 20px;
                border-radius: 22px;
            }

            .header h1 {
                font-size: 27px;
            }

            input {
                height: 58px;
            }

            .btn {
                height: 58px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->

    <nav class="nav">

        <a href="index.html" class="logo">
            Kmeet
        </a>

        <div class="navlinks">

            <a href="discover.html">
                Discover
            </a>

            <a href="login.html">
                Log In
            </a>

        </div>

    </nav>


    <!-- PAGE -->

    <main class="page">

        <section class="signup-card">

            <div class="header">

                <div class="heart-icon">
                    <i class="fa-solid fa-heart"></i>
                </div>

                <h1>Create your Kmeet account</h1>

                <p>
                    You're almost there. Create your account
                    and start meeting people who share your interests.
                </p>

            </div>


            <!-- SIGNUP FORM -->

            <form id="signupForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="displayName">
                        Display name
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user"></i>

                        <input
                            id="displayName"
                            type="text"
                            maxlength="40"
                            required
                            placeholder="Your name"
                            autocomplete="name"
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            id="email"
                            type="email"
                            required
                            placeholder="you@example.com"
                            autocomplete="email"
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            id="password"
                            type="password"
                            minlength="6"
                            required
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                        >

                    </div>

                    <div class="password-help">
                        Use at least 6 characters.
                    </div>

                </div>


                <!-- MESSAGE -->

                <div id="msg"></div>


                <!-- BUTTON -->

                <button
                    class="btn"
                    id="createAccountBtn"
                    type="submit"
                >
                    Create Account
                </button>

            </form>


            <div class="bottom-text">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </div>

        </section>

    </main>


    <!-- FIREBASE -->

    <script type="module">

        import {
            auth,
            db,
            createUserWithEmailAndPassword,
            updateProfile,
            setDoc,
            doc,
            signOut
        } from "./firebase-config.js";


        const form = document.getElementById("signupForm");

        const msg = document.getElementById("msg");

        const createAccountBtn =
            document.getElementById("createAccountBtn");

        const emailInput =
            document.getElementById("email");


        /* ==========================================
           RESTORE EMAIL IF IT WAS PREVIOUSLY SAVED
        ========================================== */

        const savedEmail =
            sessionStorage.getItem("pendingEmail");

        if (savedEmail) {

            emailInput.value = savedEmail;

        }


        /* ==========================================
           GET INTERESTS
           
           IMPORTANT:
           We check BOTH locations because older
           Kmeet onboarding saved interests in
           localStorage, while signup expects
           sessionStorage.
        ========================================== */

        function getSelectedInterests() {

            let interests = [];


            try {

                /* First check sessionStorage */

                const pendingInterests =
                    sessionStorage.getItem(
                        "pendingInterests"
                    );

                if (pendingInterests) {

                    const parsed =
                        JSON.parse(pendingInterests);

                    if (Array.isArray(parsed)) {

                        interests = parsed;

                    }

                }


                /* If empty, check localStorage */

                if (!interests.length) {

                    const savedInterests =
                        localStorage.getItem(
                            "userInterests"
                        );

                    if (savedInterests) {

                        const parsed =
                            JSON.parse(savedInterests);

                        if (Array.isArray(parsed)) {

                            interests = parsed;

                        }

                    }

                }

            } catch (error) {

                console.error(
                    "Could not read interests:",
                    error
                );

                interests = [];

            }


            return interests;

        }


        /* ==========================================
           SIGNUP
        ========================================== */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                msg.innerHTML = "";


                const name =
                    document
                        .getElementById("displayName")
                        .value
                        .trim();


                const email =
                    emailInput
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const interests =
                    getSelectedInterests();


                /* ==================================
                   VALIDATE INTERESTS
                ================================== */

                if (!interests.length) {

                    msg.innerHTML = `
                        <div class="message error">
                            Please select your interests first.
                            Go back to the interests page,
                            select at least one interest,
                            then continue again.
                        </div>
                    `;

                    return;

                }


                /* ==================================
                   VALIDATE NAME
                ================================== */

                if (!name) {

                    msg.innerHTML = `
                        <div class="message error">
                            Please enter your display name.
                        </div>
                    `;

                    return;

                }


                /* ==================================
                   VALIDATE PASSWORD
                ================================== */

                if (password.length < 6) {

                    msg.innerHTML = `
                        <div class="message error">
                            Password must be at least 6 characters.
                        </div>
                    `;

                    return;

                }


                /* ==================================
                   DISABLE BUTTON
                ================================== */

                createAccountBtn.disabled = true;

                createAccountBtn.textContent =
                    "Creating Account...";


                try {

                    /* ==================================
                       CREATE FIREBASE ACCOUNT
                    ================================== */

                    const cred =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    /* ==================================
                       SAVE DISPLAY NAME TO AUTH
                    ================================== */

                    await updateProfile(
                        cred.user,
                        {
                            displayName: name
                        }
                    );


                    /* ==================================
                       SAVE USER PROFILE TO FIRESTORE
                    ================================== */

                    await setDoc(
                        doc(
                            db,
                            "users",
                            cred.user.uid
                        ),
                        {

                            uid: cred.user.uid,

                            name: name,

                            email: email,

                            interests: interests,

                            bio: "New Kmeet member.",

                            location: "Kenya",

                            age: null,

                            gender: "",

                            photoURL: "",

                            avatar: "",

                            photo: "",

                            profilePhoto: "",

                            createdAt:
                                new Date().toISOString(),

                            onboardingCompleted: true

                        },
                        {
                            merge: true
                        }
                    );


                    /* ==================================
                       LOG OUT AFTER ACCOUNT CREATION
                    ================================== */

                    await signOut(auth);


                    /* ==================================
                       CLEAN UP TEMPORARY DATA
                    ================================== */

                    sessionStorage.removeItem(
                        "pendingInterests"
                    );

                    sessionStorage.removeItem(
                        "pendingEmail"
                    );

                    localStorage.removeItem(
                        "userInterests"
                    );


                    /* ==================================
                       GO TO LOGIN
                    ================================== */

                    window.location.href =
                        "login.html?created=1";

                }


                catch (err) {

                    console.error(
                        "Firebase signup error:",
                        err
                    );


                    let text =
                        err.message ||
                        "Could not create your account.";


                    /* FRIENDLY FIREBASE ERRORS */

                    if (
                        err.code ===
                        "auth/email-already-in-use"
                    ) {

                        text =
                            "That email is already registered. Please log in instead.";

                    }

                    else if (
                        err.code ===
                        "auth/weak-password"
                    ) {

                        text =
                            "Password must be at least 6 characters.";

                    }

                    else if (
                        err.code ===
                        "auth/invalid-email"
                    ) {

                        text =
                            "Please enter a valid email address.";

                    }

                    else if (
                        err.code ===
                        "auth/operation-not-allowed"
                    ) {

                        text =
                            "Email/password sign-up is not enabled in Firebase.";

                    }

                    else if (
                        err.code ===
                        "auth/network-request-failed"
                    ) {

                        text =
                            "Network error. Please check your internet connection and try again.";

                    }

                    else if (
                        err.code ===
                        "permission-denied"
                    ) {

                        text =
                            "Your account was created, but your profile could not be saved. Please check Firestore permissions.";

                    }


                    msg.innerHTML = `
                        <div class="message error">
                            ${text}
                            <br>
                            <small>
                                Error code: ${err.code || "unknown"}
                            </small>
                        </div>
                    `;


                    createAccountBtn.disabled = false;

                    createAccountBtn.textContent =
                        "Create Account";

                }

            }
        );

    </script>

</body>
</html>
