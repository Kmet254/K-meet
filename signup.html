<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Kmeet - Create Account</title>

  <link rel="stylesheet" href="styles.css">

  <link
    rel="icon"
    type="image/svg+xml"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/svgs/solid/heart.svg"
  >

  <style>
    .signup-note {
      margin-top: 8px;
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }

    .message {
      margin: 14px 0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
    }

    .message.error {
      background: rgba(255, 70, 100, .1);
      border: 1px solid rgba(255, 70, 100, .2);
      color: #ff9aaa;
    }

    .message.success {
      background: rgba(50, 220, 140, .1);
      border: 1px solid rgba(50, 220, 140, .2);
      color: #72e6aa;
    }

    .btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav class="nav">

    <a class="logo" href="index.html">
      Kmeet
    </a>

    <div class="navlinks">

      <a href="discover.html">
        Discover
      </a>

      <a href="login.html">
        Log In
      </a>

    </div>

  </nav>


  <!-- =========================
       SIGNUP
  ========================= -->

  <main class="container">

    <section class="card form">

      <h2>Create your Kmeet account</h2>

      <p class="small">
        Your selected interests will be saved to your profile.
      </p>

      <form id="signupForm">

        <!-- NAME -->

        <label for="displayName">
          Display name
        </label>

        <input
          id="displayName"
          type="text"
          required
          maxlength="40"
          autocomplete="name"
          placeholder="Your name"
        >


        <!-- EMAIL -->

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
        >


        <!-- PASSWORD -->

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          required
          minlength="6"
          autocomplete="new-password"
          placeholder="At least 6 characters"
        >

        <p class="signup-note">
          Your profile photo can be added after creating your account.
        </p>


        <!-- MESSAGE -->

        <div id="msg"></div>


        <!-- SUBMIT -->

        <button
          id="signupButton"
          class="btn"
          type="submit"
        >
          Create Account
        </button>

      </form>

    </section>

  </main>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      auth,
      db,
      createUserWithEmailAndPassword,
      updateProfile,
      setDoc,
      doc,
      signOut
    } from "./firebase-config.js";


    /* ==========================================
       ELEMENTS
    ========================================== */

    const signupForm =
      document.getElementById("signupForm");

    const displayNameInput =
      document.getElementById("displayName");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const signupButton =
      document.getElementById("signupButton");

    const msg =
      document.getElementById("msg");


    /* ==========================================
       RESTORE PENDING EMAIL
    ========================================== */

    const savedEmail =
      sessionStorage.getItem("pendingEmail");

    if (savedEmail) {

      emailInput.value =
        savedEmail;

    }


    /* ==========================================
       SIGN UP
    ========================================== */

    signupForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        msg.innerHTML = "";

        const name =
          displayNameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        /*
         * Interests were selected before reaching
         * this page.
         */

        let interests = [];

        try {

          interests =
            JSON.parse(
              sessionStorage.getItem(
                "pendingInterests"
              ) || "[]"
            );

        } catch (error) {

          console.warn(
            "Could not read pending interests:",
            error
          );

          interests = [];

        }


        /* ========================================
           VALIDATION
        ======================================== */

        if (!name) {

          msg.innerHTML =
            '<div class="message error">Please enter your name.</div>';

          return;
        }


        if (!email) {

          msg.innerHTML =
            '<div class="message error">Please enter your email address.</div>';

          return;
        }


        if (password.length < 6) {

          msg.innerHTML =
            '<div class="message error">Password must be at least 6 characters.</div>';

          return;
        }


        if (!interests.length) {

          msg.innerHTML =
            '<div class="message error">Please select your interests first.</div>';

          return;
        }


        /* ========================================
           DISABLE BUTTON
        ======================================== */

        signupButton.disabled = true;

        signupButton.textContent =
          "Creating account...";


        try {

          /* ======================================
             CREATE FIREBASE ACCOUNT
          ====================================== */

          const cred =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            cred.user;


          /* ======================================
             SAVE DISPLAY NAME TO AUTH
          ====================================== */

          await updateProfile(
            user,
            {
              displayName: name,
              photoURL: null
            }
          );


          /* ======================================
             CREATE KMEET PROFILE
          ====================================== */

          await setDoc(
            doc(db, "users", user.uid),
            {

              /*
               * Basic account information
               */

              uid: user.uid,

              name: name,

              displayName: name,

              email: email,


              /*
               * Interests selected during onboarding
               */

              interests: interests,


              /*
               * Default profile information
               */

              bio: "New Kmeet member.",

              location: "Kenya",

              age: null,

              gender: "",


              /*
               * PROFILE PHOTO
               *
               * photoURL is now the main field used
               * by profile.html.
               */

              photoURL: "",


              /*
               * Keep avatar too so older Kmeet pages
               * that use avatar continue working.
               */

              avatar: "",

              photo: "",

              profilePhoto: "",


              /*
               * Account information
               */

              createdAt:
                new Date().toISOString(),

              onboardingCompleted: true

            },

            {
              merge: true
            }
          );


          /* ======================================
             LOG USER OUT
          ====================================== */

          await signOut(auth);


          /* ======================================
             CLEAR TEMPORARY SIGNUP DATA
          ====================================== */

          sessionStorage.removeItem(
            "pendingInterests"
          );

          sessionStorage.removeItem(
            "pendingEmail"
          );


          /* ======================================
             SUCCESS
          ====================================== */

          window.location.href =
            "login.html?created=1";


        } catch (error) {

          console.error(
            "Signup error:",
            error
          );


          let errorText =
            "Could not create your account. Please try again.";


          switch (error.code) {

            case "auth/email-already-in-use":

              errorText =
                "That email is already registered. Please log in.";

              break;


            case "auth/invalid-email":

              errorText =
                "Please enter a valid email address.";

              break;


            case "auth/weak-password":

              errorText =
                "Password must be at least 6 characters.";

              break;


            case "auth/operation-not-allowed":

              errorText =
                "Email/password accounts are not enabled in Firebase.";

              break;


            case "auth/network-request-failed":

              errorText =
                "Network error. Please check your internet connection.";

              break;


            default:

              if (error.message) {

                console.error(
                  "Firebase:",
                  error.message
                );
              }

          }


          msg.innerHTML =
            `<div class="message error">${errorText}</div>`;


          signupButton.disabled = false;

          signupButton.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>
</html>
