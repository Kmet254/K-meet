<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Kmeet - Create Account</title>

  <link rel="stylesheet" href="styles.css">

  <link
    rel="icon"
    type="image/svg+xml"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/svgs/solid/heart.svg"
  >
</head>

<body>

  <nav class="nav">
    <a class="logo" href="index.html">Kmeet</a>

    <div class="navlinks">
      <a href="discover.html">Discover</a>
      <a href="login.html">Log In</a>
    </div>
  </nav>


  <main class="container">

    <section class="card form">

      <h2>Create your Kmeet account</h2>

      <p class="small">
        Your selected interests will be saved to your profile.
      </p>

      <form id="signupForm">

        <label for="displayName">
          Display name
        </label>

        <input
          id="displayName"
          type="text"
          required
          maxlength="40"
          placeholder="Your name"
        >


        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          required
          placeholder="you@example.com"
        >


        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          required
          minlength="6"
          placeholder="At least 6 characters"
        >


        <div id="msg"></div>


        <button
          id="signupButton"
          class="btn"
          type="submit"
        >
          Create Account
        </button>

      </form>

    </section>

  </main>


  <script type="module">

    import {
      auth,
      db,
      createUserWithEmailAndPassword,
      updateProfile,
      setDoc,
      doc,
      signOut
    } from "./firebase-config.js";


    const savedEmail =
      sessionStorage.getItem("pendingEmail");

    if (savedEmail) {
      document.getElementById("email").value = savedEmail;
    }


    document
      .getElementById("signupForm")
      .addEventListener("submit", async (e) => {

        e.preventDefault();


        const msg =
          document.getElementById("msg");

        const button =
          document.getElementById("signupButton");


        msg.innerHTML = "";


        const name =
          document
            .getElementById("displayName")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        let interests = [];

        try {

          interests = JSON.parse(
            sessionStorage.getItem(
              "pendingInterests"
            ) || "[]"
          );

        } catch (error) {

          console.error(
            "Interests error:",
            error
          );

          interests = [];

        }


        /* =========================
           VALIDATION
        ========================= */

        if (!name) {

          msg.innerHTML =
            '<div class="message error">Please enter your name.</div>';

          return;
        }


        if (!interests.length) {

          msg.innerHTML =
            '<div class="message error">Please select your interests first.</div>';

          return;
        }


        button.disabled = true;
        button.textContent = "Creating Account...";


        try {

          /* =========================
             CREATE FIREBASE ACCOUNT
          ========================= */

          const cred =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          /* =========================
             SAVE NAME
          ========================= */

          await updateProfile(
            cred.user,
            {
              displayName: name
            }
          );


          /* =========================
             CREATE KMEET PROFILE
          ========================= */

          await setDoc(
            doc(db, "users", cred.user.uid),
            {

              uid: cred.user.uid,

              name: name,

              email: email,

              interests: interests,

              bio: "New Kmeet member.",

              location: "Kenya",

              age: null,

              avatar: "",

              /*
               * NEW PHOTO FIELD
               */
              photoURL: "",

              /*
               * Compatibility with older code
               */
              photo: "",

              profilePhoto: "",

              createdAt:
                new Date().toISOString(),

              onboardingCompleted: true

            },
            {
              merge: true
            }
          );


          /* =========================
             SIGN OUT
          ========================= */

          await signOut(auth);


          /* =========================
             CLEAR TEMP DATA
          ========================= */

          sessionStorage.removeItem(
            "pendingInterests"
          );

          sessionStorage.removeItem(
            "pendingEmail"
          );


          /* =========================
             GO TO LOGIN
          ========================= */

          window.location.href =
            "login.html?created=1";


        } catch (err) {

          console.error(
            "FULL FIREBASE ERROR:",
            err
          );


          let text =
            err.message ||
            "Could not create account.";


          if (
            err.code ===
            "auth/email-already-in-use"
          ) {

            text =
              "That email is already registered. Please log in.";

          }

          else if (
            err.code ===
            "auth/weak-password"
          ) {

            text =
              "Password must be at least 6 characters.";

          }

          else if (
            err.code ===
            "auth/invalid-email"
          ) {

            text =
              "Please enter a valid email address.";

          }

          else if (
            err.code ===
            "auth/network-request-failed"
          ) {

            text =
              "Network error. Please check your internet connection.";

          }

          else if (
            err.code ===
            "permission-denied" ||
            err.code ===
            "firestore/permission-denied"
          ) {

            text =
              "Firebase denied access to create your profile. Check your Firestore rules.";

          }


          msg.innerHTML =
            `<div class="message error">${text}</div>`;


          button.disabled = false;
          button.textContent = "Create Account";

        }

      });

  </script>

</body>
</html>
