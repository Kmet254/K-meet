<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Kmeet - Create Account</title>

  <link rel="icon" type="image/svg+xml"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/svgs/solid/heart.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(circle at 15% 15%, rgba(236, 72, 153, .18), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, .20), transparent 35%),
        linear-gradient(135deg, #100b18, #171222 55%, #100a1d);

      color: #fff;
      overflow-x: hidden;
    }

    /* =========================================================
       NAVIGATION
       ========================================================= */

    .nav {
      width: 100%;
      height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6vw;

      border-bottom: 1px solid rgba(255,255,255,.08);

      background: rgba(12, 8, 20, .55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      position: relative;
      z-index: 10;
    }

    .logo {
      text-decoration: none;
      color: #fff;

      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff2f91;
    }

    .navlinks {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .navlinks a {
      text-decoration: none;
      color: #d7d0df;
      font-size: 15px;
      font-weight: 700;

      transition: .2s ease;
    }

    .navlinks a:hover {
      color: #ff3c98;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    .page {
      min-height: calc(100vh - 76px);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 45px 20px 70px;
    }

    .signup-card {
      width: 100%;
      max-width: 720px;

      padding: 42px 44px 46px;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(38, 31, 48, .92),
          rgba(22, 18, 31, .96)
        );

      border: 1px solid rgba(255,255,255,.10);

      box-shadow:
        0 35px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.05);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .heading {
      text-align: center;
      margin-bottom: 34px;
    }

    .heart {
      width: 62px;
      height: 62px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background:
        linear-gradient(135deg, #ff2d8d, #b22cff);

      box-shadow:
        0 15px 35px rgba(255,45,141,.25);
    }

    .heart i {
      font-size: 28px;
      color: #fff;
    }

    .heading h1 {
      font-size: 32px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -.8px;

      margin-bottom: 10px;
    }

    .heading p {
      color: #aaa1b2;
      font-size: 15px;
      line-height: 1.6;
    }

    /* =========================================================
       FORM
       ========================================================= */

    .field {
      margin-bottom: 23px;
    }

    .field label {
      display: block;

      margin-bottom: 9px;

      font-size: 15px;
      font-weight: 800;
      color: #eee7f2;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 21px;
      top: 50%;

      transform: translateY(-50%);

      color: #8151b8;
      font-size: 19px;

      pointer-events: none;
    }

    input {
      width: 100%;
      height: 62px;

      border-radius: 21px;

      border: 1px solid rgba(255,255,255,.12);

      background: rgba(255,255,255,.035);

      color: #fff;

      padding: 0 20px 0 62px;

      font-size: 17px;
      outline: none;

      transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    input::placeholder {
      color: #777080;
    }

    input:focus {
      border-color: rgba(255,45,145,.65);

      background: rgba(255,255,255,.055);

      box-shadow:
        0 0 0 4px rgba(255,45,145,.08);
    }

    .password-note {
      margin-top: 8px;

      color: #817888;
      font-size: 13px;
    }

    /* =========================================================
       MESSAGE
       ========================================================= */

    #msg {
      margin: 8px 0 18px;
    }

    .message {
      border-radius: 16px;
      padding: 15px 17px;

      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      color: #ffb5c9;

      background: rgba(190, 30, 83, .15);

      border: 1px solid rgba(255, 55, 120, .35);
    }

    .message.success {
      color: #baf5d1;

      background: rgba(24, 160, 91, .14);

      border: 1px solid rgba(40, 210, 120, .30);
    }

    .message.info {
      color: #d9d0ff;

      background: rgba(120, 80, 220, .14);

      border: 1px solid rgba(150, 110, 255, .28);
    }

    /* =========================================================
       BUTTON
       ========================================================= */

    .btn {
      width: 100%;
      height: 62px;

      border: 0;
      border-radius: 21px;

      background:
        linear-gradient(
          100deg,
          #ff2f91,
          #e72c9d
        );

      color: #fff;

      font-size: 18px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 16px 35px rgba(255,45,145,.22);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        opacity .18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 20px 42px rgba(255,45,145,.30);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .bottom-text {
      text-align: center;
      margin-top: 24px;

      color: #8e8795;
      font-size: 14px;
    }

    .bottom-text a {
      color: #ff3d98;
      text-decoration: none;
      font-weight: 800;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 650px) {

      .nav {
        height: 68px;
        padding: 0 20px;
      }

      .logo {
        font-size: 25px;
      }

      .navlinks {
        gap: 15px;
      }

      .navlinks a {
        font-size: 13px;
      }

      .page {
        padding: 25px 14px 45px;
      }

      .signup-card {
        padding: 30px 20px 32px;
        border-radius: 24px;
      }

      .heading h1 {
        font-size: 27px;
      }

      input,
      .btn {
        height: 58px;
      }
    }
  </style>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <!-- =======================================================
       NAVIGATION
       ======================================================= -->

  <nav class="nav">

    <a href="index.html" class="logo">
      Kmeet<span>.</span>
    </a>

    <div class="navlinks">
      <a href="discover.html">Discover</a>
      <a href="login.html">Log In</a>
    </div>

  </nav>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <main class="page">

    <section class="signup-card">

      <div class="heading">

        <div class="heart">
          <i class="fa-solid fa-heart"></i>
        </div>

        <h1>Create your Kmeet account</h1>

        <p>
          Join Kmeet and start meeting people who share your interests.
        </p>

      </div>


      <!-- ===================================================
           SIGNUP FORM
           =================================================== -->

      <form id="signupForm">

        <!-- NAME -->

        <div class="field">

          <label for="displayName">
            Display name
          </label>

          <div class="input-wrap">

            <i class="fa-solid fa-user"></i>

            <input
              id="displayName"
              type="text"
              maxlength="40"
              required
              autocomplete="name"
              placeholder="Your name"
            >

          </div>

        </div>


        <!-- EMAIL -->

        <div class="field">

          <label for="email">
            Email address
          </label>

          <div class="input-wrap">

            <i class="fa-solid fa-envelope"></i>

            <input
              id="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            >

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <i class="fa-solid fa-lock"></i>

            <input
              id="password"
              type="password"
              minlength="6"
              required
              autocomplete="new-password"
              placeholder="At least 6 characters"
            >

          </div>

          <div class="password-note">
            Use at least 6 characters.
          </div>

        </div>


        <!-- MESSAGE -->

        <div id="msg"></div>


        <!-- BUTTON -->

        <button
          class="btn"
          id="createBtn"
          type="submit"
        >
          Create Account
        </button>

      </form>


      <div class="bottom-text">
        Already have an account?
        <a href="login.html">Log in</a>
      </div>

    </section>

  </main>


  <!-- =======================================================
       FIREBASE SIGNUP SCRIPT
       ======================================================= -->

  <script type="module">

    import {
      auth,
      db,
      createUserWithEmailAndPassword,
      updateProfile,
      setDoc,
      doc,
      signOut
    } from "./firebase-config.js";


    /* ========================================================
       GET SAVED INTERESTS
       ======================================================== */

    function getSelectedInterests() {

      let interests = [];

      try {

        const pending =
          sessionStorage.getItem("pendingInterests");

        if (pending) {

          const parsed =
            JSON.parse(pending);

          if (Array.isArray(parsed)) {
            interests = parsed;
          }

        }

      } catch (error) {

        console.log(
          "Could not read session interests:",
          error
        );

      }


      if (!interests.length) {

        try {

          const saved =
            localStorage.getItem("userInterests");

          if (saved) {

            const parsed =
              JSON.parse(saved);

            if (Array.isArray(parsed)) {
              interests = parsed;
            }

          }

        } catch (error) {

          console.log(
            "Could not read local interests:",
            error
          );

        }

      }


      return interests;
    }


    /* ========================================================
       PREFILL EMAIL
       ======================================================== */

    const savedEmail =
      sessionStorage.getItem("pendingEmail");

    if (savedEmail) {

      document.getElementById("email").value =
        savedEmail;

    }


    /* ========================================================
       HELPER: SHOW MESSAGE
       ======================================================== */

    function showMessage(
      type,
      message
    ) {

      const msg =
        document.getElementById("msg");

      msg.innerHTML =
        '<div class="message ' +
        type +
        '">' +
        message +
        '</div>';

    }


    /* ========================================================
       HELPER: TIMEOUT
       Prevent Firebase from hanging forever.
       ======================================================== */

    function withTimeout(
      promise,
      milliseconds,
      operationName
    ) {

      return Promise.race([

        promise,

        new Promise(function(resolve, reject) {

          setTimeout(function() {

            reject(
              new Error(
                "Kmeet timed out while " +
                operationName +
                ". Please check your Firebase configuration, Firestore rules, or internet connection."
              )
            );

          }, milliseconds);

        })

      ]);

    }


    /* ========================================================
       SIGNUP
       ======================================================== */

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const msg =
            document.getElementById("msg");

          const createBtn =
            document.getElementById("createBtn");


          msg.innerHTML = "";


          const name =
            document
              .getElementById("displayName")
              .value
              .trim();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          const interests =
            getSelectedInterests();


          /* ==================================================
             BASIC VALIDATION
             ================================================== */

          if (!name) {

            showMessage(
              "error",
              "Please enter your name."
            );

            return;

          }


          if (!email) {

            showMessage(
              "error",
              "Please enter your email address."
            );

            return;

          }


          if (password.length < 6) {

            showMessage(
              "error",
              "Password must be at least 6 characters."
            );

            return;

          }


          /* ==================================================
             DISABLE BUTTON
             ================================================== */

          createBtn.disabled = true;

          createBtn.textContent =
            "Creating Account...";


          try {

            /* =================================================
               STEP 1
               CREATE FIREBASE AUTH ACCOUNT
               ================================================= */

            console.log(
              "KMEET: Starting Firebase account creation..."
            );

            showMessage(
              "info",
              "Creating your account..."
            );


            const cred =
              await withTimeout(
                createUserWithEmailAndPassword(
                  auth,
                  email,
                  password
                ),
                45000,
                "creating your Firebase account"
              );


            console.log(
              "KMEET: Firebase account created successfully.",
              cred.user.uid
            );


            /* =================================================
               STEP 2
               UPDATE DISPLAY NAME
               ================================================= */

            createBtn.textContent =
              "Setting Up Profile...";


            showMessage(
              "info",
              "Setting up your profile..."
            );


            console.log(
              "KMEET: Updating display name..."
            );


            await withTimeout(
              updateProfile(
                cred.user,
                {
                  displayName: name
                }
              ),
              45000,
              "setting your profile name"
            );


            console.log(
              "KMEET: Display name saved."
            );


            /* =================================================
               STEP 3
               SAVE PROFILE TO FIRESTORE
               ================================================= */

            createBtn.textContent =
              "Saving Profile...";


            showMessage(
              "info",
              "Saving your Kmeet profile..."
            );


            console.log(
              "KMEET: Saving profile to Firestore..."
            );


            await withTimeout(

              setDoc(

                doc(
                  db,
                  "users",
                  cred.user.uid
                ),

                {

                  uid:
                    cred.user.uid,

                  name:
                    name,

                  email:
                    email,

                  interests:
                    Array.isArray(interests)
                      ? interests
                      : [],

                  bio:
                    "New Kmeet member.",

                  location:
                    "Kenya",

                  age:
                    null,

                  gender:
                    "",

                  photoURL:
                    "",

                  avatar:
                    "",

                  photo:
                    "",

                  profilePhoto:
                    "",

                  createdAt:
                    new Date().toISOString(),

                  onboardingCompleted:
                    true

                },

                {
                  merge: true
                }

              ),

              45000,

              "saving your Kmeet profile to Firestore"

            );


            console.log(
              "KMEET: Profile saved to Firestore."
            );


            /* =================================================
               STEP 4
               SIGN OUT
               ================================================= */

            createBtn.textContent =
              "Finishing...";


            showMessage(
              "info",
              "Finishing your account..."
            );


            console.log(
              "KMEET: Signing out..."
            );


            await withTimeout(
              signOut(auth),
              30000,
              "finishing your account"
            );


            console.log(
              "KMEET: Signed out successfully."
            );


            /* =================================================
               CLEAN TEMPORARY DATA
               ================================================= */

            sessionStorage.removeItem(
              "pendingInterests"
            );

            sessionStorage.removeItem(
              "pendingEmail"
            );

            localStorage.removeItem(
              "userInterests"
            );


            /* =================================================
               SUCCESS
               ================================================= */

            showMessage(
              "success",
              "Account created successfully. Redirecting to login..."
            );


            console.log(
              "KMEET: ACCOUNT CREATION COMPLETE."
            );


            setTimeout(
              function() {

                window.location.href =
                  "login.html?created=1";

              },
              1000
            );


          } catch (err) {

            console.error(
              "KMEET signup error:",
              err
            );


            let text =
              "Could not create your account.";


            /* =================================================
               FIREBASE AUTH ERRORS
               ================================================= */

            if (
              err.code ===
              "auth/email-already-in-use"
            ) {

              text =
                "That email is already registered. Please log in.";

            }

            else if (
              err.code ===
              "auth/weak-password"
            ) {

              text =
                "Your password is too weak. Use at least 6 characters.";

            }

            else if (
              err.code ===
              "auth/invalid-email"
            ) {

              text =
                "Please enter a valid email address.";

            }

            else if (
              err.code ===
              "auth/operation-not-allowed"
            ) {

              text =
                "Email/password sign-in is not enabled in Firebase Authentication.";

            }

            else if (
              err.code ===
              "auth/network-request-failed"
            ) {

              text =
                "Network error. Please check your internet connection and try again.";

            }

            else if (
              err.code ===
              "auth/api-key-not-valid"
            ) {

              text =
                "Firebase rejected the API key. Please check firebase-config.js.";

            }

            else if (
              err.code ===
              "auth/invalid-api-key"
            ) {

              text =
                "Firebase rejected the API key. Please check firebase-config.js.";

            }

            else if (
              err.code ===
              "permission-denied"
            ) {

              text =
                "Your account was created, but Kmeet could not save your profile because Firestore permissions denied the request.";

            }

            else if (
              err.code ===
              "firestore/permission-denied"
            ) {

              text =
                "Your account was created, but Kmeet could not save your profile because Firestore permissions denied the request.";

            }

            else if (
              err.message &&
              err.message.toLowerCase().includes("timed out")
            ) {

              text =
                err.message;

            }

            else if (err.message) {

              text =
                err.message;

            }


            /* =================================================
               SHOW ERROR
               ================================================= */

            showMessage(
              "error",
              text
            );


            /* =================================================
               RESTORE BUTTON
               ================================================= */

            createBtn.disabled =
              false;

            createBtn.textContent =
              "Create Account";

          }

        }
      );

  </script>

</body>
</html>
