<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kmeet - Log In</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/svgs/solid/heart.svg">
</head>
<body>
  <nav class="nav"><a class="logo" href="index.html">Kmeet</a><div class="navlinks"><a href="discover.html">Discover</a></div></nav>
  <main class="container">
    <section class="card form">
      <h2>Welcome back</h2>
      <div id="msg"></div>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required>
        <label for="password">Password</label>
        <input id="password" type="password" required>
        <button class="btn" type="submit">Log In</button>
      </form>
      <p class="small">New here? <a href="index.html">Create an account</a>.</p>
    </section>
  </main>
  <script type="module">
    import { auth, signInWithEmailAndPassword } from "./firebase-config.js";

    const params = new URLSearchParams(location.search);
    if (params.get("created") === "1") {
      document.getElementById("msg").innerHTML = '<div class="message success">Account created. Please log in.</div>';
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.innerHTML = "";
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.href = "profile.html";
      } catch (err) {
        console.error(err);
        msg.innerHTML = `<div class="message error">Login failed: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
