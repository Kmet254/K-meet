<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kmeet - Log In</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/jpeg" href="kmeet-logo.jfif.jfif">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(135deg, rgba(35, 0, 15, 0.94), rgba(0, 0, 0, 0.96)),
        url("kmeet-background.jpg.jpg") center/cover fixed;
      color: white;
    }

    .login-nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
    }

    .login-logo img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 50%;
    }

    .login-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .login-nav a:hover {
      color: #f4a6bd;
    }

    .login-wrapper {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 42px;
      box-sizing: border-box;
      border-radius: 24px;
      background: rgba(20, 0, 12, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-brand img {
      width: 82px;
      height: 82px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .login-brand h1 {
      margin: 0;
      font-size: 30px;
    }

    .login-brand p {
      margin: 8px 0 0;
      color: #d8c8cf;
      font-size: 14px;
    }

    .login-card h2 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 22px;
    }

    .login-card label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: 600;
      color: #f0dfe5;
    }

    .login-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      font-size: 15px;
    }

    .login-card input:focus {
      border-color: #d96b91;
      box-shadow: 0 0 0 3px rgba(217,107,145,0.15);
    }

    .login-card input::placeholder {
      color: #bbaeb4;
    }

    .login-button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #9d315d, #d96b91);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .login-button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #msg {
      margin-bottom: 15px;
    }

    .message {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.success {
      background: rgba(46, 160, 67, 0.18);
      border: 1px solid rgba(46, 160, 67, 0.4);
      color: #b9f6c4;
    }

    .message.error {
      background: rgba(190, 40, 70, 0.18);
      border: 1px solid rgba(220, 80, 110, 0.4);
      color: #ffb7c7;
    }

    .login-footer {
      text-align: center;
      margin-top: 22px;
      color: #c9bac1;
      font-size: 14px;
    }

    .login-footer a {
      color: #f19ab7;
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .login-nav {
        padding: 0 20px;
      }

      .login-logo {
        font-size: 23px;
      }

      .login-card {
        padding: 30px 22px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <nav class="login-nav">
    <a class="login-logo" href="index.html">
      <img src="kmeet-logo.jfif.jfif" alt="Kmeet">
      <span>Kmeet</span>
    </a>

    <a href="discover.html">DISCOVER</a>
  </nav>

  <main class="login-wrapper">

    <section class="login-card">

      <div class="login-brand">
        <img src="kmeet-logo.jfif.jfif" alt="Kmeet Logo">

        <h1>Welcome back ❤️</h1>

        <p>Log in and continue connecting on Kmeet.</p>
      </div>

      <h2>Log In</h2>

      <div id="msg"></div>

      <form id="loginForm">

        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button class="login-button" id="loginButton" type="submit">
          Log In
        </button>

      </form>

      <div class="login-footer">
        New to Kmeet?
        <a href="index.html">Create an account</a>
      </div>

    </section>

  </main>

  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword
    } from "./firebase-config.js";

    const params = new URLSearchParams(location.search);

    const msg = document.getElementById("msg");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    if (params.get("created") === "1") {
      msg.innerHTML =
        '<div class="message success">Account created successfully. Please log in.</div>';
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      msg.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        window.location.href = "profile.html";

      } catch (err) {

        console.error(err);

        let errorMessage = "Login failed. Please check your email and password.";

        if (err.code === "auth/invalid-credential") {
          errorMessage = "Incorrect email or password.";
        } else if (err.code === "auth/user-not-found") {
          errorMessage = "No account was found with this email.";
        } else if (err.code === "auth/wrong-password") {
          errorMessage = "Incorrect password.";
        } else if (err.code === "auth/invalid-email") {
          errorMessage = "Please enter a valid email address.";
        } else if (err.code === "auth/too-many-requests") {
          errorMessage = "Too many attempts. Please try again later.";
        }

        msg.innerHTML =
          `<div class="message error">${errorMessage}</div>`;

        loginButton.disabled = false;
        loginButton.textContent = "Log In";
      }
    });
  </script>

</body>
</html>
