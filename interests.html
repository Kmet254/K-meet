<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kmeet - Choose Interests</title>

  <link rel="icon" type="image/jpeg" href="kmeet-logo.jfif.jfif">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", Arial, sans-serif;
      color: #fff;
      background:
        linear-gradient(
          rgba(13, 11, 14, 0.82),
          rgba(13, 11, 14, 0.92)
        ),
        url("img/bg34.jpg") center/cover fixed no-repeat;
      background-color: #0d0b0e;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .nav {
      width: 100%;
      min-height: 74px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      background: rgba(10, 8, 11, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .logo::before {
      content: "♥";
      margin-right: 8px;
      color: #ff4f91;
      font-size: 23px;
    }

    .navlinks {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .navlinks a {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s ease;
    }

    .navlinks a:hover {
      color: #ff6fa7;
    }

    .container {
      width: min(760px, 92%);
      margin: 70px auto;
    }

    .card {
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 24px;
      background: rgba(24, 19, 25, 0.78);
      box-shadow: 0 25px 70px rgba(0,0,0,0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .form {
      padding: 42px;
    }

    h2 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      text-align: center;
      color: #fff;
    }

    .small {
      margin: 0 auto 30px;
      max-width: 560px;
      text-align: center;
      line-height: 1.7;
      color: rgba(255,255,255,0.68);
      font-size: 14px;
    }

    .interests {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 26px;
    }

    .interest {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 14px 17px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .interest:hover {
      border-color: rgba(255,79,145,0.55);
      background: rgba(255,79,145,0.10);
      transform: translateY(-1px);
    }

    .interest input {
      width: 18px;
      height: 18px;
      accent-color: #ff4f91;
      cursor: pointer;
      flex-shrink: 0;
    }

    .interest:has(input:checked) {
      border-color: rgba(255,79,145,0.8);
      background: rgba(255,79,145,0.14);
      box-shadow: 0 0 0 1px rgba(255,79,145,0.12);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px 20px;
      background: linear-gradient(135deg, #ff4f91, #d93672);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255,79,145,0.22);
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(255,79,145,0.30);
    }

    .message {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .message.error {
      color: #ffdce8;
      background: rgba(220, 50, 90, 0.16);
      border: 1px solid rgba(255,100,140,0.25);
    }

    @media (max-width: 600px) {
      .nav {
        padding: 0 5%;
      }

      .navlinks {
        gap: 16px;
      }

      .container {
        margin: 35px auto;
      }

      .form {
        padding: 28px 20px;
      }

      h2 {
        font-size: 28px;
      }

      .interests {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <nav class="nav">
    <a class="logo" href="index.html">Kmeet</a>

    <div class="navlinks">
      <a href="discover.html">Discover</a>
      <a href="login.html">Log In</a>
    </div>
  </nav>

  <main class="container">

    <section class="card form">

      <h2>What are you interested in?</h2>

      <p class="small">
        Choose at least one. We'll save these with your new profile.
      </p>

      <form id="interestForm">

        <div class="interests">

          <label class="interest">
            <input type="checkbox" name="interest" value="Music">
            Music
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Sports">
            Sports
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Gaming">
            Gaming
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Cooking">
            Cooking
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Travel">
            Travel
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Art & Design">
            Art &amp; Design
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Tech & Coding">
            Tech &amp; Coding
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Fitness">
            Fitness
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Movies">
            Movies
          </label>

          <label class="interest">
            <input type="checkbox" name="interest" value="Reading">
            Reading
          </label>

        </div>

        <div id="msg"></div>

        <button class="btn" type="submit">
          Continue to Sign Up
        </button>

      </form>

    </section>

  </main>

  <script>
    document
      .getElementById("interestForm")
      .addEventListener("submit", function (e) {

        e.preventDefault();

        const selected = [
          ...document.querySelectorAll(
            'input[name="interest"]:checked'
          )
        ].map(input => input.value);

        const msg = document.getElementById("msg");

        if (!selected.length) {
          msg.innerHTML =
            '<div class="message error">Please choose at least one interest.</div>';
          return;
        }

        sessionStorage.setItem(
          "pendingInterests",
          JSON.stringify(selected)
        );

        window.location.href = "signup.html";
      });
  </script>

</body>
</html>
