
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Your Photo - Kmeet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(
                    circle at top left,
                    rgba(224,122,95,.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(140,80,160,.12),
                    transparent 35%
                ),
                #121016;

            color: #ffffff;

            font-family: 'Poppins', sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            animation: fadeIn .5s ease-out forwards;
        }

        body.fade-out {
            opacity: 0;
            transform: translateY(-8px);
            transition:
                opacity .35s ease,
                transform .35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           CONTAINER
        ========================= */

        .onboarding-container {
            width: 100%;
            max-width: 440px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 15px;

            margin-bottom: 32px;
        }

        .back-btn {
            width: 38px;
            height: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #aaa4aa;

            background: rgba(255,255,255,.05);

            border: 1px solid rgba(255,255,255,.08);

            text-decoration: none;

            transition: .2s ease;
        }

        .back-btn:hover {
            color: #ffffff;

            background: rgba(255,255,255,.10);
        }

        .progress-bar-container {
            display: flex;

            gap: 6px;

            flex: 1;
        }

        .progress-step {
            height: 4px;

            flex: 1;

            background: rgba(255,255,255,.13);

            border-radius: 10px;
        }

        .progress-step.completed,
        .progress-step.active {
            background: #e07a5f;
        }


        /* =========================
           HEADER
        ========================= */

        .onboarding-header {
            text-align: center;

            margin-bottom: 30px;
        }

        .brand-small {
            color: #e07a5f;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 8px;
        }

        .onboarding-header h1 {
            font-family: 'Playfair Display', serif;

            font-size: 30px;

            font-weight: 500;

            color: #fff5f1;

            margin-bottom: 9px;
        }

        .onboarding-header p {
            font-size: 13px;

            color: #a09a9f;

            line-height: 1.6;

            font-weight: 300;

            max-width: 390px;
        }


        /* =========================
           PHOTO AREA
        ========================= */

        .photo-upload-area {
            width: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 20px;

            margin-bottom: 28px;
        }

        .avatar-preview-wrapper {
            position: relative;

            width: 145px;
            height: 145px;

            border-radius: 50%;

            border: 2px dashed rgba(224,122,95,.55);

            padding: 5px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,.035);

            cursor: pointer;

            transition: .25s ease;
        }

        .avatar-preview-wrapper:hover {
            border-color: #e07a5f;

            transform: scale(1.02);
        }

        .avatar-img {
            width: 100%;
            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            display: none;
        }

        .avatar-placeholder {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            color: #aaa3aa;
        }

        .avatar-placeholder i {
            font-size: 32px;

            color: #e07a5f;
        }

        .avatar-placeholder span {
            font-size: 11px;
        }

        #fileInput {
            display: none;
        }


        /* =========================
           PRESET AVATARS
        ========================= */

        .preset-title {
            font-size: 11px;

            color: #837a82;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .preset-grid {
            display: flex;

            gap: 13px;

            justify-content: center;
        }

        .preset-avatar {
            width: 54px;
            height: 54px;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,.10);

            cursor: pointer;

            object-fit: cover;

            transition:
                transform .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .preset-avatar:hover {
            transform: scale(1.08);

            border-color: rgba(224,122,95,.65);
        }

        .preset-avatar.selected {
            border-color: #e07a5f;

            transform: scale(1.10);

            box-shadow:
                0 0 0 4px rgba(224,122,95,.10);
        }


        /* =========================
           BUTTON
        ========================= */

        .footer-action {
            width: 100%;
        }

        .btn-continue {
            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 28px;

            background:
                linear-gradient(
                    135deg,
                    #e07a5f,
                    #d6634d
                );

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            font-family: 'Poppins', sans-serif;

            cursor: pointer;

            box-shadow:
                0 12px 28px rgba(224,122,95,.18);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .btn-continue:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 32px rgba(224,122,95,.25);
        }

        .btn-continue:active {
            transform: scale(.98);
        }


        /* =========================
           SKIP
        ========================= */

        .skip-text {
            margin-top: 15px;

            text-align: center;

            font-size: 11px;

            color: #77717a;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 420px) {

            body {
                padding: 18px;
            }

            .onboarding-header h1 {
                font-size: 27px;
            }

            .avatar-preview-wrapper {
                width: 135px;
                height: 135px;
            }
        }
    </style>
</head>


<body>

<main class="onboarding-container">


    <!-- =========================
         TOP BAR
    ========================= -->

    <div class="top-bar">

        <a
            href="onboarding.html"
            class="back-btn"
            aria-label="Go back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </a>


        <div class="progress-bar-container">

            <div class="progress-step completed"></div>

            <div class="progress-step completed"></div>

            <div class="progress-step active"></div>

            <div class="progress-step"></div>

            <div class="progress-step"></div>

        </div>

    </div>



    <!-- =========================
         HEADER
    ========================= -->

    <div class="onboarding-header">

        <div class="brand-small">
            Kmeet
        </div>

        <h1>
            Add your photo
        </h1>

        <p>
            Add a photo so people can recognize you.
            You can also choose one of our starter avatars.
        </p>

    </div>



    <!-- =========================
         PHOTO AREA
    ========================= -->

    <div class="photo-upload-area">


        <!-- CUSTOM PHOTO -->

        <label
            for="fileInput"
            class="avatar-preview-wrapper"
            id="uploadWrapper"
        >

            <img
                id="avatarPreview"
                class="avatar-img"
                src=""
                alt="Profile Preview"
            >


            <div
                id="avatarPlaceholder"
                class="avatar-placeholder"
            >

                <i class="fa-solid fa-camera"></i>

                <span>
                    Upload Photo
                </span>

            </div>

        </label>


        <input
            type="file"
            id="fileInput"
            accept="image/jpeg,image/png,image/webp,image/gif"
        >



        <!-- PRESETS -->

        <span class="preset-title">
            Or pick a starter avatar
        </span>


        <div class="preset-grid">


            <img
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80"
                class="preset-avatar"
                data-src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=85"
                alt="Starter avatar"
            >


            <img
                src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80"
                class="preset-avatar"
                data-src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&auto=format&fit=crop&q=85"
                alt="Starter avatar"
            >


            <img
                src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80"
                class="preset-avatar"
                data-src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&auto=format&fit=crop&q=85"
                alt="Starter avatar"
            >

        </div>

    </div>



    <!-- =========================
         CONTINUE
    ========================= -->

    <div class="footer-action">

        <button
            id="finishBtn"
            type="button"
            class="btn-continue"
        >
            Continue
            <i class="fa-solid fa-arrow-right"></i>
        </button>


        <div class="skip-text">
            You can change your photo later from your profile.
        </div>

    </div>


</main>



<script>

    const fileInput =
        document.getElementById("fileInput");

    const avatarPreview =
        document.getElementById("avatarPreview");

    const avatarPlaceholder =
        document.getElementById("avatarPlaceholder");

    const presets =
        document.querySelectorAll(".preset-avatar");

    const finishBtn =
        document.getElementById("finishBtn");


    let selectedPhotoData = "";


    /* ==========================================
       LOCAL PHOTO
    ========================================== */

    fileInput.addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            /* Only allow images */

            if (!file.type.startsWith("image/")) {

                alert("Please choose an image file.");

                fileInput.value = "";

                return;
            }


            /* Maximum 5MB */

            if (file.size > 5 * 1024 * 1024) {

                alert("Please choose an image smaller than 5MB.");

                fileInput.value = "";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(loadEvent) {

                    selectedPhotoData =
                        loadEvent.target.result;


                    avatarPreview.src =
                        selectedPhotoData;


                    avatarPreview.style.display =
                        "block";


                    avatarPlaceholder.style.display =
                        "none";


                    presets.forEach(
                        function(preset) {

                            preset.classList.remove(
                                "selected"
                            );

                        }
                    );

                };


            reader.readAsDataURL(file);

        }
    );



    /* ==========================================
       PRESET AVATARS
    ========================================== */

    presets.forEach(
        function(preset) {

            preset.addEventListener(
                "click",
                function() {

                    presets.forEach(
                        function(item) {

                            item.classList.remove(
                                "selected"
                            );

                        }
                    );


                    this.classList.add("selected");


                    selectedPhotoData =
                        this.getAttribute(
                            "data-src"
                        );


                    avatarPreview.src =
                        selectedPhotoData;


                    avatarPreview.style.display =
                        "block";


                    avatarPlaceholder.style.display =
                        "none";

                }
            );

        }
    );



    /* ==========================================
       CONTINUE
       
       IMPORTANT:
       
       The user has NOT created their Firebase
       account yet.
       
       Therefore DO NOT send them to profile.html.
       
       Send them to signup.html.
    ========================================== */

    finishBtn.addEventListener(
        "click",
        function() {


            /*
             * If no photo was selected,
             * use a starter avatar.
             */

            if (!selectedPhotoData) {

                selectedPhotoData =
                    "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=85";

            }


            /*
             * Save photo temporarily.
             *
             * Signup will create the Firebase account.
             * The profile page can use this later.
             */

            localStorage.setItem(
                "userAvatar",
                selectedPhotoData
            );


            /*
             * Preserve the interests.
             *
             * We do NOT remove them here.
             */

            const sessionInterests =
                sessionStorage.getItem(
                    "pendingInterests"
                );

            const localInterests =
                localStorage.getItem(
                    "userInterests"
                );


            /*
             * If only localStorage has the interests,
             * copy them into sessionStorage so signup
             * can find them.
             */

            if (
                !sessionInterests &&
                localInterests
            ) {

                sessionStorage.setItem(
                    "pendingInterests",
                    localInterests
                );

            }


            /*
             * Fade out.
             */

            document.body.classList.add(
                "fade-out"
            );


            /*
             * IMPORTANT:
             *
             * Go to account creation,
             * NOT profile.html.
             */

            setTimeout(
                function() {

                    window.location.href =
                        "signup.html";

                },
                350
            );

        }
    );

</script>

</body>
</html>
