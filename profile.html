<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kmeet - Profile</title>

  <!-- KMEET WEB LOGO -->
  <link
    rel="icon"
    type="image/jpeg"
    href="https://kmet254.github.io/K-meet/kmeet-logo.jfif.jfif"
  >

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(214, 76, 128, .24),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(128, 60, 130, .20),
          transparent 32%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(190, 67, 115, .15),
          transparent 38%
        ),
        linear-gradient(
          135deg,
          #0b080d 0%,
          #150c14 45%,
          #0b080d 100%
        );

      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.018),
          transparent 40%,
          rgba(255,255,255,.012)
        );

      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .profile-nav {
      width: 100%;
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 6%;

      background: rgba(10, 7, 12, .78);

      border-bottom:
        1px solid rgba(255,255,255,.09);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      position: sticky;
      top: 0;
      z-index: 1000;
    }


    /* =====================================================
       KMEET WEB LOGO
       ===================================================== */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 700;

      flex-shrink: 0;
    }

    .brand-logo-wrap {
      position: relative;

      width: 54px;
      height: 54px;

      min-width: 54px;
      min-height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      border-radius: 50%;

      background: #fff;

      border:
        2px solid rgba(255,255,255,.96);

      box-shadow:
        0 0 0 2px rgba(255,91,161,.12),
        0 0 22px rgba(230,106,148,.48);

      flex-shrink: 0;
    }

    .brand-logo {
      display: block !important;

      width: 50px !important;
      height: 50px !important;

      min-width: 50px !important;
      min-height: 50px !important;

      max-width: 50px !important;
      max-height: 50px !important;

      object-fit: cover !important;
      object-position: center !important;

      border-radius: 50%;

      opacity: 1 !important;
      visibility: visible !important;

      flex-shrink: 0;
    }

    .brand-name {
      color: #fff;
    }


    /* =====================================================
       NAV LINKS
       ===================================================== */

    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-links a,
    .logout-btn {
      border:
        1px solid rgba(255,255,255,.12);

      background:
        rgba(255,255,255,.055);

      padding:
        10px 17px;

      border-radius:
        30px;

      color:
        rgba(255,255,255,.88);

      font-size:
        13px;

      font-weight:
        500;

      transition:
        .2s ease;
    }

    .nav-links a:hover,
    .logout-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.11);
    }

    .nav-links .active {
      background:
        rgba(230,106,148,.18);

      border-color:
        rgba(255,133,174,.32);
    }

    .logout-btn {
      cursor: pointer;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      width:
        min(
          calc(100% - 30px),
          960px
        );

      margin: 0 auto;

      padding:
        48px 0 70px;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    #loading {
      min-height: 400px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      color:
        rgba(255,255,255,.70);
    }

    .loader-box {
      padding: 35px;
    }

    .spinner {
      width: 42px;
      height: 42px;

      margin:
        0 auto 18px;

      border-radius: 50%;

      border:
        3px solid rgba(255,255,255,.13);

      border-top-color:
        #e66a94;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       ERROR
       ===================================================== */

    #errorArea {
      display: none;

      max-width: 650px;

      margin:
        60px auto;

      padding: 30px;

      text-align: center;

      border-radius: 24px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid rgba(255,255,255,.10);

      backdrop-filter:
        blur(18px);
    }

    #errorArea h2 {
      font-family:
        "Playfair Display",
        serif;

      font-size: 27px;
      margin-bottom: 10px;
    }

    #errorArea p {
      color:
        rgba(255,255,255,.65);

      line-height: 1.7;
      font-size: 14px;
    }


    /* =====================================================
       PROFILE CARD
       ===================================================== */

    #profileContent {
      display: none;
    }

    .profile-card {
      position: relative;
      overflow: hidden;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.035)
        );

      border:
        1px solid rgba(255,255,255,.13);

      box-shadow:
        0 30px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.06);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);
    }


    /* =====================================================
       PROFILE HEADER
       ===================================================== */

    .profile-top {
      padding:
        42px 35px 30px;

      text-align: center;

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }

    .photo-frame {
      width: 165px;
      height: 165px;

      margin:
        0 auto 22px;

      padding: 5px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(255,118,170,.95),
          rgba(190,91,145,.70)
        );

      box-shadow:
        0 15px 45px rgba(0,0,0,.38),
        0 0 35px rgba(230,106,148,.18);
    }

    .profile-photo {
      width: 100%;
      height: 100%;

      display: none;

      object-fit: cover;

      border-radius: 50%;

      background:
        #211620;

      border:
        3px solid rgba(255,255,255,.92);
    }

    .default-avatar {
      width: 100%;
      height: 100%;

      display: none;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #33202c,
          #191219
        );

      border:
        3px solid rgba(255,255,255,.92);

      font-size: 55px;

      color:
        rgba(255,255,255,.62);
    }

    .profile-name {
      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(30px,5vw,42px);

      font-weight: 600;

      margin-bottom: 7px;
    }

    .profile-location {
      color:
        rgba(255,255,255,.60);

      font-size: 14px;
    }

    .profile-location i {
      margin-right: 5px;
      color: #f08bad;
    }


    /* =====================================================
       ONLINE STATUS
       ===================================================== */

    .online-status {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-top: 13px;

      padding:
        6px 13px;

      border-radius: 30px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid rgba(255,255,255,.08);

      font-size: 12px;

      color:
        rgba(255,255,255,.70);
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        #777;
    }

    .status-dot.online {
      background:
        #58e08a;

      box-shadow:
        0 0 10px rgba(88,224,138,.75);
    }


    /* =====================================================
       PROFILE BODY
       ===================================================== */

    .profile-body {
      padding:
        34px 35px 38px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      display: flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 12px;

      font-size: 13px;
      font-weight: 600;

      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .section-title i {
      color:
        #eb719a;
    }

    .bio {
      color:
        rgba(255,255,255,.69);

      font-size: 15px;
      line-height: 1.8;
    }


    /* =====================================================
       INFORMATION
       ===================================================== */

    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap: 12px;
    }

    .info-item {
      padding:
        15px 16px;

      border-radius:
        17px;

      background:
        rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.075);
    }

    .info-label {
      display: block;

      color:
        rgba(255,255,255,.42);

      font-size: 11px;

      margin-bottom: 4px;

      text-transform: uppercase;

      letter-spacing: .7px;
    }

    .info-value {
      color:
        rgba(255,255,255,.88);

      font-size: 14px;
    }


    /* =====================================================
       INTERESTS
       ===================================================== */

    .interests {
      display: flex;

      flex-wrap: wrap;

      gap: 9px;
    }

    .interest {
      padding:
        8px 14px;

      border-radius: 30px;

      color:
        rgba(255,255,255,.82);

      background:
        rgba(230,106,148,.12);

      border:
        1px solid rgba(230,106,148,.24);

      font-size: 12px;
    }


    /* =====================================================
       ACTION BUTTONS
       ===================================================== */

    .profile-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 8px;
    }

    .action-btn {
      flex:
        1 1 180px;

      min-height: 50px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      padding:
        13px 20px;

      border-radius:
        16px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        .2s ease;
    }

    .action-btn:hover {
      transform:
        translateY(-2px);
    }

    .edit-btn,
    .chat-btn {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #e66a94,
          #bd527e
        );

      border:
        1px solid rgba(255,255,255,.12);

      box-shadow:
        0 12px 30px rgba(190,82,126,.25);
    }

    .discover-btn {
      color:
        rgba(255,255,255,.88);

      background:
        rgba(255,255,255,.065);

      border:
        1px solid rgba(255,255,255,.13);
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      text-align: center;

      padding-top: 25px;

      color:
        rgba(255,255,255,.35);

      font-size: 11px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width:700px) {

      .profile-nav {
        min-height: 70px;
        padding: 10px 15px;
      }

      .brand {
        font-size: 24px;
        gap: 9px;
      }

      .brand-logo-wrap {
        width: 47px;
        height: 47px;

        min-width: 47px;
        min-height: 47px;
      }

      .brand-logo {
        width: 43px !important;
        height: 43px !important;

        min-width: 43px !important;
        min-height: 43px !important;

        max-width: 43px !important;
        max-height: 43px !important;
      }

      .nav-links {
        gap: 5px;
      }

      .nav-links a,
      .logout-btn {
        padding:
          8px 10px;

        font-size: 11px;
      }

      .home-link {
        display: none;
      }

      .page {
        width:
          calc(100% - 18px);

        padding-top: 25px;
      }

      .profile-card {
        border-radius: 23px;
      }

      .profile-top {
        padding:
          30px 20px 25px;
      }

      .profile-body {
        padding:
          25px 20px 30px;
      }

      .photo-frame {
        width: 140px;
        height: 140px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .action-btn {
        flex-basis: 100%;
      }
    }

    @media (max-width:430px) {

      .brand-name {
        display: none;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script type="module">

    import {
      auth,
      db,

      database,
      databaseRef,
      databaseSet,
      databaseOnValue,
      onDisconnect,
      databaseServerTimestamp,

      onAuthStateChanged,
      signOut,

      doc,
      getDoc

    } from "./firebase-config.js";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const loading =
      document.getElementById("loading");

    const profileContent =
      document.getElementById("profileContent");

    const errorArea =
      document.getElementById("errorArea");

    const errorText =
      document.getElementById("errorText");

    const profilePhoto =
      document.getElementById("profilePhoto");

    const defaultAvatar =
      document.getElementById("defaultAvatar");

    const profileName =
      document.getElementById("profileName");

    const profileLocation =
      document.getElementById("profileLocation");

    const profileLocationInfo =
      document.getElementById("profileLocationInfo");

    const profileBio =
      document.getElementById("profileBio");

    const profileAge =
      document.getElementById("profileAge");

    const profileGender =
      document.getElementById("profileGender");

    const interests =
      document.getElementById("interests");

    const editProfileBtn =
      document.getElementById("editProfileBtn");

    const chatBtn =
      document.getElementById("chatBtn");

    const statusDot =
      document.getElementById("statusDot");

    const statusText =
      document.getElementById("statusText");

    const logoutBtn =
      document.getElementById("logoutBtn");


    /* =====================================================
       URL
       ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedUserId =
      params.get("id");


    let currentUser = null;


    /* =====================================================
       SHOW ERROR
       ===================================================== */

    function showError(message) {

      loading.style.display = "none";

      profileContent.style.display = "none";

      errorArea.style.display = "block";

      errorText.textContent = message;

    }


    /* =====================================================
       PROFILE PHOTO
       ===================================================== */

    function setProfilePhoto(url) {

      const cleanUrl =
        typeof url === "string"
          ? url.trim()
          : "";


      if (!cleanUrl) {

        profilePhoto.style.display = "none";

        defaultAvatar.style.display = "flex";

        return;
      }


      profilePhoto.onload = () => {

        profilePhoto.style.display = "block";

        defaultAvatar.style.display = "none";

        console.log(
          "KMEET: Profile photo loaded."
        );

      };


      profilePhoto.onerror = () => {

        console.error(
          "KMEET: Profile photo failed to load:",
          cleanUrl
        );

        profilePhoto.style.display = "none";

        defaultAvatar.style.display = "flex";

      };


      profilePhoto.src = cleanUrl;

    }


    /* =====================================================
       GET PROFILE PHOTO
       ===================================================== */

    function getPhotoUrl(data) {

      return (
        data.photoURL ||
        data.profilePhoto ||
        data.photo ||
        data.avatar ||
        ""
      );

    }


    /* =====================================================
       DISPLAY PROFILE
       ===================================================== */

    function displayProfile(data) {

      profileName.textContent =
        data.name ||
        data.displayName ||
        "Kmeet Member";


      const location =
        data.location ||
        "Kenya";


      profileLocation.innerHTML =
        `
          <i class="fa-solid fa-location-dot"></i>
          ${escapeHtml(location)}
        `;


      profileLocationInfo.textContent =
        location;


      profileBio.textContent =
        data.bio ||
        "Connecting hearts naturally.";


      profileAge.textContent =
        data.age !== null &&
        data.age !== undefined &&
        data.age !== ""
          ? data.age
          : "—";


      profileGender.textContent =
        data.gender ||
        "—";


      setProfilePhoto(
        getPhotoUrl(data)
      );


      /* INTERESTS */

      interests.innerHTML = "";


      let list =
        data.interests;


      if (!Array.isArray(list)) {

        if (
          typeof list === "string" &&
          list.trim()
        ) {

          list =
            list
              .split(",")
              .map(
                item => item.trim()
              )
              .filter(Boolean);

        } else {

          list = [];

        }

      }


      if (list.length === 0) {

        const tag =
          document.createElement("span");

        tag.className =
          "interest";

        tag.textContent =
          "Getting to know Kmeet";

        interests.appendChild(tag);

      } else {

        list
          .slice(0, 20)
          .forEach(item => {

            const tag =
              document.createElement("span");

            tag.className =
              "interest";

            tag.textContent =
              item;

            interests.appendChild(tag);

          });

      }

    }


    /* =====================================================
       HTML ESCAPE
       ===================================================== */

    function escapeHtml(value) {

      return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =====================================================
       LOAD PROFILE
       ===================================================== */

    async function loadProfile(
      userId,
      ownProfile
    ) {

      try {

        console.log(
          "KMEET: Loading profile:",
          userId
        );


        /*
          users/{uid} is a Firestore document.
        */

        const profileRef =
          doc(
            db,
            "users",
            userId
          );


        const profileSnap =
          await getDoc(
            profileRef
          );


        if (!profileSnap.exists()) {

          showError(
            "This Kmeet profile could not be found."
          );

          return;

        }


        const profileData =
          profileSnap.data();


        console.log(
          "KMEET: Profile loaded:",
          profileData
        );


        /* ===============================================
           RENDER PROFILE FIRST
           =============================================== */

        displayProfile(
          profileData
        );


        /*
          IMPORTANT:

          The profile is made visible BEFORE
          Realtime Database presence starts.

          Therefore presence can never leave
          the page stuck on Loading.
        */

        loading.style.display =
          "none";

        errorArea.style.display =
          "none";

        profileContent.style.display =
          "block";


        console.log(
          "KMEET: Profile is now visible."
        );


        /* ===============================================
           OWN PROFILE
           =============================================== */

        if (ownProfile) {

          editProfileBtn.style.display =
            "inline-flex";

          chatBtn.style.display =
            "none";


          /*
            Show a neutral state immediately.
          */

          setStatusDisplay(false);


          /*
            Start real presence AFTER rendering.
          */

          setTimeout(() => {

            startOwnPresence(userId);

          }, 100);

        }


        /* ===============================================
           OTHER PROFILE
           =============================================== */

        else {

          editProfileBtn.style.display =
            "none";

          chatBtn.style.display =
            "inline-flex";


          chatBtn.href =
            "chat.html?userId=" +
            encodeURIComponent(
              userId
            );


          setStatusDisplay(false);


          setTimeout(() => {

            watchMemberPresence(userId);

          }, 100);

        }


      } catch (error) {

        console.error(
          "KMEET profile loading error:",
          error
        );


        showError(
          "We could not load this profile. Please refresh and try again."
        );

      }

    }


    /* =====================================================
       REAL OWN USER PRESENCE
       ===================================================== */

    function startOwnPresence(userId) {

      console.log(
        "KMEET: Starting own presence..."
      );


      try {

        const connectedRef =
          databaseRef(
            database,
            ".info/connected"
          );


        const statusRef =
          databaseRef(
            database,
            "status/" + userId
          );


        databaseOnValue(
          connectedRef,
          async snapshot => {

            const connected =
              snapshot.val();


            console.log(
              "KMEET: Firebase connected:",
              connected
            );


            if (
              connected !== true
            ) {

              setStatusDisplay(false);

              return;

            }


            try {

              /*
                Tell Firebase to mark this user
                offline when the connection disappears.
              */

              const disconnectHandler =
                onDisconnect(
                  statusRef
                );


              await disconnectHandler.set({

                state:
                  "offline",

                lastChanged:
                  databaseServerTimestamp()

              });


              /*
                Now mark the user ONLINE.
              */

              await databaseSet(
                statusRef,
                {

                  state:
                    "online",

                  lastChanged:
                    databaseServerTimestamp()

                }
              );


              setStatusDisplay(true);


              console.log(
                "KMEET: You are ONLINE."
              );


            } catch (error) {

              console.error(
                "KMEET: Presence write error:",
                error
              );

              /*
                Presence failure must NOT
                hide the profile.
              */

              setStatusDisplay(false);

            }

          },
          error => {

            console.error(
              "KMEET: Connection listener error:",
              error
            );

            setStatusDisplay(false);

          }
        );


      } catch (error) {

        console.error(
          "KMEET: Presence setup error:",
          error
        );

        setStatusDisplay(false);

      }

    }


    /* =====================================================
       WATCH ANOTHER MEMBER
       ===================================================== */

    function watchMemberPresence(userId) {

      console.log(
        "KMEET: Watching presence:",
        userId
      );


      try {

        const statusRef =
          databaseRef(
            database,
            "status/" + userId
          );


        databaseOnValue(
          statusRef,
          snapshot => {

            const status =
              snapshot.val();


            if (
              status &&
              status.state === "online"
            ) {

              setStatusDisplay(true);

            } else {

              setStatusDisplay(false);

            }

          },
          error => {

            console.warn(
              "KMEET: Presence read error:",
              error
            );

            setStatusDisplay(false);

          }
        );


      } catch (error) {

        console.warn(
          "KMEET: Presence unavailable:",
          error
        );

        setStatusDisplay(false);

      }

    }


    /* =====================================================
       STATUS DISPLAY
       ===================================================== */

    function setStatusDisplay(online) {

      if (online) {

        statusDot.classList.add(
          "online"
        );

        statusText.textContent =
          "Online";

      } else {

        statusDot.classList.remove(
          "online"
        );

        statusText.textContent =
          "Offline";

      }

    }


    /* =====================================================
       LOGOUT
       ===================================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          if (
            currentUser &&
            !currentUser.isAnonymous
          ) {

            try {

              const statusRef =
                databaseRef(
                  database,
                  "status/" +
                  currentUser.uid
                );


              await databaseSet(
                statusRef,
                {

                  state:
                    "offline",

                  lastChanged:
                    databaseServerTimestamp()

                }
              );


            } catch (presenceError) {

              console.warn(
                "KMEET: Could not update offline status:",
                presenceError
              );

            }

          }


          await signOut(auth);


          window.location.replace(
            "login.html"
          );


        } catch (error) {

          console.error(
            "KMEET logout error:",
            error
          );

          alert(
            "Could not log out. Please try again."
          );

        }

      }
    );


    /* =====================================================
       AUTHENTICATION
       ===================================================== */

    onAuthStateChanged(
      auth,
      async user => {

        try {

          currentUser =
            user;


          console.log(
            "KMEET: Auth user:",
            user
              ? user.uid
              : "none"
          );


          /*
            No ?id= means own profile.
          */

          if (!requestedUserId) {

            if (
              !user ||
              user.isAnonymous
            ) {

              window.location.replace(
                "login.html"
              );

              return;

            }


            await loadProfile(
              user.uid,
              true
            );

            return;

          }


          /*
            ?id=UID means member profile.
          */

          const ownProfile =
            !!(
              user &&
              !user.isAnonymous &&
              user.uid ===
                requestedUserId
            );


          await loadProfile(
            requestedUserId,
            ownProfile
          );


        } catch (error) {

          console.error(
            "KMEET authentication error:",
            error
          );


          showError(
            "Something went wrong while opening this profile."
          );

        }

      }
    );


    /* =====================================================
       LOGO CHECK
       ===================================================== */

    const brandLogo =
      document.getElementById(
        "brandLogo"
      );


    if (brandLogo) {

      brandLogo.addEventListener(
        "load",
        () => {

          console.log(
            "KMEET: Web logo loaded successfully."
          );

        }
      );


      brandLogo.addEventListener(
        "error",
        () => {

          console.error(
            "KMEET: Web logo could not be loaded."
          );

        }
      );

    }

  </script>
