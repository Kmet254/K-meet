<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kmeet - Profile</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link rel="icon" href="kmeet-logo.jfif.jfif" type="image/jpeg">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      min-height: 100vh;

      font-family: "Poppins", sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(177, 46, 91, 0.24),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(113, 30, 73, 0.22),
          transparent 32%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(109, 25, 65, 0.20),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #0c080c 0%,
          #160b12 48%,
          #0b070b 100%
        );

      overflow-x: hidden;
    }


    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,0.025),
          transparent 45%
        );

      z-index: 0;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button,
    input,
    textarea {
      font-family: inherit;
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .topbar {

      position: sticky;

      top: 0;

      z-index: 100;

      width: 100%;

      min-height: 76px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 5%;

      background:
        rgba(13, 7, 12, 0.86);

      border-bottom:
        1px solid rgba(255,255,255,0.08);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 8px;

      font-family:
        "Playfair Display",
        serif;

      font-size: 29px;

      font-weight: 700;

      letter-spacing: -0.5px;
    }


    .brand-heart {

      color: #f05a91;

      font-size: 23px;

      filter:
        drop-shadow(
          0 0 10px
          rgba(240,90,145,0.35)
        );
    }


    .brand-k {
      color: #ffffff;
    }


    .brand-meet {
      color: #ef6b9c;
    }


    .nav-links {

      display: flex;

      align-items: center;

      gap: 25px;
    }


    .nav-links a {

      color:
        rgba(255,255,255,0.78);

      font-size: 13px;

      font-weight: 500;

      transition:
        color .2s ease,
        transform .2s ease;
    }


    .nav-links a:hover {

      color: #ffffff;

      transform:
        translateY(-1px);
    }


    .nav-links .active {

      color: #f26b9e;
    }


    .logout-nav {

      border: 0;

      background: transparent;

      color:
        rgba(255,255,255,0.72);

      cursor: pointer;

      font-size: 13px;

      font-weight: 500;

      padding: 0;
    }


    .logout-nav:hover {
      color: #ff719f;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {

      position: relative;

      z-index: 1;

      width: min(
        calc(100% - 30px),
        980px
      );

      margin: 0 auto;

      padding:
        42px 0 70px;
    }


    .page-heading {

      text-align: center;

      margin-bottom: 30px;
    }


    .page-heading .eyebrow {

      display: inline-block;

      margin-bottom: 8px;

      color: #ee6b9c;

      font-size: 11px;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 2px;
    }


    .page-heading h1 {

      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(31px, 5vw, 47px);

      line-height: 1.1;

      font-weight: 600;
    }


    .page-heading p {

      max-width: 590px;

      margin: 10px auto 0;

      color:
        rgba(255,255,255,0.60);

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       PROFILE CARD
       ===================================================== */

    .profile-card {

      display: grid;

      grid-template-columns:
        330px 1fr;

      gap: 30px;

      padding: 25px;

      border:
        1px solid rgba(255,255,255,0.10);

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.025)
        );

      box-shadow:
        0 25px 80px
        rgba(0,0,0,0.40),

        inset 0 1px 0
        rgba(255,255,255,0.05);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);
    }


    /* =====================================================
       PHOTO
       ===================================================== */

    .photo-section {

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    .photo-frame {

      position: relative;

      width: 100%;

      max-width: 330px;

      aspect-ratio: 4 / 4.8;

      overflow: hidden;

      border-radius: 25px;

      border:
        1px solid rgba(255,255,255,0.12);

      background:
        linear-gradient(
          145deg,
          #341523,
          #120a0f
        );

      box-shadow:
        0 18px 45px
        rgba(0,0,0,0.38);
    }


    .profile-photo {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      object-position: center;

      transition:
        transform .35s ease;
    }


    .photo-frame:hover
    .profile-photo {

      transform:
        scale(1.025);
    }


    .photo-fallback {

      position: absolute;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(241,96,146,0.30),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          #59233c,
          #130b10
        );
    }


    .photo-fallback.show {
      display: flex;
    }


    .fallback-letter {

      width: 105px;

      height: 105px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(255,255,255,0.12);

      border:
        1px solid rgba(255,255,255,0.15);

      font-family:
        "Playfair Display",
        serif;

      font-size: 52px;

      font-weight: 600;
    }


    .fallback-brand {

      margin-top: 15px;

      color:
        rgba(255,255,255,0.65);

      font-family:
        "Playfair Display",
        serif;

      font-size: 17px;
    }


    /* =====================================================
       ONLINE STATUS
       ===================================================== */

    .status-pill {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-top: 15px;

      padding:
        8px 14px;

      border-radius: 50px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.09);

      color:
        rgba(255,255,255,0.76);

      font-size: 12px;

      font-weight: 500;
    }


    .status-dot {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #777;

      box-shadow:
        0 0 0 3px
        rgba(255,255,255,0.05);
    }


    .status-dot.online {

      background: #35d487;

      box-shadow:
        0 0 0 3px
        rgba(53,212,135,0.10),

        0 0 12px
        rgba(53,212,135,0.45);
    }


    .status-dot.offline {
      background: #888;
    }


    /* =====================================================
       PROFILE INFORMATION
       ===================================================== */

    .profile-info {

      display: flex;

      flex-direction: column;

      min-width: 0;
    }


    .profile-top {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 20px;

      padding-bottom: 19px;

      border-bottom:
        1px solid rgba(255,255,255,0.08);
    }


    .profile-name {

      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(29px, 4vw, 40px);

      line-height: 1.12;

      font-weight: 600;
    }


    .profile-location {

      margin-top: 7px;

      color:
        rgba(255,255,255,0.55);

      font-size: 13px;
    }


    .profile-location::before {
      content: "⌖ ";
      color: #ef6b9c;
    }


    /* =====================================================
       EDIT BUTTON
       ===================================================== */

    .profile-owner-actions {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 21px;
    }


    .edit-profile-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 47px;

      padding:
        0 20px;

      border-radius: 13px;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #e95891,
          #a82f64
        );

      border:
        1px solid
        rgba(255,255,255,0.12);

      box-shadow:
        0 9px 25px
        rgba(190,53,105,0.25);

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }


    .edit-profile-button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 13px 32px
        rgba(190,53,105,0.35);
    }


    .secondary-profile-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 47px;

      padding:
        0 19px;

      border-radius: 13px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid
        rgba(255,255,255,0.12);

      color:
        rgba(255,255,255,0.88);

      font-size: 13px;

      font-weight: 500;

      transition:
        background .2s ease,
        transform .2s ease;
    }


    .secondary-profile-button:hover {

      background:
        rgba(255,255,255,0.10);

      transform:
        translateY(-2px);
    }


    /* =====================================================
       DETAIL GRID
       ===================================================== */

    .details-grid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 12px;

      margin-top: 23px;
    }


    .detail-box {

      min-height: 75px;

      padding:
        14px 15px;

      border-radius: 16px;

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid
        rgba(255,255,255,0.065);
    }


    .detail-label {

      color:
        rgba(255,255,255,0.42);

      font-size: 10px;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 1.2px;
    }


    .detail-value {

      margin-top: 6px;

      color:
        rgba(255,255,255,0.92);

      font-size: 14px;

      font-weight: 500;

      word-break: break-word;
    }


    /* =====================================================
       ABOUT
       ===================================================== */

    .section {

      margin-top: 24px;
    }


    .section-title {

      margin-bottom: 10px;

      color: #ef6b9c;

      font-size: 11px;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 1.8px;
    }


    .bio {

      color:
        rgba(255,255,255,0.72);

      font-size: 14px;

      line-height: 1.8;
    }


    /* =====================================================
       INTERESTS
       ===================================================== */

    .interest-list {

      display: flex;

      flex-wrap: wrap;

      gap: 9px;
    }


    .interest-chip {

      padding:
        8px 12px;

      border-radius: 50px;

      color:
        rgba(255,255,255,0.82);

      background:
        rgba(226,73,127,0.10);

      border:
        1px solid
        rgba(226,73,127,0.20);

      font-size: 12px;
    }


    .no-interests {

      color:
        rgba(255,255,255,0.40);

      font-size: 13px;
    }


    /* =====================================================
       VISITOR ACTIONS
       ===================================================== */

    .visitor-actions {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: auto;

      padding-top: 25px;
    }


    .chat-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 48px;

      padding:
        0 22px;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #e85a93,
          #9d2c5f
        );

      color: white;

      font-size: 13px;

      font-weight: 600;

      box-shadow:
        0 10px 28px
        rgba(192,49,105,0.25);
    }


    .back-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 48px;

      padding:
        0 20px;

      border-radius: 13px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid
        rgba(255,255,255,0.10);

      color:
        rgba(255,255,255,0.82);

      font-size: 13px;

      font-weight: 500;
    }


    /* =====================================================
       LOADING / ERROR
       ===================================================== */

    .state-card {

      width: min(
        100%,
        600px
      );

      margin:
        60px auto;

      padding: 38px 28px;

      text-align: center;

      border:
        1px solid
        rgba(255,255,255,0.10);

      border-radius: 24px;

      background:
        rgba(255,255,255,0.045);

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.35);
    }


    .state-icon {

      font-size: 38px;

      margin-bottom: 13px;
    }


    .state-card h2 {

      font-family:
        "Playfair Display",
        serif;

      font-size: 27px;
    }


    .state-card p {

      margin-top: 9px;

      color:
        rgba(255,255,255,0.57);

      font-size: 13px;

      line-height: 1.7;
    }


    .state-button {

      display: inline-flex;

      margin-top: 20px;

      padding:
        12px 20px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #e85b93,
          #a72f63
        );

      font-size: 13px;

      font-weight: 600;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {

      margin-top: 35px;

      text-align: center;

      color:
        rgba(255,255,255,0.30);

      font-size: 11px;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 800px) {

      .topbar {
        padding: 0 20px;
      }


      .nav-links {
        gap: 15px;
      }


      .nav-links a,
      .logout-nav {
        font-size: 11px;
      }


      .profile-card {

        grid-template-columns: 1fr;

        padding: 18px;

        gap: 24px;
      }


      .photo-frame {

        max-width: 310px;
      }


      .photo-section {

        align-items: center;
      }


      .profile-top {
        flex-direction: column;
      }

    }


    @media (max-width: 520px) {

      .topbar {
        min-height: 68px;
      }


      .brand {
        font-size: 24px;
      }


      .brand-heart {
        font-size: 19px;
      }


      .nav-links {
        gap: 10px;
      }


      .nav-links a:nth-child(1) {
        display: none;
      }


      .page {
        width:
          min(
            calc(100% - 20px),
            980px
          );

        padding-top: 28px;
      }


      .details-grid {
        grid-template-columns: 1fr;
      }


      .profile-owner-actions,
      .visitor-actions {
        flex-direction: column;
      }


      .edit-profile-button,
      .secondary-profile-button,
      .chat-button,
      .back-button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
    >

      <span class="brand-heart">♥</span>

      <span class="brand-k">K</span><span class="brand-meet">meet</span>

    </a>


    <nav class="nav-links">

      <a href="discover.html">
        Discover
      </a>


      <a
        href="likes.html"
        id="likesLink"
      >
        My Likes
      </a>


      <a
        href="profile.html"
        id="profileNav"
        class="active"
      >
        Profile
      </a>


      <a href="index.html">
        Home
      </a>


      <button
        type="button"
        id="logoutBtn"
        class="logout-nav"
      >
        Logout
      </button>

    </nav>

  </header>



  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="page">


    <div class="page-heading">

      <span class="eyebrow">
        Kmeet
      </span>

      <h1 id="headingTitle">
        Your Profile
      </h1>

      <p id="headingSubtitle">
        Your profile helps people discover who you are.
      </p>

    </div>


    <!-- LOADING -->

    <section
      id="loadingState"
      class="state-card"
    >

      <div class="state-icon">
        ♥
      </div>

      <h2>
        Loading your profile
      </h2>

      <p>
        Please wait while Kmeet loads your profile.
      </p>

    </section>


    <!-- ERROR -->

    <section
      id="errorState"
      class="state-card"
      style="display:none;"
    >

      <div class="state-icon">
        ♡
      </div>

      <h2>
        Profile could not be loaded
      </h2>

      <p id="errorText">
        Something went wrong while loading this profile.
      </p>

      <a
        href="login.html"
        class="state-button"
        id="errorButton"
      >
        Go to Login
      </a>

    </section>


    <!-- PROFILE -->

    <section
      id="profileCard"
      class="profile-card"
      style="display:none;"
    >


      <!-- =================================================
           PHOTO
           ================================================= -->

      <div class="photo-section">


        <div class="photo-frame">

          <img
