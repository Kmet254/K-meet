<style>

* {

}

body {

}

.logo-heart {

.nav-links a {

.detail-label {

}

.tags {

.tag {

    background:

}

========================================= */

.gallery-header {
    display: flex;

    justify-content: space-between;

    gap: 15px;
}

.gallery-count {
    color: rgba(255,255,255,.42);

}

.gallery {
    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 12px;
}

.gallery-item {
    position: relative;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    border-radius: 16px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.08);

.gallery-item img {
    width: 100%;
    height: 100%;

    transition:

}

.gallery-item:hover img {
    transform: scale(1.05);
}

.gallery-current {
    position: absolute;

    left: 8px;
    bottom: 8px;

    padding: 5px 8px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.65);

    color: #ff9ac3;

    font-size: 9px;

.empty-gallery {

/* =========================================

========================================= */

.lightbox {

    display: none;

    justify-content: center;

}

<script type="module">

import {
    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    deleteUser,
    EmailAuthProvider,
    reauthenticateWithCredential
} from "./firebase-config.js";


const loading =
    document.getElementById("loading");

const profileCard =
    document.getElementById("profileCard");

const errorCard =
    document.getElementById("errorCard");

const mainPhoto =
    document.getElementById("mainPhoto");

const initial =
    document.getElementById("initial");

const profileName =
    document.getElementById("profileName");

const profileLocation =
    document.getElementById("profileLocation");

const locationDetail =
    document.getElementById("locationDetail");

const age =
    document.getElementById("age");

const gender =
    document.getElementById("gender");

const bio =
    document.getElementById("bio");

const interests =
    document.getElementById("interests");

const gallery =
    document.getElementById("gallery");

const galleryCount =
    document.getElementById("galleryCount");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const closeLightbox =
    document.getElementById("closeLightbox");

const editButton =
    document.getElementById("editButton");

const chatButton =
    document.getElementById("chatButton");

const statusText =
    document.getElementById("statusText");

const deleteAccountArea =
    document.getElementById(
        "deleteAccountArea"
    );

const deleteAccountButton =
    document.getElementById(
        "deleteAccountButton"
    );


/*
 * IMPORTANT:
 *
 * Discover sends:
 *
 * profile.html?id=FIREBASE_UID
 *
 * We must read that ID.
 */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const requestedProfileId =
    urlParams.get("id");


/*
 * 24 hours.
 */

const ROTATION_TIME =
    24 * 60 * 60 * 1000;


function getPhotoURL(data) {

    return (

        data.photoURL ||

        data.profilePhoto ||

        data.photo ||

        data.avatar ||

        data.profileImage ||

        data.image ||

        ""

    );

}


function getGallery(data, currentPhoto) {

    let photos =

        Array.isArray(data.photoGallery)

            ? [...data.photoGallery]

            : [];


    photos = photos.filter(

        photo =>

            typeof photo === "string" &&

            photo.trim() !== ""

    );


    photos = [
        ...new Set(photos)
    ];


    if (
        currentPhoto &&
        !photos.includes(currentPhoto)
    ) {

        photos.unshift(currentPhoto);

    }


    return photos;

}


function timestampValue(value) {

    if (!value) return 0;


    if (
        typeof value.toMillis === "function"
    ) {

        return value.toMillis();

    }


    if (value instanceof Date) {

        return value.getTime();

    }


    if (
        typeof value.seconds === "number"
    ) {

        return value.seconds * 1000;

    }


    const result =
        new Date(value).getTime();


    return Number.isNaN(result)
        ? 0
        : result;

}


/*
 * Only the OWNER's profile is allowed
 * to perform the automatic photo rotation.
 *
 * We never modify another member's profile
 * simply because somebody viewed it.
 */

async function rotatePhotoIfNeeded(
    uid,
    data,
    currentPhoto,
    photos
) {

    if (photos.length < 2) {

        return currentPhoto;

    }


    const lastRotation =
        timestampValue(
            data.photoRotationAt
        );


    if (!lastRotation) {

        await setDoc(

            doc(
                db,
                "users",
                uid
            ),

            {
                photoRotationAt:
                    new Date(),

                photoRotationIndex:
                    Math.max(
                        0,
                        photos.indexOf(
                            currentPhoto
                        )
                    )
            },

            {
                merge: true
            }

        );


        return currentPhoto;

    }


    if (
        Date.now() - lastRotation <
        ROTATION_TIME
    ) {

        return currentPhoto;

    }


    let currentIndex =
        photos.indexOf(
            currentPhoto
        );


    if (currentIndex < 0) {

        currentIndex = 0;

    }


    const nextIndex =
        (currentIndex + 1) %
        photos.length;


    const nextPhoto =
        photos[nextIndex];


    await setDoc(

        doc(
            db,
            "users",
            uid
        ),

        {
            photoURL:
                nextPhoto,

            photoRotationAt:
                new Date(),

            photoRotationIndex:
                nextIndex,

            photoGallery:
                photos
        },

        {
            merge: true
        }

    );


    return nextPhoto;

}


function showPhoto(url, name) {

    if (url) {

        mainPhoto.src =
            url;

        mainPhoto.style.display =
            "block";

        initial.style.display =
            "none";

    } else {

        mainPhoto.style.display =
            "none";

        initial.textContent =

            (
                name ||
                "K"
            )
            .trim()
            .charAt(0)
            .toUpperCase();

        initial.style.display =
            "block";

    }

}


function showInterests(list) {

    interests.innerHTML =
        "";


    if (
        !Array.isArray(list) ||
        !list.length
    ) {

        const tag =
            document.createElement("span");

        tag.className =
            "tag";

        tag.textContent =
            "Still discovering interests";

        interests.appendChild(tag);

        return;

    }


    list.forEach(item => {

        const tag =
            document.createElement("span");

        tag.className =
            "tag";

        tag.textContent =
            item;

        interests.appendChild(tag);

    });

}


function showGallery(
    photos,
    currentPhoto,
    isOwner
) {

    gallery.innerHTML =
        "";


    galleryCount.textContent =

        `${photos.length} photo` +

        (
            photos.length === 1
                ? ""
                : "s"
        );


    if (!photos.length) {

        gallery.innerHTML = `

            <div class="empty-gallery">

                ${
                    isOwner
                        ? "Your photo gallery is empty.<br>Add photos from Edit Profile."
                        : "No photos have been added yet."
                }

            </div>

        `;

        return;

    }


    photos.forEach(
        (photo, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "gallery-item";


            const image =
                document.createElement(
                    "img"
                );

            image.src =
                photo;

            image.alt =
                `Gallery photo ${index + 1}`;

            image.loading =
                "lazy";


            image.onerror = () => {

                item.style.display =
                    "none";

            };


            item.appendChild(
                image
            );


            /*
             * Only show "Current" to the
             * owner viewing their own profile.
             */

            if (
                isOwner &&
                photo === currentPhoto
            ) {

                const current =
                    document.createElement(
                        "div"
                    );

                current.className =
                    "gallery-current";

                current.textContent =
                    "Current";

                item.appendChild(
                    current
                );

            }


            item.addEventListener(
                "click",
                () => {

                    lightboxImage.src =
                        photo;

                    lightbox.classList.add(
                        "show"
                    );

                }
            );


            gallery.appendChild(
                item
            );

        }
    );

}


/* =========================================
   DELETE ACCOUNT
========================================= */

async function deleteMyAccount() {

    const user =
        auth.currentUser;


    if (!user) {

        alert(
            "You must be logged in to delete your account."
        );

        return;

    }


    if (user.isAnonymous) {

        alert(
            "Anonymous accounts cannot use this account deletion option."
        );

        return;

    }


    const firstConfirmation =
        confirm(
            "Are you sure you want to permanently delete your Kmeet account?\n\n" +
            "Your profile will be removed from Discover and your Kmeet login will be deleted.\n\n" +
            "This action cannot be undone."
        );


    if (!firstConfirmation) {

        return;

    }


    /*
     * Because Firebase considers account deletion
     * a security-sensitive operation, we request
     * the current password and re-authenticate
     * the user before continuing.
     */

    if (!user.email) {

        alert(
            "This account does not have an email/password login."
        );

        return;

    }


    const password =
        prompt(
            "For security, enter your current Kmeet password to continue:"
        );


    if (password === null) {

        return;

    }


    if (!password.trim()) {

        alert(
            "Please enter your current password."
        );

        return;

    }


    const originalText =
        deleteAccountButton.textContent;


    deleteAccountButton.disabled =
        true;

    deleteAccountButton.textContent =
        "Deleting account...";


    try {

        /*
         * Step 1:
         * Re-authenticate the current user.
         */

        const credential =
            EmailAuthProvider.credential(
                user.email,
                password
            );


        await reauthenticateWithCredential(
            user,
            credential
        );


        /*
         * Step 2:
         * Remove the user's Kmeet profile
         * from Firestore.
         *
         * Discover listens to this collection
         * with onSnapshot(), so the member will
         * disappear automatically.
         */

        await deleteDoc(
            doc(
                db,
                "users",
                user.uid
            )
        );


        /*
         * Step 3:
         * Delete the Firebase Authentication
         * account.
         */

        await deleteUser(user);


        /*
         * The account is now gone.
         */

        alert(
            "Your Kmeet account has been deleted successfully."
        );


        window.location.href =
            "index.html";


    } catch (error) {

        console.error(
            "Kmeet account deletion error:",
            error
        );


        deleteAccountButton.disabled =
            false;

        deleteAccountButton.textContent =
            originalText;


        if (
            error.code ===
            "auth/wrong-password"
        ) {

            alert(
                "The password you entered is incorrect. Your account was not deleted."
            );

            return;

        }


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            alert(
                "The password could not be verified. Your account was not deleted."
            );

            return;

        }


        if (
            error.code ===
            "auth/requires-recent-login"
        ) {

            alert(
                "Firebase requires a recent login before deleting this account. Please log out, log in again, and try once more."
            );

            return;

        }


        if (
            error.code ===
            "auth/too-many-requests"
        ) {

            alert(
                "There have been too many attempts. Please wait a little while and try again."
            );

            return;

        }


        if (
            error.code ===
            "permission-denied"
        ) {

            alert(
                "Kmeet could not remove your profile from the database. Your account was not deleted."
            );

            return;

        }


        alert(
            "We could not complete the account deletion. Please try again."
        );

    }

}


deleteAccountButton.addEventListener(

);


/*
 * Load a profile by Firebase UID.
 *
 * This is the main fix.
 *
 * If profile.html?id=OTHER_UID
 * then OTHER_UID is loaded.
 *
 * If there is no id parameter,
 * the logged-in user's own profile
 * is loaded.
 */

async function loadProfile(
    profileId,
    loggedInUser
) {

    try {

        const reference =
            doc(
                db,
                "users",
                profileId
            );


        const snapshot =
            await getDoc(
                reference
            );


        if (!snapshot.exists()) {

            throw new Error(
                "This Kmeet profile could not be found."
            );

        }


        const data =
            snapshot.data();


        /*
         * Determine whether this is
         * the logged-in user's profile.
         */

        const isOwner =
            !!loggedInUser &&
            !loggedInUser.isAnonymous &&
            profileId === loggedInUser.uid;


        let currentPhoto =
            getPhotoURL(data);


        let photos =
            getGallery(
                data,
                currentPhoto
            );


        /*
         * ONLY rotate photos when the
         * logged-in user is viewing
         * their own profile.
         */

        if (isOwner) {

            currentPhoto =
                await rotatePhotoIfNeeded(
                    profileId,
                    data,
                    currentPhoto,
                    photos
                );

        }


        if (
            currentPhoto &&
            !photos.includes(currentPhoto)
        ) {

            photos.unshift(
                currentPhoto
            );

        }


        const name =

            data.name ||

            data.username ||

            data.displayName ||

            "Kmeet Member";


        profileName.textContent =
            name;


        const location =

            data.location ||

            data.city ||

            "Kenya";


        profileLocation.textContent =
            "📍 " + location;


        locationDetail.textContent =
            location;


        age.textContent =

            data.age
                ? data.age
                : "Not provided";


        gender.textContent =

            data.gender ||
            "Not provided";


        bio.textContent =

            data.bio ||

            data.description ||

            data.about ||

            data.intro ||

            "Connecting hearts naturally.";


        showPhoto(
            currentPhoto,
            name
        );


        showInterests(
            data.interests
        );


        showGallery(
            photos,
            currentPhoto,
            isOwner
        );


        /*
         * OWNER:
         * Show Edit Profile and Delete Account.
         *
         * OTHER MEMBER:
         * Hide Edit Profile and Delete Account
         * and show Chat.
         */

        if (isOwner) {

            editButton.style.display =
                "inline-flex";

            chatButton.style.display =
                "none";

            deleteAccountArea.style.display =
                "block";

        } else {

            editButton.style.display =
                "none";

            chatButton.href =
                `chat.html?userId=${encodeURIComponent(profileId)}`;

            chatButton.style.display =
                "inline-flex";

            deleteAccountArea.style.display =
                "none";

        }


        /*
         * Online status.
         */

        const isOnline =
            data.online === true ||
            data.status === "online" ||
            data.isOnline === true;


        if (isOnline) {

            statusText.textContent =
                "Online";

        } else {

            statusText.textContent =
                "Offline";

        }


        loading.style.display =
            "none";


        profileCard.style.display =
            "block";


    } catch (error) {

        console.error(
            "Profile error:",
            error
        );


        loading.style.display =
            "none";


        profileCard.style.display =
            "none";


        errorCard.style.display =
            "block";


        errorCard.textContent =

            error.message ||

            "We could not load this profile.";

    }

}

/*
 * Authentication is still used to determine
 * whether the visitor owns the profile.
 *
 * BUT we do NOT require login to view a
 * specific public Firebase profile.
 */

onAuthStateChanged(
    auth,
    async user => {

        try {

            /*
             * If Discover supplied an ID,
             * use that person's ID.
             */

            if (requestedProfileId) {

                await loadProfile(
                    requestedProfileId,
                    user
                );

                return;

            }


            /*
             * No ?id= was supplied.
             *
             * In this case the page means
             * "my profile", so login is required.
             */

            if (!user || user.isAnonymous) {

                window.location.href =
                    "login.html";

                return;

            }


            await loadProfile(
                user.uid,
                user
            );

        } catch (error) {

            console.error(
                "Profile loading error:",
                error
            );

        }

    }
);
