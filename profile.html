<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kmeet - Profile</title>

  <!-- KMEET WEB LOGO / FAVICON -->
  <link
    rel="icon"
    type="image/jpeg"
    href="https://kmet254.github.io/K-meet/kmeet-logo.jfif.jfif"
  >

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      color: #fff;
      background:
        linear-gradient(
          rgba(13, 8, 15, .82),
          rgba(13, 8, 15, .92)
        ),
        url("https://kmet254.github.io/K-meet/img/bg34.jpg")
        center center / cover fixed no-repeat;
      background-color: #0d080f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    /* =====================================================
       NAVIGATION
       ===================================================== */

    .profile-nav {
      width: 100%;
      min-height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 6%;

      background: rgba(12, 8, 14, .78);
      border-bottom: 1px solid rgba(255,255,255,.10);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* =====================================================
       KMEET BRAND
       ===================================================== */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 700;

      letter-spacing: .2px;

      flex-shrink: 0;
    }

    .brand-logo-wrap {
      position: relative;

      width: 54px;
      height: 54px;

      min-width: 54px;
      min-height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 50%;

      background: #fff;

      border: 2px solid rgba(255,255,255,.96);

      box-shadow:
        0 0 0 2px rgba(255,91,161,.12),
        0 0 22px rgba(230,106,148,.48);

      flex-shrink: 0;
    }

    .brand-logo {
      display: block !important;

      width: 50px !important;
      height: 50px !important;

      min-width: 50px !important;
      min-height: 50px !important;

      max-width: 50px !important;
      max-height: 50px !important;

      object-fit: cover !important;
      object-position: center !important;

      border-radius: 50%;

      opacity: 1 !important;
      visibility: visible !important;

      flex-shrink: 0;
    }

    .brand-name {
      color: #fff;
    }

    /* =====================================================
       NAV LINKS
       ===================================================== */

    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-links a,
    .logout-btn {
      border: 1px solid rgba(255,255,255,.12);

      background: rgba(255,255,255,.055);

      padding: 10px 17px;

      border-radius: 30px;

      color: rgba(255,255,255,.88);

      font-size: 13px;
      font-weight: 500;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .nav-links a:hover,
    .logout-btn:hover {
      transform: translateY(-2px);

      background: rgba(255,255,255,.11);

      border-color: rgba(255,255,255,.24);
    }

    .nav-links .active {
      background: rgba(230,106,148,.18);
      border-color: rgba(255,133,174,.32);
      color: #fff;
    }

    .logout-btn {
      cursor: pointer;
    }

    /* =====================================================
       MAIN
       ===================================================== */

    .page {
      width: min(100% - 30px, 960px);

      margin: 0 auto;

      padding:
        48px 0
        70px;
    }

    /* =====================================================
       LOADING
       ===================================================== */

    #loading {
      min-height: 400px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      color: rgba(255,255,255,.70);
      font-size: 15px;
    }

    .loader-box {
      padding: 35px;
    }

    .spinner {
      width: 42px;
      height: 42px;

      margin: 0 auto 18px;

      border-radius: 50%;

      border:
        3px solid rgba(255,255,255,.13);

      border-top-color: #e66a94;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       ERROR
       ===================================================== */

    #errorArea {
      display: none;

      max-width: 650px;

      margin: 60px auto;

      padding: 30px;

      text-align: center;

      border-radius: 24px;

      background: rgba(255,255,255,.055);

      border:
        1px solid rgba(255,255,255,.10);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #errorArea h2 {
      font-family: "Playfair Display", serif;
      font-size: 27px;
      margin-bottom: 10px;
    }

    #errorArea p {
      color: rgba(255,255,255,.65);
      line-height: 1.7;
      font-size: 14px;
    }

    /* =====================================================
       PROFILE CARD
       ===================================================== */

    #profileContent {
      display: none;
    }

    .profile-card {
      position: relative;

      overflow: hidden;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.035)
        );

      border:
        1px solid rgba(255,255,255,.13);

      box-shadow:
        0 30px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.06);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    /* =====================================================
       PROFILE HEADER
       ===================================================== */

    .profile-top {
      padding: 42px 35px 30px;

      text-align: center;

      border-bottom:
        1px solid rgba(255,255,255,.08);
    }

    .photo-frame {
      width: 165px;
      height: 165px;

      margin: 0 auto 22px;

      padding: 5px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(255,118,170,.95),
          rgba(190,91,145,.70)
        );

      box-shadow:
        0 15px 45px rgba(0,0,0,.38),
        0 0 35px rgba(230,106,148,.18);
    }

    .profile-photo {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      border-radius: 50%;

      background: #211620;

      border:
        3px solid rgba(255,255,255,.92);
    }

    .default-avatar {
      width: 100%;
      height: 100%;

      display: none;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #33202c,
          #191219
        );

      border:
        3px solid rgba(255,255,255,.92);

      font-size: 55px;

      color: rgba(255,255,255,.62);
    }

    .profile-name {
      font-family: "Playfair Display", serif;

      font-size: clamp(30px, 5vw, 42px);

      font-weight: 600;

      margin-bottom: 7px;
    }

    .profile-location {
      color: rgba(255,255,255,.60);

      font-size: 14px;
    }

    .profile-location i {
      margin-right: 5px;
      color: #f08bad;
    }

    /* =====================================================
       ONLINE STATUS
       ===================================================== */

    .online-status {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-top: 13px;

      padding: 6px 13px;

      border-radius: 30px;

      background: rgba(255,255,255,.055);

      border:
        1px solid rgba(255,255,255,.08);

      font-size: 12px;

      color: rgba(255,255,255,.70);
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #777;

      box-shadow: 0 0 8px rgba(255,255,255,.08);
    }

    .status-dot.online {
      background: #58e08a;

      box-shadow:
        0 0 10px rgba(88,224,138,.75);
    }

    /* =====================================================
       PROFILE BODY
       ===================================================== */

    .profile-body {
      padding: 34px 35px 38px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 12px;

      color: rgba(255,255,255,.90);

      font-size: 13px;

      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 1.2px;
    }

    .section-title i {
      color: #eb719a;
    }

    .bio {
      color: rgba(255,255,255,.69);

      font-size: 15px;

      line-height: 1.8;
    }

    /* =====================================================
       INFO
       ===================================================== */

    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;
    }

    .info-item {
      padding: 15px 16px;

      border-radius: 17px;

      background: rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.075);
    }

    .info-label {
      display: block;

      color: rgba(255,255,255,.42);

      font-size: 11px;

      margin-bottom: 4px;

      text-transform: uppercase;

      letter-spacing: .7px;
    }

    .info-value {
      color: rgba(255,255,255,.88);

      font-size: 14px;
    }

    /* =====================================================
       INTERESTS
       ===================================================== */

    .interests {
      display: flex;

      flex-wrap: wrap;

      gap: 9px;
    }

    .interest {
      padding: 8px 14px;

      border-radius: 30px;

      color: rgba(255,255,255,.82);

      background:
        rgba(230,106,148,.12);

      border:
        1px solid rgba(230,106,148,.24);

      font-size: 12px;
    }

    /* =====================================================
       ACTIONS
       ===================================================== */

    .profile-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 8px;
    }

    .action-btn {
      flex: 1 1 180px;

      min-height: 50px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      padding: 13px 20px;

      border-radius: 16px;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    .edit-btn {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #e66a94,
          #bd527e
        );

      border:
        1px solid rgba(255,255,255,.12);

      box-shadow:
        0 12px 30px rgba(190,82,126,.25);
    }

    .edit-btn:hover {
      box-shadow:
        0 15px 35px rgba(190,82,126,.36);
    }

    .discover-btn {
      color: rgba(255,255,255,.88);

      background:
        rgba(255,255,255,.065);

      border:
        1px solid rgba(255,255,255,.13);
    }

    .discover-btn:hover {
      background:
        rgba(255,255,255,.11);
    }

    .chat-btn {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #e66a94,
          #b84f7a
        );

      border:
        1px solid rgba(255,255,255,.12);

      box-shadow:
        0 12px 30px rgba(190,82,126,.25);
    }

    /* =====================================================
       SMALL MESSAGE
       ===================================================== */

    .profile-message {
      display: none;

      margin-top: 18px;

      padding: 13px 16px;

      border-radius: 14px;

      text-align: center;

      font-size: 13px;

      color: rgba(255,255,255,.68);

      background: rgba(255,255,255,.045);

      border:
        1px solid rgba(255,255,255,.07);
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    .footer {
      text-align: center;

      padding-top: 25px;

      color: rgba(255,255,255,.35);

      font-size: 11px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .profile-nav {
        min-height: 70px;
        padding: 10px 15px;
      }

      .brand {
        font-size: 24px;
        gap: 9px;
      }

      .brand-logo-wrap {
        width: 47px;
        height: 47px;

        min-width: 47px;
        min-height: 47px;
      }

      .brand-logo {
        width: 43px !important;
        height: 43px !important;

        min-width: 43px !important;
        min-height: 43px !important;

        max-width: 43px !important;
        max-height: 43px !important;
      }

      .nav-links {
        gap: 5px;
      }

      .nav-links a,
      .logout-btn {
        padding: 8px 10px;
        font-size: 11px;
      }

      .nav-links a.home-link {
        display: none;
      }

      .page {
        width: min(100% - 18px, 960px);

        padding-top: 25px;
      }

      .profile-card {
        border-radius: 23px;
      }

      .profile-top {
        padding:
          30px 20px
          25px;
      }

      .profile-body {
        padding:
          25px 20px
          30px;
      }

      .photo-frame {
        width: 140px;
        height: 140px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .action-btn {
        flex-basis: 100%;
      }
    }

    @media (max-width: 430px) {

      .brand-name {
        display: none;
      }

      .nav-links a {
        padding: 8px 9px;
      }

      .profile-name {
        font-size: 31px;
      }
    }

  </style>

</head>


<body>


  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <nav class="profile-nav">

    <a
      href="index.html"
      class="brand"
      aria-label="Kmeet Home"
    >

      <span class="brand-logo-wrap">

  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main class="page">


    <!-- LOADING -->

    <div id="loading">

      <div class="loader-box">

        <div class="spinner"></div>

        <div>
          Loading your Kmeet profile...
        </div>

      </div>

    </div>



    <!-- ERROR -->

    <section id="errorArea">

      <h2>
        Profile unavailable
      </h2>

      <p id="errorText">
        We could not load this profile.
      </p>

    </section>



    <!-- PROFILE -->

    <section
      id="profileContent"
      class="profile-card"
    >


      <!-- =================================================

      <div class="profile-top">


        <div class="photo-frame">

          <img
            id="profilePhoto"
            class="profile-photo"
            src=""

          <div
            id="defaultAvatar"

            <i class="fa-solid fa-user"></i>
          </div>

        <h1
          id="profileName"

        </h1>


        <div

      <!-- =================================================

      <div class="profile-body">


        <!-- BIO -->

        <div class="section">

          <div class="section-title">

          <p

          </p>

        </div>



        <!-- INFORMATION -->

        <div class="section">

          <div class="section-title">

            <i class="fa-solid fa-circle-info"></i>

          </div>


          <div class="info-grid">


            <div class="info-item">

              <span class="info-label">
                Age
              </span>

              <span
                id="profileAge"
                class="info-value"

              </span>

            </div>


            <div class="info-item">

              <span class="info-label">

              </span>

              <span

              </span>

            </div>


            <div class="info-item">

              <span class="info-label">

              </span>

              <span

                class="info-value"

              </span>

        <!-- INTERESTS -->

        <div class="section">

          <div class="section-title">

            <i class="fa-solid fa-star"></i>

          <div

        <!-- =================================================

             OTHER PROFILE:

        <div
          id="profileActions"

        >


          <!-- EDIT PROFILE -->

          <a
            id="editProfileBtn"

            class="action-btn edit-btn"
          >

            <i class="fa-solid fa-pen"></i>

          </a>


          <!-- CHAT -->

          <a
            id="chatBtn"

            class="action-btn chat-btn"
            style="display:none;"
          >

            <i class="fa-solid fa-comments"></i>

          </a>


          <!-- DISCOVER -->

          <a
            href="discover.html"
            class="action-btn discover-btn"
          >

            <i class="fa-solid fa-compass"></i>

            Discover

          </a>


        </div>


        <div
          id="profileMessage"
          class="profile-message"
        ></div>


      </div>

    </section>


    <div class="footer">
      Kmeet · Connecting hearts naturally
    </div>


  </main>



  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script type="module">

    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      doc,
      getDoc
    } from "./firebase-config.js";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const loading =
      document.getElementById("loading");

    const profileContent =
      document.getElementById("profileContent");

    const errorArea =
      document.getElementById("errorArea");

    const errorText =
      document.getElementById("errorText");

    const profilePhoto =
      document.getElementById("profilePhoto");

    const defaultAvatar =
      document.getElementById("defaultAvatar");

    const profileName =
      document.getElementById("profileName");

    const profileLocation =
      document.getElementById("profileLocation");

    const profileLocationInfo =
      document.getElementById("profileLocationInfo");

    const profileBio =
      document.getElementById("profileBio");

    const profileAge =
      document.getElementById("profileAge");

    const profileGender =
      document.getElementById("profileGender");

    const interests =
      document.getElementById("interests");

    const editProfileBtn =
      document.getElementById("editProfileBtn");

    const chatBtn =
      document.getElementById("chatBtn");

    const statusDot =
      document.getElementById("statusDot");

    const statusText =
      document.getElementById("statusText");

    const logoutBtn =
      document.getElementById("logoutBtn");


    /* =====================================================
       REQUESTED PROFILE

       profile.html
       = own profile

       profile.html?id=UID
       = another member's profile
       ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedUserId =
      params.get("id");


    let currentUser = null;
    let viewingOwnProfile = false;


    /* =====================================================
       SHOW ERROR
       ===================================================== */

    function showError(message) {

      loading.style.display = "none";

      profileContent.style.display = "none";

      errorArea.style.display = "block";

      errorText.textContent = message;

    }


    /* =====================================================
       SHOW PROFILE
       ===================================================== */

    function showProfile() {

      loading.style.display = "none";

      errorArea.style.display = "none";

      profileContent.style.display = "block";

    }


    /* =====================================================
       PROFILE PHOTO
       ===================================================== */

    function setProfilePhoto(url) {

      const cleanUrl =
        typeof url === "string"
          ? url.trim()
          : "";

      if (!cleanUrl) {

        profilePhoto.style.display = "none";

        defaultAvatar.style.display = "flex";

        return;
      }


      profilePhoto.onload = () => {

        profilePhoto.style.display = "block";

        defaultAvatar.style.display = "none";

      };


      profilePhoto.onerror = () => {

        profilePhoto.style.display = "none";

        defaultAvatar.style.display = "flex";

      };


      profilePhoto.src = cleanUrl;

    }


    /* =====================================================
       GET PHOTO FROM FIRESTORE
       ===================================================== */

    function getPhotoUrl(data) {

      return (
        data.photoURL ||
        data.profilePhoto ||
        data.photo ||
        data.avatar ||
        ""
      );

    }


    /* =====================================================
       DISPLAY PROFILE
       ===================================================== */

    function displayProfile(data) {

      const name =
        data.name ||
        data.displayName ||
        "Kmeet Member";


      const location =
        data.location ||
        "Kenya";


      const bio =
        data.bio ||
        "Connecting hearts naturally.";


      const age =
        data.age !== null &&
        data.age !== undefined &&
        data.age !== ""
          ? String(data.age)
          : "—";


      const gender =
        data.gender ||
        "—";


      profileName.textContent =
        name;


      profileLocation.innerHTML =
        `
          <i class="fa-solid fa-location-dot"></i>
          ${escapeHtml(location)}
        `;


      profileLocationInfo.textContent =
        location;


      profileBio.textContent =
        bio;


      profileAge.textContent =
        age;


      profileGender.textContent =
        gender;


      setProfilePhoto(
        getPhotoUrl(data)
      );


      /* ================================================
         INTERESTS
         ================================================ */

      interests.innerHTML = "";


      let userInterests =
        data.interests;


      if (!Array.isArray(userInterests)) {

        if (
          typeof userInterests === "string" &&
          userInterests.trim()
        ) {

          userInterests =
            userInterests
              .split(",")
              .map(item => item.trim())
              .filter(Boolean);

        } else {

          userInterests = [];

        }

      }


      if (userInterests.length === 0) {

        const empty =
          document.createElement("span");

        empty.className =
          "interest";

        empty.textContent =
          "Getting to know Kmeet";

        interests.appendChild(empty);

      } else {

        userInterests
          .slice(0, 20)
          .forEach(item => {

            const tag =
              document.createElement("span");

            tag.className =
              "interest";

            tag.textContent =
              item;

            interests.appendChild(tag);

          });

      }

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =====================================================
       LOAD PROFILE
       ===================================================== */

    async function loadProfile(
      userId,
      isOwnProfile
    ) {

      try {

        viewingOwnProfile =
          isOwnProfile;


        console.log(
          "KMEET: Loading profile:",
          userId
        );


        const profileRef =
          doc(
            db,
            "users",
            userId
          );


        const profileSnap =
          await getDoc(profileRef);


        if (!profileSnap.exists()) {

          showError(
            "This Kmeet profile could not be found."
          );

          return;

        }


        const profileData =
          profileSnap.data();


        console.log(
          "KMEET: Profile loaded:",
          profileData
        );


        displayProfile(
          profileData
        );


        /* ==============================================
           OWN PROFILE
           ============================================== */

        if (isOwnProfile) {

          editProfileBtn.style.display =
            "inline-flex";

          chatBtn.style.display =
            "none";

          setOfflineStatus();

        }


        /* ==============================================
           OTHER MEMBER
           ============================================== */

        else {

          editProfileBtn.style.display =
            "none";


          chatBtn.style.display =
            "inline-flex";


          chatBtn.href =
            "chat.html?userId=" +
            encodeURIComponent(userId);


          startPresenceListener(
            userId
          );

        }


        showProfile();

      } catch (error) {

        console.error(
          "KMEET profile loading error:",
          error
        );


        showError(
          "We could not load this profile. Please refresh the page and try again."
        );

      }

    }


    /* =====================================================
       OFFLINE DEFAULT
       ===================================================== */

    function setOfflineStatus() {

      statusDot.classList.remove(
        "online"
      );

      statusText.textContent =
        "Offline";

    }


    /* =====================================================
       REALTIME PRESENCE

       Loaded separately so a presence problem
       cannot prevent the profile from displaying.
       ===================================================== */

    async function startPresenceListener(
      userId
    ) {

      try {

        const {
          getDatabase,
          ref,
          onValue
        } =
          await import(
            "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"
          );


        const database =
          getDatabase();


        const presenceRef =
          ref(
            database,
            "status/" + userId
          );


        onValue(
          presenceRef,
          snapshot => {

            const value =
              snapshot.val();


            if (
              value &&
              value.state === "online"
            ) {

              statusDot.classList.add(
                "online"
              );

              statusText.textContent =
                "Online";

            } else {

              statusDot.classList.remove(
                "online"
              );

              statusText.textContent =
                "Offline";

            }

          },
          error => {

            console.warn(
              "KMEET presence error:",
              error
            );

            setOfflineStatus();

          }
        );

      } catch (error) {

        console.warn(
          "KMEET presence unavailable:",
          error
        );

        setOfflineStatus();

      }

    }


    /* =====================================================
       LOGOUT
       ===================================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          window.location.replace(
            "login.html"
          );

        } catch (error) {

          console.error(
            "KMEET logout error:",
            error
          );

          alert(
            "Could not log out. Please try again."
          );

        }

      }
    );


    /* =====================================================
       AUTHENTICATION
       ===================================================== */

    onAuthStateChanged(
      auth,
      async user => {

        try {

          currentUser =
            user;


          /* ==============================================
             NO ?id=
             ============================================== */

          if (!requestedUserId) {

            if (
              !user ||
              user.isAnonymous
            ) {

              window.location.replace(
                "login.html"
              );

              return;

            }


            await loadProfile(
              user.uid,
              true
            );

            return;

          }


          /* ==============================================
             ?id=UID

             A logged-in user can view another profile.
             ============================================== */

          const isOwnProfile =
            !!(
              user &&
              !user.isAnonymous &&
              user.uid === requestedUserId
            );


          await loadProfile(
            requestedUserId,
            isOwnProfile
          );

        } catch (error) {

          console.error(
            "KMEET authentication/profile error:",
            error
          );


          showError(
            "Something went wrong while opening this profile."
          );

        }

      }
    );


    /* =====================================================
       LOGO CHECK
       ===================================================== */

    const brandLogo =
      document.getElementById(
        "brandLogo"
      );


    brandLogo.addEventListener(
      "load",
      () => {

        console.log(
          "KMEET: Web logo loaded successfully."
        );

      }
    );


    brandLogo.addEventListener(
      "error",
      () => {

        console.error(
          "KMEET: Web logo failed to load."
        );

      }
    );

  </script>

</body>
</html>
