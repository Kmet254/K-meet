<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kmeet - Profile</title>

  <meta
    name="description"
    content="View a Kmeet profile."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at top left,
          rgba(139, 40, 83, 0.35),
          transparent 38%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(92, 31, 70, 0.30),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #100b13,
          #1b0d18 48%,
          #100b12
        );

      overflow-x: hidden;
    }


    /* =========================================
       NAVIGATION
       ========================================= */

    .top-nav {
      width: 100%;

      min-height: 72px;

      padding:
        0 28px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(12, 8, 14, 0.78);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      position: sticky;

      top: 0;

      z-index: 50;
    }


    .brand {
      display: inline-flex;

      align-items: center;

      gap: 9px;

      text-decoration: none;

      color: #fff;
    }


    .brand-heart {
      font-size: 24px;

      color: #ff4f91;

      text-shadow:
        0 0 18px rgba(255,79,145,0.55);
    }


    .brand-name {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 27px;

      font-weight: 700;

      letter-spacing: -0.5px;
    }


    .nav-links {
      display: flex;

      align-items: center;

      gap: 24px;
    }


    .nav-links a {
      color: rgba(255,255,255,0.75);

      text-decoration: none;

      font-size: 14px;

      font-weight: 600;

      transition:
        color .2s ease,
        transform .2s ease;
    }


    .nav-links a:hover {
      color: #fff;

      transform:
        translateY(-1px);
    }


    /* =========================================
       PAGE
       ========================================= */

    .page {
      width:
        min(
          calc(100% - 28px),
          850px
        );

      margin:
        0 auto;

      padding:
        55px 0 80px;
    }


    .status-message {
      display: none;

      padding:
        14px 18px;

      margin-bottom: 18px;

      border-radius: 15px;

      background:
        rgba(255,255,255,0.06);

      border:
        1px solid rgba(255,255,255,0.10);

      color:
        rgba(255,255,255,0.85);

      font-size: 14px;

      text-align: center;
    }


    .status-message.show {
      display: block;
    }


    .status-message.error {
      border-color:
        rgba(255,80,120,0.35);

      background:
        rgba(120,20,55,0.20);
    }


    /* =========================================
       PROFILE CARD
       ========================================= */

    .profile-card {
      position: relative;

      overflow: hidden;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.045)
        );

      border:
        1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 30px 80px rgba(0,0,0,0.38);

      backdrop-filter:
        blur(22px);

      -webkit-backdrop-filter:
        blur(22px);
    }


    .profile-top {
      padding:
        42px 34px 28px;

      display: flex;

      gap: 30px;

      align-items: center;
    }


    /* =========================================
       PHOTO
       ========================================= */

    .photo-area {
      flex:
        0 0 190px;

      width: 190px;

      height: 190px;

      position: relative;
    }


    .photo-ring {
      width: 100%;

      height: 100%;

      padding: 4px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #ff5798,
          #9c3e79,
          #5c2758
        );

      box-shadow:
        0 15px 45px
        rgba(255,70,140,0.20);
    }


    .profile-photo {
      width: 100%;

      height: 100%;

      display: block;

      border-radius: 50%;

      object-fit: cover;

      background:
        #281722;
    }


    .photo-fallback {
      width: 100%;

      height: 100%;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #4a213b,
          #21131e
        );

      color:
        rgba(255,255,255,0.85);

      font-family:
        Georgia,
        serif;

      font-size: 62px;
    }


    /* =========================================
       ONLINE INDICATOR
       ========================================= */

    .online-indicator {
      position: absolute;

      right: 7px;

      bottom: 12px;

      width: 25px;

      height: 25px;

      border-radius: 50%;

      border:
        4px solid #1b0d18;

      background:
        #666;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.35);

      transition:
        background .25s ease,
        box-shadow .25s ease;
    }


    .online-indicator.online {
      background:
        #35e58a;

      box-shadow:
        0 0 0 4px rgba(53,229,138,0.10),
        0 0 18px rgba(53,229,138,0.65);
    }


    .online-indicator.offline {
      background:
        #777;
    }


    /* =========================================
       PROFILE SUMMARY
       ========================================= */

    .profile-summary {
      flex: 1;

      min-width: 0;
    }


    .profile-label {
      display: inline-block;

      margin-bottom: 9px;

      color:
        #ff72a7;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }


    .profile-name {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(30px, 5vw, 45px);

      line-height: 1.05;

      color: #fff;
    }


    .profile-location {
      margin:
        13px 0 0;

      color:
        rgba(255,255,255,0.68);

      font-size: 15px;
    }


    .presence-line {
      margin-top: 13px;

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        7px 12px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.08);

      font-size: 13px;

      color:
        rgba(255,255,255,0.72);
    }


    .presence-dot {
      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: #777;

      flex: 0 0 auto;
    }


    .presence-dot.online {
      background:
        #35e58a;

      box-shadow:
        0 0 10px rgba(53,229,138,0.75);
    }


    .presence-text.online {
      color:
        #73efa9;
    }


    /* =========================================
       PROFILE BODY
       ========================================= */

    .profile-body {
      padding:
        0 34px 34px;
    }


    .divider {
      height: 1px;

      background:
        rgba(255,255,255,0.08);

      margin:
        0 0 28px;
    }


    .section {
      margin-bottom: 28px;
    }


    .section-title {
      margin:
        0 0 11px;

      color:
        rgba(255,255,255,0.92);

      font-size: 14px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 1px;
    }


    .bio {
      margin: 0;

      color:
        rgba(255,255,255,0.72);

      line-height: 1.7;

      font-size: 15px;
    }


    .interests {
      display: flex;

      flex-wrap: wrap;

      gap: 9px;
    }


    .interest {
      display: inline-flex;

      align-items: center;

      padding:
        8px 13px;

      border-radius: 999px;

      background:
        rgba(255,75,143,0.10);

      border:
        1px solid rgba(255,93,154,0.20);

      color:
        rgba(255,255,255,0.82);

      font-size: 13px;
    }


    .empty-text {
      color:
        rgba(255,255,255,0.42);

      font-size: 14px;
    }


    /* =========================================
       ACTIONS
       ========================================= */

    .profile-owner-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 28px;
    }


    .button {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 46px;

      padding:
        0 21px;

      border-radius: 999px;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;

      transition:
        transform .2s ease,
        opacity .2s ease,
        background .2s ease;
    }


    .button:hover {
      transform:
        translateY(-2px);

      opacity: .95;
    }


    .primary-button {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #ff4d91,
          #b73e83
        );

      box-shadow:
        0 10px 25px
        rgba(255,67,139,0.20);
    }


    .secondary-button {
      color:
        rgba(255,255,255,0.85);

      background:
        rgba(255,255,255,0.06);

      border:
        1px solid rgba(255,255,255,0.11);
    }


    .logout-button {
      cursor: pointer;

      color:
        rgba(255,255,255,0.75);

      background:
        rgba(255,255,255,0.045);

      border:
        1px solid rgba(255,255,255,0.09);
    }


    .chat-button {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #d94887,
          #81346e
        );
    }


    /* =========================================
       LOADING
       ========================================= */

    .loading {
      min-height: 380px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 16px;

      color:
        rgba(255,255,255,0.65);
    }


    .spinner {
      width: 40px;

      height: 40px;

      border-radius: 50%;

      border:
        3px solid rgba(255,255,255,0.10);

      border-top-color:
        #ff5798;

      animation:
        spin .8s linear infinite;
    }


    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }


    /* =========================================
       ERROR
       ========================================= */

    .error-card {
      padding:
        45px 30px;

      text-align: center;

      color:
        rgba(255,255,255,0.75);
    }


    .error-card h2 {
      margin:
        0 0 12px;

      color: #fff;

      font-family:
        Georgia,
        serif;
    }


    .error-card p {
      margin:
        0 auto 24px;

      max-width: 560px;

      line-height: 1.6;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 680px) {

      .top-nav {
        padding:
          0 17px;
      }


      .nav-links {
        gap: 13px;
      }


      .nav-links a {
        font-size: 12px;
      }


      .page {
        width:
          calc(100% - 20px);

        padding:
          30px 0 55px;
      }


      .profile-top {
        padding:
          30px 22px 25px;

        flex-direction: column;

        text-align: center;
      }


      .photo-area {
        flex-basis: 160px;

        width: 160px;

        height: 160px;
      }


      .profile-location {
        justify-content: center;
      }


      .presence-line {
        margin-left: auto;
        margin-right: auto;
      }


      .profile-body {
        padding:
          0 22px 26px;
      }


      .profile-owner-actions {
        flex-direction: column;
      }


      .profile-owner-actions .button {
        width: 100%;
      }

    }


    @media (max-width: 430px) {

      .brand-name {
        font-size: 23px;
      }


      .brand-heart {
        font-size: 21px;
      }


      .nav-links {
        gap: 10px;
      }


      .nav-links a:nth-child(3) {
        display: none;
      }

    }

  </style>

</head>

  <!-- =========================================

  <main class="page">


    <div
      id="statusMessage"

    ></div>


    <div
      id="profileContainer"
      class="profile-card"

      <div class="loading">

  <!-- =========================================
       FIREBASE
       ========================================= -->

  <script type="module">

    import {
      auth,
      db,
      database,

      databaseRef,
      databaseSet,
      databaseOnValue,

      onDisconnect,
      databaseServerTimestamp,

      onAuthStateChanged,
      signOut,

      doc,
      getDoc

    } from "./firebase-config.js";


    console.log(
      "KMEET PROFILE + PRESENCE STARTED"
    );


    const profileContainer =
      document.getElementById(
        "profileContainer"
      );

    const statusMessage =
      document.getElementById(
        "statusMessage"
      );


    /*
      The URL can be:

      profile.html

      OR

      profile.html?id=USER_ID
    */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedUserId =
      params.get("id");


    let currentPresenceConnectionId =
      null;

    let presenceDisconnectHandler =
      null;


    /* =========================================
       HELPERS
       ========================================= */

    function escapeHtml(value) {

      return String(
        value ?? ""
      ).replace(
        /[&<>"']/g,
        function(character) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

          }[character];

        }
      );

    }


    function showStatus(
      message,
      isError = false
    ) {

      statusMessage.textContent =
        message;

      statusMessage.classList.add(
        "show"
      );

      statusMessage.classList.toggle(
        "error",
        isError
      );

    }


    function hideStatus() {

      statusMessage.classList.remove(
        "show"
      );

    }


    function getInitial(
      name
    ) {

      const clean =
        String(name || "K")
          .trim();

      return (
        clean.charAt(0)
          .toUpperCase()
      );

    }


    function getPhoto(
      data
    ) {

      return (
        data.photoURL ||
        data.profilePhoto ||
        data.avatar ||
        data.photo ||
        ""
      );

    }


    /* =========================================
       PRESENCE
       ========================================= */

    function watchPresence(
      userId,
      isOwnProfile
    ) {

      if (!userId) {
        return;
      }


      console.log(
        "KMEET: Watching presence for:",
        userId
      );


      const presenceRoot =
        databaseRef(
          database,
          "presence/" + userId
        );


      /*
        This is the important part.

        A user is considered online when
        Firebase Realtime Database contains
        at least one active connection.
      */

      databaseOnValue(
        presenceRoot,

        function(snapshot) {

          const value =
            snapshot.val();


          let online = false;


          if (
            value &&
            value.connections
          ) {

            online =
              Object.keys(
                value.connections
              ).length > 0;

          }


          updatePresenceDisplay(
            online
          );

        },

        function(error) {

          console.error(
            "KMEET presence read error:",
            error
          );

          /*
            Do not prevent the profile
            from loading if presence cannot
            be read.
          */

          updatePresenceDisplay(
            false
          );

        }
      );


      /*
        Only the currently logged-in
        non-anonymous user creates
        their own presence connection.
      */

      if (
        !isOwnProfile
      ) {
        return;
      }


      if (
        !auth.currentUser ||
        auth.currentUser.isAnonymous
      ) {
        return;
      }


      startOwnPresence(
        userId
      );

    }


    function updatePresenceDisplay(
      online
    ) {

      const indicator =
        document.getElementById(
          "onlineIndicator"
        );

      const dot =
        document.getElementById(
          "presenceDot"
        );

      const text =
        document.getElementById(
          "presenceText"
        );


      if (!indicator) {
        return;
      }


      indicator.classList.toggle(
        "online",
        online
      );

      indicator.classList.toggle(
        "offline",
        !online
      );


      if (dot) {

        dot.classList.toggle(
          "online",
          online
        );

      }


      if (text) {

        text.textContent =
          online
            ? "Online now"
            : "Offline";

        text.classList.toggle(
          "online",
          online
        );

      }

    }


    function startOwnPresence(
      userId
    ) {

      /*
        Prevent creating the same
        connection more than once.
      */

      if (
        currentPresenceConnectionId
      ) {

        return;

      }


      const connectionId =
        crypto.randomUUID();


      currentPresenceConnectionId =
        connectionId;


      const connectedRef =
        databaseRef(
          database,
          ".info/connected"
        );


      const connectionRef =
        databaseRef(
          database,
          "presence/" +
          userId +
          "/connections/" +
          connectionId
        );


      databaseOnValue(
        connectedRef,

        async function(snapshot) {

          if (
            snapshot.val() !== true
          ) {

            return;

          }


          console.log(
            "KMEET: Realtime Database connected."
          );


          /*
            When this browser disconnects,
            Firebase removes this connection
            automatically.
          */

          try {

            presenceDisconnectHandler =
              onDisconnect(
                connectionRef
              );


            await presenceDisconnectHandler.remove();


            /*
              Mark this connection online.
            */

            await databaseSet(
              connectionRef,
              {
                online: true,
                lastChanged:
                  databaseServerTimestamp()
              }
            );


            console.log(
              "KMEET: User marked ONLINE."
            );

          }

          catch (error) {

            console.error(
              "KMEET presence setup error:",
              error
            );

          }

        }

      );

    }


    /* =========================================
       CLEAN UP OWN PRESENCE
       ========================================= */

    window.addEventListener(
      "beforeunload",
      function() {

        /*
          Firebase onDisconnect() is the
          primary mechanism.

          This is only an additional attempt
          to remove the connection immediately
          when possible.
        */

        if (
          currentPresenceConnectionId &&
          auth.currentUser &&
          !auth.currentUser.isAnonymous
        ) {

          const connectionRef =
            databaseRef(
              database,
              "presence/" +
              auth.currentUser.uid +
              "/connections/" +
              currentPresenceConnectionId
            );


          databaseSet(
            connectionRef,
            null
          ).catch(
            function() {}
          );

        }

      }
    );


    /* =========================================
       DISPLAY PROFILE
       ========================================= */

    function displayProfile(
      data,
      profileUserId,
      isOwnProfile
    ) {

      const name =
        data.name ||
        data.username ||
        "Kmeet Member";


      const age =
        data.age
          ? ", " + data.age
          : "";


      const location =
        data.location ||
        "Kenya";


      const bio =
        data.bio ||
        "Connecting hearts naturally.";


      const photo =
        getPhoto(data);


      const interests =
        Array.isArray(
          data.interests
        )
          ? data.interests
          : [];


      const safePhoto =
        escapeHtml(photo);


      const photoMarkup =
        safePhoto

          ? `
            <img
              id="profilePhoto"
              class="profile-photo"
              src="${safePhoto}"
              alt="${escapeHtml(name)}"
            >
          `

          : `
            <div
              id="profilePhotoFallback"
              class="photo-fallback"
            >
              ${escapeHtml(
                getInitial(name)
              )}
            </div>
          `;


      const interestsMarkup =
        interests.length

          ? interests
              .slice(0, 12)
              .map(
                function(item) {

                  return `
                    <span class="interest">
                      ${escapeHtml(item)}
                    </span>
                  `;

                }
              )
              .join("")

          : `
              <span class="empty-text">
                No interests added yet.
              </span>
            `;


      let actionsMarkup = "";


      if (isOwnProfile) {

        actionsMarkup = `

          <div class="profile-owner-actions">

            <a
              class="button primary-button"
              href="edit-profile.html"
            >
              ✎ Edit My Profile
            </a>

            <a
              class="button secondary-button"
              href="discover.html"
            >
              ♥ Discover People
            </a>

            <button
              id="logoutButton"
              class="button logout-button"
              type="button"
            >
              Log Out
            </button>

          </div>

        `;

      }

      else {

        actionsMarkup = `

          <div class="profile-owner-actions">

            <a
              class="button chat-button"
              href="chat.html?userId=${encodeURIComponent(profileUserId)}"
            >
              💬 Chat
            </a>

            <a
              class="button secondary-button"
              href="discover.html"
            >
              ← Discover
            </a>

          </div>

        `;

      }


      profileContainer.innerHTML = `

        <div class="profile-top">

          <div class="photo-area">

            <div class="photo-ring">

              ${photoMarkup}

            </div>

            <div
              id="onlineIndicator"
              class="online-indicator offline"
              title="Offline"
            ></div>

          </div>


          <div class="profile-summary">

            <span class="profile-label">
              ${isOwnProfile
                ? "Your Kmeet Profile"
                : "Kmeet Profile"}
            </span>


            <h1 class="profile-name">
              ${escapeHtml(name)}${escapeHtml(age)}
            </h1>


            <p class="profile-location">
              📍 ${escapeHtml(location)}
            </p>


            <div class="presence-line">

              <span
                id="presenceDot"
                class="presence-dot"
              ></span>

              <span
                id="presenceText"
                class="presence-text"
              >
                Checking status...
              </span>

            </div>

          </div>

        </div>


        <div class="profile-body">

          <div class="divider"></div>


          <section class="section">

            <h2 class="section-title">
              About
            </h2>

            <p class="bio">
              ${escapeHtml(bio)}
            </p>

          </section>


          <section class="section">

            <h2 class="section-title">
              Interests
            </h2>

            <div class="interests">

              ${interestsMarkup}

            </div>

          </section>


          ${actionsMarkup}

        </div>

      `;


      /*
        If a photo exists but fails,
        use the initials fallback.
      */

      const image =
        document.getElementById(
          "profilePhoto"
        );


      if (image) {

        image.addEventListener(
          "error",
          function() {

            const fallback =
              document.createElement(
                "div"
              );


            fallback.id =
              "profilePhotoFallback";


            fallback.className =
              "photo-fallback";


            fallback.textContent =
              getInitial(name);


            image.replaceWith(
              fallback
            );

          }
        );

      }


      /*
        Logout only exists on own profile.
      */

      const logoutButton =
        document.getElementById(
          "logoutButton"
        );


      if (logoutButton) {

        logoutButton.addEventListener(
          "click",
          async function() {

            logoutButton.disabled =
              true;

            logoutButton.textContent =
              "Logging out...";


            try {

              await signOut(auth);

              window.location.replace(
                "login.html"
              );

            }

            catch (error) {

              console.error(
                "KMEET logout error:",
                error
              );

              logoutButton.disabled =
                false;

              logoutButton.textContent =
                "Log Out";

            }

          }
        );

      }


      /*
        Start presence monitoring only
        after the profile itself has been
        successfully displayed.
      */

      watchPresence(
        profileUserId,
        isOwnProfile
      );

    }


    /* =========================================
       LOAD ONE FIRESTORE PROFILE
       ========================================= */

    async function loadProfile(
      userId,
      isOwnProfile
    ) {

      console.log(
        "KMEET: Loading profile document:",
        userId
      );


      try {

        const profileRef =
          doc(
            db,
            "users",
            userId
          );


        console.log(
          "KMEET: Reading Firestore document..."
        );


        const profileSnap =
          await getDoc(
            profileRef
          );


        console.log(
          "KMEET: Firestore response received."
        );


        if (
          !profileSnap.exists()
        ) {

          console.error(
            "KMEET: Profile document does not exist."
          );


          profileContainer.innerHTML = `

            <div class="error-card">

              <h2>
                Profile not found
              </h2>

              <p>
                This Kmeet profile could not be found.
              </p>

              <a
                class="button primary-button"
                href="discover.html"
              >
                Back to Discover
              </a>

            </div>

          `;

          return;

        }


        const data =
          profileSnap.data();


        console.log(
          "KMEET: Profile data:",
          data
        );


        displayProfile(
          data,
          userId,
          isOwnProfile
        );


        console.log(
          "KMEET: PROFILE DISPLAYED SUCCESSFULLY."
        );

      }

      catch (error) {

        console.error(
          "KMEET profile loading error:",
          error
        );


        profileContainer.innerHTML = `

          <div class="error-card">

            <h2>
              Could not load profile
            </h2>

            <p>
              Kmeet could not load this profile right now.
              Please refresh the page and try again.
            </p>

            <a
              class="button primary-button"
              href="discover.html"
            >
              Back to Discover
            </a>

          </div>

        `;

        showStatus(
          error.message ||
          "Profile loading error.",
          true
        );

      }

    }


    /* =========================================
       AUTHENTICATION
       ========================================= */

    let authFinished =
      false;


    onAuthStateChanged(
      auth,
      async function(user) {

        authFinished =
          true;


        console.log(
          "KMEET: AUTH STATE RECEIVED:",
          user
        );


        /*
          CASE 1:
          A specific profile was requested.

          Example:
          profile.html?id=abc123

          This profile can be viewed by
          guests as well.
        */

        if (
          requestedUserId
        ) {

          const isOwnProfile =
            Boolean(
              user &&
              !user.isAnonymous &&
              user.uid ===
              requestedUserId
            );


          hideStatus();


          await loadProfile(
            requestedUserId,
            isOwnProfile
          );


          return;

        }


        /*
          CASE 2:
          No ID was supplied.

          This means the page is intended
          to show the logged-in user's own
          profile.
        */

        if (
          !user ||
          user.isAnonymous
        ) {

          console.log(
            "KMEET: No registered user. Redirecting to login."
          );


          window.location.replace(
            "login.html"
          );


          return;

        }


        hideStatus();


        await loadProfile(
          user.uid,
          true
        );

      }
    );


    /* =========================================
       AUTH DIAGNOSTIC
       ========================================= */

    setTimeout(
      function() {

        if (
          authFinished
        ) {

          return;

        }


        console.warn(
          "KMEET: Authentication callback has not completed after 10 seconds."
        );


        showStatus(
          "Kmeet is still waiting for Firebase authentication. Please refresh the page.",
          true
        );

      },
      10000
    );


  </script>

</body>

</html>
