<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Kmeet - Profile</title>

  <link rel="stylesheet" href="styles.css">

  <link
    rel="icon"
    type="image/svg+xml"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/svgs/solid/heart.svg"
  >

  <style>
    :root {
      --pink: #ff4f9a;
      --pink-dark: #e83d87;
      --purple: #8b5cf6;
      --bg: #080810;
      --card: rgba(22, 22, 34, 0.82);
      --card-border: rgba(255,255,255,0.09);
      --text: #ffffff;
      --muted: #a8a8b8;
      --danger: #ff5c70;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,79,154,.13), transparent 35%),
        radial-gradient(circle at bottom right, rgba(139,92,246,.12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav {
      height: 72px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(8,8,16,.75);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ff4f9a, #ff78b3, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .navlinks {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navlinks a {
      color: #ddddea;
      padding: 9px 13px;
      border-radius: 10px;
      transition: .2s ease;
      font-size: 14px;
    }

    .navlinks a:hover {
      background: rgba(255,255,255,.07);
      color: white;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: min(920px, calc(100% - 30px));
      margin: 38px auto 70px;
    }

    .profile-card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        0 0 60px rgba(255,79,154,.05);
      backdrop-filter: blur(20px);
    }

    .profile-cover {
      height: 170px;
      position: relative;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,79,154,.4), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(139,92,246,.35), transparent 30%),
        linear-gradient(135deg, #171323, #10101a);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .profile-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          135deg,
          transparent 30%,
          rgba(255,255,255,.025) 50%,
          transparent 70%
        );
      pointer-events: none;
    }

    .profile-body {
      padding: 0 34px 36px;
    }

    /* =========================
       AVATAR
    ========================= */

    .avatar-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin-top: -75px;
      margin-bottom: 20px;
      z-index: 3;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #ff4f9a, #8b5cf6);
      border: 6px solid #11111b;
      box-shadow:
        0 15px 40px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.08);
    }

    .avatar-placeholder {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 6px solid #11111b;
      background:
        linear-gradient(135deg, #ff4f9a, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 900;
      box-shadow:
        0 15px 40px rgba(0,0,0,.45),
        0 0 0 1px rgba(255,255,255,.08);
    }

    .online-dot {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 19px;
      height: 19px;
      background: #35e58c;
      border: 4px solid #11111b;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(53,229,140,.6);
    }

    /* =========================
       PHOTO UPLOAD
    ========================= */

    .photo-controls {
      margin-top: -4px;
      margin-bottom: 26px;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.055);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: .2s ease;
    }

    .upload-btn:hover {
      background: rgba(255,79,154,.13);
      border-color: rgba(255,79,154,.3);
      transform: translateY(-1px);
    }

    .upload-btn input {
      display: none;
    }

    .upload-status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }

    .upload-status.success {
      color: #53e6a0;
    }

    .upload-status.error {
      color: #ff7182;
    }

    /* =========================
       PROFILE INFORMATION
    ========================= */

    .profile-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .profile-heading h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-left: 7px;
      border-radius: 50%;
      background: #4d9cff;
      color: white;
      font-size: 12px;
      vertical-align: 4px;
    }

    .profile-subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 16px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.07);
      color: #d8d8e5;
      font-size: 13px;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-top: 34px;
      padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .section h2 {
      margin: 0 0 13px;
      font-size: 17px;
    }

    .bio {
      color: #c6c6d2;
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .interest {
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255,79,154,.09);
      border: 1px solid rgba(255,79,154,.18);
      color: #ffd0e5;
      font-size: 13px;
    }

    .empty {
      color: #777789;
      font-size: 14px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .btn {
      border: 0;
      border-radius: 13px;
      padding: 12px 19px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      transition: .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, #ff4f9a, #e83d87);
      box-shadow: 0 10px 25px rgba(255,79,154,.2);
    }

    .btn-secondary {
      color: white;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    .btn-danger {
      color: #ffb5bf;
      background: rgba(255,92,112,.08);
      border: 1px solid rgba(255,92,112,.16);
    }

    /* =========================
       LOADING / ERROR
    ========================= */

    .state {
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
    }

    .spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: var(--pink);
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      padding: 18px;
      border-radius: 14px;
      background: rgba(255,92,112,.08);
      border: 1px solid rgba(255,92,112,.16);
      color: #ffb4be;
      font-size: 14px;
      line-height: 1.6;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {
      .nav {
        padding: 0 16px;
      }

      .navlinks a {
        padding: 8px 8px;
        font-size: 13px;
      }

      .page {
        width: min(100% - 18px, 920px);
        margin-top: 20px;
      }

      .profile-cover {
        height: 125px;
      }

      .profile-body {
        padding: 0 20px 28px;
      }

      .avatar-wrap {
        width: 120px;
        height: 120px;
        margin-top: -60px;
      }

      .avatar,
      .avatar-placeholder {
        width: 120px;
        height: 120px;
      }

      .avatar-placeholder {
        font-size: 38px;
      }

      .profile-heading {
        display: block;
      }

      .profile-heading h1 {
        font-size: 30px;
      }

      .actions {
        flex-direction: column;
      }

      .actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav class="nav">
    <a class="logo" href="index.html">Kmeet</a>

    <div class="navlinks">
      <a href="discover.html">Discover</a>
      <a href="chat.html">Messages</a>
      <a href="index.html">Home</a>
    </div>
  </nav>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="page">

    <section class="profile-card">

      <div class="profile-cover"></div>

      <div id="loadingState" class="state">
        <div class="spinner"></div>
        Loading profile...
      </div>

      <div id="errorState" class="state" style="display:none;">
        <div class="error-box" id="errorMessage"></div>
      </div>

      <div id="profileContent" style="display:none;">

        <div class="profile-body">

          <!-- =========================
               PROFILE PHOTO
          ========================= -->

          <div class="avatar-wrap">

            <img
              id="profilePhoto"
              class="avatar"
              alt="Profile photo"
              style="display:none;"
            >

            <div
              id="avatarPlaceholder"
              class="avatar-placeholder"
            >
              ?
            </div>

            <div class="online-dot"></div>

          </div>


          <!-- =========================
               PHOTO UPLOAD
          ========================= -->

          <div
            id="photoControls"
            class="photo-controls"
            style="display:none;"
          >

            <label class="upload-btn">
              📷 Change profile photo

              <input
                id="photoInput"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/gif"
              >
            </label>

            <div id="uploadStatus" class="upload-status"></div>

          </div>


          <!-- =========================
               NAME / BASIC INFO
          ========================= -->

          <div class="profile-heading">

            <div>
              <h1 id="profileName">Kmeet Member</h1>

              <div
                id="profileSubtitle"
                class="profile-subtitle"
              >
                Kmeet member
              </div>

              <div
                id="profileMeta"
                class="meta"
              ></div>
            </div>

          </div>


          <!-- =========================
               BIO
          ========================= -->

          <section class="section">

            <h2>About</h2>

            <div
              id="profileBio"
              class="bio"
            ></div>

          </section>


          <!-- =========================
               INTERESTS
          ========================= -->

          <section class="section">

            <h2>Interests</h2>

            <div
              id="profileInterests"
              class="interests"
            ></div>

          </section>


          <!-- =========================
               ACTIONS
          ========================= -->

          <div class="actions">

            <button
              id="chatBtn"
              class="btn btn-primary"
              style="display:none;"
            >
              💬 Start Chat
            </button>

            <a
              href="discover.html"
              class="btn btn-secondary"
            >
              🔎 Discover People
            </a>

            <button
              id="logoutBtn"
              class="btn btn-danger"
              style="display:none;"
            >
              Log Out
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FIREBASE / PROFILE LOGIC
  ========================= -->

  <script type="module">

    import {
      auth,
      db,
      onAuthStateChanged,
      signOut,
      doc,
      getDoc,
      setDoc,
      updateProfile,
      storage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "./firebase-config.js";


    /* ==========================================
       ELEMENTS
    ========================================== */

    const loadingState =
      document.getElementById("loadingState");

    const errorState =
      document.getElementById("errorState");

    const errorMessage =
      document.getElementById("errorMessage");

    const profileContent =
      document.getElementById("profileContent");

    const profileName =
      document.getElementById("profileName");

    const profileSubtitle =
      document.getElementById("profileSubtitle");

    const profileMeta =
      document.getElementById("profileMeta");

    const profileBio =
      document.getElementById("profileBio");

    const profileInterests =
      document.getElementById("profileInterests");

    const profilePhoto =
      document.getElementById("profilePhoto");

    const avatarPlaceholder =
      document.getElementById("avatarPlaceholder");

    const photoControls =
      document.getElementById("photoControls");

    const photoInput =
      document.getElementById("photoInput");

    const uploadStatus =
      document.getElementById("uploadStatus");

    const chatBtn =
      document.getElementById("chatBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");


    /* ==========================================
       PROFILE ID
    ========================================== */

    const params = new URLSearchParams(window.location.search);

    const requestedProfileId =
      params.get("userId") ||
      params.get("user") ||
      params.get("id") ||
      null;


    let currentUser = null;
    let currentProfileId = null;


    /* ==========================================
       HELPER FUNCTIONS
    ========================================== */

    function showError(message) {

      loadingState.style.display = "none";
      profileContent.style.display = "none";

      errorMessage.textContent = message;
      errorState.style.display = "block";
    }


    function getInitials(name) {

      if (!name) return "K";

      const parts = name
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      if (!parts.length) return "K";

      if (parts.length === 1) {
        return parts[0].charAt(0).toUpperCase();
      }

      return (
        parts[0].charAt(0) +
        parts[parts.length - 1].charAt(0)
      ).toUpperCase();
    }


    function escapeHTML(value) {

      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }


    function renderPhoto(photoURL, name) {

      if (photoURL) {

        profilePhoto.src = photoURL;
        profilePhoto.alt = `${name}'s profile photo`;

        profilePhoto.style.display = "block";
        avatarPlaceholder.style.display = "none";

        profilePhoto.onerror = () => {

          profilePhoto.style.display = "none";
          avatarPlaceholder.style.display = "flex";

          avatarPlaceholder.textContent =
            getInitials(name);
        };

      } else {

        profilePhoto.removeAttribute("src");
        profilePhoto.style.display = "none";

        avatarPlaceholder.style.display = "flex";

        avatarPlaceholder.textContent =
          getInitials(name);
      }
    }


    /* ==========================================
       RENDER PROFILE
    ========================================== */

    function renderProfile(data, uid, isOwnProfile) {

      const name =
        data.name ||
        data.displayName ||
        "Kmeet Member";


      /*
       * IMPORTANT:
       *
       * We support all the old photo field names
       * so existing Firebase profiles don't break.
       */

      const photoURL =
        data.photoURL ||
        data.avatar ||
        data.photo ||
        data.profilePhoto ||
        "";


      const age =
        data.age !== undefined &&
        data.age !== null &&
        data.age !== ""
          ? data.age
          : null;


      const gender =
        data.gender ||
        "";


      const location =
        data.location ||
        "";


      const bio =
        data.bio ||
        data.about ||
        "This Kmeet member hasn't added a bio yet.";


      const interests =
        Array.isArray(data.interests)
          ? data.interests
          : Array.isArray(data.hobbies)
            ? data.hobbies
            : [];


      /* NAME */

      profileName.textContent = name;


      /* SUBTITLE */

      if (isOwnProfile) {

        profileSubtitle.textContent =
          "Your Kmeet profile";

      } else {

        profileSubtitle.textContent =
          "Kmeet member";
      }


      /* PHOTO */

      renderPhoto(photoURL, name);


      /* META */

      profileMeta.innerHTML = "";


      if (age !== null) {

        const agePill =
          document.createElement("div");

        agePill.className = "meta-pill";
        agePill.innerHTML =
          `🎂 ${escapeHTML(String(age))}`;

        profileMeta.appendChild(agePill);
      }


      if (gender) {

        const genderPill =
          document.createElement("div");

        genderPill.className = "meta-pill";
        genderPill.innerHTML =
          `👤 ${escapeHTML(gender)}`;

        profileMeta.appendChild(genderPill);
      }


      if (location) {

        const locationPill =
          document.createElement("div");

        locationPill.className = "meta-pill";
        locationPill.innerHTML =
          `📍 ${escapeHTML(location)}`;

        profileMeta.appendChild(locationPill);
      }


      if (!profileMeta.children.length) {

        const memberPill =
          document.createElement("div");

        memberPill.className = "meta-pill";
        memberPill.textContent =
          "💗 Kmeet Member";

        profileMeta.appendChild(memberPill);
      }


      /* BIO */

      profileBio.textContent = bio;


      /* INTERESTS */

      profileInterests.innerHTML = "";


      if (!interests.length) {

        const empty =
          document.createElement("div");

        empty.className = "empty";

        empty.textContent =
          "No interests added yet.";

        profileInterests.appendChild(empty);

      } else {

        interests.forEach((interest) => {

          const item =
            document.createElement("span");

          item.className = "interest";

          item.textContent = interest;

          profileInterests.appendChild(item);

        });
      }


      /* OWN PROFILE */

      if (isOwnProfile) {

        photoControls.style.display = "block";
        logoutBtn.style.display = "inline-flex";
        chatBtn.style.display = "none";

      } else {

        photoControls.style.display = "none";
        logoutBtn.style.display = "none";
        chatBtn.style.display = "inline-flex";

        chatBtn.onclick = () => {

          window.location.href =
            `chat.html?userId=${encodeURIComponent(uid)}`;

        };
      }


      loadingState.style.display = "none";
      errorState.style.display = "none";
      profileContent.style.display = "block";
    }


    /* ==========================================
       LOAD PROFILE
    ========================================== */

    async function loadProfile(user) {

      try {

        /*
         * If a userId is provided in the URL,
         * show that person's profile.
         *
         * Otherwise show the logged-in user's profile.
         */

        currentProfileId =
          requestedProfileId || user?.uid || null;


        if (!currentProfileId) {

          showError(
            "Please log in to view your Kmeet profile."
          );

          return;
        }


        const profileRef =
          doc(db, "users", currentProfileId);


        const profileSnap =
          await getDoc(profileRef);


        if (!profileSnap.exists()) {

          showError(
            "This Kmeet profile could not be found."
          );

          return;
        }


        const data =
          profileSnap.data();


        const isOwnProfile =
          !!user &&
          user.uid === currentProfileId;


        renderProfile(
          data,
          currentProfileId,
          isOwnProfile
        );


      } catch (error) {

        console.error(
          "Profile loading error:",
          error
        );

        showError(
          "We couldn't load this profile. Please refresh the page and try again."
        );
      }
    }


    /* ==========================================
       PHOTO UPLOAD
    ========================================== */

    photoInput.addEventListener(
      "change",
      async (event) => {

        const file =
          event.target.files?.[0];


        if (!file) return;


        if (!currentUser) {

          uploadStatus.textContent =
            "Please log in before uploading a photo.";

          uploadStatus.className =
            "upload-status error";

          return;
        }


        /*
         * Limit image size to 5 MB.
         */

        const maxSize =
          5 * 1024 * 1024;


        if (file.size > maxSize) {

          uploadStatus.textContent =
            "Please choose an image smaller than 5 MB.";

          uploadStatus.className =
            "upload-status error";

          photoInput.value = "";

          return;
        }


        /*
         * Make sure the selected file is actually
         * an image.
         */

        if (!file.type.startsWith("image/")) {

          uploadStatus.textContent =
            "Please choose an image file.";

          uploadStatus.className =
            "upload-status error";

          photoInput.value = "";

          return;
        }


        try {

          uploadStatus.textContent =
            "Uploading your photo...";

          uploadStatus.className =
            "upload-status";


          /*
           * Disable the input while uploading.
           */

          photoInput.disabled = true;


          /*
           * Create a unique file name.
           */

          const extension =
            file.name.includes(".")
              ? file.name
                  .split(".")
                  .pop()
                  .toLowerCase()
              : "jpg";


          const fileName =
            `profile-${Date.now()}.${extension}`;


          /*
           * IMPORTANT:
           *
           * Each user's photos are stored inside
           * their own UID folder.
           *
           * profilePhotos/
           *   USER_UID/
           *      profile-123.jpg
           */

          const storageRef =
            ref(
              storage,
              `profilePhotos/${currentUser.uid}/${fileName}`
            );


          /*
           * Upload image.
           */

          await uploadBytes(
            storageRef,
            file,
            {
              contentType: file.type,
              cacheControl: "public,max-age=31536000"
            }
          );


          /*
           * Get public download URL.
           */

          const downloadURL =
            await getDownloadURL(storageRef);


          /*
           * Save photo URL in Firestore.
           *
           * photoURL is now the main field.
           *
           * avatar is also updated for compatibility
           * with older Kmeet pages.
           */

          await setDoc(
            doc(db, "users", currentUser.uid),
            {
              photoURL: downloadURL,
              avatar: downloadURL,
              photo: downloadURL,
              profilePhoto: downloadURL
            },
            {
              merge: true
            }
          );


          /*
           * Also update Firebase Authentication
           * profile photo.
           */

          try {

            await updateProfile(
              currentUser,
              {
                photoURL: downloadURL
              }
            );

          } catch (authPhotoError) {

            /*
             * Don't fail the whole upload if
             * Auth photo update fails.
             */

            console.warn(
              "Auth photo update failed:",
              authPhotoError
            );
          }


          /*
           * Immediately display the new image.
           */

          renderPhoto(
            downloadURL,
            profileName.textContent
          );


          uploadStatus.textContent =
            "Profile photo updated successfully.";

          uploadStatus.className =
            "upload-status success";


        } catch (error) {

          console.error(
            "Photo upload error:",
            error
          );


          let message =
            "Photo upload failed. Please try again.";


          if (
            error.code ===
            "storage/unauthorized"
          ) {

            message =
              "Upload was blocked by Firebase Storage rules.";

          } else if (
            error.code ===
            "storage/unauthenticated"
          ) {

            message =
              "Your login session expired. Please log in again.";

          } else if (
            error.code ===
            "storage/quota-exceeded"
          ) {

            message =
              "Firebase Storage quota has been exceeded.";

          } else if (
            error.code ===
            "storage/canceled"
          ) {

            message =
              "Photo upload was cancelled.";

          } else if (error.message) {

            console.error(
              error.message
            );
          }


          uploadStatus.textContent =
            message;

          uploadStatus.className =
            "upload-status error";


        } finally {

          photoInput.disabled = false;
          photoInput.value = "";
        }

      }
    );


    /* ==========================================
       LOG OUT
    ========================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          /*
           * Clear old local Kmeet information so
           * an old profile image cannot remain
           * visible after logout.
           */

          localStorage.removeItem("userEmail");
          localStorage.removeItem("userAvatar");
          localStorage.removeItem("userInterests");

          sessionStorage.removeItem("pendingEmail");
          sessionStorage.removeItem("pendingInterests");

          window.location.href =
            "index.html";

        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

          alert(
            "Could not log out. Please try again."
          );
        }
      }
    );


    /* ==========================================
       AUTH STATE
    ========================================== */

    onAuthStateChanged(
      auth,
      async (user) => {

        currentUser = user || null;


        /*
         * If viewing another person's profile,
         * Firebase login isn't strictly required.
         *
         * But if no userId is supplied, the current
         * logged-in user is required.
         */

        if (
          !requestedProfileId &&
          !user
        ) {

          showError(
            "Please log in to view your profile."
          );

          return;
        }


        await loadProfile(user);
      }
    );

  </script>

</body>
