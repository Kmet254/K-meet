
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet - Profile</title>

<link rel="icon"
      type="image/jpeg"
      href="https://kmet254.github.io/K-meet/kmeet-logo.jfif.jfif">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Poppins", sans-serif;
    color: #fff;

    background:
        linear-gradient(
            rgba(13,8,14,.84),
            rgba(20,7,17,.95)
        ),
        url("img/bg34.jpg")
        center/cover fixed no-repeat;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at top left,
            rgba(255,72,151,.15),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(255,0,102,.12),
            transparent 35%
        );
}

.navbar {
    position: relative;
    z-index: 5;

    width: 100%;
    padding: 18px 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(10,7,11,.58);

    border-bottom:
        1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(14px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;

    color: white;
    text-decoration: none;

    font-family: "Playfair Display", serif;
    font-size: 27px;
    font-weight: 700;
}

.logo-heart {
    color: #ff4f9a;
}

.nav-links {
    display: flex;
    gap: 22px;
}

.nav-links a {
    color: rgba(255,255,255,.82);
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover {
    color: #ff76ae;
}

.container {
    position: relative;
    z-index: 2;

    width: min(850px, 92%);
    margin: 45px auto 70px;
}

.profile-card {
    background: rgba(25,13,23,.80);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 28px;

    padding: 35px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);

    backdrop-filter: blur(18px);
}

.profile-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

.main-photo {
    width: 190px;
    height: 190px;

    border-radius: 50%;
    overflow: hidden;

    border:
        3px solid rgba(255,80,150,.75);

    background:
        linear-gradient(
            135deg,
            rgba(255,70,145,.22),
            rgba(255,255,255,.04)
        );

    box-shadow:
        0 18px 45px rgba(0,0,0,.45),
        0 0 30px rgba(255,65,145,.16);

    display: flex;
    align-items: center;
    justify-content: center;
}

.main-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.initial {
    font-family: "Playfair Display", serif;
    font-size: 70px;
    color: #ff6ca9;
}

.name {
    margin-top: 20px;

    font-family: "Playfair Display", serif;
    font-size: 34px;
}

.location {
    margin-top: 5px;

    color: rgba(255,255,255,.62);
    font-size: 14px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    margin-top: 12px;

    color: #9df0c4;
    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #55dc93;

    box-shadow:
        0 0 10px rgba(85,220,147,.7);
}

.actions {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin-top: 25px;

    flex-wrap: wrap;
}

.action {
    padding: 11px 20px;

    border-radius: 24px;

    text-decoration: none;

    font-size: 13px;
    font-weight: 600;
}

.edit {
    color: #ff9ac3;

    background: rgba(255,67,143,.14);

    border:
        1px solid rgba(255,89,156,.35);
}

.chat {
    color: white;

    background:
        linear-gradient(
            135deg,
            #ff3f8e,
            #ff6aab
        );
}

.section {
    margin-top: 35px;

    padding-top: 27px;

    border-top:
        1px solid rgba(255,255,255,.08);
}

.section-title {
    margin: 0 0 15px;

    font-family: "Playfair Display", serif;
    font-size: 22px;
}

.bio {
    color: rgba(255,255,255,.72);

    line-height: 1.7;

    font-size: 14px;
}

.details {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 13px;
}

.detail {
    padding: 14px;

    border-radius: 15px;

    background: rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.07);
}

.detail-label {
    display: block;

    color: rgba(255,255,255,.43);

    font-size: 11px;

    margin-bottom: 4px;
}

.detail-value {
    color: rgba(255,255,255,.82);

    font-size: 13px;
}

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.tag {
    padding: 7px 12px;

    border-radius: 20px;

    color: #ff9ac3;

    background:
        rgba(255,67,143,.12);

    border:
        1px solid rgba(255,89,156,.25);

    font-size: 11px;
}


/* =========================================
   PHOTO GALLERY
========================================= */

.gallery-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.gallery-count {
    color: rgba(255,255,255,.42);

    font-size: 12px;
}

.gallery {
    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 12px;
}

.gallery-item {
    position: relative;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    border-radius: 16px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.08);

    cursor: pointer;
}

.gallery-item img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition:
        transform .25s ease;
}

.gallery-item:hover img {
    transform: scale(1.05);
}

.gallery-current {
    position: absolute;

    left: 8px;
    bottom: 8px;

    padding: 5px 8px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.65);

    color: #ff9ac3;

    font-size: 9px;
}

.empty-gallery {
    padding: 25px;

    text-align: center;

    color: rgba(255,255,255,.4);

    border:
        1px dashed rgba(255,255,255,.12);

    border-radius: 16px;

    font-size: 13px;
}


/* =========================================
   LIGHTBOX
========================================= */

.lightbox {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,.88);
}

.lightbox.show {
    display: flex;
}

.lightbox img {
    max-width: 92vw;
    max-height: 88vh;

    object-fit: contain;

    border-radius: 15px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65);
}

.close-lightbox {
    position: absolute;

    top: 20px;
    right: 25px;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 23px;

    cursor: pointer;
}


/* =========================================
   LOADING / ERROR
========================================= */

.loading {
    text-align: center;

    padding: 80px 20px;

    color: rgba(255,255,255,.6);
}

.error {
    text-align: center;

    padding: 60px 20px;

    color: #ff9cab;
}


@media(max-width:650px) {

    .profile-card {
        padding: 23px 18px;
    }

    .main-photo {
        width: 160px;
        height: 160px;
    }

    .name {
        font-size: 29px;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .gallery {
        grid-template-columns:
            repeat(3,1fr);
    }

}

</style>

</head>


<body>


<header class="navbar">

    <a class="logo" href="index.html">

        <span class="logo-heart">
            ♥
        </span>

        <span>
            Kmeet
        </span>

    </a>


    <nav class="nav-links">

        <a href="discover.html">
            Discover
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>



<main class="container">


<section id="loading"
         class="profile-card loading">

    Loading your Kmeet profile...

</section>



<section id="profileCard"
         class="profile-card"
         style="display:none;">


    <div class="profile-top">


        <div class="main-photo">

            <img id="mainPhoto"
                 alt="Profile photo"
                 style="display:none;">

            <span id="initial"
                  class="initial">

                K

            </span>

        </div>



        <div id="profileName"
             class="name">

            Kmeet Member

        </div>



        <div id="profileLocation"
             class="location">

        </div>



        <div class="status">

            <span class="status-dot"></span>

            <span>
                Online
            </span>

        </div>



        <div class="actions">


            <a id="editButton"
               class="action edit"
               href="edit-profile.html">

                ✏️ Edit Profile

            </a>


        </div>


    </div>



    <section class="section">


        <h2 class="section-title">

            About Me

        </h2>


        <div id="bio"
             class="bio">

        </div>


    </section>



    <section class="section">


        <h2 class="section-title">

            My Details

        </h2>


        <div class="details">


            <div class="detail">

                <span class="detail-label">
                    Age
                </span>

                <span id="age"
                      class="detail-value">

                </span>

            </div>



            <div class="detail">

                <span class="detail-label">
                    Gender
                </span>

                <span id="gender"
                      class="detail-value">

                </span>

            </div>



            <div class="detail">

                <span class="detail-label">
                    Location
                </span>

                <span id="locationDetail"
                      class="detail-value">

                </span>

            </div>


        </div>


    </section>



    <section class="section">


        <h2 class="section-title">

            Interests

        </h2>


        <div id="interests"
             class="tags">

        </div>


    </section>



    <section class="section">


        <div class="gallery-header">


            <h2 class="section-title">

                My Photo Gallery

            </h2>


            <span id="galleryCount"
                  class="gallery-count">

                0 photos

            </span>


        </div>



        <div id="gallery"
             class="gallery">

        </div>


    </section>


</section>



<section id="errorCard"
         class="profile-card error"
         style="display:none;">

</section>


</main>



<div id="lightbox"
     class="lightbox">


    <button id="closeLightbox"
            class="close-lightbox">

        ×

    </button>


    <img id="lightboxImage"
         alt="Kmeet gallery photo">


</div>



<script type="module">


import {

    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    setDoc

} from "./firebase-config.js";



const loading =
    document.getElementById("loading");


const profileCard =
    document.getElementById("profileCard");


const errorCard =
    document.getElementById("errorCard");


const mainPhoto =
    document.getElementById("mainPhoto");


const initial =
    document.getElementById("initial");


const profileName =
    document.getElementById("profileName");


const profileLocation =
    document.getElementById("profileLocation");


const locationDetail =
    document.getElementById("locationDetail");


const age =
    document.getElementById("age");


const gender =
    document.getElementById("gender");


const bio =
    document.getElementById("bio");


const interests =
    document.getElementById("interests");


const gallery =
    document.getElementById("gallery");


const galleryCount =
    document.getElementById("galleryCount");


const lightbox =
    document.getElementById("lightbox");


const lightboxImage =
    document.getElementById("lightboxImage");


const closeLightbox =
    document.getElementById("closeLightbox");



/*
 * 24 hours.
 */

const ROTATION_TIME =
    24 * 60 * 60 * 1000;



function getPhotoURL(data) {

    return (

        data.photoURL ||

        data.profilePhoto ||

        data.photo ||

        data.avatar ||

        data.profileImage ||

        ""

    );

}



function getGallery(data, currentPhoto) {

    let photos =

        Array.isArray(data.photoGallery)

            ? [...data.photoGallery]

            : [];


    photos = photos.filter(

        photo =>

            typeof photo === "string" &&

            photo.trim() !== ""

    );


    photos = [

        ...new Set(photos)

    ];


    /*
     * Protect an older photo that was
     * saved before the gallery existed.
     */

    if (

        currentPhoto &&

        !photos.includes(currentPhoto)

    ) {

        photos.unshift(currentPhoto);

    }


    return photos;

}



function timestampValue(value) {

    if (!value) return 0;


    if (

        typeof value.toMillis === "function"

    ) {

        return value.toMillis();

    }


    if (value instanceof Date) {

        return value.getTime();

    }


    if (

        typeof value.seconds === "number"

    ) {

        return value.seconds * 1000;

    }


    const result =

        new Date(value).getTime();


    return Number.isNaN(result)

        ? 0

        : result;

}



async function rotatePhotoIfNeeded(

    uid,

    data,

    currentPhoto,

    photos

) {


    /*
     * Don't rotate when there is
     * only one gallery picture.
     */

    if (photos.length < 2) {

        return currentPhoto;

    }


    const lastRotation =

        timestampValue(

            data.photoRotationAt

        );


    /*
     * First time using rotation.
     */

    if (!lastRotation) {


        await setDoc(

            doc(db, "users", uid),

            {

                photoRotationAt:
                    new Date(),

                photoRotationIndex:
                    Math.max(
                        0,
                        photos.indexOf(
                            currentPhoto
                        )
                    )

            },

            {
                merge: true
            }

        );


        return currentPhoto;

    }


    /*
     * Wait until 24 hours have passed.
     */

    if (

        Date.now() - lastRotation <

        ROTATION_TIME

    ) {

        return currentPhoto;

    }


    let currentIndex =

        photos.indexOf(
            currentPhoto
        );


    if (currentIndex < 0) {

        currentIndex = 0;

    }


    /*
     * Pick the next picture.
     */

    const nextIndex =

        (currentIndex + 1) %

        photos.length;


    const nextPhoto =

        photos[nextIndex];


    /*
     * Save the new current picture.
     */

    await setDoc(

        doc(db, "users", uid),

        {

            photoURL:
                nextPhoto,

            photoRotationAt:
                new Date(),

            photoRotationIndex:
                nextIndex,

            photoGallery:
                photos

        },

        {
            merge: true
        }

    );


    return nextPhoto;

}



function showPhoto(url, name) {


    if (url) {


        mainPhoto.src =
            url;


        mainPhoto.style.display =
            "block";


        initial.style.display =
            "none";


    } else {


        mainPhoto.style.display =
            "none";


        initial.textContent =

            (

                name ||

                "K"

            )

            .trim()

            .charAt(0)

            .toUpperCase();


        initial.style.display =
            "block";

    }

}



function showInterests(list) {


    interests.innerHTML =
        "";


    if (

        !Array.isArray(list) ||

        !list.length

    ) {


        const tag =
            document.createElement("span");


        tag.className =
            "tag";


        tag.textContent =
            "Still discovering interests";


        interests.appendChild(tag);


        return;

    }


    list.forEach(item => {


        const tag =
            document.createElement("span");


        tag.className =
            "tag";


        tag.textContent =
            item;


        interests.appendChild(tag);


    });

}



function showGallery(

    photos,

    currentPhoto

) {


    gallery.innerHTML =
        "";


    galleryCount.textContent =

        `${photos.length} photo` +

        (

            photos.length === 1

                ? ""

                : "s"

        );


    if (!photos.length) {


        gallery.innerHTML = `

            <div class="empty-gallery">

                Your photo gallery is empty.<br>

                Add photos from Edit Profile.

            </div>

        `;


        return;

    }


    photos.forEach(

        (photo, index) => {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "gallery-item";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                photo;


            image.alt =

                `Gallery photo ${index + 1}`;


            image.loading =
                "lazy";


            item.appendChild(
                image
            );


            if (

                photo === currentPhoto

            ) {


                const current =
                    document.createElement(
                        "div"
                    );


                current.className =
                    "gallery-current";


                current.textContent =
                    "Current";


                item.appendChild(
                    current
                );

            }


            item.addEventListener(

                "click",

                () => {


                    lightboxImage.src =
                        photo;


                    lightbox.classList.add(
                        "show"
                    );


                }

            );


            gallery.appendChild(
                item
            );

        }

    );

}



async function loadProfile(user) {


    try {


        const reference =

            doc(

                db,

                "users",

                user.uid

            );


        const snapshot =

            await getDoc(
                reference
            );


        if (!snapshot.exists()) {


            throw new Error(

                "Your Kmeet profile has not been created yet."

            );

        }


        let data =
            snapshot.data();


        let currentPhoto =

            getPhotoURL(
                data
            );


        let photos =

            getGallery(
                data,
                currentPhoto
            );


        /*
         * Automatically rotate the current
         * picture when 24 hours have passed.
         */

        currentPhoto =

            await rotatePhotoIfNeeded(

                user.uid,

                data,

                currentPhoto,

                photos

            );


        /*
         * Make sure the current picture is
         * always present in the gallery.
         */

        if (

            currentPhoto &&

            !photos.includes(
                currentPhoto
            )

        ) {

            photos.unshift(
                currentPhoto
            );

        }


        const name =

            data.name ||

            data.username ||

            data.displayName ||

            user.displayName ||

            "Kmeet Member";


        profileName.textContent =
            name;


        const location =

            data.location ||

            "Kenya";


        profileLocation.textContent =

            "📍 " + location;


        locationDetail.textContent =
            location;


        age.textContent =

            data.age

                ? data.age

                : "Not provided";


        gender.textContent =

            data.gender ||

            "Not provided";


        bio.textContent =

            data.bio ||

            "Connecting hearts naturally.";


        showPhoto(

            currentPhoto,

            name

        );


        showInterests(

            data.interests

        );


        showGallery(

            photos,

            currentPhoto

        );


        loading.style.display =
            "none";


        profileCard.style.display =
            "block";


    } catch (error) {


        console.error(
            "Profile error:",
            error
        );


        loading.style.display =
            "none";


        errorCard.style.display =
            "block";


        errorCard.textContent =

            error.message ||

            "We could not load your profile.";

    }

}



closeLightbox.addEventListener(

    "click",

    () => {


        lightbox.classList.remove(
            "show"
        );


        lightboxImage.removeAttribute(
            "src"
        );

    }

);



lightbox.addEventListener(

    "click",

    event => {


        if (

            event.target ===
            lightbox

        ) {


            lightbox.classList.remove(
                "show"
            );


            lightboxImage.removeAttribute(
                "src"
            );

        }

    }

);



document.addEventListener(

    "keydown",

    event => {


        if (

            event.key ===
            "Escape"

        ) {


            lightbox.classList.remove(
                "show"
            );

        }

    }

);



onAuthStateChanged(

    auth,

    async user => {


        if (!user) {


            window.location.href =
                "login.html";


            return;

        }


        await loadProfile(user);

    }

);

</script>

</body>
</html>
