<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kmeet - Profile</title>

<link rel="icon" type="image/jpeg" href="assets/kmeet-logo.jfif">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Poppins,Arial,sans-serif;
    color:#fff;

    background:
        radial-gradient(circle at 15% 10%,rgba(255,45,145,.18),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(145,80,255,.16),transparent 32%),
        linear-gradient(135deg,#0b0810,#15101c 55%,#0b0710);

    overflow-x:hidden;
}

.hidden{
    display:none !important;
}

/* =========================
   NAVIGATION
========================= */

.nav{
    height:76px;
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6vw;

    background:rgba(10,7,15,.72);
    border-bottom:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    position:relative;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    text-decoration:none;
    color:#fff;

    font-size:27px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo-heart{
    color:#ff3d98;
    font-size:23px;
}

.logo span{
    color:#ff3d98;
}

.navlinks{
    display:flex;
    align-items:center;
    gap:25px;
}

.navlinks a{
    color:#ddd6e3;
    text-decoration:none;
    font-size:14px;
    font-weight:600;

    transition:.2s ease;
}

.navlinks a:hover{
    color:#ff4b9e;
}

.navlinks .active{
    color:#ff4b9e;
}

/* =========================
   PAGE
========================= */

.page{
    width:100%;
    max-width:1050px;

    margin:0 auto;

    padding:45px 20px 80px;
}

/* =========================
   TOP PROFILE
========================= */

.profile-card{
    width:100%;

    background:
        linear-gradient(
            145deg,
            rgba(38,30,48,.92),
            rgba(19,15,27,.96)
        );

    border:1px solid rgba(255,255,255,.10);

    border-radius:30px;

    box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);

    overflow:hidden;
}

/* =========================
   COVER
========================= */

.cover{
    height:175px;

    position:relative;

    background:
        radial-gradient(
            circle at 25% 30%,
            rgba(255,65,155,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at 75% 70%,
            rgba(137,73,255,.25),
            transparent 40%
        ),
        linear-gradient(135deg,#241427,#15101e);
}

.cover::after{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
        to bottom,
        transparent,
        rgba(9,6,13,.55)
    );
}

/* =========================
   PROFILE CONTENT
========================= */

.profile-content{
    padding:0 42px 42px;
    position:relative;
}

.photo-area{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    margin-top:-72px;

    position:relative;
    z-index:5;
}

.photo-wrapper{
    width:145px;
    height:145px;

    border-radius:50%;

    padding:5px;

    background:
        linear-gradient(
            135deg,
            #ff4a9c,
            #a66cff
        );

    box-shadow:
        0 18px 45px rgba(0,0,0,.45);
}

.profile-photo{
    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;

    display:block;

    background:#211927;
}

.initial-avatar{
    width:100%;
    height:100%;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #38213c,
            #17111e
        );

    font-size:48px;
    font-weight:700;
    color:#fff;
}

.photo-actions{
    display:flex;
    gap:10px;
    padding-bottom:8px;
}

.small-btn{
    border:none;
    cursor:pointer;

    padding:10px 15px;

    border-radius:12px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:600;

    transition:.2s ease;
}

.small-btn:hover{
    background:rgba(255,255,255,.14);
}

.primary-btn{
    background:linear-gradient(
        135deg,
        #ff3b93,
        #d92b78
    );

    border:none;
}

.primary-btn:hover{
    transform:translateY(-1px);
}

/* =========================
   PROFILE INFO
========================= */

.profile-info{
    margin-top:22px;
}

.profile-name-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.profile-name{
    font-size:31px;
    font-weight:700;
    letter-spacing:-.7px;
}

.verified{
    width:23px;
    height:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#ff3b93;

    font-size:11px;
}

.profile-meta{
    display:flex;
    flex-wrap:wrap;
    gap:16px;

    margin-top:10px;

    color:#bbb2c3;
    font-size:14px;
}

.profile-meta span{
    display:flex;
    align-items:center;
    gap:7px;
}

.profile-meta i{
    color:#ff4a9b;
}

.bio{
    margin-top:20px;

    max-width:760px;

    color:#d6cedb;

    font-size:15px;
    line-height:1.8;
}

.bio.empty{
    color:#8f8795;
    font-style:italic;
}

/* =========================
   ACTIONS
========================= */

.main-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;

    margin-top:24px;
}

.action-btn{
    border:none;
    text-decoration:none;

    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    min-height:48px;

    padding:0 22px;

    border-radius:14px;

    font-family:inherit;
    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:.2s ease;
}

.chat-btn{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff3d96,
            #d72878
        );

    box-shadow:0 10px 25px rgba(255,45,145,.18);
}

.chat-btn:hover{
    transform:translateY(-2px);
}

.back-btn{
    color:#ddd5e1;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.09);
}

/* =========================
   DETAILS
========================= */

.details-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:14px;

    margin-top:30px;
}

.detail{
    padding:18px;

    border-radius:17px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.07);
}

.detail-label{
    color:#8e8695;

    font-size:11px;
    text-transform:uppercase;

    letter-spacing:.7px;

    margin-bottom:7px;
}

.detail-value{
    color:#eee7f0;

    font-size:14px;
    font-weight:500;
}

/* =========================
   INTERESTS
========================= */

.section{
    margin-top:32px;
}

.section-title{
    font-family:"Playfair Display",serif;

    font-size:24px;

    margin-bottom:15px;
}

.interests{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.interest{
    padding:9px 14px;

    border-radius:30px;

    background:rgba(255,58,147,.09);

    border:1px solid rgba(255,58,147,.20);

    color:#f3dce8;

    font-size:12px;
}

/* =========================
   GALLERY
========================= */

.gallery{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;
}

.gallery-item{
    position:relative;

    aspect-ratio:1/1;

    border-radius:17px;

    overflow:hidden;

    background:#1c1622;

    border:1px solid rgba(255,255,255,.08);

    cursor:pointer;
}

.gallery-item img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:.3s ease;
}

.gallery-item:hover img{
    transform:scale(1.05);
}

.remove-photo{
    position:absolute;

    top:8px;
    right:8px;

    width:30px;
    height:30px;

    border-radius:50%;

    border:none;

    background:rgba(0,0,0,.65);

    color:#fff;

    cursor:pointer;
}

/* =========================
   EMPTY / LOADING
========================= */

.loading{
    text-align:center;

    padding:90px 20px;

    color:#bdb4c4;
}

.spinner{
    width:38px;
    height:38px;

    margin:0 auto 18px;

    border:3px solid rgba(255,255,255,.12);

    border-top-color:#ff3d96;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error-box{
    padding:40px;

    text-align:center;

    color:#ddd;

    display:none;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.78);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:600px;

    max-height:90vh;

    overflow:auto;

    padding:30px;

    border-radius:24px;

    background:#18121f;

    border:1px solid rgba(255,255,255,.10);

    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.modal-title{
    font-family:"Playfair Display",serif;

    font-size:26px;

    margin-bottom:22px;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;

    margin-bottom:7px;

    color:#bdb4c5;

    font-size:12px;
}

.field input,
.field textarea,
.field select{
    width:100%;

    padding:13px 14px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.055);

    color:#fff;

    outline:none;

    font-family:inherit;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:rgba(255,61,150,.6);
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;

    margin-top:22px;
}

/* =========================
   LIGHTBOX
========================= */

.lightbox{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.92);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:200;

    padding:25px;
}

.lightbox.show{
    display:flex;
}

.lightbox img{
    max-width:92vw;
    max-height:88vh;

    object-fit:contain;

    border-radius:14px;
}

.close-lightbox{
    position:fixed;

    top:22px;
    right:25px;

    width:42px;
    height:42px;

    border-radius:50%;

    border:none;

    background:rgba(255,255,255,.12);

    color:#fff;

    font-size:20px;

    cursor:pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .nav{
        padding:0 18px;
    }

    .logo{
        font-size:23px;
    }

    .navlinks{
        gap:13px;
    }

    .navlinks a{
        font-size:12px;
    }

    .page{
        padding:25px 12px 55px;
    }

    .cover{
        height:135px;
    }

    .profile-content{
        padding:0 20px 30px;
    }

    .photo-area{
        margin-top:-58px;

        align-items:flex-end;
    }

    .photo-wrapper{
        width:116px;
        height:116px;
    }

    .initial-avatar{
        font-size:38px;
    }

    .photo-actions{
        padding-bottom:4px;
    }

    .small-btn{
        padding:8px 10px;
        font-size:11px;
    }

    .profile-name{
        font-size:25px;
    }

    .details-grid{
        grid-template-columns:1fr;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<!-- =========================
     NAVIGATION
========================= -->

<nav class="nav">

    <a href="index.html" class="logo">

        <span class="logo-heart">
            <i class="fa-solid fa-heart"></i>
        </span>

        Kmeet<span>.</span>

    </a>

    <div class="navlinks">

        <a href="index.html">
            Home
        </a>

        <a href="discover.html">
            Discover
        </a>

        <a href="profile.html" class="active">
            Profile
        </a>

    </div>

</nav>


<!-- =========================
     PAGE
========================= -->

<main class="page">

    <!-- LOADING -->

    <div id="loading" class="loading">

        <div class="spinner"></div>

        <p>Loading profile...</p>

    </div>


    <!-- ERROR -->

    <div id="errorBox" class="error-box">

        <i
            class="fa-solid fa-heart-crack"
            style="font-size:42px;color:#ff4a9b;margin-bottom:15px;">
        </i>

        <h2>Profile unavailable</h2>

        <p id="errorText" style="margin-top:10px;color:#aaa;">
            We couldn't load this profile.
        </p>

        <a
            href="discover.html"
            class="action-btn back-btn"
            style="margin-top:22px;">
            <i class="fa-solid fa-compass"></i>
            Back to Discover
        </a>

    </div>


    <!-- PROFILE -->

    <section id="profileCard" class="profile-card hidden">

        <div class="cover"></div>

        <div class="profile-content">

            <!-- PHOTO -->

            <div class="photo-area">

                <div class="photo-wrapper">

                    <img
                        id="profilePhoto"
                        class="profile-photo hidden"
                        src=""
                        alt="Profile photo">

                    <div
                        id="initialAvatar"
                        class="initial-avatar">
                        K
                    </div>

                </div>


                <!-- OWN PROFILE CONTROLS -->

                <div
                    id="ownPhotoActions"
                    class="photo-actions hidden">

                    <button
                        id="changePhotoBtn"
                        class="small-btn primary-btn">

                        <i class="fa-solid fa-camera"></i>
                        Change Photo

                    </button>

                    <input
                        id="mainPhotoInput"
                        type="file"
                        accept="image/*"
                        class="hidden">

                </div>

            </div>


            <!-- INFO -->

            <div class="profile-info">

                <div class="profile-name-row">

                    <h1
                        id="profileName"
                        class="profile-name">
                        Kmeet Member
                    </h1>

                    <span
                        class="verified"
                        title="Kmeet member">

                        <i class="fa-solid fa-heart"></i>

                    </span>

                </div>


                <div class="profile-meta">

                    <span id="ageWrap" class="hidden">
                        <i class="fa-solid fa-cake-candles"></i>
                        <span id="profileAge"></span>
                    </span>

                    <span id="genderWrap" class="hidden">
                        <i class="fa-solid fa-user"></i>
                        <span id="profileGender"></span>
                    </span>

                    <span id="locationWrap" class="hidden">
                        <i class="fa-solid fa-location-dot"></i>
                        <span id="profileLocation"></span>
                    </span>

                </div>


                <p
                    id="profileBio"
                    class="bio">
                </p>


                <!-- ACTION BUTTONS -->

                <div class="main-actions">

                    <a
                        id="chatBtn"
                        href="#"
                        class="action-btn chat-btn hidden">

                        <i class="fa-solid fa-message"></i>

                        Chat

                    </a>


                    <button
                        id="editBtn"
                        class="action-btn back-btn hidden">

                        <i class="fa-solid fa-pen"></i>

                        Edit Profile

                    </button>


                    <a
                        href="discover.html"
                        class="action-btn back-btn">

                        <i class="fa-solid fa-compass"></i>

                        Discover

                    </a>

                </div>


                <!-- DETAILS -->

                <div class="details-grid">

                    <div class="detail">

                        <div class="detail-label">
                            Name
                        </div>

                        <div
                            id="detailName"
                            class="detail-value">
                            —
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Location
                        </div>

                        <div
                            id="detailLocation"
                            class="detail-value">
                            —
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Member
                        </div>

                        <div
                            id="detailMember"
                            class="detail-value">
                            Kmeet
                        </div>

                    </div>

                </div>


                <!-- INTERESTS -->

                <section class="section">

                    <h2 class="section-title">
                        Interests
                    </h2>

                    <div
                        id="interests"
                        class="interests">
                    </div>

                </section>


                <!-- GALLERY -->

                <section
                    id="gallerySection"
                    class="section hidden">

                    <h2 class="section-title">
                        Photos
                    </h2>

                    <div
                        id="gallery"
                        class="gallery">
                    </div>

                </section>


                <!-- OWN PROFILE ADD PHOTOS -->

                <section
                    id="uploadSection"
                    class="section hidden">

                    <button
                        id="galleryUploadBtn"
                        class="action-btn back-btn">

                        <i class="fa-solid fa-images"></i>

                        Add Photos

                    </button>

                    <input
                        id="galleryInput"
                        type="file"
                        accept="image/*"
                        multiple
                        class="hidden">

                    <p
                        style="
                        margin-top:9px;
                        color:#817887;
                        font-size:11px;">
                        You can add up to 5 additional photos.
                    </p>

                </section>

            </div>

        </div>

    </section>

</main>


<!-- =========================
     EDIT MODAL
========================= -->

<div id="editModal" class="modal">

    <div class="modal-card">

        <h2 class="modal-title">
            Edit your Kmeet profile
        </h2>


        <div class="field">

            <label for="editName">
                Name
            </label>

            <input
                id="editName"
                type="text"
                maxlength="40">

        </div>


        <div class="field">

            <label for="editAge">
                Age
            </label>

            <input
                id="editAge"
                type="number"
                min="18"
                max="100">

        </div>


        <div class="field">

            <label for="editGender">
                Gender
            </label>

            <select id="editGender">

                <option value="">
                    Prefer not to say
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="field">

            <label for="editLocation">
                Location
            </label>

            <input
                id="editLocation"
                type="text"
                maxlength="80">

        </div>


        <div class="field">

            <label for="editBio">
                About you
            </label>

            <textarea
                id="editBio"
                maxlength="500">
            </textarea>

        </div>


        <div class="modal-actions">

            <button
                id="cancelEdit"
                class="action-btn back-btn">

                Cancel

            </button>

            <button
                id="saveEdit"
                class="action-btn chat-btn">

                Save Profile

            </button>

        </div>

    </div>

</div>


<!-- =========================
     LIGHTBOX
========================= -->

<div
    id="lightbox"
    class="lightbox">

    <button
        id="closeLightbox"
        class="close-lightbox">

        <i class="fa-solid fa-xmark"></i>

    </button>

    <img
        id="lightboxImage"
        src=""
        alt="Photo">

</div>

     FIREBASE

import {

const params =

const uploadSection =

const chatBtn =

const changePhotoBtn =

const mainPhotoInput =

const galleryUploadBtn =

const galleryInput =

/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let viewingUid = null;

let viewingOwnProfile = false;

let currentProfile = null;


/* =========================================================
   HELPERS
========================================================= */

function hideLoading(){

    loading.classList.add("hidden");

}


function showError(message){

    hideLoading();

    profileCard.classList.add("hidden");

    errorBox.style.display = "block";

    errorText.textContent =
        message;

}


function showProfile(){

    hideLoading();

    errorBox.style.display = "none";

    profileCard.classList.remove("hidden");

}


function safe(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value);

}


function firstLetter(name){

    const clean =
        safe(name).trim();

    return clean
        ? clean.charAt(0).toUpperCase()
        : "K";

}


/* =========================================================
   PHOTO URL
========================================================= */

function getPhotoUrl(data){

    return (
        data.photoURL ||
        data.profilePhoto ||
        data.photo ||
        data.avatar ||
        ""
    );

}


/* =========================================================
   RENDER MAIN PHOTO
========================================================= */

function renderMainPhoto(data){

    const photo =
        getPhotoUrl(data);

    const name =
        data.name ||
        "Kmeet Member";


    initialAvatar.textContent =
        firstLetter(name);


    if(photo){

        profilePhoto.src =
            photo;

        profilePhoto.classList.remove(
            "hidden"
        );

        initialAvatar.classList.add(
            "hidden"
        );

    }else{

        profilePhoto.removeAttribute(
            "src"
        );

        profilePhoto.classList.add(
            "hidden"
        );

        initialAvatar.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   RENDER PROFILE
========================================================= */

function renderProfile(data){

    currentProfile = data;


    const name =
        data.name ||
        "Kmeet Member";


    profileName.textContent =
        name;


    document.getElementById(
        "detailName"
    ).textContent =
        name;


    /* AGE */

    if(
        data.age !== null &&
        data.age !== undefined &&
        data.age !== ""
    ){

        profileAge.textContent =
            data.age;

        document
            .getElementById("ageWrap")
            .classList.remove("hidden");

    }else{

        document
            .getElementById("ageWrap")
            .classList.add("hidden");

    }


    /* GENDER */

    if(data.gender){

        profileGender.textContent =
            data.gender;

        document
            .getElementById("genderWrap")
            .classList.remove("hidden");

    }else{

        document
            .getElementById("genderWrap")
            .classList.add("hidden");

    }


    /* LOCATION */

    if(data.location){

        profileLocation.textContent =
            data.location;

        document
            .getElementById("locationWrap")
            .classList.remove("hidden");

        document.getElementById(
            "detailLocation"
        ).textContent =
            data.location;

    }else{

        document
            .getElementById("locationWrap")
            .classList.add("hidden");

        document.getElementById(
            "detailLocation"
        ).textContent =
            "Not specified";

    }


    /* BIO */

    if(data.bio){

        profileBio.textContent =
            data.bio;

        profileBio.classList.remove(
            "empty"
        );

    }else{

        profileBio.textContent =
            viewingOwnProfile
                ? "Tell people a little about yourself."
                : "This member hasn't added a bio yet.";

        profileBio.classList.add(
            "empty"
        );

    }


    /* MAIN PHOTO */

    renderMainPhoto(data);


    /* INTERESTS */

    interests.innerHTML = "";

    const list =
        Array.isArray(data.interests)
            ? data.interests
            : [];


    if(list.length){

        list.forEach(item => {

            const tag =
                document.createElement("span");

            tag.className =
                "interest";

            tag.textContent =
                item;

            interests.appendChild(tag);

        });

    }else{

        const empty =
            document.createElement("span");

        empty.style.color =
            "#817887";

        empty.style.fontSize =
            "13px";

        empty.textContent =
            viewingOwnProfile
                ? "No interests selected yet."
                : "No interests listed.";

        interests.appendChild(empty);

    }


    /* GALLERY */

    renderGallery(data);


    /* CONTROLS */

    if(viewingOwnProfile){

        ownPhotoActions
            .classList.remove("hidden");

        uploadSection
            .classList.remove("hidden");

        editBtn
            .classList.remove("hidden");

        chatBtn
            .classList.add("hidden");

    }else{

        ownPhotoActions
            .classList.add("hidden");

        uploadSection
            .classList.add("hidden");

        editBtn
            .classList.add("hidden");

        chatBtn
            .classList.remove("hidden");

        chatBtn.href =
            `chat.html?userId=${encodeURIComponent(viewingUid)}`;

    }

}


/* =========================================================
   GALLERY
========================================================= */

function renderGallery(data){

    gallery.innerHTML = "";


    const photos =
        Array.isArray(data.photos)
            ? data.photos.filter(Boolean)
            : [];


    if(!photos.length){

        gallerySection
            .classList.add("hidden");

        return;

    }


    gallerySection
        .classList.remove("hidden");


    photos.forEach((url,index) => {

        const item =
            document.createElement("div");

        item.className =
            "gallery-item";


        const img =
            document.createElement("img");

        img.src =
            url;

        img.alt =
            `Photo ${index + 1}`;


        img.addEventListener(
            "click",
            () => openLightbox(url)
        );


        item.appendChild(img);


        if(viewingOwnProfile){

            const remove =
                document.createElement("button");

            remove.className =
                "remove-photo";

            remove.innerHTML =
                '<i class="fa-solid fa-xmark"></i>';

            remove.title =
                "Remove photo";


            remove.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    removeGalleryPhoto(
                        index
                    );

                }
            );


            item.appendChild(remove);

        }


        gallery.appendChild(item);

    });

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

    if(!currentUser){

        showError(
            "Please log in to view profiles."
        );

        return;

    }


    /*
      THIS IS THE IMPORTANT FIX.

      If profile.html has ?id=OTHER_UID,
      load THAT user's document.

      Otherwise load the logged-in user's
      own document.
    */

    viewingUid =
        requestedUid ||
        currentUser.uid;


    viewingOwnProfile =
        viewingUid === currentUser.uid;


    console.log(
        "KMEET PROFILE:",
        {
            currentUser:
                currentUser.uid,

            requestedUid,

            viewingUid,

            viewingOwnProfile
        }
    );


    try{

        const profileRef =
            doc(
                db,
                "users",
                viewingUid
            );


        const snapshot =
            await getDoc(profileRef);


        if(!snapshot.exists()){

            showError(
                "This Kmeet profile could not be found."
            );

            return;

        }


        const data =
            snapshot.data();


        data.uid =
            viewingUid;


        renderProfile(data);

        showProfile();


    }catch(error){

        console.error(
            "Kmeet profile error:",
            error
        );


        showError(
            "Unable to load this profile. Please refresh and try again."
        );

    }

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            showError(
                "Please log in before viewing a Kmeet profile."
            );

            return;

        }


        currentUser =
            user;


        await loadProfile();

    }
);


/* =========================================================
   CLOUDINARY UPLOAD
========================================================= */

async function uploadToCloudinary(file){

    if(!file){

        throw new Error(
            "No image selected."
        );

    }


    if(
        !file.type.startsWith("image/")
    ){

        throw new Error(
            "Please select an image file."
        );

    }


    if(
        file.size > 8 * 1024 * 1024
    ){

        throw new Error(
            "Please choose an image smaller than 8MB."
        );

    }


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(
            CLOUDINARY_UPLOAD_URL,
            {
                method:"POST",
                body:formData
            }
        );


    const result =
        await response.json();


    if(
        !response.ok ||
        !result.secure_url
    ){

        console.error(
            "Cloudinary error:",
            result
        );

        throw new Error(
            "Image upload failed."
        );

    }


    return result.secure_url;

}


/* =========================================================
   MAIN PHOTO
========================================================= */

changePhotoBtn.addEventListener(
    "click",
    () => {

        mainPhotoInput.click();

    }
);


mainPhotoInput.addEventListener(
    "change",
    async () => {

        const file =
            mainPhotoInput.files[0];


        if(!file){

            return;

        }


        changePhotoBtn.disabled =
            true;

        changePhotoBtn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';


        try{

            const url =
                await uploadToCloudinary(
                    file
                );


            const userRef =
                doc(
                    db,
                    "users",
                    currentUser.uid
                );


            await setDoc(
                userRef,
                {
                    photoURL:url,
                    avatar:url,
                    photo:url,
                    profilePhoto:url
                },
                {
                    merge:true
                }
            );


            currentProfile.photoURL =
                url;

            currentProfile.avatar =
                url;

            currentProfile.photo =
                url;

            currentProfile.profilePhoto =
                url;


            renderMainPhoto(
                currentProfile
            );


            alert(
                "Profile photo updated successfully."
            );


        }catch(error){

            console.error(
                error
            );

            alert(
                error.message ||
                "Could not upload your photo."
            );

        }finally{

            changePhotoBtn.disabled =
                false;

            changePhotoBtn.innerHTML =
                '<i class="fa-solid fa-camera"></i> Change Photo';

            mainPhotoInput.value =
                "";

        }

    }
);


/* =========================================================
   GALLERY UPLOAD
========================================================= */

galleryUploadBtn.addEventListener(
    "click",
    () => {

        galleryInput.click();

    }
);


galleryInput.addEventListener(
    "change",
    async () => {

        const files =
            Array.from(
                galleryInput.files
            );


        if(!files.length){

            return;

        }


        const existing =
            Array.isArray(
                currentProfile.photos
            )
                ? currentProfile.photos
                : [];


        if(
            existing.length + files.length >
            5
        ){

            alert(
                `You can have a maximum of 5 additional photos. You currently have ${existing.length}.`
            );

            galleryInput.value =
                "";

            return;

        }


        galleryUploadBtn.disabled =
            true;

        galleryUploadBtn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';


        try{

            const uploaded = [];


            for(
                const file of files
            ){

                const url =
                    await uploadToCloudinary(
                        file
                    );

                uploaded.push(url);

            }


            const updatedPhotos =
                [
                    ...existing,
                    ...uploaded
                ];


            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {
                    photos:
                        updatedPhotos
                },
                {
                    merge:true
                }
            );


            currentProfile.photos =
                updatedPhotos;


            renderGallery(
                currentProfile
            );


            alert(
                "Photos added successfully."
            );


        }catch(error){

            console.error(
                error
            );

            alert(
                error.message ||
                "Could not upload the photos."
            );

        }finally{

            galleryUploadBtn.disabled =
                false;

            galleryUploadBtn.innerHTML =
                '<i class="fa-solid fa-images"></i> Add Photos';

            galleryInput.value =
                "";

        }

    }
);


/* =========================================================
   REMOVE GALLERY PHOTO
========================================================= */

async function removeGalleryPhoto(index){

    if(!viewingOwnProfile){

        return;

    }


    const photos =
        Array.isArray(
            currentProfile.photos
        )
            ? [...currentProfile.photos]
            : [];


    if(
        index < 0 ||
        index >= photos.length
    ){

        return;

    }


    if(
        !confirm(
            "Remove this photo from your profile?"
        )
    ){

        return;

    }


    photos.splice(
        index,
        1
    );


    try{

        await setDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                photos
            },
            {
                merge:true
            }
        );


        currentProfile.photos =
            photos;


        renderGallery(
            currentProfile
        );


    }catch(error){

        console.error(
            error
        );

        alert(
            "Could not remove the photo."
        );

    }

}

/* =========================================================
   SAVE PROFILE
========================================================= */

saveEdit.addEventListener(
    "click",
    async () => {

        const name =
            document.getElementById(
                "editName"
            ).value.trim();


        const age =
            document.getElementById(
                "editAge"
            ).value;


        const gender =
            document.getElementById(
                "editGender"
            ).value;


        const location =
            document.getElementById(
                "editLocation"
            ).value.trim();


        const bio =
            document.getElementById(
                "editBio"
            ).value.trim();


        if(!name){

            alert(
                "Please enter your name."
            );

            return;

        }


        if(
            age &&
            (
                Number(age) < 18 ||
                Number(age) > 100
            )
        ){

            alert(
                "Age must be between 18 and 100."
            );

            return;

        }


        saveEdit.disabled =
            true;

        saveEdit.textContent =
            "Saving...";


        try{

            const updated = {

                ...currentProfile,

                name,

                age:
                    age
                        ? Number(age)
                        : null,

                gender,

                location,

                bio

            };


            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {
                    name,
                    age:
                        age
                            ? Number(age)
                            : null,
                    gender,
                    location,
                    bio
                },
                {
                    merge:true
                }
            );


            await updateProfile(
                currentUser,
                {
                    displayName:name
                }
            );


            currentProfile =
                updated;


            renderProfile(
                currentProfile
            );


            editModal.classList.remove(
                "show"
            );


        }catch(error){

            console.error(
                error
            );

            alert(
                "Could not save your profile."
            );

        }finally{

            saveEdit.disabled =
                false;

            saveEdit.textContent =
                "Save Profile";

        }

    }
);


/* =========================================================
   LIGHTBOX
========================================================= */

const lightbox =
    document.getElementById(
        "lightbox"
    );

const lightboxImage =
    document.getElementById(
        "lightboxImage"
    );

const closeLightbox =
    document.getElementById(
        "closeLightbox"
    );


function openLightbox(url){

    lightboxImage.src =
        url;

    lightbox.classList.add(
        "show"
    );

}


closeLightbox.addEventListener(
    "click",
    () => {

        lightbox.classList.remove(
            "show"
        );

        lightboxImage.src =
            "";

    }
);


lightbox.addEventListener(
    "click",
    event => {

        if(
            event.target === lightbox
        ){

            lightbox.classList.remove(
                "show"
            );

            lightboxImage.src =
                "";

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            lightbox.classList.remove(
                "show"
            );

            editModal.classList.remove(
                "show"
            );

        }

    }
);
