<style>

<script type="module">
import {
  auth, db, onAuthStateChanged, doc, getDoc, setDoc, deleteDoc,
  deleteUser, EmailAuthProvider, reauthenticateWithCredential
} from "./firebase-config.js";

import {getApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase, ref, onValue, onDisconnect, set, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
  collection, onSnapshot, query, where, orderBy, limit
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

/* =========================================
   ELEMENTS AND FIREBASE
========================================= */

const realtimeDB = getDatabase(getApp());

const loading = document.getElementById("loading");
const profileCard = document.getElementById("profileCard");
const errorCard = document.getElementById("errorCard");
const mainPhoto = document.getElementById("mainPhoto");
const initial = document.getElementById("initial");
const profileName = document.getElementById("profileName");
const profileLocation = document.getElementById("profileLocation");
const locationDetail = document.getElementById("locationDetail");
const age = document.getElementById("age");
const gender = document.getElementById("gender");
const bio = document.getElementById("bio");
const interests = document.getElementById("interests");
const gallery = document.getElementById("gallery");
const galleryCount = document.getElementById("galleryCount");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const closeLightbox = document.getElementById("closeLightbox");
const editButton = document.getElementById("editButton");
const inboxButton = document.getElementById("inboxButton");
const chatButton = document.getElementById("chatButton");
const navMessages = document.getElementById("navMessages");
const navMessageBadge = document.getElementById("navMessageBadge");
const inboxMessageBadge = document.getElementById("inboxMessageBadge");
const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const deleteAccountArea = document.getElementById("deleteAccountArea");
const deleteAccountButton = document.getElementById("deleteAccountButton");

const urlParams = new URLSearchParams(window.location.search);
const requestedProfileId = urlParams.get("id");

const ROTATION_TIME = 24 * 60 * 60 * 1000;
const READS_KEY = "kmeet_message_reads_v1";

let presenceUnsubscribe = null;

/* =========================================
   LIVE UNREAD MESSAGE COUNTER
   Matches Discover's read-marker approach.
========================================= */

let conversationQueryUnsubscribers = [];
const messageUnsubscribers = new Map();
const watchedConversationIds = new Map();
const latestMessagesByConversation = new Map();
const conversationQueryResults = {
  receiver: new Map(),
  initiator: new Map()
};

let counterUserId = null;
let counterStarted = false;

function getReads() {
  try {
    return JSON.parse(localStorage.getItem(READS_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveReads(reads) {
  try {
    localStorage.setItem(READS_KEY, JSON.stringify(reads));
  } catch (error) {
    console.warn("Could not save message read markers:", error);
  }
}

function timestampValue(value) {
  if (!value) return 0;
  if (typeof value === "number") return value;

  if (typeof value.toMillis === "function") {
    try { return value.toMillis(); } catch {}
  }

  if (typeof value.seconds === "number") {
    return value.seconds * 1000;
  }

  if (value instanceof Date) return value.getTime();

  const parsed = new Date(value).getTime();
  return Number.isFinite(parsed) ? parsed : 0;
}

function getMessageSenderId(message) {
  return message.senderId ||
    message.fromId ||
    message.sender ||
    message.uid ||
    message.senderUid ||
    message.fromUid ||
    "";
}

function setUnreadBadges(count) {
  const safeCount = Math.max(0, Number(count) || 0);

  [navMessageBadge, inboxMessageBadge].forEach(badge => {
    if (!badge) return;

    badge.textContent = safeCount > 99 ? "99+" : String(safeCount);
    badge.classList.toggle("has-unread", safeCount > 0);
    badge.setAttribute("aria-label", `${safeCount} unread conversations`);
  });
}

function updateUnreadCounter() {
  const user = auth.currentUser;

  if (!user || user.isAnonymous || user.uid !== counterUserId) {
    setUnreadBadges(0);
    return;
  }

  const reads = getReads();
  let unread = 0;

  latestMessagesByConversation.forEach(message => {
    if (!message) return;
    if (!message.senderId || message.senderId === user.uid) return;
    if (!message.createdAt) return;

    const lastRead = Number(reads[message.conversationId] || 0);

    if (message.createdAt > lastRead) unread++;
  });

  setUnreadBadges(unread);
}

function stopUnreadCounter() {
  conversationQueryUnsubscribers.forEach(unsubscribe => {
    try { unsubscribe(); } catch {}
  });
  conversationQueryUnsubscribers = [];

  for (const unsubscribe of messageUnsubscribers.values()) {
    try { unsubscribe(); } catch {}
  }

  messageUnsubscribers.clear();
  watchedConversationIds.clear();
  latestMessagesByConversation.clear();
  conversationQueryResults.receiver.clear();
  conversationQueryResults.initiator.clear();

  counterUserId = null;
  counterStarted = false;
  setUnreadBadges(0);
}

function conversationIdFromDocument(conversationDoc) {
  const data = conversationDoc.data() || {};
  return data.conversationId || data.id || conversationDoc.id;
}

function syncConversationListeners() {
  const merged = new Map([
    ...conversationQueryResults.receiver,
    ...conversationQueryResults.initiator
  ]);

  for (const [documentId, unsubscribe] of [...messageUnsubscribers.entries()]) {
    if (merged.has(documentId)) continue;

    try { unsubscribe(); } catch {}
    messageUnsubscribers.delete(documentId);

    const oldId = watchedConversationIds.get(documentId);
    watchedConversationIds.delete(documentId);

    if (oldId) latestMessagesByConversation.delete(oldId);
  }

  for (const [documentId, conversationDoc] of merged) {
    const conversationId = conversationIdFromDocument(conversationDoc);

    if (
      messageUnsubscribers.has(documentId) &&
      watchedConversationIds.get(documentId) === conversationId
    ) {
      continue;
    }

    if (messageUnsubscribers.has(documentId)) {
      try { messageUnsubscribers.get(documentId)(); } catch {}
      messageUnsubscribers.delete(documentId);

      const oldId = watchedConversationIds.get(documentId);
      if (oldId) latestMessagesByConversation.delete(oldId);
    }

    watchedConversationIds.set(documentId, conversationId);

    try {
      const latestMessageQuery = query(
        collection(db, "conversations", conversationId, "messages"),
        orderBy("createdAt", "desc"),
        limit(1)
      );

      const unsubscribe = onSnapshot(
        latestMessageQuery,
        snapshot => {
          const user = auth.currentUser;

          if (!user || user.isAnonymous || user.uid !== counterUserId) return;

          if (snapshot.empty) {
            latestMessagesByConversation.delete(conversationId);
            updateUnreadCounter();
            return;
          }

          const messageDoc = snapshot.docs[0];
          const message = messageDoc.data() || {};
          const senderId = getMessageSenderId(message);
          const createdAt = timestampValue(message.createdAt);

          if (!senderId) {
            latestMessagesByConversation.delete(conversationId);
            updateUnreadCounter();
            return;
          }

          if (senderId === user.uid) {
            if (createdAt) {
              const reads = getReads();
              reads[conversationId] = Math.max(
                Number(reads[conversationId] || 0),
                createdAt
              );
              saveReads(reads);
            }

            latestMessagesByConversation.delete(conversationId);
            updateUnreadCounter();
            return;
          }

          latestMessagesByConversation.set(conversationId, {
            conversationId,
            senderId,
            createdAt,
            messageId: messageDoc.id
          });

          updateUnreadCounter();
        },
        error => {
          console.warn(
            "Could not listen for unread messages in conversation:",
            conversationId,
            error
          );
        }
      );

      messageUnsubscribers.set(documentId, unsubscribe);
    } catch (error) {
      console.warn("Could not start message listener:", error);
    }
  }

  updateUnreadCounter();
}

function startUnreadCounter(user) {
  if (!user || user.isAnonymous) {
    stopUnreadCounter();
    return;
  }

  if (counterStarted && counterUserId === user.uid) return;

  stopUnreadCounter();

  counterStarted = true;
  counterUserId = user.uid;

  function listenToConversations(role, field) {
    const conversationsQuery = query(
      collection(db, "conversations"),
      where(field, "==", user.uid)
    );

    const unsubscribe = onSnapshot(
      conversationsQuery,
      snapshot => {
        conversationQueryResults[role].clear();

        snapshot.docs.forEach(conversationDoc => {
          conversationQueryResults[role].set(
            conversationDoc.id,
            conversationDoc
          );
        });

        syncConversationListeners();
      },
      error => {
        console.warn(`Could not monitor ${role} conversations:`, error);
      }
    );

    conversationQueryUnsubscribers.push(unsubscribe);
  }

  // A member can be either the receiver or the initiator.
  listenToConversations("receiver", "receiverId");
  listenToConversations("initiator", "initiatorId");
}

/* =========================================
   PROFILE PHOTOS AND ROTATION
========================================= */

function getPhotoURL(data) {
  return data.photoURL || data.profilePhoto || data.photo ||
    data.avatar || data.profileImage || data.image || "";
}

function getGallery(data, currentPhoto) {
  let photos = Array.isArray(data.photoGallery)
    ? [...data.photoGallery]
    : [];

  photos = photos.filter(
    photo => typeof photo === "string" && photo.trim() !== ""
  );

  photos = [...new Set(photos)];

  if (currentPhoto && !photos.includes(currentPhoto)) {
    photos.unshift(currentPhoto);
  }

  return photos;
}

async function rotatePhotoIfNeeded(uid, data, currentPhoto, photos) {
  if (photos.length < 2) return currentPhoto;

  const lastRotation = timestampValue(data.photoRotationAt);

  if (!lastRotation) {
    await setDoc(doc(db, "users", uid), {
      photoRotationAt: new Date(),
      photoRotationIndex: Math.max(0, photos.indexOf(currentPhoto))
    }, { merge: true });

    return currentPhoto;
  }

  if (Date.now() - lastRotation < ROTATION_TIME) {
    return currentPhoto;
  }

  let currentIndex = photos.indexOf(currentPhoto);
  if (currentIndex < 0) currentIndex = 0;

  const nextIndex = (currentIndex + 1) % photos.length;
  const nextPhoto = photos[nextIndex];

  await setDoc(doc(db, "users", uid), {
    photoURL: nextPhoto,
    photoRotationAt: new Date(),
    photoRotationIndex: nextIndex,
    photoGallery: photos
  }, { merge: true });

  return nextPhoto;
}

function showPhoto(url, name) {
  if (url) {
    mainPhoto.onerror = () => {
      mainPhoto.onerror = null;
      mainPhoto.style.display = "none";
      initial.textContent = (name || "K").trim().charAt(0).toUpperCase();
      initial.style.display = "block";
    };

    mainPhoto.src = url;
    mainPhoto.style.display = "block";
    initial.style.display = "none";
  } else {
    mainPhoto.removeAttribute("src");
    mainPhoto.style.display = "none";
    initial.textContent = (name || "K").trim().charAt(0).toUpperCase();
    initial.style.display = "block";
  }
}

/* =========================================
   INTERESTS AND GALLERY
========================================= */

function showInterests(list) {
  interests.innerHTML = "";

  if (!Array.isArray(list) || !list.length) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "Still discovering interests";
    interests.appendChild(tag);
    return;
  }

  list.forEach(item => {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = String(item);
    interests.appendChild(tag);
  });
}

function showGallery(photos, currentPhoto, isOwner) {
  gallery.innerHTML = "";

  galleryCount.textContent =
    `${photos.length} photo${photos.length === 1 ? "" : "s"}`;

  if (!photos.length) {
    const empty = document.createElement("div");
    empty.className = "empty-gallery";
    empty.textContent = isOwner
      ? "Your photo gallery is empty. Add photos from Edit Profile."
      : "No photos have been added yet.";

    gallery.appendChild(empty);
    return;
  }

  photos.forEach((photo, index) => {
    const item = document.createElement("div");
    item.className = "gallery-item";

    const image = document.createElement("img");
    image.src = photo;
    image.alt = `Gallery photo ${index + 1}`;
    image.loading = "lazy";
    image.onerror = () => { item.style.display = "none"; };

    item.appendChild(image);

    if (isOwner && photo === currentPhoto) {
      const current = document.createElement("div");
      current.className = "gallery-current";
      current.textContent = "Current";
      item.appendChild(current);
    }

    item.addEventListener("click", () => {
      lightboxImage.src = photo;
      lightbox.classList.add("show");
    });

    gallery.appendChild(item);
  });
}

/* =========================================
   REALTIME PRESENCE
========================================= */

async function startOwnPresence(user) {
  if (!user || user.isAnonymous) return;

  try {
    const presenceRef = ref(realtimeDB, `status/${user.uid}`);

    await onDisconnect(presenceRef).set({
      state: "offline",
      lastChanged: serverTimestamp()
    });

    await set(presenceRef, {
      state: "online",
      lastChanged: serverTimestamp()
    });

    console.log("Kmeet presence ONLINE:", user.uid);
  } catch (error) {
    console.error("Kmeet presence error:", error);
  }
}

function stopPresenceListener() {
  if (typeof presenceUnsubscribe === "function") {
    presenceUnsubscribe();
    presenceUnsubscribe = null;
  }
}

function watchProfilePresence(profileId) {
  stopPresenceListener();

  if (!profileId) {
    statusText.textContent = "Offline";
    statusDot.style.background = "#777";
    statusDot.style.boxShadow = "none";
    return;
  }

  const profilePresenceRef = ref(realtimeDB, `status/${profileId}`);

  presenceUnsubscribe = onValue(
    profilePresenceRef,
    snapshot => {
      const presence = snapshot.val();
      const online = !!presence && presence.state === "online";

      statusText.textContent = online ? "Online" : "Offline";
      statusText.style.color = online
        ? "#9df0c4"
        : "rgba(255,255,255,.48)";

      statusDot.style.background = online ? "#55dc93" : "#777";
      statusDot.style.boxShadow = online
        ? "0 0 10px rgba(85,220,147,.7)"
        : "none";
    },
    error => {
      console.error("Presence listener error:", error);
      statusText.textContent = "Offline";
      statusText.style.color = "rgba(255,255,255,.48)";
      statusDot.style.background = "#777";
      statusDot.style.boxShadow = "none";
    }
  );
}

/* =========================================
   DELETE ACCOUNT
========================================= */

async function deleteMyAccount() {
  const user = auth.currentUser;

  if (!user) {
    alert("You must be logged in to delete your account.");
    return;
  }

  if (user.isAnonymous) {
    alert("Anonymous accounts cannot use this account deletion option.");
    return;
  }

  if (!confirm(
    "Are you sure you want to permanently delete your Kmeet account?\n\n" +
    "Your profile will be removed from Discover and your Kmeet login will be deleted.\n\n" +
    "This action cannot be undone."
  )) return;

  if (!user.email) {
    alert("This account does not have an email/password login.");
    return;
  }

  const password = prompt(
    "For security, enter your current Kmeet password to continue:"
  );

  if (password === null) return;

  if (!password.trim()) {
    alert("Please enter your current password.");
    return;
  }

  const originalText = deleteAccountButton.textContent;
  deleteAccountButton.disabled = true;
  deleteAccountButton.textContent = "Deleting account...";

  try {
    const credential = EmailAuthProvider.credential(user.email, password);
    await reauthenticateWithCredential(user, credential);

    try {
      await set(ref(realtimeDB, `status/${user.uid}`), {
        state: "offline",
        lastChanged: serverTimestamp()
      });
    } catch (presenceError) {
      console.warn("Could not update presence:", presenceError);
    }

    await deleteDoc(doc(db, "users", user.uid));
    await deleteUser(user);

    alert("Your Kmeet account has been deleted successfully.");
    window.location.href = "index.html";
  } catch (error) {
    console.error("Kmeet account deletion error:", error);

    deleteAccountButton.disabled = false;
    deleteAccountButton.textContent = originalText;

    if (
      error.code === "auth/wrong-password" ||
      error.code === "auth/invalid-credential"
    ) {
      alert("The password could not be verified. Your account was not deleted.");
      return;
    }

    if (error.code === "auth/requires-recent-login") {
      alert("Firebase requires a recent login. Please log out, log in again, and try once more.");
      return;
    }

    if (error.code === "auth/too-many-requests") {
      alert("There have been too many attempts. Please wait and try again.");
      return;
    }

    if (
      error.code === "permission-denied" ||
      error.code === "firestore/permission-denied"
    ) {
      alert("Kmeet could not remove your profile from the database. Your account was not deleted.");
      return;
    }

    alert("We could not complete the account deletion. Please try again.");
  }
}

deleteAccountButton.addEventListener("click", deleteMyAccount);

/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(profileId, loggedInUser) {
  try {
    const snapshot = await getDoc(doc(db, "users", profileId));

    if (!snapshot.exists()) {
      throw new Error("This Kmeet profile could not be found.");
    }

    const data = snapshot.data();
    const isOwner = !!loggedInUser &&
      !loggedInUser.isAnonymous &&
      profileId === loggedInUser.uid;

    let currentPhoto = getPhotoURL(data);
    let photos = getGallery(data, currentPhoto);

    if (isOwner) {
      currentPhoto = await rotatePhotoIfNeeded(
        profileId, data, currentPhoto, photos
      );
    }

    if (currentPhoto && !photos.includes(currentPhoto)) {
      photos.unshift(currentPhoto);
    }

    const name = data.name || data.username ||
      data.displayName || "Kmeet Member";

    profileName.textContent = name;

    const location = data.location || data.city || "Kenya";
    profileLocation.textContent = "📍 " + location;
    locationDetail.textContent = location;
    age.textContent = data.age ? data.age : "Not provided";
    gender.textContent = data.gender || "Not provided";
    bio.textContent = data.bio || data.description ||
      data.about || data.intro || "Connecting hearts naturally.";

    showPhoto(currentPhoto, name);
    showInterests(data.interests);
    showGallery(photos, currentPhoto, isOwner);

    if (isOwner) {
      editButton.style.display = "inline-flex";
      inboxButton.style.display = "inline-flex";
      navMessages.style.display = "inline-block";
      chatButton.style.display = "none";
      deleteAccountArea.style.display = "block";
      updateUnreadCounter();
    } else {
      editButton.style.display = "none";
      inboxButton.style.display = "none";
      navMessages.style.display = "none";
      chatButton.href = `chat.html?userId=${encodeURIComponent(profileId)}`;
      chatButton.style.display = "inline-flex";
      deleteAccountArea.style.display = "none";
    }

    watchProfilePresence(profileId);

    loading.style.display = "none";
    profileCard.style.display = "block";
  } catch (error) {
    console.error("Profile error:", error);

    loading.style.display = "none";
    profileCard.style.display = "none";
    errorCard.style.display = "block";
    errorCard.textContent = error.message ||
      "We could not load this profile.";
  }
}

/* =========================================
   LIGHTBOX
========================================= */

function closePhotoLightbox() {
  lightbox.classList.remove("show");
  lightboxImage.removeAttribute("src");
}

closeLightbox.addEventListener("click", closePhotoLightbox);

lightbox.addEventListener("click", event => {
  if (event.target === lightbox) closePhotoLightbox();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePhotoLightbox();
});

/* =========================================
   AUTHENTICATION
========================================= */

onAuthStateChanged(auth, async user => {
  try {
    if (user && !user.isAnonymous) {
      startUnreadCounter(user);
      await startOwnPresence(user);
    } else {
      stopUnreadCounter();
    }

    if (requestedProfileId) {
      await loadProfile(requestedProfileId, user);
      return;
    }

    if (!user || user.isAnonymous) {
      window.location.href = "login.html";
      return;
    }

    await loadProfile(user.uid, user);
  } catch (error) {
    console.error("Profile loading error:", error);
  }
});

/* =========================================
   CLEANUP
========================================= */

window.addEventListener("beforeunload", () => {
  stopPresenceListener();
  stopUnreadCounter();
});
</script>
