<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Brings You Joy? - Kmeet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(224,122,95,.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(140,80,160,.12), transparent 35%),
                #121016;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px;
            animation: fadeIn .5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .onboarding-container {
            width: 100%;
            max-width: 460px;
        }

        /* TOP BAR */

        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa4aa;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.08);
            text-decoration: none;
            transition: .2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            color: #fff;
            background: rgba(255,255,255,.1);
        }

        .progress-bar-container {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .progress-step {
            height: 4px;
            flex: 1;
            background: rgba(255,255,255,.13);
            border-radius: 10px;
        }

        .progress-step.completed,
        .progress-step.active {
            background: #e07a5f;
        }

        /* HEADER */

        .onboarding-header {
            text-align: center;
            margin-bottom: 27px;
        }

        .brand-small {
            color: #e07a5f;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .onboarding-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 500;
            color: #fff4f0;
            margin-bottom: 9px;
        }

        .onboarding-header p {
            font-size: 13px;
            color: #a9a3a9;
            line-height: 1.6;
            font-weight: 300;
            padding: 0 10px;
        }

        .selection-count {
            margin-top: 12px;
            font-size: 12px;
            color: #8f898f;
        }

        .selection-count strong {
            color: #e07a5f;
        }

        /* INTERESTS */

        .interests-form {
            width: 100%;
        }

        .interests-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .interest-card {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .interest-card input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .card-content {
            min-height: 100px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 15px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 9px;
            transition: all .22s ease;
        }

        .card-content i {
            font-size: 22px;
            color: #aaa3aa;
            transition: .22s ease;
        }

        .card-content span {
            font-size: 12px;
            color: #d6d0d6;
            font-weight: 400;
        }

        .interest-card:hover .card-content {
            transform: translateY(-2px);
            background: rgba(255,255,255,.075);
            border-color: rgba(255,255,255,.2);
        }

        /* SELECTED */

        .interest-card input:checked + .card-content {
            background: linear-gradient(
                145deg,
                rgba(224,122,95,.22),
                rgba(224,122,95,.08)
            );
            border-color: #e07a5f;
            box-shadow: 0 0 0 1px rgba(224,122,95,.08),
                        0 8px 25px rgba(224,122,95,.08);
            transform: translateY(-2px);
        }

        .interest-card input:checked + .card-content i {
            color: #e07a5f;
            transform: scale(1.1);
        }

        .interest-card input:checked + .card-content span {
            color: #fff;
            font-weight: 500;
        }

        /* CHECK MARK */

        .check-mark {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e07a5f;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            opacity: 0;
            transform: scale(.7);
            transition: .2s;
        }

        .interest-card input:checked ~ .check-mark {
            opacity: 1;
            transform: scale(1);
        }

        /* BUTTON */

        .footer-action {
            width: 100%;
        }

        .btn-continue {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(255,255,255,.09);
            border: 1px solid rgba(255,255,255,.08);
            color: #777277;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: not-allowed;
            transition: all .25s ease;
        }

        .btn-continue.ready {
            background: linear-gradient(135deg, #e07a5f, #d8654b);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(224,122,95,.2);
        }

        .btn-continue.ready:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(224,122,95,.3);
        }

        .btn-continue:active {
            transform: scale(.98);
        }

        .error-message {
            display: none;
            text-align: center;
            color: #ff9c9c;
            font-size: 12px;
            margin-bottom: 14px;
        }

        /* MOBILE */

        @media (max-width: 420px) {
            body {
                padding: 18px;
                align-items: flex-start;
                padding-top: 30px;
            }

            .onboarding-header h1 {
                font-size: 27px;
            }

            .interests-grid {
                gap: 9px;
            }

            .card-content {
                min-height: 92px;
                padding: 15px 10px;
            }
        }
    </style>
</head>

<body>

<main class="onboarding-container">

    <!-- TOP BAR -->
    <div class="top-bar">

        <a href="index.html" class="back-btn" aria-label="Go back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="progress-bar-container">
            <div class="progress-step completed"></div>
            <div class="progress-step active"></div>
            <div class="progress-step"></div>
            <div class="progress-step"></div>
            <div class="progress-step"></div>
        </div>

    </div>


    <!-- HEADER -->
    <div class="onboarding-header">

        <div class="brand-small">Kmeet</div>

        <h1>What brings you joy?</h1>

        <p>
            Choose the things you enjoy. We'll use them to help
            personalize your Kmeet experience.
        </p>

        <div class="selection-count">
            <strong id="count">0</strong> of 5 interests selected
        </div>

    </div>


    <!-- INTEREST FORM -->
    <form id="interestsForm" class="interests-form">

        <div class="interests-grid">

            <label class="interest-card">
                <input type="checkbox" name="interests" value="music">
                <div class="card-content">
                    <i class="fa-solid fa-headphones"></i>
                    <span>Music</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="movies">
                <div class="card-content">
                    <i class="fa-solid fa-film"></i>
                    <span>Movies</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="travel">
                <div class="card-content">
                    <i class="fa-solid fa-plane"></i>
                    <span>Travel</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="fitness">
                <div class="card-content">
                    <i class="fa-solid fa-dumbbell"></i>
                    <span>Fitness</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="cooking">
                <div class="card-content">
                    <i class="fa-solid fa-utensils"></i>
                    <span>Cooking</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="art">
                <div class="card-content">
                    <i class="fa-solid fa-palette"></i>
                    <span>Art</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="reading">
                <div class="card-content">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Reading</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="photography">
                <div class="card-content">
                    <i class="fa-solid fa-camera"></i>
                    <span>Photography</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="gaming">
                <div class="card-content">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>Gaming</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>


            <label class="interest-card">
                <input type="checkbox" name="interests" value="nature">
                <div class="card-content">
                    <i class="fa-solid fa-tree"></i>
                    <span>Nature</span>
                </div>
                <div class="check-mark">
                    <i class="fa-solid fa-check"></i>
                </div>
            </label>

        </div>


        <div id="errorMessage" class="error-message">
            Please select at least one interest.
        </div>


        <div class="footer-action">
            <button type="submit" id="continueBtn" class="btn-continue">
                Continue
            </button>
        </div>

    </form>

</main>


<script>

    const form = document.getElementById("interestsForm");
    const checkboxes = document.querySelectorAll(
        'input[name="interests"]'
    );

    const continueBtn = document.getElementById("continueBtn");
    const countDisplay = document.getElementById("count");
    const errorMessage = document.getElementById("errorMessage");


    /* UPDATE SELECTION */

    function updateSelection() {

        const selected = document.querySelectorAll(
            'input[name="interests"]:checked'
        );

        const count = selected.length;

        countDisplay.textContent = count;


        if (count > 0) {

            continueBtn.classList.add("ready");
            continueBtn.disabled = false;
            errorMessage.style.display = "none";

        } else {

            continueBtn.classList.remove("ready");
            continueBtn.disabled = true;

        }

    }


    /* CHECKBOX EVENTS */

    checkboxes.forEach(function(checkbox) {

        checkbox.addEventListener("change", function() {

            const selected = document.querySelectorAll(
                'input[name="interests"]:checked'
            );

            if (selected.length > 5) {

                checkbox.checked = false;

                alert("You can select up to 5 interests.");

            }

            updateSelection();

        });

    });


    /* FORM SUBMIT */

    form.addEventListener("submit", function(event) {

        event.preventDefault();


        const selectedInterests = Array.from(
            document.querySelectorAll(
                'input[name="interests"]:checked'
            )
        ).map(function(checkbox) {

            return checkbox.value;

        });


        if (selectedInterests.length === 0) {

            errorMessage.style.display = "block";
            return;

        }


        /*
         * IMPORTANT:
         *
         * Signup.html expects the interests in
         * sessionStorage under "pendingInterests".
         *
         * Your previous onboarding page only saved
         * "userInterests" to localStorage.
         *
         * We now save BOTH so the rest of your Kmeet
         * pages continue working.
         */


        sessionStorage.setItem(
            "pendingInterests",
            JSON.stringify(selectedInterests)
        );


        localStorage.setItem(
            "userInterests",
            JSON.stringify(selectedInterests)
        );


        /*
         * Continue through your existing Kmeet flow.
         */
        window.location.href = "photos-upload.html";

    });


    /* INITIAL STATE */

    updateSelection();

</script>

</body>
</html>
