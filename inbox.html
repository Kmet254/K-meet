<script type="module">
import {
    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    collection
} from "./firebase-config.js";

import {
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================================================
   ELEMENTS
========================================================= */

const statusEl =
    document.getElementById("status");

const listEl =
    document.getElementById("conversationList");


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let presenceDb = null;
let presenceListener = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, isError = false) {

    if (!statusEl) return;

    statusEl.textContent = message;

    statusEl.classList.toggle(
        "error",
        isError
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   GET OTHER USER
   IMPORTANT:
   DO NOT split conversation IDs.

   New IDs look like:

   kmeet_v2_UID1_UID2

   We use Firestore participant fields instead.
========================================================= */

function getOtherUserId(conversation) {

    if (!conversation || !currentUser) {
        return null;
    }


    if (
        conversation.initiatorId ===
        currentUser.uid
    ) {

        return conversation.receiverId || null;
    }


    if (
        conversation.receiverId ===
        currentUser.uid
    ) {

        return conversation.initiatorId || null;
    }


    return null;
}


/* =========================================================
   VALIDATE CONVERSATION
========================================================= */

function isValidConversation(conversation) {

    if (!conversation || !currentUser) {
        return false;
    }


    const initiator =
        conversation.initiatorId;

    const receiver =
        conversation.receiverId;


    if (
        typeof initiator !== "string" ||
        typeof receiver !== "string"
    ) {

        return false;
    }


    if (
        !initiator ||
        !receiver ||
        initiator === receiver
    ) {

        return false;
    }


    return (
        initiator === currentUser.uid ||
        receiver === currentUser.uid
    );
}


/* =========================================================
   FORMAT DATE / TIME
========================================================= */

function formatTime(timestamp) {

    if (!timestamp) {
        return "";
    }


    let date = null;


    if (
        timestamp &&
        typeof timestamp.toDate === "function"
    ) {

        date = timestamp.toDate();

    } else if (
        timestamp instanceof Date
    ) {

        date = timestamp;

    } else if (
        typeof timestamp.seconds === "number"
    ) {

        date =
            new Date(
                timestamp.seconds * 1000
            );
    }


    if (
        !date ||
        Number.isNaN(date.getTime())
    ) {

        return "";
    }


    const now = new Date();


    const sameDay =
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate();


    if (sameDay) {

        return date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );
    }


    return date.toLocaleDateString(
        [],
        {
            day: "numeric",
            month: "short"
        }
    );
}


/* =========================================================
   LOAD USER PROFILE
========================================================= */

async function getUserProfile(uid) {

    if (!uid) {
        return null;
    }


    try {

        const snap =
            await getDoc(
                doc(db, "users", uid)
            );


        if (!snap.exists()) {

            return {
                uid,
                displayName: "Kmeet member",
                photoURL: ""
            };
        }


        return {
            uid,
            ...snap.data()
        };


    } catch (error) {

        console.warn(
            "Could not load user profile:",
            uid,
            error
        );


        return {
            uid,
            displayName: "Kmeet member",
            photoURL: ""
        };
    }
}


/* =========================================================
   GET LATEST MESSAGE
========================================================= */

async function getLatestMessage(
    conversationId
) {

    try {

        const messagesRef =
            collection(
                db,
                "conversations",
                conversationId,
                "messages"
            );


        const snapshot =
            await getDocs(messagesRef);


        if (snapshot.empty) {
            return null;
        }


        const messages =
            snapshot.docs.map(item => ({
                id: item.id,
                ...item.data()
            }));


        messages.sort((a, b) => {

            const aTime =
                a.createdAt?.seconds || 0;

            const bTime =
                b.createdAt?.seconds || 0;

            return bTime - aTime;
        });


        return messages[0] || null;


    } catch (error) {

        /*
         * Do not allow one corrupted/old
         * conversation to destroy the entire Inbox.
         */

        console.warn(
            "Could not read messages:",
            conversationId,
            error
        );

        return null;
    }
}


/* =========================================================
   EMPTY INBOX
========================================================= */

function renderEmpty() {

    if (!listEl) return;


    listEl.innerHTML = `

        <div class="empty-state">

            <div class="empty-icon">
                💌
            </div>

            <h3>
                No conversations yet
            </h3>

            <p>
                Start a conversation from
                Discover and it will appear here.
            </p>

        </div>

    `;
}


/* =========================================================
   CREATE CONVERSATION ROW
========================================================= */

async function createConversationRow(
    conversation,
    latestMessage
) {

    const otherUid =
        getOtherUserId(conversation);


    if (!otherUid) {
        return null;
    }


    const profile =
        await getUserProfile(otherUid);


    const displayName =
        profile?.displayName ||
        profile?.name ||
        profile?.username ||
        "Kmeet member";


    const photo =
        profile?.photoURL ||
        profile?.profilePhoto ||
        profile?.photo ||
        "kmeet-logo.jfif.jfif";


    let preview =
        "No messages yet.";


    if (latestMessage) {

        const messageText =
            latestMessage.text ||
            latestMessage.message ||
            "Message";


        if (
            latestMessage.senderId ===
            currentUser.uid
        ) {

            preview =
                "You: " + messageText;

        } else {

            preview =
                messageText;
        }
    }


    const time =
        latestMessage
            ? formatTime(
                latestMessage.createdAt
            )
            : "";


    const href =
        "chat.html?userId=" +
        encodeURIComponent(otherUid);


    const row =
        document.createElement("a");


    /*
     * Keep compatibility with the
     * existing Inbox design.
     */

    row.className =
        "conversation-row";


    row.href = href;


    row.innerHTML = `

        <img
            class="conversation-avatar"
            src="${escapeHtml(photo)}"
            alt="${escapeHtml(displayName)}"
            loading="lazy"
            onerror="
                this.onerror=null;
                this.src='kmeet-logo.jfif.jfif';
            "
        >

        <div class="conversation-info">

            <div class="conversation-name">

                ${escapeHtml(displayName)}

            </div>


            <div class="conversation-preview">

                ${escapeHtml(preview)}

            </div>

        </div>


        <div class="conversation-time">

            ${escapeHtml(time)}

        </div>

    `;


    return row;
}


/* =========================================================
   LOAD INBOX
========================================================= */

async function loadInbox() {

    if (!currentUser) {
        return;
    }


    setStatus(
        "Loading your conversations..."
    );


    if (listEl) {
        listEl.innerHTML = "";
    }


    const conversationMap =
        new Map();


    /* =====================================================
       SENT CONVERSATIONS
    ===================================================== */

    try {

        const sentQuery =
            query(
                collection(
                    db,
                    "conversations"
                ),

                where(
                    "initiatorId",
                    "==",
                    currentUser.uid
                )
            );


        const sentSnapshot =
            await getDocs(sentQuery);


        sentSnapshot.forEach(item => {

            conversationMap.set(
                item.id,
                {
                    id: item.id,
                    ...item.data()
                }
            );

        });


    } catch (error) {

        console.error(
            "Inbox sent query failed:",
            error
        );


        setStatus(
            "Inbox permission error while loading sent conversations.",
            true
        );


        return;
    }


    /* =====================================================
       RECEIVED CONVERSATIONS
    ===================================================== */

    try {

        const receivedQuery =
            query(
                collection(
                    db,
                    "conversations"
                ),

                where(
                    "receiverId",
                    "==",
                    currentUser.uid
                )
            );


        const receivedSnapshot =
            await getDocs(
                receivedQuery
            );


        receivedSnapshot.forEach(item => {

            conversationMap.set(
                item.id,
                {
                    id: item.id,
                    ...item.data()
                }
            );

        });


    } catch (error) {

        console.error(
            "Inbox received query failed:",
            error
        );


        setStatus(
            "Inbox permission error while loading received conversations.",
            true
        );


        return;
    }


    /* =====================================================
       VALIDATE CONVERSATIONS
    ===================================================== */

    const conversations =
        Array.from(
            conversationMap.values()
        )
        .filter(
            isValidConversation
        );


    /* =====================================================
       EMPTY
    ===================================================== */

    if (
        conversations.length === 0
    ) {

        setStatus(
            "No conversations yet."
        );


        renderEmpty();

        return;
    }


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    const prepared =
        await Promise.all(

            conversations.map(
                async conversation => {

                    const latestMessage =
                        await getLatestMessage(
                            conversation.id
                        );


                    return {
                        conversation,
                        latestMessage
                    };
                }
            )
        );


    /* =====================================================
       SORT BY LATEST MESSAGE
    ===================================================== */

    prepared.sort((a, b) => {

        const aTime =
            a.latestMessage?.createdAt?.seconds ||
            0;


        const bTime =
            b.latestMessage?.createdAt?.seconds ||
            0;


        return bTime - aTime;
    });


    /* =====================================================
       CREATE ROWS
    ===================================================== */

    const rows =
        await Promise.all(

            prepared.map(item =>
                createConversationRow(
                    item.conversation,
                    item.latestMessage
                )
            )
        );


    if (listEl) {
        listEl.innerHTML = "";
    }


    rows
        .filter(Boolean)
        .forEach(row => {

            listEl.appendChild(row);

        });


    const visibleCount =
        rows.filter(Boolean).length;


    setStatus(

        visibleCount === 1

            ? "1 conversation"

            : `${visibleCount} conversations`

    );
}


/* =========================================================
   OPTIONAL PRESENCE
========================================================= */

function setupPresence() {

    try {

        presenceDb =
            getDatabase();


        if (!currentUser) {
            return;
        }


        const userPresenceRef =
            ref(
                presenceDb,
                "status/" +
                currentUser.uid
            );


        presenceListener =
            onValue(
                userPresenceRef,
                () => {},
                error => {

                    console.warn(
                        "Presence unavailable:",
                        error
                    );

                }
            );


    } catch (error) {

        console.warn(
            "Presence setup skipped:",
            error
        );
    }
}


/* =========================================================
   AUTHENTICATION
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        /* ================================================
           NOT LOGGED IN
        ================================================ */

        if (!user) {

            currentUser = null;


            setStatus(
                "Please log in to view your Inbox.",
                true
            );


            if (listEl) {

                listEl.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            🔐
                        </div>

                        <h3>
                            Please log in
                        </h3>

                        <p>
                            You need an account to
                            use Inbox.
                        </p>

                        <br>

                        <a
                            href="login.html"
                            style="
                                color:#ff8fc3;
                                text-decoration:none;
                                font-weight:600;
                            "
                        >
                            Log in
                        </a>

                    </div>

                `;
            }


            return;
        }


        /* ================================================
           ANONYMOUS USER
        ================================================ */

        if (user.isAnonymous) {

            currentUser = null;


            setStatus(
                "Inbox is available to registered members.",
                true
            );


            if (listEl) {

                listEl.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            💗
                        </div>

                        <h3>
                            Registered members only
                        </h3>

                        <p>
                            Create an account or
                            log in to use Inbox.
                        </p>

                        <br>

                        <a
                            href="login.html"
                            style="
                                color:#ff8fc3;
                                text-decoration:none;
                                font-weight:600;
                            "
                        >
                            Log in
                        </a>

                    </div>

                `;
            }


            return;
        }


        /* ================================================
           REGISTERED USER
        ================================================ */

        currentUser = user;


        setupPresence();


        await loadInbox();

    }
);
</script>
