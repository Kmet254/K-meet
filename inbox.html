<head>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}


/* =========================================================
   BODY
========================================================= */

body {

    font-family: "Poppins", sans-serif;

    color: #ffffff;

        linear-gradient(
            135deg,
            rgba(18, 4, 17, 0.96),

    background-position: center;

    background-attachment: fixed;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navbar {

    width: 100%;

    padding: 15px 6%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:

    z-index: 100;
}


.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    color: white;

    text-decoration: none;

    font-family:

        serif;

}


.logo img {

.nav-links {

.nav-links a {

.nav-links a:hover {

/* =========================================================

   INBOX CARD

   CONVERSATION
========================================================= */

.conversation-row {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 15px;

    padding:
        15px 20px;

    transition:

.conversation-row:last-child {

}


.conversation-row:hover {

/* =========================================================
   AVATAR

    border:
        2px solid

/* =========================================================

.conversation-name {

}


.conversation-preview {

.conversation-time {

/* =========================================================

        70px;

.empty-icon {

    border:
        1px solid

    font-size: 30px;
}


.empty-state h3 {

.empty-state p {

/* =========================================================

<!-- =======================================================
     FIREBASE INBOX SCRIPT
======================================================= -->

<script type="module">
import {
    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    collection
} from "./firebase-config.js";

import {
    query,
    where,
    orderBy,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

/* =====================================================
   ELEMENTS AND STATE
===================================================== */

const statusEl = document.getElementById("status");
const listEl = document.getElementById("conversationList");

let currentUser = null;
let authVersion = 0;
let renderVersion = 0;
let queryReady = 0;
let conversationMap = new Map();
let latestMessages = new Map();
let messageErrors = new Set();
let messageListeners = new Map();
let inboxListeners = [];
let profileCache = new Map();
let inboxStarted = false;

const EMPTY_PHOTO = "kmeet-logo.jfif.jfif";

/* =====================================================
   BADGE STYLES
===================================================== */

const badgeStyles = document.createElement("style");

badgeStyles.textContent = `
.conversation-row.has-unread {
    background: rgba(255, 92, 154, 0.055);
}
.conversation-row.has-unread .conversation-name {
    color: #ffb0d0;
}
.conversation-row.has-unread .conversation-preview {
    color: #fff0f6;
    font-weight: 500;
}
.inbox-row-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    align-self: stretch;
    gap: 9px;
    flex-shrink: 0;
    min-width: 35px;
}
.unread-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 23px;
    height: 23px;
    padding: 0 7px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff72ad, #d82e76);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 0 3px 12px rgba(255, 92, 154, .30);
}
.unread-badge[hidden] {
    display: none;
}
.conversation-row {
    cursor: pointer;
}
`;

document.head.appendChild(badgeStyles);

/* =====================================================
   STATUS
===================================================== */

function setStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.classList.toggle("error", isError);
}

/* =====================================================
   SAFE HTML
===================================================== */

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =====================================================
   TIMESTAMP HELPERS
===================================================== */

function timestampMillis(value) {
    if (!value) return 0;

    if (typeof value.toMillis === "function") {
        return value.toMillis();
    }

    if (typeof value.toDate === "function") {
        return value.toDate().getTime();
    }

    if (typeof value.seconds === "number") {
        return value.seconds * 1000;
    }

    if (value instanceof Date) {
        return value.getTime();
    }

    if (typeof value === "string") {
        const parsed = Date.parse(value);
        return Number.isNaN(parsed) ? 0 : parsed;
    }

    return 0;
}

function formatTime(timestamp) {
    const milliseconds = timestampMillis(timestamp);

    if (!milliseconds) return "";

    const date = new Date(milliseconds);
    const now = new Date();

    const sameDay =
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate();

    if (sameDay) {
        return date.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
        });
    }

    return date.toLocaleDateString([], {
        day: "numeric",
        month: "short"
    });
}

/* =====================================================
   PARTICIPANTS
===================================================== */

function isValidConversation(conversation) {
    if (!conversation || !currentUser) return false;

    const initiator = conversation.initiatorId;
    const receiver = conversation.receiverId;

    if (
        typeof initiator !== "string" ||
        typeof receiver !== "string" ||
        !initiator ||
        !receiver ||
        initiator === receiver
    ) {
        return false;
    }

    return (
        initiator === currentUser.uid ||
        receiver === currentUser.uid
    );
}

function getOtherUserId(conversation) {
    if (!isValidConversation(conversation)) return null;

    return conversation.initiatorId === currentUser.uid
        ? conversation.receiverId
        : conversation.initiatorId;
}

/* =====================================================
   PROFILE CACHE
===================================================== */

async function getUserProfile(uid) {
    if (!uid) return null;

    if (profileCache.has(uid)) {
        return profileCache.get(uid);
    }

    const request = (async () => {
        try {
            const snapshot = await getDoc(doc(db, "users", uid));

            if (!snapshot.exists()) {
                return {
                    uid,
                    displayName: "Kmeet member",
                    photoURL: EMPTY_PHOTO
                };
            }

            return {
                uid,
                ...snapshot.data()
            };
        } catch (error) {
            console.warn("Could not load inbox profile:", uid, error);

            return {
                uid,
                displayName: "Kmeet member",
                photoURL: EMPTY_PHOTO
            };
        }
    })();

    profileCache.set(uid, request);

    return request;
}

/* =====================================================
   UNREAD MESSAGE COUNT
===================================================== */

/*
 A message is unread when:
 1. It was sent by another participant.
 2. Its createdAt timestamp is later than this member's
    lastReadAt_UID timestamp.

 If no read timestamp exists, incoming messages with
 valid timestamps are counted as unread.
*/

function getUnreadCount(conversation, items) {
    if (!currentUser) return 0;

    const readField = `lastReadAt_${currentUser.uid}`;
    const lastReadMillis = timestampMillis(conversation[readField]);

    return items.filter(message => {
        if (!message) return false;

        if (message.senderId === currentUser.uid) {
            return false;
        }

        const sentAt = timestampMillis(message.createdAt);

        // Without a valid timestamp, we cannot reliably
        // decide whether this message is newer than last read.
        if (!sentAt) return false;

        return sentAt > lastReadMillis;
    }).length;
}

/* =====================================================
   LATEST MESSAGE
===================================================== */

function getLatestMessage(items) {
    if (!items || !items.length) return null;

    return [...items].sort((a, b) => {
        return timestampMillis(b.createdAt) -
               timestampMillis(a.createdAt);
    })[0] || null;
}

/* =====================================================
   EMPTY STATES
===================================================== */

function renderEmpty(title, description, icon = "💌") {
    listEl.innerHTML = `
        <div class="empty-state">
            <div class="empty-icon">${icon}</div>
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(description)}</p>
        </div>
    `;
}

function renderLoginRequired() {
    listEl.innerHTML = `
        <div class="empty-state">
            <div class="empty-icon">🔐</div>
            <h3>Please log in</h3>
            <p>You need a registered Kmeet account to use your Inbox.</p>
            <a href="login.html" class="login-link">Log in</a>
        </div>
    `;
}

function renderRegisteredOnly() {
    listEl.innerHTML = `
        <div class="empty-state">
            <div class="empty-icon">💗</div>
            <h3>Registered members only</h3>
            <p>You can explore Discover as a guest, but you need a registered account to use Inbox.</p>
            <a href="login.html" class="login-link">Log in</a>
        </div>
    `;
}

/* =====================================================
   BUILD A CONVERSATION ROW
===================================================== */

async function createConversationRow(conversation, items, version) {
    const otherUid = getOtherUserId(conversation);

    if (!otherUid) return null;

    const profile = await getUserProfile(otherUid);

    // Ignore an outdated asynchronous render.
    if (version !== renderVersion || !currentUser) return null;

    const displayName =
        profile?.displayName ||
        profile?.name ||
        profile?.username ||
        "Kmeet member";

    const photo =
        profile?.photoURL ||
        profile?.photoUrl ||
        profile?.profilePhoto ||
        profile?.photo ||
        profile?.avatar ||
        profile?.profileImage ||
        EMPTY_PHOTO;

    const latest = getLatestMessage(items);
    const unreadCount = getUnreadCount(conversation, items);

    let preview = "No messages yet.";

    if (latest) {
        const messageText = latest.text || latest.message || "Message";

        preview = latest.senderId === currentUser.uid
            ? `You: ${messageText}`
            : messageText;
    }

    const time = latest
        ? formatTime(latest.createdAt)
        : formatTime(conversation.updatedAt || conversation.createdAt);

    const row = document.createElement("a");

    row.className = "conversation-row";
    row.href = `chat.html?userId=${encodeURIComponent(otherUid)}`;

    if (unreadCount > 0) {
        row.classList.add("has-unread");
    }

    const avatar = document.createElement("img");
    avatar.className = "conversation-avatar";
    avatar.src = photo;
    avatar.alt = displayName;
    avatar.loading = "lazy";

    avatar.addEventListener("error", () => {
        avatar.onerror = null;
        avatar.src = EMPTY_PHOTO;
    });

    const info = document.createElement("div");
    info.className = "conversation-info";

    const name = document.createElement("div");
    name.className = "conversation-name";
    name.textContent = displayName;

    const messagePreview = document.createElement("div");
    messagePreview.className = "conversation-preview";
    messagePreview.textContent = preview;

    info.append(name, messagePreview);

    const right = document.createElement("div");
    right.className = "inbox-row-right";

    const timeEl = document.createElement("div");
    timeEl.className = "conversation-time";
    timeEl.textContent = time;

    const badge = document.createElement("span");
    badge.className = "unread-badge";
    badge.textContent = unreadCount > 9 ? "9+" : String(unreadCount);
    badge.hidden = unreadCount === 0;
    badge.setAttribute(
        "aria-label",
        `${unreadCount} unread message${unreadCount === 1 ? "" : "s"}`
    );

    right.append(timeEl, badge);
    row.append(avatar, info, right);

    return {
        row,
        latestTime: timestampMillis(latest?.createdAt) ||
                    timestampMillis(conversation.updatedAt) ||
                    timestampMillis(conversation.createdAt),
        unreadCount
    };
}

/* =====================================================
   RENDER INBOX
===================================================== */

async function renderInbox() {
    if (!currentUser) return;

    const version = ++renderVersion;

    const conversations = Array.from(conversationMap.values())
        .filter(isValidConversation);

    if (!conversations.length) {
        listEl.innerHTML = "";

        renderEmpty(
            "No conversations yet",
            "Start a conversation from Discover and it will appear here."
        );

        setStatus("No conversations yet.");
        return;
    }

    const prepared = await Promise.all(
        conversations.map(async conversation => {
            const items = latestMessages.get(conversation.id) || [];

            return createConversationRow(conversation, items, version);
        })
    );

    if (version !== renderVersion || !currentUser) return;

    const rows = prepared
        .filter(Boolean)
        .sort((a, b) => b.latestTime - a.latestTime);

    listEl.innerHTML = "";

    let totalUnread = 0;

    rows.forEach(item => {
        totalUnread += item.unreadCount;
        listEl.appendChild(item.row);
    });

    const conversationCount = rows.length;

    let status =
        `${conversationCount} conversation${conversationCount === 1 ? "" : "s"}`;

    if (totalUnread > 0) {
        status += ` • ${totalUnread} unread message${totalUnread === 1 ? "" : "s"}`;
    }

    if (messageErrors.size > 0) {
        status += " • Some message counts could not be checked";
        setStatus(status, true);
    } else {
        setStatus(status);
    }
}

/* =====================================================
   MESSAGE LISTENERS
===================================================== */

function stopMessageListener(conversationId) {
    const unsubscribe = messageListeners.get(conversationId);

    if (unsubscribe) {
        unsubscribe();
        messageListeners.delete(conversationId);
    }

    latestMessages.delete(conversationId);
    messageErrors.delete(conversationId);
}

function startMessageListener(conversation) {
    const conversationId = conversation.id;

    if (messageListeners.has(conversationId)) return;

    const messagesRef = collection(
        db,
        "conversations",
        conversationId,
        "messages"
    );

    const messagesQuery = query(
        messagesRef,
        orderBy("createdAt", "asc")
    );

    const unsubscribe = onSnapshot(
        messagesQuery,
        snapshot => {
            if (!currentUser) return;

            latestMessages.set(
                conversationId,
                snapshot.docs.map(item => ({
                    id: item.id,
                    ...item.data()
                }))
            );

            messageErrors.delete(conversationId);
            renderInbox();
        },
        error => {
            console.error(
                "Inbox message listener failed:",
                conversationId,
                error
            );

            messageErrors.add(conversationId);
            latestMessages.set(
                conversationId,
                latestMessages.get(conversationId) || []
            );

            renderInbox();
        }
    );

    messageListeners.set(conversationId, unsubscribe);
}

/* =====================================================
   RECONCILE ACTIVE CONVERSATIONS
===================================================== */

function reconcileMessageListeners() {
    const validIds = new Set(
        Array.from(conversationMap.values())
            .filter(isValidConversation)
            .map(conversation => conversation.id)
    );

    for (const id of messageListeners.keys()) {
        if (!validIds.has(id)) {
            stopMessageListener(id);
        }
    }

    for (const conversation of conversationMap.values()) {
        if (isValidConversation(conversation)) {
            startMessageListener(conversation);
        }
    }
}

/* =====================================================
   REAL-TIME CONVERSATION QUERIES
===================================================== */

function stopInboxListeners() {
    inboxListeners.forEach(unsubscribe => {
        try {
            unsubscribe();
        } catch (error) {
            console.warn("Could not stop inbox listener:", error);
        }
    });

    inboxListeners = [];

    for (const id of Array.from(messageListeners.keys())) {
        stopMessageListener(id);
    }

    conversationMap.clear();
    latestMessages.clear();
    messageErrors.clear();

    queryReady = 0;
    inboxStarted = false;
}

function handleConversationSnapshot(snapshot) {
    if (!currentUser) return;

    snapshot.docs.forEach(item => {
        conversationMap.set(item.id, {
            id: item.id,
            ...item.data()
        });
    });

    /*
     * Both queries may return the same conversation. The second
     * query also refreshes existing records with current data.
     */
    reconcileMessageListeners();
    renderInbox();
}

function startInbox() {
    if (!currentUser || inboxStarted) return;

    inboxStarted = true;
    queryReady = 0;
    conversationMap.clear();

    setStatus("Loading your conversations...");

    renderEmpty(
        "Loading conversations",
        "Please wait while we load your messages."
    );

    const sentQuery = query(
        collection(db, "conversations"),
        where("initiatorId", "==", currentUser.uid)
    );

    const receivedQuery = query(
        collection(db, "conversations"),
        where("receiverId", "==", currentUser.uid)
    );

    function attach(queryRef, label) {
        const unsubscribe = onSnapshot(
            queryRef,
            snapshot => {
                if (!currentUser) return;

                queryReady++;

                snapshot.docs.forEach(item => {
                    conversationMap.set(item.id, {
                        id: item.id,
                        ...item.data()
                    });
                });

                /*
                 * Reconcile and render on every snapshot.
                 * The map deduplicates conversations found by both
                 * participant queries.
                 */
                reconcileMessageListeners();
                renderInbox();
            },
            error => {
                console.error(
                    `Inbox ${label} listener failed:`,
                    error
                );

                setStatus(
                    `Unable to load ${label} conversations. Check Firestore permissions.`,
                    true
                );

                renderEmpty(
                    "Inbox could not load",
                    "Kmeet could not read your conversations. Please check your Firestore rules and try again.",
                    "⚠️"
                );
            }
        );

        inboxListeners.push(unsubscribe);
    }

    attach(sentQuery, "started");
    attach(receivedQuery, "received");
}

/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(auth, async user => {
    authVersion++;
    const thisAuthVersion = authVersion;

    stopInboxListeners();
    currentUser = null;
    renderVersion++;

    if (!user) {
        setStatus("Please log in to view your Inbox.", true);
        renderLoginRequired();
        return;
    }

    if (user.isAnonymous) {
        setStatus("Inbox is available to registered members.", true);
        renderRegisteredOnly();
        return;
    }

    currentUser = user;
    profileCache.clear();

    if (thisAuthVersion !== authVersion) return;

    startInbox();
});
