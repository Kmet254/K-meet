<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}


/* =========================================================
   BODY
========================================================= */

body {

    color: #ffffff;

}

}


.logo {

    color: white;

        serif;

    font-size: 25px;

}


.logo img {

    width: 42px;

.nav-links {

.nav-links a {

.nav-links a:hover {

}

.page-header p {

    color: #d9b7c8;

    font-size: 13px;
}


.status.error {

    color: #ff91b8;
}


/* =========================================================
   INBOX CARD
========================================================= */

.inbox-card {

    width: 100%;

    overflow: hidden;

    background:
        rgba(31, 9, 28, 0.76);

    border:
        1px solid
        rgba(255, 143, 195, 0.18);

    border-radius: 24px;

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.42);

    backdrop-filter: blur(18px);
}


#conversationList {

    width: 100%;
}


/* =========================================================
   CONVERSATION
========================================================= */

.conversation-row {

    width: 100%;

    min-height: 92px;

    display: flex;

    align-items: center;

    gap: 15px;

    padding:
        15px 20px;

    color: white;

    text-decoration: none;

    border-bottom:
        1px solid
        rgba(255,255,255,0.07);

    transition:
        background 0.25s ease,
        transform 0.2s ease;
}


.conversation-row:last-child {

    border-bottom: none;
}


.conversation-row:hover {

    background:
        rgba(255,143,195,0.08);

    transform:
        translateX(2px);
}


/* =========================================================
   AVATAR
========================================================= */

.conversation-avatar {

    width: 62px;

    height: 62px;

    min-width: 62px;

    border-radius: 50%;

    object-fit: cover;

    background: #241020;

    border:
        2px solid
        rgba(255,143,195,0.55);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.28);
}


/* =========================================================
   CONVERSATION INFORMATION
========================================================= */

.conversation-info {

    flex: 1;

    min-width: 0;
}


.conversation-name {

    font-size: 16px;

    font-weight: 600;

    color: white;

    margin-bottom: 5px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.conversation-preview {

    font-size: 13px;

    color: #c7a7b7;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.conversation-time {

    flex-shrink: 0;

    align-self: flex-start;

    margin-top: 5px;

    font-size: 11px;

    color: #9e7f8e;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {

    text-align: center;

    padding:
        65px 25px
        70px;
}


.empty-icon {

    width: 72px;

    height: 72px;

    align-items: center;

    justify-content: center;

    background:
        rgba(255,143,195,0.09);

    border:
        1px solid
        rgba(255,143,195,0.18);

}


.empty-state h3 {

    margin:

    font-family:

        serif;

    font-size: 24px;
}


.empty-state p {

    max-width: 470px;

    margin: 0 auto;

    color: #c7a7b7;

    font-size: 13px;

    line-height: 1.7;
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-link {

    display: inline-block;

    margin-top: 20px;

    padding:
        11px 25px;

    border-radius: 999px;

    background:
        linear-gradient(
            135deg,

            #d83d80

    color: white;

    text-decoration: none;

/* =========================================================
   FOOTER
========================================================= */

.footer {

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    .conversation-avatar {

    }


    .conversation-name {

/* =========================================================

    }

        height: 50px;

        min-width: 50px;
    }

}

<!-- =======================================================
     FIREBASE INBOX SCRIPT
======================================================= -->

<script type="module">

import {

    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc,
    collection

} from "./firebase-config.js";


import {

    query,
    where,
    getDocs

} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const statusEl =
    document.getElementById(
        "status"
    );


const listEl =
    document.getElementById(
        "conversationList"
    );


/* =========================================================
   CURRENT USER
========================================================= */

let currentUser = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    message,
    isError = false
) {

    if (!statusEl) {
        return;
    }

    statusEl.textContent =
        message;

    statusEl.classList.toggle(
        "error",
        isError
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );
}


/* =========================================================
   FIND OTHER USER
========================================================= */

function getOtherUserId(
    conversation
) {

    if (
        !conversation ||
        !currentUser
    ) {
        return null;
    }


    if (
        conversation.initiatorId ===
        currentUser.uid
    ) {

        return (
            conversation.receiverId ||
            null
        );
    }


    if (
        conversation.receiverId ===
        currentUser.uid
    ) {

        return (
            conversation.initiatorId ||
            null
        );
    }


    return null;
}


/* =========================================================
   VALID CONVERSATION
========================================================= */

function isValidConversation(
    conversation
) {

    if (
        !conversation ||
        !currentUser
    ) {
        return false;
    }


    const initiator =
        conversation.initiatorId;


    const receiver =
        conversation.receiverId;


    if (
        typeof initiator !== "string" ||
        typeof receiver !== "string"
    ) {

        return false;
    }


    if (
        !initiator ||
        !receiver
    ) {

        return false;
    }


    /*
     * Reject corrupted conversations
     * where both users are the same.
     */

    if (
        initiator === receiver
    ) {

        return false;
    }


    return (
        initiator === currentUser.uid ||
        receiver === currentUser.uid
    );
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    timestamp
) {

    if (!timestamp) {
        return "";
    }


    let date = null;


    if (
        typeof timestamp.toDate ===
        "function"
    ) {

        date =
            timestamp.toDate();

    }

    else if (
        timestamp instanceof Date
    ) {

        date =
            timestamp;
    }

    else if (
        typeof timestamp.seconds ===
        "number"
    ) {

        date =
            new Date(
                timestamp.seconds *
                1000
            );
    }


    if (
        !date ||
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    const now =
        new Date();


    const sameDay =

        date.getFullYear() ===
            now.getFullYear() &&

        date.getMonth() ===
            now.getMonth() &&

        date.getDate() ===
            now.getDate();


    if (sameDay) {

        return date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );
    }


    return date.toLocaleDateString(
        [],
        {
            day: "numeric",
            month: "short"
        }
    );
}


/* =========================================================
   GET USER PROFILE
========================================================= */

async function getUserProfile(
    uid
) {

    if (!uid) {
        return null;
    }


    try {

        const snapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    uid
                )
            );


        if (!snapshot.exists()) {

            return {

                uid,

                displayName:
                    "Kmeet member",

                photoURL:
                    ""

            };
        }


        return {

            uid,

            ...snapshot.data()

        };


    }

    catch (error) {

        console.warn(
            "Could not load profile:",
            error
        );


        return {

            uid,

            displayName:
                "Kmeet member",

            photoURL:
                ""

        };
    }
}


/* =========================================================
   GET LATEST MESSAGE
========================================================= */

async function getLatestMessage(
    conversationId
) {

    try {

        const messagesRef =
            collection(
                db,
                "conversations",
                conversationId,
                "messages"
            );


        const snapshot =
            await getDocs(
                messagesRef
            );


        if (
            snapshot.empty
        ) {

            return null;
        }


        const messages =
            snapshot.docs.map(
                item => ({

                    id:
                        item.id,

                    ...item.data()

                })
            );


        messages.sort(
            (a, b) => {

                const aSeconds =
                    a.createdAt
                        ?.seconds || 0;


                const bSeconds =
                    b.createdAt
                        ?.seconds || 0;


                return (
                    bSeconds -
                    aSeconds
                );
            }
        );


        return (
            messages[0] ||
            null
        );


    }

    catch (error) {

        console.warn(
            "Could not load messages:",
            conversationId,
            error
        );


        return null;
    }
}


/* =========================================================
   EMPTY INBOX
========================================================= */

function renderEmpty() {

    if (!listEl) {
        return;
    }


    listEl.innerHTML = `

        <div class="empty-state">

            <div class="empty-icon">
                💌

/* =========================================================

function renderLoginRequired() {

            </a>

        </div>

    `;
}


/* =========================================================
   CREATE CONVERSATION ROW
========================================================= */

async function createConversationRow(
    conversation,
    latestMessage
) {

    const otherUid =
        getOtherUserId(
            conversation
        );


    if (!otherUid) {
        return null;
    }


    const profile =
        await getUserProfile(
            otherUid
        );


    const displayName =
        profile?.displayName ||
        profile?.name ||
        profile?.username ||
        "Kmeet member";


    const photo =
        profile?.photoURL ||
        profile?.profilePhoto ||
        profile?.photo ||
        "kmeet-logo.jfif.jfif";


    let preview =
        "No messages yet.";


    if (latestMessage) {

        const messageText =
            latestMessage.text ||
            latestMessage.message ||
            "Message";


        if (
            latestMessage.senderId ===
            currentUser.uid
        ) {

            preview =
                "You: " +
                messageText;

        }

        else {

            preview =
                messageText;
        }
    }


    const time =
        latestMessage
            ? formatTime(
                latestMessage.createdAt
            )
            : "";


    const href =
        "chat.html?userId=" +
        encodeURIComponent(
            otherUid
        );


    const row =
        document.createElement(
            "a"
        );


    row.className =
        "conversation-row";


    row.href =
        href;


    row.innerHTML = `

        <img
            class="conversation-avatar"
            src="${escapeHtml(photo)}"
            alt="${escapeHtml(displayName)}"
            loading="lazy"
        >

        <div class="conversation-info">

            <div class="conversation-name">
                ${escapeHtml(displayName)}
            </div>

            <div class="conversation-preview">
                ${escapeHtml(preview)}
            </div>

        </div>

        <div class="conversation-time">
            ${escapeHtml(time)}
        </div>

    `;


    const image =
        row.querySelector(
            ".conversation-avatar"
        );


    if (image) {

        image.addEventListener(
            "error",
            () => {

                image.onerror =
                    null;

                image.src =
                    "kmeet-logo.jfif.jfif";

            }
        );
    }


    return row;
}


/* =========================================================
   LOAD INBOX
========================================================= */

async function loadInbox() {

    if (!currentUser) {
        return;
    }


    setStatus(
        "Loading your conversations..."
    );


    if (listEl) {

        listEl.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    💌
                </div>

                <h3>
                    Loading conversations
                </h3>

                <p>
                    Please wait...
                </p>

            </div>

        `;
    }


    const conversationMap =
        new Map();


    /* =====================================================
       CONVERSATIONS STARTED BY CURRENT USER
    ===================================================== */

    try {

        const sentQuery =
            query(

                collection(
                    db,
                    "conversations"
                ),

                where(
                    "initiatorId",
                    "==",
                    currentUser.uid
                )

            );


        const sentSnapshot =
            await getDocs(
                sentQuery
            );


        sentSnapshot.forEach(
            item => {

                conversationMap.set(

                    item.id,

                    {

                        id:
                            item.id,

                        ...item.data()

                    }

                );

            }
        );

    }

    catch (error) {

        console.error(
            "Sent conversation query failed:",
            error
        );


        setStatus(
            "Unable to load your conversations.",
            true
        );


        return;
    }


    /* =====================================================
       CONVERSATIONS RECEIVED BY CURRENT USER
    ===================================================== */

    try {

        const receivedQuery =
            query(

                collection(
                    db,
                    "conversations"
                ),

                where(
                    "receiverId",
                    "==",
                    currentUser.uid
                )

            );


        const receivedSnapshot =
            await getDocs(
                receivedQuery
            );


        receivedSnapshot.forEach(
            item => {

                conversationMap.set(

                    item.id,

                    {

                        id:
                            item.id,

                        ...item.data()

                    }

                );

            }
        );

    }

    catch (error) {

        console.error(
            "Received conversation query failed:",
            error
        );


        setStatus(
            "Unable to load received conversations.",
            true
        );


        return;
    }


    /* =====================================================
       FILTER VALID CONVERSATIONS
    ===================================================== */

    const conversations =
        Array.from(
            conversationMap.values()
        )
        .filter(
            isValidConversation
        );


    /* =====================================================
       NO CONVERSATIONS
    ===================================================== */

    if (
        conversations.length === 0
    ) {

        setStatus(
            "No conversations yet."
        );


        renderEmpty();

        return;
    }


    /* =====================================================
       LOAD LATEST MESSAGE FOR EACH
    ===================================================== */

    const prepared =
        await Promise.all(

            conversations.map(
                async conversation => {

                    const latestMessage =
                        await getLatestMessage(
                            conversation.id
                        );


                    return {

                        conversation,

                        latestMessage

                    };

                }
            )
        );


    /* =====================================================
       SORT NEWEST FIRST
    ===================================================== */

    prepared.sort(
        (a, b) => {

            const aTime =
                a.latestMessage
                    ?.createdAt
                    ?.seconds || 0;


            const bTime =
                b.latestMessage
                    ?.createdAt
                    ?.seconds || 0;


            return (
                bTime -
                aTime
            );
        }
    );


    /* =====================================================
       CREATE ROWS
    ===================================================== */

    const rows =
        await Promise.all(

            prepared.map(
                item =>

                    createConversationRow(

                        item.conversation,

                        item.latestMessage

                    )
            )
        );


    if (listEl) {

        listEl.innerHTML = "";
    }


    rows
        .filter(Boolean)
        .forEach(
            row => {

                if (
                    listEl &&
                    row
                ) {

                    listEl.appendChild(
                        row
                    );
                }

            }
        );


    const count =
        rows.filter(Boolean).length;


    setStatus(

        count === 1

            ? "1 conversation"

            : `${count} conversations`

    );
}


/* =========================================================
   FIREBASE AUTH
========================================================= */

onAuthStateChanged(

    auth,

    async user => {


        /* ================================================
           LOGGED OUT
        ================================================ */

        if (!user) {

            currentUser =
                null;


            setStatus(
                "Please log in to view your Inbox.",
                true
            );


            renderLoginRequired();


            return;
        }


        /* ================================================
           ANONYMOUS USER
        ================================================ */

        if (
            user.isAnonymous
        ) {

            currentUser =
                null;


            setStatus(
                "Inbox is available to registered members.",
                true
            );


            renderRegisteredOnly();


            return;
        }


        /* ================================================
           REGISTERED USER
        ================================================ */

        currentUser =
            user;


        await loadInbox();

    }

);

</script>
